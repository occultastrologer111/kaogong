:110,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）如果饮料类排在第1 排，则以下哪项是可能的？","options":["粮油类排在调料类前一排","零食类排在文具类前一排","日用品类排在文具类前一排","酒类排在文具类前一排"],"answer":"B","explanation":"第一步，确定题型。题干具有匹配特征，确定为分析推理。第二步，分析条件，进行推理。本题条件为“饮料类排在第1 排”，利用代入法解题。代入A 项：粮油类排在调料类前一排。结合本题条件和条件（3）“粮油类在零食类之后，中间隔着2 排”，可得排序：零食+X+X+粮油+调料；结合条件（2）“文具类和调料类中间隔着3 排”，可知，文具类不能在调料类前面；本题条件指出“饮料在第1 位”，再结合条件（2）“文具类和调料类中间隔着3 排”，可知，文具类也不能在调料类后面，故该项不可能，排除；代入B 项：零食类排在文具类前一排。根据条件（4）“日用品类紧挨着文具类前一排或者后一排”，可得排序：零食类+文具类+日用品类；再结合条件（3）“粮油类在零食类之后，中间隔着2 排”，可知排序：零食类+文具类+日用品类+粮油类；结合条件（1）酒类排在调料类之前、（2）文具类和调料类中间隔着3 排，可知排序：零食类+文具类+日用品类 +粮油类+酒类+调料；综上，存在排序：饮料+零食类+文具类+日用品类+粮油类+酒类+调料，故该项可能。代入C 项：日用品类排在文具类前一排。结合条件（2）“文具类和调料类中间隔着3 排”，可得排序：日用品+文具+X+X+X+调料类；根据本题条件，可知排序：饮料+日用品+文具+X+X+X+调料类；根据条件（1）酒类排在调料类之前，此时，无法满足条件（3）“粮油类在零食类之后，中间隔着2 排”，故该项不可能；代入D 项：酒类排在文具类前一排。根据条件（4）“日用品类紧挨着文具类前一排或者后一排”，可得排序：酒类+文具类+日用品类；结合条件（2）“文具类和调料类中间隔着3 排”，可得排序：酒类+文具类+日用品类+X+X+调料类；根据本题条件，可得排序：饮料+酒类+文具类+日用品类+X+X+调料类，此时，无法满足条件（3）“粮油类在零食类之后，中间隔着2 排”，故该项不可能。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-111","paperId":"gk2022-xz","num":111,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）表中所列食品类别中，2021 年第一季度所有抽检样本全部合格的有几类？","options":["2","3","4","5"],"answer":"B","explanation":"第一步，本题考查简单比较中的读数比较。第二步，定位表格材料“抽检量”与“合格量”的数据。第三步，2021 年第一季度抽检样本全部合格，指的是抽检量=合格量，符合条件的有可可及焙烤咖啡产品（抽检量251，合格量251）、特殊医学用途配方食品（抽检量88，合格量88）、食品添加剂（抽检量112、合格量 112），共3 个。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-112","paperId":"gk2022-xz","num":112,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2021 年第一季度市场监管部门食品安全监督抽检的总体不合格率在以下哪个范围内？","options":["不到1%","1%—2％之间","2％—3％之间","3％以上"],"answer":"C","explanation":"第一步，本题考查现期比值计算。第二步，定位表格材料最后一行“合计”数据。第三步，不合格率= ，代入数据得，数据较大，分母从左向右截取前三位，分子舍相同，得。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-113","paperId":"gk2022-xz","num":113,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2021 年第一季度市场监管部门食品安全监督抽检量最多的3 个食品类别，同期抽检不合格量约是其余所有类别抽检不合格量的多少倍？","options":["0.5","0.8","1.3","1.9"],"answer":"D","explanation":"第一步，本题考查现期倍数计算。第二步，定位表格材料。第三步，2021 年第一季度市场监管部门食品安全监督抽检量最多的三个食品类别是食用农产品（169040）、餐饮食品（37795）、粮食加工品（23131）。根据抽检不合格量=抽检量-合格量，食用农产品、餐饮食品、粮食加工品同期抽检不合格总量是（169040-164905）+（37795-35986）+（23131-22751），数据较大，将最大数据从左向右截取前三位，其余舍相同，得（169-165）+（38-36）+（23-23）=6，约是其余所有类别抽检不合格量的倍，与D 选项最接近。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-114","paperId":"gk2022-xz","num":114,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）将①肉制品、②乳制品和③蛋制品按2021 年第一季度市场监管部门食品安全监督抽检合格率从高到低排列，以下正确的是：","options":["③②①","②③①","①②③","①③②"],"answer":"B","explanation":"第一步，本题考查现期比重比较。第二步，定位表格材料。第三步，根据合格率= ，比较类问题，截三位处理数据，可得①肉制品、②乳制品和③蛋制品的抽检合格率分别约为，直除首三位商分别983、998 和991，则从高到低排列为②③①。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-115","paperId":"gk2022-xz","num":115,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）关于2021 年第一季度市场监管部门食品安全监督情况，以下信息能够从上述资料中推出的有几项？ ①蔬菜、水果制品的总体抽检合格率高于95% ②样品抽检量超过1 万批次的食品类别有12 个 ③糕点类食品的抽检合格量是不合格量的50 倍以上","options":["0 项","1 项","2 项","3 项 2020 年12 月，全国“12369 环保举报联网管理平台”共接到环保举报31156 件，环比下降23.2%，同比下降10.3%。其中，受理量23792 件，较11 月减少6316 件；因举报线索不详或不属于生态环境部门职责范围而未受理7364 件，较11 月减少3119 件。"],"answer":"A","explanation":"第一步，本题考查综合分析问题，且需选出说法正确的一项。第二步，①，现期比值计算。定位表格材料，“蔬菜制品抽检量9241、合格量8598；水果制品抽检量5744、合格量5611”，根据抽检合格率= ，数据截取前三位，代入公式得，分母从左向右截取前3 位，，不到95%，错误。 ②，读数比较。定位表格材料，样品抽检量超过1 万批次的食品类别有粮食加工品（23131）、食用油、油脂及其制品（13879）、调味品（18862）、酒类（19091）、炒货食品及坚果制品（10678）、糕点（14517）、餐饮食品（37795）、食用农产品（169040）、肉制品（18104）、饮料（10515）、速冻食品（11620），合计 11 个，错误。 ③，现期倍数计算。定位表格材料，糕点抽检量14517、合格量14214，则糕点类食品的抽检合格量是不合格量的倍，分母四舍五入截取前三位，分子舍相同，得，错误。综上，正确的有0 个。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-116","paperId":"gk2022-xz","num":116,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2020 年1 月，全国“12369 环保举报联网管理平台”接到环保举报件数比上个月：","options":["下降了不到30%","下降了30%以上","上升了不到30%","上升了30%以上"],"answer":"B","explanation":"第一步，本题考查减少率计算。第二步，定位文字材料，“2020 年12 月，全国‘12369 环保举报联网管理平合’共接到环保举报31156 件，环比下降23.2%，同比下降10.3%”和图形材料。第三步，根据基期量= ，可得2019 年12 月环保举报件数为 = ≈34734（件），根据增长率= ，分母从左向右截取前三位，分子舍相同，代入数据得 = ≈-44%，即下降了30%以上。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-117","paperId":"gk2022-xz","num":117,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2020 年1—4 月，通过微信举报的件数占当月环保举报件数比重最高的月份是：","options":["1 月","2 月","3 月","4 月"],"answer":"B","explanation":"第一步，本题考查比重比较。第二步，定位表格材料和图形材料。第三步，环保举报件数=未受理量＋受理量，根据比重= ，分母从左向右截取前三位，分子舍相同处理，代入数据得2020 年1—4 月占比分别约为：，，，，直除首位分别商4、6、5、5，比重最大的是2 月。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-118","paperId":"gk2022-xz","num":118,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2020 年下半年，环保举报的受理率超过75%的月份有几个？","options":["3","4","5","6"],"answer":"C","explanation":"第一步，本题考查比重比较。第二步，定位柱状图。第三步，，要求受理率＞75%，即，化简得，受理量＞3×非受理量，分析7—12 月数据，可知7 月，30932＞3×9361；8 月，24787＞3×7617；9 月， 27959＞3×8455；10 月，23995＞3×7381；11 月，30108＜3×10483；12 月，23792＞3×7364，满足的有 7 月、8 月、9 月、10 月和12 月，共5 个月。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-119","paperId":"gk2022-xz","num":119,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）如同一个月内各类举报的受理率彼此相同，则2020 年12 月通过电话的环保举报被受理的件数在以下哪个范围内？","options":["低于7501 件","7501—8500 件之间","8501—9500 件之间","高于9500 件"],"answer":"C","explanation":"第一步，本题考查现期比重计算中的求部分量。第二步，定位表格材料，可得2020 年12 月通过电话的环保举报数量为11970 件；定位柱状图，可得2020 年 12 月环保举报受理量为23792 件、未受理量为7364 件。第三步，根据比重= ，选项范围类，分母从左向右截取前三位并保留量级不变，可得2020 年12 月的受理率约为。根据部分量=整体量×比重，可得通过电话的环保举报被受理的件数约为11970×76%≈12000× =9000 件，属于C 选项范围内。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-120","paperId":"gk2022-xz","num":120,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）以下折线图反映了2020 年第二季度各月哪类环保举报件数环比增量的变化趋势？","options":["电话举报","微信举报","网上举报","其他渠道举报"],"answer":"D","explanation":"第一步，本题考查增长量做差比较。第二步，定位表格材料，2020 年3 月、4 月、5 月及6 月数据。第三步，根据增长量=现期量-基期量。代入排除，A 选项电话举报和B 选项微信举报第二季度各月环比增量中， 4 月和5 月的环比增量均为正数，6 月为负数，不符合折线图的上升趋势，排除A、B 选项。C 选项网上举报，4 月：27-25=2，5 月：26-27=-1，6 月：27-26=1，观察折线图，末尾6 月的增量应该是最大的，不符合，排除 C 选项。至此，可直接选择D 选项。D 选项其他渠道举报，4 月：35-24=11，5 月：41-35=6，6 月：89- 41=48，满足折线图。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-121","paperId":"gk2022-xz","num":121,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2019 年，中国IC 先进封装市场规模约为多少亿元？","options":["296","279","252","235"],"answer":"A","explanation":"第一步，本题考查现期比重计算中的求部分量。第二步，定位图形材料，2019 年IC 封装市场规模为2349.7 亿元，IC 先进封装市场规模占比为12.58%。第三步，根据部分量=整体量×比重，代入数据可得2019 年，中国IC 先进封装市场规模为 2349.7×12.58%≈2350× ≈294（亿元），A 选项最接近。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-122","paperId":"gk2022-xz","num":122,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）“十三五”（2016—2020）年期间，中国IC 封装市场总规模：","options":["不到1.0 万亿元","在1.0—1.1 万亿元之间","在1.1—1.2 万亿元之间","超过1.2 万亿元"],"answer":"B","explanation":"第一步，本题考查简单计算中的和差类。第二步，定位图形材料，2016—2020 年中国IC 封装市场总规模分别为 1564.3、1889.7、2193.9、2349.7、2478.9 亿元。第三步，和差类问题，对数据进行截位舍相同处理，代入数据得2016—2020 年中国IC 封装市场总规模约为 156＋189＋219＋235＋248=200×5＋（－44－11＋19＋35＋48）=1000+47=1047，即10470 亿元=1.047 万亿元，在B 选项范围内。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-123","paperId":"gk2022-xz","num":123,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2012—2020 年，中国IC 封装市场中IC 先进封装市场规模占比同比提升1 个百分点以上的年份有几个？","options":["2","3","4","5"],"answer":"A","explanation":"第一步，本题考查简单比较中的读数比较。第二步，定位图形材料中的折线图。第三步，直接读数可得2012—2020 年，中国IC 封装市场中IC 先进封装市场规模占比同比提升1 个百分点以上的有2012 年（5.65%－4.12%＞1%）和2015 年（9.91%－7.37%＞1%），共2 个年份，其余年份均不符合。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-124","paperId":"gk2022-xz","num":124,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2012—2020 年，中国IC 封装市场规模同比增量最大的年份是：","options":["2019 年","2018 年","2017 年","2016 年"],"answer":"C","explanation":"第一步，本题考查增长量做差比较。第二步，定位图形材料。第三步，根据增长量=现期量-基期量，本题是柱状图形式，要增长量最大，则柱状图高度差最大。观察可知， 2017 年和2018 年的高度差最大，对两年进行做差比较，截三位，2017 年增长量：189-156=33，2018 年增长量：219-189=30，因此，同比增长量最大的是2017 年。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-125","paperId":"gk2022-xz","num":125,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）已知2020 年中国IC 封装市场规模同比增长x 亿元，IC 封装市场中IC 先进封装市场规模占比同比增长y 个百分点，而2020 年往后中国IC 封装市场规模及IC 先进封装市场规模占比每年都分别同比增长x 亿元和y 个百分点，则到“十四五”最后一年（2025 年），中国IC 先进封装市场规模将达到多少亿元?","options":["469","575","433","521 2021 年1—5 月，全国共破获电信网络诈骗案件11.4 万起，打掉犯罪团伙1.4 万个，抓获犯罪嫌疑人 15.4 万名，同比分别上升60.4%、80.6%和146.5%。2021 年5 月，全国共立电信网络诈骗案件8.46 万起，与4 月相比下降14.3%。 2021 年1—5 月，全国拦截诈骗电话6.1 亿次，拦截诈骗短信9.1 亿条，封堵诈骗网址82.1 万个。 1—5 月公安部日均下发预警指令5.2 万条。 2021 年1—5 月，全国共成功劝阻771 万名群众免于受骗，紧急止付涉案资金2654 亿元，为群众挽回经济损失991 亿元。 2021 年1—5 月，全国公安机关捣毁境内诈骗窝点6500 余个，共破获被骗百万元以上案件881 起，同比上升160.5%；先后组织20 余次集中收网行动，抓获犯罪嫌疑人2421 名，打掉技术开发平台，网络引流推广、虚拟货币洗钱等团伙380 余个。 2020 年10 月至2021 年5 月，全国公安机关会同检察、法院、通讯、金融等部门，共打掉“两卡”违法犯罪团伙1.5 万个，缴获涉诈电话卡373.3 万张、银行卡56.6 万张，惩戒“两卡”失信人员17.3 万名，整治违规行业网点、机构1.8 万家。"],"answer":"D","explanation":"第一步，本题考查现期量计算。第二步，定位图形材料。第三步，根据增长量=现期量-基期量，由柱状图可知，2020 年中国IC 封装市场规模同比增长x 亿元， x=2478.9-2349.7≈2479-2350=129。由折线图可知，2020 年IC 封装市场中的IC 先进封装市场规模占比同比增长y 个百分点，y=13.26-12.58=0.68。第四步，根据末期量=初期量+年均增长量×相差年数以及题干“2020 年往后中国IC 封装市场规模及IC 先进封装市场规模占比每年都分别增长x 亿元和y 个百分点”，则“十四五”最后一年，2025 年中国IC 封装市场规模 ≈2479+129×5=2479+645=3124 亿元，2025 年IC 先进封装市场规模占比 =13.26%+0.68%×5=13.26%+3.4%=16.66%。根据部分量=整体量×比重，2025 年IC 先进封装市场规模 =3124×16.66%≈3124× ≈520（亿元），最接近D 选项。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-126","paperId":"gk2022-xz","num":126,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2020 年1—5 月，全国平均每月打掉电信网络诈骗犯罪团伙：","options":["不到1000 个","1000—2000 个之间","2000—4000 个之间","4000 个以上"],"answer":"B","explanation":"第一步，本题考查基期平均数计算。第二步，定位文字材料第一段，“2021 年1—5 月，全国共破获电信网络诈骗案件11.4 万起，打掉犯罪团伙1.4 万个，抓获犯罪嫌疑人15.4 万名，同比分别上升60.4%、80.6%和146.5%”。第三步，根据基期量= ，平均数= ，选项为范围，将分母从左向右截取前三位计算，代入可得2020 年1—5 月，全国平均每月打掉电信网络诈骗犯罪团伙约个，在B 选项范围内。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-127","paperId":"gk2022-xz","num":127,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2021 年4—5 月，全国共立电信网络诈骗案件约多少万起？","options":["12","14","16","18"],"answer":"D","explanation":"第一步，本题考查基期量计算。第二步，定位文字材料第一段最后一句，“2021 年5 月，全国共立电信网络诈骗案件8.46 万起，与4 月相比下降14.3%”。第三步，根据基期量= ，选项首位相同第二位不同，将分母从左向右截取前三位计算，代入可得 2021 年4 月全国共立电信网络诈骗案件万起。则2021 年4—5 月，全国共立电信网络诈骗案件约9.9+8.46=18.36 万起，与D 选项最为接近。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-128","paperId":"gk2022-xz","num":128,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2021 年1—5 月，全国平均每天拦截诈骗短信约多少万条？","options":["545","571","603","659"],"answer":"C","explanation":"第一步，本题考查现期平均数计算中的单平均数。第二步，定位文字材料第二段，“2021 年1—5 月......拦截诈骗短信9.1 亿条”。第三步，根据平均数= ，2021 年1—5 月共有31＋28＋31＋30＋31＝151 天，则2021 年1—5 月全国平均每天拦截诈骗短信万条。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-129","paperId":"gk2022-xz","num":129,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）2021 年1—5 月，全国紧急止付涉案资金金额约是为群众挽回经济损失金额的多少倍？","options":["2.7","2.4","2.1","1.8"],"answer":"A","explanation":"第一步，本题考查现期倍数计算。第二步，定位文字材料第三段，“2021 年1—5 月，全国……紧急止付涉案资金2654 亿元，为群众挽回经济损失991 亿元”。第三步，根据倍数公式，选项首位相同第二位不同，将分母从左向右截取前三位处理数据，代入数据可得，直除首两位商26，与A 选项最接近。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-130","paperId":"gk2022-xz","num":130,"year":2022,"region":"国家","module":"资料分析","sub":"综合资料","stem":"（单选题）以下信息中，能够从上述资料中推出的有几项？ ①2020 年1—5 月，全国抓获电信网络诈骗犯罪嫌疑人10 万名以上 ②2021 年1—5 月，全国公安机关破获被骗百万元以上案件比去年同期多500 件以上 ③2020 年10 月—2021 年5 月，每打掉1 个“两卡”违法犯罪团伙，平均缴获的电话卡和银行卡总量就在300 张以上","options":["0 项","1 项","2 项","3 项"],"answer":"B","explanation":"第一步，本题考查综合分析，且需选出正确的个数。第二步，①，基期量计算。定位文字材料第一段，“2021 年1—5 月，全国……抓获犯罪嫌疑人15.4 万名，同比分别上升……146.5%”，根据基期量= ，可得2020 年1—5 月，全国抓获犯罪嫌疑人约为＜10 万名，不可推出。 ②，增长量计算。定位文字材料第四段，“2021 年1—5 月，全国……共破获被骗百万元以上案件881 起，同比上升160.5%”，根据增长量计算n+1 原则，及160.5%≈ （16%≈ ），可得2021 年1—5 月，全国公安机关共破获被骗百万元以上案件约比去年同期多 ≈528（起）＞500（起），可推出。 ③，现期平均数计算。定位文字材料最后一段，“2020 年10 月至2021 年5 月，全国……共打掉’两卡‘违法犯罪团伙1.5 万个，缴获诈骗电话卡373.3 万张、银行卡56.6 万张“，根据平均数= ，可得所求平均数约为 ≈287（张）＜300，不可推出。综上，可推出的有1 项。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"jx2020-001","paperId":"jx2020","num":1,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"习近平总书记2020 年1 月8 日在“不忘初心、牢记使命”主题教育总结大会上的讲话中引用了一句古语“君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之。”下列选项最能体现这一古语精髓的是：","options":["敢于自我革命，勇于开拓创新","敢于坚持真理，勇于担当作为","敢于直面问题，勇于修正错误","敢于坚持原则，勇于承担责任"],"answer":"C","explanation":"正确答案：C，全站正确率：80%，易错项：A。解析第一步，本题考查时政。第二步，2020 年1 月8 日，在“不忘初心、牢记使命”主题教育总结大会上的讲话，习近平总书记提到，不忘初心、牢记使命，必须以正视问题的勇气和刀刃向内的自觉不断推进党的自我革命。“君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之。”敢于直面问题、勇于修正错误，是我们党的显著特点和优势。与C 项表述一致。因此，选择C 选项。拓展 “君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之”出自《论语》。大意是：“君子的过错，如同日食月食：他犯了过错，所有人都看得见；他改正了错误，所有人都仰望着他。”","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-002","paperId":"jx2020","num":2,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"“一带一路”倡议自提出以来，已逐步成为当今世界广泛参与的重要国际合作平台，下列有关2019 年“一带一路”发展成果的说法正确的是：","options":["中欧班列全年开列8200 多列，“一带一路”在欧洲稳步前行","2019 年4 月，第二届“一带一路”国际合作高峰论坛在杭州举行","中国人民银行和联合国开发计划署共同撰写研究报告，提出了“一带一路”投融资规划框架","第六届丝绸之路国际电影节于2019 年10 月在泉州举办，推动“一带一路”国家间的文化交流"],"answer":"A","explanation":"正确答案：A，全站正确率：18%，易错项：B。解析第一步，本题考查时政。第二步，2019 年11 月6 日，《融合投融资规则促进“一带一路”可持续发展——“一带一路”经济发展报告（2019）》正式对外发布。该报告由中国国家开发银行和联合国开发计划署共同撰写，提出了“一带一路”投融资规划框架。中欧班列2019 年全年开列8200 多列。它不仅是联通欧亚大陆经贸往来的桥梁，更是国与国之间友谊的纽带。中欧班列作为国际陆路运输的新型组织方式，随着\"一带一路\"倡议的不断推进而壮大，将成为\"一带一路\"倡议扎实落地的典范。A 项正确。因此，选择A 选项。拓展 B 项：第二届“一带一路”国际合作高峰论坛于2019 年4 月25 日至27 日在北京举行。习近平主席出席第二届 “一带一路”国际合作高峰论坛并发表开幕式演讲。37 个国家元首或政府首脑出席第二届“一带一路”国际合作高峰论坛。B 项错误。 C 项：2019 年11 月6 日，《融合投融资规则促进“一带一路”可持续发展——“一带一路”经济发展报告（2019）》正式对外发布。该报告由中国国家开发银行和联合国开发计划署共同撰写，提出了“一带一路”投融资规划框架。 C 项错误。 D 项：第六届丝绸之路国际电影节于2019 年10 月15 日至20 日在福州举行。本届电影节以“光影熠福，丝路扬帆”为主题，共征集到俄罗斯、印度、伊朗等国家共500 多部参评影片，涵盖“一带一路”沿线50 个国家和地区，从25 部入围影片中评选出“金丝路”传媒荣誉年度故事片、动画片、纪录片和年度最受关注男女主角等奖项。D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-003","paperId":"jx2020","num":3,"year":2020,"region":"江西","module":"常识判断","sub":"经济","stem":"习近平总书记2020 年3 月6 日在决战决胜脱贫攻坚座谈会上强调，这次会议的主要任务是，分析当前形势，克服新冠肺炎疫情影响，凝心聚力，打赢脱贫攻坚战，做到“两个确保”。下列属于“两个确保”内容的是： ①如期完成脱贫攻坚目标任务②实现经济社会高质量发展 ③打赢疫情防控阻击战④全面建成小康社会","options":["①②","①③","②④","①④"],"answer":"D","explanation":"正确答案：D，全站正确率：30%，易错项：B。解析第一步，本题考查时政。第二步，中共中央总书记、国家主席、中央军委主席习近平2020 年3 月6 日在京出席决战决胜脱贫攻坚座谈会并发表重要讲话。他强调，这次决战决胜脱贫攻坚座谈会是党的十八大以来脱贫攻坚方面最大规模的会议。会议的主要任务是，分析当前形势，动员全党全国全社会力量，凝心聚力打赢脱贫攻坚战，确保如期完成脱贫攻坚目标任务，确保全面建成小康社会。与D 项表述一致。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-004","paperId":"jx2020","num":4,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"近年来，我国面临的农业安全复杂性不断增加。下列关于农业安全的说法不正确的是:","options":["为确保我国粮食安全，多部门制定了《沙漠蝗及国内蝗虫监测防控预案》，要求各地严防境外沙漠蝗入侵危害，继续做好国内蝗虫防治工作","生物安全三级实验室需要从事某种高致病性动物病原微生物实验活动的，需要报省级以上畜牧兽医主管部门批准","根据现行规定，举报为防控非洲猪瘟作出特别重大贡献的，可一次性给予举报人10 万元奖励","2020 年是我国第三次全国农作物种质资源普查与收集行动的收官之年"],"answer":"C","explanation":"正确答案：C，全站正确率：48%，易错项：D。解析第一步，本题考查法律并选错误项。第二步，农业农村部印发《非洲猪瘟疫情有奖举报暂行办法》（以下简称《暂行办法》）。《暂行办法》称，社会公众举报非洲猪瘟疫情以及违反非洲猪瘟相关防控规定情形的线索，由农业农村部受理经查证属实并符合奖励原则的，农业农村部给予举报人每次3000—10000 元（税前）不等的奖励。举报为防控非洲猪瘟作出特别重大贡献的，可一次性给予举报人高于前款规定标准并不超过30000 元（税前）的奖励。因此C 项错误。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 - 因此，选择C 选项。拓展 A 项：为贯彻落实党中央、国务院决策部署，牢固树立防范化解重大风险意识，按照“御蝗于境外、备战于境内” 的策略，坚持“两手抓”，既严防境外沙漠蝗入侵，又继续做好国内蝗虫防治，努力夺取小康之年粮食和农业丰收，农业农村部、海关总署、国家林草局制定了《沙漠蝗及国内蝗虫监测防控预案》，其中：关于国外沙漠蝗监测防控。按照“御蝗于境外、备战于境内”的防范策略，加强云南、西藏、新疆等可能迁入区虫情监测、及时预警，按照迁入风险，设定50 万亩应急防治任务。配套组建专业防治队伍，储备应急防控物资，一旦迁飞入境，立即启动应急防治。农业农村、海关和林草部门依据各自职责范围分别做好农区、森林草原和口岸监测工作以及入境检疫。 B 项：《关于加强动物病原微生物实验室生物安全管理工作的通知》中规定，生物安全三级、四级实验室需要从事某种高致病性动物病原微生物或者疑似高致病性动物病原微生物实验活动的，应当按照《条例》《高致病性动物病原微生物实验室生物安全管理审批办法》《农业部关于进一步规范高致病性动物病原微生物实验活动审批工作的通知》等规定，报省级以上畜牧兽医主管部门批准。严格实验活动生物安全承诺制度和实验活动情况报告制度。因此，B 项正确。 D 项：农业农村部办公厅关于印发《2020 年推进现代种业发展工作要点》的通知中规定，2020 年是全面建成小康社会目标实现之年，是全面打赢脱贫攻坚战收官之年。其中推进现代种业发展工作重点要做好六方面工作，持续开展第三次全国农作物种质资源普查与收集行动属于第一方面的内容：加强种质资源保护，夯实种业发展基础。因此2020 年是收官之年。 2020 年5 月“第三次全国农作物种质资源普查与收集行动”2019 年工作会议在石家庄召开。该行动自2015 年实施以来，已开展12 省（区、市）830 个县的全面普查和175 个县的系统调查，抢救性收集各类作物种质资源4.2 万份，有效丰富了我国种质资源战略储备。会议正式启动北京、天津、河北、安徽、西藏、新疆等6 省（区、市）种质资源普查与收集行动。会议指出，各地相关部门要清醒认识种质资源工作面临的形势和任务，加快种质资源收集保存进程，强化优异资源的鉴定发掘与利用，组建高素质人才队伍，建立高效种质资源管理体系。要进一步提高对种质资源保护与利用工作重要性的认识，加强组织领导与统筹协调，规范项目经费使用管理，强化种质资源精准鉴定与深度发掘，完善种质资源交流与共享体系，加强宣传引导，推进种质资源保护与利用工作再上新台阶。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-005","paperId":"jx2020","num":5,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"下列有关公共卫生的说法正确的是：","options":["突发公共卫生事件应急响应分为Ⅰ级，Ⅱ级，Ⅲ级三个等级","按照我国现行标准，甲类传染病有鼠疫、霍乱、传染性非典型肺炎三种","省，自治区，直辖市人民政府卫生行政主管部门有权向社会发布本行政区域内突发事件的信息","医疗卫生机构发现可能发生传染病暴发、流行的，应当在2 小时内向所在地县级人民政府卫生行政主管部门报告"],"answer":"D","explanation":"正确答案：D，全站正确率：20%，易错项：A。解析第一步，本题考查公共卫生。第二步，《突发公共卫生事件应急条例》规定，医疗机构发现发生或者可能发生传染病暴发流行时，应当在2 小时内向所在地县级人民政府卫生行政主管部门报告。与D 项表述一致。因此，选择D 选项。拓展 A 项：根据《中华人民共和国突发事件应对法》和《国家突发公共事件总体应急预案》，将突发事件分为自然灾害、事故灾难、公共卫生事件和社会安全事件四类。按照事件的性质、严重程度、可控性和影响范围等因素，将突发事件等级分为一级（特别重大）、二级（重大）、三级（较大）和四级（一般）四个级别。选项A 表述为三个等级，与法条内容不符。A 项错误。 B 项：《中华人民共和国传染病防治法》规定管理的传染病分甲类、乙类、丙类三类，共39 种。甲类传染病是指：鼠疫、霍乱。这两种病是强制管理的传染病，要求在发现之后，如果是城镇，两小时之内通过监测信息系统进行上报。如果是农村，不超过六小时。选项B 中表述为鼠疫、霍乱、传染性非典型肺炎三种，与法条内容不符。 B 项错误。 C 项：《突发公共卫生事件应急条例》第25 条规定，国家建立突发事件的信息发布制度。国务院卫生行政主管部门负责向社会发布突发事件的信息。必要时，可以授权省、自治区、直辖市人民政府卫生行政主管部门向社会发布本行政区域内突发事件的信息。选项C 中表述为省，自治区，直辖市人民政府卫生行政主管部门有权向社会发布本行政区域内突发事件的信息，与法条内容不符。C 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-006","paperId":"jx2020","num":6,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"为提升生态文明、建设美丽中国，党和政府做了一系列重要工作。下列有关生态文明建设的说法不正确的是：","options":["自2020 年1 月起，黄河流域的自然保护区将全面禁止生产性捕捞","2019 年8 月第一届国家公园论坛在青海省举行，与会代表形成了8 条“西宁共识”","2019 年，第二轮中央生态环保督察启动，拟用三年时间完成例行督查，再用一年时间开展回头看","2019 年11 月，住建部发布了新修订《生活垃圾分类标志》标准，将生活垃圾类别调整为可回收物、有害垃圾、厨余垃圾和其他垃圾4 个大类和11 个小类"],"answer":"A","explanation":"正确答案：A，全站正确率：29%，易错项：C。解析第一步，本题考查时政并选错误项。第二步，根据农业农村部发布的《关于长江流域重点水域禁捕范围和时间的通告》，长江上游珍稀特有鱼类国家级自然保护区等332 个自然保护区和水产种质资源保护区，自2020 年1 月1 日0 时起，全面禁止生产性捕捞。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - 而不是黄河流域，A 项错误。因此，选择A 选项。拓展 B 项：2019 年8 月19 日至20 日，由国家林业和草原局、青海省人民政府共同举办的第一届国家公园论坛在青海省西宁市成功举行。与会代表通过交流、讨论，形成8 条“西宁共识”。B 项正确。 C 项：2019 年生态环境保护督察专题培训班在京举办，生态环境部部长李干杰出席培训班并讲话。李干杰透露，今年要全面启动第二轮例行督察。从2019 年起，用三年左右时间完成第二轮中央生态环境保护例行督察，再用一年时间开展“回头看”。 C 项正确。 D 项：住房和城乡建设部2019 年11 月15 日发布了《生活垃圾分类标志》标准。相比于2008 版标准，新标准的适用范围进一步扩大，生活垃圾类别调整为可回收物、有害垃圾、厨余垃圾和其他垃圾4 个大类和11 个小类，标志图形符号共删除4 个、新增4 个、沿用7 个、修改4 个。D 项正确。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-007","paperId":"jx2020","num":7,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于我国科技自主可控的说法错误的是：","options":["基础性技术创新关乎科技自主可控的根本","国产替代是我国近期和未来科技进步和工业发展的主要途径","当前我国科技发展的主要问题表现为“缺芯少魂”“缺芯少屏”","实现科技自主可控，要着力引进技术，引领关键核心领域科技崛起"],"answer":"D","explanation":"正确答案：D，全站正确率：27%，易错项：B。解析第一步，本题考查时政知识并选错误项。第二步，习近平总书记在2018 年中国科学院第十九次院士大会、中国工程院第十四次院士大会上指出，只有把关键核心技术掌握在自己手中，才能从根本上保障国家经济安全、国防安全和其他安全。中国特色自主创新道路是中国特色社会主义道路的重要组成部分，是关键核心技术突破的必由之路，也是我国科技创新实现从“跟跑” 到“领跑”跨越式发展的根本路径。所谓自主创新，是相对于模仿与引进而言的创造性活动，主要指对自主知识产权核心技术的拥有，尤其是对原始创新的突破。这里的“自主”强调的是，以自力更生为主导、不依赖外部力量的自觉实践。因此，实现科技自主可控，要着力解决自主创新问题。我国必须突破“引进-模仿”的被动循环状态与技术平台障碍，自觉探寻核心技术的研发方向与路径。而不是着力引进技术。D 项说法错误。因此，选择D 选项。拓展 A 项：世界科技强国的实践已证明，雄厚的基础研究根基是原始创新的源动力，是国家需求的重要战略支撑；没有基础研究的强基固本就没有重大的原创成果的产生，突破核心技术就是天方夜谭。基础研究薄弱一直以来都是制约我国科技创新能力的首要原因、关键短板。基础性技术创新关乎科技自主可控的根本。A 项说法正确。 B 项：国产化替代是指替代被垄断的外国产品。引进技术是最为高效的方式，但受限制较多。在无法引进技术时，国产替代成为最高效的科技进步方式。不少技术虽无法引进，其他国家有现成的产品和技术仍可以模仿和学习，市场前景也较为确定，因此难度低于自主创新。这也将是中国近期和未来科技进步和工业发展的主要途径。B 项说法正确。 C 项：目前我国科技发展缺少国产的芯片（即缺芯少魂），缺少国产的屏幕（即缺芯少屏）。“缺芯少屏”一直是我国半导体产业的痛点。目前，我国已经在面板领域打破了国外封锁。但是，在芯片领域至今没有获得真正突破。我国芯片企业都在全力攻坚，尽管还无法掌握5 纳米、7 纳米相关技术，但已基本掌握28 纳米相关技术。 CPU 芯片和操作系统是网信领域最基础的核心技术。中国在这方面还受制于人，常被比拟为“缺芯少魂”。C 项说法正确。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-008","paperId":"jx2020","num":8,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"囚徒困境是博弈论的非零和博弈的经典例子，表明个人的最佳选择并非团体的最佳选择。下列选项中不属于囚徒困境的是：","options":["广告战","关税战","军备竞赛","股市中的散户跟庄 - 2 -"],"answer":"D","explanation":"正确答案：D，全站正确率：42%，易错项：C。解析第一步，本题考查博弈论并选错误项。第二步，囚徒困境指的是两个共谋犯罪的人被关入监狱，不能互相沟通的情况。如果两个人都不揭发对方，则由于证据不确定，每个人都坐牢一年；若一人揭发，而另一人沉默，则揭发者因为立功而立即获释，沉默者因不合作而入狱十年；若互相揭发，则因证据确凿，二者都判刑八年。由于囚徒无法信任对方，因此倾向于互相揭发，而不是同守沉默。囚徒困境反映出个人最佳选择并非团体最佳选择，或者说在一个群体中，个人做出理性选择却往往导致集体的非理性。D 项股市中的“散户跟庄”是指散户跟随庄家吸筹、吸盘、拉升、出货的整个过程，是股票市场中高效操盘的一种手段，不属于囚徒困境。因此，选择D 选项。拓展 A 项：广告竞争中也会出现囚徒困境的例子。例如：两个公司互相竞争，导致两个公司的广告互相影响，即一公司的广告较被顾客接受则会夺取对方的部分收入。但若二者同时期发出质量类似的广告，收入增加很少但成本增加。但若不提高广告质量，生意又会被对方夺走。此时这两个公司可以有两个选择：1、互相达成协议，减少广告的开支（合作）；2、各自增加广告开支，设法提升广告的质量，压倒对方（背叛）。若两公司不信任对方，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 - 无法合作，背叛成为支配性策略时，两公司将陷入广告战，而广告成本的增加损害了两公司的收益，这就陷入了囚徒困境中。在现实中，要让互相竞争的公司达成合作协议是较为困难的，多数都会陷入囚徒困境中。A 项正确，不选。 B 项：两个国家，在关税上可以有两个选择：1、提高关税，以保护自己的商品（背叛）；2、与对方达成关税协定，降低关税以利于各自的商品流通（合作）。当一国因某些因素不遵守关税协定，独自提高关税（背叛），另一国也会作出同样反应（亦背叛），这就引发了关税战，两国的商品失去了对方的市场，对本身经济也造成损害（共同背叛的结果）。然后两国又重新达成关税协定（重复博弈的结果是发现共同合作利益最大）。B 项正确，不选。 C 项：在政治学中，两国之间的军备竞赛可以用囚徒困境来描述。两国都可以声称有两种选择：1、增加军备（背叛）；2、达成削减武器协议（合作）。两国都无法肯定对方会遵守协议，因此两国最终会倾向增加军备。似乎自相矛盾的是，虽然增加军备会是两国的“理性”行为，但结果却显得“非理性”（例如会对经济造成损坏等）。 C 项正确，不选。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-009","paperId":"jx2020","num":9,"year":2020,"region":"江西","module":"常识判断","sub":"人文历史","stem":"下列诗词所反映的历史时期按时间先后顺序排列正确的是： ①风云突变，军阀重开战，洒向人间都是怨，一枕黄粱再现 ②外侮需人御,将军赋采薇。师称机械化,勇夺虎罴威 ③宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑 ④山高路远沟深，大军纵横驰奔,谁敢横刀立马,唯我彭大将军","options":["①②③④","①②④③","①④②③","②③①④"],"answer":"C","explanation":"正确答案：C，全站正确率：21%，易错项：B。解析第一步，本题考查中国史。第二步，①反映的是1929 年4 月爆发的蒋桂战争；②反映的是1942 年戴安澜将军带领的作为中国远征军的先头部队赴缅参战的事件；③反映的是1949 年人民解放军占领南京的事件；④是1935 年毛主席得知彭大将军在战斗中歼敌一个团，提起手中的笔写完送给他的。因此顺序为①④②③。因此，选择C 选项。拓展 ①“风云突变，军阀重开战，洒向人间都是怨，一枕黄粱在现”出自毛泽东的《清平乐·蒋桂战争》，毛泽东这首词是在红军占领上杭之后，开展轰轰烈烈的革命运动时所写。 ②“外侮需人御,将军赋采薇。师称机械化,勇夺虎罴威”是毛主席给戴安澜将军的赋诗。1942 年，戴安澜将军率军作为中国远征军的先头部队赴缅参战。取得同古会战、收复棠吉等战功。 ③“宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑”出自毛泽东的《七律·人民解放军占领南京》。1949 年人民解放军占领南京，毛泽东听到这个消息后欢欣鼓舞，写下该诗。 ④“山高路远沟深，大军纵横驰奔,谁敢横刀立马,唯我彭大将军”出自毛泽东的《六言诗给彭德怀同志》。是他公开赞颂彭德怀的诗词。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-010","paperId":"jx2020","num":10,"year":2020,"region":"江西","module":"常识判断","sub":"经济","stem":"下列俗语与其蕴含的经济学道理对应错误的是：","options":["田忌赛马——成本与收益","知人知面不知心——信息不对称","十年树木，百年树人——长期投资","萝卜白菜，各有所爱——偏好理论"],"answer":"A","explanation":"正确答案：A，全站正确率：56%，易错项：B。解析第一步，本题考查俗语中的经济学并选错误项。第二步，田忌赛马出自《史记》卷六十五：《孙子吴起列传第五》，故事的主角是田忌、孙膑和齐威王，是中国历史上有名的揭示如何善用自己的长处去对付对手的短处，从而在竞技中获胜的事例。田忌赛马体现了经济学中的权衡取舍的原理，学会权衡取舍，才能作出适合的决策，获得最大收益。孙膑选择不同的赛马出战，最终赢得了比赛。而“成本与收益”与此不符。因此，选择A 选项。拓展 B 项：“知人知面不知心”指认识一个人容易，但要了解一个人的内心却很困难。与经济学中的信息不对称相对应。在了解一个人时很难全部了解，造成双方所拥有的信息不同，反映在经济上即为交易中的各人拥有的信息不同。故该项正确。 C 项：“十年树木，百年树人”，出自《管子·权修第三》。比喻要使小树成为木料需要很长的时间。而培养一个人才则需要更多的时间，是长久之计，且十分不易。长期投资是指不满足短期投资条件的投资，即不准备在一年或长于一年的经营周期之内转变为现金的投资。二者匹配，选项正确。 D 项：“萝卜白菜，各有所爱”指人各有志，比喻各有不同的喜好与兴趣。对应经济学中的偏好理论。个人偏好歧视理论把歧视看作是歧视者的一种偏好，指的是个体偏向于不跟某些特定种族或性别的成员打交道，认为歧视来源于个人，包括雇主、雇员和顾客。故相匹配，选项正确。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-011","paperId":"jx2020","num":11,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于法律基础知识的表述正确的是：","options":["司法机关在适用法律审理案件时，优先适用法律原则，再适用法律规则","法的渊源通常指法的形式意义上的渊源，即法律规范的创制方式和外部表现形式","法的公布与法的实施是两个不同的概念，但实践中法的公布日期即法的实施日期","当同一机关制定的法律出现效力冲突时，一般解决原则是新法优于旧法，一般法优于特别法"],"answer":"B","explanation":"正确答案：B，全站正确率：31%，易错项：D。解析第一步，本题考查法理学。第二步，法的渊源即法律的来源，是指国家机关、公民和社会组织为寻求行为的根据而获得具体法律的来源。法获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 的渊源分为实质意义上的渊源和形式意义上的渊源。实质意义上的渊源，即法的真实来源、根据和发源，是指法产生于一定生产方式下的物质生活条件。形式意义上的渊源，即指法律规范的创制方式和外部表现形式。法的渊源通常指法的形式意义上的渊源。B 项正确。因此，选择B 选项。拓展 A 项：法律规则是规定法律上的权利、义务、责任的准则、标准，或是赋予某种事实状态以法律意义的指示、规定，内容明确具体。法律原则是集中反映法的一定内容的法律活动的指导原理和准则，内容抽象概括。司法机关在适用法律审理案件时，优先适用法律规则，穷尽法律规则，方得适用法律原则。A 项错误。 C 项：法的公布是指立法机关将通过的法律以一定的形式公布于众。法的实施，是指法律生效，在社会生活中被人们实际施行。法的公布与法的实施是两个不同的概念，实践中有些法律自公布之日起生效，公布日期即实施日期。但是有些法律本身规定具体生效时间或者规定法律公布后一定期限开始生效，意味着公布日期并不是实施日期。C 项错误。 D 项：当同一机关制定的法律出现效力冲突时，一般解决原则是新法优于旧法，特别法优于一般法。D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-012","paperId":"jx2020","num":12,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"下列政府举措中，不能够直接促进城镇居民人均可支配收入增长的是：","options":["减税","发行政府债券","将学前教育纳入义务教育","提高退休职工养老金发放标准"],"answer":"B","explanation":"正确答案：B，全站正确率：63%，易错项：C。解析第一步，本题考查宏观经济并选错误项。第二步，城镇居民人均可支配收入是指反映居民家庭全部现金收入能用于安排家庭日常生活的那部分收入。它是家庭总收入扣除交纳的所得税、个人交纳的社会保障费以及调查户的记账补贴后的收入。政府债券是政府为筹集资金而向出资者出具并承诺在一定时期支付利息和偿还本金的债务凭证，是政府筹集资金、扩大公共开支的重要手段。而政府债券是需要居民去购买的，但是并不能够直接促进城镇居民人均可支配收入增长。故B 项当选。因此，选择B 选项。拓展 A 项：城镇居民人均可支配收入是指家庭总收入扣除交纳的所得税、个人交纳的社会保障费以及调查户的记账补贴后的收入。减税显然可以直接促进城镇居民人均可支配收入增长。A 项不符合题意，排除。 C 项：将学前教育纳入义务教育可以减少家庭支出，显然可以直接促进城镇居民人均可支配收入增长。C 项不符合题意，排除。 D 项：提高退休职工养老金发放标准，显然可以增加家庭总收入，故可以直接促进城镇居民人均可支配收入增长。 D 项不符合题意，排除。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-013","paperId":"jx2020","num":13,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"下列作家与其作品中所展现的地域对应错误的是：","options":["鲁迅——《阿Q 正传》——绍兴","沈从文——《边城》——湘西","汪曾祺——《受戒》——高邮","莫言——《红高粱》——东北"],"answer":"D","explanation":"正确答案：D，全站正确率：50%，易错项：C。解析第一步，本题考查文学常识并选错误项。第二步，《红高粱》是中国作家莫言的长篇小说，主要以抗日战争及20 世纪30、40 年代山东高密的民间生活为背景，塑造了一个在伦理道德边缘的红高粱世界，充满了既离经叛道又拥有无限生气的时代气息。《红高粱》所展现的地域是山东高密并非东北。因此，选择D 选项。拓展 A 项：《阿Q 正传》是鲁迅创作的中篇小说，描写了生活于浙江绍兴的流浪雇农阿Q，虽然干活尽心，但最终却一无所有，甚至连姓名都被人遗忘的悲惨故事。该小说批判了当时中国社会的封建，保守，庸俗，腐败等社会特点，有力地揭示了旧中国人民的生活场景和其处在水深火热之中的病态。A 项正确，不符合题意，排除。 B 项：《边城》是沈从文中篇小说的代表作，它以20 世纪30 年代川湘交界的边城小镇茶峒为背景，以兼具抒情诗和小品文的优美笔触，描绘了湘西地区特有的风土人情。B 项正确，不符合题意，排除。 C 项：《受戒》是汪曾祺创作的短篇小说，该小说以江苏高邮为背景，描写了小和尚明海与农家女小英子之间天真无邪的朦胧爱情，蕴含着对生活、对人生的热爱，洋溢着人性和人情的欢歌。C 项正确，不符合题意，排除。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-014","paperId":"jx2020","num":14,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"下列名言中出现最晚的一项是：","options":["笛卡尔：我思故我在","亚里士多德：人是天生的政治动物","亚当·斯密：人天生，并且永远，是自私的动物","阿基米德：给我一个支点，我就能撬起整个地球"],"answer":"C","explanation":"正确答案：C，全站正确率：46%，易错项：A。解析第一步，本题考查语言文字。第二步，亚当·斯密（1723 年6 月5 日—1790 年7 月17 日），英国经济学家、哲学家、作家，经济学的主要创立者。亚当·斯密是现代资本主义经济制度的创立者，强调自由市场、自由贸易以及劳动分工，被誉为“古典经济学之父”。综合四个选项比较，亚当·斯密的名言出现时间最晚。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 因此，选择C 选项。拓展 A 项：笛卡儿（1596 年3 月31—1650 年2 月11 日），法国哲学家、数学家、物理学家。他对现代数学的发展做出了重要的贡献，因将几何坐标体系公式化而被认为是解析几何之父。他还是西方现代哲学思想的奠基人，他的哲学思想深深影响了之后的几代欧洲人，创立了“欧陆理性主义”哲学。可知，笛卡儿的名言出现时间并非最晚。 A 项错误。 B 项：亚里士多德（公元前384 年—前322 年），古代先哲，古希腊人，世界古代史上伟大的哲学家、科学家和教育家之一，堪称希腊哲学的集大成者。他是柏拉图的学生，亚历山大的老师。可知，亚里士多德的名言出现时间并非最晚。B 项错误。 D 项：阿基米德（公元前287 年—公元前212 年），伟大的古希腊哲学家、百科式科学家、数学家、物理学家、力学家，静态力学和流体静力学的奠基人，并且享有“力学之父”的美称，阿基米德和高斯、牛顿并列为世界三大数学家。可知，阿基米德的名言出现时间并非最晚。D 项错误。解题技巧：本题如果从名言出处作品发表时间作为解题点，考生们或许会发现各选项对应时间不完全确切，解题难度较大，但如果从选项名人生活年代入手，很明显可以发现几位名人生活的年代相差甚远，因此可以轻易得出正确答案。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-015","paperId":"jx2020","num":15,"year":2020,"region":"江西","module":"常识判断","sub":"人文历史","stem":"下列影视剧情符合历史事实的是：","options":["清朝时称官员为大人，如刘大人、李大人等","宋朝官员大声宣读圣旨道“奉天承运皇帝诏曰”","武则天的父亲见到武则天时，称呼其为“媚娘”","唐贞观年间官员对话讲到唐太宗时，称“吾皇太宗”"],"answer":"A","explanation":"正确答案：A，全站正确率：56%，易错项：D。解析第一步，本题考查历史人文。第二步，大人这个词最早出现在《周易》中的见龙在田，利见大人，是指圣人或君子，也就是身居高位的当权者。如《史记》中孟子列传中有：王公大人初见其术，这里的大人就是指王公贵族。到清代时期，大家称官员为大人才成为一种很普遍的现象，上到宰相下到九品小吏，皆被称呼为大人。与A 项表述一致。因此，选择A 选项。拓展 B 项：奉天承运皇帝诏曰，断句应为“奉天承运皇帝/诏曰”或不断句，始于明太祖朱元璋。题干中时代为宋朝，与史实不符。B 项错误。 C 项：武则天为荆州都督武士彟次女。十四岁时进入后宫，为唐太宗才人，获赐号“武媚”。 “武媚”为皇帝赐号。（唐人张鹜，生活于武则天执政时期，写道：“唐永徽后天下唱“武媚娘”歌，后立武氏为皇后。”由此观之武媚娘并非专指武则天，况太宗有多位宠妃，可未尝给谁赐过名号，而武则天作为从未晋升的才人更不可能）。 C 项错误。 D 项：皇太宗为李世民的庙号，庙号是起源于商代，是君王驾崩后被供奉于宗庙中的名字。比如说“某某宗”“某某祖”都是庙号，因此贞观年间的官员不能这么称呼唐太宗。D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-016","paperId":"jx2020","num":16,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"下列关于我国城市的表述错误的是:","options":["北京市、上海市、天津市和重庆市是直辖市","昆山市、义乌市、江阴市和温岭市是县级市","东莞市、三沙市、中山市和嘉峪关市是地级市","成都市、西安市、杭州市和长沙市是副省级城市"],"answer":"D","explanation":"正确答案：D，全站正确率：29%，易错项：B。解析第一步，本题考查地理并选错误项。第二步，中国现有15 座副省级市：广州、武汉、哈尔滨、沈阳、成都、南京、西安、长春、济南、杭州、大连、青岛、深圳、厦门、宁波。成都，简称“蓉”，别称蓉城、锦城，是四川省省会、副省级市、特大城市、成渝地区双城经济圈核心城市，国务院批复确定的中国西部地区重要的中心城市，国家重要的高新技术产业基地、商贸物流中心和综合交通枢纽。西安，简称“镐”，古称长安、镐京，是陕西省省会、副省级市、特大城市、关中平原城市群核心城市，国务院批复确定的中国西部地区重要的中心城市，国家重要的科研、教育、工业基地。杭州，简称“杭”，古称临安、钱塘，是浙江省省会、副省级市、杭州都市圈核心城市，国务院批复确定的中国浙江省省会和全省经济、文化、科教中心、长江三角洲中心城市之一。长沙，别称星城，湖南省省会，国务院批复确定的中国长江中游地区重要的中心城市，不是副省级城市。因此，选择D 选项。拓展 A 项：直辖市，是中国行政区划之一，行政地位与省、自治区、特别行政区相同，是中华人民共和国省级行政区，是直接由中央人民政府所管辖的建制市。直辖市往往有较大的建成区、较多的居住人口，且在全国的政治、经济、科学、文化、交通等方面具有重要地位。我国现有北京市、天津市、上海市、重庆市4 个直辖市。A 项正确。 B 项：昆山，江苏省辖县级市，由苏州市代管，自秦代置娄县以来已有2200 多年。昆山是“百戏之祖”昆曲的发源地。义乌市，隶属于浙江省金华市，是县级市，古称“乌伤”，金华-义乌（浙中）和杭州（浙北）、宁波获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 - （浙东）、温州（浙南）并列浙江四大区域中心城市。江阴市，简称澄，古称暨阳，江苏省省辖县级市，由无锡市代管。温岭市是浙江省台州市所辖县级市，中国大陆新千年、新世纪第一缕曙光首照地，地处浙江东南沿海，长三角地区的南翼，三面临海，东濒东海，南连玉环，西邻乐清及乐清湾，北接台州市区，是一座滨海城市。B 项正确。 C 项：东莞，是广东省地级市、国务院批复确定的中国珠江三角洲东岸中心城市。三沙市，是海南省地级市，地处中国南海中南部，海南省南部。中山，古称“香山”，人杰地灵，名人辈出，是一代伟人孙中山先生的故乡。广东省地级市，珠江口西岸都市圈城市之一。嘉峪关，是甘肃省地级市，甘肃省政府批复确定的甘肃丝绸之路经济带甘肃段重要节点城市、甘肃省域次中心城市、国家重要的冶金和先进制造业基地。C 项正确。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-017","paperId":"jx2020","num":17,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"为治疗维生素缺乏导致的夜盲症、败血病、佝偻病和脚气病而需要补充相对应的食物依次是：","options":["谷类、深海鱼、胡萝卜、柑橘","柑橘、深海鱼、谷类、胡萝卜","深海鱼、胡萝卜、谷类、柑橘","胡萝卜、柑橘、深海鱼、谷类"],"answer":"D","explanation":"正确答案：D，全站正确率：58%，易错项：C。解析第一步，本题考查生物医学。第二步，夜盲症，维生素A 缺乏亦称蟾皮症，系因缺乏维生素A 引起的一种营养缺乏病。胡萝卜中含有大量的β -胡萝卜素，摄入人体消化器官后，可以转化成维生素A，是目前最安全补充维生素A 的产品。它可以维持眼睛和皮肤的健康，改善夜盲症、皮肤粗糙的状况，有助于身体免受自由基的伤害。败血症是一种感染性疾病，是指细菌侵入人体血液产生毒素，而引起的全身严重感染的一种疾病。临床特点为发热、寒战、皮疹、肝脾肿大，易出现休克，血白细胞及中性粒细胞增高，蛋白增高血培养可发现细菌。坏血病是一种营养性疾病及维生素C 缺乏症，临床特点为出血倾向和骨骼改变。由题干信息可知，都是考查维生素，因此我们理解为坏血病。大量的柑橘类水果称霸市场，它们酸甜可口，多汁美味，耐存放，而且维生素C 含量丰富。佝偻病是一类多种因素导致的钙磷代谢异常、骨化障碍而引起的以骨骼病变为主要特征的慢性疾病，发生于骨骼闭合之前的儿童生长发育期，其中以维生素D 缺乏性佝偻病最为常见，主要见于2 岁以下婴幼儿。从鲨鱼、鳕鱼等深海鱼的肝脏中提炼出来的脂肪，黄色，有腥味，主要含有维生素D，常用于防治佝偻病。脚气病是由于维生素B1 缺乏引起的，这个疾病一般会引起这种消化系统，神经系统，甚至心血管系统症状为主的一种全身性疾病，临床上称为维生素B1 缺乏病。谷类食物中富含维生素B 族,但含量更多的是维生素B1。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-018","paperId":"jx2020","num":18,"year":2020,"region":"江西","module":"常识判断","sub":"科技生活","stem":"下列哪一选项是蚊子用于获取“猎物”信息的主要器官：","options":["复眼","蚊翅","蚊足","触角"],"answer":"D","explanation":"正确答案：D，全站正确率：48%，易错项：A。解析第一步，本题考查生物医学。第二步，触角是昆虫重要的感觉器官，主要起嗅觉和触觉作用，有的还有听觉作用，可以帮助昆虫进行通讯联络、寻觅异性、寻找食物和选择产卵场所等活动。蚊子出于本能通过人或动物热度、呼出二氧化碳及汗液里含有的乳酸，可快速、安全、有效的侦测出“猎物”的位置。根据对蚊子触须上神经细胞的信号记录结果，并配合触须细胞在电子显微镜的图片资料合并研判，蚊子触须细胞中有90％的设计，都是为了侦测空中漂浮的化学物质。因此，人所排出的二氧化碳、体热和乳酸，对蚊子来说提供了寻找“猎物”的侦测线索。因此，选择D 选项。拓展 A 项：蚊子的复眼是一种由不定数量的小眼组成。主要在昆虫及甲壳类等节肢动物的身上出现，同样结构的器官亦有在双壳纲身上出现。复眼中的小眼面一般呈六角形。小眼面的数目、大小和形状在各种昆虫中变异很大，雄性介壳虫的复眼仅由圆形小眼组成。A 项错误。 B 项：蚊子拥有一对长而细的翅膀，相对于其尺寸而言，翅膀振动速度较快（振动频率约为800Hz），振幅小于任何其他昆虫。蚊子翅膀的拍动角约为40 度，不到蜜蜂的一半，蚊翅主要是用于飞行。B 项错误。 C 项：蚊足，蚊足细长，自前而后分别称前足、中足和后足。足上常有鳞片形成的黑白斑点和环纹，为重要分类特征。C 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-019","paperId":"jx2020","num":19,"year":2020,"region":"江西","module":"常识判断","sub":"科技生活","stem":"下列诗词没有描述生物应激性反应的是：","options":["明月别枝惊鹊，清风半夜鸣蝉","我有迷魂招不得，一唱雄鸡天下白","人间四月芳菲尽，山寺桃花始盛开","飞蛾性趋炎，见火不见我，愤然自投掷"],"answer":"C","explanation":"正确答案：C，全站正确率：73%，易错项：B。解析第一步，本题考查生物医学知识并选错误项。第二步，生物的应激性反应是指一切生物对外界各种刺激（如光、温度、声音、食物、化学物质、机械运动、地心引力等）所发生的反应。它是使生物体能趋利避害和趋吉避凶的一种本能反应。“人间四月芳菲尽，山寺桃花始盛开”出自唐代诗人白居易的《大林寺桃花》，主要表达了在喧嚣的尘世之上，四月份的时候百花都已凋谢，可深山古寺之中的桃花才刚刚盛开。用地理学的观点讲，深山海拔高气温低，花开的晚；诗中指超凡脱俗远离尘世，不与世俗同流合污。由此可见，C 项没有体现出生物的应激反应。因此，选择C 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 - 拓展 A 项：“明月别枝惊鹊，清风半夜鸣蝉”出自宋代词人辛弃疾的《西江月·夜行黄沙道中》。意思为皎洁的月光从树枝间掠过，惊飞了枝头喜鹊，清凉的晚风吹来仿佛听见了远处的蝉叫声。表达了喜鹊对月光的应激反应。因此，A 项描述了生物的应激反应，不符合题意，A 项错误。 B 项：“我有迷魂招不得，雄鸡一声天下白”出自唐代李贺的《致酒行》。意思为我有迷失的魂魄，无法招回，雄鸡一叫，天下大亮。表达了公鸡对于光刺激的一种应激反应。因此，B 项描述了生物的应激反应，不符合题意， B 项错误。 D 项：“飞蛾性趋炎，见火不见我，愤然自投掷”出自清代诗人秦宏铸。意思为飞蛾的本性惯于趋向炎热，只见到火而见不到自己，像愤然投掷一样。表达了飞蛾对火光的刺激而表现出的应激性反应。因此，D 项描述了生物的应激反应，不符合题意，D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-020","paperId":"jx2020","num":20,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"香蕉水作为油性涂料、油漆等建筑材料的溶剂和稀释剂，常用于家庭和办公室装修，下列关于香蕉水的说法正确的是：","options":["香蕉水是无色透明易挥发的有机液体","香蕉水的主要成分是乙醇，易燃无毒","香蕉水是一种特殊水溶液，不易燃烧","香蕉水是提取于香蕉的天然无毒液体"],"answer":"A","explanation":"正确答案：A，全站正确率：39%，易错项：C。解析第一步，本题考查化学常识。第二步，香蕉水，又名天那水、梨油等，是一种由多种有机溶剂配制而成的无色透明易挥发的液体，因有乙酸戊酯或乙酸异戊酯的香蕉味而得名。与A 项表述一致。因此，选择A 选项。拓展 B 项：香蕉水的主要成分有甲苯、醋酸丁酯、环己酮、醋酸异戊酯等，微溶于水，能溶于各种有机溶剂，易燃，对人体有一定毒性，主要用作喷漆的溶剂和稀释剂。B 项错误。 C 项：香蕉水能溶于各种有机溶剂，易燃，其蒸汽与空气可形成爆炸性混合物，遇明火、高热能引起燃烧爆炸。 C 项错误。 D 项：首先，香蕉水由乙酸和异戊醇经酯化反应而得，而不是提取于香蕉；其次，香蕉水有毒，对眼和粘膜有刺激作用，高浓度吸入可引起中枢神经系统损害，甚至肝肾损害。D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-021","paperId":"jx2020","num":21,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"生活中俗称“暖宝宝”的一次性取暖片主要由铁粉、活性炭、蛭石、水、盐等材料构成，下列关于其发热原理的说法正确的是： - 3 -","options":["活性炭的作用是减少铁粉和空气的接触面积","盐和水的作用是加快铁粉氧化","发热原理是铁的氧化吸热过程","蛭石的作用是散热"],"answer":"B","explanation":"正确答案：B，全站正确率：42%，易错项：C。解析第一步，本题考查生活常识。第二步，暖宝宝又叫暖贴，是一种可供取暖的工具。反应原理为利用原电池提升氧化反应速度，将化学能转变为热能。暖宝宝中的发热原料是由铁粉、活性炭、蛭石、无机盐和水等组成的聚合物，撕开暖宝宝明胶层，可立即与空气中的氧气作用，发生放热反应。其中，水和食盐起帮助铁粉形成微电池加速铁氧化腐蚀的作用，所以，盐和水的作用是加快铁粉氧化。B 项表述正确。因此，选择B 选项。拓展 A 项：活性炭的作用就是用来吸收水分,保证反应环境的，同时，活性炭可以做成铁粉的载体，使之与空气接触面积增大，而不是减小与空气的接触面积。A 项错误。 C 项：暖宝宝的发热是一种氧化放热反应，高纯度铁粉在催化剂的作用下，与空气中的氧气发生氧化反应,释放热量，而不是吸热。C 项错误。 D 项：蛭石是一种天然、无机、无毒的矿物质，在高温作用下会膨胀。在暖宝宝中加入蛭石可以使温度能够持续更长,保温效果会更持久，而不是散热，D 项错误。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-022","paperId":"jx2020","num":22,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"手机电池经历了镍镉电池、镍氢电池和锂离子电池3 个阶段。锂离子电池相对于其它两种电池的优势在于： ①重量轻 ②安全性高 ③绿色环保 ④高低温适应性强","options":["①②③","①③④","①②④","②③④"],"answer":"A","explanation":"正确答案：A，全站正确率：33%，易错项：C。解析第一步，本题考查常识。第二步，锂离子电池是一种二次电池（充电电池），它主要依靠锂离子在正极和负极之间移动来工作。锂离子电池是目前性能最好的电池。与同样大小的镍镉电池、镍氢电池相比，电量储备最大，重量最轻，寿命最长，充电时间最短，无记忆效应；但价格最贵，对充电器也有选择性。锂离子电池安全性能好，作为Li-ion 前身的锂电池，因金属锂易形成枝晶发生短路，缩减了其应用领域。Li-ion 中不含镉、铅、汞等对环境有污染的元素。部分工艺（如烧结式）的NiCd 电池存在的一大弊病为“记忆效应”，严重束缚电池的使用，但Li-ion 根本不存在这方面的问题。锂离子电池不含镉、铅、汞等对环境有污染的元素,无公害。与其它充电电池不同，锂离子电池的容量会缓慢衰退，与使用次数有关，也与温度有关。工作温度为-25~45°C，随着电解液和正极的改进，期望能扩宽到-40~70°C。因此④错误，应选①②③。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - 因此，选择A 选项。拓展镍镉电池是一种直流供电电池，镍镉电池可重复500 次以上的充放电，经济耐用。其内部抵制力小，既内阻很小，可快速充电，又可为负载提供大电流，而且放电时电压变化很小，是一种非常理想的直流供电电池。充电时，室温最好控制在10℃－30℃之间进行，高于30℃最好采取降温措施，避免因电池内部过热发生变形；室温低于5 摄氏度时，会造成充电不足，影响电池的使用寿命。镍氢电池是一种性能良好的蓄电池。镍氢电池分为高压镍氢电池和低压镍氢电池。镍氢电池正极活性物质为Ni（OH）2（称NiO 电极），负极活性物质为金属氢化物，也称储氢合金（电极称储氢电极），电解液为6mol/L 氢氧化钾溶液。镍氢电池作为氢能源应用的一个重要方向越来越被人们注意。低温性能优良，在-10℃时，容量没有明显改变。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-023","paperId":"jx2020","num":23,"year":2020,"region":"江西","module":"常识判断","sub":"科技生活","stem":"下列关于光现象的物理解释正确的是：","options":["小孔成像——光的衍射现象","天空呈现蓝色——光的散射现象","早上和黄昏的太阳是红色的——光的反射现象","衣服湿了颜色变深——布料沾水后反射到眼睛的光波频率发生变化"],"answer":"B","explanation":"正确答案：B，全站正确率：43%，易错项：D。解析第一步，本题考查物理常识中的光现象。第二步，天空呈现蓝色是因为大气对于太阳光的散射作用。太阳光是由红、橙、黄、绿、蓝、靛、紫七种颜色的光组成的，其中红光波长最长，紫光波长最短。波长比较长的红光透射性最大，能够直接透过大气射向地面，橙、黄、绿光也比较容易透过大气，而波长比较短的蓝、靛、紫等颜色的光，却很容易被大气散射而无法透过大气层，且光无论是在空气、水或是其他介质中，总是沿着直线传播的。一旦遇到一个小的颗粒，就会有一部分光线偏离原来的方向向四面八方传播，这就是光的散射现象。在短波中，蓝光能量最大，散射出来的光波也最多，被散射了的蓝光布满天空，就使天空呈现出一片蓝色了。因此，选择B 选项。拓展 A 项：小孔成像，用一个带有小孔的板遮挡在墙体与物之间，墙体上就会形成物的倒影，我们把这样的现象叫小孔成像。前后移动中间的板，墙体上像的大小也会随之发生变化，这种现象说明了光沿直线传播的性质。光的衍射现象是指光在传播过程中，遇到障碍物或小孔时，光将偏离直线传播的路径而绕到障碍物后面传播的现象，证明光具有波动性。“小孔成像”的原理是光的直线传播原理，即光在同种均匀介质中，在不受引力作用干扰的情况下沿直线传播，而不是光的衍射。 C 项：因为早上和黄昏的时候太阳高度角比较小，阳光要想到达地面需要穿过的大气距离就比较长，只有波长较长的红光才能到达地面，其他波长较短的光则被大气层或散射或吸收或挡回，所以早上和黄昏时候我们看到的太阳就是红色的。而中午太阳高度角较大，阳光穿过大气的距离就比较短，这样大部分光线都能到达地面，所以中午的太阳就非常明亮，呈现白色。并不是因为光的反射现象。 D 项：衣服湿了颜色都会变深，其原理是人的眼睛之所以能看到物体，是由于光照到物体以后，物体表面把光反射进眼内所致。衣服被水浸湿后，一方面有一部分纤维绒毛倾倒而不能反射光线；另一方面湿衣服纤维表面覆盖着一层水，只有一部分光线能钻出这层水而反射出来。衣服被浸湿后能够反射的光线变少了，它的颜色就会相应加深了。与光波频率无关。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-024","paperId":"jx2020","num":24,"year":2020,"region":"江西","module":"常识判断","sub":"政治","stem":"如下图所示，房间中互相垂直的墙和天花板都是由镜子构成，形成了3 个两两互相垂直的平面镜。站在其中的小明会成多少个像：","options":["3 个","4 个","7 个","8 个"],"answer":"C","explanation":"正确答案：C，全站正确率：42%，易错项：A。解析第一步，本题考查平面镜成像知识。第二步，根据题意，三个平面镜两两垂直，小明站在其中。如图所示，两个相互垂直的墙面平面镜会形成三个像， S12 是S1 在M2 中的像，S21 是S2 在M1 中的像，S12 和S21 俩像重合，所以两个相互垂直的镜面会形成三个像。再加上小明本人，对于天花板上的平面镜，一共是四个“小明”，四个“小明”通过天花板上的镜子又成四个像，去掉小明，一共还剩7 个像。与C 项表述一致。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 - 因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-025","paperId":"jx2020","num":25,"year":2020,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于人体单纯性肥胖的说法错误的是：","options":["进食过多的糖类食物，会导致肥胖","肥胖者会因动脉粥样硬化而产生心血管疾病","不吃肥肉少放油，提倡低脂膳食就能避免肥胖","脂肪虽供给人体能量，但摄入过多会沉积皮下引起肥胖"],"answer":"C","explanation":"正确答案：C，全站正确率：80%，易错项：B。解析第一步，本题考查生物医学并选错误项。第二步，肥胖是由于食物摄入过多或机体代谢的改变而导致体内脂肪积聚过多造成体重过度增长并引起人体病理、生理改变或潜伏。不吃碳水化合物但摄入较多脂肪、乃至饱和脂肪的人，消耗的体脂更多，并且罹患心血管疾病的风险更低。这种做法能更有效地减少体脂，并同时减轻体重。与低脂饮食相比，低碳饮食更有助于减少体重和减少心血管疾病的风险。C 项错误。因此，选择C 选项。拓展 A 项：在人体内，糖类可以大量转化成脂肪，当人吃过量的糖类时，供能之后有剩余，就会转化为肝肌糖元，如果还有剩余，就会大量转化成脂肪，使人长胖。A 项正确。 B 项：肥胖病患者血脂增高是形成动脉粥样硬化的重要原因。因为动脉粥样硬化的患者在早期并没有明显的症状，没有采取有效的干预措施，等到血管病变加重，患者也就出现心血管疾病的问题。B 项正确。 D 项：人体能量摄入超过能量消耗，多余的能量就会转变成脂肪囤积在人体内，从而导致肥胖。D 项正确。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-026","paperId":"jx2020","num":26,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"作为一种现象，城市垃圾问题早已凸显，异地倾倒、________，不过是垃圾困境的一种不当突围方式而已。治理垃圾异地倾倒问题，必须依靠严厉执法和监督举报，但最终还是要回到城市垃圾处理上来。填入划横线部分最恰当的一项是：","options":["投机取巧","以邻为壑","落井下石","寡廉鲜耻"],"answer":"B","explanation":"正确答案：B，全站正确率：64%，易错项：A。解析第一步，分析语境。根据提示信息“城市垃圾问题早已凸显，异地倾倒”，可知该空前后要表达把自己产生的垃圾转移给别人的意思。第二步，辨析选项。“以邻为壑”比喻只图自己的利益，把困难或祸害转嫁给别人。符合语境。锁定答案为B。 A 项“投机取巧”指靠小聪明占便宜，不合语境，排除A 项。C 项“落井下石”指乘人危难时加以陷害，不合语境，排除C 项。D 项“寡廉鲜耻”指不知羞耻，不合语境，排除D 项。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-027","paperId":"jx2020","num":27,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"向公众________科学知识、________科学精神，是科学家义不容辞的责任。但是科学家首先要致力于科研，他究竟能花多少时间来做科普，显然无法一概而论。通常，一线科学家很难花费太多的时间和精力直接参与一波又一波的科普活动。依次填入划横线部分最恰当的一项是:","options":["传输传递","传递传播","传导传扬","传达传承"],"answer":"B","explanation":"正确答案：B，全站正确率：58%，易错项：C。解析第一步，分析第一空。第一空应与科学知识搭配，体现科学家项公众传播科学知识的含义。A 项“传输”意义为传递，输送，一般与能量、信息搭配；C 项“传导”指热或电从物体的一部分传到另一部分，多用于物理或者神经方面；D 项“传达”把一方的意思告诉给另一方，多用于与命令、消息搭配。A 项、C 项和D 项均与“科学知识”搭配不当，排除。B 项“传递”指由一方交给另一方，与“科学知识”搭配恰当。答案锁定B 项。第二步，验证第二空。“传播”指广泛散布，与题目中的“科学精神”搭配恰当。因此，选择B 选项。拓展获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 传送：把物品、信件、消息、声音等从一处传递到另一处：～电报。～消息。传扬：事情、名声等传播。传承：传授和继承","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-028","paperId":"jx2020","num":28,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"研究结果显示，只要手机在视线范围或 ________的范围之内，就会导致人们的注意力下降。这并不是手机的推送或通知分散了人的注意力，而是人们下意识地不去“________”手机，但发布这个指令的过程本身就会耗费有限的认知资源，造成脑力流失。依次填入划横线部分最恰当的一项是：","options":["近在咫尺牵挂","唾手可得惦念","触手可及惦记","一步之遥想念"],"answer":"C","explanation":"正确答案：C，全站正确率：86%，易错项：B。解析第一步，分析第一空。根据“手机在视线范围”可知，文中要表达的意思是与手机的距离近。A 项“近在咫尺” 指距离非常近，符合文意。B 项“唾手可得”比喻极容易得到，未能体现“距离近”的意思，不符合文意，排除 B 项。C 项“触手可及”指近在手边，一伸手就可以接触到，符合文意。D 项“一步之遥”指一步的距离，比喻很近，符合文意。第二步，分析第二空。根据“并不是……,而是……”可知，反向并列前后语义相反，因文中出现否定词“不去”，故文中要表达的意思是与“分散了人的注意力”语义相近。A 项“牵挂”指因放心不下而想念，不符合上述语境，排除A 项。C 项“惦记”指（对人或事物）心里老想着，放不下心，符合语境。D 项“想念”指思念，怀念，不符合文意，排除D 项。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-029","paperId":"jx2020","num":29,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"文化是“人化”，同时又要“化人”。城市中的人一方面是文化形象的________和代言人，人们的精神面貌、道德修养、行为举止诸方面都反映出城市的文化形象；另一方面其行为方式又受到城市文化形象的影响，良好的文化形象会对人产生引导、规范和________作用。 - 4 - 依次填入划横线部分最恰当的一项是：","options":["载体激励","体现训诫","内涵塑造","象征制约"],"answer":"A","explanation":"正确答案：A，全站正确率：60%，易错项：D。解析第一步，突破口在第二空。填入词语与“引导、规范”构成并列关系，应含中性或积极的感情色彩。A 项“激励” 和C 项“塑造”符合语境。B 项“训诫”和D 项“制约”均含消极的感情色彩，排除。第二步，再看第一空。填入词语指代“城市中的人”。A 项“载体”泛指能够承载其他事物的事物。“城市中的人”是“载体”，搭配恰当。C 项“内涵”指一个概念所反映事物的本质属性的综合。“城市中的人”是“内涵”，搭配不当，排除。因此，选择A 选项。拓展象征：用具体事物表现某些抽象意义；不可见的某种物的可以看见的标记。训诫：教导和告诫；一种处分措施。塑造：用语言文字等艺术手段描写人物形象。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-030","paperId":"jx2020","num":30,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"国学如果停留在如此浅层次的形式复古，无异于________，甚至会把国学弄成与现代文明相对抗的姿态，凡事不问好坏对错，一切以东西古今划界。凡是古人的都是好的，哪怕骑驴；凡是现代的都是“非我族类”,都该保持距离。如此下去，国学非但不会被这些人“发扬光大”，相反可能会走入狭隘化、极端化、边缘化的境地，钻进狭小天地里________，与文明发展割断脉络，把自己变成了一块“化石”。依次填入划横线部分最恰当的一项是：","options":["缘木求鱼蓬荜生辉","掩耳盗铃纤尘不染","刻舟求剑皮里阳秋","买椟还珠孤芳自赏"],"answer":"D","explanation":"正确答案：D，全站正确率：65%，易错项：C。解析第一步，突破口在第二空。填入词语应与“狭隘化、极端化、边缘化”语义相近，应含有消极的感情色彩。A 项 “蓬荜生辉”形容贵客来访令主人感到增光不少，为谦辞；B 项“纤尘不染”现泛指丝毫不受坏习惯，坏风气的影响，也用来形容非常清洁、干净，含褒义；C 项“皮里阳秋”意思是藏在心里不说出来的言论，为中性词。A 项、B 项和C 项均与文段感情色彩不一致，排除。D 项“孤芳自赏”指自命清高，自我欣赏的人。也指脱离群众，自以为了不起，含贬义，符合文意。答案锁定D 项。第二步，验证第一空。“买椟还珠”比喻没有眼光，取舍不当，对应前文“停留在如此浅层次的形式复古”，符合文意。因此，选择D 选项。拓展缘木求鱼：比喻方向、方法不对，一定达不到目的。掩耳盗铃：比喻自己欺骗自己，明明掩盖不了的事偏要去设法掩盖。刻舟求剑：比喻拘泥成例，不知道跟着情势的变化而改变看法或办法。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-031","paperId":"jx2020","num":31,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"在未来30 年里，“气候变化技术”既包括________防洪设施、用转基因技术使庄稼抵御干旱气候等短期防御科技，也包括使用碳隔离方式将温室气体从大气层抽离并存入地下，将二氧化铝植入大气层以此来减少太阳辐射对地球温度影响等的长期防御科技________。依次填入划横线部分最恰当的一项是：","options":["修建计划","兴建打算","建设设想","建造构想"],"answer":"D","explanation":"正确答案：D，全站正确率：47%，易错项：A。解析第一步，分析第一空。根据语境可知此处需要一个动词与“防洪设施”形成动宾搭配。A 项“修建”是指用砖、瓦、木料、水泥、砂等建造，一般用于具体语境，符合文意。B 项“兴建”指建设，一般指规模较大的建筑，不符合文意，排除B 项。C 项“建设”指建立，创立新事业，多用抽象含义，如“建设社会主义事业”，不符合文意，排除C 项。D 项“建造”指打造一些楼房等建筑，可用于具体语境，符合文意。第二步，分析第二空。提炼主干，这里要表达的意思是“气候变化技术”也包括减少太阳辐射影响的长期防御科技________。A 项“计划”指办事前所拟定的方案，也可以指对未来的规划，侧重于具体的规划，工作或行动的预先拟定的具体内容和步骤，不属于“技术”范畴，不符合文意，排除A 项。D 项“构想”是在创作过程中的思维活动，侧重于创作的想法和构思，可以算作“技术”，符合文意。因此，选择D 选项。拓展获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 - 设想：假想，想象；着想，考虑，打算。打算：计划，考虑，用作动词；关于行动的想法，念头，用作名词。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-032","paperId":"jx2020","num":32,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"中国的格律诗，总体上在唐代________，达到无法超越的地步。宋诗其实是唐诗的延续，宋代有一些优秀的诗人，他们的创作可与唐人媲美，譬如苏东坡、王安石、陆游等。宋诗中，写得情景交融、意境优美的作品，可以说________。依次填入划横线部分最恰当的一项是：","options":["叹为观止触目皆是","登峰造极俯拾皆是","无出其右汗牛充栋","无与伦比斗量车载"],"answer":"B","explanation":"正确答案：B，全站正确率：84%，易错项：C。解析第一步，分析第一空。根据“达到无法超越的地步”可知，文中要表达的意思是中国的格律诗，总体上在唐代达到空前绝后的地步。A 项“叹为观止”形容所见到的事物好到了极点，未能体现出达到无法超越的地步，不符合文意，排除A 项。B 项“登峰造极”比喻学问、技艺等已达到最高的境界，符合文意。C 项“无出其右”表示没有能超过它的，符合文意。D 项“无与伦比”指事物非常完美，没有能够与它相比的同类的东西，文中未体现出与同类事物进行比较，不符合文意，排除D 项。第二步，分析第二空。填入的词语修饰“作品”。文中要表达的意思是宋代的诗人很多，作品也很多。B 项“俯拾皆是”形容只要低下头来捡取，到处都是，形容多而易得，符合上述语境。C 项“汗牛充栋”指藏书非常多，一般与“书”“文献”“典籍”搭配，不符合文意，排除C 项。因此，选择B 选项。拓展触目皆是：意思是眼睛所看到的地方，到处都是。斗量车载：形容数量很多，不足为奇。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-033","paperId":"jx2020","num":33,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"长期以来，人们对于“阳春白雪”的传统文化，都是一种仰望的姿态，认为________，于是常常过而不入。从这个意义上说，搞好文创，需要首先激发起人们对文化的浓厚兴趣，然后同样重要的，是想方设法保留住它。如此，人们才会在文化探索的旅程中________，走的更深、更远。依次填入划横线部分最恰当的一项是：","options":["海水不可斗量登堂入室","百思不得其解斗折蛇行","夏虫不可语冰登高履危","可望而不可即拾级而上"],"answer":"D","explanation":"正确答案：D，全站正确率：92%，易错项：A。解析第一步，分析第一空。根据“人们对于‘阳春白雪’的传统文化，都是一种仰望的姿态”“常常过而不入”可知，文中要表达的是人们对于高雅文学的态度，且强调的是“仰望”，即觉得自己可能不能理解和接受。A 项“海水不可斗量”比喻不能凭人的相貌或现状来测量他的品格、才能或未来，侧重于不可低估某人，不符合文意，排除 A 项。B 项“百思不得其解”意思是对事情百般思索都不明白，侧重于事情复杂，想不通，不符合文意，排除B 项。C 项“夏虫不可以语冰”指不能和生长在夏天的虫谈论冰，比喻时间局限人的见识，也比喻人的见识短浅，没有经历过的事情没有发言权，不符合文意，排除C 选项。D 项“可望而不可即”指只可仰望而不可接近，常比喻目前还不能实现的事物，符合“仰望”的态度，符合文意。答案锁定D 选项。第二步，验证第二空。“拾级而上”指一个台阶一个台阶地向上登，与横线之后的“走的更深、更远”相照应，符合文意。因此，选择D 选项。拓展登堂入室：比喻学问或技能从浅到深，达到很高的水平。斗折蛇行：像北斗星一样弯曲，像蛇一样曲折行进，形容道路曲折蜿蜒。登高履危：比喻诚惶诚恐。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-034","paperId":"jx2020","num":34,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"饮食在中国文化传承中是较稳定的领域，国有盛衰，代有兴亡，用筷子吃饭数千年不变，与宴饮相关的某些礼仪程式也很少变化，盛行西周的乡饮酒礼，上可溯至三代遗风，下传至清道光年间，其敬老、尊长、议政的古风________，连酒会程序——谋宾、迎宾、旅酬和送宾等礼仪也________。依次填入划横线部分最恰当的一项是：","options":["如出一辙毫无二致","一脉相承大同小异","一脉相通相差无几","衣钵相传半斤八两"],"answer":"B","explanation":"正确答案：B，全站正确率：63%，易错项：C。解析第一步，分析第一空。根据“盛行西周的乡饮酒礼，上可溯至三代遗风，下传至清道光年间，其敬老、尊老、议政的古风________”，可知文中要表达的意思是与宴饮相关的礼仪在中国文化的传承中是基本相同的，而且前后具有继承性。A 项“如出一辙”比喻两件事情非常相似；C 项“一脉相通”指事物之间相互关联，犹如一条脉络贯穿下来可以互通。A 项和C 项均强调“相似、相同”，未突出文化传承中前后的“继承性”，不符合文意，排除A 项和C 项。B 项“一脉相承”指从同一血统、派别世代相承流传下来，比喻某种思想、行为或学说之间有继承关系，符合文意。D 项“衣钵相传”比喻技术、学术的师徒相传，文段未强调“师徒间的传承”，不符合文意，排除D 项。答案锁定B 选项。第二步，验证第二空。“大同小异”指大体相同，略有差异，符合文意。因此，选择B 选项。拓展毫无二致：丝毫没有什么两样，指完全一样。相差无几：彼此没有多大差别。半斤八两：比喻彼此不相上下，一般用作贬义。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-035","paperId":"jx2020","num":35,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"艺术桥是巴黎的一个标志，不仅________了塞纳河畔的风景，更记载了艺术文化的传承和人类文明的繁荣。热爱美景、艺术和生活的人都会乐见艺术桥能够长久地________，发挥其应有的便民功能以及作为文物景观的历史价值和艺术作品的美学价值。依次填入划横线部分最恰当的一项是：","options":["衬托连续","渲染继续","装饰持续","点缀存续"],"answer":"D","explanation":"正确答案：D，全站正确率：88%，易错项：C。解析第一步，分析第一空。所填词语表示艺术桥对塞纳河畔的风景所起的作用，且“艺术桥”是微观事物，而“塞纳河畔的风景”偏宏观。C 项“装饰”指打扮，修饰；D 项“点缀”指装饰使更美好。二者均符合文意，能体现出微观事物对宏观事物发挥的作用。而A 项“衬托”指为了突出主要事物，用类似的事物或反面的、有差别的事物作陪衬；B 项“渲染”指对所写对象作突出的描写、形容、拱托。而文中“塞纳河畔的风景”并非是作者要突出获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 13 - 的事物和主要描写对象，二者均不符合文意，排除A 项和B 项。第二步，分析第二空。文段要表达的意思是“热爱美景、艺术和生活的人都会乐见艺术桥能够长久地延续、存在下去”。C 项“持续”指无间隔，连续不断，与“艺术桥”搭配不当，排除C 项。D 项“存续”指延续存在，符合文意。因此，选择D 选项。拓展连续：指相连接续，一个接一个，一次连一次。继续：连续下去、不中断进程。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-036","paperId":"jx2020","num":36,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"在新型城镇化的过程中，凸显本地文化特色至关重要。文化是一座城市的灵魂，只有文化的________，城市才能________其特色与气质。人是一种文化的存在,所以我们必须切实推进有文化记忆的城镇化。依次填入划横线部分最恰当的一项是：","options":["传播凸显","继承形成","融入定格","浸润彰显"],"answer":"D","explanation":"正确答案：D，全站正确率：80%，易错项：A。解析第一步，分析第一空。文中提到“文化是一座城市的灵魂”，也就是城市会受到文化精神层面的影响。C 项“融入”指融合，混入；D 项“浸润”指滋润浸染，逐渐渗透。二者均能体现出文化对城市作用。A 项“传播”指广泛散布；B 项“继承”指承接先代传统。二者均语义不符，排除A 项和B 项。第二步，分析第二空。该空所填词语搭配“特色与气质”。D 项“彰显”指鲜明地显示，能够照应首句“在新型城镇化的过程中，凸显文化特色至关重要”，符合文意。C 项“定格”指确定在某种状态、格式、标准上，语义不符，无法照应前文，排除C 项。因此，选择D 选项。拓展凸显：指清楚地显露，也指突出，显著。形成：指通过一种或多种事物的发展变化而导致另一种或多种事物产生或者变化的某种情况。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-037","paperId":"jx2020","num":37,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"在西汉时期，一种青铜染炉非常流行，以至于在许多地方都有出土，这种染炉分为三个构造：主体为炭炉，下部是________炭灰的盘体，上面放置一具活动的杯。它曾让几代学者对它的用途________，直到今天，考古界才确定它是一种类似现代意义上的“小火锅”。填入划横线部分最恰当的一项是：","options":["接收孜孜以求","承接迷惑不解","收纳朝思暮想","盛放潜精研思"],"answer":"B","explanation":"正确答案：B，全站正确率：51%，易错项：D。解析第一步，突破口在第二空。根据“曾让”“直到今天，考古界才确定”可知，学者过去对“它的用途”不了解。因此，填入词语应表达“困惑、不了解”的含义。A 项“孜孜以求”指不知疲倦地探求；C 项“朝思暮想”形容非常想念或经常想着某一件事；D 项“潜精研思”指专心钻研。A 项、C 项和D 项均无“困惑、不了解”的含义，不符合文意，排除。B 项“迷惑不解”意思是对某一事物怀疑迷惑，认识不清，符合文意。答案锁定B 选项。第二步，验证第一空。“承接”指用容器接受，“承接炭灰的盘体”搭配得当。因此，选择B 选项。拓展接收：收受；根据法令把机构、财产等拿过来；接纳。收纳：收进来；收容。盛放：把东西放在容器里。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-038","paperId":"jx2020","num":38,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"两相比较，白话文在通俗易懂的同时，往往在韵律上缺少节奏感，篇幅冗长，而文言文能用________传达出深层或多层意思，其凝练之美、韵律之美和意境之美是白话文________的。依次填入划横线部分最恰当的一项是： - 5 -","options":["一语双关略逊一筹","只言片语无与伦比","三言两语相形见绌","寥寥数语无可比拟"],"answer":"D","explanation":"正确答案：D，全站正确率：85%，易错项：C。解析第一步，分析第一空。文段在比较白话文和文言文的区别，根据“而”表示转折，可知前后语义相反，转折前提到白话文“篇幅冗长”，转折后填入的词语要体现出文言文篇幅短的意思。A 项“一语双关”指一句话包含两个意思，不能体现出“篇幅短”，排除A 项；B 项“只言片语”指个别词句或片断的话，文段在比较整个文言文的特点，而不是比较文言文中某个词句，语义不符，排除B 项。C 项“三言两语”指几句话，形容话很少的意思； D 项“寥寥数语”指非常简括地说。C 项和D 项均符合文意。第二步，分析第二空。根据“其凝练之美……是白话文”可知，要表达的是文言文的美是白话文难以企及的。C 项“相形见绌”指跟另一人或事物比较之后，显出了不足，一般的用法是“与......相比，相形见绌”，“是相形见绌的”用法不对，排除C 项。D 项“无可比拟”指没有可以相比的，符合文意。因此，选择D 选项。拓展略逊一筹：比较起来，稍微差一点。无与伦比：指事物非常完美，没有能跟它相比的。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-039","paperId":"jx2020","num":39,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"目前，第五代移动通信（5G）已成为当前和未来全球业界的焦点，将________移动互联网进入新时代，美国高通公司指出，5G 技术将成为和电力、互联网等发明一样的通用技术，________未来的转型变革，重新定义工作流程并________经济竞争优势规则，到2035 年，5G 将在全球创造12.3 万亿美元的经济产出，同时创造2200 万个工作岗位。依次填入划横线部分最恰当的一项是：","options":["带领催生重造","引领催化重塑","引导催发制定","带动催促制订"],"answer":"B","explanation":"正确答案：B，全站正确率：73%，易错项：C。解析第一步，分析第一空。根据“第五代移动通信已成为业界的焦点，将________移动互联网进入新时代”可知，文中要表达的是5G 的出现带来了新时代。A 项“带领”指在前带头使后面的人跟随着，多用于人，排除A 项。B 项 “引领”指引导，符合文意。C 项“引导”指带领，符合文意。D 项“带动”比喻通过动力使有关部分相应地动起来或引导着前进或带头做并使别人跟着做，符合语境。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 14 - 第二步，分析第二空，C 项“催发”指促使发生或产生，多搭配“灵感”，与“转型变革”搭配不当，排除C 项。 B 项“催化”指促使速率发生变化，用于语境中体现“加速转型变革”之意，符合文意。D 项“催促”指对人进行督促，使行动加快，搭配对象多为人，搭配不当，排除D。答案锁定B 选项。第三步，验证第三空。“重塑......规则”与“重新定义”相呼应，符合语境。因此，选B 选项。拓展制定：拟定、定出。制订：创造、拟定。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-040","paperId":"jx2020","num":40,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"上海合作组织成立十多年来，创造性提出并始终________“上海精神”，主张互信、互利、平等、协商、尊重多样文明，谋求共同发展，为世界各国共同繁荣、区域合作发展壮大提供了有益________，为推动各国________ 建设人类命运共同体做出了重大贡献。依次填入划横线部分最恰当的一项是：","options":["实践启发并肩","推行借镜昂首","践行借鉴携手","履行启示挽手"],"answer":"C","explanation":"正确答案：C，全站正确率：94%，易错项：A。解析第一步，分析第二空。文段中描述到“上海精神为区域合作发展壮大提供了有益________”，可知应为提供了帮助或参考。A 项“启发”和D 项“启示”语义与文段不相符，同时“有益”与启示，启发略显重复，因为启示，启发本身就是有益的，因此排除A 项和D 项。B 项“借镜”C 项“借鉴”意思相符，保留。第二步，分析第三空。“为推动各国________建设……作出了重大贡献”分析得出，应为各国一同建设人类命运共同体，因此这一空应填词的意思与“一同”相近，B 项“昂首”指仰着头。与“一同”意思不相同，排除B 项。 C 项“携手”指比喻共同做某事。与文段意思相符。锁定C 项。第三步，验证第一空。践行上海精神，语义相符。因此，选择C 选项。拓展实践：实行；履行。借镜：借鉴。并肩：比喻行动一致，共同努力。挽手：手拉手，形容关系亲密。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-041","paperId":"jx2020","num":41,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"随着学校消失，村庄的文化高地不在，村庄文化脉络的________受到了影响；青少年长期“不在场”，对村庄的________感逐渐增强。特别是在以传统农业文明为指征的村庄文化正在大面积________，农村文化呈现虚化、空洞化，无疑更进一步加剧了村庄文化的衰亡，对村庄的可持续发展造成不利的影响。依次填入划线部分最恰当的一项是：","options":["纲维疏远消失","维系疏离式微","轴心隔阂衰亡","衔接陌生凋零"],"answer":"B","explanation":"正确答案：B，全站正确率：39%，易错项：D。解析第一步，分析第一空。修饰“文化脉络”，文段要表达的意思是随着学校的消失，村庄文化的高地就不在了，文化脉络得不到维持。A 项“纲维”指维系，犹纲领，比喻法度；D 项“衔接”指事物首尾连接或指用某个物体连接两个分开的物体。二者均不符合文意，排除A 项和D 项。C 项“轴心”比喻中心；B 项“维系”指维持和联系。二者均符合文意。第二步，分析第二空。文段意思是青少年长期不在农村，对村庄就越来越陌生。B 项“疏离”指一种感觉很陌生，冷漠，和人很疏远的感觉，符合语境。C 项“隔阂”指彼此情意沟通的障碍或是情意不通，思想有距离，彼此之间有间隔，也指阻隔、隔绝。不用来修饰人和村庄的感情，排除C 项。答案锁定B 选项。第三步，验证第三空。“式微”指事物由兴盛而衰落，修饰“村庄文化”恰当。因此，选择B 选项。拓展消失：事物渐渐减少以至没有；事物不复存在。衰亡：衰落以至灭亡。凋零：衰落。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-042","paperId":"jx2020","num":42,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"曹雪芹通过贾府的衣食住行把________人家的富贵之相刻画得淋漓尽致。一屋一室，或雕梁画栋，或________，或金碧辉煌，或简约古朴，相映成辉，相映成画；一餐一饮精烹细作，食不厌精；________，雀衣彩绣，美轮美奂。但仍然没有宴席上的浅斟深酌更能体现出贾府“鲜花着锦、烈火烹油”之盛；没有比推杯换盏之时的琴歌酒赋更能体现出翰墨书香之家族的风流雅致。依次填入划横线部分最恰当的一项是：","options":["筚门圭窦岸芷汀兰一裙一裳","兰艾同焚粉墙黛瓦一丝一缕","钟鸣鼎食曲径通幽一衣一带","桑枢瓮牖小桥流水一鞋一袜"],"answer":"C","explanation":"正确答案：C，全站正确率：41%，易错项：B。解析第一步，分析第一空。根据“富贵之相”可知，所填词应该表示的是富贵之意。A 项“筚门圭窦”形容穷苦人家的住处；D 项“桑枢瓮牖”比喻贫苦之家。两者均与文意相悖，排除A 项和D 项。B 项“兰艾同焚”比喻好的坏的同归于尽，语义不符，排除B 项。C 项“钟鸣鼎食”形容权贵的豪奢排场，符合语境。答案锁定C 选项。第二步，验证第二空和第三空。“曲径通幽”意思是从弯曲的小路通向风景幽美的地方，和“雕梁画栋”“金碧辉煌”构成并列关系，符合语境。“一衣一带”和“一屋一室”“一餐一饮”构成并列关系，照应“雀衣彩绣”，符合语境。因此，选择C 选项。拓展岸芷汀兰：形容人像芳兰一样品德高尚，谦让有礼。粉墙黛瓦：雪白的墙壁，青黑的瓦，用来描写房屋。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-043","paperId":"jx2020","num":43,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"正因为中国法律史学除了单纯的理论研究，还要探究解决当代中国的法律问题，所以有必要坚持独立的中国立场，不论是单纯的理论研究，还是切近实际的应用研究，都需坚持独立思想立场，才能做出有价值的研究成果。这里的独立立场，其实就是中国自身的立场，而不是站在别国的立场之上。近代以来，西方国家一些学者对于中国法律不客观的负面评价，曾经影响到中国学者对待本国法律历史的态度。直到今天，这种影响仍没有完全消除，需要加以矫正。这段文字旨在强调：","options":["中国法律史学研究需探究解决当代中国的法律问题","中国法律史学研究受到西方学者不客观的负面评价","中国法律史学研究必须坚持中国自身独立的立场","中国法律史学研究曾受到西方学者影响至今未消除"],"answer":"C","explanation":"正确答案：C，全站正确率：90%，易错项：D。解析第一步，分析文段。文段首句提出观点，通过结论词“所以”强调了“坚持独立的中国立场”对中国法律史学研究的重要性。后文对“坚持独立的中国立场”重要性进行解释说明和论证。文段属于“提出观点—论证观点”的 “总—分”结构，首句为主旨句。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 15 - 第二步，对比选项。C 项是对文段主旨句的同义替换。因此，选择C 选项。拓展 A 项：缺少话题词“坚持独立的中国立场”，偏离重点。B 项和D 项：“西方学者”非重点。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-044","paperId":"jx2020","num":44,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"研究人员发现在大脑中存在着不同种类和巨大数量的高维几何结构，由紧密连接的神经元团块和它们之间的空白区域（空洞）组成。这些团块或空洞似乎对大脑功能至关重要，当研究人员给虚拟大脑组织施加刺激时，他们发现神经元以一种高度有组织性的方式对刺激作出了反应。这意味着我们思考问题的时候，神经元的团块会逐渐组合成更高维的结构，形成高维的孔隙或空洞，团块中的神经元越多，空洞的维度就越高，最高的时候可以达到11 个维度。根据上述文字，下列说法正确的是：","options":["团块中的神经元越多，空洞的维度就越高，意识越复杂","神经元团块或空洞互相连接，以施压方式促进人的思考","神经元能以高度有组织性的方式反应，取决于大脑功能","人脑充满多维几何结构，最高时可在11 个维度上运行"],"answer":"D","explanation":"正确答案：D，全站正确率：38%，易错项：A。解析第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项对应尾句“这意味着我们在思考问题的时候，神经元的团块会逐渐组合成更高维的结构…… 团块中的神经元越多，空洞的维度就越高，最高的时候可以达到11 个维度”，可以理解为思考问题的时候便是意识复杂的时候，神经元的团块越多，空洞的维度就越高，从这个角度说A 项逻辑颠倒。或者也可以理解为“意识越复杂”文中并没有提及，属于无中生有，排除A 项。B 项对应第一句“由紧密连接的神经元团块和它们之间的空白区域（空洞）组成”以及第二句“他们发现神经元以一种高度有组织性的方式对刺激作出了反应”。可知 “空洞互相连接”“以施压方式”属于无中生有，排除B 项。C 项对应第二句“这些团块或空洞似乎对大脑功能至关重要……他们发现神经元以一种高度有组织性的方式对刺激作出了反应”，可知该项“取决于”属于无中生有，排除C 项。D 项对应第一句“大脑中存在着不同种类和巨大数量的高维几何结构”以及尾句“最高的时候可以达到11 个维度”，“多维”和“高维”意思相近，D 项符合文意。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-045","paperId":"jx2020","num":45,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"水熊被认为是世界上最顽强的动物，其显著特征是能在各种极端环境中存活下来。科学家曾经将水熊冰冻在冰层之中，暴露在放射线之下，甚至将它们发送至太空，但令人惊奇的是，水熊仍能从假死状态中复活。最近， - 6 - 科学家揭示了水熊复活的秘密，其DNA 兼具动物和细菌成分，使其成为“弗兰肯斯坦”混合体。此外，科学家在研究水熊复活过程中哪些基因会被激活时，还发现了一组特殊蛋白质。这组蛋白质能够快速替换体内损耗的水分，并修复受损细胞，致使这种动物接近于不可毁灭状态。这段文字旨在说明：","options":["水熊的显著特征是能在各种极端环境中存活","水熊是一种能复活的“弗兰肯斯坦”混合体","水熊拥有神秘DNA 使它接近于不可毁灭","水熊拥有的特殊蛋白质能修复受损的细胞"],"answer":"C","explanation":"正确答案：C，全站正确率：24%，易错项：A。解析第一步，分析文段。文段前两句指出水熊被认为是世界上最顽强的动物，可以在各种极端环境中存活下来，并进行解释说明。后文通过介绍科学家的最新发现引出文段重点，指出水熊复活的秘密。通过“此外”引导的两层并列关系可以知道，水熊特殊的DNA 使得它接近于不可毁灭的状态，可以在各种极端环境中存活下来。第二步，对比选项。C 项符合文段重点。因此，选择C 选项。拓展 A 项：“能在各种极端环境中存活”照应前文，偏离重点，且与C 项相比，没有突出DNA 的作用。B 项和D 项：均偏离文段核心话题“DNA”，且属于并列中的一部分，表述片面。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-046","paperId":"jx2020","num":46,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"生长在非洲大草原上的灰犀牛，身躯庞大，给人一种行动迟缓、安全无害的错觉，从而时常忽略了危险的存在——当灰犀牛被触怒发起攻击时，却会体现出惊人的爆发力，阻止它的概率接近于零，最终引发破坏性极强的灾难。概率大、破坏力强是\"灰犀牛\"事件最重要的特征。很多危机事件，与其说是“黑天鹅”，不如说更像是“灰犀牛”。它们并非发端于不可预测的小概率事件（“黑天鹅”），而是大概率、高风险事件（“灰犀牛”）不断演化的结果，这些风险的存在早就广为人知，却由于体制或认识的局限，没有得到积极防范和应对，最终升级为全面的系统性危机。根据上述文字，下列说法正确的是：","options":["“黑天鹅”和“灰犀牛”事件都是严重的无法防范的危机事件","与“灰犀牛”相对，“黑天鹅”是指破坏性不强的小概率事件","许多“黑天鹅”事件背后都隐藏着“灰犀牛”危机","“灰犀牛”和“黑天鹅”事件没有明显区别，一定条件下可以互相转化"],"answer":"C","explanation":"正确答案：C，全站正确率：68%，易错项：B。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项对应原文最后一句“这些风险的存在早就广为人知，却由于体制或认识的局限，没有得到积极防范和应对，最终升级为全面的系统性危机”，可知原文的意思是这些事件只要破除体制或认识局限是可以防范的，与文意不符，属于曲解文意，排除A 项。B 项对应“不可预测的小概率事件（“黑天鹅”）”，原文没有提到“黑天鹅”的破环性，属于无中生有，排除B 项。C 项对应“很多危机事件，与其说是‘黑天鹅’，不如说更像是‘灰犀牛’。它们并非发端于不可预测的小概率事件（‘黑天鹅’），而是大概率、高风险事件（‘灰犀牛’）不断演化的结果”，符合文意，答案锁定C 项。D 项对应“它们并非发端于不可预测的小概率事件（‘黑天鹅’）”，与原文意思相悖，排除D 项。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-047","paperId":"jx2020","num":47,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"最新研究表明，火星表面可能包含着一种叫做高氯酸镁的有毒化学化合物，它在紫外线下能摧毁细菌。研究者将枯草杆菌放置在短波紫外线辐射下，其状况类似于火星表面，发现高氯酸镁具有强杀菌性，这意味着它能潜在杀死所有细菌。只要存在高氯酸镁，枯草杆菌几分钟内就失去生存能力。同时，研究人员发现火星表面其它两种物质——氧化铁和过氧化氢，与高氯酸镁结合后杀菌性能增强10 倍。这项发现表明，火星表面对于细胞非常危险。长远来看，可能对后续的火星探索产生影响，尤其是可能大大增加了人类开发火星的成本。这段文字意在强调：","options":["高氯酸镁杀灭枯草杆菌有奇效","已找到为火星表面消毒的方法","火星自身具有杀菌自净的能力","火星比预想更不适宜生命存活"],"answer":"D","explanation":"正确答案：D，全站正确率：81%，易错项：C。解析第一步，分析文段。文段开始由最新研究表明引出火星表面可能包含高氯酸镁的化学化合物，可以摧毁细菌。之后文段借用“同时”并列了研究人员发现的两个方面，一是高氯酸镁具有强杀菌性，可以杀死所有细菌；二是火星表面还有两种物质氧化铁和过氧化氢，与高氯酸镁结合杀菌性强10 倍。最后提出总观点，火星表面对于细胞非常危险，对后续的火星探测有影响，尤其是增加人类开发火星的成本。第二步，对比选项。A 项只谈及高氯酸镁，表述片面，且主体词应该是火星。B 项文中没有提及找到消毒的方法，无中生有。C 项表达倾向相悖，在作者看来火星存在这些物质不利于我们进行探测和研究。D 项根据文中最后的结论，火星对细胞非常危险可以看出作者意在强调火星生命存活的难度极大。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-048","paperId":"jx2020","num":48,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"一次，苏格拉底与三个学生走过一块麦田，他要学生从这边走过，去摘一穗最大的麦穗。结果有一个学生空手而归，他总想最大的麦穗一定还在前边，不觉到了尽头，两手仍然空空；另一个则摘了一穗很小的麦穗，他一走进麦田便急忙摘了一穗，殊不知前面还有更大的；只有最后的学生摘了一穗很大的麦穗，虽然不一定是最大的，但他的结果是令人满意的。这段文字意在说明：","options":["生活即思想，思想源于生活实际","把握时机是人生快乐的最大诀窍","优秀哲学家都以其毕生精力在孕育智慧的田地里耕耘","苏格拉底一生注重实践，把哲学的注意力放在生活上"],"answer":"B","explanation":"正确答案：B，全站正确率：78%，易错项：A。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 16 - 解析第一步，分析文段。文段先介绍苏格拉底与三个学生走过麦田，并要求学生摘下一穗大的麦穗。结果一个学生因为想要找到最大的而空手而归；另一个学生走进麦田就急忙摘了一穗很小的麦穗；只有最后的学生摘了一穗很大的麦穗，虽然不是最大的，但是结果却是最好的。从这三个学生最后的结果可以得出时机的重要性，抓住时机摘下大麦穗，才是令人满意的结果。第二步，对比选项。A 项“生活即思想”无中生有。B 项“把握时机”是从文中提炼出的道理，“人生快乐的最大诀窍”与转折后的句子相符。C 项“优秀的哲学家在孕育智慧的田地里耕耘”无中生有，且“都以毕生精力” 说法过于绝对。D 项苏格拉底并不是文中故事的主要人物，且选项内容与文意无关。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-049","paperId":"jx2020","num":49,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"在移动阅读时代，自媒体的影响力不可小觑。由于拥有更广阔的传播路径和分发渠道，受公众关注度高，自媒体人掌握了一定话语权。有些自媒体人与传统媒体机构相比，确实不落下风，公信力给他们带来了收益。然而，公信力是把双刃剑，自媒体人既要看到流量背后的利益，也要认识到滥用自己的公信力会引发哪些负面效果，若以为可以仰仗传播力而“任性”，则实实在在打错了算盘。滥用话语权的后果，将直接影响自己辛苦树立起来的公信力，失去公众的支持与关注。这段文字意在强调：","options":["自媒体具有强大的影响力","自媒体人不应只关注收益","自媒体人应争取公众支持","自媒体的话语权不可滥用"],"answer":"D","explanation":"正确答案：D，全站正确率：86%，易错项：B。解析第一步，分析文段。文段先指出自媒体的影响力不可小觑，自媒体人掌握了一定话语权。接着用转折词“然而” 指出公信力是把双刃剑，滥用自己的公信力会引发负面效果，滥用话语权的后果将直接影响自己辛苦树立起来的的公信力，失去公众的支持与关注。文段重在表明不可以滥用话语权。第二步，对比选项。D 项是对文段重点的同义替换，符合文段意图。因此，选择D 选项。拓展 A 项、B 项和C 项：均与“不可滥用话语权”的话题无关。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-050","paperId":"jx2020","num":50,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"我国研究机构日前宣布，世界上第一个全超导托卡马克“东方超环”（EAST）实现了稳定的101.2 秒稳态长脉冲高约束等离子体运行，创造了新的世界纪录。这标志着EAST 成为世界上第一个实现稳态高约束模式运行持续时间达到百秒量级的托卡马克核聚变实验装置。EAST 高11 米、直径8 米、重达400 吨，是我国第四代核聚变实验装置，其科学目标是让海水中大量存在的氘和氚在高温条件下，像太阳一样发生核聚变，为人类提供源源不断的清洁能源，所以也被称为“人造太阳”。 - 7 - 这段文字主要说明了：","options":["大力发展清洁能源势在必行","核聚变技术可创造清洁能源","短期内难建成真正的“人造大阳”","“人造太阳”装置取得革命性突破"],"answer":"D","explanation":"正确答案：D，全站正确率：75%，易错项：B。解析第一步，分析文段。文段首句介绍了EAST 打破了新的世界纪录；第二句介绍了EAST 成为世界第一个稳态高约束模式运行持续时间达到百秒级的托卡马克核聚变实验装置；第三句介绍了EAST 的科学目标是给人类提供清洁能源，因此被成为“人造太阳”。整个文段三句话都是在强调EAST 的技术新突破。第二步，对比选项。D 项是对文段内容的全面概括。因此，选择D 选项。拓展 A 项：“大力发展清洁能源”在文中并没有提到，属于无中生有。B 项：“核聚变技术可创造清洁能源”只是EAST 的一个技术优势，表述片面。C 项：“短期内难建成真正的‘人造太阳’”在文段并没有提到，属于无中生有。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-051","paperId":"jx2020","num":51,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"社交恐惧症是焦虑障碍的一个重要亚型，其主要症状是害怕受到注视，例如害怕在大庭广众之下讲话等，症状严重时甚至不敢出门。害羞则是一种常见的人格特质，本身并不具有病理性。不过，绝大多数社交恐俱症患者在接受治疗之后，症状都会得到明显缓解，对于症状程度较轻的患者，应该首选心理治疗；如果患者因工作忙等原因不能或不愿意接受心理治疗，则可以首选药物治疗，但将药物治疗与心理治疗结合起来才是治疗社交恐惧症最有效的方法。此外，大多数社交恐惧症患者都起病于青少年时期，所以预防非常重要。根据这段文字，以下说法正确的是：","options":["害羞是社交恐惧症的一个重要亚型","社交恐惧症无法通过药物治疗治愈","中老年人不会成为社交恐惧症患者","症状程度较轻者用结合治疗最有效"],"answer":"D","explanation":"正确答案：D，全站正确率：81%，易错项：A。解析第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项不符合原文，原文强调“害羞则是一种常见的人格特质，本身并不具有病理性”，并没有提到害羞是社交恐惧症的一种重要亚型，排除A 项。B 项不符合原文，文段提到“如果患者因工作忙等原因不能或不愿意接受心理治疗，则可以首选药物治疗”，意味着社交恐惧症可以通过药物治疗，排除B 项。C 项不符合原文，文中提到“大多数社交恐惧症患者都起病于青少年时期”，并不意味着中老年人不会得社交恐惧症，排除C 项。D 项与原文相符，对应“对于症状较轻的患者……但将药物治疗与心理治疗结合起来才是治疗社交恐惧症最有效的方法”，意味着症状较轻的患者还是将药物与心理治疗结合才最有效。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-052","paperId":"jx2020","num":52,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"有研究团队让22 名17 岁至42 岁的志愿者在两周内每晚照常使用电子设备，但在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约 58%，上升幅度甚至超过服用褪黑激素补充剂带来的变化。志愿者感觉睡眼质量改善，入睡更快，整体睡眠时间延长，研究者说，最大的蓝光光源是日光，但大部分基于LED 灯的设备也会发出蓝光，“人造蓝光”会激活对褪黑激素有抑制作用的内在光敏视网膜神经节细胞，从而干扰睡眠。该研究者建议睡前少用电子设备，或佩戴防蓝光眼镜。从这段文字可以推出：","options":["电子设备的蓝光会减少褪黑激素的分泌而促进睡眠","天然的日光并不会激活内在光敏视网膜神经节细胞","睡前不佩戴防蓝光眼镜会使褪黑激素水平整体上升","提升褪黑激素水平有助于入睡更快和唾眠质量改善"],"answer":"D","explanation":"正确答案：D，全站正确率：87%，易错项：A。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项对应“‘人造蓝光’会激活……从而干扰睡眠”，A 项“减少褪黑激素分泌而促进睡眠” 与文段表述相悖，排除A 项。B 项对应“最大的蓝光光源是日光，但大部分基于LED 灯的设备也会发出蓝光，‘人造蓝光’会激活对褪黑激素有抑制作用的内在光敏视网膜神经节细胞，从而干扰睡眠”，可知天然的日光会激活内在光敏视网膜神经节细胞，B 项曲解文意，排除。C 项和D 项对应“在睡前佩戴三小时防蓝光眼镜，发现其晚间褪黑激素水平整体上升了大约58%，上升幅度甚至超过服用褪黑激素补充剂带来的变化。志愿者感觉睡眠质量改善，入睡更快，整体睡眠时间延长。”C 项表述与文段相悖，文段强调佩戴防蓝光眼镜才会使褪黑素水平上升，排除C 项。D 项表述符合文意。因此，选择D 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 17 -","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-053","paperId":"jx2020","num":53,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"生命存在的首要条件是液态水，一颗行星是否宜居取决于表面温度能否维持液态水的存在。冰行星或冰卫星地表原本被冰雪覆盖，此前研究认为，随着恒星辐射增强，其地表冰雪最终会融化形成液态水，从而适宜生命生存。不过，最新研究证明，随着恒星辐射增强，冰行星或冰卫星将直接进入极端炎热的温室逃逸状态，表面温度将升至100 摄氏度以上，液态水无法存在。一旦冰雪融化，行星地表反射能力的突然降低使其吸收恒星辐射的能力大大增强。此外，冰雪融化后，大量水汽进入大气，强温室效应也使地表温度进一步升高。下列说法与原文相符的是：","options":["宜居行星在事实上并不存在","冰行星或冰卫星其实不宜居","冰行星或冰卫星其实没有冰","温室逃逸状态阻止了冰融化"],"answer":"B","explanation":"正确答案：B，全站正确率：87%，易错项：A。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项“宜居行星是否存”在文段没有提及，属于无中生有，排除A 项。B 项对应“不过”之后的内容，介绍了冰行星和冰卫星不适宜生命生存，B 项符合文意。C 项对应“冰行星和冰卫星地表原本被冰雪覆盖”，表述与文段相悖，排除C 项。D 项对应“冰行星和冰卫星将直接进入极端炎热的温室逃逸状态，表面温度将升至100 摄氏度以上……”，可以得出温室逃逸并不会阻止冰融化，不符合文意，排除D 项。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-054","paperId":"jx2020","num":54,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"全球数以百计的医疗机构声称可用干细胞疗法修复多发性硬化症患者受损的组织细胞。专家指出，这些机构直接向患者打广告称可治愈疾病，而实际上没有任何证据表明它们有效或不会造成伤害。在这种情况下，处理相关广告十分必要，某些类型的干细胞移植，例如使用血液或皮肤干细胞，经全面临床试验证实能治疗特定种类的癌症以及让烧伤病人完成植皮手术，因而得到监督机构批准。专家称，虽然干细胞疗法前景广阔，但许多潜在的干细胞疗法仍处于研发的最初阶段，尚未得到监管机构的批准，还需要通过严格的临床试验和监管手续来确定其是否安全有效。这段文字意在说明:","options":["血液和皮肤干细胞已广泛用于治疗","干细胞疗法目前仍然存在一定风险","监管组织应引入有效广告管理措施","研发细胞和组织疗法仍是巨大挑战"],"answer":"B","explanation":"正确答案：B，全站正确率：57%，易错项：C。解析第一步，分析文段。文段首句引出话题，干细胞疗法可以修复多发性硬化症患者受损的组织细胞。通过“专家指出”和转折关联词“而”和“实际上”，说明还未确定干细胞疗法是否有效或者不会造成伤害。第三句话又举例说明干细胞疗法经全面临床试验才能治疗特定种类的疾病，因此需要监管机构批准。最后通过“专家称”和转折关联词“虽然……但”，引出文段的重点，虽然干细胞疗法前景广阔，但是仍处于研发阶段，并且尚未得到监管结构的批准，还需要通过严格的临床试验和监管手续来确定干细胞疗法是否安全有效。文段是“分—总”结构，最后一句话是重点。即现在还不能运用干细胞疗法，存在一定风险。第二步，对比选项。B 项是文段重点的同义替换，符合文段意图。因此，选择B 选项。拓展 A 项：“血液和皮肤干细胞”是例子内容，非重点。C 项：“监管组织应引入有效广告管理措施”，其中监管只是解决问题的一个部分，不能概括全部内容。D 项：“研发细胞”不是文段的主要话题，文段主要话题是“干细胞疗法”。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-055","paperId":"jx2020","num":55,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"蟑螂的生殖分为有性生殖和孤雌生殖两种方式。蟑螂雌性个体生活在完全由雌性组成的群体中时，会进行孤雌生殖，产卵的时间也会提前。研究者通过实验分别验证蟑螂性别和雌性激素对孤雌生殖的影响。首先，将一只雌性蟑螂和被阉割的雄性蟑螂放在一起饲养，发现这只雌性蟑螂产卵的时间没有发生变化；接着，又为雄性个体定期提供雌性激素，造成它们生活在雌性群体中的假象，但它们的产卵时间也没有提前。据此，研究者推测蟑螂需要雌性散发特有的化学信号才能完成孤雌生殖，并非因为性激素或者其他化学信号的参与。根据上述文字，下列说法正确的是：","options":["雄性的出现影响了蟑螂的产卵时间","纯雌性群体生活加快蟑螂繁殖速度","定期提供雌性激素对蟑螂毫无作用","孤雌生殖或依赖雌性特有化学信号 - 8 -"],"answer":"D","explanation":"正确答案：D，全站正确率：80%，易错项：B。解析第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项对应“研究者通过实验分别验证蟑螂性别和雌性激素对孤雌生殖的影响。首先，将一只雌性蟑螂和被阉割的雄性蟑螂放在一起饲养，发现这只雌性蟑螂产卵的时间没有发生变化”，曲解文意，排除A 项。B 项与原文不符，对应“蟑螂雌性个体生活在完全由雌性组成的群体中时，会进行孤雌生殖，产卵的时间也会提前”，没说会“加快繁殖速度”，排除B 项。C 项与原文不符，对应“又为雌性个体定期提供雌性激素，造成它们生活在雌性群体的假象，但它们的产卵时间也没有提前”，得不出“毫无作用”，表述过于绝对，排除C 项。D 项符合原文，对应尾句“研究者推测蟑螂需要雌性散发特有的化学信号才能完成孤雌生殖……”，D 项正确。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-056","paperId":"jx2020","num":56,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"人之所以能看到物体，是因为物体阻挡了光波的通过。如想让某个小球隐形，可在该小球的四周覆盖一层以同心圆形状排列的超材料，这种材料能挡住传来的一切光波，并且不发生反射或吸收现象。被挡开的波在物体的另一边再次会合后继续沿直线传播。在观察者看来，物体就似乎变得“不存在”了，也就实现了视觉隐身，简而言之，隐身衣使用的超材料，可以让雷达波、光线或者其他的波绕过物体而不会被反弹，进而达到不可视的效果。未来，隐形衣将被首先应用于军事领域，提高作战的隐蔽性和安全性。但如果任何人都可以实现隐形，也会引发一系列社会问题。与这段文字意思相符的一项是：","options":["隐身衣能够让光线穿透自身","物体阻挡光波使人能够视物","隐身衣用于军事会引发战争","使用超材料能够反弹雷达波"],"answer":"B","explanation":"正确答案：B，全站正确率：84%，易错项：A。解析第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项与原文不符，对应“这种材料能挡住传来的一切光波……，被挡开的波在物体的另一边再次汇合后继续直线传播”，得知隐身衣不是让光线穿透自身。排除A 项。B 项符合原文，对应首句“人之所以看到物体，是因为物体阻挡了光波的通过”。B 项正确。C 项与原文不符，对应尾句“未来，隐身衣首先应用于军事领域……，但如果任何人都可以实现隐形，也会引发一系列社会问题”。得知不是隐身衣用于军事会引发战争。排除C 项。D 项与原文不符，对应“隐身衣使用的超材料，可以让雷达波、光线或者其他的波绕过物体而不会被反弹”。D 项说能够反弹雷达波，故排除D 项。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-057","paperId":"jx2020","num":57,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"技术是一把“双刃剑”，应用得当可以造福社会，造福人民，应用不当会危害社会，危害人民。当前，从整个世界范围来看，网络安全威胁不断增加，信息安全问题日益突出。没有网络安全就没有国家安全，没有信息安全就谈不上让信息化更好造福人民。信息时代，人们享受着数字化生活带来的诸多便利。但网络黑客、互联网诈骗、侵犯个人隐私等又让很多人“中招”。可见，信息化应用越深入，就越要重视信息安全问题。这段文字意在强调：","options":["必须完善法律法规，为数字化生活提供法治保障","解决信息安全问题，提高数字化生活的安全系数","降低信息化应用成本，增进人民福祉，造福社会","提高数字化生活质量，就必须加强信息技术手段"],"answer":"B","explanation":"正确答案：B，全站正确率：88%，易错项：A。解析第一步，分析文段。文段首先提出技术是双刃剑。接着指出信息安全问题日益突出。最后强调“要重视信息安全问题”，为解决问题的对策，应选择对策的同义替换项。第二步，对比选项。B 项是文段中对策的同义替换，且为解决问题的合理对策，符合作者意图。因此，选择B 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 18 - 拓展 A 项：文段没有提及“法律法规”的话题，对策不当。C 项和D 项：缺少中心话题“信息技术安全”。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-058","paperId":"jx2020","num":58,"year":2020,"region":"江西","module":"言语理解与表达","sub":"语句表达","stem":"近来，多家情商教育机构针对不同年龄段推出相应套餐，“情商班”火爆家长圈，情商是控制和驾驭情绪的能力，对人的生活和工作有重要的作用。可是，在很多人的心里，情商的内涵已经被异化，最早的情商概念，和如今流行的情商观念大相径庭。许多人对情商的理解，是圆滑世故、阿谀奉承的另一种说法。实际上，情商的核心既是对自身情绪的认识和控制能力，也包括与人交往、融入集体的能力。这两种能力的培养，需要在日常生活中实践。孩子能否培养出良好的情绪控制能力和社交能力，很大程度上取决于家长，任何情商培训都无法取代日常生活中的情商培养。接下来最可能讲述的是：","options":["情商补习应当引起家长高度关注","家长在家庭教育中的身体力行","家长要理性地看待情商培训班","需要培养和提高家长的情商"],"answer":"B","explanation":"正确答案：B，全站正确率：60%，易错项：C。解析第一步，快速浏览文段，重点分析尾句，判别文段话题落脚点。文段以“情商教育机构的火爆”为背景引出许多人对情商的误解，转折之后提出了情商需要的两种能力，最后话题落在“任何情商培训都取代不了家长对孩子的情商培养”。故下文应该围绕家长对孩子情绪控制能力和社交能力的培养。第二步，对比选项。B 选项符合上下文语境。A 项和C 项和文段最后的话题不一致，文段最后话题应为“家长的做法”而非“情商补习班”。D 项“需要培养家长的情商”文段没有任何提及。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-059","paperId":"jx2020","num":59,"year":2020,"region":"江西","module":"言语理解与表达","sub":"语句表达","stem":"①语言是符号体系，而每一种语言的符号体系都带着文化的烙印，都是这种语言的共同体集体认知的结果，都是文化的载体，这是语言的“体” ②语言和文化是一体两面的，没有谁能够把语言和文化彻底分开，这是由语言的属性决定的 ③所以汉语国际教育不必把“文化传播”特意突出出来，因为学习一种语言不可能不涉及这种语言所负载的文化内容，这是不言而喻的 ④语言中隐含着的使用这种语言的人和社会群体的价值观念，而这种价值观念往往是习焉不察的 ⑤语言也是思维工具和交际工具，我们在使用一种语言思维和交际的时候不可能不受这种语言的影响，这好似语言的“用” 将以上5 个句子重新排列，语序正确的是：","options":["②①⑤④③","④①⑤②③","②⑤①③④","④②①⑤③"],"answer":"A","explanation":"正确答案：A，全站正确率：62%，易错项：B。解析第一步，对比选项，确定首句。②论述的是“言语和文化”的大概念，并由此引出“言语的属性”这一话题，适合作为首句。④讲的是言语中隐含着人的价值观，是对言语的论述，不优于②，排除B 项和D 项。第二步，对比A 项和C 项。①句从语言体系上来说明语言和文化的关系，和②句话题一致，且⑤句中的“也”是在②句基础上进行的补充类描述，故①句在前，⑤句在后，排除C 项。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-060","paperId":"jx2020","num":60,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"①用小小的木制手织机，固定在房角一柱上，一面伸出憔悴的手来 ②做母亲的全按照一个地方的风气，当街坐下，织男子们束腰用的板带过日子 ③当白日照到这长街时，这一条街静静的像在午睡 ④敏捷地把手中犬骨线板压着手织机的一端，退着粗粗的棉线，一面用一个棕叶刷子为孩子们拂着蚊蚋 ⑤许多小小的屋里，湿而发霉的土地上，头发干枯脸儿瘦弱的孩子们，皆蹲在土地上或伏在母亲身边睡着了 ⑥什么地方柳树桐树上有新蝉单纯而又倦人的声音","options":["③⑥⑤②①④","⑤①②④③⑥","⑥⑤①②④③","⑤①⑥②④③"],"answer":"A","explanation":"正确答案：A，全站正确率：55%，易错项：B。解析第一步，对比选项，确定首句。③讲的是“长街午睡”这一现象，⑤讲的是“屋里孩子们在睡觉”，⑥讲的是“蝉的疲倦”。对比③⑤⑥可知，③引出“午睡”这一话题，⑤⑥从“孩子”“蝉”的疲倦和困意来详细阐述这一话题，因此，⑤⑥不能做首句，排在③之后，锁定答案为A 项。第二步，验证A 项。③⑥⑤放在一起合适，⑤引出了“母亲”这一话题，②①④都在讲母亲们的做工，与⑤话题衔接紧密，并且②①④是按照“织男子们束腰用的板带”这一行为的动作先后顺序进行的，符合事理逻辑。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-061","paperId":"jx2020","num":61,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"当传统媒体还在琢磨受众喜欢什么内容的时候，算法推荐已迅速赢得了大量用户，媒体技术的变革，重塑了新闻产品的生产与分发，也重构了新媒体的内容生态。面对全媒体时代，我们需要用主流价值纾解“算法焦虑”、 - 9 - 用社会责任规范“内容生产”，用优质平台凝聚“众人之智”，以更多更好的正能量、主旋律内容供给，让舆论天空更清朗、舆论生态更健康。最适合做这段文字标题的是：","options":["给以主流价值为底色的传统媒体内容产品插上算法分发的翅膀","增强主流价值供给，纾解新媒体内容生产和传播中的技术问题","面对算法焦虑和流量焦虑，主流媒体要保持主流价值内容定力","用主流价值纾解“算法焦虑”：构建健康活跃的新媒体内容生态"],"answer":"D","explanation":"正确答案：D，全站正确率：70%，易错项：C。解析第一步，分析文段。第一句把“算法推荐”这个话题引出来，接下来谈整个媒体生态因此而改变。第三句出现对策引导词“需要”，告诉我们要用主流价值解决“算法焦虑”的问题，让整个舆论生态更健康，引出重点，所以整个文段是“分—总”结构，最后一句是主旨句。第二步，对比选项。A 选项插上算法的翅膀变成了做法，而文段的做法是用主流价值，问题则是“算法焦虑”，因此排除；B 选项所要解决的问题无法与主旨句对应，要解决的不是技术问题，而是“算法焦虑”，排除；C 选项“流量焦虑”属于无中生有，对策的主体文段也未说是主流媒体，排除；D 选项对应最后一句话，对策是主流价值，问题是“算法焦虑”，要达到的目的是让新媒体内容生态更健康，即文中“让舆论天空更清朗、舆论生态更健康”，尽管文段也谈了规范“内容生产”、凝聚“众人之智”，但整个文段核心话题是“算法”，因此重点就是谈“算法焦虑”，不算片面。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-062","paperId":"jx2020","num":62,"year":2020,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"作为一种积极有效的开发性保护模式，全域旅游强调旅游发展与资源环境承载能力相适应，要通过全面优化旅游资源、基础设施、旅游功能、旅游要素和产业布局，更好地疏解和减轻核心景点景区的承载压力，更好地保护核心资源和生态环境，实现设施、要素、功能在空间上的合理布局和优化配置，对推动生态保护新格局具有重要意义。最适合做这段文字标题的是：","options":["以全域旅游减轻景区的承载压力","以全域旅游推动生态保护新格局","以全域旅游资源观保护核心资源","以全域旅游环境观优化产业布局"],"answer":"B","explanation":"正确答案：B，全站正确率：73%，易错项：D。解析第一步，分析文段。文段先介绍全域旅游强调的重点以及通过多种途径实现的多种现实意义，最后全域旅游“对推动生态保护新格局具有重要意义”是对上文各种现实意义进行总结，也就是文段的重点是介绍全域旅游对推动生态保护新格局的意义。第二步，对比选项。B 项是对文段重点的同义替换，可以作为文段的标题。A 项“减轻景区的承载压力”，C 项 “保护核心资源”以及D 项“优化产业布局”都只提到全域旅游的一方面作用，片面。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-063","paperId":"jx2020","num":63,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"非遗曲艺周、非遗公开课、非遗影像展等3700 多项活动在全国同步展开，400 多项体验传承活动在20 多个省区市推出……刚刚过去的“文化和自然遗产日”，一系列精彩的活动让人们走进“养在深闺人未识”的文化遗产，感知岁月沉淀的文化魅力，也让人们意识到________________。填入划横线部分最恰当的一项是：","options":["文化遗产保护为先，还需要社会公众的高度参与","文化遗产可以摆脱高冷的标签，飞入寻常百姓家","如何让文化遗产“活”起来也是值得思考的话题","我国能有如此丰富的文化遗产，得益于保护管理"],"answer":"B","explanation":"正确答案：B，全站正确率：75%，易错项：A。解析第一步，分析横线处的上文语境。横线前指出一系列精彩的活动让人们走进“养在深闺人未识”的文化遗产，感获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 19 - 知岁月积淀的文化魅力，横线处应体现和人们走进遗产话题相关的句子。第二步，对比选项。B 项“文化遗产可以摆脱高冷的标签，飞入寻常百姓家”可以体现人们走进遗产这一话题，且能照应文段首句提到的多项活动，符合语境。因此，选择B 选项。拓展 A 项、C 项和D 项：“保护”“如何让文化遗产‘活’起来”的话题均无中生有。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-064","paperId":"jx2020","num":64,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"压缩空气储能属于一种物理方式的储能，即空气在整个过程中只存在温度、压强等状态的变化，而不会发生化学方面的变化。储存了众多电力的压缩空气需要放在一间封闭性极好的“屋子”里，而这间“屋子”的“主人” 就是盐。食盐开采后会自然留下一个场所，学名叫做“盐穴”。“盐穴”是一种极其宝贵的不可再生资源，并且密封性能良好。然而，长期以来这种资源的利用系数很低。由于盐岩具有良好的蠕变特性、自愈合特性，渗透率极低，并且不会与空气中的氧气发生反应。因此，________________。填入划横线部分最恰当的一项是：","options":["要依托盐穴资源的优势发展储能产业","“盐穴”是储存高压空气的理想场所","应当利用盐穴储能改善发电与用电","要大力开发盐岩提高能源利用效率"],"answer":"B","explanation":"正确答案：B，全站正确率：43%，易错项：A。解析第一步，横线位于文段尾句，分析横线上文语境。文段先论述压缩空气储能的定义，论述压缩空气需要存在一个密闭性极好的地方，接着引出“盐穴”的话题，主要论述“盐穴”的具有良好的特性，且不会与空气中的氧气发生反应，最后通过“因此”做总结，即论述“盐穴”是一个密闭性很好的地方，适合存储压缩空气。第二步，对比选项。B 项是对上文内容的总结，符合上述语境。因此，选择B 选项。拓展 A 项、C 项和D 项：均偏离话题“压缩空气”。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-065","paperId":"jx2020","num":65,"year":2020,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"苏区是一个坚实的实践样本，蕴含着整个中国近代历史的主题，主线，预示着中华民族的前途命运。苏区研究既属于历史主干研究，也属于历史支系研究。经过多年积累，目前的苏区研究，其广泛、细致的程度前所未有，堪称血肉丰满、________、支系发达。填入划横线部分最恰当的一项是:","options":["枝繁叶茂","繁花似锦","春色满园","生机盎然"],"answer":"A","explanation":"正确答案：A，全站正确率：78%，易错项：D。解析第一步，分析语境。填入词语和“血肉丰满”“支系发达”用顿号连接表示并列，因此，填入词语表达的意思应与“血肉丰满”“支系发达”语义相近，应含有“丰富、多”的含义。第二步，辨析选项。A 项“枝繁叶茂”指枝叶繁盛茂密，可引申为“丰富、多”之意。B 项“繁花似锦”意思是许多色彩纷繁的鲜花，好像富丽多彩的锦缎，形容美好的景色和美好的事物；C 项“春色满园”意思是整个园子里一片春天的景色，比喻到处都是欣欣向荣的景象；D 项“生机盎然”指充满生机和活力，形容生命力旺盛的样子。B 项、C 项和D 项均无法体现“丰富、多”的含义，不能与血肉丰满、支系发达构成并列，排除。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-066","paperId":"jx2020","num":66,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"在屋内墙角处堆放稻谷（如图，谷堆为一个圆锥的四分之一），谷堆底部的弧长为6 米，高为2 米，经过一夜发现谷堆在重力作用下底部的弧长变为8 米，若谷堆的谷量不变那么此时谷堆的高为：","options":["米","米","米","米 - 10 -"],"answer":"A","explanation":"正确答案：A，全站正确率：16%，易错项：C。解析解法一：第一步，本题考查几何问题，用比例法解题。第二步，变化前后谷量不变，也就是体积不变。由谷堆为一个圆锥的四分之一，变化前后圆锥半径之比与弧长之比一致，都为6∶8=3∶4，根据几何放缩性质可知底面积之比为9∶16，变化前后体积不变则高之比为反比，即 16∶9。变化前谷堆高为2，变化后高为。因此，选择A 选项。解法二：第一步，本题考查几何问题。第二步，由于谷堆是一个圆锥的四分之一，所以底面弧长应为底面圆周长的四分之一。当底面弧长是6 米时，底面周长应为24 米，根据周长公式C=2πr，，则此谷堆的体积；当底面弧长是8 米时，底面周长应为32 米;根据周长公式C=2 πr ，，则此谷堆的体积；根据谷堆谷量不变，即体积不变，可知，解得h= 。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-067","paperId":"jx2020","num":67,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某社区拟对一块梯形活动场地进行扩建，经测算，如果将梯形的上底边增加1 米，下底边增加1 米，则面积将扩大10 平方米；如果将梯形的上底边增加1 倍，下底边增加1 米，则面积将扩大55 平方米；如果将上底边增加1 米，下底边增加1 倍，则面积将扩大105 平方米。现拟将梯形的上底边增加1 倍还多2 米，下底边增加3 倍还多4 米，则面积将扩大多少？","options":["280 平方米","380 平方米","420 平方米","480 平方米"],"answer":"B","explanation":"正确答案：B，全站正确率：40%，易错项：C。解析第一步，本题考查几何问题，属于平面几何类。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 20 - 第二步，设梯形的上底、下底、高分别为a、b、h，根据“面积将扩大10 平方米”可得，解得h＝10（米）；根据“面积将扩大55 平方米”可得，解得a＝10（米）；根据“面积将扩大105 平方米”可得，解得b＝20（米）。第三步，如果上底增加1 倍多2 米变为22 米，下底边增加3 倍多4 米变为84 米，则面积将扩大（平方米）。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-068","paperId":"jx2020","num":68,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"小明每天从家中出发骑自行车经过一段平路，再经过一道斜坡后到达学校上课。某天早上，小明从家中骑车出发，一到校门口就发现忘带课本，马上返回，从离家到赶回家中共用了1 个小时，假设小明当天平路骑行速度为9 千米/小时，上坡速度为6 千米/小时，下坡速度为18 千米/小时，那么小明的家距离学校多远？","options":["3.5 千米","4.5 千米","5.5 千米","6.5 千米"],"answer":"B","explanation":"正确答案：B，全站正确率：52%，易错项：C。解析第一步，本题考查行程问题，属于基本行程类。第二步，根据题意，小明从家到学校进行往返，上下坡距离相等，可利用等距离平均速度求得千米/小时，由于平路速度也为9 千米/小时，往返总时间是1 小时，故往返总路程为9×1＝9 千米，则小明的家距离学校9÷2=4.5 千米。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-069","paperId":"jx2020","num":69,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙三人去超市买了100 元的商品，如果甲付钱，那么甲剩下的钱是乙、丙两人钱数之和的；如果乙付钱，则乙剩下的钱是甲、丙两人钱数之和的；如果丙付钱，丙用他的会员卡可享受9 折优惠，结果丙剩下的钱是甲、乙两人钱数之和的；那么，甲、乙、丙三人开始时一共带了多少钱？","options":["850 元","900 元","950 元","1000 元"],"answer":"A","explanation":"正确答案：A，全站正确率：10%，易错项：C。解析解法一：第一步，本题考查基础应用题，用数字特性法求解。第二步，根据“如果甲付钱，那么甲剩下的钱是乙、丙两人钱数之和的 ”可知，三人总钱数-100 后剩下的总钱数应该是15 的倍数，则选项-100 后不能整除15 的即可排除，排除B、C；根据“如果乙付钱，那么乙剩下的钱是甲、丙两人钱数之和的 ”可知，三人总钱数-100 后剩下的总钱数应该是25 的倍数，则选项-100 后不能整除25 的即可排除，剩下的选项中A、D 都满足此条件，暂且均保留；根据“丙付钱可享受9 折优惠，丙剩下的钱是甲、乙两人钱数之和的 ”可知，三人总钱数-90 后剩下的总钱数应该是4 的倍数，A 和D 选项中只有A 满足条件。因此，选择A 选项。解法二：第一步，本题考查基础应用题，用方程法解题。第二步，设三人共带了x 元，由甲剩下的钱是乙丙的，那么甲剩下的钱是剩余总数x-100 的；同理乙剩下的钱是剩余总数x-100 的，丙打9 折只需要90 元，那么丙剩下的钱是剩余总数x-90 的。由此可列出方程：，解得x=850。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-071","paperId":"jx2020","num":71,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某篮球队共有九人，分三组举行三人制篮球赛，他们的球衣号码分别是从1 号到9 号，分组后发现三组的球衣号码之和不同，且最大和是最小和的两倍。则各组号码之和不可能是下列哪个数？","options":["10","11","12","13"],"answer":"D","explanation":"正确答案：D，全站正确率：19%，易错项：C。解析解法一：第一步，本题考查基础计算问题，用代入排除法解题。第二步，1—9 数字之和为5×9=45，依次代入选项：A 选项，当号码和为10 且为最小组的号码和，则最大的组是其两倍为20，另一组为45-10-20=15，10＜15＜20，符合题意；B 选项，当号码和为11 且为最小组的号码和，最大的组是其两倍为22，另一组为45-11-22=12，11＜12＜22，符合题意。（由于代入B 选项时，其中一组号码和为12，故C 选项12 也可满足）因此，选择D 选项。解法二：第一步，本题考查基础计算问题。第二步，1—9 数字之和为5×9=45，根据最大组号码之和是最小组的两倍，设最小组为x，则最大组为2x，中间组为45-3x，可知，中间组一定为3 的倍数；最大组号码之和最大为7+8+9=24，则最小组号码之和最大为24÷ 2=12，D 选项大于12 且不是3 的倍数，不可能成立。因此，选择D 选项。拓展等差数列前n 项和＝中位数×项数","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-072","paperId":"jx2020","num":72,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某学习平台的学习内容由观看视频、阅读文章、收藏分享、论坛交流、考试答题五个部分组成。某学员要先后学完这五个部分，若观看视频和阅读文章不能连续进行，该学员学习顺序的选择有：","options":["24 种","72 种","96 种","120 种"],"answer":"B","explanation":"正确答案：B，全站正确率：50%，易错项：C。解析第一步，本题考查排列组合问题，用插空法解题。第二步，观看视频和阅读文章不能连续进行，先把收藏分享、论坛交流和考试答题排列好，共有＝6（种）方式，这三部分形成4 个空，需在4 个空中插入“观看视频”和“阅读文章”，有＝12（种）方式，那么共有 6×12＝72（种）学习顺序。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-073","paperId":"jx2020","num":73,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某城市一条道路上有4 个十字路口，每个十字路口至少有一名交通协管员，现将8 个协管员名额分配到这4 个路口，则每个路口协管员名额的分配方案有：","options":["35 种","70 种","96 种","114 种"],"answer":"A","explanation":"正确答案：A，全站正确率：9%，易错项：C。解析第一步，本题考查排列组合问题，属于方法技巧类。第二步，根据插板法的使用条件：将n 个相同的元素分给m 个组，每组至少得一个，总的分配方法为。此题符合插板法模型，直接套用公式。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-074","paperId":"jx2020","num":74,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"小王在荡秋千，当秋千摆角为30°时，它摆到最高位置与最低位置的高度差为0.45 米。小王为寻求更大的刺激感，将秋千摆角增加15°，则秋千能摆到的最高位置约上升了多少米？（，）","options":["0.15 米","0.24 米","0.37 米","0.41 米"],"answer":"D","explanation":"正确答案：D，全站正确率：10%，易错项：C。解析第一步，本题考查几何问题，属于其他几何类问题。第二步，根据题意，秋千的摆绳长度是固定的，假设其长度为l，秋千摆角为30°时，则根据30°直角三角形性质可得，米，解得l＝3 米；秋千摆角增加15°时，根据45°直角三角形性质可得，米，因此秋千摆到最高位置上升了0.86－0.45＝0.41 米。因此，选择D 选项。拓展 30°，60°，90°直角三角形边长比例关系：1∶√3∶2 45°，45°，90°直角三角形边长比例关系：1∶1∶√2","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-075","paperId":"jx2020","num":75,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"甲乙丙丁四人通过手机的位置共享，发现乙在甲正南方向2 公里处，丙在乙北偏西60°方向2 公里处，丁在甲北偏西75°方向。若丁与甲、丙的距离相等，则该距离为：","options":["1 公里","公里","公里","2 公里"],"answer":"B","explanation":"正确答案：B，全站正确率：41%，易错项：C。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 22 - 解析第一步，本题考查平面几何问题。第二步，由题意可得，甲、乙、丙、丁四人位置关系如下图所示：第三步，甲乙＝乙丙＝2 公里，∠乙＝60°，故甲、乙、丙三人位置关系成等边三角形，那么甲丙的距离为2 公里；甲丁＝丙丁，∠丁甲丙＝15＋30＝45°，故甲、丙、丁三人位置关系为等腰直角三角形，甲丙的距离为2 公里，根据等腰直角三角形对应边比例为1∶1∶ ，可得丁与甲、丙距离为＝（公里）。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-076","paperId":"jx2020","num":76,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某工厂先从边长为1 米的正方形铁皮切割掉一个半径1 米、圆心角为直角的扇形，再用剩余材料切割正方形。为充分利用原材料，希望所得正方形越大越好。若不考虑切割损耗，问所切最大的正方形边长约为多少厘米？","options":["22.6","25.6","27.6","31.6"],"answer":"C","explanation":"正确答案：C，全站正确率：46%，易错项：B。解析第一步，本题考查几何问题，属于平面几何类。第二步，如图所示：大正方形边长为1 米=100 厘米，则OC= 厘米，扇形半径为1 米，即OA=100 厘米， AC= -100=100（√2-1），则所切的最大正方形ABCD 的边长约为（厘米），结合选项，最大选27.6。因此，选择C 选项。拓展取，计算出所切最大的正方形边长为28.6，但由于选项中没有设置，故选择27.6","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-079","paperId":"jx2020","num":79,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某电商平台每隔5 千米有一座仓库，共有A、B、C、D 四座仓库，图中数字表示各仓库库存货物的吨数。现需要把所有的货物集中存放在其中某一个仓库中，如果每吨货物运输1 千米需要运费3 元，要使运费最少，则需将货物集中到哪座仓库？","options":["仓库A","仓库B","仓库C","仓库D"],"answer":"C","explanation":"正确答案：C，全站正确率：57%，易错项：B。解析第一步，本题考查其他杂题。第二步，以B、C 中间为界，左边货物（A 和B）共有10＋20＝30（吨），右边货物（C 和D）共有15＋25＝40 （吨），左边货物较轻，所以将左边的货物往右边移动，A、B 货物均移到C，此时C 点共有货物30＋15＝45（吨）。第三步，以C、D 中间为界，C 点货物有45 吨，D 点货物有25 吨，D 点货物较轻，所以将D 点货物移动到C 点，使得运费最少，故将货物集中在C 仓库。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-080","paperId":"jx2020","num":80,"year":2020,"region":"江西","module":"数量关系","sub":"数学运算","stem":"村民陶某承包一块长方形种植地，他将地分割成如图所示的4 个小长方形，在A、B、C、D 四块长方形土地上分别种植西瓜、花生、地瓜、水稻。其中长方形A、B、C 的周长分别是20 米、24 米、28 米，那么长方形D 的最大面积是：","options":["42 平方米","49 平方米","64 平方米","81 平方米"],"answer":"C","explanation":"正确答案：C，全站正确率：55%，易错项：B。解析第一步，本题考查平面几何问题，用方程法解题。第二步，设A 的长和宽分别为x、y，由长方形A 周长为20 米，可得x＋y＝10；由长方形B 周长24 米，且长方形B 与长方形A 的长相同，可得B 的长和宽分别为x、y+2；由长方形C 周长28 米，且长方形C 与长方形A 的宽相同，可得C 的长和宽分别为x+4、y。那么长方形D 的面积S=（x+4）（y+2）＝（x＋4）（10－x＋2）＝（x ＋4）（12－x），当且仅当x＋4＝12－x，即x＝4 时S 取最大值，此时S＝64，故长方形D 的最大面积为64 平方米。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-081","paperId":"jx2020","num":81,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"在市场竞争十分激烈的时候，一个企业要是不激流勇进，创造出富有竞争力的产品，也不适时撤退、主动割爱，放弃没有前景的市场，那么这个企业最后一定会陷入危机之中。如果以上论断为真，下列说法正确的是：","options":["某企业未能创造出富有竞争力的产品，最后一定会惨遭淘汰","某企业紧要关头急流勇退，转向其它市场，就可以避免危机","某企业放弃已显颓势的产业，转向新产品的开发，它可能不会被淘汰","某企业研发出了富有竞争力的产品，它最后一定不会陷入危机之中"],"answer":"C","explanation":"正确答案：C，全站正确率：78%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 24 - 第一步，确定题型。根据题干中的“要是……，那么……”，确定为翻译推理。第二步，翻译题干。 ①不激流勇进（没有创造出富有竞争力的产品）且不适时撤退（不放弃没有前景的市场）→陷入危机第三步，进行推理。 A 项：“未能创造出富有竞争力的产品”是对①前面“且关系”一部分的肯定，根据且关系“全真才真”，可知该项确定，无法推出必然结论，排除； B 项：“激流勇退”“转向其他市场”是对①前面“且关系”的否定，属于“否前”，否前推不出必然结论，排除； C 项：“放弃显颓势的产业”是对①前面“且关系”的否定，属于“否前”，否前推不出必然结论，但是可以推出“可能性结论”，该项可以推出； D 项：“研发出了富有竞争力的产品”是对①前面“且关系”的否定，属于“否前”，否前推不出必然结论，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-082","paperId":"jx2020","num":82,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"越是身处浮华的地方，我们越是希望能遇到一块心灵栖息地。虽然我们生活在一个商业化社会，但书店仍然是灵魂的慰藉之地。大到城市，小到商场，若能有一家文化味浓郁的书店，一定能让人们感受到不一样的氛围。书店入驻商场，这不仅能给商场带来客流，也能提升商场的品位。以书店融合阅读、休闲和其他文化产品的类似 “文化商场”模式，更是可以在商场内部构建一个特别的文化链。如果以上论断为真，则下列说法正确的是","options":["城市让人们感受到不一样的氛围，是因为拥有文化味浓郁的书店","想要在商场内部构建一个特别的文化链，就不应忽视书店这一环","因为书店提升了商场的品味，所以书店给商场带来了客流","即便不是身处浮华的地方，我们也能遇到一块心灵栖息地"],"answer":"B","explanation":"正确答案：B，全站正确率：74%，易错项：A。解析第一步，确定题型。依据题干特征和提问方式，确定为归纳推理。第二步，辨析选项。 A 项：原题干中提到书店能让人感受到不一样的氛围，但感受到氛围并不一定因为有书店，排除； B 项：原题干中提到“以书店融合阅读、休闲和其他文化产品的类似‘文化商场’模式，更是可以在商场内部构建一个特别的文化链”，说明书店是必要的，因而“不应忽视书店这一环”，可以推出； C 项：“带来客流”、“提升品位”原题干中的关系为“不仅……也”，即并列的“且”关系，而非“因为…… 所以”的因果关系，排除； D 项：原题干中越是身处浮华的地方，越是希望遇到心灵栖息地，但不处于浮华之地，只能得出可能希望遇到心灵栖息地，该项说法过于绝对，排除。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-083","paperId":"jx2020","num":83,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"师范类院校学生来自全国各地，甲大学是师范类院校，所以甲大学的学生来自全国各地。下列选项所犯逻辑错误与上述推理最相似的是：","options":["牛不是食肉动物，而狮子不是牛，所以狮子不是食肉动物","父母爱读书的孩子爱运动，小黄爱运动，所以小黄的父母爱读书","私人捐赠的教学楼遍布全国各高校，何况是邵逸夫先生捐赠的逸夫楼","文明司机都是礼让行人的，有些公务司机礼让行人，所以有些公务司机是文明司机"],"answer":"C","explanation":"正确答案：C，全站正确率：27%，易错项：B。解析第一步，确定题型。根据提问方式“推理最为相似”，确定为平行结构。第二步，分析题干推理形式。将题干中的各个集合均用字母替代，“师范类院校的学生”为A，“分布于全国各地”为B，“甲大学的学生” 为C，则题干结构可表示为A→B，C→A（因为甲大学是师范类院校），所以C→B。第三步，辨析选项。 A 项：“牛”为A，“不是食肉动物”为B，“狮子”为C，则该项的推理结构可表示为A→B，C→¬A，所以C→B，与题干推理形式不同，排除； B 项：“父母爱读书”为A，“孩子爱运动”为B，“小黄”为C，则该项的推理结构可表示为A→B，C→B，所以C→A，与题干推理形式不同，排除； C 项：该句中的“何况”是反问，表示肯定语气，原句可理解成“邵逸夫先生捐赠的逸夫楼是私人捐赠的教学楼，所以逸夫楼遍布全国各高校”。其中“私人捐赠的教学楼”为A，“遍布全国各高校”为B，“邵逸夫先生捐赠的逸夫楼”为C，则该项的推理结构可表示为A→B，C→A，所以C→B，与题干推理形式相同，符合； D 项： “文明司机”为A，“礼让行人”为B，“有些公务司机”为C，则该项的推理结构可表示为A→B，C→ B，所以C→A，与题干推理形式不同，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-084","paperId":"jx2020","num":84,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"近年来，“类脑计算”从理念走向实践，正走出一条制造类人智能的新途径。所谓“类脑计算”，是指仿真、模拟和借鉴大脑神经系统结构和信息处理过程的装置，模型和方法，其目标是制造类脑计算机。然而有人提出质疑：大脑奥秘尚未揭示，我们还不了解智能背后的基本原理，怎么能制造出具有“大脑智能”的类脑计算机呢？以下哪项如果为真，最能反驳上述质疑？ - 12 -","options":["类脑计算机的器件速度是生物神经元和突触的百万倍，一旦产生智能，后果难以预料","关于“类脑计算”的伦理制度和风险评估等必须与“类脑计算”的技术发明同步展开","揭示大脑奥秘和发明类脑计算机是相互作用的复杂过程，不是“前者决定后者”的简单关系","国内已经启动集合各高校、科研机构和企业优势研究力量的10 多项“类脑计算”研究项目"],"answer":"C","explanation":"正确答案：C，全站正确率：81%，易错项：D。解析第一步，确定题型。根据提问方式中的“反驳”，确定为削弱论证。第二步，找论点和论据。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 25 - 论点：大脑奥秘尚未揭示，我们还不了解智能背后的基本原理，不能制造出具有“大脑智能”的类脑计算机。论据：所谓“类脑计算”，是指仿真、模拟和借鉴大脑神经系统结构和信息处理的装置、模型和方法，其目标是制造类脑计算机。第三步，辨析选项。 A 项：无关选项。该项讨论的是类脑计算机的器件速度快和一旦产生智能所发生的后果，与论点讨论的“大脑奥秘和发明类脑计算机之间的关系”无关，论题不一致，排除。 B 项：无关选项。“类脑计算”的伦理制度和风险评估与“类脑计算”的技术发明必须同步展开，与论点讨论的 “大脑奥秘和发明类脑计算机之间的关系”无关，论题不一致，排除。 C 项：增加反向论据。该项讨论的是“大脑奥秘和发明类脑计算机不是简单的决定关系”，也就说明不能因为大脑奥秘尚未揭示，就得出不能制造出具有“大脑智能”的类脑计算机的结论，具有削弱作用。 D 项：无关选项。该项讨论的是国内已经启
