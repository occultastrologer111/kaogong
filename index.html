无明显规律，考虑开闭性。图①④⑥均为半开半封闭图形；图②③⑤均为全封闭图形。因此①④⑥一组，②③⑤一组。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-086","paperId":"jx2019","num":86,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"投资市场相反理论是指投资市场本身并不创造新的价值，没有增值，甚至可以说是减值。如果一个投资者在投资行动时同多数投资者相同，那么他一定不是获利最大的，因为不可能多数人获利；要获得最大的利益，一定要同多数人的行动不一致。根据上述定义，下列选项不符合投资市场相反理论的是：","options":["“已经跌这么多了，该到底了”","“在市场投资者爆满的时候，我们再离场”","“只要你和多数投资者的意见相左，致富机会永远存在”","“人弃我取，别人恐惧我贪婪”"],"answer":"A","explanation":"第一步：找出定义关键词。 “投资市场本身并不创造新的价值，没有增值，甚至可以说是减值”、“要获得最大的利益，一定要同多数人的行动不一致”。第二步：逐一分析选项。 A 项：该项只说了投资产品价值的变化，并没有提及投资者人数是多还是少，以及投资者的策略是否相同，不符合定义，选非题，当选； B 项：该项提到在投资者非常多的时候我们再离场，表明我们与大多数投资者的策略是不相同的，符合“要获得最大的利益，一定要同多数人的行动不一致”，符合定义，选非题，排除； C 项：该项说明投资者在投资时，选择和多数投资者不同的意见就可以成功，这符合“要获得最大的利益，一定要同多数人的行动不一致”，符合定义，选非题，排除； D 项：该项表明“我”和大多数投资者的投资策略是不同的，大家害怕投资失败选择放弃的时候，而“我”为了追求利润会选择购买，符合“要获得最大的利益，一定要同多数人的行动不一致”，符合定义，选非题，排除。本题为选非题，故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-087","paperId":"jx2019","num":87,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"似动是指在一定的时间和空间条件下，人们在静止的物体间看到了运动，或者在没有连续位移的地方，看到了连续位移。根据上述定义，下列选项不属于似动现象的是：","options":["两岸青山相对出","坐地日行八万里","郡邑浮前浦，波澜动远空","明月却多情，随人处处行"],"answer":"B","explanation":"第一步：找出定义关键词。 “在一定的时间和空间条件下”、“人们在静止的物体间看到了运动”、“或者在没有连续位移的地方，看到了连续位移”。第二步：逐一分析选项。 A 项：“两岸青山相对出”意思是两岸的青山相继出迎，一座座扑进眼帘。青山本是静止的物体，但是作者却看到了它的运动，符合“人们在静止的物体间看到了运动”，符合定义，排除； B 项：“坐地日行八万里”意思是人们住在地球上，因地球自转，于不知不觉中，一日已行了八万里路。依据科学理论，当我们处于赤道附近的时候，即使每天原地不动，也会运动八万华里，即人没有动，而且也看不见运动。所以不符合“在静止的物体间看到了运动”、“或在没有连续位移的地方，看到了连续位移”，不符合定义，当选； C 项：“郡邑浮前浦，波澜动远空”意思是远处的城郭好像在水面上飘动，波翻浪涌，辽远的天空也仿佛为之摇荡。但是事实上，城郭本身不会运动，天空也不会飘荡，符合“人们在静止的物体间看到了运动”，符合定义，排除； D 项：“明月却多情，随人处处行”意思是明月却是那么多情，不管人走到哪里，它都陪伴着你同行。但是我们获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 17 - 用肉眼是看不到明月本身在运动的，所以符合“人们在静止的物体间看到了运动”，符合定义，排除。本题为选非题，故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-088","paperId":"jx2019","num":88,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"关怀强迫症即一个人特别需要别人依赖自己，总是爱向别人提供别人不需要的关怀。并且，这种人还强迫别人接受自己的关怀，从而使别人不能独立。当别人依赖自己的时候，他就会感到满足，感到自己有价值。这种症状会压抑人的神经，并同时给身边的亲朋好友甚至一般的同事带来诸多不便。根据上述定义，下列属于关怀强迫症的是：","options":["张某说：“我一天没见到儿子就会发疯”","李某连哄带骗让感冒的女儿吃下感冒药","刘某从小学到大学期间都住自己家里","王某在女儿就读的大学附近租房陪读"],"answer":"D","explanation":"第一步：找出定义关键词。 “需要别人依赖自己”、“提供别人不需要的关怀”、“强迫别人接受”、“使别人不能独立”。第二步：逐一分析选项。 A 项：张某一天没见到儿子就会发疯，说明是张某依赖儿子，而并非是儿子依赖自己，不符合“需要别人依赖自己”，不符合定义，排除； B 项：李某连哄带骗让感冒的女儿吃下感冒药，没有体现“需要别人依赖自己”，且感冒的女儿需要被人关怀照顾，不符合“提供别人不需要的关怀”，不符合定义，排除； C 项：刘某上学期间住在家里，是他的自愿行为，没有体现到强迫别人，不符合“强迫别人接受”，不符合定义，排除； D 项：王某在女儿就读的大学附近租房陪读，女儿已经读大学了，说明她已经能够自理的生活和学习，符合 “提供别人不需要的关怀”，“强迫别人接受”，符合定义，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-089","paperId":"jx2019","num":89,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"虚拟现实技术是指一种可以创建和体验虚拟世界的仿真系统，它利用计算机生成可交互的三维环境，向使用者提供视觉、听觉、触觉等感官的模拟，从而让人有身临其境之感，这是一种360 度视角的沉浸式体验。根据上述定义，下列选项属于虚拟现实技术运用的是：","options":["张三通过电脑与远在巴黎的父亲视频聊天，亲眼见到了埃菲尔铁塔","李四用手机微信与妻子视频聊天，亲耳听到了儿子背诵古诗的声音","刘五戴上特制头盔网购书桌，能够全方位地体验书桌摆进书房的效果","王二用平板电脑看同学在西藏旅游的视频，感觉自己也到了布达拉宫"],"answer":"C","explanation":"第一步：找出定义关键词。 “指一种可以创建和体验虚拟世界的仿真系统”、“它利用计算机生成可交互的三维环境，向使用者提供视觉、听觉、触觉等感官的模拟”、“从而让人有身临其境之感，是一种360 度视角的沉浸式体验。” 第二步：逐一分析选项。 A 项：张三通过电脑与远在巴黎的父亲视频聊天，亲眼见到了埃菲尔铁塔，看到的埃菲尔铁塔是现实世界的景物，并不是虚拟的，不符合“是一种可以创建和体验虚拟世界的仿真系统”，也不符合“向使用者提供视觉、听觉、触觉等感官的模拟”，不符合定义，排除； B 项：李四用微信与妻子视频聊天，亲耳听到了儿子背诵古诗的是声音，儿子背诵古诗的声音也是现实世界的声音，并不是虚拟的，不符合“是一种可以创建和体验虚拟世界的仿真系统”，也不符合“向使用者提供视觉、听觉、触觉等感官的模拟”，不符合定义，排除； C 项：刘五戴上特制头盔，能够全方位地体验书桌摆进书房的效果，符合“向使用者提供视觉、听觉、触觉等感官的模拟”、“是一种360 度视角的沉浸式体验”，符合定义，当选； D 项：王二用平板电脑看同学在西藏旅游的视频，感觉自己也到了布达拉宫，王二观看视频的过程，不符合“创建和体验虚拟世界的仿真系统”，不符合定义，排除。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-090","paperId":"jx2019","num":90,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"组织认同是指组织成员在行为或观念等诸方面与其所加入的组织具有一致性，觉得自己在组织中既有理性的契约和责任感，也有非理性的归属和依赖感，以及在这种心理基础上表现出的对组织活动尽心尽力的行为结果。根据上述定义，下列选项不属于组织认同的是：","options":["“我们要以共产党员的标准严格要求自己”","“公司面临困难的时候，我们要不离不弃”","“我要每时每刻自觉维护公司的良好形象”","“今日我以母校为傲，明日母校以我为荣”"],"answer":"A","explanation":"第一步：找出定义关键词。 “组织成员在行为或观念等诸方面与其所加入的组织具有一致性”、“自己在组织中既有理性的契约和责任感”、 “也有非理性的归属和依赖感”、“表现出的对组织活动尽心尽力的行为结果”。第二步：逐一分析选项。 A 项：该项中提及到的“我们”是否是党员未知，不知道是不是组织内部，并没有“表现出对组织活动尽心尽力的行为结果”，不符合定义，当选； B 项：该项体现了员工对公司的责任感以及归属感，符合“自己在组织中既有理性的契约和责任感”、“也有非理性的归属和依赖感”，且面对困难也不放弃，还一直坚守，尽心尽力的为公司工作，符合“表现出对组织活动尽心尽力的行为结果”，符合定义，排除； C 项：该项中自觉维护公司的良好形象，符合“自己在组织中既有理性的契约和责任感”，“也有非理性的归属和依赖感”、“表现出对组织活动尽心尽力的行为结果”，符合定义，排除； D 项：该项是指学生和母校互相为各自取得的成绩骄傲，体现了组织成员与组织之间相互的认同，表明成员与组织在行为或观念上具有一致性，“今日我以母校为傲”符合“组织成员在行为或观念等诸方面与其所加入的组织具有一致性”，且“明日母校以我为荣”，反过来做出成绩让母校为傲，“表现出对组织活动尽心尽力的行为结果”，符合定义，排除。本题为选非题，故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-091","paperId":"jx2019","num":91,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"意志的活动过程会体现以下两大定律。其中，意志强度边际效应定律是指意志的强度随着自身行为的活动规模的增长而下降；意志强度时间衰减定律是指意志的强度随着自身行为的持续时间的增长而呈现负指数下降。根据上述定义，下列选项最能体现意志强度时间衰减定律的是：","options":["锲而舍之，朽木不折","为山九仞，功亏一篑","穷且益坚，不坠青云之志","一鼓作气，再而衰，三而竭"],"answer":"D","explanation":"第一步：找出定义关键词。意志强度边际效应定律：“意志强度”、 “随自身行为的活动规模增长而下降”；意志强度时间衰减定律：“意志强度”、“随自身行为的持续时间增长而呈现负指数下降”。第二步：逐一分析选项。 A 项：“锲而舍之，朽木不折”意思是说如果不坚持做一件事，就算是腐朽的木头也无法折断，说明人们不坚持做一件事的后果，不符合“随自身行为的持续时间增长”，不符合定义，排除； B 项：“为山九仞，功亏一篑”意思是说堆九仞高的山，只缺一筐土导致不能完成，是用来比喻做事情只差最后一点没能完成，说明没有一直坚持下去，不符合“随自身行为的持续时间增长”，不符合定义，排除； C 项：“穷且益坚，不坠青云之志”意思是说一个人处境越是艰难,就越是坚忍不拔,越是不丢失高远之志，说明持续时间长但是志向没有丢失，不符合“呈现负指数下降”，不符合定义，排除； D 项：“一鼓作气，再而衰，三而竭”意思是说，第一次击鼓士气会大大的增加，第二次击鼓士气就会减弱了，第三次击鼓就没有士气了，说明士气随着时间的增加而减弱，符合“随时间增长而呈现负指数下降”，符合定义，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 18 - 当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-092","paperId":"jx2019","num":92,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"类脑计算技术总体分为三个层次：结构层次模仿脑、器件层次逼近脑、智能层次超越脑。其中，结构层次模仿脑是指将大脑作为一个物质和生理对象进行解析，获得基本单元(各类神经元和神经突触等)的功能及其连接关系（网络结构）；器件层次逼近脑是指研制能够模拟神经元和神经突触功能的器件，从而在有限的物理空间和功耗条件下构造出人脑规模的神经网络系统；智能层次超越脑是指通过对类脑计算机进行信息刺激、训练和学习，使其产生与人脑类似的智能。根据上述定义，下列属于智能层次超越脑的是：","options":["调整神经网络的突触连接关系及连接频率和强度","绘制精确的人类大脑动态图谱以解析探测大脑","开发功能、密度与人类大脑皮层相当的电子装备","捕捉细微的单个神经元放电的非线性动力学过程"],"answer":"A","explanation":"第一步：找出定义关键词。结构层次模仿脑：“将大脑作为物质和生理对象进行解析”、“获得基本单元的功能及其连接关系”；器件层次逼近脑：“研制能够模拟神经元和神经突触功能的器件”、“构造出人脑规模的神经网络系统”；智能层次超越脑：“对类脑计算机进行信息刺激、训练和学习”、“产生与人脑类似的智能”。第二步：逐一分析选项。 A 项：调整神经网络的突触连接关系及连接频率和强度，符合“对类脑计算机进行信息刺激、训练和学习” ，符合“智能层次超越脑”定义，当选； B 项：绘制精确的人类大脑动态图谱，符合“将大脑作为物质和生理对象进行解析”，符合“结构层次模仿脑” 定义，不符合“智能层次超越脑”定义，排除； C 项：开发功能、密度与人类大脑皮层相当的电子装备，符合“研制能够模拟神经元和神经突触功能的器件”，符合“器件层次逼近脑”定义，不符合“智能层次超越脑”定义，排除； D 项：捕捉细微的单个神经元放电的非线性动力学过程，符合“获得基本单元的功能及其连接关系”，符合“结构层次模仿脑”定义，不符合“智能层次超越脑”定义，排除。故正确答案为A。注：本题目来自于《类脑计算机的现在与未来》，各选项对应于该文章中的句子如下所示： A 项：所谓“智能层次超越脑”，属于类脑计算机应用软件层次的问题，是指通过对类脑计算机进行信息刺激、训练和学习，使其产生与人脑类似的智能甚至涌现出自主意识，实现智能培育和进化。刺激源可以是虚拟环境，也可以是来自现实环境的各种信息（例如互联网大数据）和信号（例如遍布全球的摄像头和各种物联网传感器），还可以是机器人“身体”在自然环境中探索和互动。在这个过程中，类脑计算机能够调整神经网络的突触连接关系及连接强度，实现学习、记忆、识别、会话、推理以及更高级的智能； B 项：所谓“结构层次模仿脑”，是将大脑作为一个物质和生理对象进行解析，获得基本单元（各类神经元和神经突触等）的功能及其连接关系（网络结构）； C 项：所谓“器件层次逼近人脑”，是指研制能够模拟神经元和神经突触功能的微纳光电器件，从而在有限的物理空间和功耗条件下构造出人脑规模的神经网络系统。这方面的代表性项目是美国国防部先进研究项目局（DARPA） 2008 年启动的“神经形态自适应可塑性可扩展电子系统”（即突触），其目标是研制出器件功能、规模与密度均与人类大脑皮层相当的电子装置； D 项：所谓“结构层次模仿脑”，是将大脑作为一个物质和生理对象进行解析，获得基本单元（各类神经元和神经突触等）的功能及其连接关系（网络结构）。这一阶段，主要通过神经科学实验采用先进的分析探测技术完成。 1952 年，英国科学家霍奇金和赫胥黎提出了以两人命名的HH 方程，精确刻画了单个神经元放电的非线性动力学过程，这是神经元信息处理的标准数学模型。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-093","paperId":"jx2019","num":93,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"时间感知扭曲是指对时间不正确的知觉。在生活中，受各种因素影响，人们对时间的感知往往会不符合实际，有时候觉得时间过长，有时候觉得时间太短。许多原因都可以造成时间感知扭曲，现实中一场糟糕的表演会让人如坐针毡、觉得终场遥遥无期，与此相反的是，人们对于美好愉快的时光总嫌太短。根据上述定义，下列选项不符合时间感知扭曲的是：","options":["一日不见，如三月兮","欢愉嫌夜短，寂寞恨更长获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 -","孤馆度日如年，风露渐变","入春才七日，离家已二年"],"answer":"D","explanation":"第一步：找出定义关键词。 “对时间不正确的知觉” 第二步：逐一分析选项。 A 项：“一日不见，如三月兮”指的是一天没见，就觉得过去了三个月，符合“对时间不正确的知觉”，符合定义，排除； B 项：“欢愉嫌夜短，寂寞恨更长”指的是欢乐时嫌夜里时间短促，忧虑时恨白天时间漫长，符合“对时间不正确的知觉”，符合定义，排除； C 项：“孤馆度日如年，风露渐变”指的是在驿馆里形单影只，度日如年，秋风和露水都开始变得寒冷。过一天就好像过了一年一样，符合“对时间不正确的知觉”，符合定义，排除； D 项：“入春才七日，离家已二年”指的是春节才过去七天，但离开家已经两年了，这是对于时间的客观陈述，不符合“对时间不正确的知觉”，不符合定义，当选。本题为选非题，故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-094","paperId":"jx2019","num":94,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"消费滞后是指个人消费滞后于国家经济发展和个人家庭收人所应达到的平均消费水平。消费超前是指当下的收入水平不足以购买现在所需的产品或服务，以贷款、分期付款、预支等形式进行消费。根据上述定义，下列属于消费超前的是：","options":["职员小王以信用卡支付的形式在网上订购了火车票","大学生小李通过某借贷平台购买了某知名品牌电脑","退休工人老张名下有商品房和汽车，但坚持只用老式的直板手机","青年教师小刘有十万元定期存款未到期，向同事借了八万元买车"],"answer":"B","explanation":"第一步：找出定义关键词。消费滞后：“指个人消费滞后于国家经济发展和个人家庭收入所应达到的平均消费水平”；消费超前：“指当下的收入水平不足以购买现在所需的产品或服务”、“以贷款、分期付款、预支等形式进行消费”。第二步：逐一分析选项。 A 项：小王为职员说明小王已经工作，购买火车票应该是消费水平范围内，不符合“当下的收入水平不足以购买现在所需的产品或服务”，不符合定义，排除； B 项：小李是一名大学生，尚未参加工作，购买电脑符合“当下的收入水平不足以购买现在所需的产品或服务”，且通过“某借贷平台购买”属于“贷款”的支付方式，符合定义，当选； C 项：老张有房有车，却使用老式的直板手机，符合“个人消费滞后于国家经济发展和个人家庭收入所应达到的平均消费水平”，属于消费滞后，不属于消费超前，不符合定义，排除； D 项：小刘有十万元的存款，而车只有八万元，也就是当下的收入足以购买现在所需的产品，不符合“当下的收入水平不足以购买现在所需的产品或服务”，且向同事借钱不符合“以贷款、分期付款、预支等形式进行消费”，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 19 - 不符合定义，排除。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-095","paperId":"jx2019","num":95,"year":2019,"region":"江西","module":"判断推理","sub":"定义判断","stem":"水文节律指湖泊水情周期性、有节律的变化。广义水文节律包括昼夜、月运、季节和年际节律。正常情况下，由于流域气候和下垫面等因素较稳定，湖泊多年平均水位趋于稳定数值即湖泊正常年平均水位。所以湖泊年际节律以干扰因素驱动的突变性和适应干扰后的阶段稳定性为特点，无渐变趋向；而昼夜节律对生态系统影响微弱。因此，狭义水文节律特指月运节律与季节节律。根据上述定义，下列涉及狭义水文节律的是：","options":["鄱阳湖受降雨持续减少和来水减少双重影响，水面面积持续萎缩","洪泽湖历史年均水温，最高水温在9 月，最低水温在1 月","洞庭湖去年年降水量1560 毫米，其中4~6 月降水约占全年一半","巢湖流域年平均气温稳定在之间，有200 天以上无霜期"],"answer":"B","explanation":"第一步：找出定义关键词。水文节律：“湖泊水情周期性、有节律的变化”；广义水文节律：“昼夜、月运、季节和年际节律”；狭义水文节律：“月运节律和季节节律”。（注：水情是指江河湖泊的状况、特征及地理意义，如流量、水位、流速、水温与冰情等）本题要选的是符合狭义水文节律的选项。第二步：逐一分析选项。 A 项：鄱阳湖受降雨持续减少和来水减少双重影响，不符合“月运节律和季节节律”，不符合狭义水文节律，不符合定义，排除； B 项：洪泽湖最高水温在9 月，最低水温在1 月，月份和季节不同水温也不同，符合“月运节律和季节节律”，符合狭义水文节律，符合定义，当选（水情指江河湖泊的状况、特征及地理意义，如流量、水位、流速、水温与冰情等，水温是水文测验的基本项目之一）； C 项：只是给出洞庭湖去年的降水量，而其他年份的降水量情况、以及降水量是否存在“周期性、有节律的变化”，我们并不知晓，而且，洞庭湖4-6 月降水约占全年一半，符合“季节和年际节律”，不符合“月运节律和季节节律”，不符合狭义水文节律，不符合定义，排除； D 项：巢湖流域平均气温在15-16 摄氏度之间，有200 天以上无霜期，符合“季节和年际节律”，不符合“月运节律和季节节律”，不符合狭义水文节律，不符合定义，排除。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-096","paperId":"jx2019","num":96,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"拥挤：水泄不通","options":["清晰：洞见肺腑","严重：触目惊心","费力：举重若轻","伤心：肝肠寸断"],"answer":"D","explanation":"第一步：判断题干词语间逻辑关系。水泄不通形容拥挤或包围的非常严密，与拥挤是近义关系。第二步：判断选项词语间逻辑关系。 A 项：洞见肺腑是指很清楚地看见人的内心，形容襟怀坦白，待人诚恳。与清晰不是近义关系，与题干逻辑关系不一致，排除； B 项：触目惊心是指看见某种严重情况而内心震惊，形容事态严重，引起轰动，该词强调的是震惊，与严重不是近义关系，与题干逻辑关系不一致，排除； C 项：举重若轻是比喻能力强，能够轻松地胜任繁重的工作或处理困难的问题。与费力不是近义关系，与题干逻辑关系不一致，排除； D 项：肝肠寸断是比喻伤心到极点，与伤心是近义关系，与题干逻辑关系一致，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-097","paperId":"jx2019","num":97,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"玻璃幕墙：光污染","options":["汽车尾气：酸雨","海上风暴：海啸","火山喷发：地震","空气消毒：臭氧"],"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。玻璃幕墙可以导致光污染，二者是因果关系，并且光污染是人为的环境污染。第二步：判断选项词语间逻辑关系。 A 项：汽车尾气可以导致酸雨，二者为因果关系，并且酸雨是人为的环境污染。与题干逻辑关系一致，当选； B 项：海上风暴可以导致海啸，二者为因果关系，但海上风暴不是人为的环境污染。与题干逻辑关系不一致，排除； C 项：火山喷发可以导致地震，二者为因果关系，但火山喷发不是人为的环境污染。与题干逻辑关系不一致，排除； D 项：空气消毒不会导致臭氧，二者不是因果关系，与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-098","paperId":"jx2019","num":98,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"孤本：书籍","options":["正方形：长方形","蔬菜：土地","显微镜：实验室","礼物：商品"],"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。孤本，指某书刊仅有一份在世间流传的版本，亦指仅存的一份未刊手稿或原物已亡佚，仅存的一份拓本。孤本是特殊的书籍。第二步：判断选项词语间逻辑关系。 A 项：正方形是特殊的长方形，与题干逻辑关系一致，当选； B 项：蔬菜和土地，土地是蔬菜生长的场所，与题干逻辑关系不一致，排除； C 项：显微镜和实验室，显微镜是实验室需要用到的工具，与题干逻辑关系不一致，排除； D 项：礼物和商品，礼物是人与人之间互赠的物品，商品是用于交换的劳动产品，二者没有明显的逻辑关系，与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-099","paperId":"jx2019","num":99,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"老字号：新品牌：传承","options":["老传统：新花样：质疑","老配方：新工艺：创新","老问题：新思考：评价","老物件：新东西：区分"],"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。老字号经过传承可以变为新品牌。第二步：判断选项词语间逻辑关系。 A 项：老传统被质疑不能变为新花样，与题干逻辑关系不一致，排除； B 项：老配方经过创新可以变为新工艺，与题干逻辑关系一致，当选； C 项：老问题被评价不能变为新思考，与题干逻辑关系不一致，排除；获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 20 - D 项：老物件被区分不能变为新东西，与题干逻辑关系不一致，排除。注：此题有同学可能会纠结D 项，认为老字号与新品牌都是品牌，老物件与新东西都是物品。但D 项前两个词与区分无关。从题干三个词的关系看体现了新老物体之间的变化，而B 项也是体现了新老事物之间的变化，因此粉笔更倾向于B 项。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-100","paperId":"jx2019","num":100,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"人烟辐辏：鸡犬相闻：繁盛","options":["人迹罕至：门可罗雀：荒凉","筑巢引凤：腾笼换鸟：友善","战马长矛：坚船利炮：强大","大国工匠：小国寡民：专注"],"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。人烟辐辏指居民密集；鸡犬相闻指鸡鸣狗吠的声音都能听到，指人烟稠密。二者均可以形容繁盛。第二步：判断选项词语间逻辑关系。 A 项：人迹罕至指偏僻荒凉的地方很少有人来过；门可罗雀指门庭冷落车马稀少。二者均可以形容荒凉。与题干逻辑关系一致，当选； B 项：筑巢引凤指提供良好条件，吸引人才或技术、资金等；腾笼换鸟也叫“双转移战略”，指珠三角劳动密集型产业向东西两翼、粤北山区转移；而东西两翼、粤北山区的劳动力，一方面向当地第二、第三产业转移，另一方面其中的一些较高素质劳动力，向发达的珠三角地区转移。二者与友善无关，与题干逻辑关系不一致，排除； C 项：战马长矛与坚船利炮均是战争时使用的工具，与强大与否无直接关系，且这两个词均不是成语，与题干逻辑关系不一致，排除； D 项：大国工匠是央视新闻推出的八集系列节目，讲述了为长征火箭焊接发动机的国家高级技师用自己的灵巧双手，匠心筑梦的故事；小国寡民指政府小，不轻易劳役人民。二者与专注无关，与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-101","paperId":"jx2019","num":101,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"鞋匠：缝纫机：大头皮鞋","options":["厨师：炒菜锅：青椒炒肉","矿工：十字镐：钙铁榴石","记者：录音笔：高端访谈","园丁：洒水壶：鹿角海棠"],"answer":"A","explanation":"第一步：判断题干词语间逻辑关系。鞋匠用缝纫机制作大头皮鞋，鞋匠是职业，缝纫机是使用的工具，大头皮鞋是鞋匠制作的成品。第二步：判断选项词语间逻辑关系。 A 项：厨师用炒菜锅制作青椒炒肉，厨师是职业，炒菜锅是使用的工具，青椒炒肉是厨师制作的成品，与题干逻辑关系一致，当选； B 项：矿工用十字镐挖掘钙铁榴石(含钛、铬、的石榴石都属于钙铁榴石)，矿工是职业，十字镐是使用的工具，钙铁榴石可以是十字镐作用的对象，与题干逻辑关系不一致，排除； C 项：记者用录音笔记录高端访谈，记者是职业，录音笔是使用的工具，高端访谈是录音笔作用的对象，与题干逻辑关系不一致，排除； D 项：园丁用洒水壶浇灌鹿角海棠(属多年生肉质灌木)，园丁是职业，洒水壶是使用的工具，鹿角海棠是洒水壶作用的对象，与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-102","paperId":"jx2019","num":102,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"效率：公平：市场经济","options":["科学：理性：政治哲学","革命：改良：社会制度","民主：集中：组织原则","美丑：善恶：审美范畴"],"answer":"C","explanation":"第一步：判断题干词语间逻辑关系。市场经济需要兼顾效率与公平。第二步：判断选项词语间逻辑关系。 A 项：政治哲学不需要兼顾科学与理性，且科学是理性的，与题干逻辑关系不一致，排除； B 项：社会制度不需要兼顾革命与改良，与题干逻辑关系不一致，排除； C 项：组织原则需要兼顾民主与集中，与题干逻辑关系一致，当选； D 项：审美范畴不需要兼顾美丑与善恶，与题干逻辑关系不一致，排除。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-103","paperId":"jx2019","num":103,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"（）对于风险相当于精兵简政对于（）","options":["亡羊补牢：效率","枕戈待旦：业绩","克己奉公：资源","曲突徙薪：成本"],"answer":"D","explanation":"逐一代入选项。 A 项：亡羊补牢比喻出了问题以后想办法补救，可以防止继续受损失，能够减少风险，精兵简政比喻精简不必要的东西，可以提高效率，一个体现减少，一个体现增加，前后逻辑关系不一致，排除； B 项：枕戈待旦指时刻警惕，准备作战，连睡觉时也不放松戒备，与风险无关，精兵简政与业绩无关，前后逻辑关系不一致，排除； C 项：克己奉公比喻一个人对自己要求严格，一心为公，与风险无关，精兵简政，其实就是节约资源，前后逻辑关系不一致，排除； D 项：曲突徙薪比喻消除可能导致事故的因素，防患于未然，曲突徙薪的目的是减少风险，精兵简政的目的是减少成本，前后逻辑关系一致，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-104","paperId":"jx2019","num":104,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"瓮牖绳枢：粗茶淡饭：清寒","options":["叠床架屋：衣锦食肉：奢华","箪食瓢饮：曲肱饮水：简朴","轻车熟路：霜行草宿：轻松","金盆洗手：金屋藏娇：阔绰"],"answer":"B","explanation":"第一步：判断题干词语间逻辑关系。瓮牖绳枢指以破瓮作窗户，以草绳系户枢，比喻贫穷人家；粗茶淡饭形容饮食简单，生活简朴，二者都可以用来形容清寒。第二步：判断选项词语间逻辑关系。 A 项：叠床架屋比喻办事重复，自找麻烦；衣锦食肉形容生活富足，第一词与奢华无关，与题干逻辑关系不一致，排除； B 项：箪食瓢饮形容读书人安于贫穷的清高生活；曲肱饮水形容清心寡欲、安贫乐道的生活，二者都可以用来形容简朴，与题干逻辑关系一致，当选； C 项：轻车熟路比喻事情又熟悉又容易；霜行草宿指在霜露中行走，草野中息宿，形容奔波劳苦，第二词与轻松获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 21 - 无关，与题干逻辑关系不一致，排除； D 项：金盆洗手指放弃以前长期从事的行业或某件事；金屋藏娇指以华丽的房屋让所爱的妻妾居住，隐藏起来，二者均与阔绰无关，与题干逻辑关系不一致，排除。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-105","paperId":"jx2019","num":105,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"（）对于聚集之处相当于捷径对于（）","options":["荟萃：取巧之思","渊薮：速成之法","辐辏：入门之路","囹圄：提升之梯"],"answer":"B","explanation":"逐一代入选项。 A 项：荟萃比喻优秀的人物或精美的东西会集、聚集，可以形容聚集之处，捷径比喻能较快地达到目的的巧妙手段或办法，与取巧之思无关，前后逻辑关系不一致，排除； B 项：渊薮比喻某种人或事、物聚集的地方，可以形容聚集之处，速成之法可以形容捷径，前后逻辑关系一致，当选； C 项：辐辏形容人或物聚集像车辐集中于车毂一样，可以形容聚集之处，入门之路与捷径无关，前后逻辑关系不一致，排除； D 项：囹圄原指监牢，后引申为束缚、困难，与聚集之处无关，捷径与提升之梯无关，前后逻辑关系不一致，排除。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-106","paperId":"jx2019","num":106,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"研究发现，20 到39 岁的群体更热衷于使用智能手机中的运动类应用。最主要的原因在于该群体大部分都已经参加工作，且亚健康在该群体中较普遍，所以越来越多的白领和年轻人更注重身体健康；同时，年轻人肥胖率占比较高，而年轻人对美的追求远远超过中老年人，所以他们更在乎运动；此外，该年龄段的用户群体也更熟悉智能手机的操作。以下哪项如果为真，最能削弱上述调研发现？","options":["许多年轻人沉迷于智能手机中的游戏","许多年轻人长期加班，睡眠远远不足","年轻人不坚持运动易引发亚健康问题","当代年轻人营养过于丰富，体型偏胖"],"answer":"A","explanation":"第一步：找出论点和论据。论点：20 到39 岁的群体更热衷于使用智能手机中的运动类应用。论据：最主要的原因在于该群体大部分都已经参加工作，且亚健康在该群体中较普遍，所以越来越多的白领和年轻人更注重身体健康；同时，年轻人肥胖率占比较高。而年轻人对美的追求远远超过老年人，所以他们更在乎运动；此外，该年龄段的用户群体也更熟悉智能手机的操作。本题的论点是年轻人更喜欢用智能手机中的运动类应用，其中的“更”表明了比较关系，因此削弱论点时要么削弱论点中的中心话题（年轻人不喜欢用手机中的运动类应用），要么直接削弱论点中比较关系（年轻人更喜欢用的不是智能手机中的运动类应用）。第二步：逐一分析选项。 A 项：论点说的是年轻人更喜欢用智能手机运动类应用，而该项说的是有很多年轻人沉迷的是智能手机中的游戏，削弱了论点中所说的运动类应用更受欢迎，削弱论点，当选; B 项：论点讨论的是年轻人更喜欢用智能手机的运动类应用，论据中第一句说的是年轻人大部分因工作处于亚健康状态，因此注重身体健康，本项说的是年轻人因经常加班而睡眠不足，因此本项支持了该论据，无法削弱，排除; C 项：本项说的是不坚持运动的影响是导致亚健康，而论点与论据讨论的是年轻人更喜欢使用智能手机的运动类应用，话题不一致，无法削弱，排除; D 项：论据第二句是通过说明年轻人肥胖率占比高，年轻人更追求美来解释论点原因，本项说现在年轻人确实体型肥胖，加强了该论据，无法削弱，排除。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-107","paperId":"jx2019","num":107,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"近年来，意大利面被冠上导致肥胖的坏名声，因此很多人在面对这种地中海饮食时，都抱有一种又恨又爱的纠结心情。然而，意大利地中海神经病学研究所通过对2.3 万人的研究发现，意大利面不像很多人想象的那样会导致体重增加。而且，意大利面非但不会导致肥胖，还可以起到相反的效果——降低体脂率。研究结果显示，如果人们能够适量摄入，并保证饮食多样性，意大利面对人们的身体健康大有裨益。以下哪项如果为真，最能支持上述结论？","options":["面条中所含碳水化合物是导致肥胖的重要因素","没有研究显示意大利面会导致人群肥胖率上升","地中海饮食采用的橄榄油对身体健康大有益处","酌量食用意大利面能够维持人们理想的体脂率"],"answer":"D","explanation":"第一步：找出论点和论据。论点：如果人们能够适量摄入，并保证饮食多样性，意大利面对人们的身体健康大有裨益。论据：意大利地中海神经病学研究所通过对2.3 万人的研究发现，意大利面不像很多人想象的那样会导致体重增加。而且，意大利面非但不会导致肥胖，还可以起到相反的效果——降低体脂率。本题论点论据讨论的都是意大利面和身体健康的关系，讨论话题一致，优先考虑补充论据，补充能够证明意大利面饮食多样，适量摄入，可以对身体健康有好处的理由。第二步：逐一分析选项。 A 项：虽然面条中碳水化合物是导致肥胖的重要因素，但是如果适量摄入意大利面，并保证饮食多样性，是否对人们身体健康有好处不确定，无法加强，排除； B 项：没有研究显示意大利面会导致人群肥胖率上升，不代表意大利面就不会导致肥胖，如果适量摄入，并保证饮食多样性，是否对身体健康有好处不确定，话题不一致，无法加强，排除； C 项：选项说的是地中海饮食对健康有好处，论点说的是意大利面和健康之间的关系，话题不一致，无法加强，排除； D 项：酌量食用意大利面可以维持理想的体脂率，而体脂率理想代表着身体健康，说明适量摄入意大利面，确实对人身体健康有好处，可以加强，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-108","paperId":"jx2019","num":108,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"快速、持续、无法预测的竞争环境要求企业规模小，结构简化，同时要有足够的技术储备和抵抗资金风险获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 的能力。目前解决这一矛盾的途径通常是建立全球范围内的“基于双赢原则”的虚拟企业。虚拟企业是企业间的一种动态联盟，参加虚拟企业的各成员企业有一定的自主权。当出现了市场机会，各加盟企业就组织在一起，共同开发并生产销售新产品，一旦发现该产品无利可图，便自动解散。因此，虚拟企业被认为是21 世纪最有竞争力的企业运行模式。以下哪项如果为真，最能支持上述观点？","options":["当今社会发达的现代信息技术和通讯手段为各企业间的沟通提供了便利","企业想在当前的竞争环境中生存发展扩大优势，需要一种新的运行模式","虚拟企业中的任一加盟企业生产上出现问题都会中断整个生产链的运行","虚拟企业可迅速集中最强设计加工与销售力量，实现对市场的快速反应"],"answer":"D","explanation":"第一步：找出论点和论据。论点：虚拟企业被认为是21 世纪最有竞争力的企业运行模式。论据：当出现了市场机会，各加盟企业就组织在一起，共同开发并生产销售新产品，一旦发现该产品无利可图，便自动解散。论点论据都在说虚拟企业的优势，话题一致，优先考虑补充论据，补充能够证明虚拟企业是最有竞争力的企业运营模式的理由进行加强。第二步：逐一分析选项。 A 项：现代发达的信息技术为各企业之间的沟通提供便利，但是提供便利不代表就有竞争力，话题不一致，无法获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 22 - 加强，排除； B 项：企业想在竞争环境中生存发展扩大优势，需要新的运行模式，但新的运行模式是否指的是虚拟企业不清楚，无法加强，排除； C 项：虚拟企业中的任一加盟企业生产出现问题都会中断整个生产链的运行，说的是虚拟企业的缺点，但有缺点不代表没有竞争力，虚拟企业是否是最有竞争力的企业运行模式未知，话题不一致，无法加强，排除； D 项：虚拟企业能够快速集中最强的力量做出最快的反应，说明虚拟企业的优势，并且力量最强，速度最快，也可说明虚拟企业是最有竞争力的运营模式，补充论据，可以加强，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-109","paperId":"jx2019","num":109,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"长久以来，心理学家都支持“数学天赋论”：数学能力是人类自打娘胎里出来就有的能力，就连动物也有这种能力。他们认为存在一种天生的数学内核，通过自我慢慢发展，这种数学内核最后会“长”成我们所熟悉的一切数学能力。最近有反对者提出了不同的看法：数学能力没有天赋，只能是文化的产物。以下哪项如果为真，最能支持反对者的看法？","options":["10~12 个月的婴儿已经知道3 个黑点和4 个黑点是不一样的","数学是大脑的产物，而大脑的生长模式早已由基因“预设”","经过人为训练的大猩猩、海豚和大象等动物能处理数学问题","绝大多数的原始部落的居民只能表示5 以下甚至更少的数量"],"answer":"D","explanation":"第一步：找出论点和论据。论点：数学能力没有天赋，只能是文化的产物。论据：无。本题只有论点，没有论据，所以优先考虑补充论据的方式来加强。第二步：逐一分析选项。 A 项：说明婴儿可以区分数量不同的黑点，举例说明数学能力是有天赋的，否定论点，无法加强，排除； B 项：说明数学是大脑的产物，大脑已被基因预设，也就是说数学是有天赋的，否定论点，无法加强，排除； C 项：指出部分动物经过训练能处理数学问题，但是并不知道其是否有数学能力的天赋，不明确选项，无法加强，排除； D 项：说明绝大多数的原始部落的居民只能表示5 甚至以下的数字，通过举例子的方式说明数学能力确实是文化的产物，补充论据，可以加强，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-110","paperId":"jx2019","num":110,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"下列动物如果都只能归属一种门类，并且满足以下条件：（1）如果动物B 不是鸟，那么动物A 是哺乳动物（2）或者动物C 是哺乳动物，或者动物A 是哺乳动物（3）如果动物B 不是鸟，那么动物D 不是鱼（4）或者动物D 是鱼，或者动物E 不是昆虫（5）如果动物E 不是昆虫，那么动物B 不是鸟以下哪项如果为真，可以得出“动物C 是哺乳动物”的结论？","options":["动物D 不是鱼","动物E 是昆虫","动物B 不是鸟","动物A 是哺乳动物"],"answer":"B","explanation":"题干条件只有（2）与动物C 有关，（2）条件为：动物C 是哺乳动物或动物A 是哺乳动物；根据否一推一，想要得出“动物C 是哺乳动物”的结论，必须得到动物A 不是哺乳动物；则根据（1），如果动物B 不是鸟，得到动物A 是哺乳动物，则无法推出“动物C 是哺乳动物”的结论，因此须满足动物B 是鸟；根据（5），如果动物E 不是昆虫，则动物B 是鸟，无法推出结论，因此必须满足E 是昆虫。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-111","paperId":"jx2019","num":111,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"多数家长的投入对子女学业投入具有显著的正向预测作用，家长投入程度随子女学段升高而降低，同时多数家长更注重在家辅导的投入，对子女参与社区及学校活动的投入较欠缺。而家长自主支持或控制的教养风格在家长投入与子女学业投入的关系中起调节作用，且部分通过子女学业心理需要的满足这一中介变量产生作用。由此可以推出：","options":["多数家长对子女教育投入的减少，意味着子女学段的升高","家长的投入、教养风格必然会对子女的学业投入产生影响","家中学习环境的创设、形成和学校、社区间的联系呈反比关系","子女学业心理需要的满足是影响其学业投入的内驱和首要因素"],"answer":"C","explanation":"A 项：题干指出家长投入程度随子女学段升高而降低，先有子女学段升高，后有投入降低，而选项所说为家长对教育投入减少，意味着子女学段的升高，存在逻辑错误，与题干的逻辑顺序相反，排除； B 项：题干只是说明“多数家长”的投入对子女学业投入具有显著的正向预测作用，而且家长自主支持或控制的教养风格只是在家长投入与子女学业投入的关系中起到“调节作用”，而选项中所说的“必然”会对子女的学业投入产生影响，表述过于绝对，无法推出，排除； C 项：题干以“更注重在家辅导的投入”和“参与社区及学校活动的投入较欠缺”，说明了两种不同的投入的关系为一者变多、随之另外一者减少，即对在家辅导的投入越多，就会使得对子女参与社区及学校活动的投入越少，二者存在反比关系，当选； D 项：题干没提到子女学业心理需要的满足是影响学业投入的内驱和首要因素，只是说可以产生作用，无法推出，排除。故正确答案为C。注：此题存在一定的争议，B、D 选项说法过于绝对，可以排除，但很多同学会纠结于A、C 两项。其实，这道题同时还出现于2019 年陕西省公务员考试逻辑判断部分，在题干相同的情况下，2019 陕西省考中的这道题对于选项进行了修改，情况如下： 2019 陕西省考中这道题的B 选项说明子女学段升高意味着家长投入的减少，与题干意思一致；我们这道题中的A 选项说的是家长投入的减少意味着子女学段的升高，逻辑顺序与2019 陕西省考中的题目B 选项正好相反。将两获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 23 - 道题目放在一起进行对比，陕西省考命题人很可能是将这道题中B 选项所存在的问题进行了修改，将修改后的选项设置为了陕西这道不定项选择题的正确答案之一，这也从另外一个侧面说明，本题中的B 选项一定是错误的。根据排除法，这道题的答案只能给到C 选项。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-112","paperId":"jx2019","num":112,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"牙医在治疗龋齿时，先要去除牙齿龋坏的部分，再填充材料以修补缺损的牙体。但是，至的补牙会失败，且所用的填充物并不具备使牙齿自愈的功能，甚至还有副作用。有鉴于此，研究人员研发出一种用合成生物材料制成的填充物，可以刺激牙髓中干细胞的生长，修复受损部位。这种填充物能刺激干细胞的增殖，并分化成牙本质。如果未来补牙的填充物都用这样的再生材料制成，将降低补牙失败率，也可减少蛀牙患者治疗牙髓之苦。由此可以推出：","options":["未来人们将不再患上蛀牙病","未来人们将不再受龋齿困扰","新研发的补牙填充物能刺激受损牙齿自愈","新研发的补牙填充物能促进牙本质的生长"],"answer":"C","explanation":"日常结论题，根据题干信息逐一分析选项。 A 项：根据最后一句话可知，未来补牙的填充物将降低补牙失败概率，也可减少蛀牙患者治疗牙髓之苦，只是减少治疗的痛苦，但是没有提及将来会不会患上蛀牙病，无法推出，排除； B 项：题干中指出未来补牙的填充物可以减少治疗牙髓之苦，但是没有涉及将来会不会受龋齿困扰，无法推出，排除； C 项：根据第三句话可知，新研发的补牙填充物可以刺激牙髓中干细胞的生长，修复受损部位，可以推出新研发的补牙填充物能刺激受损牙齿自愈，当选； D 项：根据第四句话可知，新研发的补牙填充物可以刺激干细胞的增殖，并分化成牙本质，但并不是促进牙本质的生长，“分化”并不意味着“促进生长”，偷换概念，排除。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-113","paperId":"jx2019","num":113,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"有研究声称：癌细胞怕热，高体温可以抗癌。人体最容易罹癌的器官包括肺、胃、大肠、乳腺等都是体温较低的部位，心脏之类的“高温器官”不容易得癌症。因此，可以用运动、喝热水、泡澡等方法提高体温来抗癌。以下哪项如果为真，最能反驳上述论断？","options":["受呼吸、饮食等影响，人的口腔温度一般比直肠温度低，而世界范围内直肠癌的发生率要高于口腔癌","人的体温存在精准的调控机制，基本保持平稳状态，体内各个脏器之间并没有什么明显的温度差异","热疗或许可以帮助放疗或一些化疗发挥更好的作用，但证明其可靠性的研究数据依然不足","心脏很少发生恶性肿瘤，是因为这里的心肌细胞不再进行分裂增殖，而与温度高低无关"],"answer":"B","explanation":"第一步：找出论点和论据。论点：可以用运动、喝热水、泡澡等方法提高体温来抗癌。论据：癌细胞怕热，高体温可以抗癌。人体最容易罹患的器官包括肺、胃、大肠、乳腺等都是体温较低的部位，心脏之类的“高温器官”不容易得癌症。本题的论点指出提高体温抗癌的方法，论据中也是在说“高温器官”不容易得癌症，所以论点、论据讨论话题一致，要想削弱，要么否定论点（提高体温不能抗癌），要么否定论据（心脏之类的“高温器官”不容易得癌症的原因不是因为温度高）。第二步：逐一分析选项。 A 项：人的口腔温度一般比直肠温度低，而世界范围内直肠癌的发生率要高于口腔癌，说明直肠温度高，直肠癌发生率高，提高体温并不能抗癌，举反例削弱题干论点，保留； B 项：选项指出人体温度存在精准的调控机制，体内各个脏器之间并没有明显温度差异，那么就无法通过调整体温来抗癌，直接削弱论点，保留； C 项：热疗或许可以发挥更好的作用，但证明其可靠性的研究数据依然不足，因此不确定是否提高温度真的有利于抗癌，属于不明确选项，排除； D 项：指出心脏很少发生恶性肿瘤，是因为心肌细胞不再分裂增殖，而与温度高低无关，可以削弱题干论据，保留。对比ABD 三项，B 项直接削弱论点的力度强于A 项的举反例和D 项的削弱论据。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-114","paperId":"jx2019","num":114,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"某国际古生物学研究团队最新报告称，在2.8 亿年前生活在南非的正南龟是现代乌龟的祖先，它们是在二叠纪至三叠纪大规模物种灭绝事件中幸存下来的。当时，为了躲避严酷的自然环境，它们努力向地下挖洞，同时为保证前肢的挖掘动作足够有力，身体需要一个稳定的支撑，从而导致了肋骨不断加宽。由此可知，乌龟有壳是适应环境的表现，只不过不是为了保护，而是为了向地下挖洞。上述结论的成立需要补充以下哪项作为前提？","options":["只有挖洞才能从大规模物种灭绝事件中幸存","现代乌龟继承了正南龟善于挖洞的某些习性","正南龟前肢足够有力因而并不需要龟壳保护","龟壳是由乌龟的肋骨逐渐加宽后进化而来的"],"answer":"D","explanation":"第一步：找出论点和论据。论点：乌龟有壳是适应环境的表现，只不过不是为了保护，而是为了向地下挖洞。论据：为了躲避严酷的自然环境，它们努力向地下挖洞，同时为保证前肢的挖掘动作足够有力，身体需要一个稳定的支撑，从而导致了肋骨不断加宽。问前提，优先考虑搭桥。论点讨论的是乌龟有壳是为了向地下挖洞，论据讨论的是为了适应环境，导致了乌龟的肋骨不断加宽，论点论据讨论的不是一回事，在论点论据之间进行搭桥，可以说明肋骨加宽和有壳之间的关系。第二步：逐一分析选项。 A 项：讨论的是如何在大规模物种灭绝事件中幸存，没有说明龟壳与肋骨加宽之间的关系，无法加强，排除； B 项：讨论的是现代乌龟所继承的习性，没有说明龟壳与肋骨加宽之间的关系，无法加强，排除； C 项：只解释了正南龟的龟壳不是起到保护的作用，但没有说明龟壳与挖洞之间的关系，没有搭桥，排除； D 项：说明龟壳是由肋骨加宽后进化而来的，在论点论据之间搭桥，当选。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-115","paperId":"jx2019","num":115,"year":2019,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"自制力不仅关乎自我控制，还包括排除不相关刺激的干扰和坚持完成相关任务（即使是自己不喜欢的任务）获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 - 的能力。自制力是稳定不变的，还是会被消耗的，学界各派的看法不一。心理学家把实验对象分为两组，让他们同场解决难题。一组解题时只能吃萝卜，另一组还可以吃饼干。结果只吃萝卜的这组坚持时间更短，因为他们在抵制饼干的诱惑的同时，消耗了自制力。他们由此得出结论：人们的自制力是有限的，过度使用会导致自制力下降。上述结论的成立需要补充以下哪项作为前提？","options":["实验对象对解决难题的兴趣不完全相同","饼干和萝卜对实验对象的诱惑力不相同","饼干和萝卜补充人体能量的效果不相同","两组实验对象抗干扰的能力不完全相同"],"answer":"B","explanation":"第一步：找出论点和论据。论点：人们的自制力是有限的，过度使用会导致自制力下降。论据：心理学家把实验对象分为两组，让他们同场解决难题。一组解题时只能吃萝卜，另一组还可以吃饼干。结果只吃萝卜的这组坚持时间更短，因为他们在抵制饼干诱惑的同时，消耗了自制力。论据和论点话题一致，所以优先考虑补充论据的方式来加强。第二步：逐一分析选项。 A 项：实验对象对于解决问题的兴趣不同，说明实验起点不一致，并不知道过度使用自制力是否会消耗自制力，无法加强，排除； B 项：饼干和萝卜对人们的诱惑力不同，如果相同的话，那么就不需要消耗自制力，是论证成立的前提，当选； C 项：饼干和萝卜对人体的能量补充的效果，与题干论点无关，为无关选项，无法加强，排除； D 项：实验对象抗干扰能力不同，说明实验起点不一致，并不知道过度使用自制力是否会消耗自制力，无法加强，排除。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-116","paperId":"jx2019","num":116,"year":2019,"region":"江西","module":"资料分析","sub":"综合资料","stem":"2017 年我国马拉松赛事场次比2011 年增加了：","options":["约47 倍","约49 倍","约51 倍","约53 倍"],"answer":"B","explanation":"根据题干“2017 年···比2011 年增加了”，结合选项，可判定本题为一般增长率问题。定位图1 可得：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 24 - 2017 年、2011 年我国马拉松赛场次分别为1102 场、22 场。根据增长率，可得2017 年的增长率为。与B 项最接近。故正确答案为B。","material":"析、比较、计算和判断处理。（一）根据以下资料，回答下列问题。 2017 年全国举办马拉松赛事达1102 场，其中，中国田径协会举办的A 类赛事223 场，B 类赛事33 场。2017 年马拉松赛事的参与人次达到了498 万人次，2016 年、2015 年马拉松赛事的参与人次分别为280 万人次、150 万人次。 2017 年全年马拉松直接从业人口数72 万，间接从业人口数200 万。年度产业总规模达700 亿元，比去年同期增长约，中国田径协会设置的发展目标是到2020 年，全国马拉松规模赛事超过1900 场，其中中国田径协会认证赛事达到350 场，各类赛事参赛人数超过1000 万人次，马拉松运动产业规模达到1200 亿元。规模赛事数量方面，2017 年排名前三的省份为浙江省、江苏省和广东省，分别为152 场、149 场和103 场，而2016 年的前三名分别为江苏省37 场，北京市33 场，广东省25 场。从2017 年全年赛事的覆盖区域来看，马拉松赛事地域分布更为广泛，中国境内马拉松及相关赛事已经涵盖了含西藏在内的全国31 个省、区、市的234 个城市，较上年增加了101 个城市。在赛事类型方面，2017 年1102 场规模赛事中，全程马拉松参赛人次最高，突破了235 万人次，其次为半程马拉松赛事，参赛人次超过134 万人次。在中国田径协会认证的A 类 B 类赛事中，2017 年全程马拉松项目完赛26.89 万人次，同比增长；半程马拉松项目完赛45.29 万人次，同比减少了0.03 万人次。按照跑者户籍所在地统计，2017 年参加中国田径协会认证赛事的跑者中，来自江苏的数量最多，共有76469 人参赛，在全国占比。湖北、广东、山东、福建、浙江等省紧随其后。而在全部参赛选手中，共有3663 人次的男选手在全程项目中跑进3 小时，772 人次女选手跑进3 小时20 分。","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-117","paperId":"jx2019","num":117,"year":2019,"region":"江西","module":"资料分析","sub":"综合资料","stem":"2017 年马拉松赛事参与人次的同比增速比2016 年：","options":["快约9 个百分点","慢约9 个百分点","快约7 个百分点","慢约7 个百分点"],"answer":"B","explanation":"根据题干“2017 年···的同比增速比2016 年”，可判定本题为一般增长率问题。定位文字材料第一段可得：2017 年、2016 年、2015 年马拉松赛事的参与人次分别为498 万人次、280 万人次、150 万人次。根据增长率，可得2017 年的增长率为，2016 年的增长率为，则，即2017 年同比增速比2016 年慢约9 个百分点。故正确答案为B。","material":"析、比较、计算和判断处理。（一）根据以下资料，回答下列问题。 2017 年全国举办马拉松赛事达1102 场，其中，中国田径协会举办的A 类赛事223 场，B 类赛事33 场。2017 年马拉松赛事的参与人次达到了498 万人次，2016 年、2015 年马拉松赛事的参与人次分别为280 万人次、150 万人次。 2017 年全年马拉松直接从业人口数72 万，间接从业人口数200 万。年度产业总规模达700 亿元，比去年同期增长约，中国田径协会设置的发展目标是到2020 年，全国马拉松规模赛事超过1900 场，其中中国田径协会认证赛事达到350 场，各类赛事参赛人数超过1000 万人次，马拉松运动产业规模达到1200 亿元。规模赛事数量方面，2017 年排名前三的省份为浙江省、江苏省和广东省，分别为152 场、149 场和103 场，而2016 年的前三名分别为江苏省37 场，北京市33 场，广东省25 场。从2017 年全年赛事的覆盖区域来看，马拉松赛事地域分布更为广泛，中国境内马拉松及相关赛事已经涵盖了含西藏在内的全国31 个省、区、市的234 个城市，较上年增加了101 个城市。在赛事类型方面，2017 年1102 场规模赛事中，全程马拉松参赛人次最高，突破了235 万人次，其次为半程马拉松赛事，参赛人次超过134 万人次。在中国田径协会认证的A 类 B 类赛事中，2017 年全程马拉松项目完赛26.89 万人次，同比增长；半程马拉松项目完赛45.29 万人次，同比减少了0.03 万人次。按照跑者户籍所在地统计，2017 年参加中国田径协会认证赛事的跑者中，来自江苏的数量最多，共有76469 人参赛，在全国占比。湖北、广东、山东、福建、浙江等省紧随其后。而在全部参赛选手中，共有3663 人次的男选手在全程项目中跑进3 小时，772 人次女选手跑进3 小时20 分。","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-119","paperId":"jx2019","num":119,"year":2019,"region":"江西","module":"资料分析", 确率：65%，易错项：C。解析第一步，本题考查2018 年政府工作报告。第二步，我国2018 年政府工作报告指出，五年来，发展新动能迅速壮大，经济增长实现由主要依靠投资、出口拉动转向依靠消费、投资、出口协同拉动，由主要依靠第二产业带动转向依靠三次产业共同带动。这是我们多年想实现而没有实现的重大结构性变革。因此，选择D 选项。拓展各级政府在每年召开的当地人民代表大会会议和政治协商会议（俗称“两会”）上向大会主席团、与会人大代表和政协委员发布政府工作报告。2018 年3 月5 日上午9 时，第十三届全国人民代表大会第一次会议在人民大会堂开幕，国务院总理李克强向大会作《2018 年政府工作报告》。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-002","paperId":"gz2018a","num":2,"year":2018,"region":"广州","module":"常识判断","sub":"法律","stem":"按照我国现行《社会救助暂行办法》，国家建立健全自然灾害救助制度，对（）受到自然灾害严重影响的人员，提供生活救助。","options":["基本生活","日常生活","工作生活","家庭生活"],"answer":"A","explanation":"正确答案：A，全站正确率：82%，易错项：B。解析第一步，本题考查生活救助的条件。第二步，《社会救助暂行办法》第20 条规定，国家建立健全自然灾害救助制度，对基本生活受到自然灾害严重影响的人员，提供生活救助。自然灾害救助实行属地管理，分级负责。因此，选择A 选项。拓展《社会救助暂行办法》是为加强社会救助，保障公民的基本生活，促进社会公平，维护社会和谐稳定，根据宪法制定。由国务院于2014 年2 月21 日发布，自2014 年5 月1 日起施行。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-003","paperId":"gz2018a","num":3,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"党的十九大提出新时代我国社会主义主要矛盾是人民日益增长的美好生活需要和不平衡不充分发展之间的矛盾。这一论断所蕴含的哲学原理是：","options":["“两点论”与“重点论”的统一","事物发展是质变和量变的统一","矛盾是事物发展的根本动力","事物是普遍联系的"],"answer":"C","explanation":"正确答案：C，全站正确率：59%，易错项：A。解析第一步，本题考查“新时代”体现的哲学原理。第二步，“进入新时代”体现了哲学中“发展”的观点，“中国特色社会主义进入新时代”的重要标志是我国社会主要矛盾的变化，由原来的“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”转变为“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”。十九大表述中的“新”就“新”在“矛盾”上。经济基础和上层建筑是一对矛盾，随着社会经济基础的发展变化，上层建筑也会跟着发生相应的变化，正是矛盾的发展变化促进了社会的发展。因此，选择C 选项。拓展 A 项：“两点论”是指认识复杂事物的发展过程时，既要看到主要矛盾，又不能忽视次要矛盾；在认识某一矛盾时，既要看到矛盾的主要方面，又不能忽视次要方面。“重点论”就是认识复杂事物的发展过程时，要着重抓住它的主要矛盾；在认识某一矛盾时，要着重把握矛盾的主要方面。题干只是在说明时代变化，并没有强调谁是“重点”，也没有阐述“兼顾”什么。 B 项：质量互变规律揭示了事物发展的状态和过程。任何事物的变化都是量变和质变的统一，量变和质变的相互渗透和相互转化是事物发展的基本状态和过程。量变是事物数量的增减、场所的变更以及要素在空间组合上的变化。质变是事物性质的变化，是事物由一种质态向另一种质态的转变。进入“新时代”可以体现出阶段性的质变，但是“量变”不能直接体现。 D 项：“事物是普遍联系的”是指任何事物内部的各个部分、要素是相互联系的；任何事物都与周围的其他事物相互联系着；整个世界是一个相互联系的统一整体。选项中只表明了中国特色社会主义所在的一个阶段，并没有体现其与其他事物之间的联系。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-004","paperId":"gz2018a","num":4,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"改革开放以来，国内不少水果产量和品质都有了较大提升，而精深加工却发展不够快，至今仍以鲜食为主，有些地方出现“丰产歉收”、果农“挥泪砍树”现象。而“砍树莫如酿酒”，发展果酒产业的思路说明了要推进的改革是：","options":["市场营销体系改革","供给侧结构性改革","要素价格市场化改革","现代流通体系改革"],"answer":"B","explanation":"正确答案：B，全站正确率：74%，易错项：A。解析第一步，本题考查改革相关知识点。第二步，供给侧结构性改革，就是从提高供给质量出发，用改革的办法推进结构调整，矫正要素配置扭曲，扩大有效供给，提高供给结构对需求变化的适应性和灵活性，提高全要素生产率，更好满足广大人民群众的需要，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 - 促进经济社会持续健康发展。题干中提到虽然我国水果产量和品质都有所提升，但是深加工发展不快。所以我们迫切需要优化产业结构，由单纯的鲜果出售进行深度加工，比如发展果酒产业等，这就是推进供给侧结构改革的要求。因此，选择B 选项。拓展 2018 年12 月21 日闭幕的中央经济工作会议认为，我国经济运行主要矛盾仍然是供给侧结构性的，必须坚持以供给侧结构性改革为主线不动摇，更多采取改革的办法，更多运用市场化、法治化手段，在“巩固、增强、提升、畅通”八个字上下功夫。供给侧结构性改革主要有以下内涵：（一）用增量改革促存量调整，在增加投资过程中优化投资结构、产业结构开源疏流，在经济可持续高速增长的基础上实现经济可持续发展与人民生活水平不断提高；（二）优化产权结构，国进民进、政府宏观调控与民间活力相互促进；（三）优化投融资结构，促进资源整合，实现资源优化配置与优化再生；（四）优化产业结构、提高产业质量，优化产品结构、提升产品质量；（五）优化分配结构，实现公平分配，使消费成为生产力；（六）优化流通结构，节省交易成本，提高有效经济总量；（七）优化消费结构，实现消费品不断升级，不断提高人民生活品质，实现创新、协调、绿色、开放、共享的发展。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-005","paperId":"gz2018a","num":5,"year":2018,"region":"广州","module":"常识判断","sub":"法律","stem":"以下情形，不违反《中华人民共和国公务员法》规定的任职回避情形的是：","options":["甲乙为夫妻，在同一机关工作，甲担任领导职务，乙在组织部门任普通科员","甲乙为表兄妹，在同一机关工作，甲担任领导职务，乙是甲的下级由甲直接领导","甲乙为兄妹，在同一机关工作，甲在组织部门担任部长，乙在行政部门担任普通科员","甲乙为父子，在同一机关工作，两人都在人事部门任普通科员"],"answer":"C","explanation":"正确答案：C，全站正确率：33%，易错项：D。解析第一步，本题考查任职回避并选错误项。第二步，《中华人民共和国公务员法》第68 条规定，公务员之间有夫妻关系、直系血亲关系、三代以内旁系血亲关系以及近姻亲关系的，不得在同一机关担任双方直接隶属于同一领导人员的职务或者有直接上下级领导关系的职务，也不得在其中一方担任领导职务的机关从事组织、人事、纪检、监察、审计和财务工作。C 选项虽然兄妹属三代以内旁系血亲，但甲在组织部门，乙在行政部门，隶属于不同部门，不违反回避制度。因此，选择C 选项。拓展 A 项：夫妻关系，一方领导，另一方为组织部门，不符合回避原则。 B 项：表兄妹属三代以内旁系血亲，直接隶属关系，不符合回避原则。 D 项：父子属直系血亲关系，同一部门，隶属同一行政首长，不符合回避原则。注：2018 年12 月29 日，第十三届全国人民代表大会常务委员会第七次会议修订《中华人民共和国公务员法》，自2019 年6 月1 日起施行，新的公务员法第74 条规定，公务员之间有夫妻关系、直系血亲关系、三代以内旁系血亲关系以及近姻亲关系的，不得在同一机关双方直接隶属于同一领导人员的职位或者有直接上下级领导关系的职位工作，也不得在其中一方担任领导职务的机关从事组织、人事、纪检、监察、审计和财务工作。除此之外，又增加了一款，即公务员不得在其配偶、子女及其配偶经营的企业、营利性组织的行业监管或者主管部门担任领导成员。按照2019 新修订的公务员法来看，也不影响本题的答案。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-006","paperId":"gz2018a","num":6,"year":2018,"region":"广州","module":"常识判断","sub":"人文历史","stem":"以下诗句反映的不是边塞生活的是：","options":["更吹羌笛关山月，无那金闺万里愁","撩乱边愁听不尽，高高秋月照长城","北风卷地白草折，胡天八月即飞雪","云横秦岭家何在？雪拥蓝关马不前"],"answer":"D","explanation":"正确答案：D，全站正确率：46%，易错项：B。解析第一步，本题考查文学常识并选错误项。第二步，《左迁至蓝关示侄孙湘》是唐代文学家韩愈在贬谪潮州途中创作的一首七律，抒发了作者内心郁愤以及前途未卜的感伤情绪。潮州不是边塞，潮州是广东省东部沿海的港口城市。其他“羌”“边”“胡”都指的是边塞。边塞特指边疆地区的要塞，如山海关、嘉峪关等具体要塞地名。因此，选择D 选项。拓展 A 项：“更吹羌笛关山月，无那金闺万里愁”出自唐代诗人王昌龄《从军行七首》其一，描述边塞诗人思亲之情。 B 项：“撩乱边愁听不尽，高高秋月照长城”出自唐代诗人王昌龄《从军行七首》其二，描述久戍思归的苦情。 C 项：“北风卷地白草折，胡天八月即飞雪”出自唐代诗人岑参的《白雪歌送武判官归京》，描述边塞军营送别归京使臣的热烈场面。解题技巧：本题可以用关键词法，找出每个选项的关键词。比如A 项是羌笛，B 项是边愁，C 项是胡天，D 项是秦岭。羌笛、边愁、胡天代表的都是边塞。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-007","paperId":"gz2018a","num":7,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"农历“正月”读作“征月”，很可能是始于：","options":["康熙年间","汉武帝年间","秦始皇年间","春秋时期"],"answer":"C","explanation":"正确答案：C，全站正确率：38%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - 第一步，本题考查避讳。第二步，避讳是中国封建社会特有的现象，是帝制时代对于君主和尊长的名字，必须避免直接说出或写出。秦始皇名字叫做嬴政，他统一天下后，“正”字读音第四声，与他名字中的“政”字相同，犯忌讳，于是就下令把“正月”一律念成第一声“征月”。因此，选择C 选项。拓展 A 项：康熙是清圣祖爱新觉罗•玄烨的年号，清朝第四位皇帝（1661 年—1722 年在位），清定都北京后第二位皇帝。康熙帝是统一的多民族国家的捍卫者，奠定了清朝兴盛的根基，开创出康乾盛世的大局面，有学者尊之为“千古一帝”，康熙六十一年（1722 年）农历十一月十三日崩于畅春园，终年68 岁，庙号圣祖。和“正月” 读作“征月”没有明显关系。 B 项：汉武帝即刘彻（公元前156 年—公元前87 年），西汉第七位皇帝。汉武帝在位期间（前141 年-前87 年），在政治上，创设中外朝制、刺史制、察举制，颁行推恩令，加强君主专制与中央集权。在经济上，推行平准、均输、算缗、告缗等措施，铸五铢钱，由官府垄断盐、铁、酒的经营，并抑制富商大贾的势力。文化方面，“罢黜百家，独尊儒术”，并设立太学。对外，汉武帝采扩张政策，除与匈奴长年交战外，还破闽越、南越、卫氏朝鲜、大宛，又凿空西域、开丝绸之路，并开辟西南夷。和“正月”读作“征月”没有明显关系。 D 项：春秋时期，是中国历史东周前半期历史阶段。自公元前770 年至公元前476 年这段历史时期，史称“春秋时期”。鲁国史官把当时各国重大事件，按年、季、月、日记录下来，一年分春、夏、秋、冬四季记录，简括起来就把这部编年史名为《春秋》。和“正月”读作“征月”没有明显关系。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-009","paperId":"gz2018a","num":9,"year":2018,"region":"广州","module":"常识判断","sub":"科技生活","stem":"随着科技发展，微生物在我们生活中发挥越来越大的作用。以下不属于微生物应用事例的是：","options":["用青霉素治疗疾病","注射减毒疫苗","利用木质纤维素水解发酵生产生物燃料","在伊蚊身上植入编码了疟原虫抗体的基因"],"answer":"D","explanation":"正确答案：D，全站正确率：49%，易错项：C。解析第一步，本题考查微生物应用并选错误项。第二步，微生物包括：细菌、病毒、真菌以及一些小型的原生生物、显微藻类等在内的一大类生物群体，它个体微小，与人类关系密切。D 疟原虫通过伊蚊传至人体后，人类感染疟原虫后产生免疫力，能抵抗同种疟原虫的再感染。这是基因技术的应用，与微生物无关。因此，选择D 选项。拓展 A 项：青霉属是真菌的一种（真核细胞），属于子囊菌亚门，不整囊菌纲，散囊菌目，散囊菌科，青霉属。常见于腐烂的水果、蔬菜、肉食及衣履上，多呈灰绿色。我们现在所用的抗生素大多数是从微生物培养液中提取的，有些抗生素已能人工合成。青霉素药理作用是干扰细菌细胞壁的合成。青霉素的结构与细胞壁的成分粘肽结构中的D-丙氨酰-D-丙氨酸近似，可与后者竞争转肽酶，阻碍粘肽的形成，造成细胞壁的缺损，使细菌失去细胞壁的渗透屏障，对细菌起到杀灭作用。 B 项：减毒疫苗是指病原体经过各种处理后，发生变异，毒性减弱，但仍保留其免疫原性。所使用的是活的微生物，可在机体内长时间起作用、而诱导较强的免疫反应。 C 项：将木质纤维素类物质转化为燃料，必须首先将木质纤维素降解为纤维素、半纤维素和木质素，然后纤维素或半纤维素降解为葡萄糖或戊糖，最后将单糖发酵。纤维素的性质很稳定，只有在催化剂存在的情况下，其水解反应才能显著进行。其中微生物代谢工程是木质纤维素生产燃料的关键。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-010","paperId":"gz2018a","num":10,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"克隆属于无性繁殖。如果人们将黑色兔子的乳腺细胞核移植到白色兔子的去核卵细胞中，形成重组细胞，再经过一系列培育，克隆出一只兔子。那么，这只克隆兔子的毛色是：","options":["白色","黑色","黑白相间","灰色"],"answer":"B","explanation":"正确答案：B，全站正确率：66%，易错项：A。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 - 解析第一步，本题考查克隆技术。第二步，细胞核是遗传信息库，是细胞代谢和遗传的控制中心。对生物的遗传具有重要意义。因此，在克隆的过程中，谁提供了细胞核，克隆出来的生物就像谁。因为克隆兔细胞核是黑色兔子提供的，并且遗传信息在细胞核中，所以黑色兔子的细胞核内具有黑色兔子的遗传信息，它的毛色是黑色。因此，选择B 选项。拓展克隆技术：将含有遗传物质的供体细胞的核移植到去除了细胞核的卵细胞中，利用微电流刺激等使两者融合为一体，然后促使这一新细胞分裂繁殖发育成胚胎，当胚胎发育到一定程度后，再被植入动物子宫中使动物怀孕，便可产下与提供细胞核者基因相同的动物。这一过程中如果对供体细胞进行基因改造，那么无性繁殖的动物后代基因就会发生相同的变化。克隆技术不需要雌雄交配，不需要精子和卵子的结合，只需从动物身上提取一个单细胞，用人工的方法将其培养成胚胎，再将胚胎植入雌性动物体内，就可孕育出新的个体。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-011","paperId":"gz2018a","num":11,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"当前我国国企国资改革扎实推进，（）改革基本完成，兼并重组、减压层级、提质增效取得积极进展。","options":["公司制","股份制","混合所有制","股权制获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 -"],"answer":"A","explanation":"正确答案：A，全站正确率：18%，易错项：C。解析第一步，本题考查时政。第二步，2018 年政府工作报告指出：国企国资改革扎实推进，公司制改革基本完成，兼并重组、压减层级、提质增效取得积极进展。国有企业效益明显好转，去年利润增长23.5%。深化能源、铁路、盐业等领域改革。放宽非公有制经济市场准入。因此，选择A 选项。拓展股份制亦称“股份经济”是指以入股方式把分散的，属于不同人所有的生产要素集中起来，统一使用，合理经营，自负盈亏，按股分红的一种经济组织形式，也是企业财产所有制的一种形式。混合所有制企业，是指由公有资本（国有资本和集体资本）与非公有制资本（民营资本和外国资本）共同参股组建而成的新型企业形式。混合所有制企业的出现是伴随着改革开放的深入，现代企业制度的确立以及股份制企业的涌现而出现的新兴的企业组建模式。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-012","paperId":"gz2018a","num":12,"year":2018,"region":"广州","module":"常识判断","sub":"法律","stem":"“赋”“比”“兴”是《诗经》中的三种基本表现手法。其中“兴”有感发兴起之意，是因某一事物之出发而引出所欲叙写之事物的一种表达方法。下列不属于“兴”手法的诗句是：","options":["苕之华，芸其黄矣。心之忧矣，维其伤矣。","硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。","关关雎鸠，在河之洲。窈窕淑女，君子好逑。","桃之夭夭，灼灼其华。之子于归，宜其室家。"],"answer":"B","explanation":"正确答案：B，全站正确率：33%，易错项：A。解析第一步，本题考查文学并选错误项。第二步，赋：平铺直叙，铺陈、排比，相当于如今的排比修辞方法。比：类比，比喻。兴：托物起兴，先言他物，然后借以联想，引出诗人所要表达的事物、思想、感情。B 项将剥削者比喻为大老鼠，体现了剥削者贪婪残忍的本性，生动形象又贴切地表达了诗人的愤懑不平之情，是赋比兴中的“比”，而不是“兴”。因此，选择B 选项。拓展 A 项：“苕之华，芸其黄矣。心之忧矣，维其伤矣”出自《小雅•苕之华》，意思是：凌霄开了花，花儿黄又黄。内心真忧愁，痛苦又悲伤。先言凌霄花，再言自己内心的忧愁悲伤。属于“兴”的表现手法。 C 项：“关关雎鸠，在河之洲。窈窕淑女，君子好逑”出自《国风•周南•关雎》，是诗经的首篇，意思是：关关和鸣的雎鸠，相伴在河中小洲。美丽贤淑的女子，真是君子好配偶。先言雎鸠鸟，再言自己对于女子的爱慕，表达了青年男女健康、真挚的思想感情。属于“兴”的表现手法。 D 项：“桃之夭夭，灼灼其华。之子于归，宜其室家”出自《诗经•周南•桃夭》，意思是：翠绿繁茂的桃树啊，花儿开得红灿灿。这个姑娘嫁过门啊，定使家庭和顺又美满。此诗以桃花起兴，为新娘唱了一首赞歌，揭示了新娘与家人和睦相处的美好品德，也写出了她的美好品德给新建的家庭注入新鲜的血液，带来和谐欢乐的气氛。属于“兴”的表现手法。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-013","paperId":"gz2018a","num":13,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"具有社会行为的动物大多具有以下特征：①群体内部往往形成一定组织；②组织成员之间有明确的分工； ③群体内有一定的等级。下列属于动物社会行为的是：","options":["母猩猩哺育幼猩猩","乌贼遇敌喷出墨汁","蜂王依靠工蜂喂养","狗为吃骨头而争抢"],"answer":"C","explanation":"正确答案：C，全站正确率：91%，易错项：A。解析第一步，本题考查动物社会行为。第二步，蜜蜂群体而居；且群体成员分为三级：蜂王，工蜂，雄蜂；蜂王的一生由工蜂喂养，表明各有分工，属于社会行为。因此，选择C 选项。拓展获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - A 项：母猩猩哺育幼猩猩是生来就有的，不学就会的，是由体内的遗传物质所决定的先天性行为。 B 项：乌贼遇到敌害时，从墨囊中喷出墨汁，这是动物的防御行为，不牵涉到群体和组织。 D 项：狗为吃骨头而争抢，属于取食行为，狗与狗之间没有分工，也没有等级，不具备社会行为的特性。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-014","paperId":"gz2018a","num":14,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"为建立生态文明绩效考评和责任追究制度，我国已推行（），开展省级以下环保机构垂直管理制度改革试点。","options":["河长制、江长制","江长制、湾长制","河长制、湖长制","湖长制、湾长制"],"answer":"C","explanation":"正确答案：C，全站正确率：63%，易错项：A。解析第一步，本题考查时政。第二步，十三届全国人大一次会议于2018 年3 月5 日在人民大会堂举行，李克强总理作政府工作报告时指出，推进农村承包地“三权”分置改革、确权面积超过80%，改革重要农产品收储制度。完善主体功能区制度，建立生态文明绩效考评和责任追究制度，推行河长制、湖长制，开展省级以下环保机构垂直管理制度改革试点。各领域改革的深化，推动了经济社会持续健康发展。因此，选择C 选项。拓展 ①“河长制”即由中国各级党政主要负责人担任“河长”，负责组织领导相应河湖的管理和保护工作。2003 年，浙江省长兴县在全国率先实行河长制，2016 年12 月，中国中共中央办公厅、国务院办公厅印发了《关于全面推行河长制的意见》，并发出通知要求各地区各部门结合实际认真贯彻落实。2017 年元旦，习近平总书记在新年贺词中发出“每条河流要有‘河长’了”的号令。 ②“湖长制”即由湖泊最高层级的湖长担任第一责任人，对湖泊的管理保护负总责，其他各级湖长对湖泊在本辖区内的管理保护负直接责任，按职责分工组织实施湖泊管理保护工作。湖长制是“河长制”基础上及时和必要的补充，其实施有利于促进绿色生产生活方式的形成，有利于建立流域内社会经济活动主体之间的共建关系，形成人人有责、人人参与的管理制度和运行机制，故逐步在全国推广。 ③“江长制”“湾长制”没有类似说法。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-015","paperId":"gz2018a","num":15,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"以下国家没有热带雨林的是：","options":["加拿大","印度尼西亚","刚果民主共和国","巴西"],"answer":"A","explanation":"正确答案：A，全站正确率：77%，易错项：C。解析第一步，本题考查热带雨林相关知识点并选错误项。第二步，热带雨林是地球上一种常见于赤道附近热带地区的森林生态系统，主要分布于东南亚、澳大利亚北部、南美洲亚马逊河流域、非洲刚果河流域、中美洲和众多太平洋岛屿。加拿大位于北美洲北半部，约在北纬41° -83°，西经52°-141°之间。加拿大境内没有热带雨林。因此，选择A 选项。拓展 B 项：印度尼西亚，位于亚洲东南部，地跨赤道，典型的热带雨林气候，年平均温度25-27℃，无四季分别。印度尼西亚是亚太地区热带森林面积最大的国家和世界上热带森林面积第三大的国家，拥有亚太地区将近半数的热带雨林。 C 项：刚果民主共和国大部份地区位置在北纬4°到南纬4°间，属赤道气候区，刚果民主共和国是非洲地区热带森林面积最大的国家和世界上热带森林面积第二大的国家，拥有非洲地区超过半数的热带雨林。 D 项：巴西是南美洲最大的国家，享有“足球王国”的美誉，国土面积居世界第五。巴西是拉丁美洲和世界上热带雨林面积最大的国家。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-016","paperId":"gz2018a","num":16,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"填入下列横线处的词语，最恰当的是：慎众，慎的是“________”。群体心理学认为，个体行为容易受群体的意识、情绪和选择影响。正如《乌合之众》一书所说，“群体中的个人，不过是众多沙粒的一颗，可以被风吹到无论什么地方”。所以，当身处群体中时，要格外注意自己的言行，不为“生态”所染、不为“氛围”所乱、不为“情绪”所惑。","options":["出众","众怒","从众","众说"],"answer":"C","explanation":"正确答案：C，全站正确率：83%，易错项：D。解析第一步，分析语境。根据“群体心理学认为，个体行为……不为‘生态’所染、不为‘氛围’所乱、不为‘情绪’所惑”可知，该空要表达“受群体影响，被群体左右”的意思。第二步，辨析选项。A 项“出众”指超过众人，不符合文意，排除A 项。B 项“众怒”指众人的愤怒，不符合文意，排除B 项。C 项“从众”指按多数人的意见或流行的做法（行事），符合文意。D 项“众说”指各种各样的说法，不符合文意，排除D 项。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-017","paperId":"gz2018a","num":17,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"填入下列横线处的词语，最恰当的是：文化遗产不可复制，也不能再造。不管申遗还是入选之后，________应始终放在第一位。只有这样，文化遗产才能更好造福于民，传之子孙。","options":["开发","保护","重建","研究"],"answer":"B","explanation":"正确答案：B，全站正确率：98%，易错项：A。解析第一步，分析语境。根据“文化遗产不可复制，也不能再造”和“文化遗产才能更好造福于民，传之子孙”可知，该空要体现“注重保护”的意思。第二步，辨析选项。A 项“开发”指发现或发掘人才、技术等供利用，不符合文意，排除A 项。B 项“保护” 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 指尽力照顾，使不受损害，符合文意。C 项“重建”指重新建设或建立，不符合文意，排除C 项。D 项“研究” 指探求事物的真相、性质、规律等，不符合文意，排除D 项。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-018","paperId":"gz2018a","num":18,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"填入下列横线处的词语，最恰当的是：中国梦传递________的家国天下情怀，唤醒内心深处的命运共同体意识，凝聚振兴中华的探索与奋斗，成为亿万人民认同的最大公约数，激发起中华民族强烈的________和豪迈的进取心。","options":["喷涌而出幸福感","富丽堂皇获得感","美轮美奂认同感","绵延已久归属感"],"answer":"D","explanation":"正确答案：D，全站正确率：77%，易错项：C。解析第一步，分析第一空。修饰的对象是“家国天下情怀”，即一种精神。A 项“喷涌而出”指液体从某个地方喷射出来，也有比喻灵感、想法等，与“家国天下情怀”搭配合适。B 项“富丽堂皇”用来形容房屋宏伟豪华，也形容诗文词藻华丽，修饰“家国天下情怀”不当，排除B 项。C 项“美轮美奂”原本多形容建筑物雄伟壮观、富丽堂皇，也用来形容雕刻或建筑艺术的精美效果，与“家国天下情怀”搭配不当，排除C 项。D 项“绵延已久”指连续不断，已经很久，与“家国天下情怀”搭配合适。第二步，分析第二空。根据“命运共同体意识”“亿万人民认同的最大公约数”可知，该空要体现出“对中华民族的强烈认同”的意思。A 项“幸福感”侧重基于自身的满足感与安全感而主观产生的一系列欣喜与愉悦的情绪，不符合文意，排除A 项。D 项“归属感”指某一个体对特殊群体及其从属关系的划定、认同、和维系，放在此处可以体现出上述语境。因此，选择D 选项。拓展获得感：表示获取某种利益后所产生的满足感。认同感：指人对自我及周围环境有用或有价值的判断和评估。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-019","paperId":"gz2018a","num":19,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"填入下列横线处的词语，最恰当的是： “多”与“少”，两者之间绝不仅仅是数量上的对立存在，而恰恰是“量变”与“质变”的一个________。一味追求多，或一味追求少，都有可能把事情的发展引向________的另一面。因而，在看待“多”与“少”上，也要有辩证的观点。","options":["独立状态截然相反","中间过程无法控制","相对状态难以接受","演变过程截然相反"],"answer":"D","explanation":"正确答案：D，全站正确率：84%，易错项：A。解析第一步，分析第一空。根据“不仅仅是……而恰恰是……”可知，关联词构成反向并列，前后含义相反，根据 “对立”可知，该空要体现出“不对立”的意思。A 项“独立状态”和C 项“相对状态”均与“对立”含义相近，不符合文意，故排除A 项和C 项。B 项“中间过程”和D 项“演变过程”能够体现“‘多’与‘少’之间存在相互转化，不完全对立”的意思，符合文意。第二步，分析第二空。根据“一味追求多，或一味追求少”可知，该空要体现出“事情的发展会引向另一个极端”的意思。B 项“无法控制”涉及到“控制”的话题，不符合文意，排除B 项。D 项“截然相反”指完全相反，放在此处符合文意。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-020","paperId":"gz2018a","num":20,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的一组是：不可否认，相比以往，现在的信息来源更加芜杂，信息质量也是________。也正因此，人们更需要权威而不 ________、专业而又通俗易懂的“官方回应”。这类信息一旦供给不足，就会产生“信息逆差”，让那些________、偏激，甚至是虚假、错误的信息占据了舆论市场。","options":["蒸蒸日上旁敲侧击武断","泥沙俱下装腔作势片面","良莠不齐指手画脚怪异","恒河沙数张冠李戴决绝"],"answer":"B","explanation":"正确答案：B，全站正确率：81%，易错项：C。解析第一步，分析第一空。根据“芜杂”“也是”可知，信息质量状况和“芜杂”相照应，该空所填词语感情色彩偏于消极。A 项“蒸蒸日上”形容事物天天向上发展，感情色彩偏积极，排除A 项。B 项“泥沙俱下”比喻好坏不同的人或事物混杂在一起，符合文意。C 项“良莠不齐”比喻好人坏人夹杂在一起，也比喻事物不分好坏的夹杂在一起，符合文意。D 项“恒河沙数”比喻数目极多，与“质量”搭配不当，排除D 项。第二步，分析第二空。根据“专业而又通俗易懂”可知，“专业”与“通俗易懂”含义相反，故该空也应与“权威”含义相反，“权威”指使人信服的力量和威望。B 项“装腔作势”指故意做作想引人注意或吓唬人，符合文意。C 项“指手画脚”形容乱加批评或随意发号施令，不符合文意，排除C 项。答案锁定B 选项。第三步，验证第三空。根据“偏激”“虚假”“错误”可知，B 项“片面”指偏于一面的（跟“全面”词义相对），与“偏激”含义相近，构成词义上的并列，与“虚假”“错误”含义相近，语义程度较轻，构成语义上的递进，符合语境。因此，选择B 选项。拓展旁敲侧击：比喻说话、写文章不从正面直接说明，而是用或明或暗的语言影射、讽刺、攻击，或转弯抹角地表达出来。张冠李戴：比喻名实不符，弄错了对象。武断：①只凭主观作判断；②形容言行主观片面；③妄以权势裁断曲直。怪异：①奇异；②奇异反常的现象。决绝：①断绝关系；②非常坚决。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-021","paperId":"gz2018a","num":21,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：每一位党员干部，都要有________的态度，鼓起________的勇气，拿出________的担当。","options":["不容过不讳过不诿过","不诿过不讳过不容过","不讳过不诿过不容过","不诿过不容过不讳过"],"answer":"A","explanation":"正确答案：A，全站正确率：44%，易错项：B。解析第一步，突破口在第三空。该空修饰的对象是“担当”，该空要体现“承担过失、责任”的意思。A 项“不诿过”指不把过失推给别人，能自己承担，符合文意。B 项和C 项“不容过”指不容许过错；D 项“不讳过”指不隐瞒过错或失误。均未体现“承担过失、责任”的意思，不符合文意，排除B 项、C 项和D 项。答案锁定A 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 - 选项。第二步，验证第一空和第二空。“不容过”指不容许过错，与“态度”搭配合适。“不讳过”指不隐瞒过错或失误，与“勇气”搭配合适。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-022","paperId":"gz2018a","num":22,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：《史记》中记载：“子产治郑，________；子贱治单父，________；西门豹治邺，________。”子产靠的是亲力亲为，明察秋毫；子贱注重教化百姓，选贤任能；而西门豹则以水利富民，以重典治乱。","options":["民不敢欺民不能欺民不忍欺","民不能欺民不忍欺民不敢欺","民不忍欺民不敢欺民不能欺","民不忍欺民不能欺民不敢欺"],"answer":"B","explanation":"正确答案：B，全站正确率：39%，易错项：D。解析第一步，突破口在第三空。根据“西门豹治邺”“西门豹则以水利富民，以重典治乱”可知，西门豹重视法典治国，在暴力威慑下，故该空应体现“老百姓不敢欺骗他”的意思。A 项“民不忍欺”即百姓不忍心欺骗，C 项“民不能欺”即百姓没有能力欺骗，均不能体现“不敢”的意思，故排除A 项和C 项。B 项和D 项“民不敢欺”能体现“不敢欺骗”的意思。第二步，再看第二空。根据“子贱治单父”“子贱注重教化百姓，选贤任能”可知，子贱重视教育感化老百姓，选拔任用贤能的人，百姓会发自内心的尊重他，故该空应体现“老百姓不忍心欺骗他”的意思。B 项“民不忍欺”能体现“不忍心”的意思，符合文意。D 项“民不能欺”不能体现“不忍心”的意思，不符合文意，排除 D 项。答案锁定B 选项。第三步，验证第一空。根据“子产治郑”“子产靠的是亲力亲为，明察秋毫”可知，子产凡事亲自参与且观察细致入微，故该空应体现“老百姓没有能力欺骗他”的意思，B 项“民不能欺”符合文意。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-023","paperId":"gz2018a","num":23,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - 一个劳模，朴素的事迹本来很让人感动，平凡________能触动和抵达人心，________一旦拔高到不食人间烟火的地步，________让读者产生强烈的抵触情绪，让人觉得很假，________会连累劳模和典型受到批评和抵制，实际上是“黑”了好人。","options":["可能然而反而因为","必然甚至无论是还是","本就然而就会甚至","当然进而可能也可能"],"answer":"C","explanation":"正确答案：C，全站正确率：91%，易错项：A。解析第一步，突破口在第二空。根据前文“平凡能触动和抵达人心”和“拔高到不食人间烟火的地步”可知，前后构成转折关系。A 项和C 项“然而”表转折关系，符合上述语境。B 项“甚至”和D 项“进而”表递进关系，不符合上述语境，故排除B 项和D 项。第二步，再看第四空。根据前文“让人觉得很假”和后文“连累劳模受批评和抵制”，前后感情色彩一致，语意程度加重，构成递进关系。A 项“因为”表因果关系，不符合上述语境，排除A 项。C 项“甚至”表递进关系，符合上述语境。答案锁定C 选项。第三步，验证第一空和第三空。根据“朴素的事迹本来很让人感动”“平凡________能触动和抵达人心”可知，前后构成并列关系。C 项“本就”能够使前后构成并列，符合上述语境。根据“一旦拔高到不食人间烟火的地步，________让读者产生强烈的抵触情绪”可知，前后构成充分条件关系。C 项“就会”能够使前后构成充分条件关系，符合上述语境。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-024","paperId":"gz2018a","num":24,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是： “露凝千片玉，菊散一丛金”。________菊花被视为傲寒的标识，农历九月________被称为菊月，________ 还有一种花，往往被文人们忽视，那便是棉花。“寒露时节尾花收。寒露不收棉，霜降莫怨天。”在农人的眼中，棉花________是秋季的“尾花”。","options":["尽管又因而也","即使却可是就","因为并所以正","虽然也但是才"],"answer":"D","explanation":"正确答案：D，全站正确率：84%，易错项：B。解析第一步，突破口在第三空。根据前文“菊花被视为傲寒的标识”与后文“还有一种花，往往被文人们忽视”可知，前后文构成转折关系，A 项“因而”和C 项“所以”均表因果关系，不符合上述语境，故排除A 项和C 项。 B 项“可是”和D 项“但是”表转折关系，符合上述语境。第二步，再看第二空。根据前文“菊花被视为傲寒的标识”与后文“农历九月________被称为菊月”可知，前后文构成并列关系。B 项“却”表转折关系，不符合上述语境，排除B 项。D 项“也”表并列关系，符合上述语境。答案锁定D 项。第三步，验证第一空和第四空。根据前文“菊花被视为傲寒的标识”与后文“还有一种花，往往被文人们忽视” 所构成的转折关系，D 项“虽然”与后文“但是”搭配构成转折关系，符合上述语境。根据“寒露时节尾花收。寒露不收棉，霜降莫怨天”可知，农人不认可菊花，认为棉花才是“尾花”，D 项“才”符合上述语境。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-025","paperId":"gz2018a","num":25,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：习近平讲述马克思写《资本论》的故事，以此重申这样一个道理：高尚的气节是每一个成大事业者应有的品质， ________面对怎样的艰难险阻，________坚定信念、坚守气节，________一定能战胜困难、取得成功。","options":["即使也要就","无论只要就","一旦只要也","如果但是也"],"answer":"B","explanation":"正确答案：B，全站正确率：93%，易错项：A。解析第一步，突破口在第二空和第三空。根据前文“坚定信念、坚守气节”和后文“一定能战胜困难、取得成功” 可知，“坚定信念、坚守气节”是达成“战胜困难、取得成功”的条件。A 项“也要”“就”，C 项“只要” “也”和D 项“但是”“也”均不能构成条件关系，故排除A 项、C 项和D 项。B 项“只要”“就”构成充分条件关系，符合上述语境。答案锁定B 选项。第二步，验证第一空。B 项“无论”和“怎样”搭配合适，并且“无论”和后文“就一定能”搭配亦合适，符获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 - 合上下文语境。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-026","paperId":"gz2018a","num":26,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"在古罗马时代，为了确保法官的独立性和公正性，法官往往并不主动搜集或调查证据，而只是在案件审判过程中，通过当事人双方所提交的证据来确定案件事实。在案件审理之前，法官对案件事实往往一无所知，这有利于避免法官就案件事实形成不合理的前见，避免先入为主作出评判。关于这段文字，以下理解准确的是：","options":["公正性是法官审理案件的首要因素","先入为主会对法官的裁判带来严重影响","不讲程序正义，无法保证结果正义的实现","法官对案件事实一无所知，有利于公正裁判"],"answer":"B","explanation":"正确答案：B，全站正确率：44%，易错项：D。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项对应“为了确保法官的独立性和公正性……确定案件事实”，“首要因素”在文段没有提及，属于无中生有，错误。B 项对应“这有利于避免法官就案件事实形成不合理的前见，避免先入为主作出评判”，符合原文，正确。C 项对应文段第一句，“程序正义”在文段没有提及，属于无中生有，错误。D 项对应文段第二句，法官对案件的一无所知有时间作前提，即“案件审理之前”，属于曲解文意，错误。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-027","paperId":"gz2018a","num":27,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"“新零售”虽然已经成为当下最火热的概念，但究竟何为新零售其实并没有一个准确的定义，专业的说法是“人、货、场在互联网和大数据下的重构”，通俗地理解大概就是线上和线下结合，然后辅之以人工智能、大数据、云计算等技术手段，对传统零售业的生产销售等环节实现全方位的升级改造。以下说法可以从原文推出的是：","options":["人工智能等新技术的出现是实现新零售的必要条件","新零售能够弥补传统零售业线下销售渠道单一的不足","新零售大量运用高科技，能够有效降低传统人力成本","传统电商的增长瓶颈是推动新零售落地的动力"],"answer":"B","explanation":"正确答案：B，全站正确率：43%，易错项：A。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项对应“辅以人工智能……等技术手段”，文段没有提及新技术出现是实现新零售的“必要条件”，属于偷换逻辑，错误。B 项对应“对传统零售业的生产销售等环节实现全方位的升级改造”，销售渠道属于销售环节，升级改造是弥补以前的不足，是一种进步，合理推测出“新零售能够弥补传统零售业线下销售渠道单一不足”，正确。C 项对应“然后辅之以人工智能、大数据、云计算等技术手段，对传统零售业的生产销售等环节实现全方位的升级改造”，文段没有提及“人力成本”，属于无中生有，错误。D 项在文段中没有提及，属于无中生有，错误。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-028","paperId":"gz2018a","num":28,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"多少干部，倒在类似的“大节”“小节”的认识误区中，以为“干部出点小问题是难免的，但只要干事业就‘大节不亏’”。从来没有不起眼的蚁穴，只有守不住的长堤，丢了“清政”，何以“有为”？这两者没有 “大”“小”之分，都是党员干部须臾不可丢失的“大节”。下列哪个词语，最符合这段文字所表达的意思？","options":["惩前毖后","积微成著","正本清源","积羽沉舟"],"answer":"D","explanation":"正确答案：D，全站正确率：38%，易错项：C。解析第一步，分析文段。文段先讲了干部因为“大节”“小节”的认识误区而犯错的现象，接着用“蚁穴”和“长堤”来举例论证党员干部不能不重视“小节”，最后点明观点：没有“大”“小”之分，党员干部都需要重视。全文为“分—总”结构，主旨句为最后一句。第二步，对比选项。A 项“惩前毖后”指批判以前所犯的错误，吸取教训，使以后谨慎些，不致再犯，主旨句并没有“吸取教训，以后不犯”的含义，故不是主旨句的同义替换，排除A 项。B 项“积微成著”指微不足道的事物，经过长期积累就会变得显著。其中“变得显著”在主旨句中没有体现，故不是主旨句的同义替换，排除B 项。C 项“正本清源”指比喻从根本上加以整顿清理，主旨句没有提及“从根本上整顿”的内容，故C 项不能作为主旨句的同义替换项，排除C 项。D 项“积羽沉舟”比喻坏事虽小，积累起来就会造成严重的后果，是对主旨句的同义替换。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-029","paperId":"gz2018a","num":29,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"对于脑性瘫痪的婴儿来说，爬行是件很困难的事。这些孩子的大脑受到损伤，对肌肉的控制力较差，所以往往无法在地上爬行。相应地，与运动技能和空间定位相关的神经连接的发育也会由此停滞，这将导致患者日后遇到更多与运动有关的问题。有研究团队开发出了一种旨在有助于婴儿爬行的新设备，在机器的帮助下，疑似脑性瘫痪婴儿的相应神经得到锻炼，从而能够更早学习爬行，爬得也更远。这段文字旨在说明：","options":["脑性瘫痪儿爬行很困难","早期干预可以改善运动控制","新设备可帮助脑瘫婴儿学习爬行","大脑受损的婴儿对肌肉的控制力很差"],"answer":"C","explanation":"正确答案：C，全站正确率：79%，易错项：B。解析第一步，分析文段。文段先提出脑瘫婴儿爬行困难导致日后会遇到更多与运动有关的问题，接着提出对策，即开发出有助于婴儿爬行的新设备能够使脑瘫婴儿神经得到锻炼。文段的结构为“提出问题—解决问题”，主旨句为对策句。第二步，对比选项。C 项是对主旨句的同义替换。因此，选择C 选项。拓展 A 项和D 项：文段提出问题的部分。B 项：“早期干预”不是文段重点，文段重点强调“开发的新设备”。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-030","paperId":"gz2018a","num":30,"year":2018,"region":"广州","module":"言语理解与表达","sub":"语句表达","stem":"法律的实施效果很大程度上是由民众和执法者对违法行为的态度决定的。禁止燃放烟花爆竹的规定与中国人“逢年过节喜庆应该放鞭炮”的社会习俗是不一致的。在大多数人的心目中，燃放烟花爆竹是“辞旧迎新”，是“热热闹闹过新年”的重要标志。甚至在很多人的意识中，会有“如果不放鞭炮，怎么算过年”这样的意识。所以许多人看到别人违反法规放鞭炮、点烟花，不仅不鄙视他，而且还会觉得挺高兴，乐观其成，无形中减弱了执行的惩罚效果。下列论断最符合上文观点的是：","options":["在法律和社会风俗不一致时法律的实施效果不会太好获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -","法律实施效果的好坏完全由法律本身所决定","凡是违反社会习惯的法律法规都应当被废除","法律法规在制定时应当征求民众和执法者意见"],"answer":"","explanation":"","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-031","paperId":"gz2018a","num":31,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"新技术往往会以其特有的未知性、前瞻性，冲撞我们的心理认知舒适区。人们害怕大数据的发展，会使自己在未来被控制或被替代，这样的担心不能说是多余。据统计，欧盟目前90%的工作需要人们具备某种数字技能，而65%的欧盟新入学儿童长大后将从事目前尚不存在的职业。不过这一尚处在青年时期的“新技术”，如人类本身一样，是复杂的多面体，因此观察也需要更丰富、更多元的角度。关于这段文字，以下理解准确的是：","options":["不具备某种数字技能，很难在欧盟开展工作","65%的欧盟新入学儿童长大后面临失业的风险","新技术的发展往往弊大于利","大数据的发展会控制人类本身"],"answer":"A","explanation":"正确答案：A，全站正确率：65%，易错项：D。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项对应“欧盟目前90%的工作需要人们具备某种数字技能”，A 项理解准确。B 项对应“65% 的欧盟新入学儿童长大后将从事目前尚不存在的职业”，把“从事目前尚不存在的职业”偷换为“面临失业”，属于偷换概念，B 项理解错误，排除B 项。C 项“弊大于利”文段未提及，属于无中生有，排除C 项。D 项对应“人们害怕大数据会使自己在未来被控制或被替代，这样的担心不能说是多余”，原文只是人们会担心，并没有成为事实，属于偷换语气，排除D 项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - 因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-032","paperId":"gz2018a","num":32,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"平心而论，自古至今闲逸都是一种奢侈品，它取决于两个一般人最难以企及的前提：物质上的丰裕或者至少能够自给自足的生存自由，时间上有足够的闲余甚至或许靠没事找事来打发时光的自由。以此两者为前提，再辅以特定的精神需求，无论这种精神要求是来自虔诚如宗教意义上的感召，还是纯属内在的好奇，抑或是为了迎合时尚以示高贵、体面与教养，至少在被称之为“科学崛起”或“科学革命”的十七世纪，科学还只是极少数人方能消费得起的“瓷器活”。下列说法与原文相符的是：","options":["闲逸和精神需求的要求使得科学难在特定年代普及","时间上的闲余可以迎合时尚以示高贵、体面与教养","在十七世纪，只有富有的人才能从事科学相关工作","精神需求必然来源于宗教的感召或是心灵的好奇"],"answer":"A","explanation":"正确答案：A，全站正确率：60%，易错项：C。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项是对整个文段的概括，文段先介绍闲逸是奢侈品，再辅以特定的精神需求，至少在17 世纪，科学还只是少数人才能消费得起的“瓷器活”，即科学难以普及，总结起来就是闲逸和精神需求使得科学难以普及，A 项符合文意。B 项“时间上的闲余”对应“闲逸”的前提之一，即“时间上有足够的闲余甚至或许要靠没事找事来打发时光的自由”，文中并未指出它可以迎合“时尚以示高贵、体面与教养”，故属强拉关系，为无中生有，排除B 项。C 项对应文段最后一句，“科学只是少数人才消费得起的‘瓷器活’”，意思是科学尚未普及，不是说只有富有的人才能从事科学相关工作，属于曲解文意，排除C 项。D 项对应“再辅以特定的精神需求，无论这种精神要求是来自虔诚如宗教意义上的感召，还是纯属内在的好奇，抑或是为了迎合时尚以示高贵、体面与教养”，也就是精神需要的来源在文中提及了三个方面，“必然来源于”其中的两个方面，表述过于片面且过于绝对，排除D 项。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-033","paperId":"gz2018a","num":33,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"就世界范围而言，在成熟的市场，大企业都是通过不断创新来赢得更多利润的。只有在不够成熟的市场，才有空间通过其他手段来获得高额利润。在一个信息日益对称的时代，畸形的高利润是不正常的，利用消费者心里不成熟等因素获得高额利润的企业将不再受欢迎。随着国内市场和消费者的更加成熟和理性，企业的未来一定会为消费者提供更好的更多样的产品。下列不符合作者观点的是：","options":["未来企业可以通过不断创新来获得更多利润","未来企业只有通过更多样营销才能获得高额利润","能够为消费者提供更好更丰富产品的企业才能在未来崛起","市场成熟度影响了企业获得高额利润的可能性"],"answer":"B","explanation":"正确答案：B，全站正确率：66%，易错项：D。解析第一步，阅读文段，将选项与文中作者观点一一对应。第二步，对比选项。A 项对应文段首句“就世界范围而言，在成熟的市场，大企业都是通过不断创新来赢得更多利润的”，A 项符合作者观点。B 项和C 项对应文段尾句，“随着国内市场和消费者的更加成熟和理性，企业的未来一定会为消费者提供更好的更多样的产品”。B 项中将“多样产品”偷换为“多样营销”，属于偷换概念，B 项不符合作者观点。C 项根据尾句可以判断表述正确。D 项对应文段前两句话，“就世界范围而言，在成熟的市场，大企业都是通过不断创新来赢得更多利润的。只有在不够成熟的市场，才有空间通过其他手段来获得高额利润”，可知D 项符合作者观点。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-034","paperId":"gz2018a","num":34,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"肉食悖论指的是，一些人喜欢吃肉，但不能联想到提供肉的动物死去的场景。研究者发现，人们通过一种被称为“语言伪装”的方法，让有感觉的生灵与潜在的食物来源之间的关联变得更模糊，以此来消除这种认知失调。例如，我们提到肉时不直接说动物的名称，英语里把猪肉叫做pork，牛肉叫做beef 或者叫做培根什么的。而18 世纪的日本，由于当时的幕府禁止人们吃兽肉，偷吃肉的人以植物名称代替肉类，把马肉称为樱肉，把鹿肉称为红叶，把野猪肉称为牡丹。这段文字主要说明：","options":["“语言伪装”是人类自欺欺人的表现","日本人对植物的热爱超过动物","文化因素是消解肉食悖论的关键","“语言伪装”有助于克服认知失调"],"answer":"D","explanation":"正确答案：D，全站正确率：70%，易错项：A。解析第一步，分析文段。文段首句介绍“肉食悖论”的概念，即“一些人喜欢吃肉，但不能联想到提供肉的动物死去的场景”。第二句提出解决“肉食悖论”的对策，通过“语言伪装”这一方法来消除这种认知失调。第三句和第四句为举例论证，支撑前文对策。通过分析可知，主旨句为第二句的对策句，强调“语言伪装”这一方法。第二步，对比选项。D 项是对主旨句的同义替换。因此，选择D 选项。拓展 A 项：没有说到“语言伪装”的作用，非文段重点，且“自欺欺人”表述错误。B 项和C 项：缺少核心话题“语言伪装”，且B 项“日本人”为举例论证的内容。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-035","paperId":"gz2018a","num":35,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"近年来，广州经济正经历一次深刻转型。此前，广州作为全球重要的商贸中心，更多的是汇聚全球的货物流、人流。而广州现在对枢纽型网络城市的打造，则旨在汇聚更重要的资金和智力（技术）要素，以形成一个全球性的高端要素配置枢纽。同时广州的产业结构也加速优化。在原有汽车、日化等优势产业的基础上，代表未来产业方向的“两端”产业——“终端产业”和“高端产业”正被引入广州，并实现集群化发展，从而补上了这座城市长期存在的产业短板。最适合做这段文字标题的是：","options":["广州顺应全球产业大势的自我变革","广州产业体系的未来发展趋势","广州未来经济体系建设","广州未来经济发展战略部署"],"answer":"A","explanation":"正确答案：A，全站正确率：51%，易错项：D。解析第一步，分析文段。文段首句指出广州经济正在转型，接下来通过“此前”和“现在”的对比论述了广州第一方面的转型，即从原来汇聚全球的货物流、人流转型到汇聚资金和智力（技术）等高端要素。随后通过“同时” 与前文构成并列，讲述了第二方面的转型，论述广州的产业结构也加速优化，指出产业结构进行了怎样的优化，即在原有优势产业的基础上，向“两端”产业进行产业结构优化。文段为“总—分”结构，首句为文段主旨句，强调广州经济的“深刻转型”。第二步，对比选项。A 项是对文段主旨句的同义替换。因此，选择A 选项。拓展 B 项、C 项和D 项：均只提及了广州未来的方面，属于文段分论点，并非文段重点。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-036","paperId":"gz2018a","num":36,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯，语言流畅的文字排列顺序，最合理的是： ①简单的答案是，如果信息是完全的，平等和效率是可以分开的。 ②读者可能会问，什么时候平等和效率可以分开呢？ ③在社会当中，平等和效率的关系是人们经常讨论的一个问题。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - ④也就是说，在完全信息的条件下，社会既可以实现最大效率，同时又可以达到合意的平等。 ⑤平等和效率之所以搅合在一起，有的时候为了效率会损害平等，而为了平等，就会损失效率，就是因为信息不完全造成的。","options":["②①③④⑤","③①②⑤④","③②①④⑤","②①④③⑤"],"answer":"","explanation":"","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-037","paperId":"gz2018a","num":37,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯，语言流畅的文字排列顺序，最合理的是： ①但是，当你一旦走入生活就不一样了，那里面有精彩的故事、鲜活的人物和传神的细节。 ②特别是艺术的形式与美感，只能从人类的生活本身去发现、提炼与获得。 ③有一位诗人形容作家坐在屋里挖空心思写不出东西的窘态是“把手指甲都绞出了水来”。 ④深入地去体察自然，才能胸有万壑，下笔有神。 ⑤艺术虽然高于生活，但归根结底源于生活，源于客观实际。","options":["②①⑤③④","③②①⑤④","④③②①⑤","⑤②④③①"],"answer":"D","explanation":"正确答案：D，全站正确率：75%，易错项：B。解析第一步，观察选项特征，确定首句。②中出现“特别是”表递进强调，不适合做首句，排除A 项。第二步，利用②的递进关系进行捆绑，②的话题是强调“艺术”，其前一句也应该围绕“艺术”进行描述，⑤ 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 - 是论述“艺术源于生活和客观实际”，②是论述“特别是艺术的形式与美感，只能从人类的生活本身去发现、提炼与获得”，⑤②恰构成递进关系，③②递进关系不成立，排除B 项和C 项。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-038","paperId":"gz2018a","num":38,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯，语言流畅的文字排列顺序，最合理的是： ①但是要真正落实“地方各级人民政府应当对本行政区域的环境质量负责”，光“亮相”是不够的，还得“亮剑”。 ②从某种意义上来说，这种“亮相”，也为这些环保落后城市提供了一个奋发向上的契机。 ③督促政府守法的手段，最常见的就是把那些环保不力的城市，放到聚光灯下“亮相”。 ④“亮相”并不是一种“法律责任”，但通过舆论的压力，可以起到很好的威慑效果。 ⑤只有把追责的板子直接打到党政领导干部身上，他们才会有更充分的压力和动力“真重视，真抓”环保工作。","options":["③④②①⑤","④③①⑤②","③②①④⑤","④②③⑤①"],"answer":"A","explanation":"正确答案：A，全站正确率：75%，易错项：C。解析第一步，观察选项特征，确定首句。③句引出话题，督促政府守法的手段，最常见的就是放到聚光灯下“亮相”。 ④句是对“亮相”这一对策效果的论述。所以③更适合作为首句，排除B 项和D 项。第二步，验证A 项和C 项。判断③句后面接②句还是④句。②句说这种“亮相”也为这些环保落后城市提供了一个奋发向上的契机，而③句并没有提及“这些环保落后城市”，没有②句代词所要指代的内容，两个句子不连贯，排除C 项。而④句是对“亮相”这一对策效果的论述，正好衔接话题“亮相”。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-039","paperId":"gz2018a","num":39,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"近代以来，中华民族遭受的苦难之重，付出的牺牲之大，在世界历史上都是罕见的，可谓 “________________”。改革开放以来，我们不断艰辛探索，终于找到了实现中华民族伟大复兴的正确道路，正是“________________”。而现在，我们比历史上任何时期都更接近中华民族伟大复兴的目标，比历史上任何时期都更有信心，有能力实现这个目标，一定是“________________”。依次填入画横线部分，最恰当的是：","options":["雄关漫道真如铁，人间正道是沧桑，长风破浪会有时","人间正道是沧桑，雄关漫道真如铁，长风破浪会有时","长风破浪会有时，人间正道是沧桑，雄关漫道真如铁","长风破浪会有时，雄关漫道真如铁，人间正道是沧桑"],"answer":"A","explanation":"正确答案：A，全站正确率：38%，易错项：B。解析第一步，分析第一空前文语境。前文论述的是中华民族遭受的苦难之重，付出的牺牲之大。A 项“雄关漫道真如铁”的意思是群山起伏长路漫漫恰似黑铁，比喻前进的道路艰险漫长、难以跨越，与前文民族遭受重大苦难，付出巨大牺牲相照应，符合语境。B 项“人间正道是沧桑”侧重于人类社会正确的发展规律和法则，不能照应前文的“中华民族遭受的苦难之重，付出的牺牲之大”，排除B 项。C 项和D 项“长风破浪会有时”意为尽管前路障碍重重，但仍将会有一天会乘长风破万里浪，引申为相信总有一天会实现理想、施展抱负，虽然苦闷但不失去信心，给人以激励，也不能照应前文的“中华民族遭受的苦难之重，付出的牺牲之大”，排除C 项和D 项。答案锁定A 项。第二步，验证第二空和第三空。“人间正道是沧桑”中的“正道”对应第二空前的“终于找到了实现中华民族伟大复兴的正确道路”，话题一致。“长风破浪会有时”正好应对“比历史上任何时期都更有信心”。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-040","paperId":"gz2018a","num":40,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"善念如花，善举是果。善念之花常开，善举之果却不易结。心怀善念，是有善端，这就像水之源、火之星，正是善的基础。然而，如果徒有善念而不为，也不过停留在“想”的层面，既不能给陷入困境的人以帮助，也不能给社会风气注入正能量，最终难免水源枯竭，火星熄灭。就此而言，________________。填入画横线部分，最恰当的一句是：","options":["善念和善行是相辅相成，彼此促进的","善念对善行起到了驱动和引导作用","善行比善念更重要，行动比观念更重要","只有落实到善行的善念，才是真正的善念"],"answer":"C","explanation":"正确答案：C，全站正确率：18%，易错项：D。解析第一步，分析横线处的上文语境。“就此而言”是对前文的总结。文段前面几句话论述了善念与善行之间的关系。紧接着通过转折词“然而”引出前文重点，只有善念而不去行动是不好的。也就是前文重点侧重于要有“善行”。结尾横线处作为对前文的总结，也应该与前文“善行”保持话题一致。第二步，对比选项。C 项“善行比善念更重要，行动比观念更重要”与前文话题一致。因此，选择C 选项。拓展 A 项：文段没有论及“善念”和“善行”是相互促进的，表述错误，且文段仅强调“善行”，选项话题与原文也不符。B 项和D 项：都是侧重“善念”这一话题，偏离文段核心话题。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-041","paperId":"gz2018a","num":41,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"2，4，10，28，82，（）","options":["244","246","248","250"],"answer":"A","explanation":"正确答案：A，全站正确率：73%，易错项：B。解析解法一：第一步，数列变化趋势较快，考虑倍数递推数列。第二步，观察数列发现4＝2×3－2，10＝4×3－2，28＝10×3－2，82＝28×3－2，规律为第二项＝第一项× 3－2，则所求项为82×3－2＝244。因此，选择A 选项。解法二：考虑做差，做差如图所示：差数列是公比为3 的等比数列，下一项为54×3＝162，则所求项为82＋162＝244。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-042","paperId":"gz2018a","num":42,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"1，2，4，7，12，（）","options":["18","19","20","21"],"answer":"C","explanation":"正确答案：C，全站正确率：56%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 解法一：第一步，数列变化趋势平缓，考虑递推和数列。第二步，观察数列发现4＝1＋2＋1，7＝2＋4＋1，12＝4＋7＋1，规律为第三项＝第一项＋第二项＋1，则所求项为7＋12＋1＝20。因此，选择C 选项。解法二：数列变化趋势平缓，考虑做差，做差如图所示：差数列是简单递推和数列，下一项为3＋5＝8，则所求项为12＋8＝20。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-043","paperId":"gz2018a","num":43,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"5，7，17，19，29，（）","options":["31","39","41","47"],"answer":"A","explanation":"正确答案：A，全站正确率：91%，易错项：C。解析解法一：第一步，数列变化趋势平缓，优先考虑做差。第二步，做差如图所示：差数列是以2，10 为周期的周期数列，下一项为2，则所求项为29＋2＝31。因此，选择A 选项。解法二：数列变化趋势平缓，考虑做和，做和如图所示：和数列是公差为12 的等差数列，下一项为48＋12＝60，则所求项为60－29＝31。因此，选择A 选项。拓展亦可用隔项做差的思维，隔项做差后形成的新数列是12 的常数数列。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-045","paperId":"gz2018a","num":45,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"2，3，－1，4，－5，（）","options":["－8","－9","8","9"],"answer":"D","explanation":"正确答案：D，全站正确率：79%，易错项：C。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 - 解析第一步，数列变化趋势平缓，考虑递推差数列。第二步，观察数列发现－1＝2－3，4＝3－（－1），－5＝－1－4，规律为第三项＝第一项－第二项，则所求项为4－（－5）＝9。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-046","paperId":"gz2018a","num":46,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"水果店里有相同数量的苹果和梨，现要把这些苹果和梨放入若干个水果篮中。已知每个水果篮放6 个苹果和4 个梨，最后还剩下2 个苹果和18 个梨，那么一共包装了（）个水果篮。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 -","options":["2","4","6","8"],"answer":"D","explanation":"正确答案：D，全站正确率：80%，易错项：C。解析第一步，本题考查基础应用题，用方程法解题。第二步，设包装了x 个水果篮，由苹果和梨数量相等列方程：6x＋2＝4x＋18，解得x＝8。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-047","paperId":"gz2018a","num":47,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某条道路进行灯光增亮工程，原来间隔35 米的路灯一共有21 盏，现要将路灯的间隔缩短为25 米，那么有（）盏路灯无需移动。","options":["2","3","4","5"],"answer":"D","explanation":"正确答案：D，全站正确率：38%，易错项：C。解析第一步，本题考查植树问题。第二步，35 和25 的最小公倍数是5×7×5＝175（米），即每175 米就有一盏路灯无需移动。第三步，路长（21－1）×35＝700（米），那么有（盏）路灯无需移动。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-048","paperId":"gz2018a","num":48,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"一个车间需要生产模具256 个，每小时生产32 个可按时完成。但是生产期间机器发生了故障，修理了1.5 个小时。后来只能加派人手使得每小时生产的模具提高到48 个，这样恰好按时完成任务。机器在生产了（）个零件后发生了故障。","options":["112","108","96","72"],"answer":"A","explanation":"正确答案：A，全站正确率：59%，易错项：C。解析第一步，本题考查工程问题，属于条件类。第二步，原计划生产（小时），设生产t 小时后机器故障，则恢复生产后工作8－t－1.5＝6.5－t （小时），由恰好按时完成任务列方程：32×t＋48×（6.5－t）＝256，解得t＝3.5，机器在生产了32×3.5 ＝112（个）零件后发生了故障。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-049","paperId":"gz2018a","num":49,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"快递员小张在A、B、C 三个小区送快递。已知小张走三条线路A—B—C，B—C—A 和C—A—B 所花的时间分别为15 分钟、17 分钟和18 分钟。那么距离最近的两个小区之间的路程要花（）分钟。","options":["7","8","9","10"],"answer":"A","explanation":"正确答案：A，全站正确率：66%，易错项：B。解析解法一：第一步，本题考查基础应用题。第二步，A→B＋B→C＝15（分钟）、B→C＋C→A＝17（分钟）、C→A＋A→B＝18（分钟），则A→B＋B→C＋C →A＝（分钟），距离最近的两个小区之间路程要花25－18＝7（分钟）。因此，选择A 选项。解法二：第一步，本题考查基础应用题。第二步，A→B＋B→C＝15（分钟），两段路程平均耗时（分钟），则距离最近的两个小区之间耗时应小于7.5 分钟，结合选项只有A 符合。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-050","paperId":"gz2018a","num":50,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某单位计划为95 名员工每人购买一本政策法规小册子，该小册子的售价为6 元。书店对购买100 本及以上者给予9 折优惠。该单位可与其他单位拼团购买，如果该单位想完成这一任务，则最少需要花费（）元。","options":["570","540","513","500"],"answer":"C","explanation":"正确答案：C，全站正确率：74%，易错项：B。解析第一步，本题考查经济利润问题，属于利润率折扣类。第二步，拼团购买超过100 本可享受9 折优惠，最少需要花费（6×0.9）×95＝513（元）。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-051","paperId":"gz2018a","num":51,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"印刷厂印刷了一批共1080 本字典，用大、小两种箱子进行分装。已知每个大箱子比小箱子多装15 本，且 8 个小箱子的容量等于3 个大箱子的容量。如果只用大箱子进行分装，则至少需要（）个大箱子。","options":["40","45","50","55"],"answer":"B","explanation":"正确答案：B，全站正确率：83%，易错项：C。解析第一步，本题考查基础应用题，用方程法解题。第二步，设小箱子可装x 本，则大箱子可装（x＋15）本。由8 个小箱子的容量等于3 个大箱子列方程：8x＝3 （x＋15），解得x＝9，则大箱子可装9＋15＝24（本）。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 13 - 第三步，只用大箱子进行分装，则至少需要（个）。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-052","paperId":"gz2018a","num":52,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某电影院根据放映时间将电影票分为A 档、B 档和C 档，票价分别为30 元、50 元和80 元。某天有5200 名观众购票观影。电影院售票收入为25.5 万元。已知售出的A 档电影票是C 档电影票的2 倍。则当天售出B 档电影票（）张。","options":["500","1000","3700","4600"],"answer":"C","explanation":"正确答案：C，全站正确率：70%，易错项：B。解析第一步，本题考查基础应用题，用方程法解题。第二步，设售出C 档票x 张，则A 档票为2x 张；设售出B 档票y 张，列方程组：，化简得：，①×50－②＝10x＝5000，解得x＝500，则y＝3700。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-053","paperId":"gz2018a","num":53,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某部门开展年终评选工作。需从11 名员工中评选出一名优秀员工和两名积极员工，且优秀员工与积极员工不能为同一人。则可能会出现的评选结果共有（）种。","options":["495","990","1210","1980"],"answer":"A","explanation":"正确答案：A，全站正确率：55%，易错项：B。解析第一步，本题考查排列组合问题，属于基础排列组合。第二步，先从11 名员工中选出1 人作为优秀员工，有；“优秀”与“积极”不能为同一人，再从剩余10 人中选出2 人作为积极员工，有种，可能出现的评选结果共有（种）。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-054","paperId":"gz2018a","num":54,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某人用一笔钱买入两年期年化利率为5%的银行理财产品M。两年后连本带息又追加10 万元买入了年化利率为6%的银行理财产品N，又一年后全部收益为3.09 万元。那么这个人第一次买入了（）万元的银行理财产品M。","options":["10","15","20","30"],"answer":"B","explanation":"正确答案：B，全站正确率：40%，易错项：C。解析第一步，本题考查经济利润问题，属于基础公式类。第二步，设第一次买入x 万元M，则两年期M 的收益为5%x×2。第三步，全部收益＝M 收益＋N 收益＝5%x×2＋（x＋5%x×2＋10）×6%＝3.09，解得x＝15。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-055","paperId":"gz2018a","num":55,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"如图所示，市政部门在一块周长为260 米的长方形草地旁边铺设宽为10 米的L 形道路。已知铺好道路后，道路和草地面积之和为草地面积的1.5 倍。则草地的面积为（）平方米。","options":["4200","4000","3000","2800"],"answer":"D","explanation":"正确答案：D，全站正确率：47%，易错项：C。解析第一步，本题考查几何问题，属于平面几何类。第二步，设草地的长为a，宽为b，由周长为260 米可知（a＋b）×2＝260，解得a＋b＝130。第三步，道路与草地面积之和为草地的1.5 倍：（a＋10）×（b＋10）＝1.5ab，解得ab＝2800（平方米）。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-056","paperId":"gz2018a","num":56,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"头发∶理发剪","options":["指甲∶指甲钳","橡皮∶橡皮擦","铅笔∶铅笔盒","蜜糖∶蜜糖罐"],"answer":"A","explanation":"正确答案：A，全站正确率：87%，易错项：B。解析第一步，确定题干逻辑关系。 “理发剪”是剪“头发”的工具，二者属于工具对应关系。第二步，辨析选项。 A 项：“指甲钳”是剪“指甲”的工具，二者属于工具对应关系，与题干逻辑关系一致，符合； B 项：“橡皮”与“橡皮擦”属于全同关系，排除；获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 14 - C 项：“铅笔盒”可以用于装“铅笔”，二者属于盛放物对应关系，排除； D 项：“蜜糖罐”可以用于装“蜜糖”，二者属于盛放物对应关系，排除。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-057","paperId":"gz2018a","num":57,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"司机∶乘客","options":["教师∶家长","医生∶病人","编剧∶演员","警察∶小偷"],"answer":"B","explanation":"正确答案：B，全站正确率：89%，易错项：C。解析第一步，确定题干逻辑关系。 “司机”驾车搭载“乘客”，“乘客”是“司机”的服务对象，二者属于对应关系。第二步，辨析选项。 A 项：“教师”教授学生，“教师”的服务对象是学生，而不是“家长”，排除； B 项：“医生”治疗“病人”，“病人”是“医生”的服务对象，二者属于对应关系，与题干逻辑关系一致，符合； C 项：“编剧”编排剧本，“演员”参照剧本演出，“演员”不是“编剧”的服务对象，排除； D 项：“警察”的职责是抓捕“小偷”，而不是服务“小偷”，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-058","paperId":"gz2018a","num":58,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"招标∶中标","options":["宣传∶推广","请示∶批准","抽象∶具体","支出∶收入"],"answer":"B","explanation":"正确答案：B，全站正确率：93%，易错项：A。解析第一步，确定题干逻辑关系。先参与“招标”，才能“中标”，二者属于时间顺承对应关系，并且二者的主体不同。第二步，辨析选项。 A 项：“宣传”是“推广”的方式，二者无明显的时间先后顺序，排除； B 项：先“请示”，后“批准”，二者属于时间顺承对应关系，并且二者的主体不同，与题干逻辑关系一致，符合； C 项：“抽象”与“具体”属于反义关系，排除； D 项：可以先“收入”，后“支出”，也可以先“支出”，后“收入”，二者无明显时间先后顺序，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-059","paperId":"gz2018a","num":59,"year":2018,"region":"广州","module":"判断推理","sub":"类比推理","stem":"电热毯∶ （）与（）∶信鸽在内在逻辑关系上最为相似获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 -","options":["电扇；诗人","毛衣；织女","棉被；农民","暖炉；邮差"],"answer":"D","explanation":"正确答案：D，全站正确率：99%，易错项：C。解析分别将选项代入题干，确定逻辑关系。 A 项：“电热毯”与“电扇”均属于电器，二者属于并列关系，“诗人”与“信鸽”没有明显逻辑关系，前后逻辑关系不一致，排除； B 项：“电热毯”与“毛衣”均具有保暖的功能，二者属于并列关系，“织女”与“信鸽”没有明显逻辑关系，前后逻辑关系不一致，排除； C 项：“电热毯”与“棉被”均具有保暖的功能，二者属于并列关系，“农民”与“信鸽”没有明显逻辑关系，前后逻辑关系不一致，排除； D 项：“电热毯”与“暖炉”均具有保暖的功能，“邮差”与“信鸽”都具有传递消息的功能，前后二者均属于并列关系，前后逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-060","paperId":"gz2018a","num":60,"year":2018,"region":"广州","module":"判断推理","sub":"类比推理","stem":"银行∶ （）与（）∶拖拉机在内在逻辑关系上最为相似。","options":["叫号机；农民","点钞机；农场","取款机；农业","电视机；农田"],"answer":"B","explanation":"正确答案：B，全站正确率：83%，易错项：C。解析分别将选项代入题干，确定逻辑关系。 A 项：“银行”是使用“叫号机”的地点，二者属于地点对应关系，“拖拉机”是“农民”使用的工具，二者属于工具对应关系，前后逻辑关系不一致，排除； B 项：“银行”是使用“点钞机”的地点，二者属于地点对应关系，“农场”是使用“拖拉机”的地点，二者属于地点对应关系，前后逻辑关系一致，符合； C 项：“银行”是使用“取款机”的地点，二者属于地点对应关系，“拖拉机”是“农业”领域会用到的工具，二者属于对应关系，但“农业”不是地点，前后逻辑关系不一致，排除； D 项：“电视机”与“银行”无明显逻辑关系，“农田”是使用“拖拉机”的地点，二者属于地点对应关系，前后逻辑关系不一致，排除。因此，选择B 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 15 -","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-061","paperId":"gz2018a","num":61,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"树叶∶季节","options":["灰尘∶历史","口才∶道理","皮肤∶年龄","运气∶成绩"],"answer":"C","explanation":"正确答案：C，全站正确率：92%，易错项：A。解析第一步，确定题干逻辑关系。 “树叶”会随着“季节”的变化而发生变化，二者属于对应关系。第二步，辨析选项。 A 项：“灰尘”是悬浮在空气中的微粒，而“历史”是记载和解释一系列人类活动进程的历史事件，二者没有明显的对应关系，排除； B 项：好的“口才”有助于阐明“道理”，二者属于对应关系，但对应方式与题干不一致，排除； C 项：“皮肤”的状态会随着“年龄”的变化而变化，二者属于对应关系，与题干逻辑关系一致，符合； D 项：考试蒙题时，“运气”的好坏，可能会影响“成绩”，二者属于对应关系，但词语顺序与题干相反，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-062","paperId":"gz2018a","num":62,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"重量∶公斤∶天平","options":["容量∶千克∶杯子","长度∶厘米∶尺子","温度∶平方∶被子","体积∶大小∶柜子"],"answer":"B","explanation":"正确答案：B，全站正确率：96%，易错项：A。解析第一步，确定题干逻辑关系。 “公斤”是“重量”单位，二者属于对应关系，“天平”是称“重量”的工具，二者属于工具对应关系。第二步，辨析选项。 A 项：“容量”的单位是升，而不是“千克”，排除； B 项：“厘米”是“长度”单位，二者属于对应关系，“尺子”是测量“长度”的工具，二者属于工具对应关系，与题干逻辑关系一致，符合； C 项：“温度”的单位是摄氏度，而不是“平方”，排除； D 项：“体积”的单位是立方米，而不是“大小”，“大小”是用来形容“体积”的，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-063","paperId":"gz2018a","num":63,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"稻谷∶粮食∶种植","options":["钢笔∶文具∶绘画","水果∶西瓜∶切割","人才∶资源∶培养","煤炭∶石油∶挖掘"],"answer":"C","explanation":"正确答案：C，全站正确率：76%，易错项：D。解析第一步，确定题干逻辑关系。 “稻谷”是一种“粮食”，二者属于包容关系中的种属关系，“种植”与“稻谷”属于动宾关系。第二步，辨析选项。 A 项：“钢笔”是一种“文具”，二者属于包容关系中的种属关系，但“钢笔”是“绘画”的工具，二者属于工具对应关系，排除； B 项：“西瓜”是一种“水果”，二者属于包容关系中的种属关系，但词语顺序颠倒，排除； C 项：“人才”是一种“资源”，二者属于包容关系中的种属关系，“培养”与“人才”属于动宾关系，与题干逻辑关系一致，符合； D 项：“煤炭”与“石油”均为不可再生资源，二者属于并列关系，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-064","paperId":"gz2018a","num":64,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"购票∶乘车∶到达","options":["报名∶参赛∶领奖","下单∶付款∶送达","排队∶用餐∶点餐","毕业∶就业∶失业"],"answer":"A","explanation":"正确答案：A，全站正确率：45%，易错项：B。解析第一步，确定题干逻辑关系。先“购票”，再“乘车”，最后“到达”，三者属于时间顺承对应关系，且三者的主体一致。第二步，辨析选项。 A 项：先“报名”，再“参赛”，最后“领奖”，三者属于时间顺承对应关系，且三者的主体一致，与题干逻辑关系一致，符合； B 项：先“下单”，再“付款”，最后“送达”，三者属于时间顺承对应关系，但“送达”主体与前二者不一致，排除； C 项：“点餐”之前不一定需要“排队”，先“点餐”，后“用餐”，词语顺序与题干不一致，排除； D 项：“毕业”与“就业”没有必然的时间先后顺序，排除。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-065","paperId":"gz2018a","num":65,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"设计∶张贴∶海报","options":["购置∶发放∶清单","粘贴∶复制∶段落","订阅∶推广∶报纸","制定∶执行∶方案"],"answer":"D","explanation":"正确答案：D，全站正确率：92%，易错项：C。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 16 - 第一步，确定题干逻辑关系。 “设计”和“张贴”均与“海报”属于动宾关系，先“设计”后“张贴”，二者属于时间顺承对应关系。第二步，辨析选项。 A 项：依照“清单”“购置”物品，二者属于对应关系，排除； B 项：“粘贴”和“复制”均与“段落”属于动宾关系，但应先“复制”，后“粘贴”，词语顺序与题干不一致，排除； C 项：“订阅”和“推广”均与“报纸”属于动宾关系，但应先有“报纸”的“推广”，后有人“订阅”，词语顺序与题干不一致，排除； D 项：“制定”和“执行”均与“方案”属于动宾关系，先“制定”后“执行”，二者属于时间顺承对应关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-066","paperId":"gz2018a","num":66,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"随着某市常住人口增加，运动场的人均面积正在逐渐减少。近期的一项研究指出，近几年来，该市居民的身体素质在逐步下降。据此，有专家认为，运动场地的缺乏，导致了居民运动量不足，因此居民身体素质逐年下降。以下哪项如果为真，最能削弱上述结论？","options":["该市大部分免费的运动场所常年冷清","居民运动年消费总额持续上升","该市居民常规运动的种类正在增多","能坚持运动的居民数量逐年下降"],"answer":"A","explanation":"正确答案：A，全站正确率：78%，易错项：D。解析第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：运动场地的缺乏，导致了居民运动量不足，因此居民身体素质逐年下降。论据：运动场地的人均面积正在逐渐减少，同时近几年该市居民身体素质逐年下降。第三步，辨析选项。 A 项：增加反向论据。运动场所的冷清，说明虽然运动场地的人均面积变少，但是居民并没有使用运动场所，那么身体素质下降并非因人均场地面积减少造成，具有削弱作用。 B 项：无关选项。居民运动消费金额总数与论点中运动场地缺乏与居民身体素质并无直接关系，论题不一致，排除。 C 项：无关选项。居民常规运动种类与论点中运动场地缺乏与居民身体素质并无直接关系，论题不一致，排除。 D 项：不明确项。坚持运动的居民数量只是一部分人的情况，无法确定该市居民的总运动量是否下降，不具有削弱作用。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-067","paperId":"gz2018a","num":67,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"下面是某冬日我国北方某些城市的天气情况：（1）有些城市有降雪；（2）有些城市没有降雪；（3）北京和邯郸没有降雪。如果三个断定中只有一个为真，那么以下选项中哪个断定一定为真？","options":["北京有降雪，但邯郸没有","所有这些城市都有降雪","所有这些城市都没有降雪","以上各选项都不一定为真"],"answer":"B","explanation":"正确答案：B，全站正确率：52%，易错项：D。解析第一步，确定题型。根据若干论断和真假限定，确定为真假推理。第二步，找关系。（1）“有些城市有降雪”和（2）“有些城市没有降雪”为反对关系。第三步，看其余。根据反对关系中“两个有的，必有一真”的特性及题干的真假限定可知，真话一定在（1）和（2）中，则其余信息（3）一定为假；根据（3）为假，可以得到“北京下雪或者邯郸下雪”为真，进而可以推出：有的地方下雪了，则可以得到（1）为真，那么（2）为假；再根据（2）“有些城市没有降雪”为假，可以推出（2）的矛盾命题“所有的城市都降雪”为真。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-068","paperId":"gz2018a","num":68,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"去年，某镇把甲、乙、丙三个大学生村官分别分配到和丰村，团结村，杨梅村。人们开始并不知道他们当中究竟谁分配到哪个村工作，只是作了如下三种猜测： ①甲分配到和丰村工作，乙分配到团结村工作 ②甲分配到团结村工作，丙分配到和丰村工作 ③甲分配到杨梅村工作，乙分配到和丰村工作。后来证实，三种猜测都是只猜中了一半。由此可以推出：","options":["甲分配到和丰村工作，乙分配到团结村工作，丙分配到杨梅村工作","甲分配到团结村工作，乙分配到和丰村工作，丙分配到杨梅村工作","甲分配到杨梅村工作，乙分配到和丰村工作，丙分配到团结村工作","甲分配到杨梅村工作，乙分配到团结村工作，丙分配到和丰村工作"],"answer":"D","explanation":"正确答案：D，全站正确率：82%，易错项：B。解析第一步，确定题型。题干有信息匹配特征，确定为分析推理。第二步，分析条件，进行推理。题干信息真假不确定，可采用选项代入法。已知三种猜测都是只猜中了一半，代入各选项后，只要符合每种猜测只猜对一半，即为正确答案。代入A 项：条件（1）全部猜对，排除；代入B 项：条件（1）全部猜错，排除；获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 17 - 代入C 项：条件（3）全部猜对，排除；代入D 项：条件（1）（2）（3）全部猜对一半，符合已知条件。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-069","paperId":"gz2018a","num":69,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"由于我国大城市的房价和物价过高，导致生活成本明显高于中小城市，尤其是对于小城镇来讲，大城市的生活成本是小城镇的数倍。这样一来，势必限制了农村人口向大城市流入。因此，我国仅仅依靠发展大城市来实现城市化，是一条难以为继的艰难之路。以下哪项是上述论证所隐含的前提？","options":["大城市吸纳农村人口的能力没有上限","所有城镇都得到充分发展才能被称为城市化","大城市对农村人口的吸引力远远大于中小城市","要实现城市化，需要让城市充分吸纳农村人口"],"answer":"D","explanation":"正确答案：D，全站正确率：57%，易错项：B。解析第一步，确定题型。根据题干中的“前提”，确定为加强论证。第二步，找论点和论据。论点：我国仅仅依靠发展大城市来实现城市化，是一条难以为继的艰难之路。论据：大城市的生活成本过高，势必限制了农村人口向大城市流入。第三步，辨析选项。 A 项：无关选项。大城市吸纳农村人口的能力没有上限，但是没有考虑到农村人口是否有意愿流入大城市，论题不一致，排除。 B 项：增加反向论据。如果所有城镇都得到充分的发展才能被称为城市化，那么即使农村人口没有流入大城市，也不影响城市化，具有削弱作用，排除； C 项：无关选项。比较的是大城市和中小城市对农村的吸引力，但并没有提到农村人口是否有流入的意向，论题不一致，排除。 D 项：增加论据。该选项指出城镇化需要让城市充分吸纳农村人口，说明限制了农村人口向大城市流入，会影响城市化，具有加强作用。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-070","paperId":"gz2018a","num":70,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"国土资源部、住房和城市建设部联合印发《利用集体建设用地建设租赁住房试点方案》，正在允许城中村、城郊村、城边村集体建设用地建设租赁住房，引起各方关注。有观点认为，集体建设租赁住房入市后，将使大量有购房意愿和购房能力的人去租房，进而平抑房价。以下哪项如果为真，将最能质疑上述观点？","options":["集体建设用地租赁住房试点会导致商品房建设用地供应量减少","允许集体建设用地租赁住房会使农民农业生产收入受损，试点方案的推进会受到阻碍获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 -","该试点方案的出台赋予了城中村、城郊村、城边村的出租房合法地位","该试点方案出台前就有大量集体建设用地偷偷入市，租房市场需求已经得到满足"],"answer":"D","explanation":"正确答案：D，全站正确率：57%，易错项：A。解析第一步，确定题型。根据提问方式中的“质疑”，确定为削弱论证。第二步，找论点和论据。论点：集体建设租赁住房入市后，将使大量有购房意愿和购房能力的人去租房，进而平抑房价。论据：无。第三步，辨析选项。 A 项：不明确项。商品房建设用地供应量减少对商品房的价格的影响并未说明，所以与平抑房价的关系并不清楚，不具有削弱作用，排除。 B 项：不明确项。使农业生产受损，试点方案受到阻碍，不代表该试点方案一定无法实行，不具有削弱作用，排除。 C 项：无关选项。赋予了城中村、城郊村等的合法地位，与是否会平抑房价无关，论题不一致，排除。 D 项：削弱论点。租房市场需求已经得到满足，表明不会因为集体租赁房的增多使人们转向租房，进而不会因此平抑房价，具有削弱作用。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-071","paperId":"gz2018a","num":71,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"格陵兰岛的冰架以疯狂的速度退却，阿拉斯加和挪威的冰川融化明显，安第斯山脉冰川陆续消失，巴塔哥尼亚的冰川处于危险之中，阿尔卑斯山脉最高的山峰惨不忍睹，就连珠穆朗玛峰和南极洲的冰川都出现了衰退的迹象……以上现象说明：全球冰川在气候变暖的影响下纷纷凋零。但是近年来冰川学家研究发现一个不同寻常的现象，喀喇昆仑山脉的冰川并未融化，数据显示，这些冰川甚至在增厚，每年增加11 厘米。上述断定最能支持以下哪项结论？","options":["全球气候事实上并未变暖","气候变暖不是影响冰川融化的唯一原因","气候变暖不会影响冰川的增加或减少","气候变暖对冰川的影响小于对其他生态的影响"],"answer":"B","explanation":"正确答案：B，全站正确率：75%，易错项：C。解析第一步，确定题型。根据提问方式中的“支持以下哪项结论”，确定为加强论证。第二步，找论点和论据。论点：无。论据：①格陵兰岛、阿拉斯加、挪威等地的冰川情况说明，全球冰川在气候变暖的影响下纷纷凋零；②喀喇昆仑山脉的冰川并未融化甚至在增厚。第三步，辨析选项。 A 项：题干论据当中的冰川有一部分凋零的，所以不能支持气候没有变暖的结论，对该选项具有削弱作用，排除。 B 项：题干论据当中的冰川既有一部分凋零，也有一部分还在增厚的，所以支持气候变暖不是影响冰川融化的唯一原因的结论，对该选项具有加强作用。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 18 - C 项：题干论据①当中明确提到“全球冰川在气候变暖的影响下纷纷凋零”，对该选项具有削弱作用，排除。 D 项：题干论据没有出现其他生态影响的比较，题干论据与该选项无关，论题不一致，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-072","paperId":"gz2018a","num":72,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某大学教授认为我国住房公积金制度自实行以来，只有一些有购房能力的缴存职工享受到了低息购房贷款，而对于那些收入较低且无购房能力的工薪阶层并没有起到住房保障作用。所以，住房公积金制度是一种“劫贫济富”的制度，国家应该取消住房公积金制度。以下哪项如果为真，将最能削弱该教授的观点？","options":["住房公积金制度是国家建立的一项强制性住房保障制度","企业缴存部分的公积金对个人来说是一项额外收入","民营企业的缴存职工因收入不高而没有购房能力","外地务工人员一般不愿意在工作地买房"],"answer":"B","explanation":"正确答案：B，全站正确率：63%，易错项：A。解析第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：住房公积金是一种“劫贫济富”的制度，国家应该取消住房公积金。论据：只有一些有购房能力的缴存职工享受到了低息购房贷款，而收入较低且无购房能力的工薪阶层并没有享受到。第三步，辨析选项。 A 项：无关选项。住房公积金制度是否是强制性与论点中的国家应不应该取消住房公积金没有相关性，论题不一致，排除。 B 项：削弱论点。住房公积金增加了个人收入，否定住房公积金制度是一种“劫贫济富”的制度，具有削弱作用。 C 项：解释论据。民营企业的缴存职工因收入不高没有购房能力，证明了论据中“对于那些收入较低且无购房能力的工薪阶层并没有起到住房保障”，具有加强作用。 D 项：无关选项。外地员工的买房意愿和公积金制度对于是否能够起保障作用无关，论题不一致，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-073","paperId":"gz2018a","num":73,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"据统计，美国大约2000 万人受螨虫过敏之扰。某大学的研究结果表明，相对于其他物种，美国东部和西海岸是螨虫的乐土，而西部内陆则是螨虫的地狱。因为螨虫只能生活在潮湿环境下。对此，专家建议，“如果你对螨虫过敏，住在美国和加拿大的干燥和高海拔地区，绝对是个不错的选择”。以下哪项如果为真，最能有效支持上述专家建议？","options":["住在美国西部内陆地区的对螨虫过敏人士数量要比居住在美国东部的多得多","从潮湿地区搬到干旱地区的床垫、毯子和家具也会滋生螨虫","很多对螨虫过敏的人士都表示他们在美国西部内陆出差期间过敏症状减轻了","通过用防过敏罩子床垫和毯子，每周更换床单，能有效抑制螨虫"],"answer":"C","explanation":"正确答案：C，全站正确率：87%，易错项：A。解析第一步，确定题型。根据提问方式中的“支持”，确定为加强论证。第二步，找论点和论据。论点：如果对螨虫过敏，住在美国和加拿大的干燥和高海拔地区，绝对是个不错的选择。论据：螨虫只能生活在潮湿地区。第三步，辨析选项。 A 项：无关选项。选项只是东西地区患螨虫过敏人数的比较，选项中这些螨虫过敏的人患病原因不明，与论点中螨虫过敏应住在哪里无关，论题不一致，排除。 B 项：不明确项。通过该项无法确定螨虫是在潮湿地区还是干旱地区滋生的，不具有加强作用，排除。 C 项：增加论据。通过举例说明干燥和高海拔地区确实对螨虫有所抑制，具有加强作用。 D 项：无关选项。选项说明通过换床单可以抑制螨虫的，与干燥和高海拔地区能否抑制螨虫无关，论题不一致，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-074","paperId":"gz2018a","num":74,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"在某次电子产品促销会中，某款电子产品特别受消费者欢迎。促销会负责人总结经验时说，看来只有投入了大量广告费用做宣传的电子产品才有好的市场接受度。以下哪项如果为真，最能质疑负责人的论述？","options":["某款电子产品的外观设计增加了更多科技元素，尽管没有做广告宣传，仍然受到市场欢迎","最关注电子产品广告的群体是青年人，而参加此次促销会的消费者恰好青年人多","某款电子产品投入了大量广告费用做宣传，但由于其价格过高，并不受市场欢迎","某些电子产品投入了大量广告费用做宣传，但是实际上并不具备所宣传的部分功能"],"answer":"A","explanation":"正确答案：A，全站正确率：58%，易错项：C。解析第一步，确定题型。根据提问方式中的“质疑”，确定为削弱论证。第二步，找论点和论据。论点：只有投入了大量广告费用做宣传的电子产品才有好的市场接受度。论据：无。第三步，辨析选项。 A 项：削弱论点。论点可以翻译为：受市场欢迎→投入大量广告费宣传，该项可翻译为：受到市场欢迎且¬投入大量广告费宣传，选项是论点的矛盾命题，直接否定论点，具有削弱作用。 B 项：无关选项。只是提到关注电子产品和参加促销会的是年青人多，并未提到是否有广告投入在其中起到的作用多少，论题不一致，排除。 C 项：无关选项。某款电子产品不受欢迎的原因是价格高，与是否有广告宣传无关，论题不一致，排除。 D 项：无关选项。选项只是提到宣传具体内容与实际不相符，但没有提到宣传的效果，论题不一致，排除。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 19 - 因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-075","paperId":"gz2018a","num":75,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"企业管理学认为，人力资源管理部门在现代企业管理过程中有着十分重要的作用。但调研发现，该部门并未全程参与公司发展规划的决策，而且公司聘请的高级经理都是由CEO 决定，所以，人力资源部门更多的时候只是起到支持和辅助的作用。以下哪项如果为真，将最能削弱上述论证？","options":["人力资源管理部有权雇佣中层管理人员","个别大型公司，人力资源管理部经理有权参加公司最高决策会议","人才是公司发展的核心要素，而人力资源管理部门能为公司吸引并留住人才","世界500 强企业中,人力资源管理部门都是从有一线工作经验的员工中选调人员"],"answer":"B","explanation":"正确答案：B，全站正确率：25%，易错项：C。解析第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：人力资源部门更多的时候只是起到支持和辅助作用。论据：人力资源部门并未全程参与公司发展规划的决策，而且公司聘请的高级经理都是由CEO 决定。第三步，辨析选项。 A 项：不明确项。该项指出人力资源部门有权雇佣中层管理人员，但雇佣中层管理人员这项职能究竟是否属于 “支持和辅助的作用”并不明确，不具有削弱作用，排除。 B 项：增加反向论据。选项指出在某些公司，人力资源管理部门会参与到公司的决策会议中，证明给人力资源部门不仅仅是起到支持和辅助作用，也会参与到公司的决策中，具有削弱作用。 C 项：增加论据。人力资源部门能够吸引并留住公司的核心要素——人才，这也是辅助和支持的作用，并没有真正参与到公司发展的战略决策中，具有加强作用，排除。 D 项：无关选项。选项只是提到人力资源部门选拔人才的范围，与论点无关，论题不一致，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-083","paperId":"gz2018a","num":83,"year":2018,"region":"广州","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①④⑥，②③⑤","①②③，④⑤⑥","①③⑤，②④⑥","①③④，②⑤⑥"],"answer":"C","explanation":"正确答案：C，全站正确率：43%，易错项：D。解析第一步，观察特征。组成元素不同，优先考虑数量类或属性类。图⑥对称特征明显，考虑属性类对称性。第二步，根据规律进行分组。观察发现，①③⑤为非轴对称图形，②④⑥为轴对称图形，只有C 项符合。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-084","paperId":"gz2018a","num":84,"year":2018,"region":"广州","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①④⑥，②③⑤","①③④，②⑤⑥","①②⑤，③④⑥","①②③，④⑤⑥"],"answer":"B","explanation":"正确答案：B，全站正确率：83%，易错项：A。解析第一步，观察特征。组成元素不同，优先考虑数量类或属性类。线条的特征比较明显，考虑数线。第二步，根据规律进行分组。图形线条特征明显，其中，图①③④为5 条线，图②⑤⑥为6 条线，只有B 项符合。因此，选择B 选项。拓展规律二：题干都是两个三角形连接在一起，考虑静态位置中图形的连接性。根据两个三角形的连接方式，①③ ④有公共边，②⑤⑥有公共点。只有B 项符合。","material":"","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-086","paperId":"gz2018a","num":86,"year":2018,"region":"广州","module":"资料分析","sub":"综合资料","stem":"2016 年中国原油进出口总量约比2010 年增长了（）。","options":["-4.9%","59.1%","60%","60.8%"],"answer":"C","explanation":"正确答案：C，全站正确率：14%，易错项：B。解析第一步，本题考查增长率计算问题。第二步，定位图形材料，2016 年中国原油进口量为7625 千桶/天，出口量为58 千桶/天，2010 年进口量为4767 千桶/天，出口量为61 千桶/天。第三步，根据进出口总量=进口量＋出口量，以及增长率=现期量/基期量－1，选项出现首两位均相同的情况，需精确计算不再截位，可得，与C
