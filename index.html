<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#c62828">
<title>行政执法刷题 · 国考/省考真题</title>
<style>
:root{
  --brand:#c62828; --brand-d:#8e1c1c; --brand-l:#fdecea;
  --bg:#f4f5f7; --card:#fff; --line:#e8eaed;
  --t1:#1f2329; --t2:#5c6470; --t3:#9aa2ad;
  --ok:#1a9d5a; --ok-bg:#e8f7ef; --bad:#d93025; --bad-bg:#fdecea;
  --r:14px; --sh:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--t1);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* ---------- 顶栏 ---------- */
.nav{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(198,40,40,.25)
}
.nav h1{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .back,.nav .act{min-width:44px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;border-radius:8px;background:rgba(255,255,255,.16);padding:0 8px;flex:none}
.nav .back:active,.nav .act:active{background:rgba(255,255,255,.3)}
.nav .ph{min-width:44px;flex:none}

/* ---------- 通用 ---------- */
.page{padding:12px 12px 40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card-hd{padding:14px 16px 6px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-bd{padding:8px 16px 16px}
.muted{color:var(--t2);font-size:13px}
.tiny{color:var(--t3);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;line-height:1.6;padding:1px 7px;border-radius:6px;background:var(--brand-l);color:var(--brand);font-weight:500}
.tag.g{background:#eef1f5;color:var(--t2)}
.tag.b{background:#e8f0fe;color:#1a56c4}
.tag.o{background:#fff4e5;color:#b26a00}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px;margin:-12px -12px 14px}
.hero h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:.5px}
.hero p{margin:0;font-size:13px;opacity:.88}
.hero .stats{display:flex;gap:18px;margin-top:16px}
.hero .stats b{display:block;font-size:20px;font-weight:700}
.hero .stats span{font-size:12px;opacity:.85}
.entry{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry:active{background:#fafbfc}
.entry .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--brand-l)}
.entry .ico.i2{background:#e8f0fe}.entry .ico.i3{background:#e8f7ef}
.entry .tt{font-size:16px;font-weight:600;margin-bottom:2px}
.entry .ds{font-size:12.5px;color:var(--t2);line-height:1.5}
.entry .arw{color:var(--t3);font-size:18px;flex:none}

/* ---------- 列表项 ---------- */
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:#fafbfc}
.item .tt{font-size:15px;font-weight:500;margin-bottom:3px}
.item .ms{font-size:12px;color:var(--t3);display:flex;gap:8px;flex-wrap:wrap}
.item .cnt{font-size:12px;color:var(--brand);font-weight:600;flex:none}

/* ---------- 按钮 ---------- */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;
  background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.82}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gray{background:#eef1f5;color:var(--t1)}
.btn.sm{padding:9px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:12px}

/* ---------- 答题 ---------- */
.qstem{font-size:15.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.qstem img{max-width:100%;height:auto;border-radius:8px}
.material{background:#f7f8fa;border-left:3px solid var(--brand);border-radius:8px;padding:12px 14px;margin-bottom:14px;
  font-size:14px;line-height:1.8;color:#333;white-space:pre-wrap;word-break:break-word}
.material.collapsed{max-height:300px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.matToggle{text-align:center;color:var(--brand);font-size:13px;font-weight:600;padding:8px 0 12px;cursor:pointer}
.matToggle:active{opacity:.7}
.opts{margin-top:14px}
.opt{display:flex;gap:10px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:9px;
  cursor:pointer;background:#fff;transition:all .13s;align-items:flex-start}
.opt:active{transform:scale(.99)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--t3);color:var(--t2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;margin-top:1px}
.opt .v{flex:1;font-size:14.5px;line-height:1.7;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-l)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dis{opacity:.72}

.ansbox{margin-top:16px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ansbox .ah{padding:10px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.ansbox .ah.ok{background:var(--ok-bg);color:var(--ok)}
.ansbox .ah.bad{background:var(--bad-bg);color:var(--bad)}
.ansbox .ab{padding:13px 14px;background:#fff;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.ansbox .lbl{font-weight:600;color:var(--brand);margin-bottom:4px;font-size:13px}
.ansbox .exp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:#40464f;font-size:13.5px;line-height:1.85}

/* 答题卡 */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:9px;padding:4px 0}
.sheet .n{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:600;background:#f0f2f5;color:var(--t2);cursor:pointer;border:1.5px solid transparent}
.sheet .n.done{background:#e3ecff;color:#1a56c4}
.sheet .n.cur{border-color:var(--brand);color:var(--brand);background:#fff}
.sheet .n.ok{background:var(--ok-bg);color:var(--ok)}
.sheet .n.no{background:var(--bad-bg);color:var(--bad)}

/* 底部条 */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:720px;margin:0 auto}
.bottombar .btn{margin:0;flex:1}

/* 结果 */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:48px;font-weight:800;color:var(--brand);line-height:1.1}
.score .big small{font-size:16px;font-weight:500;color:var(--t2)}
.score .sub{font-size:14px;color:var(--t2);margin-top:6px}
.bars{margin-top:18px;text-align:left}
.bar{margin-bottom:11px}
.bar .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .bt{height:8px;background:#eef1f5;border-radius:5px;overflow:hidden}
.bar .bf{height:100%;background:linear-gradient(90deg,#ef5350,#c62828);border-radius:5px;transition:width .5s}

/* 开关/输入 */
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .fl{font-size:14.5px}
.field .fd{font-size:12px;color:var(--t3);margin-top:2px}
.stepper{display:flex;align-items:center;gap:0;flex:none}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:#fff;font-size:19px;color:var(--brand);
  font-family:inherit;cursor:pointer;line-height:1}
.stepper button:first-child{border-radius:9px 0 0 9px}
.stepper button:last-child{border-radius:0 9px 9px 0}
.stepper .val{width:52px;height:34px;border:1px solid var(--line);border-left:0;border-right:0;display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:600}
textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:14.5px;
  font-family:inherit;line-height:1.8;resize:vertical;background:#fff}
textarea:focus{outline:0;border-color:var(--brand)}

.empty{text-align:center;padding:50px 20px;color:var(--t3);font-size:14px}
.empty .e{font-size:40px;margin-bottom:10px}
.ldr{text-align:center;padding:60px 20px;color:var(--t3)}
.sp{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;
  animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(30,33,38,.92);color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:200;max-width:80%;text-align:center;
  opacity:0;transition:opacity .22s;pointer-events:none}
.toast.on{opacity:1}
.note{background:#fffbf0;border:1px solid #ffe0a3;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#8a6100;line-height:1.7;margin-bottom:12px}
</style>
</head>

。"}],"questions":[{"id":"gk2025-xz-001","paperId":"gk2025-xz","num":1,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记指出，马克思主义是为人民立言、为人民代言的理论，是为改变人民命运而创立、在人民求解放的实践中丰富和发展的，人民的创造性实践是马克思主义理论创新的不竭源泉。下列说法与这一论述相符的是： ①人民不仅是物质财富的创造者，也是精神财富的创造者 ②要坚持以理论工作者的首创精神为引领，注重从理论创新中总结实践经验 ③无论是毛泽东思想、中国特色社会主义理论体系，还是习近平新时代特色社会主义思想，无不源自于人民的智慧、人民的探索、人民的创造 ④各级领导干部身处实践最前沿，对实践变化感知最敏感、感受最深切，也最聪慧","options":["①②","①③","②④","③④"],"answer":"B","explanation":"政治-马哲。B 选项正确：①正确，2023 年6 月30 日，习近平总书记在二十届中共中央政治局第六次集体学习时强调，“马克思主义是为人民立言、为人民代言的理论，是为改变人民命运而创立、在人民求解放的实践中丰富和发展的，人民的创造性实践是马克思主义理论创新的不竭源泉。人民作为历史的创造者，不仅是物质财富的创造者，也是精神财富的创造者。” ②错误，2023 年6 月30 日，习近平总书记在二十届中共中央政治局第六次集体学习时强调，“要尊重人民首创精神，注重从人民的创造性实践中总结新鲜经验，上升为理性认识，提炼出新的理论成果，着力让党的创新理论深入亿万人民心中，成为接地气、聚民智、顺民意、得民心的理论。” ③正确，2023 年6 月30 日，习近平总书记在二十届中共中央政治局第六次集体学习时强调，“无论是毛泽东思想、中国特色社会主义理论体系，还是新时代中国特色社会主义思想，无不源自于人民的智慧、人民的探索、人民的创造。” ④错误，《求是》杂志发表习近平总书记重要文章《必须坚持人民至上》中指出：“人民群众身处实践最前沿，对实践变化感知最敏感、感受最深切，也最聪慧，只要走到人民群众中去，很多百思不得其解的问题就能豁然开朗、找到答案。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-002","paperId":"gk2025-xz","num":2,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记指出，问题是事物矛盾的表现形式，我们强调增强问题意识、坚持问题导向，就是承认矛盾的普遍性、客观性，就是要善于把认识和化解矛盾作为打开工作局面的突破口。关于矛盾的普遍性、客观性，下列说法正确的是：","options":["矛盾的普遍性是有条件的，并根据条件的变化而变化","矛盾的客观性从属于主观性，不能脱离人的认知、情感、意志而存在","矛盾的普遍性是矛盾的共性，矛盾的特殊性是矛盾的个性","矛盾的普遍性、客观性决定了事物的不同性质，是认清事物本质和发展规律的基础"],"answer":"C","explanation":"政治-马哲。C 选项正确：矛盾的普遍性和特殊性是辩证统一的关系。矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的个性。矛盾的共性是无条件的、绝对的，矛盾的个性是有条件的、相对的。 A 选项错误：矛盾的普遍性是指矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，新的矛盾又产生，事物始终在矛盾中运动。矛盾的普遍性即矛盾的共性，矛盾的共性是无条件的、绝对的。故“矛盾的普遍性是有条件的”说法错误。 B 选项错误：矛盾规律具有普遍性和客观性，是不以人的意志为转移的。“矛盾的客观性从属于主观性，不能脱离人的认知、情感、意志而存在”的观点认为主观决定客观，属于唯心主义的范畴，故说法错误。 D 选项错误：矛盾的特殊性是指各个具体事物的矛盾、同一事物的矛盾在不同发展过程和发展阶段、每一个矛盾的各个方面各有其特点。矛盾的特殊性决定了事物的不同性质，如实地分析矛盾的特殊性是认清事物本质和发展规律的基础，故说法错误。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-003","paperId":"gk2025-xz","num":3,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"关于马克思主义政治经济学，下列说法正确的是：","options":["商品的价值量是由生产该商品所需的个别劳动时间决定的","货币的价值尺度职能是通过实际的物质交换来实现的","具体劳动和抽象劳动是不同商品生产过程中的不同劳动","具体劳动创造商品的使用价值，抽象劳动形成商品的价值"],"answer":"D","explanation":"经济-马克思主义政治经济学。D 选项正确：具体劳动是指人们在一定的具体形式下进行的劳动，体现着人和自然的关系，生产出各种各样的使用价值。抽象劳动是指撇开一切具体形式的无差别的一般人类劳动，即人的体力和脑力的消耗。抽象劳动形成商品的价值。 A 选项错误：商品的价值量是指商品价值的大小，是由生产商品的社会必要劳动时间决定的。社会必要劳动时间即在现有的社会正常的生产条件下，在社会平均的劳动熟练程度和劳动强度下制造某种使用价值所需要的劳动时间。 B 选项错误：货币的价值尺度职能，是指以自身价值作为尺度来衡量其他商品的价值。货币执行价值尺度职能，不需要现实的货币，只需要观念上的货币，不需要通过实际的物质交换来实现。 C 选项错误：具体劳动和抽象劳动，是生产商品的同一劳动过程的两个方面，而不是两种劳动或两次劳动。具体劳动说明的是劳动是什么样的，是怎样进行的；抽象劳动说明的是劳动的量的多少，劳动时间的长短。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-004","paperId":"gk2025-xz","num":4,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记指出：“中国共产党人的理想信念，建立在马克思主义科学真理的基础之上，建立在马克思主义揭示的人类社会发展规律的基础之上，建立在为最广大人民谋利益的崇高价值的基础之上。我们坚定，是因为我们追求的是真理。我们坚定，是因为我们遵循的是规律。我们坚定，是因为我们代表的是最广大人民根本利益。”这一论述最直接体现了马克思主义的哪一基本观点：","options":["真理尺度与价值尺度的辩证统一","认识世界与改造世界的辩证统一","量变与质变的辩证统一","矛盾的特殊性与普遍性的辩证统一"],"answer":"A","explanation":"政治-马哲。A 选项正确：真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映。“中国共产党人的理想信念，建立在马克思主义科学真理和人类社会发展规律的基础之上”即体现了真理原则。价值是指在实践基础上形成的主体和客体之间的意义关系，是客体对个人、群体乃至整个社会的生活和活动所具有的积极意义。“建立在为最广大人民谋利益的崇高价值的基础之上”和“代表的是最广大人民根本利益”即体现了价值原则。 B 选项错误：从认识论的角度来看，人类的活动不外乎两种，即认识世界和改造世界。认识世界的任务不仅在于解释世界，更重要的在于为改造世界提供理论指导。认识世界和改造世界是相互依赖、相互制约、辩证统一的。认识世界是为了改造世界，正确地认识世界是有效地改造世界的必要前提。题干并未体现认识世界与改造世界的辩证统一。 C 选项错误：量变质变规律揭示了事物发展的形式和状态，量变是质变的必要准备，质变是量变的必然结果，量变和质变相互渗透。题干并未体现量变与质变的辩证统一。 D 选项错误：矛盾的普遍性和特殊性的关系，也就是共性与个性、一般与个别的关系。矛盾普遍性与特殊性是互相联系的。普遍性存在于特殊性之中，特殊性中包含着普遍性；普遍性与特殊性在一定条件下可以互相转化。题干并未体现矛盾的特殊性与普遍性的辩证统一。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-005","paperId":"gk2025-xz","num":5,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"高质量发展是全面建设社会主义现代化国家的首要任务，金融要为经济社会发展提供高质量服务。下列与之相关的表述不准确的是：","options":["优化资金供给结构，把更多金融资源用于促进科技创新、绿色发展、传统制造和国有企业","要着力营造良好的货币金融环境，切实加强对重大战略、重点领域和薄弱环节的优质金融服务","始终保持货币政策的稳健性，更加注重做好跨周期和逆周期调节，充实货币政策工具箱","完善机构定位，支持国有大型金融机构做优做强，当好服务实体经济的主力军和维护金融稳定的压舱石"],"answer":"A","explanation":"工作会议在北京举行。习近平总书记出席会议并发表重要讲话，科学回答了金融事业发展的一系列重大理论和实践问题。优化资金供给结构，把更多金融资源用于促进科技创新、先进制造、绿色发展和中小微企业，大力支持实施创新驱动发展战略、区域协调发展战略，确保国家粮食和能源安全等。 BC 选项正确：会议指出，高质量发展是全面建设社会主义现代化国家的首要任务，金融要为经济社会发展提供高质量服务。要着力营造良好的货币金融环境，切实加强对重大战略、重点领域和薄弱环节的优质金融服务。始终保持货币政策的稳健性，更加注重做好跨周期和逆周期调节，充实货币政策工具箱。优化资金供给结构，把更多金融资源用于促进科技创新、先进制造、绿色发展和中小微企业，大力支持实施创新驱动发展战略、区域协调发展战略，确保国家粮食和能源安全等。 D 选项正确：会议指出，完善机构定位，支持国有大型金融机构做优做强，当好服务实体经济的主力军和维护金融稳定的压舱石，严格中小金融机构准入标准和监管要求，立足当地开展特色化经营，强化政策性金融机构职能定位，发挥保险业的经济减震器和社会稳定器功能。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-006","paperId":"gk2025-xz","num":6,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记强调，粮食安全是“国之大者”。下列保障粮食安全的举措正确的有几项： ①全面落实粮食安全党政同责，坚持稳面积、增单产两手发力 ②树立大农业观、大食物观，农林牧渔并举，构建多元化食物供给体系 ③加大高标准农田建设投入和管护力度，确保耕地数量有保障、质量有提升 ④扩大粮食领域高水平对外开放，逐步加大国外优质种业资源和海外粮食产品在我国市场的占有率 ⑤强化科技和改革双轮驱动，加大核心技术攻关力度","options":["2项","3项","4项","5项"],"answer":"C","explanation":"记来到广西考察，指出乡村振兴是建设农业强国的基础性工程，要落实规划、扎实推进。要全面落实粮食安全党政同责，坚持稳面积、增单产两手发力，实现粮食均衡增产。 ②正确，2024 年9 月15 日发布的《国务院办公厅关于践行大食物观构建多元化食物供给体系的意见》指出，树立大农业观、大食物观，农林牧渔并举，构建多元化食物供给体系，是党中央提出的明确要求，是保障粮食和重要农产品稳定安全供给的客观要求和重要举措。 ③⑤正确，2023 年12 月19 日召开的中央农村工作会议指出，要守住耕地这个命根子，坚决整治乱占、破坏耕地违法行为，加大高标准农田建设投入和管护力度，确保耕地数量有保障、质量有提升。要强化科技和改革双轮驱动，加大核心技术攻关力度，改革完善“三农” 工作体制机制，为农业现代化增动力、添活力。 ④错误，中央经济工作会议提出，在经济全球化深入发展的背景下，我国进一步推进农业现代化，同样要用好国内国际两个市场、两种资源，深化农业对外开放，发挥超大规模市场和强大生产能力的优势。但“加大国外优质种业资源和海外粮食产品在我国市场的占有率” 的做法不利于我国的粮食安全。习近平总书记强调的“中国人的饭碗任何时候都要牢牢端在自己手中”，是基于对粮食基本属性的正确认识和粮食战略价值的准确评估作出的重大判断，对于维护社会稳定、保障国民经济平稳运行、应对国际变局具有重要意义。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-007","paperId":"gk2025-xz","num":7,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记强调，要坚定不移贯彻新发展理念，更加自觉地把高质量充分就业作为经济社会发展的优先目标。下列关于高质量充分就业的表述正确的是： ①全面贯彻劳动者自主就业、政府主导就业、市场促进就业的方针 ②坚持扩大就业容量和提升就业质量相结合 ③坚持就业带动创业 ④加强灵活就业和新就业形态劳动者权益保障，扩大职业伤害保障试点","options":["①②","①③","②④","③④"],"answer":"C","explanation":"记的重要文章《促进高质量充分就业》。 ①错误，文章指出：“要坚持以人民为中心的发展思想，全面贯彻劳动者自主就业、市场调节就业、政府促进就业和鼓励创业的方针，以推动高质量发展为基础，以实施就业优先战略为引领，以强化就业优先政策为抓手，以深化就业体制机制改革为动力，持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者的获得感幸福感安全感，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。” ②正确，③错误，文章指出：“在这个过程中，我们不断深化对新时代就业工作规律的认识，积累了许多经验，主要包括：坚持党对就业工作的全面领导，坚持把就业作为民生之本，坚持实施就业优先战略，坚持依靠发展促进就业，坚持扩大就业容量和提升就业质量相结合，坚持突出抓好重点群体就业，坚持创业带动就业，坚持营造公平就业环境，坚持构建和谐劳动关系，等等。这些经验十分宝贵，要长期坚持并不断丰富发展。” ④正确，文章指出：“加强灵活就业和新就业形态劳动者权益保障，扩大职业伤害保障试点，及时总结经验、形成制度。加强市场监管和劳动保障监察执法，有效治理就业歧视、欠薪欠保、违法裁员等乱象。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-008","paperId":"gk2025-xz","num":8,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"党的十八大以来，在推进全面从严治党的伟大实践中，我们不断进行实践探索和理论思考，在毛泽东同志当年给出“让人民来监督政府”的第一个答案基础上，给出了第二个答案，那就是不断推进党的自我革命。关于深入推进党的自我革命实践，下列表述不准确的是：","options":["以引领伟大社会革命为根本目的","以跳出历史周期率为战略目标","以解决大党独有难题为主攻方向","以自我监督和法律监督相结合为强大动力"],"answer":"D","explanation":"会上深刻阐述了党的自我革命的重要思想，对持续发力、纵深推进反腐败斗争作出战略部署，明确提出了新征程上深入推进党的自我革命“九个以”的实践要求。以坚持党中央集中统一领导为根本保证。以引领伟大社会革命为根本目的。以习近平新时代中国特色社会主义思想为根本遵循。以跳出历史周期率为战略目标。以解决大党独有难题为主攻方向。以健全全面从严治党体系为有效途径。以锻造坚强组织、建设过硬队伍为重要着力点。以正风肃纪反腐为重要抓手。以自我监督和人民监督相结合为强大动力。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-009","paperId":"gk2025-xz","num":9,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"总书记指出，要加强科技基础能力建设，深化科技体制改革，打造科创高地。关于深化科技体制改革，下列表述正确的是：","options":["建立以竞争性支持取代稳定支持的基础研究投入机制","允许科研类事业单位实行比一般事业单位更灵活的管理制度","限制开展高风险、高投入基础研究","降低科技人员在科技成果转化收益分配上的自主权"],"answer":"B","explanation":"会议通过了《中共中央关于进一步全面深化改革推进中国式现代化的决定》（以下简称《决定》）。 B 选项正确：《决定》在“四、构建支持全面创新体制机制”部分的“（14）深化科技体制改革”中指出：“完善中央财政科技经费分配和管理使用机制，健全中央财政科技计划执行和专业机构管理体制······允许科研类事业单位实行比一般事业单位更灵活的管理制度，探索实行企业化管理。” A 选项错误：《决定》在“四、构建支持全面创新体制机制”部分的“（14）深化科技体制改革”中指出：“改进科技计划管理，强化基础研究领域、交叉前沿领域、重点领域前瞻性、引领性布局。加强有组织的基础研究，提高科技支出用于基础研究比重，完善竞争性支持和稳定支持相结合的基础研究投入机制，鼓励有条件的地方、企业、社会组织、个人支持基础研究，支持基础研究选题多样化，鼓励开展高风险、高价值基础研究。” C 选项错误：《决定》在“四、构建支持全面创新体制机制”部分的“（14）深化科技体制改革”中指出：“加强有组织的基础研究，提高科技支出用于基础研究比重，完善竞争性支持和稳定支持相结合的基础研究投入机制，鼓励有条件的地方、企业、社会组织、个人支持基础研究，支持基础研究选题多样化，鼓励开展高风险、高价值基础研究。” D 选项错误：《决定》在“四、构建支持全面创新体制机制”部分的“（14）深化科技体制改革”中指出：“允许科技人员在科技成果转化收益分配上有更大自主权，建立职务科技成果资产单列管理制度，深化职务科技成果赋权改革。深化高校、科研院所收入分配改革。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-010","paperId":"gk2025-xz","num":10,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"完善收入分配制度，构建初次分配、再分配、第三次分配协调配套的制度体系，是进一步全面深化改革的重要任务。关于完善收入分配制度，下列表述不准确的是：","options":["提高劳动报酬在初次分配中的比重","完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度","规范财富积累机制，多渠道增加城乡居民财产性收入","完善税收、社会保障、转移支付等第三次分配调节机制"],"answer":"D","explanation":"届中央委员会第三次全体会议通过了《中共中央关于进一步全面深化改革推进中国式现代化的决定》（以下简称《决定》）。《决定》在“十一、健全保障和改善民生制度体系”部分“（42）完善收入分配制度”中指出： “构建初次分配、再分配、第三次分配协调配套的制度体系，提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度。完善税收、社会保障、转移支付等再分配调节机制。支持发展公益慈善事业。”故AB 选项正确。 C 选项正确：《决定》在“十一、健全保障和改善民生制度体系”部分“（42）完善收入分配制度”中指出：“规范收入分配秩序，规范财富积累机制，多渠道增加城乡居民财产性收入，形成有效增加低收入群体收入、稳步扩大中等收入群体规模、合理调节过高收入的制度体系。深化国有企业工资决定机制改革，合理确定并严格规范国有企业各级负责人薪酬、津贴补贴等。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-011","paperId":"gk2025-xz","num":11,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记强调，要牢牢扭住自主创新这个“牛鼻子”。关于自主创新的举措，下列表述正确的有几项： ①主动对接国家战略需求，整合和优化科教创新资源 ②培育产业园区，加强对口合作，加快科研成果落地转化 ③培育新能源、新材料、先进制造、电子信息等战略性新兴产业 ④建设风光火核储一体化能源基地 ⑤逐步弱化央地合作，鼓励各地自主发展新兴产业","options":["2项","3项","4项","5项"],"answer":"C","explanation":"央军委主席习近平在黑龙江省哈尔滨市主持召开新时代推动东北全面振兴座谈会并发表重要讲话（以下简称“讲话”）。 ①②③④正确，⑤错误，习近平总书记在讲话中强调，要以科技创新推动产业创新，加快构建具有东北特色优势的现代化产业体系······主动对接国家战略需求，整合和优化科教创新资源，加大研发投入，掌握更多关键核心技术。积极培育产业园区，加强对口合作，加快科研成果落地转化。积极培育新能源、新材料、先进制造、电子信息等战略性新兴产业，积极培育未来产业，加快形成新质生产力，增强发展新动能。加快发展风电、光电、核电等清洁能源，建设风光火核储一体化能源基地······创新央地合作模式，促进央地融合发展，更好带动地方经济发展。综上，共4 项正确。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-012","paperId":"gk2025-xz","num":12,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"党的二十届三中全会提出，要稳步扩大制度型开放。关于稳步扩大制度型开放，下列举措不恰当的是：","options":["独立自主构建不同于国际经贸规则的中国特色经贸规则体系","有序扩大我国商品市场、服务市场、资本市场、劳务市场等对外开放","积极参与全球经济治理体系改革，提供更多全球公共产品","扩大对最不发达国家单边开放"],"answer":"A","explanation":"届中央委员会第三次全体会议通过的《中共中央关于进一步全面深化改革推进中国式现代化的决定》在“七、完善高水平对外开放体制机制”部分指出：“（24）稳步扩大制度型开放。主动对接国际高标准经贸规则，在产权保护、产业补贴、环境标准、劳动保护、政府采购、电子商务、金融领域等实现规则、规制、管理、标准相通相容，打造透明稳定可预期的制度环境。扩大自主开放，有序扩大我国商品市场、服务市场、资本市场、劳务市场等对外开放，扩大对最不发达国家单边开放······积极参与全球经济治理体系改革，提供更多全球公共产品······” 制度型开放的关键是主动对接国际高标准规则通过改革和开放提升规则兼容性，而非“构建不同于国际规则”的体系。中国强调在参与全球经济治理中推动规则完善和创新，而非完全脱离现有框架。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-013","paperId":"gk2025-xz","num":13,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记指出，宣传思想文化工作事关党的前途命运，事关国家长治久安，事关民族凝聚力和向心力，是一项极端重要的工作。宣传思想文化工作的首要政治任务是：","options":["培育和践行社会主义核心价值观","用党的创新理论武装全党、教育人民","提升国家文化软实力和中华文化影响力","赓续中华文脉、推动中华优秀传统文化创造性转化和创新性发展"],"answer":"B","explanation":"会议在北京召开。会上传达了习近平总书记对宣传思想文化工作作出的重要指示。习近平总书记强调，宣传思想文化工作面临新形势新任务，必须要有新气象新作为。要坚持以新时代中国特色社会主义思想为指导，全面贯彻党的二十大精神，聚焦用党的创新理论武装全党、教育人民这个首要政治任务······着力培育和践行社会主义核心价值观······着力赓续中华文脉、推动中华优秀传统文化创造性转化和创新性发展······不断提升国家文化软实力和中华文化影响力，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴提供坚强思想保证、强大精神力量、有利文化条件。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-014","paperId":"gk2025-xz","num":14,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"完善大统战工作格局，是习近平总书记关于做好新时代党的统一战线工作的重要思想的重要内容，是做好新时代统战工作的重要保障，也是进一步全面深化改革、为推进中国式现代化凝心聚力的重要举措。下列各项不属于完善大统战格局措施的是：","options":["更好发挥党外人士作用，健全党外代表人士队伍建设制度","制定民族团结进步促进法，健全铸牢中华民族共同体意识制度机制","全面构建亲清政商关系，健全促进非公有制经济健康发展、非公有制经济人士健康成长工作机制","健全人大议事规则和论证、评估、评议、听证制度"],"answer":"D","explanation":"政治-政治理论。本题选非，D 选项不属于：2024 年7 月18 日，中国共产党第二十届中央委员会第三次全体会议正式通过《中共中央关于进一步全面深化改革推进中国式现代化的决定》（以下简称《决定》）。《决定》在“八、健全全过程人民民主制度体系”部分指出：“（29）加强人民当家作主制度建设······健全人大议事规则和论证、评估、评议、听证制度。丰富人大代表联系人民群众的内容和形式。健全吸纳民意、汇集民智工作机制。发挥工会、共青团、妇联等群团组织联系服务群众的桥梁纽带作用。”故D 选项属于健全全过程人民民主改革措施。 ABC 选项正确：《决定》在“八、健全全过程人民民主制度体系”部分指出：“（32）完善大统战工作格局。完善发挥统一战线凝聚人心、汇聚力量政治作用的政策举措。坚持好、发展好、完善好中国新型政党制度。更好发挥党外人士作用，健全党外代表人士队伍建设制度。制定民族团结进步促进法，健全铸牢中华民族共同体意识制度机制，增强中华民族凝聚力。系统推进我国宗教中国化，加强宗教事务治理法治化。完善党外知识分子和新的社会阶层人士政治引领机制。全面构建亲清政商关系，健全促进非公有制经济健康发展、非公有制经济人士健康成长工作机制。完善港澳台和侨务工作机制。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-015","paperId":"gk2025-xz","num":15,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"党的二十届三中全会提出，健全绿色低碳发展机制，实施支持绿色低碳发展的财税、金融、投资、价格政策和标准体系，发展绿色低碳产业，健全绿色消费激励机制，促进绿色低碳循环发展经济体系建设。关于健全绿色低碳发展机制，下列举措不恰当的是：","options":["优化政府绿色采购政策，完善绿色税制","建立碳排放双控向能耗双控全面转型新机制","完善资源总量管理和全面节约制度，健全废弃物循环利用体系","加快规划建设新型能源体系，完善新能源消纳和调控政策措施"],"answer":"B","explanation":"推进中国式现代化的决定》“十二、深化生态文明体制改革”部分指出：“（49）健全绿色低碳发展机制。实施支持绿色低碳发展的财税、金融、投资、价格政策和标准体系，发展绿色低碳产业，健全绿色消费激励机制，促进绿色低碳循环发展经济体系建设。优化政府绿色采购政策，完善绿色税制。完善资源总量管理和全面节约制度，健全废弃物循环利用体系。健全煤炭清洁高效利用机制。加快规划建设新型能源体系，完善新能源消纳和调控政策措施。完善适应气候变化工作体系。建立能耗双控向碳排放双控全面转型新机制。构建碳排放统计核算体系、产品碳标识认证制度、产品碳足迹管理体系，健全碳市场交易制度、温室气体自愿减排交易制度，积极稳妥推进碳达峰碳中和。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-016","paperId":"gk2025-xz","num":16,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"深化医药卫生体制改革，是进一步全面深化改革的重要任务。关于深化医药卫生体制改革，下列举措不恰当的是：","options":["促进优质医疗资源扩容下沉和区域均衡布局","加快建设分级诊疗体系，强化基层医疗卫生服务","完善公立医院薪酬制度，严格限制、缩减编制数量","促进医疗、医保、医药协同发展和治理"],"answer":"C","explanation":"十届中央委员会第三次全体会议通过了《中共中央关于进一步全面深化改革推进中国式现代化的决定》（以下简称《决定》）。《决定》中“十一、健全保障和改善民生制度体系”中“（45）深化医药卫生体制改革”部分指出：“实施健康优先发展战略，健全公共卫生体系，促进社会共治、医防协同、医防融合，强化监测预警、风险评估、流行病学调查、检验检测、应急处置、医疗救治等能力。促进医疗、医保、医药协同发展和治理。促进优质医疗资源扩容下沉和区域均衡布局，加快建设分级诊疗体系，推进紧密型医联体建设，强化基层医疗卫生服务。深化以公益性为导向的公立医院改革，建立以医疗服务为主导的收费机制，完善薪酬制度，建立编制动态调整机制。引导规范民营医院发展。创新医疗卫生监管手段。健全支持创新药和医疗器械发展机制，完善中医药传承创新发展机制。”故“严格限制、缩减编制数量”说法错误。ABD 选项正确。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-017","paperId":"gk2025-xz","num":17,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"完善市场经济基础制度是构建高水平社会主义市场经济体制的重要内容。下列不属于完善市场经济基础制度内容的是：","options":["完善财政转移支付体系","完善市场信息披露制度","完善市场准入制度","完善产权制度"],"answer":"A","explanation":"共产党第二十届中央委员会第三次全体会议通过《中共中央关于进一步全面深化改革推进中国式现代化的决定》，其中“二、构建高水平社会主义市场经济体制”部分指出：“（7）完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制。完善市场信息披露制度，构建商业秘密保护制度······完善市场准入制度，优化新业态新领域市场准入环境。深化注册资本认缴登记制度改革，实行依法按期认缴。健全企业破产机制，探索建立个人破产制度，推进企业注销配套改革，完善企业退出制度。健全社会信用体系和监管制度。”而“完善财政转移支付体系”属于“深化财税体制改革” 的内容。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-018","paperId":"gk2025-xz","num":18,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记强调，加强党风廉政建设，一体推进不敢腐、不能腐、不想腐，严格落实中央八项规定精神，督促党员、干部特别是领导干部清廉自守、廉洁从政、干净做事。根据《中国共产党纪律处分条例》，下列违纪情况属于违反廉洁纪律的是：","options":["在重大原则问题上不同党中央保持一致且有实际言论、行为或者造成不良后果的","拒不执行党组织的分配、调动、交流等决定的","干涉生产经营自主权，致使群众财产遭受较大损失的","滥用职权或者职务上的影响操办婚丧喜庆事宜，造成不良影响的"],"answer":"D","explanation":"政治-党的知识。根据《中国共产党纪律处分条例》，以下简称《条例》。 D 选项正确：《条例》“第八章对违反廉洁纪律行为的处分”第一百条规定：“利用职权或者职务上的影响操办婚丧喜庆事宜，造成不良影响的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分；借机敛财或者有其他侵犯国家、集体和人民利益行为的，从重或者加重处分，直至开除党籍。” A 选项错误：《条例》“第六章对违反政治纪律行为的处分”第四十九条规定：“在重大原则问题上不同党中央保持一致且有实际言论、行为或者造成不良后果的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。” B 选项错误：《条例》“第七章对违反组织纪律行为的处分”第七十九条第一款规定：“拒不执行党组织的分配、调动、交流等决定的，给予警告、严重警告或者撤销党内职务处分。” C 选项错误：《条例》“第九章对违反群众纪律行为的处分”第一百二十三条规定：“干涉生产经营自主权，致使群众财产遭受较大损失的，对直接责任者和领导责任者，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。”","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-019","paperId":"gk2025-xz","num":19,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"习近平总书记指出，要推动各级领导班子认真践行正确政绩观，切实形成正确工作导向。下列表述与正确政绩观要求相符合的是：","options":["领导干部要树牢竞争优先、力争上游的政绩观","坚持高质量发展，要完善推动高质量发展的政绩考核评价办法","坚持打基础利长远，要注重在做强发展指标、做优发展数据上下功夫","坚持出实招求实效，要大力发展高标准、大气派的工程"],"answer":"B","explanation":"志为核心的党中央作出的一项重大战略部署，是关系我国发展全局的一场深刻变革。要充分发挥政绩考核指挥棒作用，把贯彻落实习近平总书记重要指示批示精神和党中央决策部署，贯彻新发展理念、推动高质量发展的实际表现和工作实绩，作为评价领导班子和领导干部政绩的基本依据。2024 年2 月，习近平总书记在中共中央政治局第十一次集体学习时强调，“完善推动高质量发展的考核评价体系，为推动高质量发展打牢基础”。 A 选项错误：2024 年全国两会期间，习近平总书记在参加十四届全国人大一次会议江苏代表团审议时强调，“不要有大干快上的冲动，也就是不能不按规律办事，急功近利、急于出成绩。要把这种浮躁心理、急躁心态都压下来，扎扎实实、踏踏实实地搞现代化建设”。“竞争优先、力争上游”的政绩观过于浮躁，不利于党和国家事业的稳定发展。 C 选项错误：习近平总书记在2022 年春季学期中央党校（国家行政学院）中青年干部培训班开班式上指出：“有些事情是不是好事实事，不能只看群众眼前的需求，还要看是否会有后遗症，是否会‘解决一个问题，留下十个遗憾’。我们做事情、干工作要既符合党、国家和人民眼前利益的要求，又符合党、国家和人民长远利益的要求。”所以，选项“坚持打基础利长远”的说法正确，但“要注重在做强发展指标、做优发展数据上下功夫”表述有误，属于形式主义，与正确政绩观“干实事”的要求不一致。 D 选项错误：习近平总书记在2021 年春季学期中央党校（国家行政学院）中青年干部培训班开班式上的讲话中指出：“要坚持实事求是、求真务实，从实际出发谋划事业和工作，使提出的点子、政策、方案符合实际情况、符合客观规律、符合科学精神，以创造性工作把党中央决策部署落到实处。”与选项“坚持出实招求实效”的说法对应，属于正确政绩观，但“大力发展高标准、大气派的工程”是在搞形象工程，背离了广大群众的利益，会造成严重影响和巨大损失。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-020","paperId":"gk2025-xz","num":20,"year":2025,"region":"国家","module":"政治理论","sub":"政治","stem":"西部地区在全国改革发展稳定大局中举足轻重。要一以贯之抓好党中央推动西部大开发政策举措的贯彻落实，进一步形成大保护、大开放、高质量发展新格局。关于新时代推动西部大开发，下列表述不正确的是：","options":["要坚持把全面发展新兴产业作为主攻方向，加快西部地区产业转型升级","要坚持以大开放促进大开发，提高西部地区对内对外开放水平","要坚持统筹发展和安全，提升能源资源等重点领域安全保障能力","要坚持推进新型城镇化和乡村全面振兴有机结合，在发展中保障和改善民生"],"answer":"A","explanation":"习近平在重庆主持召开新时代推动西部大开发座谈会并发表重要讲话。本题选非，A 选项错误：习近平强调，要坚持把发展特色优势产业作为主攻方向，因地制宜发展新兴产业，加快西部地区产业转型升级。强化科技创新和产业创新深度融合，积极培养引进用好高层次科技创新人才，努力攻克一批关键核心技术。 B 选项正确：习近平强调，要坚持以大开放促进大开发，提高西部地区对内对外开放水平。大力推进西部陆海新通道建设，推动沿线地区开发开放，深度融入共建“一带一路”。 C 选项正确：习近平指出，要坚持统筹发展和安全，提升能源资源等重点领域安全保障能力。加快建设新型能源体系，做大做强一批国家重要能源基地。 D 选项正确：习近平强调，要坚持推进新型城镇化和乡村全面振兴有机结合，在发展中保障和改善民生。深入实施乡村振兴战略，加大对国家乡村振兴重点帮扶县支持力度，建立低收入人口和欠发达地区常态化帮扶机制，坚决防止发生规模性返贫。常识判断","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-021","paperId":"gk2025-xz","num":21,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与我国的立法权相关的说法正确的是：","options":["强制隔离戒毒、冻结存款的行政强制措施只能由法律予以设定","全国人民代表大会可授权国务院根据实际需要制定法律","法律解释权属于全国人大常委会、最高人民法院及最高人民检察院","行政法规由国务院及其组成部门、直属机构、办事机构予以制定发布"],"answer":"A","explanation":"法律-其他法。A 选项正确：根据《中华人民共和国行政强制法》第九条规定：“行政强制措施的种类：（一）限制公民人身自由；（二）查封场所、设施或者财物；（三）扣押财物；（四）冻结存款、汇款；（五）其他行政强制措施。”第十条规定：“行政强制措施由法律设定。尚未制定法律，且属于国务院行政管理职权事项的，行政法规可以设定除本法第九条第一项、第四项和应当由法律规定的行政强制措施以外的其他行政强制措施。尚未制定法律、行政法规，且属于地方性事务的，地方性法规可以设定本法第九条第二项、第三项的行政强制措施。法律、法规以外的其他规范性文件不得设定行政强制措施。”因此，限制公民人身自由（强制隔离戒毒）与冻结存款、汇款的行政强制措施只能由法律予以设定。 B 选项错误：根据《中华人民共和国立法法》第十条第三款规定：“全国人民代表大会可以授权全国人民代表大会常务委员会制定相关法律。”第十二条规定：“本法第十一条规定的事项尚未制定法律的，全国人民代表大会及其常务委员会有权作出决定，授权国务院可以根据实际需要，对其中的部分事项先制定行政法规，但是有关犯罪和刑罚、对公民政治权利的剥夺和限制人身自由的强制措施和处罚、司法制度等事项除外。”因此，全国人民代表大会可授权全国人民代表大会常务委员会制定相关法律，可授权国务院根据实际需要先制定行政法规，而非法律。 C 选项错误：根据《中华人民共和国立法法》第四十八条第一款规定：“法律解释权属于全国人民代表大会常务委员会。”第一百一十九条第一款规定“最高人民法院、最高人民检察院作出的属于审判、检察工作中具体应用法律的解释，应当主要针对具体的法律条文，并符合立法的目的、原则和原意。遇有本法第四十八条第二款规定情况的，应当向全国人民代表大会常务委员会提出法律解释的要求或者提出制定、修改有关法律的议案。”因此，法律解释权属于全国人民代表大会常务委员会，最高人民法院、最高人民检察院只可以作出属于审判、检察工作中具体应用法律的解释。 D 选项错误：根据《中华人民共和国立法法》第七十二条第一款规定：“国务院根据宪法和法律，制定行政法规。”第九十一条第一款规定：“国务院各部、委员会、中国人民银行、审计署和具有行政管理职能的直属机构以及法律规定的机构，可以根据法律和国务院的行政法规、决定、命令，在本部门的权限范围内，制定规章。”因此，国务院制定的是行政法规，国务院组成部门、直属机构制定的是规章。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-022","paperId":"gk2025-xz","num":22,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国食品安全法》，下列情形符合法律规定的是：","options":["某食品生产企业自行检验产品后，不再委托专业机构进行检验","某乳制品生产企业以分装方式生产婴幼儿配方乳粉","某食品安全监督管理部门向食品生产经营者收取检验费","某个体工商户仅销售预包装食品，未报食品安全监督管理部门备案"],"answer":"A","explanation":"法律-其他法。A 选项正确：根据《中华人民共和国食品安全法》第八十九条第一款规定：“食品生产企业可以自行对所生产的食品进行检验，也可以委托符合本法规定的食品检验机构进行检验。”因此，某食品生产企业自行检验产品后，可以不再委托专业机构进行检验。 B 选项错误：根据《中华人民共和国食品安全法》第八十一条第五款规定：“不得以分装方式生产婴幼儿配方乳粉，同一企业不得用同一配方生产不同品牌的婴幼儿配方乳粉。”因此，某乳制品生产企业不得以分装方式生产婴幼儿配方乳粉。 C 选项错误：根据《中华人民共和国食品安全法》第八十七条规定：“县级以上人民政府食品安全监督管理部门应当对食品进行定期或者不定期的抽样检验，并依据有关规定公布检验结果，不得免检。进行抽样检验，应当购买抽取的样品，委托符合本法规定的食品检验机构进行检验，并支付相关费用；不得向食品生产经营者收取检验费和其他费用。”因此，某食品安全监督管理部门不得向食品生产经营者收取检验费。 D 选项错误：根据《中华人民共和国食品安全法》第三十五条第一款规定：“国家对食品生产经营实行许可制度。从事食品生产、食品销售、餐饮服务，应当依法取得许可。但是，销售食用农产品和仅销售预包装食品的，不需要取得许可。仅销售预包装食品的，应当报所在地县级以上地方人民政府食品安全监督管理部门备案。”因此，某个体工商户仅销售预包装食品，应报所在地县级以上地方人民政府食品安全监督管理部门备案。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-023","paperId":"gk2025-xz","num":23,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"2024年5月，甲驾驶重型半挂车行驶至某县辖区内被交警临检。该县公安局交警大队认定甲存在驾驶故意污损机动车号牌的机动车在道路行驶的行为，遂当场作出罚款200元、记9分的处罚决定。甲认为其不存在故意污损号牌的行为，对处罚决定不服。下列说法正确的是：","options":["甲可以不经行政复议，直接向人民法院提起行政诉讼","甲若申请行政复议，复议机关为该县公安局","甲若申请行政复议，不适用简易程序审理","甲若申请行政复议，该案可适用调解"],"answer":"D","explanation":"法律-行政法。D 选项正确：根据《中华人民共和国行政复议法》第五条第一款：“行政复议机关办理行政复议案件，可以进行调解。”因此，甲若申请行政复议，该案可适用调解。 A 选项错误：根据《中华人民共和国行政复议法》第二十三条第一款第一项规定：“有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：（一）对当场作出的行政处罚决定不服；”题中，县公安局交警大队是当场对甲作出罚款200 元、记9 分的处罚决定，甲对此不服应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼，不得直接向人民法院提起行政诉讼。 B 选项错误：根据《中华人民共和国行政复议法》第二十四条第一款第一项规定：“县级以上地方各级人民政府管辖下列行政复议案件：（一）对本级人民政府工作部门作出的行政行为不服的；”题中，甲对行政处罚决定不服，则县公安局为被申请人，复议机关为县政府，而不是县公安局。 C 选项错误：根据《中华人民共和国行政复议法》第五十三条第一款第一项规定：“行政复议机关审理下列行政复议案件，认为事实清楚、权利义务关系明确、争议不大的，可以适用简易程序：（一）被申请行政复议的行政行为是当场作出；”题中，县公安局交警大队是当场对甲作出罚款200 元、记9 分的处罚决定，依法可以适用简易程序审理。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-024","paperId":"gk2025-xz","num":24,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"虚假诉讼、作伪证是我国重点打击的破坏司法秩序的行为。下列说法错误的是：","options":["甲伪造合同向法院起诉，意图获得非法利益，甲可能被罚款、拘留或被追究刑事责任","甲指使乙在一民事案件中作伪证，甲的行为构成妨害作证罪","甲欠乙2万元，因欠条遗失，乙补写欠条并模仿甲的签名后向法院起诉，乙的行为构成虚假诉讼罪","甲为鉴定人，在某刑事案件中故意作虚假鉴定，意图陷害他人，甲的行为构成伪证罪"],"answer":"C","explanation":"法律-刑法。本题选非，C 选项错误：根据《中华人民共和国刑法》第三百零七条之一第一款关于虚假诉讼罪规定：“以捏造的事实提起民事诉讼，妨害司法秩序或者严重侵害他人合法权益的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；情节严重的，处三年以上七年以下有期徒刑，并处罚金。”选项中，甲确实欠乙2 万元，虽然后期乙补写欠条并模仿甲的签名，但是乙并不存在捏造事实的情形。因此，乙的行为并不构成虚假诉讼罪。 A 选项正确：根据《中华人民共和国民事诉讼法》第一百一十四条第一款第一项规定：“诉讼参与人或者其他人有下列行为之一的，人民法院可以根据情节轻重予以罚款、拘留；构成犯罪的，依法追究刑事责任：（一）伪造、毁灭重要证据，妨碍人民法院审理案件的；”选项中，甲伪造合同向法院起诉，属于伪造、毁灭重要证据，妨碍人民法院审理案件的行为，甲可能被罚款、拘留或被追究刑事责任。 B 选项正确：根据《中华人民共和国刑法》第三百零七条第一款关于妨害作证罪规定：“以暴力、威胁、贿买等方法阻止证人作证或者指使他人作伪证的，处三年以下有期徒刑或者拘役；情节严重的，处三年以上七年以下有期徒刑。”选项中，甲指使乙在案件中作伪证，属于妨害作证的情形。因此，甲的行为构成妨害作证罪。 D 选项正确：根据《中华人民共和国刑法》第三百零五条关于伪证罪规定：“在刑事诉讼中，证人、鉴定人、记录人、翻译人对与案件有重要关系的情节，故意作虚假证明、鉴定、记录、翻译，意图陷害他人或者隐匿罪证的，处三年以下有期徒刑或者拘役；情节严重的，处三年以上七年以下有期徒刑。”选项中，甲为鉴定人，在案件中故意作虚假鉴定，属于作伪证的情形。因此，甲的行为构成伪证罪。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-025","paperId":"gk2025-xz","num":25,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"关于所有权的取得，下列说法正确的是：","options":["甲在公园捡到一条金项链，经多方寻找失主未果，此时甲获得项链的所有权","乙以市价购买了一辆自行车，后发现该车是卖家借来的，乙仍可获得该车的所有权","丙继承了一处房产，但尚未办理变更登记，丙此时还未获得该房产的所有权","丁从村集体处承包了一块田地用于农作物种植，丁同时取得这块田地的所有权"],"answer":"B","explanation":"法律-民法。B 选项正确：根据《中华人民共和国民法典》第三百一十一条第一款规定：“无处分权人将不动产或者动产转让给受让人的，所有权人有权追回；除法律另有规定外，符合下列情形的，受让人取得该不动产或者动产的所有权：（一）受让人受让该不动产或者动产时是善意；（二）以合理的价格转让；（三）转让的不动产或者动产依照法律规定应当登记的已经登记，不需要登记的已经交付给受让人。”因此，乙以市价购买了一辆自行车，后发现该车是卖家借来的，乙可以善意取得该车的所有权。 A 选项错误：根据《中华人民共和国民法典》第三百一十四条规定：“拾得遗失物，应当返还权利人。拾得人应当及时通知权利人领取，或者送交公安等有关部门。”因此，甲应当及时通知权利人领取，或者送交公安等有关部门，甲并不可以获得项链的所有权。 C 选项错误：根据《中华人民共和国民法典》第一千一百二十一条规定：“继承从被继承人死亡时开始。”第二百三十条规定：“因继承取得物权的，自继承开始时发生效力。”因此，丙对于该房屋所有权的取得，自继承开始即被继承人死亡时发生效力。 D 选项错误：根据《中华人民共和国民法典》第三百二十四条规定：“国家所有或者国家所有由集体使用以及法律规定属于集体所有的自然资源，组织、个人依法可以占有、使用和收益。”因此，丁对该田地可以依法享有占有、使用和收益的权利，并不享有所有权。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-026","paperId":"gk2025-xz","num":26,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"《中华人民共和国消费者权益保护法实施条例》自2024年7月1日起施行。下列说法或做法符合相关法律法规的是：","options":["甲公司在消费者订购云服务前将自动续费条款放置于显著位置，消费者同意订购并勾选自动续费，甲公司可在该服务到期时自动扣费","乙加油站为消费者提供免费洗车服务时造成车身划痕，该加油站无需承担赔偿责任","丙在某直播平台上直播卖服装，称自己的服装为尾货和瑕疵品，要求大家谨慎购买，该商品不适用七天无理由退货","丁健身馆与消费者签订书面合同，约定提供为期半年的健身私教课程服务并收取3000元预付款"],"answer":"D","explanation":"法律-其他法。D 选项正确：根据《中华人民共和国消费者权益保护法实施条例》第二十二条第一款规定：“经营者以收取预付款方式提供商品或者服务的，应当与消费者订立书面合同，约定商品或者服务的具体内容、价款或者费用、预付款退还方式、违约责任等事项。”因此，丁健身馆与消费者约定提供为期半年的健身私教课程服务并收取3000 元预付款，可以通过订立书面合同的方式约定。 A 选项错误：根据《中华人民共和国消费者权益保护法实施条例》第十条第二款规定：“经营者采取自动展期、自动续费等方式提供服务的，应当在消费者接受服务前和自动展期、自动续费等日期前，以显著方式提请消费者注意。”因此，甲公司的自动扣费业务，不仅应当在消费者接受服务前以显著方式提请消费者注意，还应当在自动续费日期前，以显著方式提请消费者注意。 B 选项错误：根据《中华人民共和国消费者权益保护法实施条例》第七条第二款规定：“经营者向消费者提供商品或者服务（包括以奖励、赠送、试用等形式向消费者免费提供商品或者服务），应当保证商品或者服务符合保障人身、财产安全的要求······”因此，乙加油站虽然为消费者提供的是免费洗车服务，但仍应当保证商品或者服务符合保障人身、财产安全的要求。 C 选项错误：根据《中华人民共和国消费者权益保护法实施条例》第十九条第一、二款规定： “经营者通过网络、电视、电话、邮购等方式销售商品的，应当遵守消费者权益保护法第二十五条规定，不得擅自扩大不适用无理由退货的商品范围。经营者应当以显著方式对不适用无理由退货的商品进行标注，提示消费者在购买时进行确认，不得将不适用无理由退货作为消费者默认同意的选项。未经消费者确认，经营者不得拒绝无理由退货。”根据《中华人民共和国消费者权益保护法》第二十五条第一、二款规定：“经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货，且无需说明理由，但下列商品除外：（一）消费者定作的；（二）鲜活易腐的；（三）在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；（四）交付的报纸、期刊。除前款所列商品外，其他根据商品性质并经消费者在购买时确认不宜退货的商品，不适用无理由退货。”因此，在消费者权益保护法第二十五条明确规定不适用无理由退货的商品范围以外的商品，未经消费者确认，经营者不得拒绝无理由退货。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-027","paperId":"gk2025-xz","num":27,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列情形中甲的主张最可能得到人民法院支持的是：","options":["甲竞买人在现场拍卖中拍得一件艺术品，甲主张合同自拍卖师落槌时成立","甲乙企业签订的合作备忘录仅表达了双方深度合作的意向，甲主张预约合同成立","甲游戏平台在采用格式条款订立合同时，仅以设置勾选的方式提示用户，甲主张已履行提示义务","甲与乙的房产买卖合同存在可撤销的情形，但已办理产权变更登记手续，甲以此为由主张合同有效"],"answer":"A","explanation":"法律-民法。A 选项正确：根据《最高人民法院关于适用&lt;中华人民共和国民法典 &gt;合同编通则若干问题的解释》第四条第二款规定：“采取现场拍卖、网络拍卖等公开竞价方式订立合同，当事人请求确认合同自拍卖师落槌、电子交易系统确认成交时成立的，人民法院应予支持。合同成立后，当事人拒绝签订成交确认书的，人民法院应当依据拍卖公告、竞买人的报价等确定合同内容。”选项中，拍卖师落槌该合同即成立。 B 选项错误：根据《最高人民法院关于适用&lt;中华人民共和国民法典&gt;合同编通则若干问题的解释》第六条第二款规定：“当事人通过签订意向书或者备忘录等方式，仅表达交易的意向，未约定在将来一定期限内订立合同，或者虽然有约定但是难以确定将来所要订立合同的主体、标的等内容，一方主张预约合同成立的，人民法院不予支持。”选项中，甲乙企业签订的合作备忘录仅表达了双方深度合作的意向，不构成预约合同。 C 选项错误：根据《最高人民法院关于适用&lt;中华人民共和国民法典&gt;合同编通则若干问题的解释》第十条第三款规定：“提供格式条款的一方对其已经尽到提示义务或者说明义务承担举证责任。对于通过互联网等信息网络订立的电子合同，提供格式条款的一方仅以采取了设置勾选、弹窗等方式为由主张其已经履行提示义务或者说明义务的，人民法院不予支持，但是其举证符合前两款规定的除外。”本条前两款是关于履行提示义务或者说明义务的要求。选项中，甲仅以设置勾选的方式提示用户并未尽到提示义务。 D 选项错误：根据《最高人民法院关于适用&lt;中华人民共和国民法典&gt;合同编通则若干问题的解释》第十三条规定：“合同存在无效或者可撤销的情形，当事人以该合同已在有关行政管理部门办理备案、已经批准机关批准或者已依据该合同办理财产权利的变更登记、移转登记等为由主张合同有效的，人民法院不予支持。”选项中，以办理产权变更登记手续为由，不能主张合同有效。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-028","paperId":"gk2025-xz","num":28,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列人物所说的话与经济有关，其中说法正确的是：","options":["社区居民：我的定期储蓄存款被统计在货币供应量M1中","外资企业CEO：我公司的产值持续增长，为中国GDP提升做出了贡献","留美学生：人民币汇率降低，我的学费也降低了","纳税商户：相比于增值税，营业税的好处是避免重复征税"],"answer":"B","explanation":"经济-微观经济。B 选项正确：GDP（国内生产总值）是指一个国家和地区所有常住单位在一定时期内生产活动的全部最终成果。外资企业在中国的生产活动产生的价值会计入中国的GDP。 A 选项错误：中国货币供应量的层次划分为：M0=流通中现金；M1=M0+单位活期存款； M2=M1+单位定期存款+个人存款+其他存款。社区居民的定期储蓄存款属于个人存款，通常被计入M2。 C 选项错误：人民币汇率降低，意味着人民币贬值，美元相对升值。对于在美国留学的学生来说，这通常会导致他们需要支付更多的人民币来兑换美元以支付学费，而不是降低。 D 选项错误：营业税是一种流转税，是在商品销售或劳务提供过程中，针对流转额（如销售额、营业额等）征收的税款。而增值税是对商品和服务在流转过程中产生的增值额进行征税。增值税的一个重要特点就是可以避免重复征税，因为它只对每个环节的增值部分征税。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-029","paperId":"gk2025-xz","num":29,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下图为夏季某天我国两个城市的日月升落时间示意图，下列与之相关的说法正确的是：","options":["左图城市比右图城市纬度高","这一天是农历的二十左右","左图城市比右图城市位置更靠东","两地的人所看到的月相是不同的"],"answer":"A","explanation":"地理-自然地理。A 选项正确：夏季，太阳直射点在北回归线和赤道之间移动，北半球每天被太阳照到的时间长，照不到的时间短，所以夏季北半球昼长夜短。而且在夏季，北半球纬度越高，昼越长，夜越短。左图城市的白天时间为15 个小时又25 分钟，右图城市的白天时间为14 个小时又7 分钟，因此，左图城市比右图城市纬度高。 B 选项错误：月亮在公转过程中，它和太阳、地球三者的相对位置不断发生变化，被太阳光照亮的部分，形成周期性圆缺盈亏的各种形状，称为月相。月相变化可粗略概括为：新月（朔月）-上娥眉月-上弦月-满月（望月）-下弦月-下娥眉月（残月）-新月（朔月），如此往复循环。图中的月相为残月（下娥眉月），故这一天是农历的二十七左右。 C 选项错误：地球自西向东自转，所以越靠东，越早看到日出。左图城市的日出时间为06： 31，右图城市的日出时间为04：55，右图城市更早看到日出。因此，右图城市比左图城市位置更靠东。 D 选项错误：两个城市的月相都是残月（下娥眉月）。虽然月出和月落的时间不同，但这是由于两地经度不同导致的时间差异，而不是月相本身不同。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-030","paperId":"gk2025-xz","num":30,"year":2025,"region":"国家","module":"常识判断","sub":"科技生活","stem":"下列情境中的两个物理量成正比例的是： ①通过某一电阻器的电流与其两端的电压 ②物体所受浮力与其体积 ③弹性限度内弹簧的伸长量与其所受拉力 ④汽车行驶时的加速度与速度","options":["①②","②④","③④","①③"],"answer":"D","explanation":"科技-物理。D 选项正确：①正确，根据欧姆定律，电阻器中的电流I 与其两端的电压U 之间的关系是，其中R 是电阻器的电阻，是一个常数。因此，当电压U 增加时，电流I 也会增加，且增加的比例是固定的（即）。所以，通过某一电阻器的电流与其两端的电压成正比例。 ②错误，物体所受浮力与其体积V 之间的关系并不总是成正比例的。根据阿基米德原理，浮力等于物体排开的液体所受的重力，即，其中是液体的密度，g 是重力加速度，是物体排开的液体的体积。如果物体完全浸入液体中，那么等于物体的体积V，此时浮力与物体的体积成正比。但是，如果物体只是部分浸入液体中，那么就小于物体的体积V，此时浮力与物体的体积就不成正比。因此，不能简单地说物体所受浮力与其体积成正比例。 ③正确，在弹性限度内，弹簧的伸长量x 与其所受拉力F 之间的关系符合胡克定律，即F=kx，其中k 是弹簧的劲度系数，是一个常数。因此，当拉力F 增加时，弹簧的伸长量x 也会增加，且增加的比例是固定的（即）。所以，弹性限度内弹簧的伸长量与其所受拉力成正比例。 ④错误，汽车行驶时的加速度a 与速度v 之间并没有固定的比例关系。加速度是速度变化率与时间的比值，即。加速度的大小取决于速度的变化率，而不是速度本身。因此，汽车行驶时的加速度与速度不成正比例。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-031","paperId":"gk2025-xz","num":31,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与纤维材料有关的说法错误的是：","options":["玻璃纤维性脆，耐磨性较差","碳纤维抗张强度好且没有导电性","竹炭纤维能吸湿和清除异味","大豆蛋白纤维细腻，适用于内衣制造"],"answer":"B","explanation":"科技-化学。本题选非，B 选项错误：碳纤维具有诸多优良性能，比如它的抗张强度非常好，能够承受较大的拉力等外力作用。同时，碳纤维具有导电性，可以作为一种功能性材料应用在一些需要导电特性的领域，如电子等领域。 A 选项正确：玻璃纤维的特点是拉伸强度高，但质地较脆，易折断。在受到摩擦等外力作用时，其耐磨性表现相对较差，比较容易出现磨损等情况。 C 选项正确：竹炭纤维是一种新型的环保纤维，纤维内部有很多微孔结构，这种结构使得它具备比较强的吸湿能力，能够吸收环境中的水分；而且微孔还可以吸附异味分子，从而起到清除异味的效果。 D 选项正确：大豆蛋白纤维是一种再生植物蛋白纤维，它的手感细腻、柔软，穿着舒适性高，同时具有良好的吸湿性、透气性和亲肤性，非常适合用于内衣等贴身衣物的制造。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-032","paperId":"gk2025-xz","num":32,"year":2025,"region":"国家","module":"常识判断","sub":"人文历史","stem":"如果要写一部《地球史诗》，下列描述与地质年代对应不当的是：","options":["虽然这时的大陆荒凉一片，但大海的子民空前繁盛，藻类欣欣向荣，三叶虫风头最劲，生命是这个时代永恒的主题 ——寒武纪","新生的纪元始于大灭绝之后，哺乳动物继恐龙成为新主，被子植物极度繁盛，裸子植物只有松柏长青——志留纪","鱼类是这个时代的代言人，裸蕨在大地上站稳了脚根，成片的森林改写了历史，登陆的两栖类颠覆了乾坤——泥盆纪","森林以裸子植物为名养育了恐龙，鸟类首次翱翔于天空，恐龙最终征服了世界——侏罗纪"],"answer":"B","explanation":"地理-世界地理。本题选非，B 选项错误：志留纪是古生代的第三个纪，约开始于 4.43 亿年前，结束于4.19 亿年前。在这个时期里，地壳相当稳定，但末期有强烈的造山运动。生物群中腕足类和珊瑚繁荣，三叶虫和笔石仍繁盛，无颌类发育，到晚期出现原始鱼类，末期出现原始陆生植物裸蕨。新生代是显生宙的第三个代，分为古近纪、新近纪和第四纪。在这个时期地壳有强烈的造山运动，中生代的爬行动物绝迹，哺乳动物繁盛，生物达到高度发展阶段，和现代接近，后期有人类出现。 A 选项正确：寒武纪是古生代的第一个纪，约开始于5.4 亿年前，结束于4.85 亿年前。在这个时期里，陆地下沉，北半球大部被海水淹没。寒武纪常被称为“三叶虫的时代”，这是因为寒武纪岩石中保存有比其他类群丰富的矿化的三叶虫硬壳。植物中红藻、绿藻等开始繁盛。 C 选项正确：泥盆纪是古生代的第四个纪，约开始于4.19 亿年前，结束于3.59 亿年前。这个时期的初期各处海水退去，积聚后层沉积物。后期海水又淹没陆地并形成含大量有机物质的沉积物。在泥盆纪里蕨类植物繁盛，昆虫和两栖类兴起。脊椎动物进入飞跃发展时期，鱼形动物数量和种类增多，现代鱼类——硬骨鱼开始发展。泥盆纪常被称为“鱼类时代”。 D 选项正确：侏罗纪是中生代的第二个纪，约开始于2.01 亿年前，结束于1.45 亿年前。在这个时期里，有造山运动和剧烈的火山活动。这一时期恐龙成为陆地的统治者，爬行动物非常发达，翼龙类和鸟类出现，哺乳动物开始发展。植物中苏铁、银杏最繁盛。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-033","paperId":"gk2025-xz","num":33,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与体育比赛有关的说法错误的是：","options":["跳水运动的难度系数涉及动作姿势和翻腾转体周数等方面","篮球比赛中罚球时允许球员双脚离地","足球比赛的常规时间长度为90分钟","举重运动中判定试举成功需要三名裁判均亮白灯"],"answer":"D","explanation":"科技-生活常识。本题选非，D 选项错误：举重比赛的裁判系统需要3 个白灯、3 个红灯和1 个蜂鸣器。比赛临场裁判员3 名，裁判员手里各控制1 个白灯和1 个红灯。裁决时，3 个白灯为成功；3 个红灯为失败。如2 白1 红或2 红1 白，那就要少数服从多数，前者仍为成功，后者仍为失败。 A 选项正确：跳水运动的难度系数是由国际泳联（FINA）根据动作的复杂程度、执行难度以及创新性等因素综合评定得出的一个数值，具体因素包括动作的转体次数、翻腾次数和姿势难度等。 B 选项正确：根据篮球规则，罚球需在罚球线后方的半圆内完成。不限制投篮方式，但球必须由篮筐上方投入或触及篮筐。当裁判员将球置于可处理时，球员应在5 秒钟内将球投出。在球触及篮筐之前，罚球人不得触及罚球线或进入限制区域（罚球半圆以外的区域）。罚球时不可以做假动作。由此可知，罚球时并未规定球员双脚是否可以离地，故认定是否离地都可以。 C 选项正确：足球比赛的常规时间长度为90 分钟，分为上下两个半场，每个半场的时间为 45 分钟。如果在90 分钟内比赛双方打成平局，且需要决出胜负，则会进行30 分钟的加时赛。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-034","paperId":"gk2025-xz","num":34,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"下列诗句都涉及天体，其中说法错误的是：","options":["“卧看牵牛织女星”所涉及的天体不属于太阳系","“每依北斗望京华”中的天体不包括北极星","“启明星在树梢头”中的行星公转轨道半径较地球更大","“岁星渐高辰星光”中的“岁星”属于气态巨行星"],"answer":"C","explanation":"地理-自然地理。本题选非，C 项错误：金星在中国古代被称为太白金星，清晨在东方天空出现则被称为“启明星”，晚间在西方天空出现被称为“长庚星”或“昏星”。金星是太阳系的八大行星之一，是从太阳向外的第二颗行星，公转轨道半径比地球小。 A 选项正确：太阳系包括太阳、8 个行星、近500 个卫星和至少120 万个小行星，还有一些矮行星和彗星。牛郎星，又名河鼓二、“天鹰座”，是恒星光谱A 型中的主序星，不属于太阳系。织女星，或者称为织女一或天琴座，是天琴座中最明亮的恒星，也不属于太阳系。 B 选项正确：北斗七星，是夜空中的七颗亮星，它们组成的图形像是古代舀酒的斗，故命名为北斗七星。北斗七星属于大熊座。北极星现在一般指“勾陈一”（小熊座）。北斗七星不包括北极星。 D 选项正确：中国古代称木星为岁星。木星是太阳系中距离太阳第五近的行星，也是太阳系中体积最大的行星。木星是一颗气态巨行星，质量是太阳的千分之一，但却是太阳系中其他七大行星质量总和的2.5 倍。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-035","paperId":"gk2025-xz","num":35,"year":2025,"region":"国家","module":"常识判断","sub":"法律","stem":"关于温室栽培，下列说法错误的是：","options":["夜间降低温室内的温度，可以减少农作物营养物质的消耗","相比普通塑料温室大棚，玻璃温室可以让阳光更容易进入","紫外线灯是一种大棚中经常使用且效果较好的植物补光灯","在作物栽培过程中通入适量的二氧化碳可以提高作物产量"],"answer":"C","explanation":"科技-生物医学。本题选非，C 选项错误：植物灯模拟植物需要太阳光进行光合作用的原理，对植物进行补光或者完全代替太阳光。目前主流的植物补光灯包含LED 灯和高压钠灯。在温室大棚种植补光中，这两种产品都有较为广泛的应用。紫外线灯具有较好的杀菌作用，主要用于杀菌消毒，并不在大棚中经常使用。 A 选项正确：夜间降低温室内的温度，可以减少农作物的呼吸作用，温度越低，农作物的呼吸作用越弱，有机物的消耗也就越少，可以提高农作物的产量。 B 选项正确：温室是采光建筑，因而透光率是评价温室透光性能的一项最基本指标。透光率是指透进温室内的光照量与室外光照量的百分比。一般来说，连栋塑料温室的透光率在 50%-60%，玻璃温室的透光率在60%-70%，日光温室的透光率可达到70%以上。 D 选项正确：二氧化碳是植物进行光合作用的主要原料之一。在光照条件下，植物通过吸收二氧化碳和水，利用叶绿素将太阳能转化为化学能，进而合成有机物质并释放出氧气。因此，增加二氧化碳的浓度可以促进作物进行光合作用，提高光合作用的效率，从而加快作物的生长速度和提高作物产量。言语理解与表达","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-036","paperId":"gk2025-xz","num":36,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"随着技术经验积累，高空风弹道修正等技术方法能使火箭在飞行过程中有效抵抗风干扰。为了有更强的适应性，本发长八火箭在使用自主抗干扰控制技术等成熟方法之外，还增加了自动滚转减载技术，根据风的来向，会在空中主动滚动调整，使火箭用更稳定的优势面来应对高空风，用“ ”的方式，通过自身的旋转抵消掉高空风的影响。依次填入画横线部分最恰当的一项是：","options":["以柔克刚","以守为攻","以虚为实","以退为进"],"answer":"A","explanation":"行政执法/省部级-逻辑填空题。根据“会在空中主动滚动调整”及“通过自身的旋转抵消掉高空风的影响”可知，体现本发长八火箭主动性、灵活性，不是去硬碰硬，而是用更巧妙的方法应对风，A 项“以柔克刚”指用柔软的去克制刚强的，比喻避开锋芒，用温和的手段取胜；能够体现火箭应对高空风干扰的方式，符合文意；B 项“以守为攻”指用防御作为击破敌人的手段；文段未体现出火箭为防御的状态，不符合文意，排除；C 项“以虚为实”意思是军事上迷惑对方，使其难辨虚实和真伪的一种战术；文段并未体现火箭使高空风无法辨别虚实和真伪，排除；D 项“以退为进”原指以谦让取得德行的进步，后指以退让的姿态作为进取的手段；文段中火箭并非采取后退的方式应对高空风的干扰，不符合文意，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-037","paperId":"gk2025-xz","num":37,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"《营造法式》刊行之后，两浙一带的建筑技术借助官方的推广完全融入了中国古典木构建筑技术的主流。以抬梁式为梁柱结构，屋面重量通过椽、檩、梁、斗栱、柱传递至基础的方案，形成此后中国官式建筑的发展路径。这种结构开间大，立柱少，气势恢宏，可细分为殿堂式与厅堂式，满足不同礼制等级的需要。填入画横线部分最恰当的一项是：","options":["源远流长","标新立异","一枝独秀","一以贯之"],"answer":"D","explanation":"行政执法/地市级-逻辑填空题。根据“融入了中国古典木构建筑技术的主流”及“形成此后……的发展路径”可知，空格处表示中国官式建筑按照这一路径继续延续发展。D 项“一以贯之”指做人做事按照一个道理，从始至终都不会改变，符合文意；A 项“源远流长”比喻历史悠久，根底深厚。常搭配“历史”，与“发展路径”搭配不当，排除；B 项“标新立异”多形容敢于改革创新或提出新奇的主张，显示与众不同，也指为了显示自己而故意另搞一套。文段既未体现“创新”，也未体现“故意另搞一套”，排除；C 项“一枝独秀”比喻在同类人或同类事物中出类拔萃。文段并未体现“出类拔萃”的意思，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-038","paperId":"gk2025-xz","num":38,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"兔和羚羊等食草动物获取食物时动作敏捷，牛类有瘤胃可以囤积食物，到安全环境中再慢慢消化。大熊猫既没有敏捷度，也没有瘤胃结构，所以“ ”，选择了其它动物不吃的食物种类，也出现了一些与进食、消化有关的基因突变，形成了独特的食性——将箭竹作为主食。填入画横线部分最恰当的一项是：","options":["扬长避短","顺水推舟","因陋就简","另辟蹊径"],"answer":"D","explanation":"行政执法/地市级-逻辑填空题。根据“选择了其它动物不吃的食物种类”及“形成了独特的食性”，可知，表示大熊猫吃其他动物不吃的，即与众不同的东西，D 项“另辟蹊径” 比喻另创一种新风格或另找一个新途径、新方法，符合文意；A 项“扬长避短”意思是发挥或发扬优点或有利条件，克服或回避缺点或不利条件。B 项“顺水推舟”比喻顺着某个趋势或某种方式说话办事。C 项“因陋就简”多指利用原有的简陋条件办事。均不体现“新”，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-039","paperId":"gk2025-xz","num":39,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"习近平总书记关于党的自我革命的重要思想，强调坚持真理，坚守马克思主义政党的性质宗旨，谋根本、谋大利；强调修正错误，不讳疾忌医、不，及时发现和解决自身存在的问题；强调，不断深化对党的自我革命的规律性认识，把党的自我革命的思路举措搞得更加严密，蕴含着党在革故鼎新、守正创新中实现自身跨越的完整逻辑。依次填入画横线部分最恰当的一项是：","options":["文过饰非与时俱进","矫枉过正实事求是","避重就轻学以致用","掩耳盗铃脚踏实地"],"answer":"A","explanation":"行政执法-逻辑填空题。第一空根据“不讳疾忌医、不________”可知，空格处与“讳疾忌医”并列，“讳疾忌医”指怕人知道有病而不肯医治，比喻掩饰缺点，不愿改正。空格处也应体现在修正错误的过程中掩饰缺点，不想改正的意思。A 项“文过饰非”指用漂亮的言词掩饰自己的过失和错误。D 项“掩耳盗铃”比喻自己欺骗自己，两项均符合文意；B 项“矫枉过正”比喻纠正偏差超过了应有限度。强调过度纠正错误，而不是掩饰缺点，不符合文意，排除；C 项“避重就轻”指避开困难的而拣容易的事来做，也指回避主要的方面，只谈次要的方面，强调“主要和次要”，而不是“错误”，排除；第二空根据“蕴含着党在革故鼎新、守正创新中实现自身跨越的完整逻辑”可知，强调要创新、进步，A 项“与时俱进”指随着时代推移而不断发展、前进。能体现创新和进步，符合文意；D 项“脚踏实地”比喻做事踏实，认真，无法照应“创新和进步”，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-040","paperId":"gk2025-xz","num":40,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"此前，司法机关获取救助线索主要靠人工摸排，这存在一定的、被动性。为此，司法机关尝试运用大数据，主动发现救助线索，实现“应救尽救、应救即救”，同时衔接社会救助力量，构建多元帮扶机制，提供救助，切实解决了一些困难群体急难愁盼的问题。依次填入画横线部分最恰当的一项是：","options":["片面性一揽子","滞后性全方位","偶然性一站式","局限性全天候"],"answer":"B","explanation":"行政执法-逻辑填空题。第一空根据“司法机关获取救助线索主要靠人工摸排，这存在一定的________、被动性”可知，强调人工摸排发现线索不够主动，也无法发现所有线索，所以“片面性”“滞后性”“偶然性”“局限性”均可符合文意，辨识度不高；第二空根据“构建多元帮扶机制”可知，表示“多元、全面”之意，B 项“全方位”指各方面都包括在内，符合文意；A 项“一揽子”指将多个相关事物或问题一起处理或解决，强调的是纵向的链条式解决机制，将多个要素集合在一起的整体性，而文段强调横向的范围广，侧重覆盖各个方面，不符合文意，排除；C 项“一站式”指一个地点就能解决所有问题，侧重“地点”，与文意无关，排除；D 项“全天候”指每天24 小时不受限制的，侧重“时间”，与文意无关，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-041","paperId":"gk2025-xz","num":41,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"政府机关作为法律授权履行公共职责的部门，承担广告监管职责，但网络平台企业也应参与网络广告的治理。法律规定，互联网平台经营者在提供互联网信息服务过程中应当采取措施防范、制止违法广告，将网络平台视为违法广告的“ ”，要求其扮演“协同监管者”的角色。依次填入画横线部分最怡当的一项是：","options":["责无旁贷清道夫","义不容辞责任田","当仁不让防火墙","自不待言过滤网"],"answer":"D","explanation":"行政执法-逻辑填空题。第一空根据“法律授权履行公共职责的部门”可知，表示承担广告监管职责是政府机关“应做之事”，B 项“义不容辞”指道义上不容许推辞、拒绝。C 项“当仁不让”遇到应该做的事就积极主动去做，不推让。D 项“自不待言”大家心里明白，不必再用言语解释。三项均符合文意；A 项“责无旁贷”自己的责任不能推卸给别人。多用于指自己应当做的不可推卸的事。意思虽可，但是语法上“责”与前文的“职责”重复，排除；第二空根据“但网络平台企业也应参与网络广告的治理”“协同监管者”可知，网络平台起到广告监管的辅助作用，语义应该较轻，D 项“过滤网”指流体通过滤网，把所含的固体颗粒或有害成分分离出去。能体现网络平台对违法广告进行防范、筛选的意思，符合文意；B 项“责任田”原指将村集体所有耕地承包给农户，由农户自己负责耕种和管理，但不能随意买卖和挪作使用的田地，引申义为需要负责的任务或工作。填入空格后表示违法广告变成了网络平台的责任田，违法广告会生长的更好，与文意矛盾，排除；C 项“防火墙”原指房屋之间用来防止火情蔓延的墙，后也指是用来阻断计算机不安全网络因素以保护用户资料与信息安全性的一种技术。包含完全防止、阻断的含义，语义过重，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-042","paperId":"gk2025-xz","num":42,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"党的规模大了，一些人容易出现搞小山头、小圈子、小团伙现象，容易出现、自行其是问题，破坏党的团结统一，影响党的凝聚力战斗力。随着改革开放逐步深入，社会利益多元化、思想多样化也深刻影响到党员、干部的观念和行为。我们必须在重大问题、严峻形势面前始终心往一处想、劲往一处使，做到凝心聚力、，确保全党紧密团结在党中央周围，步调一致向前进。依次填入画横线部分最恰当的一项是：","options":["分崩离析群策群力","南辕北辙和衷共济","尾大不掉众志成城","阳奉阴违同仇敌忾"],"answer":"C","explanation":"行政执法/地市级-逻辑填空题。第一空根据“破坏党的团结统一，影响党的凝聚力战斗力”，并且与“自行其是”并列，可知，此空强调不考虑别人意见、自己做自己的，破坏团结的意思，C 项“尾大不掉”比喻机构庞大，指挥不灵。D 项“阳奉阴违”指玩弄两面派手法，表面上遵从，暗地里违背。这两项都能体现破坏团结、影响凝聚力战斗力的含义，符合文意。 A 项“分崩离析”形容国家或集团四分五裂，不可收拾，根据文段的开头主语为“党的规模”，可知分裂瓦解的语义太重，排除；B 项“南辕北辙”指想往南而车子却向北行，比喻行动和目的正好相反，文段未提及“行动和目的”的关系，排除；第二空根据“凝心聚力、________”可知，此空应该“凝心聚力”并列，表示团结一致的意思，C 项“众志成城”比喻大家团结一致，就能克服困难，得到成功，符合文意；D 项“同仇敌忾”指全体一致痛恨敌人。文段没有提到 “痛恨敌人”，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-043","paperId":"gk2025-xz","num":43,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"要提高“临事能断”本领，就要处理好反复权衡与适时决断的关系，既要深入考量、三思而行，又要视情而断、当机立断，不能等待观望、、议而不决。当然，提倡在关键时刻善于决断，并不意味着可以、我行我素，而是要善于聚民意、集众智，推动科学决策。依次填入画横线部分最恰当的一项是：","options":["犹豫不决泥古不化","左顾右盼听之任之","举棋不定刚愎自用","见风使舵自作主张"],"answer":"C","explanation":"行政执法/省部级-逻辑填空题。第一空根据“又要视情而断、当机立断，不能等待观望、________、议而不决”可知，空格处应该与“视情而断、当机立断”为反向并列，与“等待观望”、“议而不决”为正向并列关系，表示不果断的意思。A 项“犹豫不决”指拿不定主意。 B 项“左顾右盼”指向左边看看，又向右边看看，表示对周围的人或事物打量或窥探的样子，也形容顾虑重重、犹豫不决的样子。C 项“举棋不定”比喻犹豫不决，拿不定主意。三项均符合文意；D 项“见风使舵”比喻看势头或看别人的眼色行事。无法体现不果断的意思，排除；第二空根据“________、我行我素”可知，与“我行我素”并列，表示不管别人意见，只按照自己想的来做，C 项“刚愎自用”指十分固执自信，不考虑别人的意见，符合文意。A 项“泥古不化”指拘泥于古代的成规或古人的说法而不知变通。文段未提及“古法”，排除；B 项“听之任之”指任凭事物存在发展而不去过问，体现的是不过问，而不是不管别人意见，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-044","paperId":"gk2025-xz","num":44,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"能量的产生和使用不一定。可再生能源发电如风力发电、太阳能发电等，会因为天气、季节、地理位置的不同，存在不同时间尺度的间歇性，而用电需求也有，时多时少。低成本大规模的储能系统可以突破可再生能源“即发即用、不能存储”的瓶颈，显著提高风、光等可再生能源的消纳水平。依次填入画横线部分最恰当的一项是：","options":["同步波动性","协调机动性","平衡规律性","匹配差异性"],"answer":"A","explanation":"行政执法/地市级-逻辑填空题。第一空根据“可再生能源发电如风力发电、太阳能发电等，会因为天气、季节、地理位置的不同，存在不同时间尺度的间歇性，而用电需求也有________，时多时少。”可知第一空强调能力的产生和使用不一定完全意义对应，“同步”“协调”“平衡”“匹配”均符合文意，无辨识度；第二空根据“时多时少”可知，表示“不稳定”的意思， A 项“波动性”指像水波一样变动，符合文意；B 项“机动性”侧重“灵活”，不符合文意，排除； C 项“规律性”侧重“稳定”，不符合文意，排除；D 项“差异性”侧重“不同”，属于横向对比，不符合文意，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-045","paperId":"gk2025-xz","num":45,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“南橘北枳”是的自然规律。一些植物美则美矣，但只能生活在特定的自然环境中。某些地区不顾本地条件，只想迅速复制网红景观，画虎不成反类犬。一个地区的山水林田湖草是生命共同体，人为“改弦更张”，可能破坏生态平衡，到头来。依次填入画横线部分最恰当的一项是：","options":["颠扑不破得不偿失","显而易见后患无穷","众所周知一无所有","毋庸置疑贻笑大方"],"answer":"A","explanation":"行政执法/省部级-逻辑填空题。第一空根据“南橘北枳”可知，这个自然规律是每个人都知晓的，所以第一空四个选项均可符合文意，无辨识度；第二空根据照应“可能破坏生态平衡，到头来________。”强调最终“结果很差”的意思，A 项“得不偿失”指所得的利益抵偿不了所受的损失，体现得到了网红景观，但失去了生态平衡，符合文意；B 项“后患无穷”指今后的祸害及忧患没有穷尽。根据“到头来”可知已经到了最终结果，没有“后患”的语境，排除；C 项“一无所有”指什么也没有。语义太重，排除；D 项“贻笑大方”指让内行人笑话。文段没有提到“内行人”，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-046","paperId":"gk2025-xz","num":46,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"各国正逐步形成以无人机、巡航导弹、弹道导弹、轰炸机等为主力的高效空袭体系，可以实现对目标空域的饱和袭击。这让只能命中单一目标的防空导弹陷入的境地。面对复杂多样的战场威胁，防空导弹不再，而是“攥指成拳”，朝着防空导弹系统升级转变。依次填入画横线部分最恰当的一项是：","options":["腹背受敌各自为战","鞭长莫及形单影只","捉襟见肘故步自封","孤掌难鸣单打独斗"],"answer":"D","explanation":"行政执法/地市级-逻辑填空题。第一空根据“饱和袭击”、“这让只能命中单一目标的防空导弹陷入________的境地”可知，强调目前空袭体系的类型很多，但是防空导弹命中的目标却很少，体现“应付不过来”的意思，C 项“捉襟见肘”指顾此失彼，穷于应付。D“孤掌难鸣”指孤立无助，不能成事。两项均符合文意；A 项“腹背受敌”指前后受到敌人的夹击。文段未体现防空导弹遭受别人攻击，而是体现防空导弹去命中别人，不符合文意，排除；B 项“鞭长莫及”比喻因距离太远而无能为力。文段没有体现“距离远近”，排除；第二空根据“防空导弹不再________，而是‘攥指成拳’”可知，考查反向并列，“攥指成拳”是手指头攥紧才能变成拳头，才能打人有力。比喻心往一处想，力往一处使，事情才能办成。所以空格处应体现单独作战的意思。D 项“单打独斗”指独自一个人自己去打斗、做事，符合文意；C 项“故步自封”指因循守旧，安于现状，不求创新进取。不符合文意，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-047","paperId":"gk2025-xz","num":47,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"再严明的纪律，不执行、不遵守、不维护，也是。从一些违反党纪党规的言行看，有不认真学习造成的情况，更有的情况。有的把政治规矩置于脑后，把党的纪律要求，毫无自我约束。纪律不是可松可紧的橡皮筋，不是可有可无的空摆设。依次填入画横线部分最恰当的一项是：","options":["事与愿违敷衍了事视而不见","徒劳无功混淆是非本末倒置","一纸空文明知故犯束之高阁","虚有其表有恃无恐弃如敝屣"],"answer":"C","explanation":"行政执法-逻辑填空题。第一空根据“再严明的纪律，不执行、不遵守、不维护，也是________”可知，空格处要表示纪律如果不执行、不遵守、不维护，也是无用的，C 项“一纸空文”指只是写在纸上没有兑现或不能兑现的东西。D 项“虚有其表”意思是空有好看的外表，实际上不行，指有名无实。两项均符合文意；A 项“事与愿违”意思是事情的发展与愿望相反。侧重结果与期望不符，横线强调纪律不执行就形同虚设，并非强调结果与期望的关系，且空格的主语是“纪律”，不能搭配为“纪律事与愿违”，不符合文意，排除；B 项“徒劳无功” 指白白付出劳动而没有成效，文段没有“徒劳”的语境，不符合文意，排除；第二空根据“有不认真学习造成的情况，更有________的情况”可知，与“不认真学习”构成递进关系，语义更重，C 项“明知故犯”指明明知道不能做，却故意违犯，符合文意；D 项“有恃无恐”指因有所依仗而毫不害怕。文段没有“依仗”的对应点，不符合文意，排除；第三空带入验证，把党的纪律要求“束之高阁”，强调把党的纪律指弃之不用或置之不理，符合文意。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-048","paperId":"gk2025-xz","num":48,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"借鉴各地耕保的好经验、好做法，可以少走弯路，但不可将借鉴当作。比如，平原地区的耕地恢复方法不一定适合山区，粮食主产区与主销区可能。有些经验做法依托的是当地经济基础和民风社情，外地可能“借”不来也“学”不好，盲目推广可能导致、劳民伤财。依次填入画横线部分最恰当的一项是：","options":["套用背道而驰功亏一篑","照搬大相径庭水土不服","复制截然不同物极必反","效仿天差地别弄巧成拙"],"answer":"B","explanation":"行政执法/地市级-逻辑填空题。第一空根据“借鉴各地耕保的好经验、好做法，可以少走弯路，但不可将借鉴当作________”可知，此空要表示可以借鉴，但是不能照抄的意思，四个选项均可符合文意，无辨识度；第二空根据“平原地区的耕地恢复方法不一定适合山区，粮食主产区与主销区可能________”可知，此空表示粮食主产区与主销区可能“有区别” 的意思，B 项“大相径庭”比喻彼此相差很远，大不相同，符合文意；A 项“背道而驰”比喻彼此方向目标完全相反；C 项“截然不同”事物之间，界限分明，全然不一样；D 项“天差地别” 形容两种或多种事物之间的差距很大，就像天和地之间的距离一样。文段措辞为“可能”，所以这三项的词语语义过重，排除；第三空带入验证，强调盲目推广可能导致结果不符合当地情况，B 项“水土不服”指对于一个地方的气候条件或饮食习惯不能适应，符合文意。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-049","paperId":"gk2025-xz","num":49,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"循环肿瘤细胞是早期癌症诊断的重要临床标志物，但其数量仅占正常血细胞量的十亿分之一。想要找到它，可谓。新近研制出的多功能仿生柔性膜，拥有“火眼金睛”，可 “生擒”循环肿瘤细胞，还有媲美人体环境的仿生机制，能将细胞地带回，实现对癌症的分子分型诊断。依次填入画横线部分最恰当的一项是：","options":["大海捞针准确毫发无损","雾里看花直接严丝合缝","异想天开迅速轻而易举","无从下手巧妙完好无缺"],"answer":"A","explanation":"行政执法/省部级-逻辑填空题。第一空根据“其数量仅占正常血细胞量的十亿分之一”，体现找到它非常困难，而且具有数量上多和少的含义，A 项“大海捞针”意思是在大海里捞一根针，比喻极难找到，“大海”照应正常血细胞，“针”对应数量极少的“循环肿瘤细胞”，符合文意；B 项“雾里看花”形容对事物的本质或真相看不清楚。侧重看不清楚，不符合文意，排除；C 项“异想天开”形容想法离奇，不切实际。侧重想法离奇。不符合文意，排除；D 项“无从下手”指事物头绪纷繁或防范极其严密，没有办法着手办理。没有数量上多和少的语境，不符合文意，排除；第二空代入验证，体现“火眼金睛”可精准识别循环肿瘤细胞，第三空带入验证，体现多功能仿生柔性膜能将细胞完整带回，均符合文意。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-050","paperId":"gk2025-xz","num":50,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"新质生产力既需要政府超前规划引导、科学政策支持，也需要市场机制调节、企业等微观主体不断创新，是政府“有形之手”和市场“无形之手” 培育和驱动形成的。因此，要深化经济体制、科技体制等改革，着力打通新质生产力发展的堵点卡点，建立高标准市场体系，创新生产要素配置方式，让各类先进优质生产要素向发展新质生产力流动。依次填入画横线部分最恰当的一项是：","options":["联合羁绊竞相","系统制约自由","有序妨碍高效","共同束缚顺畅"],"answer":"D","explanation":"行政执法-逻辑填空题。第一空根据“新质生产力既需要政府超前规划引导、科学政策支持，也需要市场机制调节、企业等微观主体不断创新”可知，强调政府和市场“两者合力” 的意思，A 项“联合”指联系使不分散、结合。B 项“系统”指同类事物按一定的秩序和内部联系组合而成的整体，也形容有条理、有顺序。D 项“共同”指属于大家的，彼此都具有的。三项均符合文意；C 项“有序”指有秩序。侧重有条理，而文段并没有体现政府和市场谁先谁后的次序，不符合文意，排除；第二空根据“打通________新质生产力发展的堵点卡点”可知，此空表示“限制”的含义，A 项“羁绊”指缠住了不能脱身，束缚。B 项“制约”表示限制和约束， D 项“束缚”意思是缠绕捆绑，比喻拘束或限制。三项均符合文意；第三空根据“打通堵点卡点”可知，此空强调毫无阻碍之意，D 项“顺畅”意思是顺利流畅，没有阻碍，符合文意；A 项 “竞相”意思是争相，互相争着（做）。侧重相互竞争、你追我赶的态势，不符合文意，排除； B 项“自由”意思是无拘无束，不规定方向，而文段并不是随意流动的，是具有流动的方向的，即“向发展新质生产力”流动，所以不符合文意，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-051","paperId":"gk2025-xz","num":51,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"如果一味沉湎于琐碎的日常事务，缺乏大局观念和政治远见，不分轻重缓急，不从原则高度想问题，就会陷入事务主义。习近平总书记指出：“如果忙忙碌碌，只是机械做事，陷入事务主义，是很难提高认识和工作水平的。”这就意味着，要提高认识水平，必须走出事务主义的泥潭。毛泽东曾经指出：“庸俗的事务主义家不是这样，他们尊重经验而看轻理论，因而不能通观客观过程的全体，缺乏明确的方针，没有远大的前途，沾沾自喜于一得之功和一孔之见。”这为如何走出事务主义提供了指南针和路线图。这段文字认为，为避免陷入事务主义，应该：","options":["具有清晰明确的工作方案","坚持从理论高度看待问题","不断从实践中总结经验教训","通过学习补齐能力素质短板"],"answer":"B","explanation":"行政执法/省部级/地市级-主旨概括题。第一句通过“如果……就”提出反面论证，指出不能没有大局观和政治远见，要从原则高度想问题；第二句通过习近平总书记的话进行援引，第三句通过代词“这就意味着”提出抽象对策，要提高认识水平，必须走出事务主义的泥潭；第四句通过毛泽东同志的语言给出具体对策：即不能看轻理论，不能不通观全局，不能只沾沾自喜于一得之功和一孔之见，即要“重视理论”，具有“大局高度”。最后一句提出，这为如何走出事务主义提供了指南针和路线图，继续强调走出事务主义的对策。所以找“这” 指代的内容，在前文，即要“重视理论”，具有“大局高度”，B 项符合文意；A 项“工作方案”、 C 项“从实践中总结经验教训”、D 项“通过学习补齐能力素质短板”；文段均未提及，无中生有，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-052","paperId":"gk2025-xz","num":52,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"“足国之道，节用裕民，而善臧其余。”党政机关过紧日子不是一时之需、权宜之策，而是一贯的、长期的、常态化的工作要求。一个国家可调配的资源总量是有限的，唯有坚持该花的花、该省的省，才能集中财力办大事，把更多真金白银用于发展紧要处、民生急需上。一路走来，艰苦奋斗、勤俭节约始终是我们党的优良作风，也是我们党不断发展壮大的重要保证。“党和政府带头过紧日子，目的是为老百姓过好日子”。这本国之大账，是民生大账，亦是民心大账。这段文字是一篇文章的开头，最适合做文章标题的是：","options":["节用裕民，“过紧日子”算的是国之大账","严格落实党政机关“过紧日子”的要求","在“过紧日子”中诠释忠诚干净担当","落实落细，把“过紧日子”的要求贯穿始终"],"answer":"A","explanation":"行政执法/省部级-标题填入题。文段第一句通过援引，强调国家节约是为了人民，第二句提出党政机关过紧日子是一贯的、长期的、常态化的工作要求；第三句通过“唯有” 提出对策，表示要把国家财力用在民生所需上，第四句继续表述勤俭节约对于我党发展壮大的重要性，第五句援引，强调过紧日子是为了老百姓，最后一句通过“这”宏观指代，提出文段重点，强调党政机关过紧日子是民心大账；所以文段的重点，强调过紧日子，勤俭节约都是为了民生，A 项符合文意；B 项体现了过紧日子的对策，但未体现“为了人民”的目的，不如A 项完整，排除；C 项“诠释忠诚干净担当”，无中生有，排除；D 项体现了过紧日子的对策，但未体现“为了人民”的目的，不如A 项完整，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-053","paperId":"gk2025-xz","num":53,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"定向能武器是通过定向发射高能激光束、电磁波束、高能粒子束等对目标发起直接攻击的武器。低空无人机飞行速度慢、尺寸小、雷达散射面窄、红外特征弱，普通防空系统难以及时发现和截获，而定向能武器则可利用强激光点杀伤与高功率微波面覆盖相互配合，在低空近程区形成密集拦截网，应对无人机“蜂群”的压制。无人机“蜂群”高度依赖高敏传感器和无线通信设备，飞行越低、密度越大，导航和控制系统越易受外界干扰。此时，定向能武器对其稍加影响，使其联合作战能力受限，即可快速实现对无人机“蜂群”的杀伤。这段文字主要介绍了定向能武器：","options":["在无人化战争中的作战模式","应对无人机“蜂群”的制胜机理","实现低空作战的基本原理和核心技术","具有超越普通防空系统的特点和优势"],"answer":"B","explanation":"行政执法/省部级-主旨概括题。第一句提到“定向能武器”的定义，第二句提到“低空无人机”由于自身特性所以很难发现和拦截，但是“定向能武器”可以有效应对无人机“蜂群”的压制，第三句提到“无人机”容易受到外界干扰，所以“定向能武器”也可以利用这个特性，快速实现对无人机“蜂群”的杀伤。所以整个文段为分分结构，概括而言均描述了“定向能武器”对于无人机“蜂群”的打击，B 项符合文意。A 项文段核心话题为“无人机蜂群”，“无人化战争”偏离重点，排除；C 项“低空作战”、D 项“普通防空系统”均未涉及文段核心话题“无人机蜂群”，且仅对应文段前半部分，表述片面，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-054","paperId":"gk2025-xz","num":54,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"合唱发端于公元6世纪的西方古典音乐，并于20世纪初以“学堂乐歌”的方式传入中国。作为一种高度专业化的多声部声乐类别，其千百年来一直在追求创作与演唱技术的发展与精进。过去相当长的时间内，中国的室内合唱更多在音乐专业领域内，或是有一定知识储备的文化圈内开展艺术实践与鉴赏，与普通老百姓的欣赏层面尚有距离，使其推广受到限制。近年来，随着一批合唱团与合唱作品的“改良下沉”，这一艺术形式逐渐亲民，其厚重的古典传统不断被注入轻盈的流行时尚气息，“跨界”属性使合唱频频突破专业视野，吸引大众目光。这段文字意在说明：","options":["室内合唱和传统合唱存在技术差别","流行音乐为合唱艺术注入了新活力","合唱艺术呈现出亲民化发展趋势","合唱艺术由重技术向重形式转变"],"answer":"C","explanation":"行政执法/省部级-意图判断题。第一句话提出了“合唱”的历史来源，第二句提到“合唱”不仅历史悠久，也在不断的发展，第三句提出过去“合唱”与普通老百姓的欣赏层面尚有距离，第四句提到近年来，随着一批合唱团与合唱作品的“改良下沉”，这一艺术形式逐渐亲民。“过去”和“近年来”属于古今对比，强调后者，所以文段的重点在强调合唱这一艺术形式逐渐亲民，C 项符合文意。A 项文段未介绍“室内合唱和传统合唱存在技术差别”，无中生有，排除；B 项文段只提到合唱被注入流行时尚气息，但没说是“流行音乐”为合唱艺术注入新活力，排除；D 项文段未指出合唱艺术转变为“重形式”，无中生有，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-055","paperId":"gk2025-xz","num":55,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"随着互联网的发展，网络空间中出现了许多“声音工作者”，以生产解说、配音等相关的数字产品为生。然而，随着技术发展，模仿人声用 AI 生产内容逐渐普及，不仅一些具有辨识度的名人声音被滥用，许多“声音工作者”的声纹信息也遭遇侵权风险。民法典规定，对自然人声音的保护参照适用肖像权保护的有关规定。所以，声音权即声音的可辨识性，具有人格属性，可以作为一项人格权益保护的条件。任何自然人的声音均应受到法律的保护，未经许可，擅自使用、许可他人使用录音制品中的声音，构成侵权。这段文字主要介绍了:","options":["声音权侵权行为构成要件的法律规定","应用 AI 技术模仿人声存在侵权风险","“声音工作者”职业发展中的权益危机","技术发展给人格权益保护带来挑战"],"answer":"A","explanation":"行政执法-主旨概括题。文段第一句通过“随着”提出背景，提出网络出现了“声音工作者”和“声音产品”，第二句通过“然而”提出问题，有些“声音工作者”遭遇侵权风险，第三句援引《民法典》提出对于自然人声音也应该保护，第四句通过“所以”引导重点：声音权即声音的可辨识性，具有人格属性，可以作为一项人格权益保护的条件。任何自然人的声音均应受到法律的保护，未经许可，擅自使用、许可他人使用录音制品中的声音，构成侵权。文段为分总结构，文段重点在最后的结论，强调从法律的角度论述了有关声音侵权的行为，A 项符合文意，A 项的意思即，法律规定，什么行为算声音权侵权。B 项“侵权风险”，对应结论前，非重点，且没有“法律”主体，排除；C 项“声音工作者职业权益危机”，对应结论前，非重点，且没有“法律”主体，排除；D 项没有“声音”主体，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-056","paperId":"gk2025-xz","num":56,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"足够的执法权限是基层治理高效运行的必要条件。权限不足，可能导致基层执法需求与实际权力配置之间存在较大张力，让基层治理陷入“看得见的管不着”的低效治理困境；但权限如果过度下放，又可能出现“接不住、管不好”的现象。因此，一方面需要进一步完善执法目录动态调整机制和制度，确保执法职能精准划转、行政职权科学配置；另一方面需要加快完善基层执法事项基准库，建立基层执法事项指导目录，确保执法事项在基层供需精准对接、有效贯通执行、全面落实落细。这段文字意在强调，基层治理应：","options":["重视“基层执法”，提升基层执法服务效果","围绕“精准赋权”，科学动态调整执法权属","加快“权限下放”，精准对接基层执法需求","调整“执法目录”，落实落细基层执法事项"],"answer":"B","explanation":"行政执法-意图判断题。第一句话提到足够的执法权限对于“基层治理”的重要性，第二句通过两个分句具体解释了权限过低或过大都会存在问题，第三句通过结论词“因此” 强调重点，如何让权力下发的更合理的对策：一方面需要进一步完善执法目录动态调整机制和制度；另一方面需要加快完善基层执法事项基准库，建立基层执法事项指导目录；所以文段为分总结构，重点在最后的对策，概括而言，即要合理赋权，科学动态调整执法权利，B 项符合文意。A 项没有提到主体“执法权限”，排除；C 项“权限下放”只能对应结论前一部分内容，文段还提到了权限不能过分下放的问题，非重点，排除；D 项“执法目录”，仅对应对策中“另一方面”内容，表述片面，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-057","paperId":"gk2025-xz","num":57,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"。农药、化肥和农膜污染是主要的农业面源污染源，在不同程度上影响着耕地生态水平，近年来，在一系列农业绿色发展政策的支持下，农药、化肥和农用塑料薄膜使用量大幅下降，农业面源污染情况持续改善。耕地对于气候调节、水源涵养、生物多样性保护具有重要意义，因此推动耕地高质量保护，提升农田生态系统的稳定性是题中应有之义。目前，一些地方全力打造生态高标准农田，采用“稻田+生态沟渠+水塘/生态塘”等治理模式，不仅有效实现了稻田主要面源污染物的减少，还推动了乡村游等生态产业发展。填入画横线部分最恰当的一项是：","options":["践行绿色生态理念，强化耕地生态功能","多举措全面发力，推动耕地高质量保护","落实耕地保护政策，夯实粮食安全根基","加强农业生态投资，助力生态产业发展"],"answer":"A","explanation":"行政执法-语句衔接题。横线居首，总起后文。横线后第一句先指出在一系列农业绿色发展政策下，农业面源污染情况持续改善；第二句介绍耕地在生态方面的意义，并通过 “因此”强调：提升耕地高质量保护，提升农田生态系统的稳定性非常重要；第三句通过一些地方的具体案例进行举例说明前文的观点。所以后文的重点在强调，要提升耕地生态水平，提升农田生态系统的稳定性，即强调“耕地”和“生态”两个话题，对应A 项。B 项“耕地高质量保护”，只体现了对耕地本身的保护，缺少“生态”话题，排除；C 项“夯实粮食安全根基”，无中生有，排除；D 项“加强农业生态投资”，无中生有，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-058","paperId":"gk2025-xz","num":58,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"从本质上看，量子雷达成像的原理与传统雷达一致，都是对电磁场携带信息的提取，但二者获取物体信息的物理机制不同，传统成像技术建立在电磁场的确定性理论模型之上，利用电磁场的一阶关联信息，通过记录辐射场的光强或相位分布获取物体的图像信息；而量子成像技术则建立在电磁场的量子统计不确定性理论之上，利用了电磁场的高阶关联信息，通过辐射场分布的强度、相位的空间统计特性获得物体图像信息，因而量子雷达可以获得超越传统雷达系统衍射极限的成像分辨能力。这段文字无法解释下列哪一问题：","options":["量子成像技术是如何获得物体图像信息的","传统成像技术与电磁场的确定性理论模型有何关系","量子雷达成像分辨能力为何可以超越传统雷达","量子雷达与传统雷达的发射信息载体有何不同"],"answer":"D","explanation":"行政执法-细节理解题。 A 项根据“而量子成像技术则建立在电磁场的量子统计不确定性理论之上，利用了电磁场的高阶关联信息，通过辐射场分布的强度、相位的空间统计特性获得物体图像信息”可知，文段进行了解释； B 项根据“传统成像技术建立在电磁场的确定性理论模型之上……获取物体的图像信息”可知，文段进行了解释； C 项根据“而量子成像技术则建立在电磁场的量子统计不确定性理论之上，利用了电磁场的高阶关联信息，通过辐射场分布的强度、相位的空间统计特性获得物体图像信息，因而量子雷达可以获得超越传统雷达系统衍射极限的成像分辨能力”可知，文段进行了解释，排除； D 项文段未提及量子雷达与传统雷达在发射信息载体上的不同，无中生有，文字并未进行具体解释。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-059","paperId":"gk2025-xz","num":59,"year":2025,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"知识产权相关法律的立法宗旨不仅在于保护私权，而且在于促进科技进步、文化繁荣和经济社会发展，维护公平合理的市场竞争秩序。因此，知识产权纠纷的解决经常涉及社会公共利益。许多知识产权案件涉及复杂技术问题和疑难法律问题，且尚无明确的法律规则可以遵循，故通常审理难度较大。人民法院案例库中的知识产权参考案例所体现的裁判规则，明确案件的审理思路、裁判逻辑与法律适用，可以有效解决“同案不同判”的司法难题。这段文字接下来最可能讲的是：","options":["知识产权案件审判工作难度较大的各种原因","进一步优化人民法院案例库建设的主要思路","案例库建设对提升案件审判质效的重要意义","知识产权参考案例指导司法审判的具体实践"],"answer":"D","explanation":"行政执法-文段推断题。下文推断类。观察尾句提出对策：人民法院案例库中的知识产权参考案例，可以有效解决“同案不同判”的司法难题。接下来应围绕对策进行详细论述，对应D 项，既提到了“知识产权参考案例”，也提到了“指导司法审判”符合文意。A 项“审判工作难度较大的各种原因”，为前文论述过的内容，后文不会再论述，排除；B 项“人民法院案例库”，C 项“案例库”；均为话题扩大，尾句核心话题是“知识产权参考案例”，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-060","paperId":"gk2025-xz","num":60,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"近百年来，对于天然气水合物的研究通常是保压取样后在实验室进行，或在耐压舱中模拟水合物的形成分解。但由于深海与海面之间压力和温度的差异，在样品回收过程中，天然气水合物的一些性质会被破坏，实验室的模拟舱也很难还原深海复杂的环境条件。拉曼光谱技术能在深海原位环境中对天然气水合物进行直接研究。在这项技术中，激光通过光纤系统传输到深海，并与待测样品发生拉曼散射，通过采集和分析散射光谱，可获得样品组分、结构和理化性质等信息。这段文字没有提及：","options":["在实验室模拟舱研究天然气水合物的弊端","拉曼光谱技术对研究天然气水合物的优势","深海环境对应用拉曼光谱技术的限制","天然气水合物样品性质被破坏的原因"],"answer":"C","explanation":"行政执法-细节理解题。 A 项根据“但由于深海与海面之间压力和温度的差异，在样品回收过程中，天然气水合物的一些性质会被破坏，实验室的模拟舱也很难还原深海复杂的环境条件”可知，文段有提及，排除； B 项根据“在这项技术中，激光通过光纤系统传输到深海，并与待测样品发生拉曼散射，通过采集和分析散射光谱，可获得样品组分、结构和理化性质等信息”可知，文段有提及，排除； C 项“深海环境对应用拉曼光谱技术的限制”，无中生有，文段没有提及； D 项根据“由于深海与海面之间压力和温度的差异，在样品回收过程中，天然气水合物的一些性质会被破坏”可知，文段有提及，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-061","paperId":"gk2025-xz","num":61,"year":2025,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①绝缘问题已不是一般材料的简单组合和简单工艺所能解决，而需要有一些特定性能的材料，针对具体的绝缘要求做成特定形式的结构才能适应需要 ②随着技术发展，社会对电工产品的经济效益和性能稳定性的要求不断提高，绝缘材料才从材料的大类里分离而出 ③在电工技术发展初期，电工产品对绝缘的要求不高，一般天然材料如棉、麻、丝等纤维，松香、石蜡等有机物质即可满足使用要求 ④这样一来，一批多功能的协和性组合绝缘结构得到了开发，绝缘技术也发展到了一个新的阶段 ⑤因而，当时没有专门用于绝缘的材料，也没有绝缘工艺和绝缘结构的概念 ⑥随着使用电压的不断提高，电工产品使用领域的扩展，环境因素对绝缘的影响越来越显著将以上6个句子重新排列，语序正确的一项是：","options":["②③⑤⑥④①","②③⑥⑤①④","③⑤②⑥①④","③⑤⑥②④①"],"answer":"C","explanation":"行政执法-语句排序题。观察首句，②句提到“随着技术发展，对电工产品要求提高，绝缘材料从大类分离”；③句提到“电工技术初期，对绝缘要求不高”；按照逻辑，应先描述③技术初期，再描述②技术发展，所以③更适合做首句，排除AB 项；观察CD 项， ③⑤一致，提到技术发展初期，电工产品对绝缘的要求不高，所以没有专门绝缘的材料和概念，观察③⑤后接②或⑥，语句逻辑均可成立，接着验证①④，观察发现，①提到“绝缘问题需要有一些特定性能的材料才能适应需要”，④提到“这样一来，一批多功能的协和性组合绝缘结构得到了开发”，逻辑上应该是先有需要，才会开发新材料，所以①在④前，排除D 项，验证C 项，验证后逻辑严密，语句通顺。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-062","paperId":"gk2025-xz","num":62,"year":2025,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①严格执法与公正司法是相辅相成的 ②加强行政执法与刑事司法衔接，是为了确保二者之间既能互不干扰，又能高效转换，从而更有力地实施法律 ③前端为后端减负、后端为前端增力，才能更好地让严格执法与公正司法共同发力，促进法律有效实施，保障社会公平正义 ④特别是在环境保护、食品安全等关系人民切身利益的重点领域，行政执法与刑事司法脱节会导致法律威慑力不足 ⑤习近平总书记指出，“要加强行政执法与刑事司法有机衔接，坚决克服有案不移、以罚代刑等现象。” ⑥严格执法位于前端，通过行政手段依法保障人民群众的生命财产安全；公正司法位于后端，定分止争，是公平正义的最后一道防线将以上6个句子重新排列，语序正确的一项是：","options":["①⑥⑤②④③","①②④⑤③⑥","⑤③⑥④①②","⑤⑥②③①④"],"answer":"A","explanation":"行政执法/地市级-语句排序题。观察首句，①句提到大概念“严格执法与公正司法”，⑤句提到小概念“行政执法与刑事司法”，并且为对策句，根据逻辑，应该大概念在前，小概念在后，①更适合做首句，看①后接⑥句还是②句，观察发现，A 项⑥句提到“严格执法位于前端”“公正司法位于后端”，同时观察发现③句也有“前端为后端减负、后端为前端增力”，但是⑥的逻辑在③的前面，也就是先⑥，后③，B 项不满足条件，排除，验证A 项，①提到“严格执法与公正司法是相辅相成的”，⑥句接着描述两者的关系，即“严格执法位于前端”“公正司法位于后端”，⑤通过援引习近平总书记的话，提出对策“要加强行政执法与刑事司法有机衔接”，②④③句接着提出“加强行政执法与刑事司法衔接”的意义，验证后逻辑严密，语句通顺。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-063","paperId":"gk2025-xz","num":63,"year":2025,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"由于缺乏现代的科学技术手段，古代的城市排水系统将依托地形、自流排水的理念贯穿在城市的规划和设计中。因此，。元朝时期，元大都的排水系统的规划设计与城市总体布局的规划设计同时进行，排水设施的建造先于或与城市道路、宫殿、城墙的建设同步，系统设计地下管网的高度差，充分发挥“水往低处流”的概念，使城市的内涝现象和污水溢出现象得到进一步缓解。元朝后，明清首都（北京）的排水格局也基本保持了元朝的设计。填入画横线部分最恰当的一项是：","options":["排水系统的设计也需要结合建筑的特点“量体裁衣”","城市排水的运行效率非常依赖工程人员对地势的把握","具备较完整的城市管网及排水体系是城市建设的关键","地下管网的功能主要聚焦在供水、排污、排涝等方面"],"answer":"B","explanation":"行政执法-语句衔接题。横线前出现“因此”可知需要总结前文，第一句话指出，古代排水主要靠地形、自流排水；横线后对于横线上的句子做解释，介绍元大都的排水系统在设计和建造时，利用了城市地势特点，发挥出“水往低处流”的效果；最后一句话做补充说明，强调元朝后，明清也采用了根据“城市地势”来进行排水的设计。所以横线前后均在论述城市地形对于城市排水工程的重要作用，横线处也应表达此意，B 项符合文意；A 项“需要结合建筑的特点量体裁衣”意思是建筑设计先行，排水设计靠后，可是根据“元大都的排水系统的规划设计与城市总体布局的规划设计同时进行，排水设施的建造先于或与城市道路、宫殿、城墙的建设同步”可知，排水的设计和建筑的设计要么是同时进行，要么要先于城市建筑设计，逻辑错误，排除；C 项偏离文段核心，文段强调“城市地形”对“排水系统”的影响，而不是强调“城市管网与排水系统”对“城市建设”的作用，排除；D 项没有体现“地形”对城市排水系统的影响，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-064","paperId":"gk2025-xz","num":64,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"相比高校和科研机构，企业处于市场最前沿，对有市场潜力的技术感知更灵敏，对产业发展趋势的把握也更敏锐。因此，在颠覆性技术的研发、转移转化过程中，需要强化企业科技创新主体地位。在课题立项中，要加快提升企业技术创新决策的主体地位，建立企业常态化参与国家科技创新决策的机制；在创新过程中，要着力强化企业科研组织的主体地位，支持领军企业聚焦国家重大需求，牵头组建创新联合体，加快形成企业主导的产学研深度融合。同时，人才、经费等创新要素也要加快向企业特别是科技领军企业集聚。这段文字意在说明：","options":["应着力完善国家科技创新决策的体制机制","颠覆性技术创新需重视并发挥企业的作用","要大力推进颠覆性技术的研发及转移转化","创新要素的大量积聚有助于企业技术创新"],"answer":"B","explanation":"行政执法/地市级-意图判断题。文段第一句提到企业的优势，第二句通过“因此” 做总结，并提出对策：在颠覆性技术的研发、转移转化过程中，需要强化企业科技创新主体地位；第三句、第四句通过“；”和“同时”作为并列句，从课题立项、创新过程以及创新要素三方面进行具体解释；故文段为分总分结构，强调应强化企业在颠覆性技术创新中的主体地位，B 项符合文意；A 项“国家科技创新决策的体制机制”，对应“课题立项”，属于分述部分，非重点，且缺少“企业”主体，排除；C 项表述抽象，缺少“企业”主体，排除；D 项“创新要素的大量积聚”，对应尾句，属于分述部分，非重点，排除；","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-065","paperId":"gk2025-xz","num":65,"year":2025,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"织纹螺主要分布于中国东南沿海，一般生活在近海礁石附近和泥沙底，自身并不产毒，其毒素来源于摄入的带毒海藻。织纹螺使人中毒的毒素主要是麻痹性贝类毒素，其中的石房蛤毒素是已知毒性最强的海洋生物毒素之一，它通过阻断神经细胞膜中的钠通道而引起麻痹，毒性是眼镜蛇毒的80倍；另外还有河豚毒素，这是自然界发现的毒性最强的神经毒素之一，其毒性比氰化钠还强1000多倍，0.5毫克即可致人死亡。这两种毒素的化学性质非常稳定，煮沸、盐腌、日晒等均不能将其破坏，所以吃上一颗织纹螺就可能致人死亡。这段文字没有解释下列哪一问题：","options":["河豚毒素的毒性为何比氰化钠更强","织纹螺携带的毒素是从哪里来的","石房蛤毒素是如何使人体麻痹的","为何加工过的织纹螺仍然含有毒素"],"answer":"A","explanation":"行政执法-细节理解题。 A 项根据“河豚毒素，这是自然界发现的毒性最强的神经毒素之一，其毒性比氰化钠还强1000 多倍，”可知，文段之提到河豚毒素的毒性比氰化钠更强，但未对河豚毒素的毒性为何比氰化钠更强作出解释，无中生有，选非题，保留； B 项根据“织纹螺主要分布于中国东南沿海，一般生活在近海礁石附近和泥沙底，自身并不产毒，其毒素来源于摄入的带毒海藻”可知，解释了织纹螺携带的毒素来自于带毒海藻，排除； C 项根据“其中的石房蛤毒素是已知毒性最强的海洋生物毒素之一，它通过阻断神经细胞膜中的钠通道而引起麻痹”可知，解释了石房蛤毒素是如何使人体麻痹的，排除； D 项根据“这两种毒素的化学性质非常稳定，煮沸、盐腌、日晒等均不能将其破坏，所以吃上一颗织纹螺就可能致人死亡”可知，解释了为何加工过的织纹螺仍然含有毒素，排除；数量关系","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-066","paperId":"gk2025-xz","num":66,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙3台收割机每小时均能收割2亩小麦，三台机器上午先后开始收割工作，12：00时甲收割的面积是乙的1.5倍，且比丙多收割6亩，16：00时3台收割机共收割了50亩，问乙是何时开始工作的：","options":["6：00","7：00","8：00","9：00"],"answer":"C","explanation":"数学运算-工程问题-其他类。根据题意可知，12：00 至16：00，3 台收割机均工作4 小时，共收割2×4×3=24 亩小麦，因此在12：00 之前3 台收割机收割50－24=26 亩小麦。设12：00 之前乙收割机工作了t 小时，根据题意可列式：2t×1.5+2t+（2t×1.5－6）=26，解得：t=4，即乙收割机在12：00 之前工作了4 小时，则乙是在8：00 开始工作的。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-067","paperId":"gk2025-xz","num":67,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙、丁四个部门共有210名员工，且甲部门员工数比丁部门多10人。现乙部门调动20名员工到丙部门且其剩余员工并入丁部门后，甲、丙、丁三个部门的员工数之比为3：3：4。问原乙部门有多少名员工：","options":["41","46","51","56"],"answer":"C","explanation":"数学运算-方程思想-一般方程（组）。设甲、乙、丙原有人数分别为x、y、z，根据题意，可列表如下：由于总人数不变，且此时“甲、丙、丁三个部门的员工数之比为3：3：4”，可得：x=210× =63， x+y－30=210× =84，由此可得y=51，则原乙部门有51 名员工。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-068","paperId":"gk2025-xz","num":68,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"张、王、李、赵4人的平均年龄为28岁，张、王的年龄之和比李大25岁，李、赵的年龄之和比张大27岁。已知张比王大2 岁，问他们4人中年龄最大的比最小的大几岁：","options":["5","6","3","4"],"answer":"B","explanation":"数学运算-时间问题-年龄问题。设张、王、李、赵4 人的年龄分别为a、b、c、d，根据题意，可列方程为：，解得：a=29，b=27，c=31，d=25。因此4 人中年龄最大的比最小的大31-25=6 岁。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-069","paperId":"gk2025-xz","num":69,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"将甲、乙两种设备各5件全部分配给A、B、C三个车间，要求每个车间分配两种设备至少各1件，A车间分配的设备总数比其他任一车间都多，B车间分配的甲设备多于乙设备，问有多少种不同的分配方式：","options":["3","6","12","24"],"answer":"A","explanation":"数学运算-排列组合问题-其他类。根据题意，符合要求的情况列表如下：综上，共有3 种不同的分配方式。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-071","paperId":"gk2025-xz","num":71,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"小张每周一到周四夜跑，周五到周日休息，已知某年2月他夜跑17次，3月夜跑19次，问4月他夜跑多少次：","options":["16","17","18","19"],"answer":"A","explanation":"数学运算-时间问题-星期日期问题。由题意可知，小张每周夜跑4 次，则任意连续的28 天（即连续的4 周）必夜跑4×4=16 次。若当年的2 月仅有28 天，则只能夜跑16 次，故当年的2 月必有29 天，且2 月29 日必须夜跑1 次。又3 月有31 天，后28 天必夜跑16 次，则前3 天还需夜跑19-16=3 次，即2 月 29 日-3 月3 日连续4 天夜跑4 次，则这4 天只能是周一至周四。最后4 月有30 天，前28 天夜跑16 次，又根据2 月29 日为周一可推出4 月的最后2 天分别为周五、周六，不夜跑。因此，4 月小张夜跑16 次。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-072","paperId":"gk2025-xz","num":72,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某种商品在定价基础上打八折销售，打折之前每天卖40件，开始打折第一天起，每天都比前一天多卖10件。打折销售15天的利润总额与打折之前销售20天的利润总额相同，问这种商品的成本是定价的：","options":["60%","64%","70%","75%"],"answer":"B","explanation":"数学运算-经济问题-基础经济。设该商品的成本为x，且赋值该商品的定价为10，根据题意可列表如下：由此可列式：800（10－x）=1800（8－x），解得：x=6.4。因此，这种商品的成本是定价的 6.4÷10=64%。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-073","paperId":"gk2025-xz","num":73,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某厂区如图所示，其中ABCD为矩形，ABEF为直角梯形，AB与DE相交于G点，其中阴影区域ADGF为涉密区域。已知 AD、AF、AB长度分别为240米、 150米、 100米，问涉密区域的面积为多少万平方米：","options":["1.2","1.3","1.4","1.5"],"answer":"A","explanation":"数学运算-几何问题-平面几何。如图所示，连接AE 两点，可构造新的△AEG。已知AB//EF，所以△AEG 和△AFG 的高相同且底相同，则二者面积比相等。因此，阴影部分的面积=S△AFG+S△ABD=S△AEG+S△ABD=S△AED= = ×240×100=12000 平方米 =1.2 万平方米。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-074","paperId":"gk2025-xz","num":74,"year":2025,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某单位65名职工中，拥有甲、乙、丙三项认证中至少一项的职工正好占80%，没有甲认证的职工与有乙认证的职工人数一样多，仅有丙认证的职工有3人，三项认证都有的职工有6人，问有多少人仅拥有甲、乙两项认证：","options":["10","13","16","19"],"answer":"A","explanation":"数学运算-容斥原理-三集合。设仅拥有甲、乙两项认证的人数为a，仅拥有乙认证的人数为b，仅拥有乙、丙两项认证的人数为c。根据题意，可作图如下：又根据上图可知，没有甲认证的职工人数为：b+c+3+13=b+c+16；有乙认证的职工人数为： a+b+c+6。根据题意可列式：b+c+16=a+b+c+6，解得：a=10，即有10 人仅拥有甲、乙两项认证。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-076","paperId":"gk2025-xz","num":76,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"D","explanation":"图形推理-数量类-面。每个图形的最大面均为轴对称图形。只有D 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-077","paperId":"gk2025-xz","num":77,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"C","explanation":"图形推理-位置类-混合考点。短线在外圈逆时针平移1 格，长线在内圈顺时针旋转 90°，只有C 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-078","paperId":"gk2025-xz","num":78,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一项填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"B","explanation":"图形推理-数量类-素。题干中每幅图形白球的部分数均为2，且两个部分白球的数量分别为12、1；11、2；10、3；9、4；8、5。因此？处需填入的为白球部分数为2 且两个部分白球数量分别为7、6 的图形，只有B 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-079","paperId":"gk2025-xz","num":79,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"A","explanation":"图形推理-杂糅类。第一行中的图一和图二求异后，再经过左右翻转得到图三。第二行检验规律，规律成立。因此，第三行应用该规律，将图一和图二求异后左右翻转，只有 A 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-080","paperId":"gk2025-xz","num":80,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"左边为给定的多面体，现用经P、Q、 R三点的平面对其进行切割，问哪个选项是其切面：","options":["A","B","C","D"],"answer":"A","explanation":"图形推理-立体截面。经过P、Q、R 切割平面，只经过下面的六面体可得到如下图。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-081","paperId":"gk2025-xz","num":81,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"以下为4个由若干棱长为1的正方体拼成的多面体，将它们在3×3 ×4空间内进行拼接，不可能拼成以下四个选项中的哪一个多面体：","options":["A","B","C","D"],"answer":"C","explanation":"图形推理-立体组合。如下图所示，A、B、D 三项均可由题干中四个立体图形拼接而成。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-082","paperId":"gk2025-xz","num":82,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"以下除哪项外，都是同一正方体纸盒的外表面展开图：","options":["A","B","C","D"],"answer":"D","explanation":"图形推理-立体重构-六面体。如下图所示，A 项、B 项和C 项中矩形框内两个C 面内部朝向相反，但D 项朝向一致，与其他三个选项不同，当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-083","paperId":"gk2025-xz","num":83,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②④ , ③⑤⑥","①③⑤ , ②④⑥","①③④ , ②⑤⑥","①③⑥ , ②④⑤"],"answer":"C","explanation":"图形推理-其他类-平面其他。六个图形中都存在黑色正方形，①③④在图形中心，而②⑤⑥在图形四周。因此，只有C 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-084","paperId":"gk2025-xz","num":84,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②③ , ④⑤⑥","①⑤⑥ , ②③④","①②④ , ③⑤⑥","①③⑤ , ②④⑥"],"answer":"C","explanation":"图形推理-功能类。六个图形都存在圆圈元素和黑点，将相同元素连接起来，发现 ①②④中两个黑点的连线与两个圆圈的连线为垂直关系，③⑤⑥中两个黑点的连线与两个圆圈的连线为平行关系。因此，只有C 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-085","paperId":"gk2025-xz","num":85,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②⑥ , ③④⑤","①③④ , ②⑤⑥","①③⑤ , ②④⑥","①④⑥ , ②③⑤"],"answer":"B","explanation":"图形推理-数量类-线。图①③④为一笔画图形，图②⑤⑥为两笔画图形。因此，只有B 项符合。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-086","paperId":"gk2025-xz","num":86,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"后视错觉是个体的一种认知偏差，是指在一件事情已经发生之后，即使个体之前没有对此做过预判，也认为自己“早就知道会这样”。根据上述定义，下列符合后视错觉的是：","options":["小瑾是一个悲观的人，她申请升职失败后，灰心丧气地说：“我早就知道，我什么都不如别人，什么也做不好。”","朋友邀阿欣去爬山，阿欣说高温预警不宜爬山，朋友坚持去，才到半山腰就汗流浃背，阿欣说：“我早就说会很热啊。”","晓琳参加一个重要会议迟到了。她懊悔地说：“我早该想到周一早上会堵车，不该按周末的情况预估通勤时间。”","晓菲在股票大跌之后，懊恼地说：“我早就觉察到那些信号了，觉得走势不太好，怎么就没有早卖出啊。”"],"answer":"D","explanation":"定义判断-单定义。题干中的关键词：在一件事情已经发生之后，即使个体之前没有对此做过预判，也认为自己“早就知道会这样”。结合选项：A 项小瑾本身是一个悲观的人，说明他在事情发生前就不抱有希望，已经预判了结果，不满足关键词“个体之前没有对此做过预判”，不符合定义，排除；B 项阿欣在爬山前说高温预警不宜爬山，说明是在事情发生前就做出了预判，不满足关键词“个体之前没有对此做过预判”，不符合定义，排除；C 项晓琳说“我早该想到周一早上会堵车”，“早该想到”的意思是本应该早点想到或预见到某件事情，用于表达对某种情况或决策的后悔。该选项体现的是晓琳对“自己没有想到周一早上会堵车”这件事的懊悔，不满足“认为自己‘早就知道会这样’”，不符合定义，排除；D 项晓菲在股票大跌之后，属于事情已经发生了，她说“我早就觉察到那些信号了”，满足“认为自己‘早就知道会这样’”。但如果她真的对此做过预测，她就会在大跌前把自己的股票卖出去，实际上她并没有这样做，说明她并没有做过预判，满足“个体之前没有对此做过预判”，符合定义，当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-087","paperId":"gk2025-xz","num":87,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"选择或然率理论解释的是影响受众对大众传播内容选择的决定性因素。该理论的核心公式是：选择或然率=报偿的保证/费力的程度。其中，报偿的保证指的是传播内容满足选择者需要的程度，即内容对于受众的吸引力和实用性；费力的程度指的是获取传播内容和使用传播途径的难度。根据上述定义，下列属于提高选择或然率的传播行为的是：","options":["视频号平台借助数据分析和个性化算法，给用户推荐符合其偏好的视频","时下流行的某影视作品在播放之前被插入一段2分钟的广告","某商家优化了商品布局，将畅销商品放在出口处，顾客可直接扫码支付","电视内置视频播放软件，开机后须先注册登录，才可搜索相关内容观看"],"answer":"A","explanation":"定义判断-多定义。题干中的关键词：①影响受众对大众传播内容选择的决定性因素；②核心公式是：选择或然率=报偿的保证/费力的程度；③报偿的保证指的是内容对于受众的吸引力和实用性；④费力的程度指的是获取传播内容和使用传播途径的难度。结合选项：A 项“给用户推荐符合其偏好的视频”，给用户推荐，说明用户获取信息的难度降低了，即费力程度降低。推荐的是符合其偏好的视频，说明平台推荐的内容符合用户需求，提高了 “内容对于受众的吸引力和实用性”，即报偿的保证提高了。选择或然率=报偿的保证/费力的程度，分母变小，分子变大，分数值变大，因此选择或然率提高了，符合定义，当选；B 项插播了一段2 分钟的广告，提高了用户看作品的难度，即费力的程度增大了。选择或然率= 报偿的保证/费力的程度，分母变大，分子不变，分数值变小，因此降低了选择或然率，不符合定义，排除；C 项某商家将畅销商品放在出口处，不涉及传播内容，不属于“影响受众对大众传播内容选择的决定性因素”，不符合定义，排除；D 项开机后需要先注册登录才可搜索内容，提高了用户观看视频的难度，即费力的程度增大了。选择或然率=报偿的保证/ 费力的程度，分母变大，分子不变，分数值变小，因此降低了选择或然率，不符合定义，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-088","paperId":"gk2025-xz","num":88,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"自动投案是指犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施时，主动、直接向公安机关、人民检察院或者人民法院投案。根据上述定义，下列不属于自动投案的是：","options":["甲实施多起电信诈骗，获利十余万元，在公安机关进行的一次隐患排查入户走访中，发现甲形迹可疑，经盘问甲主动交代了自己的罪行","乙致人重伤后潜逃，在公安机关经侦查确认乙为该案的犯罪嫌疑人时，乙正因酒后驾驶被行政拘留，经公安机关讯问后，乙交代了自己的罪行","丙多次挪用公款，其父母发现异常后，多次规劝其投案自首无效，直至单位发现款项异常开始查账后，丙才到公安机关交代自己的罪行","丁因入室盗窃被判处有期徒刑，在服刑期间，丁主动向公安机关交代自己系公安机关久未破获的“7·26”走私案的主谋之一"],"answer":"B","explanation":"定义判断-单定义。题干中的关键词：①犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施；②主动、直接向公安机关、人民检察院或者人民法院投案。结合选项：A 项甲实施多起诈骗，公安机关在进行一次隐患排查入户走访中发现甲形迹可疑，符合关键词“犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施”，甲主动交代了自己的罪行，符合关键词“主动、直接向公安机关、人民检察院或者人民法院投案”，符合定义，排除；B 项公安机关侦查确认乙为犯罪嫌疑人，乙正因酒后驾驶被行政拘留，不符合关键词“犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施”。经公安机关讯问后，乙交代了自己的罪行，不满足“犯罪嫌疑人尚未受到询问，主动向公安机关投案”。不符合定义，当选；C 项丙多次挪用公款，直至单位发现款项异常开始查账，符合关键词“犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施”，丙才到公安机关交代自己的罪行，符合关键词“主动、直接向公安机关、人民检察院或者人民法院投案”，符合定义，排除；D 项丁虽然在服刑期间，但主动向公安机关交代自己系公安机关久未破获的“7·26”走私案的主谋之一，满足“犯罪事实或者犯罪嫌疑人未被司法机关发觉，或者虽被发觉，但犯罪嫌疑人尚未受到讯问、未被采取强制措施时，主动、直接向公安机关、人民检察院或者人民法院投案。”，符合定义，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-089","paperId":"gk2025-xz","num":89,"year":2025,"region":"国家","module":"判断推理","sub":"图形推理","stem":"三维反求是测量技术、数据处理技术、图形处理技术和加工技术相结合的综合性技术，是指用一定的测量方法对实物进行测量，根据测量数据通过三维几何建模方法重构实物的数字化模型的过程。根据上述定义，下列关于三维反求工程的步骤，排序正确的是： ①通过制造样品来验证模型是否满足精度和其他性能指标 ②通过一定的算法，从测量数据中提取零件的设计与加工特征 ③使用高精度的三维测量技术获取零件表面各点的空间坐标 ④使用计算机辅助设计软件将数据与特征重构为三维模型","options":["①③④②","①④③②","③①②④","③②④①"],"answer":"D","explanation":"定义判断-单定义。题干中的关键词：用一定的测量方法对实物进行测量，根据测量数据通过三维几何建模方法重构实物的数字化模型的过程。结合选项可知，首句在①③ 中选择，①是对模型的验证，③是对零件数据的获取。根据定义，第一步是对实物进行测量，故①不可能是首句，排除A 和B 项。此外，应当先构建出模型后，才能对模型进行验证，因此①也不可能排在第二位，排除C 项。只有D 项符合，当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-091","paperId":"gk2025-xz","num":91,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"流域内降雨或融冰化雪都可以引起河水显著上涨。春季，气候转暖，流域内的季节性积雪融化、河流解冻或春雨，引起河水上涨称春汛。因正值桃花盛开时节，故亦称桃汛。我国北方，把春季河冰解冻引起的涨水现象专称为凌汛。夏季，流域内的暴雨或高山冰川和积雪融化，使河水急剧上涨，称夏汛。我国习惯上把发生在夏季三伏前后的汛水称为伏汛。秋季由于暴雨，河水发生急剧上涨称秋汛。根据上述定义，下列判断错误的是：","options":["春汛包含凌汛","夏汛包含伏汛","伏汛在凌汛前","春汛就是桃汛"],"answer":"C","explanation":"定义判断-多定义。题干中的关键词：①春汛（桃汛）：春季气候转暖，流域内的季节性积雪融化、河流解冻或春雨，引起河水上涨；②凌汛：春季河冰解冻引起的涨水现象；③伏汛：发生在夏季三伏前后的汛水；④夏汛：夏季流域内的暴雨或高山冰川和积雪融化，使河水急剧上涨；⑤秋汛：秋季由于暴雨，河水发生急剧上涨。结合选项：A 项春汛包含春季河流解冻引起的河水上涨，而凌汛是春季河冰解冻引起的涨水现象，因此春汛包含凌汛，该项判断正确，排除；B 项伏汛是指夏季三伏前后的汛水，说明伏汛属于夏汛的一种，该项判断正确，排除；C 项伏汛是指夏季三伏前后的汛水，凌汛是指春季河冰解冻引起的涨水现象，而夏季是在春季后，因此是伏汛在凌汛后，该项判断错误，当选；D 项春汛因正值桃花盛开时节，也被称为桃汛，该项判断正确，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-092","paperId":"gk2025-xz","num":92,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"断取是修辞格的一种，引用词语时，只截取其中部分字眼的意义，而置其余于不顾，是一种“断章取义”的修辞方式。根据上述定义，下列没有采用断取修辞方式的是:","options":["相较于他之前见过的大阵仗，眼前的情形在他眼中就是“小儿科”","小林一心扑在科研项目上，他至今还是一个“光杆司令”呢","山林发生火灾，消防员“上刀山下火海”，奋力保卫人民的生命和财产安全","实在走投无路，他最终还是找老师“开药方”，问询这一困局的破解之道"],"answer":"D","explanation":"定义判断-单定义。题干中的关键词：引用词语时，只截取其中部分字眼的意义，而置其余于不顾。结合选项：A 项“小儿科”的本意是指医院中治疗儿童各种疾病的一个科室，选项中比喻价值不大、不值得重视的事情，或简单容易做的事情。该项在运用“小儿科”时，只截取了“小”的含义，舍弃了“儿科”的含义，满足关键词“引用词语时，只截取其中部分字眼的意义，而置其余于不顾”，符合定义，排除；B 项“光杆司令”本意指没有士兵的军队指挥官，选项中指一个人孤立无援，没有任何帮手或支持者。该项在运用“光杆司令”时，只截取了“光杆”的含义，舍弃了“司令”的含义，满足关键词“引用词语时，只截取其中部分字眼的意义，而置其余于不顾”，符合定义，排除；C 项“上刀山”指的是攀爬布满锋利刀
