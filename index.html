按照国家有关规定转入本校其他专业学习。达到报考研究生条件的，按照国家有关规定享受优惠政策。”因此，已被大学录取的现役军人可以在退伍后两年内入学，而非四年。 C 选项错误：根据《中华人民共和国退役军人保障法》第四十六条规定：“退役军人创办小微企业，可以按照国家有关规定申请创业担保贷款，并享受贷款贴息等融资优惠政策。退役军人从事个体经营，依法享受税收优惠政策。”因此，退役军人创办企业可以享受税收优惠、贷款贴息等优惠政策，而非享受免税、贷款免息等优惠政策。 D 选项正确：根据《中华人民共和国退役军人保障法》第二十九条第四款第一项规定：“随迁子女需要转学、入学的，安置地人民政府教育行政部门应当予以及时办理。对下列退役军人的随迁子女，优先保障：（一）参战退役军人。（二）属于烈士子女、功臣模范的退役军人；（三）长期在艰苦边远地区或者特殊岗位服现役的退役军人；（四）其他符合条件的退役军人。”","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-009","paperId":"gk2023-xz","num":9,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国生物安全法》，下列说法错误的是：","options":["国家对我国人类遗传资源和生物资源享有主权","对高致病性的病原微生物，一律不得从事相关实验活动","境外组织不得在我国从事中、高风险的生物技术研究、开发活动","任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种"],"answer":"B","explanation":"【格木解析】 A 选项正确：根据《中华人民共和国生物安全法》第五十三条第二款规定：“国家对我国人类遗传资源和生物资源享有主权。” B 选项错误：一律过于绝对。高等级病原微生物实验室从事高致病性或者疑似高致病性病原微生物实验活动，应当经省级以上人民政府卫生健康或者农业农村主管部门批准，并将实验活动情况向批准部门报告。 C 选项正确：根据《中华人民共和国生物安全法》第三十八条第一款规定：“从事高风险、中风险生物技术研究、开发活动，应当由在我国境内依法成立的法人组织进行，并依法取得批准或者进行备案。” D 选项正确：根据《中华人民共和国生物安全法》第六十条第三款规定：“任何单位和个人未经批准，不得擅自引进、释放或者丢弃外来物种","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-010","paperId":"gk2023-xz","num":10,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"关于个人信息保护，下列说法不符合我国法律规定的是：","options":["通过自动化决策方式向个人进行商业营销，应同时提供不针对其个人特征的选项或便捷的拒绝方式","个人信息和隐私有密切的关系，个人信息当中的私密信息适用有关隐私权的规定","通过人脸识别技术所收集的个人图像、身份识别信息只能用于维护公共安全目的","用户量巨大的个人信息处理者需要定期发布个人信息保护社会责任报告"],"answer":"C","explanation":"【格木解析】 A 选项正确：根据《中华人民共和国个人信息保护法》第二十四条第二款规定：“通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。” B 选项正确：根据《中华人民共和国民法典》第一千零三十四条第三款规定：“个人信息中的私密信息，适用有关隐私权的规定；没有规定的，适用有关个人信息保护的规定。 C 选项错误：根据《中华人民共和国个人信息保护法》第二十六条规定：“在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。”故若取得个人单独同意，可以用于其他目的。 D 选项正确：根据《中华人民共和国个人信息保护法》第五十八条规定：“提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：（四）定期发布个人信息保护社会责任报告，接受社会监督。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-011","paperId":"gk2023-xz","num":11,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国噪声污染防治法》，下列噪声污染情形与作出责令改正或处罚决定的主体对应错误的是：","options":["甲企业在噪声敏感建筑物集中区域改建厂房造成工业噪声污染——住房和城乡建设部门","乙企业无排污许可证排放工业噪声——生态环境主管部门","丙商场在促销时持续使用高音喇叭发出噪声——地方人民政府指定的部门","丁驾驶拆除消声器的机动车轰鸣行驶——公安机关交通管理部门"],"answer":"A","explanation":"【格木解析】A 选项错误：《噪声污染防治法》第74 条第2 款，违反本法规定，在噪声敏感建筑物集中区域改建、扩建工业企业，未采取有效措施防止工业噪声污染的，由生态环境主管部门责令改正，处十万元以上五十万元以下的罚款；拒不改正的，报经有批准权的人民政府批准，责令关闭","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-012","paperId":"gk2023-xz","num":12,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与交通安全有关的说法错误的是：","options":["机动车载运放射性危险物品应当经公安机关批准后按指定的时间、路线、速度行驶","在允许拖拉机通行的道路上，拖拉机可从事货运，但不得用于载人","前车为执行紧急任务的救护车、工程救险车的，后车不得超车","行人故意碰撞机动车造成交通事故的，机动车一方承担次要责任"],"answer":"D","explanation":"【格木解析】据《中华人民共和国道路交通安全法》第七十六条第二款规定：“交通事故的损失是由非机动车驾驶人、行人故意碰撞机动车造成的，机动车一方不承担赔偿责任。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-013","paperId":"gk2023-xz","num":13,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"关于电信诈骗，下列说法错误的是：","options":["实施电信许骗最高可被判处无期徒刑","电信诈骗受害人可以通过诉讼程序要求服务存在缺陷的电信运营商承担相应责任","负责招募他人实施电信网络诈骗犯罪活动的，以共同犯罪论处","非法使用“伪基站”实施电信诈骗的以非法侵入计算机信息系统罪追究刑事责任"],"answer":"D","explanation":"【格木解析】根据《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》第三节第一点规定： “（一）在实施电信网络诈骗活动中，非法使用‘伪基站’‘黑广播’，干扰无线电通讯秩序，符合刑法第二百八十八条规定的，以扰乱无线电通讯管理秩序罪追究刑事责任。同时构成诈骗罪的，依照处罚较重的规定定罪处罚。”因此，非法使用“伪基站”实施电信网络诈骗活动，可能构成扰乱无线电通讯管理秩序罪或诈骗罪，不构成非法侵入计算机信息系统罪。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-014","paperId":"gk2023-xz","num":14,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国职业教育法》，关于企业开展职业教育，下列说法错误的是：","options":["企业应当按照职工工资总额的一定比例提取使用职工教育经费","用于一线职工职业教育的经费应当达到国家规定比例","企业设立产教融合实训基地的，在公用事业费上享受高于职业学校的优惠政策","企业安排职工到职业学校接受职业教育的，应支付职业教育期间工资"],"answer":"","explanation":"【答案】【格木解析】ABD 正确，根据《中华人民共和国职业教育法》第五十八条第一款规定：“企业应当根据国务院规定的标准，按照职工工资总额一定比例提取和使用职工教育经费。职工教育经费可以用于举办职业教育机构、对本单位的职工和准备招用人员进行职业教育等合理用途，其中用于企业一线职工职业教育的经费应当达到国家规定的比例。用人单位安排职工到职业学校或者职业培训机构接受职业教育的，应当在其接受职业教育期间依法支付工资，保障相关待遇。”C 选项错误，根据《中华人民共和国职业教育法》第58 条，企业设立具备生产与教学功能的产教融合实习实训基地所发生的费用，可以参照职业学校享受相应的用地、公用事业费等优惠。根据该法条可知，企业设立产教融合实训基地的，只是参照职业学校的优惠政策，并非高于。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-015","paperId":"gk2023-xz","num":15,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"近年来，我国不断推进水生态修复保护工作。生态塘是包含水生动植物和微生物的一种水生态修复方式。下列与之相关的说法，错误的是：","options":["狐尾藻可用于富营养化水体的生态修复是因其可吸收氮磷","可以用生石灰对生态塘沿岸土壤进行消毒处理","生态塘中的青鱼等肉食性鱼类主要在池塘上层水体活动","池塘中的水体出现黑臭时可通过种植芦苇等植物进行改善"],"answer":"C","explanation":"【格木解析】 A 选项正确：水体富营养化是水体中N、P 等营养盐含量过多而引起的水质污染现象。狐尾藻是小二仙草科狐尾藻属植物，多年生粗壮沉水草本。根状茎发达，在水底泥中蔓延，节部生根，对富营养化水中的氮磷均有较好的净化作用。 B 选项正确：蛋白质在遇到高温、强碱、强酸、重金属离子时会变性，蛋白质就失去了生物活性，利用这个原理可以利用高温、强碱、强酸、重金属离子来消毒杀菌。生石灰遇水会发生反应放出大量的热，并且生成强碱，可以使细菌的蛋白质失去活性从而起到杀菌消毒的作用。 C 选项错误：青鱼是鲤科、青鱼属鱼类，体长可达145 厘米，通常栖息在水的中下层，生性不活泼。其主要的食物来源为螺蛳、蚌、蚬、蛤等，偶尔也捕食虾和昆虫幼虫。 D 选项正确：芦苇的根状茎十分发达，其叶、叶鞘、茎、根状茎和不定根都具有通气组织。当黑臭污水通过芦苇湿地系统时，芦苇能从污水中吸收营养物质加以利用，并能吸附和富集重金属及一些有毒有害物质，使水质得到净化。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-016","paperId":"gk2023-xz","num":16,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与古人出行有关的说法错误的是：","options":["“开远门前万里堠”中的“堠”是一种路标，可以用来导航和计程","“东有启明，西有长庚”中指示方向的“启明”“长庚”是不同天体","“乘舟而惑者，不知东西，见斗极则寤矣”中的“极”就是北极星","“过洋牵星术”是通过测量星辰的高度指数来确定船只所处位置的"],"answer":"B","explanation":"【格木解析】 A 选项正确：“堠”是古代人们为了丈量路程，设置的一种路标， B 选项错误：“启明”和“长庚”指的都是金星，它是八大行星之一，它有时是晨星，黎明前出现在东方天空，被称为“启明”；有时是昏星，黄昏后出现在西方天空，被称为“长庚” C 选项正确：“乘舟而惑者，不知东西，见斗极则寤矣”出自西汉刘安编撰的《淮南子》，表明在水路上迷路的人们，利用北斗星和北极星就能找到方向。其中“极”就是指北极星。 D 选项正确：“过洋牵星术”是中国古代航海所用的天文观察导航技术，是指用牵星板测量所在地的星辰高度，然后计算出该处的地理纬度，以此测定船只所处位置。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-017","paperId":"gk2023-xz","num":17,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"下列关于化石的说法正确的是：","options":["琥珀的硬度比和田玉大","三叶虫化石是侏罗纪地层中的典型化石","大多数化石是在侵入岩中被发现的","硅化木是树木埋入地下后形成的化石"],"answer":"D","explanation":"【格木解析】 A 选项错误：琥珀的硬度比和田玉小，琥珀是树脂滴落，掩埋在地下千万年，在压力和热力的作用下石化形成琥珀。其硬度比较低，一般莫氏硬度为2-3。 B 选项错误：三叶虫属古生节肢动物，生于古生代的寒武纪，至奥陶纪最盛，消亡于二叠纪末期的二叠纪大灭绝事件。 C 选项错误：侵入岩是指当上覆岩层压力减轻时，软流层中的岩浆就钻出，在地壳深处冷凝而形成的岩石。大多数化石是在沉积岩中被发现的。 D 选项正确：硅化木是真正的木化石，是几百万年或更早以前的树木被迅速埋入地下后，被地下水中的二氧化硅替换而成的树木化石，它保留了树木的木质结构和纹理","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-018","paperId":"gk2023-xz","num":18,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与氢燃料电池车有关的说法错误的是：","options":["氢气和氧气在内燃机中反应产生电能","氢燃料电池车的最终排出物是水","氢气可以通过生物发酵和电解水等方法制取","北京冬奥会中大量使用了氢燃料电池车"],"answer":"A","explanation":"【格木解析】A 选项错误：氢燃料电池不是让氢气和氧气在内燃机中直接反应，而是将氢气送到燃料电池的阳极板（负极），经过催化剂（铂）的作用，氢原子中的电子被分离出来，失去电子的氢离子（质子）穿过质子交换膜，到达燃料电池的阴极板（正极），而电子是不能通过质子交换膜的，这个电子只能经外部电路，到达燃料电池的阴极板，从而在外电路中产生电流。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-019","paperId":"gk2023-xz","num":19,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"关于自然节律变化，下列说法错误的是：","options":["惊蛰后华北地区可能会出现“万里雪飘”的现象","2月北回归线附近会出现“儿童急走追黄蝶，飞入菜花无处寻”的现象","冬至时，在广东汕头竖直立杆会出现“立竿无影”的现象","谷雨前后江浙地区可能会出现“一把青秧趁手青，轻烟漠漠雨冥冥”的现象"],"answer":"C","explanation":"【格木解析】C 选项错误：冬至是太阳直射南回归线，北半球太阳高度角达到一年中最小，在广东汕头不可能出现“立竿无影”的现象，这一天竿的影子达到一年中最长。 A 选项正确：惊蛰的时间是三月上旬，此时华北地区有可能下雪。 B 选项正确：1 月、2 月油菜花在北回归线附近开放；3 月四川盆地和南岭与武夷山以北的油菜花进入了花期，4 月1 日的花期等值线到了江浙一带的沿海地区。 D 选项正确：谷雨的时间时四月下旬，早稻的插秧时间大概在每年的3 月-4 月，中稻插秧时间在5 月中旬，晚稻插秧时间在7 月下旬。因此，江浙一带谷雨时插秧有可能。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-020","paperId":"gk2023-xz","num":20,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"关于人体的生理现象，下列说法正确的是：","options":["蚊虫叮咬造成的皮肤发痒属于过敏反应","人体在流汗时汗腺内的盐分浓度会降低","打嗝声是由胃部痉挛和声带闭合造成的","皮肤受伤流血处的血管会先扩张后收缩"],"answer":"A","explanation":"【格木解析】 A 项正确：蚊虫叮咬痒是一种过敏反应。当蚊虫叮咬人或其他动物时，它们会释放出一些化学物质，如组胺和血小板活化因子等，这些化学物质会引起人体抵抗器官产生过敏反应，导致红肿、瘙痒、疼痛等不适症状。 B 选项错误：汗液是由汗腺分泌的，主要成分是为水和电解质，其中主要成分为氯离子、钠离子、钾离子和氢离子，当身体处于运动或高温环境下，机体需要通过汗液来调解体温，此时汗腺会分泌大量的汗液，根据汗液的成分，可知此时汗腺内的盐分浓度升高了。 C 选项错误：打嗝是由于横膈肌收缩引起的。横膈肌是一块位于胸腔和腹腔之间的肌肉，它的主要功能是协助呼吸。当你呼吸时，横膈肌会下降并扩大胸部的空间，这样肺部就可以充分扩张。而当你吃喝或者吞咽食物时，横膈肌会突然收缩，这会导致气道关闭，造成胃部和食道之间的压力差，从而产生打嗝声。 D 选项错误：皮肤受伤流血时，血管会先收缩然后扩张。当皮肤受伤时，身体的第一反应是让血管收缩以减小出血量。这是人体自我保护的机制，可以避免过量出血导致缺氧等问题。收缩的血管可以让止血小凝块（血小板）更容易接近伤口，形成血块并堵塞受伤的小血管。这使得身体可以在适当的时间内开始修复伤口。但是，在血管收缩的同时，身体也会释放一些生长因子来促进血管的重新生长。这些生长因子可以通过刺激血管内皮细胞增殖和分化来促进血管的新陈代谢和重建。血管开始重新扩张，以便运输氧气和营养物质到伤口，促进伤口愈合。因此，在皮肤受伤并流血的过程中，血管的收缩和扩张过程是伤口愈合的一个重要因素。第二部分言语理解与表达","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-021","paperId":"gk2023-xz","num":21,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“双减”政策带给作业改革的最大变化，是理念的改变，让我们回到了作业的原点：为什么要布置作业？归根到底，是为了育人，这彻底扭转了之前作业管理中的“________”现象，改变了传统作业管理中“眼中有作业、有分数，但唯独没有人”的痼疾，厘清了“好作业”的标准或者尺度。填入画横线部分最恰当的一项是：","options":["缘木求鱼","徒有其表","本末倒置","揠苗助长"],"answer":"C","explanation":"【格木解析】逻辑填空题。根据“让我们回到了作业的原点”“眼中有作业、有分数，但唯独没有人”可知强调传统作业管理的“原点”是育人，但现在却存在只重作业分数，轻视育人的问题，这就是把根本和非根本的内容颠倒了。C 项“本末倒置”比喻颠倒了事物的轻重主次，符合文意。A 项“缘木求鱼”比喻行事的方向、方法不对，必将劳而无功，未提到“主次”“根本”的问题，不符合文意，排除。B 项“徒有其表”意思是指有名无实，不符合文意，排除；D 项“揠苗助长”比喻违反事物的发展规律，急于求成，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-022","paperId":"gk2023-xz","num":22,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外，红树林大多分布于沉积型海岸河口，由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并快速沉积下来。这“________”的组合拳使得红树林成为海岸带蓝碳碳汇的主要贡献者。填入画横线部分最恰当的一项是：","options":["标本兼治","一举两得","取长补短","开源节流"],"answer":"D","explanation":"【格木解析】逻辑填空题。根据“减缓了根系和凋落物的分解速率，加速了碳埋藏速率”“被它们固定并快速沉积下来”可知，文段的意思为：①红树林地下部分的特点可以减缓根系和凋落物的分解速率从而加速碳埋藏速率，即“节流”，②红树林地域分布特点可以带来大量外源性碳，即“开源”，D 项“开源节流”比喻既要广开财源，又要节省支出，与前文两方面的意思照应，符合文意。A 项“标本兼治”比喻查处问题和防止问题两方面工作同时进行，文段不涉及“标”与“本”的关系，排除；B 项“一举两得”形容做一件事，同时收获两方面的好处，文段做的是两件事，排除；C 项“取长补短”意思是吸取别人的长处，来弥补自己的不足之处，文段中没有“长短”的关系，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-023","paperId":"gk2023-xz","num":23,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"人造血即血氧液，能够用来代替人类血液，满足临床需求，缓解血液短的状况。而且人造血标准化的生产流程能够确保其________，输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险。因此，研制和批量生产人造血成为当前的热点。填入画横线部分最恰当的一项是：","options":["安全性","可靠性","规范性","稳定性"],"answer":"A","explanation":"【格木解析】逻辑填空题。根据“输入人造血不用再担心会感染艾滋病、肝炎等疾病，可最大程度降低输血相关传染病的风险”可知，表示人造血标准化的生产流程风险低、危险小。A 项“安全性”指不受威胁，没有危险、危害、损失，符合文意。B 项“可靠性”意思是可以信赖依靠，比如“他这个人很可靠”，不特指“疾病” 和“生命”有关的内容，不如A 项“安全性”精确，排除；C 项“规范性”意思是明文规定或约定俗成的标准，不特指“疾病”和“生命”有关的内容，不如A 项“安全性”精确，排除；D 项“稳定性”指稳恒固定；没有变动；使稳定。不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-024","paperId":"gk2023-xz","num":24,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“反觇”思维是从事物甲和乙之间的联系，反推出乙同甲的另一种联系的方法。在作战指挥中，敢于“反其道而觇之”，往往能跳出局部观全局，打破常规辟蹊径。面对复杂多变的战场形势，指挥员若能换位于敌、________定式，从侧面甚至反向来决策，及时________行动部署，就会拥有战场制敌的更大胜算。依次填入画横线部分最恰当的一项是：","options":["摆脱规划","忽略调整","突破扭转","摒弃校正"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“反其道而觇之”“打破常规辟蹊径”可知，强调指挥员要跳出常规思维方式，A 项“摆脱”指冲破束缚和障碍而获得自由；C 项“突破”是指打开缺口、超过、打破；D 项“摒弃” 形容思想上的抛弃、丢弃，这三项均符合文意。B 项“忽略”侧重被动没有关注到，而文段强调的主动跳出定式，排除。第二空强调在复杂多变的战场，指挥员需要改变思维，改变行动部署。D 项“校正”指校对改正，符合文意。A 项“规划”是指个人或组织制定的比较全面长远的发展计划。侧重事前的计划，而文段强调事情发生过程中的改变，排除；C 项“扭转”多搭配“扭转局面”，与“部署”搭配不当，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-025","paperId":"gk2023-xz","num":25,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"课程思政的显性功能是提升课程的内涵和质量。不少教师认为课程思政是________于传统教学之外的附加行为，这种认识是错误的。对教学而言，课程思政不是________，更不是特立独行，它首先是为提升教学质量服务的，是深层次的教学改革，因为只有高水平的教学活动才能吸引学生，进而影响学生。依次填入画横线部分最恰当的一项是：","options":["游离喧宾夺主","隔绝照本宣科","徘徊削足适履","独立敷衍了事"],"answer":"A","explanation":"【格木解析】逻辑填空题。第一空根据“不少教师认为课程思政是________于传统教学之外的附加行为” 可知，强调课程思政是教学活动以外的行为。A 项“游离”比喻离开集体或依附的事物而存在；C 项“徘徊”表示在一个地方来回走动；D 项“独立”是指单独的站立或者指关系上不依附、不隶属。这三项均符合文意。B 项“隔绝”把某一物体分开使其与外界完全隔离。根据“附加行为”可知，课程思政不可能与教学完全隔离，排除。第二空根据“它首先是为提升教学质量服务的”可知，课程思政是为教学服务的，所以教学是主要的、课程思政是次要的。即空格处强调课程思政不能主次颠倒。A 项“喧宾夺主”比喻外来的或次要的事物占据了原有的或主要的事物的位置，符合文意。C 项“削足适履”比喻不合理地迁就凑合或不顾具体条件，生搬硬套，不符合文意，排除。D 项“敷衍了事”是指办事马马虎虎，只求应付过去就算完事，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-026","paperId":"gk2023-xz","num":26,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"相比于其他全球卫星导航系统采取单一轨道星座构型，北斗系统________，坚定选择了混合星座的特色发展之路，并首创短文通报模式，开创了通信导航一体化的独特服务模式，信息发送能力从一次120个汉字提升到一次1200个汉字，遇到突发情况时无需________，足以将情节一次性说清楚。依次填入画横线部分最恰当的一项是：","options":["遥遥领先删繁就简","迎难而上惜墨如金","与众不同言筒意赅","独树一帜字斟句酌"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“坚定选择了混合星座的特色发展之路，并首创短文通报模式，开创了通信导航一体化的独特服务模式”可知北斗导航系统与其他导航系统相比是独特的、创新的；C 项“与众不同”只能表示与其他人不一样，D 项“独树一帜”比喻创造出独特的风格、主张，自成一家。这两项符合文意， A 项“遥遥领先”意思是远远地走在最前面。不能体现创新，也没有体现与他人不同，排除。B 项“迎难而上” 形容不怕困难，不怕挫折，勇敢地挑战。文段没有强调“困难”的语境，排除。第二空根据“信息发送能力从一次120 个汉字提升到一次1200 个汉字”强调原来发送信息需要逐字逐句斟酌描述清楚，而现在可以用更多的字数说清楚事情。D 项“字斟句酌”指写文章或说话时慎重细致，一字一句地推敲琢磨，符合文意。C 项“言简意赅”形容说话写文章简明扼要，文段为否定句式，即“无需言简意赅”，则意为“冗长啰嗦”，与原文倾向不符，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-027","paperId":"gk2023-xz","num":27,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"翻开古代农书，几千年间古人对于土地的保养，几乎与当代耕作学关注的措施________，其中历代农书涉及最多的是施肥。在中国古人的摸索中，施肥成为一种讲究，何时、何地施肥，施何种肥，怎样施肥，形成了一个________的体系，在每个年度的农业生产进程中，精心安排在各个时节。依次填入画横线部分最恰当的一项是：","options":["别无二致完整","不谋而合复杂","一脉相承科学","如出一辙固定"],"answer":"A","explanation":"【格木解析】逻辑填空题。第一空根据“几乎与当代耕作学关注的措施______”可知，古代与当代的措施几乎没有区别。A 项“别无二致”是指区分不出两者的差别，B 项“不谋而合”是指事先没有商量过，意见或行动却完全一致，D 项“如出一辙”形容两种言论或行动一模一样。这三项均符合文意，C 项“一脉相承”比喻某种思想、行为或学说之间有继承关系，表述上应该为“当代继承了古代”，而不是“古代继承当代”，排除。第二空，通过文段“何时、何地施肥，施何种肥，怎样施肥”以及“安排在各个时节”可知，这个体系应该是一个全面的体系，A 项“完整”符合文意。B 项“复杂”指的是（事物的种类、头绪等）多而杂。文段没有体现体系杂乱，排除，D 项“固定”强调不改变，但是农业生产会根据每年的情况进行调整，不可能永不改变，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-028","paperId":"gk2023-xz","num":28,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"指尖上的形式主义是“以痕迹论政绩”的错误政绩观，关注点在于形式美观，而________了根本政绩——人民群众的满意度。指尖上减负就是要把基层干部从________的“虚功”中解救出来，务求实效、扎根基层，用实践检验政绩，把工作落实与否、群众满意与否作为衡量政绩的客观标准。依次填入画横线部分最恰当的一项是：","options":["偏离阳奉阴违","遗忘哗众取宠","忽视华而不实","淡化花拳绣腿"],"answer":"C","explanation":"【格木解析】逻辑填空题。第一空辨析度不高，第二空根据“形式美观”“虚功”务求实效“把工作落实与否” 可知，该空强调不“务实”。C 项“华而不实”比喻外表好看而内容空虚；D 项“花拳绣腿”指姿势好看而搏斗时用处不大的拳术。两者均符合文意。A 项“阳奉阴违”指表面上遵从，暗地里违背；B 项“哗众取宠”比喻用浮夸的言词或做作的行动去迎合群众，以博取好感和支持。两者均与“不务实”无关，不符合文意，排除。第一空根据“关注点”“而”可知，强调转折关系，该空与“关注点”意思相反，表示不关注，不重视。C 项“忽视”指疏忽；不重视，符合文意。D 项“淡化”（问题、情感等）逐渐冷淡下来，与“关注”的对应不如C 项“忽视”，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-029","paperId":"gk2023-xz","num":29,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"我们确立和坚持马克思主义在意识形态领域指导地位的根本制度，新时代党的创新理论________，社会主义核心价值观广泛传播，中华优秀传统文化得到创造性转化、创新性发展，文化事业日益繁荣，网络生态持续向好，意识形态领域形势发生________、根本性转变。依次填入画横线部分最恰当的一项是：","options":["振聋发聩历史性","高屋建瓴实质性","深入人心全局性","硕果累累显著性"],"answer":"C","explanation":"【格木解析】逻辑填空题。第一空根据“新时代党的创新理论________，社会主义核心价值观广泛传播” 可知，强调“广泛传播”，传播的对象是广大的人民群众，C 项“深入人心”指已经被多数人深深地理解、信仰和拥护，符合文意；A 项“振聋发聩”比喻唤醒糊涂麻木之人；B 项“高屋建瓴”比喻居高临下，不可阻遏的形势，现指对事物把握全面，了解透彻，有全局性思维；D 项“硕果累累”比喻取得的巨大成绩相当多。三者均不符合文意，排除。第二空代入验证。C 项“全局性”指大局，整个局势，对应“新时代党的创新理论、社会主义核心价值观、中华优秀传统文化、文化事业、网络生态、意识形态领域”各方面的改变。符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-030","paperId":"gk2023-xz","num":30,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"补齐公共服务短板，首先要善于发现深层次问题。要深入调研、综合分析、精准掌握，弄清问题的本质和关键，做到________。同时，补齐公共服务短板不是简单的打打补丁，也不会________。有一些短板和弱项，是随着时代发展而凸显的系统性问题，只有通过推动经济社会高质量发展才能从根本上解。依次填入画横线部分最恰当的一项是：","options":["有的放矢一劳永逸","细致入微完美无缺","一针见血水到渠成","循序渐进一成不变"],"answer":"A","explanation":"【格木解析】逻辑填空题。第一空根据“精准掌握，弄清问题的本质和关键”可知，该空表示精准抓住问题的本质和关键。A 项“有的放矢”指对准靶子射箭。比喻言论、行动目标明确；C 项“一针见血”比喻论断直截了当，切中要害。两者均符合文意。B 项“细致入微”指对人体贴关心无微不至；D 项“循序渐进”指按照一定的顺序或步骤逐渐深入或提高。两者均不符合文意，排除。第二空根据“有一些短板和弱项，是随着时代发展而凸显的系统性问题”可知，该空强调“补齐公共服务短板”需要随着时代发展而进行，无法短时间完成。A 项“一劳永逸”指辛苦一次，把事情办好，以后就不再费事了，符合文意。C 项“水到渠成”比喻条件成熟，事情自然成功，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-031","paperId":"gk2023-xz","num":31,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"对于新业态新模式冲击本地的传统产业，是包容审慎，还是________？对于非本地人才就业创业、非本地企业项目立项推广，能否________，甚至千方百计降门槛、清路障以留人留项目？纵观先进制造业集群所在地，无一不是当地政府部门怀着“开放之心”，营造出良好的创新生态。依次填入画横线部分最恰当的一项是：","options":["退避三舍不偏不倚","如芒在背一视同仁","拒之门外开诚布公","推三阻四海纳百川"],"answer":"B","explanation":"【格木解析】逻辑填空题。第一空根据“对于新业态新模式冲击本地的传统产业，是包容审慎，还是 ________？”可知，表示我们对待“新业态新模式冲击本地的传统产业”这件事情的态度，B 项“如芒在背”指形容极度不安，符合文意。A 项“退避三舍”意思是主动退让九十里，比喻退让和回避，避免冲突，文段没有“冲突”的意思，不符合文意，排除；C 项“拒之门外”意思是把人挡在门外，不让其进入，但是“新业态新模式冲击本地的传统产业”已经发生了，我们无法拒绝，不符合文意，排除。D 项“推三阻四”意思是找各种借口推托，同理，“新业态新模式冲击本地的传统产业”已经发生了，我们无法拒绝，不符合文意，排除。第二空代入验证。根据“能否________，甚至千方百计降门槛……”可知，强调降门槛吸收非本地企业项目，把“非本地企业项目”和“本地项目”同等相待之意。B 项“一视同仁”不分厚薄，符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-032","paperId":"gk2023-xz","num":32,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"法律惩罚的正当性一定程度上源于公众朴素的道德期待。在具体执法时，不能仅仅________地依赖客观后果，进行简单归责和惩戒，而应全面考察当事人的主观认知、动机目的等情节，并综合________其社会危害性，由此来审慎决定是否启动惩罚机制。依次填入画横线部分最恰当的一项是：","options":["盲目分析","草率判断","机械评估","单纯辨别"],"answer":"C","explanation":"【格木解析】逻辑填空题。第一空根据“在具体执法时，不能仅仅________地依赖客观后果，进行简单归责和惩戒，而应全面考察当事人的主观认知”可知，不能简单的依赖客观后果。B 项“草率”形容粗糙简略；C 项“机械”指利用力学原理构成的装置；比喻拘泥于成规，刻板；D 项“单纯”，简单纯一，不复杂；这三项均符合文意。A 项“盲目”强调没有方向、没有目的，而文段表示依赖客观后果，所以是有方向的，不符合文意，排除。第二空根据“应全面考察当事人的主观认知、动机目的等情节”“并综合________其社会危害性”可知，强调根据全面考虑社会危害性来给下一步的决策做参考，C 项“评估”强调根据预定的准则，去衡量方案已有或将有的效果，以决定其可行性，供选择或改进的参考，符合文意。B 项“判断”强调判别事物的对错、是否，可是文段除了判断“社会危害性”是否存在外，还要以此作为依据，做下一步行动，排除；D 项“辨别”强调区别不同，而文段不只是区别社会危害性的不同，还要以此作为依据，做下一步行动，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-033","paperId":"gk2023-xz","num":33,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"在普通人看来，法律都是________的，自己一辈子都不会和法律打交道。但在瞬息万变的社会里，人们随时可能触及法律的红线。很多人平时法律观念和意识不强，柔性执法不仅可以起到________作用，而且有利于提高群众的学法懂法意识。依次填入画横线部分最恰当的一项是：","options":["高深莫测预防","事不关己提醒","高高在上教育","遥不可及警戒"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“自己一辈子都不会和法律打交道”可知，表达“法律”是普通人很难接触到的。D 项“遥不可及”指非常遥远而不可到达。符合文意。A 项“高深莫测”是指为人或事深沉不可测，使人难以理解，不符合文意，排除；B 项“事不关己”意思是指事情同自己没有关系。但是法律是和每一个人都有关系的，只是大家觉得自己可能不会犯法，不符合文意，排除；C 项“高高在上”通常形容领导者脱离实际，脱离群众。不符合文意，排除。第二空代入验证，D 项“警戒”意思是告诫人改正错误，符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-034","paperId":"gk2023-xz","num":34,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"长期以来，城管执法部门对职责内的执法事项通常是________“用力”，对所有的执法对象“一碗水端平”，以体现执法的公平性、公正性。但对于超大城市而言，由于城管执法事项繁多，涉及市场主体庞杂，而城管执法力量是有限的，实践中很难做到________，进而可能会影响执法效果和执行力。依次填入画横线部分最恰当的一项是：","options":["平均面面俱全","精确精益求精","精准滴水不漏","均衡百无一失"],"answer":"A","explanation":"【格木解析】逻辑填空题。第一空根据“一碗水端平”可知，强调城管部门对所有的执法对象都是一样的， A 项“平均”，D 项“均衡”均符合文意。排除BC 项。第二空根据“执法力量是有限的”可知，虽然想“平均用力”，每方面都照顾到，但实践中很难做到。A 项“面面俱全”指各方面都能照顾到，没有遗漏疏，符合文意。D 项“百无一失”是形容有充分把握，绝对不会出差错。程度过重，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-035","paperId":"gk2023-xz","num":35,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"开展未成年人网络环境整治，势在必行且________。网络上可能存在的色情、暴力、过度娱乐等有害信息，会对普遍拥有智能设备、全面触网的未成年人产生潜移默化的不良影响。只有________清朗洁净的网络空间，才能让青少年健康成长。实现这一愿景，需要发挥多主体多领域联动优势，________合力，撑起清朗网络蓝天。依次填入画横线部分最恰当的一项是：","options":["蓄势待发创设形成","迫在眉睫构筑集成","任重道远共建汇聚","刻不容缓营造凝聚"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“且”可知，强调并列关系，该空与“势在必行”意思相近，强调立刻要做，B 项“迫在眉睫”比喻事情已到眼前，急迫得就像逼近了眉毛和睫毛一样。D 项“刻不容缓”形容形势非常紧迫，片刻也不能拖延。这两项均符合文意。A 项“蓄势待发”指贮备随时可以展现的实力，待机而发，时态上表示做事之前的准备。C 项“任重道远”比喻肩负的责任重大，并需要长期的艰苦努力。强调长期的状态，而文段强调马上需要做，这两项均不符合文意，排除。第二空根据“只有________清朗洁净的网络空间，才能让青少年健康成长”可知，B 项“构筑”指构造、建筑，D 项“营造”指经营建造、制造，这两项均可和“空间”搭配；第三空搭配“合力”，为抽象的事物，D 项“凝聚”指凝结、聚集。“凝聚合力”也可形容大家一起努力，符合文意。B 项“集成”指聚合而成。多指汇集诸家著作而成丛书，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-036","paperId":"gk2023-xz","num":36,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"随着技术发展，以数字手段为支撑的“沉浸式”“交互式”网上博物馆日益增多，提高了展览的________。但随着智能终端的普及，人们难免会对数字博物馆产生________。博物馆在用数字技术的基础上，也不能忽视实物展览内涵的提升，使之兼备文化和教育功能，突出的特点。依次填入画横线部分最恰当的一项是：","options":["趣味性疲劳寓教于乐","科技性排斥润物无声","便捷性厌倦触手可及","交融性失望与时俱进"],"answer":"A","explanation":"【格木解析】逻辑填空题。第一空根据“以数字手段为支撑的‘沉浸式’‘交互式’网上博物馆日益增多”可知强调网上博物馆可以和人互动，让展览更生动，更吸引人，A 项“趣味性”、D 项“交融性”均符合文意；第二空辨析度不高，第三空根据“使之兼备文化和教育功能”可知，文中要表达的是让人们“既能觉得好玩，又能学到知识”。A 项“寓教于乐”意思是在娱乐中寄托教育的作用，符合文意。D 项“与时俱进”指不断进取，永不停滞。不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-037","paperId":"gk2023-xz","num":37,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"传统戏曲中所蕴含的价值理念以及________的表演节奏，很难与当代青年人的生活节奏与审美趣味相合拍。因而，关于戏曲衰亡的声音________。事实上，戏曲相对于互联网时代知识文化的________、快餐式传播，其可重复欣赏和耐咀嚼的品格显得更为可贵，其特有的艺术价值决定了它不可能退出历史舞台依次填入画横线部分最恰当的一项是：","options":["不疾不徐如雷贯耳碎片化","慢条斯理此起彼伏泡沫化","从容不迫不绝于耳肤浅化","四平八稳甚嚣尘上机械化"],"answer":"B","explanation":"【格木解析】逻辑填空题。第一空根据“很难与当代青年人的生活节奏与审美趣味相合拍”可知强调传统戏曲的表演节奏比较慢，C 项“从容不迫”指人镇定沉着，形容遇事镇定自若，不慌不忙，不符合文意，排除；第二空强调“关于戏曲衰亡的声音”比较多，A 项“如雷贯耳”强调响亮得像雷声传进耳朵里。形容人的名声大，不符合文意，排除；第三空根据“戏曲相对于互联网时代知识文化的________、快餐式传播，其可重复欣赏和耐咀嚼的品格显得更为可贵”可知考查并列关系，该空与“快餐式”的意思相近，且“不可重复欣赏”，即如昙花一现般一下子就消失了，B 项“泡沫化”指像泡沫一样，外表光鲜，容易转瞬即逝，符合文意。D 项“机械化” 指使用机械装备以节省人力的生产方式，也指事物如机械动作般缺少变化，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-038","paperId":"gk2023-xz","num":38,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"没有中华文化沃土的滋养，就不可能有中国特色社会主义制度的________。我们过去对制度的实践基础强调比较多，对制度的文化支撑关注不够。其实，制度绝不只是一系列外在的________行为规范，还是内在文化思维价值认同。这种文化不可能是外来的强加或移植，必须是内在的演化和________。依次填入画横线部分最恰当的一项是：","options":["枝繁叶茂约束性渗透","历久弥新指导性转化","欣欣向荣系统性升华","勃勃生机强制性积淀"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“没有中华文化沃土的滋养，就不可能有中国特色社会主义制度的 ________”可知，强调中华文化作为沃土的滋养了中国特色社会主义制度，让其不断发展。A 项“枝繁叶茂” 形容枝叶繁盛茂密，或比喻家族人丁兴旺，后代子孙多，B 项“历久弥新”指经历长久的时间而更加鲜活，更加有活力，更显价值，C 项“欣欣向荣”指草木长的茂盛，生机勃勃的样子；后用于比喻事业蓬勃发展，兴旺昌盛的景象，D 项“勃勃生机”形容生命力旺盛的样子，四项均符合文意。第二空根据“这种文化不可能是外来的强加或移植”可知，第二空强调“强加”的意思，A 项“约束性”D 项“强制性”都有用某种强迫的力量或行动对付阻力的意思；这两项均符合文意。B 项“指导性”指正确引导思想和行为，C 项“系统性”是指一个层次分明的整体，不同维度的指标处于不同层级，形成一定的秩序、同层级指标之间、指标层与指标层之间具有清晰的逻辑关系，这两项都没有“强加”的意思，不符合文意，排除。第三空根据“必须是内在的演化和________” 可知考查并列关系，和“演化”意思相近，“演化”表示长时间的变化，D 项“积淀”也强调长时间的积累，且“文化积淀”为常用搭配，符合文意。A 项“渗透”强调某种事物或势力逐渐进入其他方面，而文段强调文化自我的改变，并没有改变别的事物，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-039","paperId":"gk2023-xz","num":39,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"环境整治关键要不留死角、不存盲点，光靠人为监管恐怕会________。目前，“互联网+”数字技术已成为环境监测的利器，为生态环境监测布下“天罗地网”，这张网使任何“________”都能充分暴露在数据“阳光”之下，让环境监测和污染防治变得更加________，更加具象。依次填入画横线部分最恰当的一项是：","options":["捉襟见肘一举一动有效","力不从心风吹草动精细","顾此失彼小打小闹动态","收效甚微蛛丝马迹直观"],"answer":"B","explanation":"【格木解析】逻辑填空题。第一空根据“环境整治关键要不留死角、不存盲点”可知强调光靠人为监管是不够的。A 项“捉襟见肘”形容衣服破烂，也比喻困难重重，应付不过来；B 项“力不从心”意思是心里想做而力量不够；C 项“顾此失彼”指顾了这头，丢了那头，形容照顾不过来；三项均符合文意。D 项“收效甚微”指付出的努力基本没什么效果，人为监管是有作用的，这个词语程度过重，不符合文意，排除。第二空根据“为生态环境监测布下‘天罗地网’，这张网使任何‘________’都能充分暴露在数据‘阳光’之下”可知强调任何细小的变化都能暴露出来。B 项“风吹草动”比喻一点点动静或轻微的动荡或变故，符合文意。A 项“一举一动”指人的所有活动，无法体现“细节”，排除。C 项“小打小闹”形容小规模地开展工作，不符合文意，排除。第三空代入验证，B 项“精细”和“具象”词义相近，且能体现各种细节都能暴露出来的意思，符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-040","paperId":"gk2023-xz","num":40,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"竞争与创新总是________。平台反垄断，最终要在抑制垄断与鼓励创新之间达到平衡。所以，一方面，要加快健全市场准入制度、公平竞争审查机制、预防和________滥用行政权力排除限制竞争制度，充分________市场竞争机制的强大动能。另一方面，要引导和激励平台企业把更多精力用在创新上。唯有如此，平台经济方能为全社会注入持久的创新活力。依次填入画横线部分最恰当的一项是：","options":["如影随形约束调控","互为表里杜绝挖掘","相辅相成打击激发","息息相关制止释放"],"answer":"D","explanation":"【格木解析】逻辑填空题。第一空根据“最终要在抑制垄断与鼓励创新之间达到平衡”可知，强调“竞争” 和“创新”关系密切。A 项“如影随形”比喻两个事物关系密切或两个人关系密切不能分离，D 项“息息相关”形容关系非常密切，这两项均符合文意。B 项“互为表里”比喻相互依存，互相接受。文段没有提到“相互接受”，不符合文意，排除。C 项“相辅相成”指两件事物缺一不可，互相补充。侧重于两者之间相互依赖们不能缺少，文中没有体现“不能缺少”，不符合文意。排除。第二空强调不能“滥用权力”。A 项“约束”和D 项“制止”均有使其不再发生的意思。第三空根据“充分________市场竞争机制的强大动能”“平台经济方能为全社会注入持久的创新活力”可知强调要将“动能”激发出来，D 项“释放”符合文意。B 项“调控”强调调整、控制，不符合文意，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-041","paperId":"gk2023-xz","num":41,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"当前，社会治理形势复杂，仅靠职能部门、专业力量远远不够，迫切需要人民群众和社会各界的积极支持与参与，共同创造公共价值。众包是公众和外包的组合词，意指发包方依托互联网或其衍生工具，在数字平台上设计规则与任务并向广泛、非确定的公众发包，公众根据自身能力自愿接包并完成特定事务。众包强调大众参与的开放式合作，促使组织边界向更广泛的大众群体开放，旨在挖掘隐藏在公众中的巨大潜力。因此，相较于政府购买等专业性较强的政府合同外包服务，政府众包展现出更开放的社会治理格局。最适合做这段文字标题的是：","options":["“互联网+”：公共管理新范式","政府众包：公众参与社会治理新方式","众包：共享经济下的新型用工模式","公众参与：开放式合作的新形式"],"answer":"B","explanation":"【格木解析】标题填入题。第一句通过“当前”作为背景阐述当前社会治理形势复杂的问题，指出需要人民群众和社会各界的积极支持与参与，共同创造公共价值。第二句、第三句具体阐述了众包的内涵，即大众参与的开放式合作，第四句通过结论词“因此”提出主旨句：政府众包展现出更开放的社会治理格局。B 项“政府众包：公众参与社会治理新方式”符合文意。格木提醒：A 项、C 项、D 项都没有提到文段主体“政府众包”，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-042","paperId":"gk2023-xz","num":42,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"在市场经济时期，劳动密集型制造工厂普遍采用流水线技术，工人被高度“去技能化”，几乎不需要技能便可完成装配操作，企业没有需求也没有动力去培养中高级技术工人。但是，当一个国家的产业结构向中高端迈进时，高水平职业教育的支撑作用就会显现出来。技术进步与人力资本相互影响、相互促进：企业引进的高端生产线，需要技术工人去操作和维护，否则技术改造和升级就无法实现；如果没有配套的职业技能培训体系，企业的转型升级就难以达到预期效果。这段文字意在说明：","options":["技术进步对人力资本提出了更高要求","“技工荒”会随产业结构升级更趋严重","产业结构转型升级需要职业教育的支撑","职业技能培训需求与经济增长有相关性"],"answer":"A","explanation":"【格木解析】意图判断题。第一句强调了在市场经济时期，流水线上的工人几乎不需要技能，企业也无需去培养中高级技术工人，第二句通过转折词“但是”提出重点，即在产业结构向中高端升级时，高水平职业教育的支撑作用会体现出来。第三句具体描述技术进步和人力资本、企业高端生产线需要技术工人、企业的转型升级，进一步论证了前文的观点。所以文段重点在强调：高水平职业教育对于产业结构升级的支撑作用， A 项符合文意。格木提醒： B 项，缺少主体“职业教育”和“产业结构”，排除； C 项，“技工荒”无中生有，排除； D 项，“经济增长”无中生有，文段重在强调“产业结构升级”，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-043","paperId":"gk2023-xz","num":43,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"作为经典的艺术门类，绘画在历史长河中并非独立发展。在原始艺术中，音乐、诗歌、舞蹈三位一体，密不可分，绘画则将载歌载舞的场景留存于世。不同艺术门类成熟之后各自独立，但在发展的过程中又相互吸收、相互依托、相互影响。各艺术门类之间的吸收与借鉴、配合与结合，是艺术发展创新的重要手段。古典名画是人类审美情趣的集中体现，很长一段时间是深藏在博物馆中的高雅艺术，名画想要真正“活”化，还需要借助跨界融合。这段文字意在强调：","options":["古典名画可以借助跨界融合重焕生机","绘画是诗歌和舞蹈传承的重要载体","不同艺术门类的跨界融合由来已久","打破形式壁垒是艺术创新的重要手段"],"answer":"C","explanation":"【格木解析】意图判断题。第一句提出绘画并不是独立发展，第二句指出绘画可留存载歌载舞的场景。第三句通过转折关联词“但”强调不同艺术门类的相互借鉴融合对于艺术发展非常重要。第四句继续强调个艺术的融合发展的重要性，第五句通过“需要”引出重点对策，古典名画需要借助跨界融合来实现真正“活”化。所以文段的重点在尾句对策，强调古典名画需要跨界融合，C 项符合文意。格木提醒： A 项为转折之前的内容，非重点，排除； B 项没有提到主体“绘画”，且不是对策描述，排除； D 项“形式壁垒”无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-044","paperId":"gk2023-xz","num":44,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"火山灰是指火山爆炸性喷发形成的、直径小于2毫米的喷发碎屑。在爆炸性火山活动中，围岩和岩浆被炸碎成细小的颗粒从而形成火山灰。火山灰从火山口喷发到大气中，经过大气搬运再沉降到各类环境中，整个过程通常只有数年左右。从地质时间尺度来看，几乎是瞬时的，所以在各种地质记录中，火山灰是一种高精度的绝对时间标志层。火山灰年代学研究是利用地质记录中的火山灰层来确定地质年代的科学，该学科可以解决一些重要的科学问题，比如大型火山喷发事件与气候变化、人类演化之间的成因联系，以及气候快速变化事件的区域差异等。这段文字主要介绍了：","options":["火山灰的形成过程与主要特点","火山灰在自然环境中的分布状态","火山喷发对环境和人类的影响","火山灰年代学的研究思路和价值"],"answer":"B","explanation":"【格木解析】主旨概括题。第一句介绍了火山灰的基本特点，第二句指出爆炸性火山活动让火山灰形成，第三句指出火山灰形成的过程非常短，第四句通过结论词“所以”进行总结，指出在各种地质记录中，火山灰是一种高精度的绝对时间标志层，第五句指出火山灰年代学正是利用地质记录中的火山灰层来确定地质年代的科学，并提出对策，该科学可以解决一些重要的科学问题，最后通过“比如”进行举例论证。文段为分总结构，尾句的对策为重点，强调了火山灰年代学是一门利用火山灰层来确定地质年代的科学，并且还可以解决一些重要的科学问题，B 项符合文意。 A 项、C 项、D 项都没有提到主体“火山灰年代学”，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-045","paperId":"gk2023-xz","num":45,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"________________，十八大以来，国内外形势新变化和实践新要求，迫切需要我们从理论和实践的结合上深入回答关系，党和国家事业发展，党治国理政的一系列重大时代课题，我们党勇于进行理论探索和创新，以全新的视野深化对共产党执政规律，社会主义建设规律，人类社会发展规律的认识，取得重大理论创新成果，集中体现为新时代中国特色社会主义思想。填入画横线部分最恰当的一项是：","options":["马克思主义是我们立党立国，兴党兴国的根本指导思想","坚持和发展马克思主义，必须同中华优秀传统文化相结合","推进马克思主义中国化时代化是一个追求真理、揭示真理、笃行真理的过程","我们必须坚定历史自信、文化自信、坚持古为今用、推陈出新"],"answer":"D","explanation":"【格木解析】语句衔接题。横线居首，且横线后为句号，需总结后文。后文先提到对策：需要我们理论和实践进行结合，接着说明理论探索和创新的成果即为新时代中国特色社会主义思想。理论和实践的结合中的“理论”即马克思主义，“实践”即中国实际发展情况。D 项符合文意，“马克思主义中国化时代化”即理论和实践的结合，“追求真理”即“进行理论探索和创新”，“揭示真理”即“取得重大理论创新成果”。格木提醒： A 项仅强调了理论，未提到实践，排除； B 项“中华优秀传统文化”无中生有，排除； C 项“文化自信”无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-046","paperId":"gk2023-xz","num":46,"year":2023,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"肺鱼是一类可以用“肺”呼吸的肉鳍鱼，它们的“肺”是特化的鱼鳔，能吸收空气。这一特殊技能能使其可以摆脱水的束缚，在河水干涸时潜入洞穴，躲在分泌物形成的茧中，等待雨季到来。此外，肺鱼还是能“啃硬骨头”的鱼，它们咬合力强大，一些带壳的无脊椎动物也是其捕食对象。这种能吃带壳动物的能力，被称为食壳性或甲食性。泥盆纪早期的奇异鱼被认为是最原始的肺鱼，它已经具有典型的肺鱼食壳性特征，比如有发达的齿板与短而粗壮的下颌。而杨氏鱼的系统发育位置较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键。这段文字接下来最可能介绍：","options":["关于杨氏鱼的最新研究成果","动物食壳性特征的产生原因","肺鱼在生物演化史上的重要意义","杨氏鱼与其他泥盆纪物种的区别"],"answer":"A","explanation":"【格木解析】文段推断题。下文推断类，观察尾句。尾句强调杨氏鱼的系统发育位置较奇异鱼更为原始，是研究肺鱼类食壳性起源的关键，后文应继续围绕如何研究“杨氏鱼”展开论述，A 项符合文意。格木提醒： B 项、C 项都没有提到“杨氏鱼”的话题，话题不一致，排除；D 项“其他泥盆纪物种”无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-047","paperId":"gk2023-xz","num":47,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在1990年著作权法规定保护办法另行规定，但时隔三十余年，保护办法仍未出台。尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨论、提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立法，但因质疑声音过大而夭折。作者可能赞同下列哪一观点：","options":["通过公法保护民间文学艺术作品是最可行的路径","民间文学艺术作品法律保护缺位状态亟需改变","围绕民间文学艺术作品法律保护的争议流于表面","国家版权局应就民间文学保护倾听多方面意见"],"answer":"D","explanation":"【格木解析】主旨概括题。第一句指出我国认识到保护民间文学艺术作品的重要性，并在著作权法中规定对保护办法另行规定。第二句通过“但”表转折，指出当前民间文学艺术作品的保护办法仍然没有出台。第三句提到“学界”就民间文学艺术作品提出法律保护；“个别学者”也有主张通过公法加以保护；“国家版权局” 也加快推进相关立法，但因受到强烈质疑而夭折。即后文通过三个方面描述了民间文学艺术作品法律保护依然是缺失的，则作者的观点可能是呼吁：出台民间文学艺术作品的保护法，D 项符合文意。格木提醒： A 项“通过公法保护民间文学艺术作品”为“个别学者”的观点，排除； B 项“流于表面”无中生有，排除； C 项只能对应“国家版权局”的观点，且“应”对策无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-048","paperId":"gk2023-xz","num":48,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"传统X射线在对抗癌细胞时，无法主动辨别正常细胞和癌细胞，在进入人体后实施无差别杀伤。与之不同，重离子束在穿越生物组织的过程中，不会在沿途不断地释放能量，而会在某个深度形成一个剂量高峰，科学界称之为“布拉格峰”。也就是说，在穿透过程中，重离子束只是路过，并不施加伤害；当它到达癌细胞时，才开始杀敌。这样，正常细胞终于可以不再被误伤，这有利于保护正常组织和关键器官。根据这段文字，与传统射线相比，重离子束：","options":["具有更强的“穿透力”","能精确“区分敌我”","堪称“蒙面杀手”","采用“游击战术”"],"answer":"D","explanation":"【格木解析】细节理解题。 A 项，文段并未提及和“蒙面”有关的内容，无中生有，排除； B 项，文段并未提及“重离子束”采用的具体方式，无中生有，排除； C 项，文段并未提及“重离子束”的穿透力，无中生有，排除； D 项，根据“也就是说，在穿透过程中，重离子束只是路过，并不施加伤害；当它到达癌细胞时，才开始杀敌。”可知，“区分敌我”符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-049","paperId":"gk2023-xz","num":49,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"传统成像技术都是对视域内的物体进行观测，非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现“视线拐弯”“隔墙观物”，极大地拓展了人类的成像能力。这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统。整个过程激光经历了3次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构。然而，由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题. 关于非视域成像技术，这段文字未提及：","options":["突出优势","基本原理","技术难题","应用前景"],"answer":"C","explanation":"【格木解析】细节理解题。 A 项根据“这一技术的实现过程通常是将激光脉冲发射到中介墙上，利用中介墙使激光散射到被遮挡的非视域场景中，该场景中的隐藏物体再次将激光散射到中介墙上，最终由中介墙散射至接收系统，整个过程激光经历了3 次漫反射，通过记录光量子的飞行时间实现对非视域场景的重构”可知，“基本原理”已提及，排除； B 项根据“非视域成像技术则能够对隐藏在视线外的物体进行拍照，实现‘视线拐弯’‘隔墙观物’，极大地拓展了人类的成像能力”可知，“突出优势”已提及，排除； C 项文段并未提及“应用前景”； D 项根据“由于激光经过多次漫反射，整个光路存在巨大的衰减，使得非视域成像目前仅能在实验室内进行短距离的原理性验证。此外，多次漫反射导致的时空信息混杂，使得成像算法成为一个科研难题”可知，“技术难题”已提及，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-050","paperId":"gk2023-xz","num":50,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"事实推定是指法官在确证基础事实之上，借助经验法则推定待证事实的一种说法认知方法，这实际上是法官价值判断的过程，受个人经验、情感、家庭背景等因素的影响，法官进行价值判断时可能具有个体特征，价值判断联通了基础事实与推定事实，对各类事实所作的价值判断不同，得出的判决结论也将不同，因此，________________。填入画横线部分最恰当的一项是：","options":["程序正义有助于减少法官个体差异对判决的影响","需要对事实推定中的价值判断进行规范","对事实推定价值判断的说理可提升判决的可接受性","价值判断不仅要符合形式合理性也要及时回应社会关切"],"answer":"B","explanation":"【格木解析】语句衔接题。横线居末，横线前为因果关联词“因此”，横线处内容应总结前文。文段开头指出事实推定实际上是法官价值判断的过程，受到各种因素的影响。接着指出法官进行价值判断时受到各种影响后，最终得出的判决结论也不同，所以文段重在强调，法官在事实推定中，对于价值判断的不同可能会影响判决结论，横线处应该针对这一问题提出对策，B 项符合文意。 A 项“对事实推定价值判断的说理”无中生有，排除； C 项“程序正义”无中生有，排除； D 项“要符合形式合理性也要及时回应社会关切”无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-051","paperId":"gk2023-xz","num":51,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"“高精尖”产业是辐射带动力强的产业集群，对经济具有极强的拉动作用，不仅能实现中心城市的经济高质量发展，而且能带动周边地区的产业联动转型。京津冀协同发展中，产业对接协作是区域战略的核心内容之一，产业升级是三地的共同任务。在疏解非首都核心功能的过程中，天津和河北是北京产业转移的主要承接者。然而，两地仅简单承接北京转移的一般产业是远远不够的，迫切需要发展“高精尖”产业，带动区域科技创新与成果转化，促进区域产业联动，形成经济协同发展的格局。这段文字意在说明：","options":["“高精尖”产业承担着高水平创新的重大使命","形成“高精尖”产业是城市群建设的长远目标","我国区域经济发展应以“高精尖”产业为依托","“高精尖”产业对京津冀协同发展有重要意义"],"answer":"C","explanation":"【格木解析】语句排序题。观察首句。②句指出有些生鲜平台的商业模式为“自来水模式”，④句指出消费者粘性对生鲜电商平台的重要性，均可作首句。观察②句提到“自来水模式”，⑤句提到了“自然垄断”，⑥ 句提到了“自然垄断”最普遍出现的行业是“自来水行业”，所以②⑤⑥应该捆绑在一起，排除BD 项，观察AC 项，①提到“同样”，且一直提到“企业成本”的问题，所以①前也应该提到“企业成本”，只有④提到了“企业成本”，所以应该④①捆绑，且④在①前，排除A 项，故正确答案为C。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-052","paperId":"gk2023-xz","num":52,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"要推动老旧小区的适老化改造和无障碍环境建设，关键是提升整个社会对适老化改造的思想认识，实现适老化改造特别是居家适老化改造“心理无障碍”。要多渠道、全方位宣传引导居家适老化改造的政策与价值，转变老人、子女和社会对居家适老化改造的认知；同时，要通过养老服务中心、居家养老服务中心等载体，打造居家适老化改造样板房，强化直观感受，转变老人的传统观念，让老人逐步形成“为养老服务埋单”、子女更加关注父母居家养老环境的社会意识，提升适老化改造的家庭主观能动性。这段文字强调要：","options":["加强宣传引导。做到适老化收造“心理无障碍”","平衡主体利益，因地制宜推动适老化改造","统筹多方资源，激活适老化改造的多元力量","补住标准规范，提升适老化改造的品质与效率"],"answer":"A","explanation":"【格木解析】语句排序题。观察首句。②句指出“骨关节病软骨退变”的关键致病机制，④句指出“关节软骨渐进性退变”的话题，根据逻辑，应先引出话题，再具体论述致病机制，④句更适合作为首句，排除CD 两项。观察AB 两项，④②还是④③，②句继续论述“骨关节病软骨退变”的话题，是对④句的具体论述，逻辑通顺。③句的话题为“软骨病理性钙化”与④句话题不一致，排除B 项。验证A 项，逻辑连贯，语句通顺。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-053","paperId":"gk2023-xz","num":53,"year":2023,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①同样，市场规模更大的企业将能够更好地摊薄其供应链成本，从而在低毛利环境中生存下来，打败竞争对手 ②有些生鲜平台称呼其商业模式为“自来水模式”，立志要让好的食材像自来水一样，触手可得 ③在互联网领域，生鲜电商能否盈利不是问题，谁能成为最后的赢家才是问题 ④由于生鲜电商平台具备很强的消费者粘性，先占据更多核心区消费者的企业便能获得先发优势，后进入者往往需要付出更高的获客成本 ⑤这种现象在经济学上被称作“自然垄断”，即某些产品和服务由单个企业大规模生产经营比多个企业同时生产经营更有效率 ⑥而“自来水行业”便是自然垄断最普遍出现的行业将以上6个句子重新排列，语序正确的是：","options":["②⑤⑥①④③","②④⑤①③⑥","④①⑤②⑥③","④⑤③①②⑥"],"answer":"D","explanation":"【格木解析】意图判断题。文段第一句指出“高精尖”产业对经济的拉动作用，第二句提到京津冀协同发展中的区域战略和任务就是产业对接协作和产业升级，并指出天津和河北是北京产业转移的主要承接者，第三句通过转折关联词“然而”提出，两地仅简单承接北京转移的一般产业是远远不够的，并通过“需要”引出重点对策，要发展“高精尖”产业，以实现协同发展。文段的重点为尾句对策，即发展“高精尖”产业对实现协同发展的重要性，D 项符合文意。格木提醒： A 项，提到了“高精尖”产业，但没有提到“京津冀协同发展”，排除； B 项，“城市群建设的长远目标”无中生有，且没有提到“京津冀协同发展”，排除； C 项，提到了“高精尖”产业，但没有提到“京津冀协同发展”，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-054","paperId":"gk2023-xz","num":54,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"①这会使病情恶化，并最终导致相关的关节功能障碍 ②大量临床及基础研究显示，软骨病理性钙化是导致骨关节病软骨退变的关键致病机制之一 ③软骨病理性钙化通过诱导软骨细胞表型改变，最终呈现出一种病理状态。 ④关节软骨渐进性退变是骨关节病最主要的病理改变 ⑤这些病态的软骨细胞通过有丝分裂增加自身数量，并通过分泌炎症因子、降解软骨基质引发组织炎症，最终发生凋亡 ⑥凋亡小体在吸收钙离子后又会成为新的病理性矿化结晶，循环往复，致使软骨退变加重、剥脱","options":["④③⑤①②⑥","④②③⑤⑥①","②③⑤⑥④①","②⑤④③①⑥"],"answer":"D","explanation":"【格木解析】主旨概括题。第一句通过“关键是”提出对策，提升整个社会对适老化改造的思想认识，实现适老化改造特别是居家适老化改造“心理无障碍”，即对策是强调思想和心理上的转变，第二句具体通过 “要……同时……要……”的句式围绕如何实现“思想认识”“居家适老化改造‘心理无障碍’”的对策进行具体论述，文段为总分结构，重在强调通过宣传和引导的方式实现适老化改造“心理无障碍”，D 项符合文意。格木提醒： A 项，“因地制宜推动适老化改造”无中生有，排除； B 项，强调“激活适老化改造的多元力量”，而文段的意思并不是各方的力量不活跃，而是强调重点为“思想上”“心理上”的转变，排除； C 项，“补位标准规范”，无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-055","paperId":"gk2023-xz","num":55,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"科学家早就知道月球有两面：面向地球的一面较为平坦，背向地球的一面凹凸不平，遍布撞击坑。月球为何具有截然不同的两副面孔，是其众多谜团之一。近日，科学家提出一种全新解释：数十亿年前，形成月球背面盆地的巨大撞击，产生了足以传遍月球的巨大热量，促成月幔物质的熔化，其中的稀土和放射性生热元素钍以及钾、磷等被携带到与撞击区域对称的月面，形成克里普岩，分布在月球正面风暴洋及其周围。放射性生热元素的集中，产生了月球表面的熔岩流，最终形成月球正面的火山平原。最适合做这段文字标题的是:","options":["盆地与平原：两副面孔，两种材质","月球上的熔岩流：亟待开发的宝藏","双面月球：一次撞击，两种结局","放射性生热元素：月球的化妆师"],"answer":"C","explanation":"【格木解析】标题填入题。第一句话介绍了月球的两面，第二句提出问题：月球为何具有截然不同的两副面孔。第三句提出专家的解释：说明月球背面盆地的巨大撞击最终形成了正面的火山平原。文段为分总分结构，强调月球有截然不同的两副面孔的原因是撞击。C 项符合文意。格木提醒：A 项没有提到主体“月球”，排除；BD 都没有提到月球的两面，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-056","paperId":"gk2023-xz","num":56,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"生态修复请求分为生态修复的行为请求和费用请求。前者是为了防止生态环境权益损害的发生或扩大，请求责任人停止污染破坏行为；当被破坏的生态环境无法恢复时，请求责任人进行人工修复。如果责任人不具有修复能力或意愿，可请求责任人承担修复费用。因此，修复行为请求应作为首要诉求，在责任人不能或不愿进行修复时，才能提出修复费用请求。在司法实践中，很多公益诉讼人却往往将修复费用请求作为首要诉求，但由于诉求和判决的修复费用数额不易确定，责任主体短期内难以承担修复费用，生态修复工作很难有效开展。这段文字意在说明:","options":["应该制定生态修复费用的分级标准","修复费用请求往往很难得到有效落实","应根据责任人的能力确定生态修复诉求","生态修复诉讼应当首先提出修复行为请求"],"answer":"D","explanation":"【格木解析】意图判断题。第一句介绍生态修复请求分为“行为请求”和“费用请求”。第二句和第三句分别对“行为请求”和“费用请求”的使用情况进行了解释。第四句通过结论词“因此”引导重点对策：“修复行为请求应作为首要诉求”，而“修复费用请求”在“在责任人不能或不愿进行修复时”才能提出。最后一句进行详细解释：如果不将修复行为请求应作为首要诉求，会带来一系列负面结果。第四句的对策句是全文的重点，强调生态修复诉讼应当首先提出修复行为请求。D 项符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-057","paperId":"gk2023-xz","num":57,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"在银河系中，恒星形成于巨型分子云的引力塌缩，而塌缩的残留物会围绕着新生的恒星转动，形成一个富含尘埃的气体盘，称为“原行星盘”。在年轻恒星中，周围存在原行星盘的比例会随恒星年龄增长而下降，存在的时长中值约为 200 万~300 万年。然而，正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型，对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星。根据这段文字，下列说法正确的是:","options":["恒星和原行星盘的存在时间大致相同","原行星盘是类地行星形成中的必经阶段","巨型分子云引力塌缩后随即形成行星和恒星","行星在运动中不断从原行星盘中获取所需物质"],"answer":"B","explanation":"【格木解析】细节理解题。 A 项“存在时间大致相同”无中生有，排除； B 项根据“对于类似地球的其他行星而言，经历了原行星盘阶段，早期物质至少演化成了行星胚胎，并在原行星盘消散后经历进一步的碰撞和演化，最终形成现在的类地行星。”可知，经历了原行星盘阶段之后才有类地行星的形成，符合原文； C 项“随即形成行星和恒星”无中生有，排除； D 项根据“然而，正是通过原行星盘获得气体及所需物质，许多行星才能在这短短几百万年内大致演化成型”可知，“运动中”，无中生有，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-058","paperId":"gk2023-xz","num":58,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"从“市场体系”到“统一市场”再到“全国统一大市场”，实际就是从建设市场到建设一体化市场，再到建设大市场和强市场。我们的市场人均收入和消费水平低，虽然人口多，但是市场呈现为行政分割状态，因此只是潜在规模大，实际规模并不具有竞争优势。对此，除了要通过深化改革，释放生产力、提升工资水平、分好国民收入这块蛋糕，还要处理好两个重要问题：一是大力纠正导致市场分割的因素；二是加快资本市场化建设，提高财产性收入比重。这是在扩大工资占比条件受限的前提下，迅速做大做强市场的关键。这段文字针对的主要问题是：","options":["行政区域分割和非一体化抑制了有效竞争","消费需求疲软阻碍了全国统一大市场的形成","财产性收入在国民收入中的比重还比较低","我国市场潜在规模优势还未转化为现实优势"],"answer":"D","explanation":"【格木解析】主旨概括题。第一句提出了“市场体系”、“统一市场”、“全国统一大市场”三个话题的意思。第二句通过结论词“因此”提出问题：我国市场潜在规模大，实际规模并不具有竞争优势。第三句通过“对此” 提出解决的对策。根据设问：“这段文字针对的主要问题是”，所以找到文段的问题即：我国市场潜在规模大，实际规模并不具有竞争优势，D 项符合文意。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-059","paperId":"gk2023-xz","num":59,"year":2023,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"颠覆性技术在军事领域的应用，使现代空袭作战向陆、海、空、天、电、网等领域发展。电子战飞机、预警指挥机在现代空袭体系中的作用愈发重要;第四代隐身飞机投入实战大大增强了空袭体系的突防能力;空射导弹等精确制导弹药智能化水平，抗干扰能力和目标识别能力增强，作战实单大大提高，未来将进一步提高精确制导弹药的命中精度，空袭体系的精确打击能力将进一步增强。同时，运用小型或超小型无人机，在战场上会重要目标实施“蜂群”式打击，会给重要目标的防护造成很大困难这段文字意在说明:","options":["颠覆性技术提高了空袭作战的综合打击能力","军事领域的颠覆性技术研究取得突破性进展","精确打击能力的增强提升了空袭作战的效能","智能化时代的空中防御体系面临着空前挑战"],"answer":"D","explanation":"【格木解析】意图判断题。第一句提到颠覆性技术在军事领域的应用拓展了空袭作战的领域。第二句举例了电子战飞机、预警指挥机、第四代隐身飞机、空射导弹等智能武器来说明它们突防能力越来越强，也加大了对空袭体系的打击力度，换句话说现在对于空袭的防护会越来越困难。第三句通过“同时”引导并列，提到了小型或超小型无人机也会给重要目标的防护造成很大困难。整个文段为分分结构，强调现在空中防御体系面临着各方面的挑战。D 项符合文意。格木提醒： A 项“颠覆性技术”为第一个分述内容，表述片面，排除； B 项“颠覆性技术”为第一个分述内容，表述片面，排除； C 项“精确打击能力”为“空射导弹”例子的内容，非重点，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-060","paperId":"gk2023-xz","num":60,"year":2023,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"立案登记制改革的初衷是保护当事人依法享有的诉权。所谓“有案必立、有诉必理”，只是指那些符合法律规定立案条件的案件，起诉到人民法院后，法院必须立案，否则法院就没有必要受理，所以，________________ 。对此，可能有人认为，设立立案标准等于为立案设置了门槛，很难保障当事人通过诉讼解决纠纷的权利。其实任何权利都有限度，不存在没有边界的权利，当事人通过诉讼解决纠纷的权利同样如此。只有符合立案标准，这种权利才能通过法院诉讼得以实现。填入画横线部分最恰当的一项是:","options":["不能将“立案难”与司法公正简单关联起来","明确立案标准才能保障当事人的合法权益","推行立案登记制并不意味着“是案就立”","应正确理解司法资源作为公共产品的有限性"],"answer":"B","explanation":"【格木解析】语句衔接题，横线居中，承上启下。横线前强调立案登记制改革的初衷是保护当事人的权利。并通过“有案必立、有诉必理”强调了立案登记制改革的初衷就是为了保证案件要符合立案条件。横线后在讨论设立立案标准是否能保证当事人通过诉讼解决纠纷的权利。所以横线前后文都提到了“立案标准”和“当事人权利”两个话题，B 项符合文意。格木提醒： A 项没有提到两个话题，且“司法公正”无中生有，不符合文意； C 项没有提到“当事人权利”的话题，不符合文意； D 项没有提到两个话题，且“公共产品的有限性”无中生有，不符合文意。第三部分数量关系","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-061","paperId":"gk2023-xz","num":61,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"一项工作甲独立完成需要3小时，乙独立完成的用时比其与甲合作完成多4小时，且乙和丙合作完成需要4小时。问丙独立完成需要多少小时：","options":["6","8","10","12"],"answer":"D","explanation":"【格木解析】工程问题。设甲乙合作完成需要t 小时，那么乙独立完成需要t＋4 小时。赋值工作总量为 12，那么甲的效率是4。可列方程：（4＋乙）×t＝乙×（t＋4）＝12，联立解得乙＝2，t=2。又因为乙丙效率之和为3，则丙的效率为1，因此丙独立完成需要12÷1=12 小时。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-062","paperId":"gk2023-xz","num":62,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"在一块正方形土地中，画一条经过某个顶点的规划线，将其分割为三角形和梯形两块土地，且梯形土地的面积正好是三角形土地的2倍。问三角形和梯形土地的周长之比是多少：","options":["1∶2","5∶7","（5+√13）∶（7+√13）","（1+√5）∶（2+√5）"],"answer":"C","explanation":"【格木解析】几何问题。如下图所示，令正方形的边长为3，设AE 的长为x，则DE=3－x。根据三角形和梯形面积计算公式，△ABE 的面积为 x x    ，梯形DEBC 的面积为）（）（ x     x - ；根据“梯形土地的面积正好是三角形土地的2 倍”，则 x x   ）（，解得，x=2。则直角△ABE 的边BE 的长为   ，故△ABE 的周长为     ，梯形DEBC 的周长为      ，即三角形和梯形土地的周长之比是））：（（   。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-063","paperId":"gk2023-xz","num":63,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"已知A、B两种设备定价相同，C设备单价为8000元/台。现A、B两种设备分别打六折、七折促销、购买1台B设备的费用比购买A、C设备各1台的总费用高2万元。问促销期间1000万元预算最多可以购买多少台A设备：","options":["35","51","59","77"],"answer":"C","explanation":"【格木解析】经济问题。设A、B 两种设备每台的定价为x 万元。促销期间，A、B 两种设备分别打六折、七折促销。则A、B 两种设备的售价分别为0.6x 万元、0.7x 万元。根据“购买1 台B 设备的费用比购买 A、C 设备各1 台的总费用高2 万元”，可列出方程：0.7x-（0.6x+0.8）=2，解得x=28 万元。则促销期间一台 A 设备定价为：0.6x=0.6×28=16.8 万元。所以促销期间1000 万元预算可以购买A 设备：1000÷16.8≈59.5 台，即最多可以买59 台A 设备。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-064","paperId":"gk2023-xz","num":64,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某单位有甲和乙2个办公室，分别有职工5人和4人。每周从这9名职工中随机抽取1人下沉社区担任志愿者（同一人有可能被连续、重复选中）。问7月前2周的志愿者均来自甲办公室的概率在以下哪个范围内：","options":["不到25%","25%～35%之间","35%～45%之间","超过45%"],"answer":"B","explanation":"【格木解析】概率问题。根据题意可知，第一周和第二周的总情况均为9 名职工，满足情况均为甲的5 名职工。7 月前2 周的志愿者均来自甲办公室的概率为 %   。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-065","paperId":"gk2023-xz","num":65,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"公园里有一片四边形草坪，沿对角线修建的小道相交于O点，O到四个顶点A、B、C、D的距离之比正好为1:2:3:4，一名工人花费1天正好完成AOB区域的修剪，问第二天至少需要额外增加多少名效率相同的工人一起工作，才能在当天内完成剩余草坪的修剪:","options":["8","10","11","12"],"answer":"B","explanation":"【格木解析】工程问题。根据三角形的性质“等底的两个三角形，面积之比等于高之比”，并且O 到四个顶点A、B、C、D 的距离之比正好为1：2：3：4，可以得到 2   AOD AOB S S △ △ ；根据题意：完成AOB 区域的修剪需要1 名，所以AOD 区域需要2 个人修建。同理可知，OBC 区域需要3 个人；ODC 区域需要6 个人。所以，剩余草坪共需要2+3+6=11 人，则第二天至少需要额外增加：11-1=10 个工人一起工作。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-066","paperId":"gk2023-xz","num":66,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"单位将10个培训名额分配给4个分公司，要求在每个分公司至少分配1个名额的所有分配方案中，随机选择1个方案实施，问4个分公司中有3个分配名额数量相同的概率为多少：","options":["3/50","1/10","3/25","1/7"],"answer":"D","explanation":"【格木解析】概率问题。根据题意和分配插板法，总情况数有：     种。满足要求的情况数有：①1、1、1、7；②2、2、2、4；③3、3、3、1，而每一种情况又有4 种情况，即符合要求的情况数为： 4×3=12 种。所求概率 p   。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-067","paperId":"gk2023-xz","num":67,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某次会议邀请4所高校每所各2位学者作报告。在某日上午、下午和晚上的三个时间段分别安排3位、3位和2位学者依次作报告，且同一所高校的2位学者不安排在同一时间段内作报告。问8人的报告次序有多少种不同的安排方式:","options":["不到5000种","5000～10000种之间","10001～20000种之间","超过20000种"],"answer":"C","explanation":"【格木解析】排列组合问题。上午：      ；上午：    ；晚上： 2  ；因此，8 人的报告次序有192×36×2=13824，在10001～20000 种之间。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-068","paperId":"gk2023-xz","num":68,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"一辆汽车从甲地开往乙地，先以40千米／小时的速度匀速行驶一半的路程，然后均匀加速；行驶完剩下路程的一半时，速度达到80千米／小时；此后均匀减速，到达乙地时的速度正好降为0。问其全程的平均速度在以下哪个范围内：","options":["不到44千米/小时","在44～45千米/小时之间","在45～46千米/小时之间",".超过46千米/小时"],"answer":"A","explanation":"【格木解析】行程问题。赋值整个路程为4 千米，根据题意，路程可以分为三个阶段，每阶段的距离分别为2 千米、1 千米、1 千米。第二个阶段为匀加速，平均速度为   千米/小时，第三个阶段为均减速，平均速度为   千米/小时。等距离平均速度公式可知第二阶段和第三阶段的平均速度为     千米/小时，此时第一阶段和二、三阶段的距离和相等，再次利用等距离平均速度公式，     千米/小时，即不到44 千米/小时。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-069","paperId":"gk2023-xz","num":69,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙三家科技企业2021年的收入之和比2020年提升了20％。其中甲企业的收入上升了400万元，乙企业的收入下降了100万元且是甲企业收入的一半，丙企业的收入上升了30％且其2020年的收入与甲、乙两企业同年收入之和相同。问2020年甲企业的收入比乙企业高多少万元：","options":["900","400","1100","600"],"answer":"D","explanation":"【格木解析】经济问题。设2020 年甲企业的收入为2x（万元），根据题意可列下表：甲乙丙总 2020 年 2x x+300 3x+300 6x+600 2021 年 2x+400 x+200 3.9x+390 6.9x+990 可列方程：6.9x+990=1.2·（6x+600），解得x=900 万元。则2020 年甲企业的收入比乙企业高：2x- （x+300）=x-300=600 万元。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-070","paperId":"gk2023-xz","num":70,"year":2023,"region":"国家","module":"数量关系","sub":"数学运算","stem":"一个圆柱体零件A和一个圆锥体零件B分别用甲、乙两种合金铸造而成。A的底面半径和高相同，B的底面半径是高的2倍，两个零件的高相同，质量也相同。问甲合金的密度是乙合金的多少倍：","options":["4/3","3/4","2/3","3/2"],"answer":"A","explanation":"【格木解析】几何问题。令A、B 零件的高为1，则A 零件半径为1，B 零件半径为2。根据圆柱体体积公式可得A 零件的体积为       V ；又根据圆锥体体积可得B 零件的体积为        V 。又因为质量相同，体积与密度成反比。可知A、B 两零件的体积之比为  π：：  V V =3：4，那么密度之比为  ： =4：3，即甲合金的密度是乙合金的4/3 倍。第四部分判断推理一、图形推理","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-071","paperId":"gk2023-xz","num":71,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"【格木解析】图形推理-位置类-静态位置。题干中每幅图形均由1 个黑色区域和4 个白色区域组成，排除A 项，并且黑色区域和三个白色区域线连接，和一个白色区域间隔，排除BD 两项，只有C 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-072","paperId":"gk2023-xz","num":72,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"D","explanation":"【格木解析】图形推理-属性类-对称性。题干中每幅图形均由内外两部分组成，考虑内外两部分分开看，外部均为轴对称图形，内部均为中心对称图形，只有D 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-073","paperId":"gk2023-xz","num":73,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"B","explanation":"【格木解析】图形推理-位置类-旋转。从图1 到图2，最上面一行不同，其他行相同，并且最上面一行的黑色三角形在各自的位置上均顺时针旋转90°；从图2 到图3，最右侧一列不同，其他列相同，并且最右侧一列的黑色三角形在各自的位置上均顺时针旋转90°；从图3 到图4，最下面一行不同，其他行相同，并且最下面一行的黑色三角形在各自的位置上均顺时针旋转90°；从图4 到图5，最左侧一列不同，其他列相同，并且最左侧一列的黑色三角形在各自的位置上均顺时针旋转90°。所以，从图5 到？处，应该只有最上面一行不同，其他行相同，并且最上面一行的黑色三角形在各自的位置上均顺时针旋转90°，只有B 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-074","paperId":"gk2023-xz","num":74,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"A","explanation":"【格木解析】图形推理-样式类-样式运算-黑白叠加。根据第一行列方程如下：黑＋黑=白，白＋黑=白，黑＋白=白，白+白=黑，第二行验证规律符合，第三行用规律，只有A 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-075","paperId":"gk2023-xz","num":75,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"将一张直角三角形形状的线片进行两次行叠，展开后的折线将该三角形分成如图所示的a、b、c、d四个部分，刚两次折叠后纸片投影面积为：","options":["b+d+c-a","b+d-c","b+c-a","b+d-a"],"answer":"D","explanation":"【格木解析】图形推理-数量类-面。先将直角三角形沿着竖直折痕往右进行折叠，如下图所示，此时折叠后的面积为b+d；再将图形沿着水平折痕往下进行折叠，如下图所示，此时折叠后的面积只需减去重合的a 部分即可，即为b+d-a，只有D 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-076","paperId":"gk2023-xz","num":76,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"左图为给定的立体图形，从任一角度看，下面哪项不可能是该立体图形的视图：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"【格木解析】图形推理-立体视图。A 项为该立体图形的主视图，B 项为该立体图形的侧视图或仰视图， D 项从该立体图形的右侧斜后方观察可以得到。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-077","paperId":"gk2023-xz","num":77,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"左图为等大的3个灰色正方体和15个白色正方体所组成的多面体，其可以切割为①、②和③三个小多面体，则代表的多面体可能是：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"A","explanation":"【格木解析】图形推理-立体组合。将图一放平放在最下面一层，将图二倒过来放在最上面一层和第二层的右侧，如下图所示，需要补的即为A 项。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-078","paperId":"gk2023-xz","num":78,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②⑤，③④⑥","①②④，③⑤⑥","①④⑤，②③⑥","①③⑤，②④⑥"],"answer":"C","explanation":"【格木解析】图形推理-数量类-素。题干中每幅图形基本上都由圆和正方形两种元素构成，圆的数量依次为5、0、1、3、4、2，正方形的数量依次为4、1、2、2、3、3，①④⑤中，圆的数量-正方形的数量=1； ②③⑥中，正方形的数量-圆的数量=1，只有C 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-079","paperId":"gk2023-xz","num":79,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①③⑤，②④⑥","①④⑥，②③⑤","①③④，②⑤⑥","①②④，③⑤⑥"],"answer":"D","explanation":"【格木解析】图形推理-数量类-线。图2 为“日”字的变形，优先考虑一笔画与多笔画。图①②④为一笔画图形，图③⑤⑥为两笔画图形，只有D 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-080","paperId":"gk2023-xz","num":80,"year":2023,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是:","options":["①③④，②⑤⑥","①②④，③⑤⑥","①②⑥，③④⑤","①⑤⑥，②③④"],"answer":"B","explanation":"【格木解析】方法一：图形推理-属性类-开闭性。图①②④中有4 个封闭图形；图③⑤⑥中有5 个全封闭图形，只有B 项满足。方法二：图形推理-数量类-面。图①②④中有4 个面；图③⑤⑥中有5 个面，只有B 项满足。二、定义判断","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-081","paperId":"gk2023-xz","num":81,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"微量鉴定是指运用物理学、化学和仪器分析等方法。通过对案件现场有关物质材料（材料特点多为体小量微、不易注意）的成分及其结构进行定性、定量分析，对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定的一种司法鉴定方法。根据上述定义，下列涉及交通事故的鉴定属于微量鉴定的是：","options":["对车辆驾驶人采血，分析血液中的酒精含量，判断驾驶人是否存在酒后驾车嫌疑","现场提取、检验受害人毛发、衣物纤维，认定受害人是否与嫌疑人车辆存在接触","拆解车辆特定部位，查明车辆故障原因，用以鉴定其属手人为责任还是机械故障","通过人体损伤程度检验，确定伤者损伤部位与交通事故伤害后果的关联程度"],"answer":"B","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①对案件现场有关物质材料（材料特点多为体小量微、不易注意）的成分及其结构进行定性、定量分析；②对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定。结合选项：A 项对车辆驾驶人采血，不属于案件现场体小量微、不易注意的物质材料，不符合定义，排除；B 项现场提取受害人毛发，衣物纤维，这些都属于案件现场体小量微、不易注意的物质材料，符合关键词①，并且认定受害人是否与嫌疑人车辆存在接触，也符合关键词②，符合定义，当选；C 项拆解车辆特定部位，查明车辆故障原因，车辆特定部位不属于体小量微，不易注意的材料，并且也不符合对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定，不符合定义，排除；D 项检验人体损伤程度，人体不属于案件现场体小量微、不易注意的物质材料，并且也不涉及对检材的种类、检材和嫌疑样本的同类性和同一性进行鉴定，不符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-082","paperId":"gk2023-xz","num":82,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"架构创新是指组或产品的基本元件不变，但是整体结构布局改变、即将相同元件进行整体结构的重新调整，进而产生新功能的创新，根据上述定义，下列属于架构创新的是:","options":["陶瓷底板电熨斗与传统不锈钢底板电熨斗相比，其底板的耐磨性更强。具有更高的光滑度，使用起来更顺畅","某款手机聊天软件增加了拜年红包功能，用户可以在给亲朋好友发送红包时、编辑拜年吉祥语，自定义红包图片，满足个性化需求","可拆卸手柄锅将原手柄设计成可从锅具上拆卸下来，非提供多个手柄可安装在锅具边缘的任意位置上，满足烹饪需要","某板材厂改良制作工艺，将原来的轧制工序分成两步进行，同时增加砂光工序，生产出满足市场需要的薄板"],"answer":"C","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①组成产品的基本元件不变；②整体结构布局改变； ③进而产生新功能的创新。结合选项：A 项陶瓷底板电熨斗与传统不锈钢底板电熨斗只是改变了底板材质，并未改变整体结构布局，也没有产生新功能，不符合定义，排除；B 项手机聊天软件增加了拜年红包功能，虽然是新的功能，但是不是因为将相同元件进行整体结构的重新调整而产生的新功能，而是新开发的一个功能，不符合定义，排除；C 项提供多个手柄虽然数量多了，但是本质上基本原件还是锅和手柄，符合关键词 ①，可拆卸手柄锅将原手柄设计成可从锅具上拆卸下来，并提供多个手柄可安装在锅具边缘的任意位置上，说明安装手柄的结构布局改变，符合关键词②，满足烹饪需要，说明提供了更多结构调整时的功能选择，比如一个手柄可以做炒锅，两个手柄可以做汤锅等，符合关键词③，符合定义，当选；D 项某板材厂将原来的轧制工序分成两步进行，同时增加砂光工序，只是改良产品的制作工艺，并不涉及将相同元件进行整体结构的重新调整，不符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-083","paperId":"gk2023-xz","num":83,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"民宿是指利用当地民居等相关闲置资源，经营用客房不超过4层、建筑面积不超过800平方米，主人参与接待，为游客提供体验当地自然，文化与生产生活方式的小型住宿设施。根据上述定义，下列属于民宿的是：","options":["王某在市中心有一套两居室的房子，过了马路就是知名的景区公园。王某将闲置房间租给那些节假日来旅游的家庭，并提供导游服务","某家庭农场开发亲子休闲旅游业务，建设了农业科普、亲子游玩场所，为孩子和家长营造一处寓教于乐的乡村乐园","李某通过某网上平台找到心仪城市的会员“交换”旅行，即双方各自为对方提供住宿，住在对方家中深入体验当地的风土人情","张某在古镇上有一所老宅。他和某平台签订合同，将老宅租给该平台运营。该平台将老宅装修，并提供完善的酒店式服务机制"],"answer":"A","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①利用当地民居等相关闲置资源；②经营用客房不超过4 层、建筑面积不超过800 平方米；③主人参与接待，为游客提供体验当地自然、文化与生产生活方式的小型住宿设施。结合选项：A 项王某在市中心有一套两居室的房子，将闲置房间租给那些节假日来旅游的家庭，符合关键词①和②，并提供导游服务，符合关键词③，符合定义，当选；B 项某家庭农场开发亲子休闲旅游业务，未提及该农场是否为闲置资源，也未提及该农场是否有经营用客房，不符合定义，排除；C 项李某与心仪城市的会员“交换”旅行，双方各自为对方提供住宿，不属于经营用客房，不符合定义，排除；D 项张某在古镇上有一所老宅，他和某平台签订合同，将老宅租给该平台运营，说明老宅的主人张某并不提供接待服务，不符合关键词③，不符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-084","paperId":"gk2023-xz","num":84,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"体验式采访是指直接投入到所要报道的新闻实践中去体验生活，以获得新闻报道所需要的素材，以及对新闻事件的认识。根据上述定义，下列不属于体验式采访的是：","options":["某报社要求年轻记者沉入生活，了解基层，以改变写官话、说套话的文风","某作家为了解包身工的悲惨遭遇，深入到工厂中，写出报告文学《包身工》","某记者为了解传销组织的真面目，打入到传销组织内部，揭示传销组织的骗局","某电视台推出专栏《体验三百六十行》，派记者体验各职业一周并进行系列报道"],"answer":"A","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①直接投入到所要报道的新闻事件中去体验生活；② 以获得新闻报道所需要的素材，以及对新闻事件的认识。结合选项：A 项某报社要求年轻记者深入基层以改变写官话、说套话的文风，其目的是改变文风，而不是获得新闻报道所需要的素材，以及对新闻事件的认识，不符合关键词②，不符合定义，当选；B 项某作家深入到工厂中，符合关键词①，其目的是了解包身工的悲惨遭遇，之后写出报告文学《包身工》，报告文学是用文学手段处理新闻题材的一种文体，符合关键词②，符合定义，排除；C 项某记者打入到传销组织内部，符合关键词①，其目的是了解传销组织的真面目以揭示其骗局，符合关键词②，符合定义，排除；D 项记者体验各职业一周，符合关键词①，其目的是了解各行业以完成报道，符合关键词②，符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-085","paperId":"gk2023-xz","num":85,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"伴性遗传是指控制性状的基因位于性染色体上，遗传总是与性别相关联，不同性别出现某一性状的概率不同的遗传。限性遗传是指控制性状的基因位于性染色体上，性状只在一种性别上得以表现，而在另一性别上完全不能表现的遗传。从性遗传是指控制性状的基因位于常染色体上，但由于受到性激素的作用，基因在不同性别中表达不同的遗传。根据上述定义，下列属于限性遗传的是：","options":["抗维生素D佝偻病是伴X染色体显性遗传病，女性发病率高，常表现为世代遗传","人类外耳道多毛症为伴Y染色体遗传病，在家族男性亲属中代代遗传","遗传性斑秃为常染色体显性遗传病，男性会出现早秃，而女性则不会出现","红绿色盲症是伴X染色体隐性遗传病，男性发病率高，表现出交叉遗传和隔代遗传"],"answer":"B","explanation":"【格木解析】定义判断-多定义。定义的关键词为：①控制性状的基因位于性染色体上；②性状只在一种性别上得以表现，而在另一性别上完全不能表现的遗传。结合选项：A 项抗维生素D 佝偻病是伴X 染色体显性遗传病，符合关键词①，但是女性发病率高，说明男性和女性都有可能遗传，只是在女性中出现的概率更高，不符合关键词②，属于伴性遗传，不符合限性遗传定义，排除；B 项人类外耳道多毛症为伴Y 染色体遗传病，符合关键词①，在家族男性亲属中代代遗传，说明该病仅在家族男性中遗传，符合关键词②，符合限性遗传定义，当选；C 项遗传性斑秃为常染色体显性遗传病，说明其控制性状的基因位于常染色体上，不符合关键词①，属于从性遗传，不符合限性遗传定义，排除；D 项红绿色盲症是伴X 染色体隐性遗传病，符合关键词①，但是男性发病率高，说明男性和女性都有可能遗传，只是在男性中出现的概率更高，不符合关键词②，属于伴性遗传，不符合限性遗传定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-086","paperId":"gk2023-xz","num":86,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"预判设计是一种能够引导用户，缩短用户行为路径的有效设计手段。它可以根据用户的行为或用户所在的场景，让功能“主动找到”用户，并让用户与之产生自然的交互，为用户提供更好的使用体验，本质就是为用户多想一步，让用户使用起来尽量简单。根据上述定义，下列不属于预判设计的是：","options":["某翻译软件，用户第一次点击播放，语音速度正常；再次点击，语音速度变慢","某外卖软件，当用户对店家给出差评，系统自动勾选“将评价设为匿名评价”","某购物软件，所选商品缺货时，出现“找相似”按钮，点击可看到同款、相似商品","某购物软件，根据用户输入的搜索关键词，将商品按与关键词的相关性排列"],"answer":"D","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①让功能“主动找到”用户；②为用户多想一步，让用户使用起来尽量简单。结合选项：A 项某翻译软件第一次点击播放，语速正常，再次点击，语速变慢，体现了产品会预判用户可能是第一次没听清楚，从而不用等用户自行操作，第二次主动将语音播放速度变慢，符合关键词①和②，符合定义，排除；B 项某外卖软件，当用户给差评时，系统自动勾选“匿名评价”，因为绝大多数用户给商家差评时都不希望商家看到自己的身份，所以该软件不等用户自行勾选匿名评价，而自动帮用户勾选，符合关键词①和②，符合定义，排除；C 项大多数用户在购物软件上遇到想要的商品缺货时，接下来最可能的就是去找一些相似的商品，所以某购物软件为用户多想了一步，不用等用户自行搜索相似商品，而是当所选商品缺货时，自动出现“找相似”按钮，符合关键词①和②，符合定义，排除；D 项根据用户输入的搜索关键词，将商品按与关键词的相关性排列，仅仅是搜索结果的呈现，并没有体现为用户多想一步，不符合定义，当选。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-087","paperId":"gk2023-xz","num":87,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"负性偏向是指负性信息比其他信息得到优先的注意和加工，这是人类在先天遗传和后天经验基础上存在的一种普遍性认知倾向，即给予负性事物更大的权重，并在注意、记忆、情绪、决策等方面遵循“坏比好重要”的心理原则。根据上述定义，下列没有体现负性偏向的是：","options":["被试对负面词汇的再认正确率比正面词汇高，能更精准识别某负面词汇是否在语料中","“3·15”晚会报道侵犯消费者权益的违法行为，以期政府各级管理部门有效管理","新闻传播过程中，模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读","应聘者的优缺点与职位具有同等相关性，但招聘者往往更关注应聘者的缺点"],"answer":"B","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①负性信息比其他信息得到优先的注意和加工；②在注意、记忆、情绪、决策等方面遵循“坏比好重要”的心理原则。结合选项：A 项被试对负面词汇的再认正确率比正面词汇高，能更精准识别某负面词汇是否在语料中，符合关键词①和②，符合定义，排除；B 项“3·15” 晚会报道侵犯消费者权益的违法行为，只涉及了负性信息，没有体现负性信息与其他信息之间的比较，不符合定义，当选；C 项模糊信息中的一些负面细节更容易被人们关注并作进一步负面解读，符合关键词①和②，符合定义，排除；D 项招聘者往往更关注应聘者的缺点，符合关键词①和②，符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-088","paperId":"gk2023-xz","num":88,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"单元素导语是指在撰写新闻导语（即消息的开头）时，突出表现一个新闻事实的导语。单元素导语按新闻五要素可分为：①何人导语，突出报道显要或影响大的新闻人物；②何事导语，突出报道新闻事实本身；③何时导语，突出报道读者关心的事情什么时候会发生或进行；④何地导语，突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语，突出报道一个事件的起因。根据上述定义，下列导语与其分类对应正确的是：","options":["亲爱的读者，你知道为什么夏天夜空看到的星星比冬天夜空里看到的多？——④","1964年10月16日，我国第一颗原子弹爆炸成功——②","杨先生带着2岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000多元——①","谁是高考状元？这个一年一度的热门话题，今年却在xx省消失了——③"],"answer":"B","explanation":"【格木解析】定义判断-多定义。定义的关键词为：①何人导语：突出报道显要或影响大的新闻人物；② 何事导语：突出报道新闻事实本身；③何时导语：突出报道读者关心的事情什么时候会发生或进行；④何地导语：突出报道一些重要或有特殊意义的地方发生重大变化的消息；⑤为什么导语：突出报道一个事件的起因。结合选项：A 项亲爱的读者，你知道为什么夏天夜空看到的星星比冬天夜空里看到的多？是在报道一个事件的起因，符合关键词⑤，属于为什么导语，排除；B 项1964 年10 月16 日，我国第一颗原子弹爆炸成功，是在突出报道新闻事实本身，符合关键词②，属于何事导语，当选；C 项杨先生带着2 岁的女儿到市医院看病，没想到看一个“咳嗽”就要花1000 多元，是在突出报道新闻事实本身，符合关键词②，属于何事导语，排除；D 项高考状元今年在XX 省消失了，是在报道该省发生的重大变化，符合关键词④，属于何地导语，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-089","paperId":"gk2023-xz","num":89,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"子弹时间即计算机辅助的摄影技术模拟变速特效，是一种使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效，例如强化的慢镜头、时间静止等效果。根据上述定义，下列描述符合子弹时间的是：","options":["通过电视转播，观众们看到滑雪运动员的身体缓慢地在空中划出优美的曲线，翻转瞬间的每个动作都无比清晰","电视剧中，男主角因车祸去世，女主角目睹了这个过程，此后很多年，她的眼前无数次闪现出车祸发生的过程","江阿姨的丈夫去世之后，她每天的大部分时间都用来反复看他们以前拍摄的视频，时间在她身上似乎静止了","科幻小说中，小明因考试结束时还没有答完卷子，祈祷时间暂停，然后他发现时间真的静止了，只有他可以答卷"],"answer":"A","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①是一种使用在电影、电视节目或电脑游戏等领域的摄影技术模拟变速特效；②例如强化的慢镜头、时间静止等效果。结合选项：A 项通过电视转播，观众们看到滑雪运动员的身体缓慢地在空中划出优美的曲线，翻转瞬间的每个动作都无比清晰，符合关键词①和②，符合定义，当选；B 项电视剧中女主角的眼前无数次闪现出车祸发生的过程，并不涉及摄影技术模拟变速特效，不符合定义，排除；C 项江阿姨反复看以前拍摄的视频，并没有涉及到电影、电视节目或电脑游戏等领域，也没有体现摄影技术模拟变速特效，不符合定义，排除；D 项科幻小说中时间静止，并没有涉及到电影、电视节目或电脑游戏等领域，也没有体现摄影技术模拟变速特效，不符合定义，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-090","paperId":"gk2023-xz","num":90,"year":2023,"region":"国家","module":"判断推理","sub":"定义判断","stem":"联合式构词法是由两个意义相同，相反或相对的词根联合起来构成新词的方法，在词内两个词根是平等的、没有主从、正副之分。根据上述定义，下列使用了联合式构词法的是：","options":["“叮当”，因摹拟动作的声音而构成的词","“开关”，由“开”和“关”两个单字组合而构成的词","“椅子”，在单字“椅”后面附加“子”而构成的词","“蹉跎”，由韵母相同的两个单字组合构成意义与单字无关的词"],"answer":"B","explanation":"【格木解析】定义判断-单定义。定义的关键词为：①由两个意义相同，相反或相对的词根联合起来构成新词；②两个词根是平等的、没有主从、正副之分。结合选项：A 项叮和当不属于意义相同，相反或相对的词根，不符合定义，排除；B 项开关指接通、截断或切换电路的电器设备，开和关意思相反，符合关键词①，并且在开关这个词中，开和关两个词根是平等的、没有主从、正副之分，符合关键词②，符合定义，当选； C 项椅和子不属于意义相同，相反或相对的词根，并且在椅子这个词中侧重于椅，即椅为主，子为从，不符合定义，排除；D 项蹉和跎不属于意义相同，相反或相对的词根，不符合定义，排除。三、类比推理","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-091","paperId":"gk2023-xz","num":91,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"铜镜∶化妆镜","options":["木碗∶汤碗","瓷瓶：古瓶","门帘：纱帘","金簪：发簪"],"answer":"A","explanation":"【格木解析】类比推理-逻辑关系-交叉关系。铜镜一般是指由含锡量较高的青铜铸造的镜子，化妆镜一般指专门用于化妆的镜子。前者根据材质命名，后者根据功能命名，两者构成交叉关系。结合选项：A 项木碗根据材质命名，汤碗根据功能命名，两者构成交叉关系，与题干逻辑关系一致，当选；B 项瓷瓶和古瓶构成交叉关系，但是前者根据材质命名，后者根据年代命名，与题干逻辑关系不一致，排除；C 项门帘和纱帘构成交叉关系，但是前者根据悬挂位置命名，后者根据材质命名，与题干逻辑关系不一致，排除；D 项金簪是发簪的一种，两者构成种属关系，与题干逻辑关系不一致，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-092","paperId":"gk2023-xz","num":92,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"小计∶总计","options":["被乘数∶总数","分目录：总目","平均值∶总值","单科分：总分"],"answer":"D","explanation":"【格木解析】类比推理-逻辑关系-包容关系。所有小计相加可以得到总计，小计是总计的组成部分，两者构成组成关系并且两者之间还存在加法运算。结合选项：A 项被乘数和总数两者无明显逻辑关系，与题干逻辑关系不一致，排除；B 项分目录是总目的组成部分，两者构成组成关系，但是两者之间不存在加法运算，与题干逻辑关系不一致，排除；C 项平均值乘以总个数等于总值，与题干逻辑关系不一致，排除；D 项所有单科分相加可以得到总分，单科分是总分的组成部分，两者构成组成关系并且两者之间还存在加法运算，与题干逻辑关系一致，当选。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-093","paperId":"gk2023-xz","num":93,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"脱脂棉∶原棉","options":["黑陶∶黏土","白酒∶烧酒","摄像头∶镜头","视力∶视力表"],"answer":"A","explanation":"【格木解析】类比推理-逻辑关系-对应关系。脱脂棉是指由原棉经除去夹杂物，脱脂、漂白、洗涤、干燥、整理加工制成，两者构成成品与原材料的对应关系。结合选项：A 项黏土是制造黑陶的原材料，两者构成成品与原材料的对应关系，与题干逻辑关系一致，当选；B 项烧酒又称白酒，两者构成全同关系，与题干逻辑关系不一致，排除；C 项镜头是摄像头的组成部分，两者构成组成关系，与题干逻辑关系不一致，排除； D 项视力表是测量视力的图表，两者构成对应关系，与题干逻辑关系不一致，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-094","paperId":"gk2023-xz","num":94,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"海棠红：南瓜橙","options":["苏丹红：景泰蓝","孔雀蓝：柠檬黄","橄榄绿：梅子青","日落黄∶鱼肚白"],"answer":"C","explanation":"【格木解析】类比推理-逻辑关系-并列关系。海棠红和南瓜橙是两种不同的颜色，两者构成并列关系，并且都是根据植物命名的。结合选项：A 项苏丹红是一种人工合成的红色染料，景泰蓝正名“铜胎掐丝珐琅”，是一种在铜质的胎型上，用柔软的扁铜丝，掐成各种花纹焊上，然后把珐琅质的色釉填充在花纹内烧制而成的器物。因其在明朝景泰年间盛行，制作技艺比较成熟，使用的珐琅釉多以蓝色为主，故而得名“景泰蓝”，两者都不是根据植物命名的，与题干逻辑关系不一致，排除；B 项孔雀蓝是瓷器釉色之一，烧制后呈现亮蓝色调的低温彩釉，柠檬黄是一种合成色素，呈鲜艳的嫩黄色，前者根据动物命名，后者根据植物命名，与题干逻辑关系不一致，排除；C 项橄榄绿指像橄榄果实那样的青绿色，梅子青是南宋龙泉窑创制的杰出青釉品种，釉色浓翠莹润，如青梅色泽，故而得名，两者构成并列关系，并且都是根据植物命名的，与题干逻辑关系一致，当选；D 项日落黄是一种食品合成色素，类似日落橙红色，鱼肚白是一种介于白色和淡粉色之间的颜色，近似于鱼腹部的颜色，两者都不是根据植物命名的，与题干逻辑关系不一致，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-095","paperId":"gk2023-xz","num":95,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"匿名投票：实名投票：现场投票","options":["战国文字：象形文字∶古代汉字","金融危机：粮食危机：生态危机","油料作物：糖料作物∶经济作物","早间会议∶午间会议：工作会议"],"answer":"D","explanation":"【格木解析】类比推理-逻辑关系-并列关系+交叉关系。匿名投票和实名投票是两种不同的投票方式，两者构成并列关系，两者和现场投票均构成交叉关系。结合选项：A 项战国文字是战国时期不同地区使用的汉字的统称，象形文字是由图画文字演化而来的一种最古老的字体，如埃及的象形文字、苏美尔文、古印度文以及中国的甲骨文。战国文字是一种古代汉字，两者构成种属关系，有的象形文字是古代汉字，有的古代汉字是象形文字，两者构成交叉关系，与题干逻辑关系不一致，排除；B 项金融危机指金融领域的危机，粮食危机指因粮食供应不足造成的危机，生态危机指生态环境被严重破坏使人类的生存与发展受到威胁的现象，三者构成并列关系，与题干逻辑关系不一致，排除；C 项油料作物是用来提取油脂供食用或工业、医药原料等的一类作物，糖料作物是为制糖工业提供原料的作物，两者构成并列关系，并且两者都属于经济作物，均和经济作物构成种属关系，与题干逻辑关系不一致，排除；D 项早间会议和午间会议是两种不同时间段的会议，两者构成并列关系，两者和工作会议均构成交叉关系，与题干逻辑关系一致，当选。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-096","paperId":"gk2023-xz","num":96,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"春季过敏∶花粉∶喷嚏","options":["肺炎∶咳嗽∶支原体","失眠∶恐惧∶噩梦","秋季腹泻∶饮食∶脱水","乙型脑炎∶病毒∶发热"],"answer":"D","explanation":"【格木解析】类比推理-逻辑关系-对应关系。花粉可能会导致春季过敏，两者构成因果关系，打喷嚏是春季过敏的一种症状表现，两者构成对应关系。结合选项：A 项咳嗽是肺炎的一种症状表现，支原体感染可能会导致肺炎，与题干逻辑关系不一致，排除；B 项恐惧可能会导致失眠，两者构成因果关系，但是噩梦不是失眠的症状表现，与题干逻辑关系不一致，排除；C 项饮食不当可能会导致秋季腹泻，饮食不当和秋季腹泻构成因果关系，而饮食和秋季腹泻不构成因果关系，与题干逻辑关系不一致，排除；D 项病毒可能会导致乙型脑炎，两者构成因果关系，发热是乙型脑炎的一种症状表现，两者构成对应关系，与题干逻辑关系一致，当选。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-097","paperId":"gk2023-xz","num":97,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"资产评估∶审核通过∶股票发售","options":["预订新车∶加装内饰∶购买车险","选购家电∶上门安装∶维修保养","修剪草坪∶设备检修∶园林养护","收看节目∶视频连线∶观众互动"],"answer":"B","explanation":"【格木解析】类比推理-逻辑关系-对应关系。先资产评估，再审核通过，最后股票发售，三者构成时间顺承对应关系。结合选项：A 项加装内饰、购买车险两者之间并不存在必然的先后顺序，车主可根据自身实际情况，选择购买车险的具体时间，与题干逻辑关系不一致，排除；B 项先选购家电，再上门安装，最后维修保养，三者构成时间顺承对应关系，与题干逻辑关系一致，当选；C 项修剪草坪是园林养护的一部分，与题干逻辑关系不一致，排除；D 项视频连线是观众互动的一种方式，与题干逻辑关系不一致，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-098","paperId":"gk2023-xz","num":98,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"标清∶高清∶超清","options":["迁怒∶愤怒∶暴怒","幽静∶寂静∶安静","厅级∶市级∶省级","亚音速∶音速∶超音速"],"answer":"D","explanation":"【格木解析】类比推理-逻辑关系-并列关系。标清、高清和超高清代表三种不同的清晰度，三者构成并列关系，并且清晰度依次递增。结合选项：A 项愤怒和暴怒都是一种情绪状态，后两者构成并列关系，且怒气程度逐渐递增，但是迁怒是一种动作行为，与后两个词不构成并列关系，与题干逻辑关系不一致，排除； B 项幽静、寂静和安静是对环境中静的程度的不同描述，三者构成并列关系，但是静的程度不是依次递增，与题干逻辑关系不一致，排除；C 项我国行政级别采用行政五级划分，分别为国家级、省部级、司厅局级、县处级、乡镇科级，厅级、市级和省级是不同行政级别划分，其中市的级别有好多种，直辖市是省部级，地级市等同于厅级，三者不构成依次递增，与题干逻辑关系不一致，排除；D 项亚音速、音速和超音速代表三种不同的传播速度，三者构成并列关系，并且速度依次递增，与题干逻辑关系一致，当选。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-099","paperId":"gk2023-xz","num":99,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"深空探测对于（）相当于（）对于公益组织","options":["宇宙空间；公益事业","无人采样；慈善捐款","火星探测；社会组织","遥感技术；红十字会"],"answer":"C","explanation":"【格木解析】类比推理-逻辑关系-包容关系。将选项依次代入：A 项深空探测的对象是宇宙空间，两者构成对象对应关系，公益组织是进行公益事业的主体，两者构成主体对应关系，前后逻辑关系不一致，排除； B 项无人采样是一种深空探测的方式，两者构成方式对应关系，公益组织是进行慈善捐款的主体，两者构成主体对应关系，前后逻辑关系不一致，排除；C 项火星探测是一种深空探测，公益组织是一种社会组织，前后两者均构成种属关系，前后逻辑关系一致，当选；D 项在深空探测中会用到遥感技术，两者构成对应关系，红十字会是一种公益组织，两者构成种属关系，前后逻辑关系不一致，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-100","paperId":"gk2023-xz","num":100,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"刑事警察对于（）相当于（）对于对外交涉","options":["交通警察；外交领事","公安机关；维护主权","打击犯罪；外交人员","刑事案件；驻外武官"],"answer":"C","explanation":"【格木解析】类比推理-逻辑关系-对应关系。将选项依次代入：A 项刑事警察和交通警察两者构成并列关系，外交领事的工作内容是对外交涉，两者构成职业与工作内容的对应关系，前后逻辑关系不一致，排除； B 项刑事警察是构成公安机关的一部分，二者为组成关系，通过对外交涉的方式来维护主权，两者构成方式与目的对应关系，前后逻辑关系不一致，排除；C 项刑事警察的工作内容是打击犯罪，外交人员的工作内容是对外交涉，前后两者均属于职业与工作内容的对应关系，前后逻辑关系一致，当选；D 项刑事警察侦破刑事案件，刑事案件是一个名词，只是刑事警察的工作对象，两者构成职业与工作对象的对应关系或者主宾关系，驻外武官的工作内容是对外交涉，对外交涉是动词，两者构成职业与工作内容的对应关系，前后逻辑关系不一致，排除。四、逻辑判断","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-101","paperId":"gk2023-xz","num":101,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"深度学习是一系列复杂的算法，使计算机能够识别数据中的模式并作出预测。研究人员利用深度学习技术训练AI系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。研究人员认为该项技术有可能彻底改变传统的心脏病筛查方式。上述论证的成立须补充以下哪项作为前提：","options":["视网膜扫描相对便宜，并且在许多配镜服务中被使用","AI系统是解开自然界中存在的复杂模式的绝佳工具","心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查","视网膜扫描数据反映的微小血管变化是预测心脏疾病较为灵敏的指标"],"answer":"D","explanation":"【格木解析】逻辑判断-论证-前提假设类论证。论点：深度学习技术有可能彻底改变传统的心脏病筛查方式。论据：研究人员利用深度学习技术训练AI 系统自动读取视网膜扫描数据，并识别那些在接下来的一年中患心脏病风险较高的人。结合选项：A 项视网膜扫描相对便宜，并且在许多配镜服务中被使用，与论点深度学习技术能否改变传统的心脏病筛查方式无关，无法加强；B 项AI 系统是解开自然界中存在的复杂模式的绝佳工具，与论点深度学习技术能否改变传统的心脏病筛查方式无关，无法加强；C 项心脏病筛查需要进行复杂且昂贵的超声心动图或心脏磁共振成像检查，与论点深度学习技术能否改变传统的心脏病筛查方式无关，无法加强；D 视网膜扫描数据反映的微小血管变化是预测心脏疾病较为灵敏的指标，在论据“视网膜扫描数据”和论点“心脏病筛查”之间搭桥，是论点成立的前提。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-102","paperId":"gk2023-xz","num":102,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"人们感受气味通过嗅觉受体实现。研究发现：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体。与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。由此可以认为，人类的嗅觉经历着不断削弱，逐渐退化的过程。以下哪项如果为真，最能支持上述结论：","options":["随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少","相对于视觉而言，嗅觉在人类感觉系统中的重要性较低","人类大约1000个嗅觉受体相关基因，其中只有390个可以编码嗅觉受体","不同人群之间嗅觉存在很大差异，老年人的嗅觉敏感性明显低于年轻人"],"answer":"A","explanation":"【格木解析】逻辑判断-论证-加强论证-增加论据。论点：人类的嗅觉经历着不断削弱，逐渐退化的过程。论据：随着人类的演化，编码人类嗅觉受体的基因不断突变，许多在过去能强烈感觉气味的嗅觉受体已经突变为对气味不敏感的受体，与此同时，人类嗅觉受体的总体数目也随时间推移逐渐变少。结合选项：A 项随着人类进化，嗅觉中枢在大脑皮层中所占面积逐渐减少，通过增加论据的方式加强论点，可以加强；B 项比较视觉和嗅觉在人类感觉系统中的重要性，与论点人类的嗅觉是否退化无关，无法加强；C 项人类有大约1000 个嗅觉受体相关基因，其中只有390 个可以编码嗅觉受体，没有体现出前后的对比，也就无法知道人类的嗅觉是否退化，无法加强；D 项讨论的是老年人和年轻人的嗅觉敏感性对比，与论点人类的嗅觉是否退化无关，无法加强。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-103","paperId":"gk2023-xz","num":103,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"调查显示，84.8%的家长倾向于给孩子购买标有“儿童”字样的食品。几乎每一款“儿童食品”都宣称“无添加，适合孩子健康成长”。家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。以下哪项如果为真，最能质疑家长的观点：","options":["我国目前并没有设置专门的“儿童食品”分类，“儿童食品”缺乏专门的法律法规与食品安全国家标准","孩子在不同年龄阶段，对各种营养物质的需求量会发生变化，而几乎所有“儿童食品”都没有明确的年龄分段和食用提示","所谓的“儿童食品”，成分通常与普通食品没什么区别，甚至可能因为添加过量的调味物质而有害儿童健康","儿童食品的外包装设计和食品形状设计都更符合儿童的审美，会导致儿童因为喜欢外形而过量进食"],"answer":"C","explanation":"【格木解析】逻辑判断-论证-削弱论证-否定论点。论点：家长热衷于购买有“儿童”标签的食品是因为他们觉得，标有“儿童”字样的食品更加营养健康，更适合儿童。结合选项：A 项讨论的是儿童食品缺乏专门的法律法规与食品安全国家标准，但是不明确标有“儿童”字样的食品是否营养健康，表意不明确，无法削弱； B 项讨论的是儿童食品都没有明确的年龄分段和食用提示，与论点标有“儿童”字样的食品是否营养健康无关，无法削弱；C 项儿童食品成分与普通食品没什么区别，甚至可能有害儿童健康，直接否定论点，可以削弱； D 项讨论的是儿童食品的外包装设计和食品形状设计会导致儿童过量进食，与论点标有“儿童”字样的食品是否营养健康无关，无法削弱。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-104","paperId":"gk2023-xz","num":104,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"电商直播可以为农产品的营销提供一条有效的渠道，在农产品供应链的运作上要明显优于传统的“农户→批发商一分销商一消费者”模式。但目前在很多地方，电商直播营销模式并没有有效解决农产品卖难买难的问题。有从业者认为，只要完善农产品物流配送体系，提高直播人员素质，就能有效解决这一问题。以下哪项如果为真，不能支持上述从业者的观点：","options":["直播内容重复单调，易引起消费者审美疲劳，不利于树立起良好的产品形象，影响了农产品直播的效果","部分地区没有对农产品的生产、包装、运输以及销售等环节制定统一的标准，对农产品的质检投入不足","在电商直播模式下，对物流的需求会增加，现有的冷链物流水平无法满足日益增长的农产品消费需求","许多地区的农户居住比较分散，农产品出村进城“最先一公里”的物流运输难题，始终未能完全得到解决"],"answer":"B","explanation":"【格木解析】逻辑判断-论证-不能加强。论点：只要完善农产品物流配送体系，提高直播人员素质，就能有效解决这一问题。论据：目前在很多地方，电商直播营销模式并没有有效解决农产品卖难买难的问题。结合选项：A 项直播内容重复单调，影响了农产品直播的效果，而直播内容与直播人员素质有关，所以通过提高直播人员素质，可以有效解决农产品卖难买难的问题，增加论据加强；B 项讨论的是没有对农产品的各个环节制定统一的标准，对农产品的质检投入不足，与论点“完善农产品物流配送体系，提高直播人员素质” 无关，无法加强；C 项现有的冷链物流水平无法满足农产品消费需求，所以通过完善农产品物流配送体系，可以有效解决农产品卖难买难的问题，增加论据加强；D 项农产品出村进城的物流运输难题未能完全得到解决，所以通过完善农产品物流配送体系，可以有效解决农产品卖难买难的问题，增加论据加强。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-105","paperId":"gk2023-xz","num":105,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"R行星是位于太阳系的一颗小行星，质量不大，平均直径不足500米。在对R行星进行长达一年的观测后，人们发现其表面长期漂浮着砂粒，且砂粒在漂浮一段时间后还会重新落在行星表面。由于行星表面没有稳定的大气层，因此人们认为砂粒漂浮的现象主要来自静电，原因是太阳风进入行星表面产生电场时，砂粒会因静电力的作用，离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。以下哪项如果为真，没有质疑上述观点：","options":["R行星表面存在一氧化碳、干冰等挥发性物质，其升华会带动砂粒的释放与漂浮","R行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大","R行星自转速度快，星球上的物体受到离心作用强，其表面尘埃与石块会脱离引力束缚，剥落散逸","R行星与彗星组成类似，彗星靠近太阳时受太阳风产生的静电影响，其表面砂粒将会漂浮根据所给材料，回答106~110题 6天休假期间，单位需要每天安排一人值班。财务、研发、人事、后勤、法务和销售6个部门各推荐了2人，值班人员从这12人中选择，每人至多值班一天。安排要求：（1）第二天和第四天不安排法务部门的人值班；（2）若安排后勤部门的人班，则只能安排在法务部门的人值班的前一天；（3）若安排研发部门的人值班，则只能安排在后勤部门的人值班的前一天。"],"answer":"D","explanation":"【格木解析】逻辑判断-论证-不能削弱。论点：R 行星砂粒漂浮的现象主要来自静电。论据：太阳风进入行星表面产生电场时，砂粒会因静电力的作用，离开行星表面漂浮游动起来，当没有太阳风时，砂粒又会回落下来。结合选项：A 项R 行星表面的一氧化碳、干冰等挥发性物质升华会带动砂粒漂浮，说明R 行星砂粒漂浮有可能是其他原因造成的，他因削弱，可以削弱；B 项R 行星质量小，静电作用只能扬起毫米级的砂粒，但目前其表面漂浮的砂粒尺寸都很大，说明R 行星砂粒漂浮的现象不可能是静电造成的，可以削弱；C 项R 行星自转速度快导致砂粒漂浮，说明R 行星砂粒漂浮有可能是其他原因造成的，他因削弱，可以削弱； D 项R 行星与彗星组成类似，彗星表面砂粒漂浮的原因是静电，所以R 行星表面砂粒漂浮的原因也可能是静电，属于类比加强，无法削弱。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-106","paperId":"gk2023-xz","num":106,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"关于6天中的人选，以下哪项安排符合上述条件：","options":["销售、财务、法务、人事、财务、销售","财务、人事、后勤、法务、财务、人事","人事、财务、法务、研发、法务、后勤","法务、销售、人事、后勤、财务、销售"],"answer":"A","explanation":"【格木解析】逻辑判断-综合推理-套材料。根据条件（1）第二天和第四天不安排法务部门的人值班，排除B 项，根据条件（2）若安排后勤部门的人值班，则只能安排在法务部门的人值班的前一天，排除CD 两项，只有A 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-107","paperId":"gk2023-xz","num":107,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"后勤部门的人可以安排在哪几天值班：","options":["只有第二天、第六天","只有第一天、第三天","只有第二天、第四天、第五天","只有第一天、第三天、第五天"],"answer":"C","explanation":"【格木解析】逻辑判断-综合推理-套材料。根据条件（2）若安排后勤部门的人值班，则只能安排在法务部门的人值班的前一天和条件（1）第二天和第四天不能安排法务部门的人值班可知：后勤部门的人不能安排在第一天和第三天值班，排除BD 两项，再带入A 项中的第六天，如果后勤部门的人安排在第六天值班，无法满足条件（2），排除A 项，只有C 项满足。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-108","paperId":"gk2023-xz","num":108,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果安排后勤部门的两人值班，则以下哪项一定是错误的：","options":["第一天安排研发部门的人值班","第三天安排财务部门的人值班","第六天安排人事部门的人值班","第五天安排法务部门的人值班"],"answer":"B","explanation":"【格木解析】逻辑判断-综合推理-套材料。如果安排后勤部门的两人值班，结合条件（2）可知，法务部门也应该有两人值班，并且后勤部门安排在法务部门的前一天，所以法务部门不能安排在第一天。再结合条件（1）可知，法务部门的两人只能安排在第三天、第五天、第六天这三天中的两天。由于后勤部门的两人分别安排在法务部门的两人的前一天，所以法务部门的两人不能同时安排在第五天和第六天，因此法务部门一定有一人是安排在第三天的，所以B 项第三天安排财务部门的人值班一定是错误的。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-109","paperId":"gk2023-xz","num":109,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果在第三天、第五天分别安排两个财务部门的人值班，则第一天、第六天可安排的值班人员可能分别来自：","options":["财务部门和销售部门","研发部门和人事部门","法务部门和销售部门","后勤部门和法务部门"],"answer":"C","explanation":"【格木解析】逻辑判断-综合推理-套材料。将选项依次代入：A 项，如果第三天、第五天均安排财务部门的人值班，则不能再有财务部门的人值班，否则会和题干每个部门各推荐2 人矛盾，排除；B 项，如果第一天安排研发部门，根据条件（3）可知，第二天安排后勤部门，再根据条件（2）可知，第三天安排法务部门，与本题条件矛盾，排除；C 项，如果第一天、第六天分别安排法务部门和销售部门，并且第三天、第五天均安排财务部门的人值班，根据条件（2）若安排后勤部门的人班，则只能安排在法务部门的人值班的前一天可知，第二天和第四天不能安排后勤部门，根据条件（3）若安排研发部门的人值班，则只能安排在后勤部门的人值班的前一天可知，第二天和第四天也不能安排研发部门，再根据条件（1）可知，第二天和第四天也不能安排法务部门，所以第二天和第四天可以安排人事或者销售，满足题干条件，当选；D 项，如果第一天安排后勤部门，根据条件（2）可知，第二天安排法务部门，与条件（1）矛盾，排除。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-110","paperId":"gk2023-xz","num":110,"year":2023,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果没有安排财务和后勤部门的人值班，则以下哪项一定是正确的：","options":["第四天安排销售部门的人值班","第五天安排法务部门的人值班","第三天安排法务部门或者人事部门的人值班","第二天安排销售部门或者人事部门的人值班"],"answer":"D","explanation":"【格木解析】逻辑判断-综合推理-套材料。如果没有安排后勤部门的人值班，根据条件（3）可知，也没有安排研发部门的人值班，因此，只有人事、法务和销售部门的人值班，再根据条件（1）可知，第二天和第四天不安排法务部门的人值班，则第二天和第四天只能安排人事部门或者销售部门的人值班，所以D 项一定正确。第五部分资料分析","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-111","paperId":"gk2023-xz","num":111,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年，表中所列省市集成电路产量约占全国总产量的：","options":["80%","84%","88%","92%"],"answer":"D","explanation":"【格木解析】比值相关——现期比值。定位表格2021 年数据，根据比重=部分/总体，可得2021 年表中省市集成电路产量占全国的比重 %          。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-112","paperId":"gk2023-xz","num":112,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2017～2021年间，全国集成电路产量同比增速超过20%的年份有几个：","options":["1","2","3","4"],"answer":"B","explanation":"【格木解析】增长相关——增长率比较。假设增长率为20%，如果基期量×（1+20%）＜现期量，则说明增速超过20%。则2017~2021 年分别为1318×（1+20%）＞1565，不满足；1565×（1+20%）＞1853，不满足；1853×（1+20%）＞2018，不满足；2018×（1+20%）＜2614，满足；2614×（1+20%）＜3594，满足。则符合基期量×（1+20%）＜现期量的有2 个年份，即2020 年和2021 年。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-113","paperId":"gk2023-xz","num":113,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"表中所列7个省市中，2019年集成电路产量同比增速超过2%的省市比上年：","options":["少1个","少2个","多1个","多2个"],"answer":"A","explanation":"【格木解析】增长相关——增长率比较。假设增长率为2%，如果基期量×（1+2%）＜现期量，则说明增速超过2%。 2018 年七个省市分别为518×（1+2%）＜554，满足；281×（1+2%）＜318，满足；263×（1+2%）＜301，满足；233×（1+2%）＞233，不满足；80×（1+2%）＞65，不满足；93×（1+2%）＜137，满足；58×（1+2%）＜77，满足；则2018 年增速超过2%的有5 个。 2019 年七个省市分别为554×（1+2%）＞516，不满足；318×（1+2%）＜390，满足；301×（1+2%）＜ 363，满足；233×（1+2%）＞208，不满足；65×（1+2%）＜143，满足；137×（1+2%）＜154，满足；77× （1+2%）＞77，不满足；则2019 年增速超过2%的有4 个。则2019 年比2018 年少1 个。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-114","paperId":"gk2023-xz","num":114,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"将①甘肃、②广东、③上海和④浙江按2016～2021年集成电路产量年均增速（以2016年为基期计算）从高到低排列，以下正确的是：","options":["④①③②","①④③②","④①②③","①④②③"],"answer":"D","explanation":"【格木解析】增长相关——年均增长率比较。根据年份差相同，年均增长率比大小，转化直接比较末期量/初期量。①甘肃= 643  ；②广东= 539  ；③上海= 365  ；④浙江= 230  。根据计算的数据比较，结果为：①>④>②>③。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-116","paperId":"gk2023-xz","num":116,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年四季度，Z省有几个市的中心城市道路机动车依法礼让率高于上季度水平：","options":["5","6","7","8"],"answer":"C","explanation":"【格木解析】简单计算。根据要求可知第四季度礼让率＞第三季度礼让率。A 市98.8＞98.0，B 市98.8 ＞96.0，C 市98.0＜99.2，D 市99.6＞97.3，E 市98.3＞96.5，F 市98.2＞96.0，G 市900.0＞94.8，E 市99.3 ＞98.2；除C 市之外的7 个市均高于上季度。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-117","paperId":"gk2023-xz","num":117,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年三季度Z省中心城市道路非机动车遵守交通信号灯率最低的城市，其四季度中心城市道路非机动车遵守交通信号灯率比上季度增长了：","options":["4～6个百分点之间","超过6个百分点","不到2个百分点","2～4个百分点之间"],"answer":"B","explanation":"【格木解析】简单计算。2021 年三季度Z 省中心城市道路非机动车遵守交通信号灯率最低的城市为G 市（90.9），其四季度中心城市道路非机动车遵守交通信号灯率比上季度增长了：98.2%-90.9%=7.3%，即超过 6 个百分点。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-118","paperId":"gk2023-xz","num":118,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"如用求各市算术平均值的方式计算全省数值，则2021年四季度Z省中心城市道路汽车前排驾乘人员安全带使用率比上季度：","options":["下降了不到2个百分点","下降了2个百分点以上","提升了不到2个百分点","提升了2个百分点以上"],"answer":"D","explanation":"【格木解析】比值相关——现期平均数。2021 年四季度Z 省中心城市道路汽车前排驾乘人员安全带使用率 -2021 年三季度该量为 % % % % % % % %        % % % % % % % %         ≈ % %  ，即提升了2 个百分点以上。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-119","paperId":"gk2023-xz","num":119,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"如单纯从统计数据判断，则2021年四季度B市在提升中心城市道路交通守法率方面，工作相比三季度最有成效的是：","options":["机动车依法礼让","行人、非机动车遵守交通信号灯","摩托车驾乘人员佩戴安全头盔","汽车前排驾乘人员使用安全带"],"answer":"A","explanation":"【格木解析】简单计算。当第四季度的数据与第三季度差值最大时，说明四季度工作相比三季度最有成效，观察表格数据可知机动车依法礼让率，三季度数值最小（96%），四季度数值最大（98.8%），因此差值（2.8%）最大，即四季度工作相比三季度最有成效。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-120","paperId":"gk2023-xz","num":120,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"以下条形图反映了2021年四季度Z省哪个城市中心城市道路交通守法率五项指标之间的大小关系：","options":["E市","F市","G市","H市"],"answer":"B","explanation":"【格木解析】简单计算。条形图的要求为：汽车前排驾乘人员安全带使用率＞行人遵守交通信号灯率＞非机动车遵守交通信号灯率＝摩托车安全头盔佩戴率＞机动车依法礼让率。 A 选项，非机动车遵守交通信号灯率为99.3%＞行人遵守交通信号灯率为99.2%，不符合，错误； B 选项，汽车前排驾乘人员安全带使用率99.1%＞行人遵守交通信号灯率99.0%＞非机动车遵守交通信号灯率98.8%＝摩托车安全头盔佩戴率98.8%＞机动车依法礼让率98.2%，符合，正确； C 选项，机动车依法礼让率100%为最大，不符合，错误； D 选项，汽车前排驾乘人员安全带使用率99.4%＝非机动车遵守交通信号灯率99.4%，不符合，错误。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-121","paperId":"gk2023-xz","num":121,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2017~2021年，我国木材进口平均单价高于400美元/吨的年份有几个：","options":["1","2","3","4"],"answer":"C","explanation":"【格木解析】比值相关——现期平均数。根据进口平均单价=进口额÷进口量，数据定位图1，代入数据验证符合要求的有2017 年（＞万亿）、2018 年（＞万亿）和2021 年（＞万亿），即有3 个年份。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-122","paperId":"gk2023-xz","num":122,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2017~2021，我国总计进口了约多少亿吨木材：","options":["1.1","1.2","1.3","1.4"],"answer":"A","explanation":"【格木解析】简单计算。数据定位图1 ，2017-2021 年木材进口量之和为 2389+2367+2351+2107+1892=11106 万吨≈1.1 亿吨。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-123","paperId":"gk2023-xz","num":123,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年，松木、冷杉和针叶木材进口量之和占当年我国木材进口总量的：","options":["不到60%","65%~70%之间","60%~65%之间","70%以上"],"answer":"C","explanation":"【格木解析】比值相关——现期比重。数据定位图1 和图2，2021 年，松木、冷杉和针叶木材进口量之和占当年我国木材进口总量的比重为 %      ，即60%~65%之间。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-124","paperId":"gk2023-xz","num":124,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年，自俄罗斯进口的木材占当年木材进口总量的比重约比美国高多少个百分点：","options":["38","32","50","44"],"answer":"D","explanation":"【格木解析】比值相关——现期比重。数据定位图1 和图3，2021 年，自俄罗斯进口的木材占当年木材进口总量的比重约比美国高 %    。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-126","paperId":"gk2023-xz","num":126,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2020年，全国服装出口额比2019年：","options":["增长了不到10%","增长了10%以上","下降了不到10%","下降了10%以上"],"answer":"C","explanation":"【格木解析】增长相关——间隔增长率。数据定位第一段，“服装出口1702.8 亿美元，同比增长24.0%，较2019 年增长16.0%”。根据间隔增长率的公式R＝r1＋r2＋r1×r2，代入数据，16%＝r＋24%＋r×24%，解得 r≈-6%，即下降了不到10%。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-127","paperId":"gk2023-xz","num":127,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2021年，全国针织、梭织服装及衣着附件总出口额约占纺织品服装出口总额的：","options":["40%","45%","50%","55%"],"answer":"C","explanation":"【格木解析】比值相关——现期比重。数据定位第一段，“2021 年，全国纺织品服装出口3155 亿美元，同比增长8.4%……针织服装及衣着附件出口864.8 亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2 亿美元，同比增长12.6%”。根据比重＝部分/总体，可得2021 年，全国针织、梭织服装及衣着附件总出口额约占纺织品服装出口总额为   ，直除接近50%。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-128","paperId":"gk2023-xz","num":128,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"将①美国、②东盟十国，③欧盟27国和④日本按2021年自中国进口纺织品服装金额同比增量从高到低排列，以下正确的是：","options":["②①③④","②①④③","①②③④","①②④③"],"answer":"B","explanation":"【格木解析】增长相关——增长量比较数据定位第二段。“（2021 年）对美国出口额为563.5 亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2 亿美元，同比增长24.9%；对欧盟27 国出口纺织品服装469.9 亿美元，同比下降11.1%；对日本出口纺织品服装200.3 亿美元，同比下降7.2%。”根据增长量比较口诀“大大则大，一大一小看乘积”，对东盟出口的增长量（491×24.9%）＞美国（564×4%），排除C 和D。对欧盟（-467×11.1%）＜对日本（-200×7.2%）。所以正确排序为②①④③。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-129","paperId":"gk2023-xz","num":129,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2020年中国出口的纺织制品总额中，防疫类口罩出口额占比约为：","options":["33%","45%","57%","72%"],"answer":"C","explanation":"【格木解析】比值相关——基期比重。数据定位第三段。“（2021 年）纺织制品当中，防疫类口罩出口额为129.5 亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为 517.2 亿美元，同比增长27.5%。”根据基期量=现期量÷（1+增长率），可得2020 年防疫类口罩出口额为129.5÷ （1-76%）≈540，其他纺织制品出口额为517.2÷（1+27.5%）≈400。又根据比重=部分/总体，可知2020 年防疫类口罩出口额占出口的纺织制品总额可得540÷（540+400）=540÷940≈57%。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-130","paperId":"gk2023-xz","num":130,"year":2023,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2020年，中国对“一带一路”沿线国家纺织品服装贸易顺差额约为多少亿美元：","options":["1253","1129","1006","808"],"answer":"D","explanation":"【格木解析】增长相关——基期量做差。数据定位最后一段，“2021 年，中国向“一带一路”沿线国家出口纺织品服装1137.9 亿美元，同比增长24.5%，较2019 年增长17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6 亿美元，同比增长24.5%”。根据贸易顺差额＝出口额－进口额，且基期量＝现期量÷（1+增长率），代入数据可得2020 年贸易顺差额为 % %      。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-001","paperId":"gk2022-xz","num":1,"year":2022,"region":"国家","module":"常识判断","sub":"人文历史","stem":"（单选题）进入新发展阶段，是中华民族伟大复兴历史进程的大跨越，以下关于新发展阶段的理解，正确的有几项？ ①新发展阶段是中国共产党带领人民迎来从站起来、富起来到强起来历史性跨域的新阶段 ②新发展阶段是基本实现社会主义现代化，全面建成小康社会的发展阶段 ③新发展阶段是超越社会主义初级阶段，迈入社会主义更高阶段的发展阶段 ④新发展阶段是实现第一个百年奋斗目标，向着第二个百年奋斗目标迈进的发展阶段","options":["1 项","2 项","3 项","4 项"],"answer":"B","explanation":"第一步，本题考查时政。第二步，①：2021 年1 月11 日习总书记在省部级主要领导干部学习贯彻党的十九届五中全会精神专题研讨班开班式上发表重要讲话，指出新发展阶段是我们党带领人民迎来从站起来、富起来到强起来的历史性跨越的新阶段。 ①正确。 ④：习总书记在庆祝中国共产党成立100 周年大会上的重要讲话中强调，“十四五”时期是我国全面建成小康社会、实现第一个百年奋斗目标之后，乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军的第一个五年，我国进入新发展阶段。可以说，新发展阶段，既是我们全面建设社会主义现代化国家、向第二个百年奋斗目标进军的阶段，也是中华民族伟大复兴进入不可逆转的进程、实现大跨越的阶段。④正确。故有2 项正确。因此，选择B 选项。拓展 ②：习总书记在庆祝中国共产党成立100 周年大会上的重要讲话中强调，从“两个一百年”奋斗目标的实际出发，综合分析国际国内形势和我国发展条件，从2020 年到本世纪中叶提出两个阶段的安排：第一个阶段，从2020 年到2035 年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化。第二个阶段，从2035 年到本世纪中叶，在基本实现现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国。②表述为“全面建成小康社会”错误。 ③：习近平总书记在十九大报告中指出，必须清醒地认识到，我国社会主要矛盾虽然发生了变化，但并没有改变我们对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。③表述为“超越社会主义初级阶段”错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-002","paperId":"gk2022-xz","num":2,"year":2022,"region":"国家","module":"常识判断","sub":"经济","stem":"（单选题）习近平总书记指出，要根据我国经济发展实际情况，建立起扩大内需的有效制度，释放内需潜力，加快培育完整内需体系，加强需求侧管理，扩大居民消费，提升消费层次，使建设超大规模的国内市场成为一个可持续的历史过程。下列举措不属于需求侧改革的是：","options":["构建“智能＋”消费生态体系","完善收入分配制度","严格落实“房住不炒”","剥离企业办社会职能"],"answer":"D","explanation":"第一步，本题考查时政并选错误项。第二步，我国国有企业社会职能的存在，加重了企业负担，降低了企业的竞争力。因此国家提出剥离企业办社会职能。就剥离国有企业办社会职能案例来看，其旨在破解国有企业办社会负担沉重的突出问题。因为国企办社会职能，背着包袱与民营企业、外资企业竞争是不公平的。而实行剥离企业办社会职能，有利于实现政企分开,推进企业减负,促进生产，推动经济的发展。因此其属于供给侧改革的措施，不属于需求侧改革的措施。D 项错误，符合题意。因此，选择D 选项。拓展 A 项：2020 年3 月，国家发展改革委等23 个部门联合印发《关于促进消费扩容提质加快形成强大国内市场的实施意见》首次提出构建“智能+”消费生态体系，准确把握并适应了现阶段绿色、智能和在线消费的发展大趋势。作为消费扩容提质重要途径之一，“智能＋”消费生态体系融合了智能元素，在高新科技支持下，“智能＋”消费生态体系将更加贴合人们的消费需求，顺应社会发展的潮流趋势，有助于释放更大的消费潜力，满足人们对美好生活的向往。 A 项正确，与题意不符。 B 项：党的十九届五中全会提出，坚持扩大内需这个战略基点，加快培育完整内需体系，把实施扩大内需战略同深化供给侧结构性改革有机结合起来，以创新驱动、高质量供给引领和创造新需求。当前，我国14 多亿人口形成的超大规模内需市场已经成为我国经济发展的显著比较优势和我国强大的发展韧性所在，孕育着巨大的潜力和活力。但与此同时，我国低收入人群数量还比较大。因此，要构建完整的内需体系，完善收入分配制度是关键。B 项正确，与题意不符。 C 项：自党的十八大以来，中国政府严格落实“房住不炒”的原则，通过各种手段防止地产炒作。这样的原则也有利于保证居民对买房的需求。C 项正确，与题意不符。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-003","paperId":"gk2022-xz","num":3,"year":2022,"region":"国家","module":"常识判断","sub":"政治","stem":"（单选题）“七一勋章”获得者都来自人民、植根人民，是立足本职、默默奉献的平凡英雄。他们的事迹可学可做，他们的精神可追可及，以下“七一勋章”获得者与其先进事迹表述对应正确的是：","options":["张桂梅——坚持志愿服务十余载群众心中的“
