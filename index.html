字材料，“2017 年贫困地区农村居民人均工资性收入比上年增长11.8%，增速比全国农村平均水平高2.3 个百分点；人均经营净收入增长6.9%，增速比全国农村平均水平高0.9 个百分点；人均财产净收入增长11.9%，增速比全国农村平均水平高0.5 个百分点；人均转移净收入增长14.8%，增速比全国农村平均水平高3.0 个百分点”。第三步，2017 年全国农村居民人均工资性收入增速为11.8%－2.3%=9.5%，人均经营净收入为6.9%－0.9%=6%，人均财产净收入为11.9%－0.5%=11.4%，人均转移净收入为14.8%－3.0%=11.8%，增速最快的为人均转移净收入。因此，选择D 选项。","material":"(材料) 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 -","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-099","paperId":"gz2018a","num":99,"year":2018,"region":"广州","module":"资料分析","sub":"综合资料","stem":"以下省份，2017 年农村贫困发生率全部在3%及以下的是（）。","options":["吉林、安徽、海南","黑龙江、江西、贵州","内蒙古、湖北、河北","湖北、辽宁、宁夏"],"answer":"C","explanation":"正确答案：C，全站正确率：91%，易错项：A。解析第一步，本题考查简单比较中读数比较。第二步，定位第三段文字材料，“2017 年各省农村贫困发生率普遍下降至10%。其中农村贫困发生率降至3% 及以下的省份有17 个，包括北京、天津、河北、内蒙古、辽宁、吉林、黑龙江、上海、江苏、浙江、安徽、福建、江西、山东、湖北、广东、重庆等”。第三步，则C 选项中三个省农村贫困发生率全部在3%及以下。因此，选择C 选项。","material":"(材料) 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 -","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018a-100","paperId":"gz2018a","num":100,"year":2018,"region":"广州","module":"资料分析","sub":"综合资料","stem":"以下说法中错误的是（）。 ①2012 年末全国农村贫困人口约为2017 年末的3.8 倍 ②2017 年东、中部地区农村贫困人口之和占全国农村贫困人口的46.4% ③2016 年贫困地区农村居民人均经营净收入占人均可支配收入的比重超过50%","options":["①和②","①和③","②和③","仅有③"],"answer":"B","explanation":"正确答案：B，全站正确率：46%，易错项：A。解析第一步，本题考查综合分析问题，且需选出错误序号对应的选项。第二步，①现期倍数计算，定位第一段文字材料，“截至2017 年末，全国农村贫困人口从2012 年末的9899 万人减少至3046 万人”。则2012 年末全国农村贫困人口与2017 年末的倍数关系为倍，而非3.8 倍，错误。 ②现期比重计算中求比重，定位第一、二段文字材料，“截至2017 年末，全国农村贫困人口从2012 年末的 9899 万人减少至3046 万人……东部地区农村贫困人口300 万人；中部地区农村贫困人口1112 万人”。根据比重=部分量/整体量，可得，正确。 ③基期比重计算，定位第四和最后一段文字材料，“2017 年，贫困地区农村居民人均可支配收入9377 元，比上年增加894 元……人均经营净收入3723 元，增长6.9%”。根据基期量=现期量－增长量和基期量=现期量/ （1＋增长率），可得，直除首位商4，未超过50%，错误。故①③错误。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 25 - 因此，选择B 选项。","material":"(材料) 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 -","source":"2018年广州市公务员考试《行测》真题（一）"},{"id":"gz2018b-001","paperId":"gz2018b","num":1,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"中国共产党第十九次全国代表大会于2017 年10 月在北京胜利召开，下列哪个论断，不是十九大首次提出的：","options":["习近平新时代中国特色社会主义思想","树立文化自信","中国特色社会主义进入新时代","建成富强民主文明和谐美丽的社会主义现代化强国"],"answer":"B","explanation":"正确答案：B，全站正确率：46%，易错项：D。解析第一步，本题考查十九大内容并选错误项。第二步，树立文化自信是2016 年7 月1 日在庆祝中国共产党成立95 周年大会上，习近平提出的时代课题。不是十九大首次提出的。因此，选择B 选项。拓展 A 项：“新时代中国特色社会主义思想”是2017 年10 月18 日，习近平同志在十九大报告中提出的。新时代中国特色社会主义思想是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。2017 年10 月24 日，中国共产党第十九次全国代表大会通过了关于《中国共产党章程（修正案）》的决议，习近平新时代中国特色社会主义思想写入党章。2018 年3 月11 日，第十三届全国人民代表大会第一次会议通过《中华人民共和国宪法修正案》，习近平新时代中国特色社会主义思想写入《中华人民共和国宪法》。 C 项：“中国特色社会主义进入了新时代”是2017 年10 月18 日，习近平同志在十九大报告中提出的。历史唯物主义认为，社会主要矛盾是时代变革的基本动力和显著标识，构成时代划分的根本尺度。社会主要矛盾不变，则时代不变，社会主要矛盾发生变化，时代必发生变化。中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。 D 项：“建成富强民主文明和谐美丽的社会主义现代化强国”是2017 年10 月18 日，习近平同志在十九大报告中提出的。习近平新时代中国特色社会主义思想，明确了坚持和发展中国特色社会主义的总任务。这就是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-002","paperId":"gz2018b","num":2,"year":2018,"region":"广州","module":"常识判断","sub":"人文历史","stem":"习近平善于用典，常常古为今用、推陈出新，不断激活优秀传统文化，赋予鲜活的当代价值与意义。以下习近平引用的古典名句适用的内容，对应错误的是：","options":["宰相必起于州部，猛将必发于卒伍——谈干部的培养选拔","取法于上，仅得为中；取法于中，故为其下——谈工作的道德标准","万物并育而不相害，道并行而不相悖——谈家国情怀","穷则变，变则通，通则久——谈改革创新的重要性"],"answer":"C","explanation":"正确答案：C，全站正确率：55%，易错项：B。解析第一步，本题考查政治理论并选错误项。第二步，“万物并育而不相害，道并行而不相悖”出自《礼记•中庸》，2014 年3 月27 日习近平《在中法建交五十周年纪念大会上的讲话》中首次引用。该句意为万物竞相生长而互不妨害，日月运行、四时更替而互不冲突。体现了在国际交往中要有包容精神与和合之道，并不涉及家国情怀。因此，选择C 选项。拓展 A 项：“宰相必起于州部，猛将必发于卒伍”出自战国时期韩非《韩非子•显学》，这是韩非选拔官员的名言，强调领导干部要有基层工作经验，这样才能更好的树立群众观点，知道国情，知道人民需要什么，在实践中不断积累各方面经验和专业知识，增强工作能力和才干。2013 年3 月19 日，习近平总书记接受金砖国家媒体联合采访引用，对应正确。 B 项：“取法于上，仅得为中；取法于中，故为其下”出自《帝范》，原是李世民所说，强调工作中要有一个较高的标准，标准决定质量，有什么样的标准就有什么样的质量，只有高标准才有高质量。2015 年习近平总书记在《在河南省兰考县委常委扩大会议上的讲话》中引用，对应正确。 D 项：“穷则变，变则通，通则久”出自《周易》，强调无论是一个国家，还是世界，都需要与时俱进，通过不断改革创新，才能保持活力。习近平总书记在2018 年两院院士大会上发表重要讲话时引用，对应正确。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-003","paperId":"gz2018b","num":3,"year":2018,"region":"广州","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国妇女权益保障法》，实行男女平等是国家的基本国策，国家采取必要措施，逐步完善保障妇女权益，消除妇女歧视，下列说法错误的是：","options":["禁止歧视虐待遗弃残害妇女","妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利","国家采取有效措施，适当减轻妇女履行法律规定义务的责任","国家保护妇女依法享有的特殊权益"],"answer":"C","explanation":"正确答案：C，全站正确率：92%，易错项：D。解析第一步，本题考查妇女权益保障法并选错误项。第二步，2005 年8 月28 日第十届全国人民代表大会常务委员会修订了《中华人民共和国妇女权益保障法》，对《中华人民共和国妇女权益保障法》作如下修改，第2 条修改为：妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利。B 项正确。实行男女平等是国家的基本国策。国家采取必要措施，逐步完善保障妇女权益的各项制度，消除对妇女一切形式的歧视。国家保护妇女依法享有的特殊权益。D 项正确。禁止歧视、虐待、遗弃、残害妇女。A 项正确。《中华人民共和国妇女权益保障法》并没有规定适当减轻妇女履行法律规定义务的责任。C 项说法错误。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-004","paperId":"gz2018b","num":4,"year":2018,"region":"广州","module":"常识判断","sub":"法律","stem":"以下情形，向人民法院提起行政诉讼，法院不予受理的是：","options":["对行政拘留、暂扣或吊销许可证和执照、责令停产、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的","对限制人身自由或对财产的查封、扣押、冻结等行政强制不服的","认为行政机关侵犯其经营自主权或者农村土地承包经营权、农村土地经营权的","行政机关对其工作人员的奖惩，任免等决定，工作人员认为不合理，要求撤销的"],"answer":"D","explanation":"正确答案：D，全站正确率：77%，易错项：A。解析第一步，本题是对行政诉讼受案范围并选错误项。第二步，《行政诉讼法》第13 条规定，人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：（一）国防、外交等国家行为；（二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；（三）行政机关对行政机关工作人员的奖惩、任免等决定;（四）法律规定由行政机关最终裁决的行政行为。D 选项获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 - 属于第（三）项的情形，不能提起行政诉讼。因此，选择D 选项。拓展 A 项：行政诉讼法》第12 条规定，人民法院受理公民、法人或者其他组织提起的下列诉讼：（一）对行政拘留、暂扣或者吊销许可证和执照、责令停产停业、没收违法所得、没收非法财物、罚款、警告等行政处罚不服的。A 项正确，不选。 B 项：《行政诉讼法》第12 条规定，人民法院受理公民、法人或者其他组织提起的下列诉讼：（二）对限制人身自由或者对财产的查封、扣押、冻结等行政强制措施和行政强制执行不服的。B 项正确，不选。 C 项：《行政诉讼法》第12 条规定，人民法院受理公民、法人或者其他组织提起的下列诉讼：（七）认为行政机关侵犯其经营自主权或者农村土地承包经营权、农村土地经营权的。C 项正确，不选。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-005","paperId":"gz2018b","num":5,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"根据2018 年政府预算报告和预算草案，2017 年全国一般公共预算收入扭转了2012 年以来增速放缓的态势。 2018 年，我国一般公共预算收入将超过18 万亿元，支出接近21 万亿元，赤字规模与去年持平，赤字率比2017 年预算降低0.4 个百分点。以下对这组数字的理解，有误的一项是：","options":["全国一般公共预算收入扭转增速放缓态势，印证了我国经济发展不仅总量扩大，而且质量和效益提升","调低赤字率，主要是我国经济稳中向好、财政增收有基础，也为宏观调控留下更多政策空间","赤字总规模并未减小，彰显积极财政政策更加聚力增效的新特点，更侧重在减费降税扩大投资方面发力","当前财政状况出现好转，各级政府仍要坚持过紧日子，执守简朴、力诫浮华，严控一般性支出，把宝贵的资金更多用于为发展增添后劲、为民生雪中送炭"],"answer":"C","explanation":"正确答案：C，全站正确率：43%，易错项：D。解析第一步，本题考查宏观经济并选错误项。第二步，财政赤字是财政支出大于财政收入而形成的差额，赤字率越高，代表财政风险越高。2018 年赤字率比2017 年预算降低0.4 个百分点，释放了进一步防控经济风险的信号；同时赤字总规模并未减小，说明政府支出没有减少，彰显积极财政政策更加聚力增效的新特点。这所体现的是更侧重在结构性方面发力，而不能仅在“减费降税扩投资”上面发力。因为积极财政政策除了扩大内需的这种积极意义之外，还有一个积极推动结构调整的意义，在扩大基建投资时，则应注意要与补短板结合在一起，而不是简单机械地扩大投资。在减税降费时，应把重点放在企业及实体经济领域，所以C 选项单纯的讲在“减费降税扩投资”上发力是不准确的，C 项错误。因此，选择C 选项。拓展 A 项：经济是财政的基础。2017 年全国一般公共预算收入扭转了2012 年以来增速放缓态势，印证了我国经济发展不仅总量扩大，而且质量和效益提升。A 项正确。 B 项：2018 年中央政府工作报告指出：调低赤字率，主要是我国经济稳中向好、财政增收有基础，也为宏观调控留下更多政策空间。B 项正确。 D 项：2018 年中央政府工作报告指出：当前财政状况出现好转，各级政府仍要坚持过紧日子，执守简朴、力戒浮华，严控一般性支出，把宝贵的资金更多用于为发展增添后劲、为民生雪中送炭。D 项正确。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-006","paperId":"gz2018b","num":6,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"“逝者如斯夫，不舍昼夜”“时乎时乎不再来”是古代哲人在启示我们：时间宝贵，珍惜时间的每一分每一秒，这反映出时间（）特点。","options":["连续性","间隔性","一维性","反复性"],"answer":"C","explanation":"正确答案：C，全站正确率：66%，易错项：A。解析第一步，本题考查哲学中时间的特性。第二步，时间的一维性就是时间的不可逆性，即一去不复返。“逝者如斯夫，不舍昼夜”，形容时间像流水一样不停地流逝，一去不复返。连续性、间隔性、反复性都不是时间的特点。因此，选择C 选项。拓展时间和空间是运动着的物质的存在形式，时间是物质运动过程的持续性、顺序性，时间的特点是一维性。空间是运动著的物质的伸张性、广延性，空间的特点是三维性。时间和空间同物质运动的不可分离性，表明了时间和空间的客观性。时间和空间是绝对性和相对性的统一，时空的客观实在性是不变的、无条件的，因而是绝对的；而受物质运动特性所制约的时间和空间的具体特性是可变的、有条件的，因而是相对的；人们关于时间和空间的观念也是可变的、发展的，因而也是相对的。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-007","paperId":"gz2018b","num":7,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"古人常把对联镌刻在门扉上“惟楚有才，于斯为盛”，这一副门联最有可能出现在（）门上。","options":["岳麓书院","清华大学","扬州贡院","杜甫草堂"],"answer":"A","explanation":"正确答案：A，全站正确率：62%，易错项：C。解析第一步，本题考查人文常识。第二步，上联“惟楚有材”，出自《左传》。原句是：“虽楚有材，晋实用之。”即楚材晋用的典故。下联“于斯为盛”，出自《论语•泰伯》“唐虞之际，于斯为盛”，本为孔子盛赞周武王时期人才鼎盛的局面，是岳麓书院大门前的对联，用来形容岳麓书院是英才齐聚之所。因此，选择A 选项。拓展 B 项：清华大学的前身清华学堂始建于1911 年，因水木清华而得名，是清政府设立的留美预备学校，其建校的资金源于1908 年美国退还的部分庚子赔款。1912 年更名为清华学校，1928 年更名为国立清华大学。清华园工字厅内对联是“槛外山光，历春夏秋冬、万千变幻，都非凡境；窗中云影，任东西南北、去来澹荡，洵是仙居”。校训是“自强不息、厚德载物”。 C 项：贡院是古代乡试的考场，即开科取士的地方。贡就是通过考试选拔人才贡献给皇帝或国家的意思。贡院最早始于唐朝。现存有江南贡院、北京贡院、定州贡院、川北道贡院等遗址，其中南京江南贡院作为中国古代最大的科举考场最为出名。并没有扬州贡院一说。 D 项：全国有多处杜甫草堂，其中最出名的为成都杜甫草堂，位于四川省成都市青羊区，是杜甫流寓成都时的获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - 故居。成都杜甫草堂是中国规模最大、保存最完好、知名度最高且最具特色的杜甫行踪遗迹地，杜甫先后在此居住近四年，创作诗歌240 余首。草堂正门匾额“草堂”二字系清代雍正皇帝的弟弟果亲王允礼所题，门两侧还悬挂有一副对联“万里桥西宅，百花潭北庄”，出自杜诗《怀锦水居止二首》。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-008","paperId":"gz2018b","num":8,"year":2018,"region":"广州","module":"常识判断","sub":"经济","stem":"我国经济已由高速增长转向（），正处在转变发展方式、优化经济结构、转换增长动力的攻关期。","options":["中速增长阶段","高速发展阶段","高质量增长阶段","高质量发展阶段"],"answer":"D","explanation":"正确答案：D，全站正确率：54%，易错项：C。解析第一步，本题考查时事政治。第二步，党的十九大提出，我国经济已由高速增长阶段转向高质量发展阶段，正处在转变发展方式、优化经济结构、转换增长动力的攻关期，建设现代化经济体系是跨越关口的迫切要求和我国发展的战略目标。“转向高质量发展”这一论断的本质含义，就是我国经济已经从主要依靠增加物质资源消耗实现的粗放型高速增长，转变为主要依靠技术进步、改善管理和提高劳动者素质实现的集约型增长。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-009","paperId":"gz2018b","num":9,"year":2018,"region":"广州","module":"常识判断","sub":"人文历史","stem":"中国有位诗人，被辛弃疾用“千载后，百篇存，更无一字不清真”来形容。以下属于这位诗人的作品是：","options":["衣带渐宽终不悔，为伊消得人憔悴","采菊东篱下，悠然见南山","少年不识愁滋味，爱上层楼。爱上层楼。为赋新词强说愁","风声雨声读书声，声声入耳；国事家事天下事，事事关心"],"answer":"B","explanation":"正确答案：B，全站正确率：48%，易错项：D。解析第一步，本题考查古诗词。第二步，根据辛弃疾的形容，该诗人距南宋有千年之久，且文章以“清真”即清新纯真的风格闻名，可以确定该诗人是东晋末至南朝宋初期，中国第一位田园诗人——陶渊明。“采菊东篱下，悠然见南山”是其《归园田居•其三》中著名诗句。因此，选择B 选项。拓展 A 项：“衣带渐宽终不悔，为伊消得人憔悴”是北宋词人柳永《蝶恋花》中的句子，北宋和南宋相距没有千年。 C 项：“少年不识愁滋味，爱上层楼。爱上层楼。为赋新词强说愁”是辛弃疾《丑奴儿•书博山道中壁》中的句子，辛弃疾不可能用“千载后”形容自己。 D 项：“风声雨声读书声，声声入耳；国事家事天下事，事事关心”，此联为明朝东林党领袖顾宪成所撰，身处南宋的辛弃疾不可能预言后世的事情。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-010","paperId":"gz2018b","num":10,"year":2018,"region":"广州","module":"常识判断","sub":"科技生活","stem":"某些基因突变有可能给生物体带来繁殖优势，保证基因携带者的后代能够更好地适应某种环境，因而这类突变得以广泛传播。某科学研究团队发现，某个哺乳动物族群与这类动物的其他族群相比，存在一个基因突变，该突变具有调节血液中血红蛋白增长的作用。血红蛋白过低会导致缺氧，过高又会导致血液粘稠度升高，进而引发血栓等血液循环问题。那么，这一哺乳动物的族群祖先很可能是生活在（）地区。","options":["高海拔","海边","寒带","热带"],"answer":"A","explanation":"正确答案：A，全站正确率：83%，易错项：B。解析第一步，本题考查生物医学常识。第二步，一般而言，高海拔地区的哺乳动物血红蛋白数量比低海拔地区的多，因为高海拔地区气压低、相对缺氧，这是机体对低气压环境的一种适应现象，以便运输更多的氧气。题目中所提到的哺乳动物的基因突变具有调节血液中血红蛋白增长的作用，由此可知高海拔地区最有可能是该哺乳动物祖先生活的地区。因此，选择A 选项。拓展血红蛋白是高等生物体内负责运载氧的一种蛋白质。可以用平均细胞血红蛋白浓度测出浓度。血红蛋白是使血液呈红色的蛋白，它由四条链组成，两条α链和两条β链，每一条链有一个包含一个铁原子的环状血红素。氧气结合在铁原子上，被血液运输。 B 项：海边一般都是海拔比较低的，相对来说大气压强比较高，氧气比较充分，不需要更多的血红蛋白来运输氧气也不会缺氧，所以不需要调节血液中血红蛋白的增长。 C 项和D 项：氧气含量和温度带的关系不是很大。不管寒带还是热带，不能根据此判别出氧气含量的多少。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-011","paperId":"gz2018b","num":11,"year":2018,"region":"广州","module":"常识判断","sub":"人文历史","stem":"在二十四季节气起源的黄河流域，雷声一般开始出现在3 月末甚至更晚，可见，雷声开始出现的时节是：","options":["立春","雨水","惊蛰","春分"],"answer":"D","explanation":"正确答案：D，全站正确率：24%，易错项：C。解析第一步，本题考查传统文化中的二十四节气。第二步，春分在每年农历二月十五前后（公历约为3 月20 日-21 日期间）。在时间段上即从春分日起至清明日前的时段，公历则大约是3 月20 日至4 月5 日之间。符合题意中雷声开始出现的时间。且春分的第二候是 “雷乃发声”，即为开始有雷声的时节。因此，选择D 选项。拓展 A 项：立春农历二十四节气中的第一个节气，公历大约是每年2 月3-5 日。“立”是“开始”的意思，自秦代以来，中国就一直以立春作为孟春时节的开始。和题干中时间、物候不相对应。 B 项：雨水，是二十四节气之中的第2 个节气，位于每年正月十五前后（公历2 月18-20 日）。雨水有两层意思，一是天气回暖，降水量逐渐增多了；二是在降水形式上，雪渐少了，雨渐多了。和题干中时间、物候不相对应。 C 项：惊蛰，是二十四节气中的第三个节气，标志着仲春时节的开始，公历大约是每年3 月5 或3 月6 日。“春雷惊百虫”，惊蛰时节，气温回升较快，长江流域大部地区已渐有春雷。和题干中时间、物候不相对应。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-012","paperId":"gz2018b","num":12,"year":2018,"region":"广州","module":"常识判断","sub":"科技生活","stem":"海参生活在海底，以吃海中小生物为生，一旦进入夏季，海参就需夏眠，可能是因为：","options":["海水温度偏高，海参不耐热","海参为繁殖储备能量获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 -","海参用夏眠应对饥饿","海参为了逃避天敌"],"answer":"C","explanation":"正确答案：C，全站正确率：23%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 - 第一步，本题考查关于海参的生活习性。第二步，海参以吃海中小生物为生，这些小生物对海水温度很敏感，海面水暖，则上浮进行繁殖，水冷则潜回海底。入夏之后，海面暖和，这些生物纷纷到上层水域进行一年一度的繁殖，而栖身海底的海参不会游泳，只是用管足和肌肉的伸缩在海底蛹动爬行，不能游向海面。海参迫于食物中断，只能夏眠应对食物减少和饥饿。因此，选择C 选项。拓展海参是生活在海边至8000 米的海洋棘皮动物，距今已有六亿多年的历史，海参以海底藻类和浮游生物为食。海参全身长满肉刺，广布于世界各海洋中。当水温达20℃时，海参就会转移到深海的岩礁缝隙中或潜藏于石底，不吃不动，整个身体收缩变硬如刺球。一般动物不会吃掉它，它一睡就是一个夏季，等到秋后才苏醒过来恢复活动。为了保证种族的不被灭绝，在长期的自然选择进化过程中，海参拥有了超强的生殖能力。一头4 年以上的成年海参，在春季繁殖期，一次可排卵约500 万枚。这样，即使有万分之一的成活率，也可以保证种族的延续。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-013","paperId":"gz2018b","num":13,"year":2018,"region":"广州","module":"常识判断","sub":"科技生活","stem":"我国古代在医药科技方面取得了累累硕果，出现了不少重要的医学或科学名著，下列各名著按成书年代排序，正确的是：","options":["《黄帝内经》《齐民要术》《本草纲目》《梦溪笔谈》","《本草纲目》《梦溪笔谈》《黄帝内经》《齐民要术》","《梦溪笔谈》《本草纲目》《齐民要术》《黄帝内经》","《黄帝内经》《齐民要术》《梦溪笔谈》《本草纲目》"],"answer":"D","explanation":"正确答案：D，全站正确率：53%，易错项：A。解析第一步，本题考查古籍。第二步，《黄帝内经》是我国现存医书中最早的典籍之一，成书于战国至秦汉时期；《齐民要术》大约成书于北魏末年；《本草纲目》是明朝医药学家李时珍所著；《梦溪笔谈》是北宋科学家、政治家沈括所著。所以顺序为《黄帝内经》《齐民要术》《梦溪笔谈》《本草纲目》。因此，选择D 选项。拓展 ①《黄帝内经》分《灵枢》《素问》两部分，是中国最早的医学典籍，传统医学四大经典著作之一（其余三者为《难经》《伤寒杂病论》《神农本草经》）。《黄帝内经》是一本综合性的医书，在黄老道家理论上建立了中医学上的“阴阳五行学说”“脉象学说”“藏象学说”“经络学说”“病因学说”“病机学说”“病症”“诊法”“论治”及“养生学”“运气学”等学说，从整体观上来论述医学，呈现了自然、生物、心理、社会“整体医学模式”。 ②《齐民要术》大约成书于北魏末年（公元533-544 年），是北朝北魏时期，南朝宋至梁时期，中国杰出农学家贾思勰所著的一部综合性农学著作，也是世界农学史上最早的专著之一，是中国现存最早的一部完整的农书。该书记述了黄河流域下游地区，即今山西东南部、河北中南部、河南东北部和山东中北部的农业生产，盖述农、林、牧、渔、副等部门的生产技术知识。 ③《梦溪笔谈》是北宋科学家、政治家沈括所写，是一部涉及古代中国自然科学、工艺技术及社会历史现象的综合性笔记体著作。该书被英国科学史家李约瑟评价为“中国科学史上的里程碑”。 ④《本草纲目》是明朝医学家李时珍30 余年心血的结晶。全书共有190 多万字，记载了1892 种药物，分成 60 类。其中374 种是李时珍新增加的药物。绘图1100 多幅，并附有11000 多个药方。它是几千年来祖国药物学的总结。这本药典，不论从它严密的科学分类，或是从它包含药物的数目之多和流畅生动的文笔来看，都远远超过古代任何一部本草著作。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-014","paperId":"gz2018b","num":14,"year":2018,"region":"广州","module":"常识判断","sub":"科技生活","stem":"以植物和山石为基本材料表现自然景观的艺术品，是自然美与艺术美的有机结合，能在咫天空间集中体现山川神貌和园林艺术之美，被称为“立体的画”“无声的诗”的是：","options":["园林","盆景","石雕","刺绣"],"answer":"B","explanation":"正确答案：B，全站正确率：40%，易错项：A。解析第一步，本题考查中国传统文化之美。第二步，盆景是中国传统的艺术珍品，有着悠久的历史，它是自然美与艺术美的结合，被称作是有生命力的“艺雕”。它以植物、山、石、水土等为素材，经过创作者的构思设计，造型加工，精心护养而成。盆景艺术，素被称为“无声的诗”“立体的画”“凝固音乐”等，足见它与多种艺术一脉相通。因此，选择B 选项。拓展 A 项：园林以自然的山、水、地貌为基础，对景观有意识、有目的地加以改造加工，再现一个高度概括、提炼、典型化的自然。园林布景追求与自然的完美结合，力求达到人与自然的高度和谐，即\"天人合一\"的理想境界。题干中讲到了“体现园林艺术之美”，所以这种艺术形式不能再是园林。 C 项：石雕，指用各种可雕、可刻的石头，创造出具有一定空间的可视、可触的艺术形象，借以反映社会生活、表达艺术家的审美感受、审美情感、审美理想的艺术。不是以植物为基本材料。 D 项：刺绣又称丝绣，俗称“绣花”。就是用针将丝线或纱线以一定图案和色彩在绣料上穿刺，以缝迹构成花纹的装饰织物。它是用针和线把人的设计和制作添加在任何存在的织物上的一种艺术。不是以植物和山石为基本材料。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-015","paperId":"gz2018b","num":15,"year":2018,"region":"广州","module":"常识判断","sub":"政治","stem":"如地球和地面上所有东西在一瞬间停止自转，但大气保持原来的速度，错误的是：","options":["赤道将刮起超音速狂风","月亮盈亏现象依然存在","大陆上的空气温度瞬间急剧升高","地球上将再看不到日出日落"],"answer":"D","explanation":"正确答案：D，全站正确率：29%，易错项：C。解析第一步，本题考查地理常识并选错误项。第二步，地球自转引起昼夜交替，如果地球停止自转，只有公转，不是看不到日出日落，而是日出日落的周期获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 变成了一年，这会导致地球温差很大，一面很热，一面很冷。因此，选择D 选项。拓展 A 项：在赤道，地球表面相对于地轴的旋转速度约为每小时1700 千米。如果地球一瞬间停止自转而空气不受影响，会导致突然刮起一阵时速1700 千米的大风。 B 项：地球停止自转，但月球还会继续围绕地球公转，在地球上依旧可以看见月亮盈亏现象。 C 项：地球停止运动以后，大气保持原来的速度，会导致风与地面产生剧烈的摩擦，放出大量热。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-016","paperId":"gz2018b","num":16,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"从十九大到二十大，是“两个一百年”奋斗目标的历史交汇期。我们既要全面建成小康社会、实现第一个百年奋斗目标，又要________开启全面建设社会主义现代化国家新征程，向第二个百年奋斗目标进军。","options":["迎难而上","乘势而上","一鼓作气","中流击水"],"answer":"B","explanation":"正确答案：B，全站正确率：68%，易错项：C。解析第一步，分析语境。文段说的是我们既要全面建成小康社会、实现第一个百年奋斗目标，又要开启全面建设社会主义现代化国家新征程，横线处的词语表达的是在实现第一个目标之后以什么样的状态去迎接新征程。第二步，辨析选项。A 项“迎难而上”意思是就算遇到困难也不退缩，迎着困难去克服它，形容不怕困难，不怕挫折，勇敢挑战。文中是“实现第一个百年奋斗目标”而非“存在困难”，排除A 项。B 项“乘势而上”意思是顺着当前的大好形势继续努力，符合语境。C 项“一鼓作气”比喻在劲头正盛时，一下子完成，多指完成一件事情时，坚持下去，与文段“实现一个目标之后再去开启新阶段”的语境不符，且“百年奋斗目标”也不能一下子就完成，排除C 项。D 项“中流击水”比喻立志奋发图强，没有体现出趁着当前的大好形势继续向前发展的意思，排除D 项。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-017","paperId":"gz2018b","num":17,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"对不同季节的雨，古人的态度________，于是才有春雨如恩诏、夏雨如赦书、秋雨如挽歌的说法。填入下列横线处的词语，最恰当的是：","options":["迥然不同","毫无二致","大相径庭","模棱两可"],"answer":"A","explanation":"正确答案：A，全站正确率：74%，易错项：C。解析第一步，分析语境。横线处填入的词语形容的是古人对不同季节的雨的态度，根据下文“于是才有春雨如恩诏、夏雨如赦书、秋雨如挽歌的说法”可知，古人对不同季节的雨的态度是不同的。第二步，辨析选项。B 项“毫无二致”指的是相同，与文段意思相反；D 项“模棱两可”是指既不肯定也不否定，不符合文意。比较容易排除B 项和D 项。对比A 项“迥然不同”和C 项“大相径庭”，“迥然不同”形容完全不同，“大相径庭”重在强调相差很远，有差别，而文段侧重的是完全不同，“迥然不同”更符合语境，排除C 项。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-018","paperId":"gz2018b","num":18,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"填入下列横线处的词语，最恰当的是：如果把各项改革任务比作一个个盘子，那么领导干部就要学会“转盘子”，实现任务之间的________协调，才能同时转动多个盘子，下好改革一盘棋。","options":["沟通","统一","整合","耦合"],"answer":"D","explanation":"正确答案：D，全站正确率：15%，易错项：B。解析第一步，分析语境。根据后文“同时转动多个盘子”，横线处填入的词语形容的是多个任务之间的协调关系。第二步，辨析选项。A 项“沟通”泛指使两方相通连或疏通彼此的意见，沟通的对象多与人、组织和国家等相关，用于任务之间搭配不当，排除A 项。B 项“统一”和C 项“整合”均强调“整体性”，与文段强调多个任务之间相互协调的语境不符，排除B 项和C 项。D 项“耦合”是指某两个或多个事物之间相互作用、相互影响，侧重“相互配合协调”，符合文意。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-019","paperId":"gz2018b","num":19,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：新媒体时代有新媒体时代的传播特点，从这些特点出发，对一些文章标题进行________，以适应网络舆论场的传播，这样的做法不可________。但有些“标题党”为吸引眼球，故意制作带有误导性、煽动性的标题，扭曲了原意，误导了读者，滋生了不必要的价值冲突。","options":["精雕细琢一语道破","全盘否定一成不变","适度改造一概否定","改头换面一笑了之"],"answer":"C","explanation":"正确答案：C，全站正确率：89%，易错项：D。解析第一步，突破口在第二空。文段第二句“但”表转折，后文全面否定了“标题党”，转折前后形成反向照应，则转折之前应当表达对“文章标题”不应该持全面否定的态度。A 项“一语道破”指一句话就说穿了，不符合语境，排除A 项。B 项“一成不变”指一经形成，不再改变，不符合语境，排除B 项。C 项“一概否定”侧重于全盘否定，符合语境。D 项“一笑了之”指笑一笑就算了事，指不予重视，不符合语境，排除D 项。答案锁定C 选项。第二步，验证第一空。“对一些文章标题进行适度改造”符合语境。因此，选择C 选项。拓展精雕细琢：比喻做事情精益求精。全盘否定：彻底否定原定的方案或决定，推倒重来。改头换面：原指人的容貌发生了改变。现多比喻只改外表和形式，内容实质不变。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-020","paperId":"gz2018b","num":20,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：新，还往往伴随着快。新业态的成长有时快到________、机会宝贵到稍纵即逝，好像逼着经营者不得不“多干快上”。但从另外一个角度看，新业态往往又更敏感、更脆弱、不确定性更大，更加容不得________、“蒙眼狂奔”。","options":["一日千里急功近利","突飞猛进好大喜功","日新月异浮光掠影","应接不暇好高鹜远"],"answer":"A","explanation":"正确答案：A，全站正确率：71%，易错项：D。解析第一步，分析第一空。根据“新业态的成长有时快到________、机会宝贵到稍纵即逝”可知，第一空所填词语强调新业态成长快。A 项“一日千里”指马跑得很快，一天能跑一千里，后比喻事物的进展快；B 项“突飞猛进”形容进步和发展特别迅速；C 项“日新月异”指发展或进步迅速，不断出现新事物、新气象。三者都含有 “发展快”之意，均符合文意。而D 项“应接不暇”形容来人或事情太多，应付不过来，没有“快”之意，不符合语境，排除D 项。第二步，分析第二空。第二空所填词语与“蒙眼狂奔”构成并列，“蒙眼狂奔”指蒙上眼睛快速奔跑，侧重于 “快”。A 项“急功近利”意思是急于求成，贪图眼前的成效和利益，含有“急而快”之意，符合语境。B 项获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - “好大喜功”指不管条件是否许可，一心想做大事立大功，多用以形容浮夸的作风，与“快”无关，不符合语境，排除B 项。C 项“浮光掠影”指水面的光和掠过的影子，一晃就消逝，比喻观察不细致，学习不深入，印象不深刻，不符合语境，排除C 项。因此，选择A 选项。拓展好高鹜远：比喻不切实际地追求过高、过远的目标。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-021","paperId":"gz2018b","num":21,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：在需要逐级请示、层层审批的制度下，我们已然习惯了对权威的________，对经验的________，对实证研究的 ________，如何能够培育出自有创新的文化？","options":["顺从相信轻视","服从相信藐视","顺从轻信藐视","服从轻信轻视"],"answer":"D","explanation":"正确答案：D，全站正确率：52%，易错项：A。解析第一步，突破口在第二空。文段结尾运用反问的形式，可知前文描述为消极倾向。A 项和B 项“相信”指认为正确或确实，不怀疑，为中性词，不符语境，排除A 项和B 项。C 项和D 项“轻信”指轻易相信，感情色彩偏消极，符合语境。第二步，再分析第一空。C 项“顺从”是指顺服、服从、不违抗的意思。D 项“服从”指顺服，遵从，也指屈服于别人的意志或者权力。“服从”一词更能够呼应前文的“逐级请示、层层审批”“权威”的上下级关系， “顺从”不适合该语境。答案锁定D 选项。第三步，验证第三空。“轻视”指小看，不重视。“对实证研究的轻视”是一种错误做法，符合文段的消极倾向，D 项符合文意。因此，选择D 选项。拓展藐视：认为（某种事物）很卑贱、渺小、没有价值或令人厌恶，从而对它加以轻视，加以嘲笑。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-022","paperId":"gz2018b","num":22,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：中国社会正进入环境敏感期，面对环保权益冲突，公民与政府之间实现良性互动，需要公民依法理性表达诉求，更需要政府建立透明的决策机制、畅通的沟通渠道。________的辟谣，不如________的公开；________的处置，不如________的倾听。","options":["事前事后临时常态","事后事前临时常态","事前事后常态临时","事后事前常态临时"],"answer":"B","explanation":"正确答案：B，全站正确率：91%，易错项：D。解析第一步，分析第一空。空格修饰“辟谣”。“辟谣”指对谣言予以澄清或驳斥，一般发生在事后，排除A 项和 C 项。第二步，分析第四空。根据“不如”可知，之后是更好的做法。B 项“常态”指平常的、正常的状态，“常态的倾听”即平时就要倾听百姓民声，符合文意。而D 项“临时”指事到临头，表示事情将要发生的时候，“临时的倾听”即之前没有应对措施，事到临头才倾听，感情色彩偏消极。由此可知，“常态的倾听”才是原文提倡的做法，B 项符合文意，排除D 项。答案锁定B 选项。第三步，代入验证第二空和第三空。“事后的辟谣不如事前的公开；临时的处置不如常态的倾听”，符合文意。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-023","paperId":"gz2018b","num":23,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：党内生活的新常态也好，组织纪律的新要求也好，________最终在每个党员干部心理认同的轨迹上运行， ________行之久远，________反腐败与改作风的风暴之后，一切陈规陋习、不良作风都会卷土重来。","options":["既然那么不然","如果那么况且","不但而且否则","只有才能否则"],"answer":"D","explanation":"正确答案：D，全站正确率：94%，易错项：C。解析第一步，分析第一空和第二空。“在每个党员干部心理认同的轨迹上运行”是党员心理层面的内容，“行之久远”是预期的目标，其省略主语是开头的“新常态”“新要求”，前者是条件，后者是目标。A 项和B 项的“那么”如果填入第二空，则此句缺少句子成分，应该表述为“那么才能行之久远”或者“那么行之久远才有可能”，排除A 项和B 项。C 项“不但……而且……”表示递进关系，原文的党员心理认同和新常态、新要求不能构成递进关系，不符合语境，排除C 项。D 项“只有……才能……”为条件关系，符合语境。答案锁定D 选项。第二步，验证第三空。“不良作风、陈规陋习”是前面做法的反面结果，“否则”表示“如果不是这样，就……”，符合文意。因此，选择D 选项。拓展况且：连词，表示更近一层的意思。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-024","paperId":"gz2018b","num":24,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：党的十八大以来，城乡一体化发展的“进度条”在加速。________农民收入水平________农村城镇化水平， ________有明显提高，乡村正积蓄着变革的伟力。党的十九大提出“城乡融合”的新方向，________为乡村振兴的“质变”吹响了有力号角。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 -","options":["不管抑或也还","不论遑论就也","由于或者都又","无论还是都更"],"answer":"D","explanation":"正确答案：D，全站正确率：96%，易错项：C。解析第一步，分析语境。根据“‘进度条’在加速”和“积蓄着变革的伟力”，可知“农民收入水平”和“农村城镇化水平”相并列，对应“有明显提高”这一结果。C 项“由于”表示因果关系，但原文不存在因果关系，排除C 项。第三空A 项“也”和B 项“就”，与前文关联词搭配不当，排除A 项和B 项。答案锁定D 选项。第二步，验证第四空。“更”表示强调，表达了“党的十九大”的发展和进步，符合文意。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-025","paperId":"gz2018b","num":25,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"依次填入下列横线处的词语，最恰当的是：大国博弈，正从陆地走向海洋。正如“两弹一星”赋予中国大国地位一样，________具备与海权相匹配的实力， ________穿越东海南海的激流暗礁，不欺人的中国才能不被人欺。这________穷兵黩武，________自卫反击。","options":["只有才会不仅是更是","不仅而且不仅是更是","因为所以不是而是","只有才能不是而是"],"answer":"D","explanation":"正确答案：D，全站正确率：86%，易错项：A。解析第一步，突破口在后两空。“穷兵黩武”和“自卫反击”之间是相反相对的关系。A 项和B 项“不仅是……更是”表示递进关系，不符合文意，排除A 项和B 项。C 项和D 项“不是……而是”表示相反相对的并列关系，符合文意。第二步，分析前两空。“具备与海权相匹配的实力”是“穿越暗礁、不被人欺”的条件。C 项“因为……所以” 表示因果关系，不符合语境，排除C 项。D 项“只有……才能”表示条件关系，符合语境。因此，选择D 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 -","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-026","paperId":"gz2018b","num":26,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"中国要想在21 世纪里有较大的作为，就绝不应该仅仅在国际竞争和互动的一般技巧上下工夫，更重要的是及时认清世界政治特征演变和发展大势，从而激发出更大的战略智慧，敏锐洞察未来世界可能的走势，及时消除自身存在的不适合未来发展的种种弊端，维护国家的安全和利益，谋求社会的全面发展。换言之，国际战略的使命不是也不可能是为世界设计某种自以为是的结局。这段文字意在强调：","options":["中国的国际战略应该认清世界政治特征演变和发展大势","中国的国际战略应该消除不适合未来发展的种种弊端","中国的国际战略应当维护国家安全和利益谋求全面发展","中国的国际战略应该适应世界政治特征演变和发展大势"],"answer":"D","explanation":"正确答案：D，全站正确率：32%，易错项：A。解析第一步，分析文段。文段首句用一个递进关系强调中国要想在21 世纪有较大的作为的做法，“更重要的是” 后面提到了两点对策，一是“及时认清世界政治特征演变和发展大势”，一是“及时消除自身存在的不适合未来发展的种种弊端”，尾句介绍国际战略的使命不是什么。对首句递进之后的对策进行概括可知，中国的国际战略应该认清并适应国际发展大势。第二步，对比选项。D 项符合文段意图。因此，选择D 选项。拓展 A 项和B 项：对应两个对策的其中之一，片面。C 项：没有提到“世界发展大势”。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-027","paperId":"gz2018b","num":27,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"当群体成员凝聚力很高时，群体成员倾向于让自己的观点与群体保持一致，而其他有争议、有创意甚至更客观合理的观点则会遭到忽视或压制。这可能会导致群体作出不合理甚至很糟糕的决策。类似的现象有可能出现在网络民意表达过程。人们更可能被吸引到自身意见一致的论坛中，并在其中不断加深自己原有的观点。这样就有可能产生群体迷思，形成不正确的却为大多数人所拥护的占优势的意见，出现不同意见者“被代表”和把持言论的情况。这段文字给政府管理的启示是：","options":["网络舆论未必能够代表网民的真实想法，政府征求民意时应对此有所甄别","网络民意表达存在虚假性，不适合作为政府征求民意的渠道","网络空间匿名性造成网络民意容易被操控，政府应加强对网络空间的管控","政府在通过网络征求民意时，应当少说多听，允许不同意见乃至质疑的声音存在"],"answer":"A","explanation":"正确答案：A，全站正确率：52%，易错项：D。解析第一步，分析文段。文段首先用两句话铺垫，讲述了群体成员凝聚力高的隐患，接着把话题转到了“网络民意表达”上，接着讲述了网络民意常见表现，最后“这样就”作总结，论述了网络民意表达“可能产生群体迷思……”。文段为“分—总”结构，最后一句总结句是文段的主旨句，重点讲述了网络民意表达的弊端。第二步，对比选项。A 项“未必能够代表网民的真实想法”“应对此有所甄别”是针对文段重点（网络民意表达）“可能产生群体迷思”提出的对策，符合原文给政府管理的启示。因此，选择A 选项。拓展 B 项：“不适合作为政府征求民意的渠道”，表述过于绝对，原文用了“有可能”讲弊端，说明只是一种可能性，并不能直接将其否定。C 项：“网络空间匿名性造成……”无中生有。D 项：其表述并没有将文段重点中网络民意的不足考虑在内，不符合文段意图。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-028","paperId":"gz2018b","num":28,"year":2018,"region":"广州","module":"言语理解与表达","sub":"语句表达","stem":"从积极层面上看，过度消费是人们物质生活水平提高，消费能力提升的一种表征。与此同时，人们的消费观念也在不断升级，这在客观上也导致了商品更新换代速度的增快，以及浪费现象的突出。但更根本的原因是，消费社会的语境通过赋予商品和消费新的内涵，始终在不断怂恿着人们的消费行为。以下最适合作为上文标题的是：","options":["过度消费其实无法控制","转变观念，减少过度消费","是什么催生了过度消费","被符号绑架的过度消费"],"answer":"C","explanation":"正确答案：C，全站正确率：70%，易错项：D。解析第一步，分析文段。文段首先从积极层面，用“与此同时”并列描述了过度消费的两方面原因，接着用“但” 转折关系强调了过度消费“更根本的原因”，转折之后即是文段的主旨句。第二步，对比选项。C 项“是什么催生了过度消费”即是讲述过度消费的原因，是对文段主旨句的同义替换。因此，选择C 选项。拓展 A 项：“其实无法控制”无中生有。B 项：“转变观念”对应原文并列之后，原文转折之前的部分，偏离文段重点。D 项：“被符号绑架”无中生有。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-029","paperId":"gz2018b","num":29,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"今天，正风反腐之下，有些干部感叹不舒服、不自由了。在一定意义上说，这种心理与其对自由的观念看法密不可分。诚如马克思所言，法典是人民自由的圣经。然而道理容易明白，但在潜意识和直观感受中，有人还是把自由视为不受限制、没有约束，或者少受限制、鲜有约束。问题是，无所限制的自由必然是扭曲的，也是不真实的，只能存留于想象之中。谁要真是如此任性地看待自由，无所顾忌、不知敬畏，谁就终将付出惨重代价。这段文字主要说明：","options":["自律是前提和保障，自由是目的和依归","构建在自律基座上的自由，才是真正的自由","自由快乐之人，必是敬畏法度之人","不能恪守自律，就会导致身心双重的不自由"],"answer":"C","explanation":"正确答案：C，全站正确率：21%，易错项：B。解析第一步，分析文段。首句指出了干部感叹不自由这一问题，第二句分析其原因是由于对自由观念的看法，第三句提出对自由应持的正确认识为“法典是人民自由的圣经”。后文“然而”“问题是”指出了现实人们对自由认识的错误，最后一句通过反面论证支撑前文对待自由的观念，即“不能如此任性地看待自由”，结合前文，文段重点可以理解为：我们应该在法典之内享有自由。第二步，对比选项。C 项“敬畏法度”与原文强调的“法典”一致，为文段重点的同义替换。因此，选择C 选项。拓展 A 项、B 项和D 项：三项均强调“自律”，文段并未提及，无中生有。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-030","paperId":"gz2018b","num":30,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"目前，我国蓝领岗位中依旧还有大量的瓦工、钢筋工、锅炉工、油漆工等工种，而受专业“学科化”等影响，在我国中等职业教育专业目录中仅能找到相关的、且带有浓厚“学科”色彩的专业名称，而这些专业名称很难让学生将未来相应的就业岗位与上述蓝领岗位对应起来，造成真正进入上述蓝领岗位的毕业生“大打折扣”。这段文字意在指出：","options":["我国中等职业教育的专业目录需要根据实际岗位需求调整","我国中等职业教育的专业教育无法培养学生进入蓝领岗位","瓦工、钢筋工、锅炉工等岗位不是传统意义上的蓝领工种","专业名称设置与实际教育内容脱节导致中职学生就业困难"],"answer":"A","explanation":"正确答案：A，全站正确率：51%，易错项：D。解析第一步，分析文段。文段首先列举了一些蓝领岗位，接着描述了“我国中等职业教育专业目录”与前文现实脱节，最后通过“而这……”“造成……”指出了这种现象的危害。最后部分“造成”的危害为文段重点，其根源为“我国中等职业教育专业目录”设置不合理。第二步，对比选项。A 项“专业目录需要根据实际岗位需求调整”提出对策，解决了原文重点中的问题，符合文段意图。因此，选择A 选项。拓展 B 项：“专业教育”偷换概念，原文讲述的是专业目录中的专业名称的问题。且“无法培养”过于绝对，无中生有。C 项：围绕背景话题讲述，偏离重点，且“不是传统意义上的蓝领工种”无中生有。D 项：“与实际教育内容脱节”表述错误，原文是与“未来相应的就业岗位”脱节。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-031","paperId":"gz2018b","num":31,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"在当下，公共性成了博物馆、美术馆最重要的性质之一，一场大展能产生踏破门槛、万人空巷的盛况。这是现代人与艺术品发生关系最便捷的方式。而如果今天还有人延续流觞曲水、观画赋诗并广而告之以此为之炫耀，难免被人们斥为“太装”，最终落下附庸风雅的笑谈。这段文字意在强调：","options":["审美方式需要与时俱进","历史越往后发展，艺术品越具有公共性","强装古雅欣赏艺术不是现代人应该表现的行为","中国人艺术修为在不断进化获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -"],"answer":"A","explanation":"正确答案：A，全站正确率：37%，易错项：C。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 - 第一步，分析文段。第一句介绍了博物馆和美术馆具有公共性的性质，随后通过“这”总结，指出“这是现代人与艺术品发生关系最便捷的方式”，即去公共场所是现代人欣赏艺术品最便捷的方式。第三句通过“而”与前文进行对比论述，如果今天还有人用古代小众文人雅士们偏高雅的方式去欣赏艺术品，并广而告之加以炫耀，则会被斥为“太装”，引起笑话。通过分析可知，文段通过前后对比，意在强调“欣赏艺术品的方式”要有所改变，去公共场所是现代人欣赏艺术品最便捷的方式。第二步，对比选项。A 项“审美方式需要与时俱进”符合文段意图。因此，选择A 选项。拓展 B 项：“艺术品的公共性”偏离文段重点，文段重点强调的人们欣赏艺术品的方式。C 项：表述不具体，为否定表达，“强装古雅欣赏艺术是不该有的行为”，那怎样才是该有的行为并不明确。D 项：“中国人艺术修为” 非重点，文段强调的是人们欣赏艺术的方式。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-032","paperId":"gz2018b","num":32,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"当前，我国考试招生制度改革正全面展开，希望通过高考改革撬动基础教育阶段的改革，鼓励中学将育人方向从“单纯育分”调整为“全面育人”，从追求学科成绩转向促进学生成长。同时，通过综合素质评价鼓励中学个性化教育，引导学生自我认知、找到自己的兴趣特长和个性所在。反过来讲，如果中考加分项目继续扩张，不仅可能影响这一阶段的教育改革质量，还可能会冲掉高考改革的成果。这段文字认为，从我国教育改革的现实逻辑看：","options":["对中考加分实行瘦身改革是教育改革的大势所趋","考试加分政策改革是体现高考改革效果的必要前提","为彰显教育化人、育人本质，必须全面取消中考加分","中考加分项目应顺应教育规律，进一步推动教育公平"],"answer":"A","explanation":"正确答案：A，全站正确率：43%，易错项：D。解析第一步，分析文段。文段前半部分通过“同时”引导我国教育改革的相关内容，一方面提出当前考试招生制度改革正在全面展开，希望能推动基础教育的改革，鼓励中学将育人方向发生转变，另一方面通过综合素质评价鼓励中学个性化教育。文段尾句通过反面论证，提出核心观点，为文段的主旨句，即如果中考加分项目继续扩张，会带来诸多负面结果。也就是中考加分项目不能继续扩张。第二步，对比选项。A 项围绕主旨句进行选项设计，论述不能继续扩大中考加分项目，即“中考加分实行瘦身是大趋势”。因此，选择A 选项。拓展 B 项：感情倾向与原文不符，文段是在否定中考加分政策，而非肯定。C 项：表述过于绝对，文段论述的是“中考加分项目不能继续扩张”，而不是“全面取消中考加分”。D 项：感情倾向与原文不符，且偏离重点，文段重点论述的是“中考加分不应继续扩张”，而非“应顺应教育规律”。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-033","paperId":"gz2018b","num":33,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"地图本来是状物的，它不该有人，也不能有人，地图里要是出了人，就不是地图，而是图画了。这句话在严格意义上应该是定理，但碰到某些旅游图怕是拐弯了——旅游中往往是既有风物又有人物存在的。这就像泰山、兵马俑旅游图中一定要说到秦始皇，十三陵旅游图一定要说到历代明皇，颐和园旅游图中一定会说到慈禧太后一样。因为，在那个环境中许多景致的产生由人的活动为起点，更因为人的活动而增添其审美价值。这段文字作者认为：","options":["有人物的地图不是真正的地图","有人物的地图更能增添地图的审美价值","旅游图必须有标志风物和人物","旅游图也是一种地图"],"answer":"C","explanation":"正确答案：C，全站正确率：18%，易错项：B。解析第一步，分析文段。文段首句提出“地图里不应该有人”这一观点。接着通过转折关联词“但”引出作者的观点，即“碰到某些旅游图怕是拐弯了——旅游中往往是既有风物又有人物存在的”。后文通过列举“泰山”“十三陵”“颐和园”等例子进行举例论证，表明旅游图离不开人物。尾句通过“因为”进一步进行原因分析，继续论证旅游图中应当有人物。所以，文段作者的观点在转折词“但”之后，即旅游图中应包含风物与人物。第二步，对比选项。C 项“旅游图必须有标志风物和人物”符合作者观点。因此，选择C 选项。拓展 A 项和B 项：偏离文段核心话题“旅游图”。D 项：缺少“人物”这一核心话题。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-034","paperId":"gz2018b","num":34,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"当前，互联网技术发展迅猛，技术进步的同时，也在不断制造新的安全漏洞。依靠政府的力量维护信息安全，经常力有不逮。当今互联网安全的前沿技术，大多掌握在企业手中，需要调动更多的社会力量，发挥企业和市场的作用。通过市场激励机制，也可以调动“白帽子”的网络安全志愿者主动发现报告网络安全漏洞。这段文字意在说明：","options":["是否善于保护公民个人信息，不仅折射国家理念，更涉及国家利益","应当通过市场激励方式，调动社会力量参与保障网络信息安全","如何保护个人信息安全，不仅是一个技术命题，更是一个制度命题","调动社会力量参与保障网络信息安全，可以达到事半功倍的效果"],"answer":"B","explanation":"正确答案：B，全站正确率：77%，易错项：D。解析第一步，分析文段。文段开篇提出问题“互联网技术的发展制造了很多新的安全漏洞”。第二句说明仅仅依靠政府的力量往往不够。后文通过“需要”提出对策，引出文段的主旨句，即“调动更多社会力量，发挥企业和市场的作用”，通过“市场激励机制”的手段调动网络安全志愿者。第二步，对比选项。B 项是对主旨句的同义替换，符合文段意图。因此，选择B 选项。拓展 A 项、C 项和D 项：A 项中的“保护公民个人信息”“国家理念”“国家利益”，C 项“制度命题”和D 项“事半功倍的效果”在文段中均未体现，为无中生有。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-035","paperId":"gz2018b","num":35,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"阅读场景的变化，引发了一场知识领域的大变革：传统的知识载体——书籍上的图钉被网络撬开了，知识信息漂浮了起来，成为碎片化的存在。网络放大了这些信息碎片，进而改变了人们的阅读心态。换句话说，面对海量信息，人们的信息焦虑症也更严重，时间不够用了，注意力也不够用了，读过的信息像手中的沙子一样，记不住、留不下。海量信息缺乏装订工具和装订方式，正是被很多人称为“阅读危机”的根本所在。关于这段文字，以下理解准确的是：","options":["“阅读危机”的产生是因为海量阅读","读者的阅读心态随着阅读场景的变化而发生改变","传统阅读比网络阅读更能吸引读者的注意力","全新的装订方式能够解决“阅读危机”"],"answer":"B","explanation":"正确答案：B，全站正确率：55%，易错项：A。解析第一步，分析文段，将选项与文段一一对应。第二步，辨析选项。A 项和D 项对应尾句“海量信息缺乏装订工具和装订方式，正是被很多人称为‘阅读危机’ 的根本所在”。A 项“阅读危机”的产生是“海量信息缺乏装订工具和装订方式”而非“海量阅读”，属于偷换概念，排除A 项；D 项文中提到“装订工具”和“装订方式”二者，D 项仅提及其中一个方面，表述片面，排除D 项。B 项对应文段第二句，“网络放大了这些信息碎片，进而改变了人们的阅读心态”，也就是说明读者的阅读心态随着阅读场景的变化而发生改变，B 项理解准确。C 项为无中生有，文中无传统阅读和网络阅读二者的比较，排除C 项。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-036","paperId":"gz2018b","num":36,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①于是弘扬古老的节气，不是从古籍中摘录关于节气物候的词句，而是需要能下苦功夫耐得住寂寞，完成前人没有完成的节令物候的本土化描述 ②随着疆土的扩展，人们早已发现气候并无通例 ③立春一候，在东北，距离“东风解冻”尚远。立冬一候，在海南，只能在冰箱体会节气所说的“水始冰” ④古老的物候，似乎更具史学意义和文化价值，于今天无法承担物候坐标的职能 ⑤各地的物候完全无法以同一标尺进行“一刀切”的表达","options":["⑤③②①④","③⑤②④①","②③⑤④①","④②③①⑤"],"answer":"C","explanation":"正确答案：C，全站正确率：64%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - 第一步，观察选项特征，确定首句。首句有②③④⑤四种可能性，②“随着”引导背景，③提及东北、海南的物候情况，④阐述“古老的物候”，⑤论述各地物候无法用同一标尺表述。根据首句特征，背景铺垫常为首句，因此②作为首句的可能性最大。答案暂锁定C 选项。第二步，验证C 项。②提到了疆土的扩张，③提到了“东北”“海南”地域的差异，根据捆绑排序的话题一致原则，②③链接。⑤正好是②③得出的结论，②③⑤链接。④提到古老的物候无法承担，①“于是”正好承接它来解决问题，④①链接。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-037","paperId":"gz2018b","num":37,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①只有通过构建新型国际关系，坚持和平发展、互利共赢，各国才能避免冲突、务实合作，实现共同利益最大化，最终建成“共同体” ②西方主流观点认为，世界是竞争性、冲突性、二元对立的，国际政治是零和游戏；各国只考虑自己的利益，必然是各自为政，以邻为壑 ③如果被这种想法支配，那就还是赤裸裸的权利政治，就永远实现不了人类命运共同体 ④“构建新型国际关系”和“构建人类命运共同体”是路径和目标的关系","options":["④①③②","④②③①","②④①③","②①③④"],"answer":"B","explanation":"正确答案：B，全站正确率：77%，易错项：A。解析第一步，观察选项特征，确定首句。首句有②④两种可能性，根据首句特征，此题中首句特点不明显，不易确定首句。第二句，结合每句话话题，捆绑排序。根据代词捆绑可知，②为③中“这种想法”所指代的内容，②③链接，排除A 项、C 项和D 项。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-038","paperId":"gz2018b","num":38,"year":2018,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①经济结构化、创新能力提升、区域发展协调、生态环境改善、人民获得感增强等，都是高质量发展时期的新追求 ②把好脉、选对路、巧施策，我国经济在实现高质量发展上就能不断取得新成效 ③推动高质量发展，应更好兼顾社会效益 ④制定宏观政策不仅要善于算好经济账，更要算好生态账、民生账、社会账，看看是否有利于美好生活需要的获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 实现 ⑤与过去高速度发展单纯追求经济增长不同，高质量发展是一个“多目标、多任务”的系统工程","options":["①④②⑤③","③⑤①④②","④⑤②③①","⑤③②④①"],"answer":"B","explanation":"正确答案：B，全站正确率：34%，易错项：D。解析第一步，观察选项特征，确定首句。首句有①③④⑤四种可能性，根据首句特征，此题中首句特点不明显，不易确定首句。第二步，结合每句话话题，捆绑排序。①句阐述了高质量发展时期的多种新追求，②句强调了高质量发展不断取得新成效的要求，③句针对高质量发展提出兼顾社会效益，④句阐述了制定宏观政策的要求，⑤句介绍了高质量是“多目标、多任务”的工程。观察句子话题，其中有四句话都涉及到了高质量发展，接下来再观察每个句子新的话题突破口，通过①句中的“多种新追求”，⑤句中的“多目标、多任务”可知，①句为对⑤句的解释说明，⑤①链接。排除A 项、C 项和D 项。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-039","paperId":"gz2018b","num":39,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"随着国家综合实力的不断增强，国家在“三农”领域的政策由过去的“只取不予”完全变成了“只予不取”，对广大农民而言，这是一个伟大的转折。在“只予不取”的视野下，________________。措施得当，“四两拨千斤”，花少钱也能办大事；措施欠妥，花再多钱也有可能把好事办坏。填入划横线部分最恰当的一句是：","options":["农村治理必须突出基层群众的自主性、自治性","有必要对农村实际情况进行全面了解","农村治理依然存在讲求什么样的方式方法的问题","只有符合农村实际，符合农民意愿，才能有所成效"],"answer":"C","explanation":"正确答案：C，全站正确率：51%，易错项：D。解析第一步，分析横线处的上下文语境。根据横线前后语境可知，上文强调“三农”政策“只予不取”大背景，下文强调措施得当或欠妥会取得的两种截然不同的结果，所以根据话题一致和前后照应原则，填入语句应该是关于在“只予不取”背景下，措施本身是否合理、得当的表述。第二步，对比选项。C 项符合上述语境。因此，选择C 选项。拓展 A 项：“自主性、自治性”与“只予不取”的政策背景冲突。B 项和D 项：为得当措施的内容，而非对措施本身进行判断的表述，不能照应下文。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-040","paperId":"gz2018b","num":40,"year":2018,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"如果社会机制健全，社会弱势群体能够通过合法的制度化途径来表达自己的利益并均衡社会利益，那么社会冲突的频率、强度和烈度将大为降低。但在社会的转型加速期，由于某些结构性的原因，社会中的弱势群体最终通过社会冲突的方式来捍卫自身的权益。结果是，________________。填入划横线部分最恰当的一句是：","options":["弱势群体利益表达的话语权缺失","转型加速期成为社会冲突的多发时期","弱势群体社会组织化程度低，谈判能力受限","强势群体操控媒介、干扰公共政策加剧了社会冲突"],"answer":"B","explanation":"正确答案：B，全站正确率：54%，易错项：D。解析第一步，分析横线处的上文语境。横线出现在文末，根据横线前“结果是”可知，横线处需要填入前文结论。分析上文语境找结论。上文首先说明通过合法制度化途径捍卫利益，社会冲突降低。接着通过转折词“但”强调转型加速期和上文正好语义相反。那么，下文应该强调通过社会冲突的方式捍卫权益，冲突加强。所以根据话题一致和前后照应原则，填入语句应该强调转型加速期冲突加强。第二步，对比选项。B 符合上述语境。因此，选择B 项。拓展 A 项：“话语权缺失”无中生有，话题不一致。C 项：“社会组织化程度低，谈判能力受限”无中生有，话题不一致。D 项：“强势媒体”“操控媒介、干扰公共政策”无中生有，话题不一致。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-042","paperId":"gz2018b","num":42,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"2，8，18，32，50，（）","options":["68","72","76","98"],"answer":"B","explanation":"正确答案：B，全站正确率：89%，易错项：C。解析第一步，数列变化趋势平缓，优先考虑做差。第二步，做差如图所示：差数列是一个公差为4 的等差数列，下一项为18＋4＝22，则所求项为50＋22＝72。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-043","paperId":"gz2018b","num":43,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"9，20，35，54，77，（）","options":["104","135","154","166"],"answer":"A","explanation":"正确答案：A，全站正确率：89%，易错项：B。解析第一步，数列变化趋势平缓，优先考虑做差。第二步，做差如图所示：差数列是一个公差为4 的等差数列，则下一项为23＋4＝27，则所求项为77＋27＝104。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-044","paperId":"gz2018b","num":44,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"1，4，10，22，46，（）","options":["70","72","92","94"],"answer":"D","explanation":"正确答案：D，全站正确率：86%，易错项：C。解析解法一：第一步，数列变化趋势较快，考虑倍数递推数列。第二步，观察数列发现4＝1×2＋2，10＝4×2＋2，22＝10×2＋2，46＝22×2＋2，规律为第二项＝第一项× 2＋2，则所求项为46×2＋2＝94。因此，选择D 选项。解法二：考虑做差，做差如图所示：差数列是公比为2 的等比数列，下一项为24×2＝48，则所求项为46＋48＝94。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-045","paperId":"gz2018b","num":45,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"3，11，13，29，（）","options":["31","34","38","41"],"answer":"A","explanation":"正确答案：A，全站正确率：46%，易错项：D。解析第一步，观察数列，每项数据皆在幂次数附近波动，考虑幂次修正数列。第二步，幂次化指数形式如下：底数数列是公差为1 的等差数列，所求项底数为5＋1＝6，指数数列是2 的常数数列。修正数列是－1，2，－ 3，4，下一项为－5。则所求项为6²－5＝31。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-046","paperId":"gz2018b","num":46,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙三个小朋友中任意两人身高的平均数加上另外一个小朋友的身高，分别为258 厘米，238 厘米， 230 厘米，则这三个小朋友的平均身高值是（）厘米。","options":["118","120","121","122"],"answer":"C","explanation":"正确答案：C，全站正确率：65%，易错项：B。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 第一步，本题考查平均数问题，用方程法解题。第二步，设三个小朋友身高分别为x、y、z，根据题意列式，化简为：，解得x＋y＋z＝363。第三步，三个小朋友的平均身高为（厘米）。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-047","paperId":"gz2018b","num":47,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"篮子里有苹果和梨子两种水果若干个，将这些水果分发给13 人，每人最少拿一个，最多拿两个不同的水果。已知有9 个人拿到了苹果，有8 人拿到了梨，最后全部分完。那么，有（）人只拿到了苹果。","options":["4","5","6","7"],"answer":"B","explanation":"正确答案：B，全站正确率：64%，易错项：A。解析第一步，本题考查容斥问题，属于二集合容斥类。第二步，拿到苹果的人数＋拿到梨的人数－总人数＝两种水果都拿到的人数，代入数据可得9＋8－13＝4，有 4 人拿到两种水果，只拿到苹果的有9－4＝5（人）。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-048","paperId":"gz2018b","num":48,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"A、B、C、D 四个小朋友进行分组跳绳比赛，结果A 与B 两个小朋友比C 与D 两个小朋友多跳20 个。又已知A 比B 少跳9 个，C 比D 多跳15 个。那么，跳得最多的小朋友比最少的多（）个。","options":["19","20","21","22"],"answer":"D","explanation":"正确答案：D，全站正确率：61%，易错项：C。解析第一步，本题考查不定方程问题。第二步，设A 跳了x 个，则B 跳了（x＋9）个；设D 跳了y 个，则C 跳了（y＋15）个。由A 与B 比C 与D 多跳20 个，列方程：[x＋（x＋9）]－[（y＋15）＋y]＝20，解得x－y＝13，可知B 跳的最多，D 跳的最少，B 比D 多跳（x＋9）－y＝22（个）。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-049","paperId":"gz2018b","num":49,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"现有左右相邻规模一样的两个水池，左边水池的水位比右边的高36cm。用抽水机从左边的水池抽水注入右边的水池，每分钟能使右边的水池水位升高3cm，那么（）分钟后两个水池的水位一样高。","options":["12","9","6","3"],"answer":"C","explanation":"正确答案：C，全站正确率：82%，易错项：B。解析第一步，本题考查基础应用题。第二步，抽水机从左向右抽水，右边每分钟升高3cm，同时左边每分钟降低3cm，即右边每分钟相对左边上升 3＋3＝6（cm）。现在左边比右边高36cm，那么（分钟）后两个水池水位一样高。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-050","paperId":"gz2018b","num":50,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"公司安排甲、乙、丙三人从周一开始上班，已知甲每上班一天休一天，乙每上班两天休一天，丙每上班三天休一天，那么三人第三次同时休息是星期（）。","options":["日","一","二","三"],"answer":"B","explanation":"正确答案：B，全站正确率：36%，易错项：C。解析第一步，本题考查星期日期问题。第二步，甲每上班一天休一天，甲每2 天休息一次；同理，乙每3 天、丙每4 天休息一次。三人同时休息的周期为2、3、4 的最小公倍数12 天。第三步，第三次同时休息为第12×3＝36（天），36÷7＝5 周……1 天，三人第三次同时休息是星期一。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-051","paperId":"gz2018b","num":51,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"办公室需要复印一批文件，使用甲复印机单独印需要20 分钟，使用甲乙两台复印机一起印需要12 分钟，已知甲复印机每分钟比乙复印机多印6 份文件，则这批文件一共有（）份。","options":["216","240","360","600"],"answer":"C","explanation":"正确答案：C，全站正确率：78%，易错项：B。解析第一步，本题考查工程问题，属于时间类，用赋值法解题。第二步，赋值工程总量为60a（20 和12 的最小公倍数），甲的效率为，甲乙的效率和为，则乙的效率为5a－3a＝2a。第三步，甲每分钟比乙多印6 份，即3a－2a＝a＝6，则这批文件一共有60×6＝360（份）。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-052","paperId":"gz2018b","num":52,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"文体用品店有一批数量为35 支的羽毛球拍，进货价为每支130 元，在进货价基础上提高20%销售，并实行消费返现制度，顾客购买羽毛球拍每满100 元即减5 元。假如规定每名顾客最多只能买3 支球拍，则销售这批球拍至少可赚（）。","options":["650 元","675 元","735 元","900 元"],"answer":"A","explanation":"正确答案：A，全站正确率：22%，易错项：B。解析第一步，本题考查经济利润问题，属于最值优化类。第二步，求“至少可赚”即使优惠幅度最大。一支球拍售价为130×（1＋20%）＝156（元）。若不实行消费返现每支赚26 元，共可赚26×35＝910（元）。第三步，①买一支球拍优惠；②买两支球拍优惠；③买三支球拍优惠。可知当一名顾客买两支获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 - 球拍时优惠幅度最大，应尽量让每名顾客均购买两支。第四步，共35 支球拍：17 人每人买两支、剩余1 人买一支，最多可优惠17×15＋5＝260（元）。则这批球拍至少可以赚910－260＝650（元）。因此，选择A 选项。拓展 17 名顾客买两支球拍，1 名顾客买一支球拍与16 名顾客买两支球拍，1 名顾客买三支球拍优惠幅度相同。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-053","paperId":"gz2018b","num":53,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某单位计划在户外举办讲座，计划使用72 米的隔离带围成长方形作为活动场所，其中一边不封闭（即成 |__|形），缺口面向讲坛。能围成的场所面积最大是（）平方米。","options":["324","648","972","1296 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 -"],"answer":"B","explanation":"正确答案：B，全站正确率：49%，易错项：D。解析第一步，本题考查几何问题，属于平面几何类。第二步，设不封闭长方形的长和宽分别为x 和y，则有x＋2y＝72，使面积S 长方形＝xy 最大，转求2xy＝x ×（2y）的最大值。第三步，两数和为定值，当两数相等时乘积最大。令x＝2y，解得：x＝36、y＝18，围成的场所面积最大是36 ×18＝648（平方米）。因此，选择B 选项。拓展尾数法：36×18 尾数为8。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-054","paperId":"gz2018b","num":54,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"投资公司计划对甲乙两个创业项目进行投资，若甲项目投资额减少8%，乙项目投资额增加10%，则总投资额将减少8 万元；若甲项目投资额增加10%，乙项目投资额减少5%，则总投资额将增加19 万元。那么，原计划的总投资额是（）万元。","options":["350","370","420","450"],"answer":"B","explanation":"正确答案：B，全站正确率：53%，易错项：C。解析第一步，本题考查基础应用题，用方程法解题。第二步，设原计划甲项目投资x 万元，乙项目投资y 万元。根据题意列方程组：，整理得，①+②＝6x＝1500，解得x＝250，代入得y＝120。第三步，原计划总投资额为x＋y＝250＋120＝370（万元）。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-055","paperId":"gz2018b","num":55,"year":2018,"region":"广州","module":"数量关系","sub":"数学运算","stem":"用全部156 个边长为1 的小正方形，最多可以拼成（）种形状不同的长方形。","options":["5","6","7","8"],"answer":"B","explanation":"正确答案：B，全站正确率：38%，易错项：C。解析第一步，本题考查约数倍数问题。第二步，小正方形总面积为156×1×1＝156，拼成不同形状的长方形，即枚举不同的长与宽，且满足长×宽＝156，将156 进行因式分解，共有以下六种情况：1×156、2×78、3×52、4×39、6×26、12×13，最多可以拼成6 种不同的长方形。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-056","paperId":"gz2018b","num":56,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"治标∶治本","options":["量变∶质变","道德∶法律","承诺∶合同","外貌∶修养"],"answer":"D","explanation":"正确答案：D，全站正确率：23%，易错项：A。解析第一步，确定题干逻辑关系。 “治标”指的是从表面上处理问题；“治本”指的是从根本上解决问题，它们分别是从外在与内在两个不同角度处理问题的方法，二者属于并列关系。第二步，辨析选项。 A 项：“量变”是指事物数量的增减和场所的变更，是一种渐进的、不显著的变化，“质变”是指事物根本性质的变化，“量变”积累到一定程度可以引起“质变”，二者属于并列关系，但并不是从外在与内在两个角度，排除； B 项：“道德”与“法律”是两种不同的社会约束体系，二者属于并列关系，但并不是从外在与内在两个角度，排除； C 项：“合同”是当事双方之间设立、变更、终止民事关系的协议，是“承诺”的契约表现形式，二者不属于并列关系，排除； D 项：“外貌”与“修养”是从外在与内在两个不同角度去评价人的方法，二者属于并列关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-057","paperId":"gz2018b","num":57,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"大步流星∶寸步难行","options":["大公无私∶公而忘私","大刀阔斧∶雷厉风行","动荡不安∶放荡不羁","江河日下∶蒸蒸日上"],"answer":"D","explanation":"正确答案：D，全站正确率：86%，易错项：A。解析第一步，确定题干逻辑关系。 “大步流星”形容步子跨得大，走得快；“寸步难行”指的是连一步都难以进行，形容走路很困难，二者属于反义关系。第二步，辨析选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 13 - A 项：“大公无私”指的是办事公正，没有私心；“公而忘私”指的是为了公事而不考虑私事，为了集体利益而不考虑个人得失，不去讲究个人恩怨，二者属于近义关系，排除。 B 项：“大刀阔斧”指的是像使大刀、用阔斧那样，形容办事果断而有魄力；“雷厉风行”指的是像雷那样猛烈，像风那样迅疾，亦指果断、干净利索，二者属于近义关系，排除。 C 项：“动荡不安”指的是局势不稳定，不平静；“放荡不羁”指的是不受传统约束，敢于打破传统，向往自由生活，二者不属于反义关系，排除。 D 项：“江河日下”指的是江河的水一天天地向下流，比喻情况一天天地坏下去；“蒸蒸日上”指的是一天天地向上发展，形容发展速度快，二者属于反义关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-058","paperId":"gz2018b","num":58,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"拐弯抹角对于（）相当于（）对于富有","options":["直接；家徒四壁","委婉；穷困潦倒","直白；家财万贯","清楚；富可敌国"],"answer":"A","explanation":"正确答案：A，全站正确率：89%，易错项：B。解析分别将选项代入题干，确定逻辑关系。 A 项：“拐弯抹角”指的是沿着弯弯曲曲的路走，比喻说话绕弯，不直截了当，与“直接”属于反义关系；“家徒四壁”指的是家中十分贫穷，空无所有，与“富有”属于反义关系，前后逻辑关系一致，符合。 B 项：“拐弯抹角”与“委婉”属于近义关系；“穷困潦倒”指的是生活贫困，失意颓丧，与“富有”属于反义关系，前后逻辑关系不一致，排除。 C 项：“拐弯抹角”与“直白”属于反义关系；“家财万贯”指的是家里有万贯铜钱，形容十分富有，与“富有”属于近义关系，前后逻辑关系不一致，排除。 D 项：“拐弯抹角”与“清楚”无明显逻辑关系；“富可敌国”指的是私人拥有的财富可与国家的资财相匹敌，形容极为富有，与“富有”属于近义关系，前后逻辑关系不一致，排除。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-059","paperId":"gz2018b","num":59,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"听证会对于（）相当于（）对于职工","options":["证人；运动会","专家；职代会","领导；展览会","居民；家长会"],"answer":"B","explanation":"正确答案：B，全站正确率：90%，易错项：A。解析分别将选项代入题干，确定逻辑关系。 A 项：“证人”不是“听证会”的参加人员，“职工”可以是“运动会”的参加人员，前后逻辑关系不一致，排除； B 项：“专家”是“听证会”的参加人员，“职工”是“职代会”的参加人员，前后二者均属于对应关系，前后逻辑关系一致，符合； C 项：“领导”是“听证会”的参加人员，“职工”不是“展览会”的参加人员，前后逻辑关系不一致，排除； D 项：“居民”可以是“听证会”的参加人员，“职工”不是“家长会”的参加人员，前后逻辑关系不一致，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-060","paperId":"gz2018b","num":60,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"记者对于（）相当于（）对于剪裁","options":["采访；裁缝","记录；园丁","新闻；衣服","摄像；模特"],"answer":"A","explanation":"正确答案：A，全站正确率：91%，易错项：B。解析分别将选项代入题干，确定逻辑关系。 A 项：“记者”与“采访”属于主谓关系，“裁缝”与“剪裁”属于主谓关系，前后逻辑关系一致，符合； B 项：“记者”与“记录”属于主谓关系，“园丁”的日常工作是修剪与护理植物，与“剪裁”没有明显逻辑关系，前后逻辑关系不一致，排除； C 项：“记者”报道“新闻”，二者属于主宾关系，“剪裁”与“衣服”属于动宾关系，前后逻辑关系不一致，排除； D 项：“记者”报道新闻的时候，会有工作人员“摄像”，二者属于对应关系，“模特”与“剪裁”没有明显逻辑关系，前后逻辑关系不一致，排除。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-061","paperId":"gz2018b","num":61,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"招商对于（）相当于（）对于自评","options":["战略；得分","资金；对象","优势；问卷","创业；调查"],"answer":"D","explanation":"正确答案：D，全站正确率：53%，易错项：B。解析分别将选项代入题干，确定逻辑关系。 A 项：“招商”的时候需要一定的“战略”，“自评”的结果可以以“得分”形式体现，前后逻辑关系不一致，排除； B 项：“招商”的目的是引入“资金”，二者属于对应关系，但“对象”和“自评”无明显逻辑关系，前后逻辑关系不一致，排除； C 项：完成“招商”项目需要有一定的“优势”，二者属于对应关系，但“问卷”和“自评”都是一种收集数据的方式，二者属于并列关系，前后逻辑关系不一致，排除； D 项：“招商”和“创业”都是一种经济活动，二者属于并列关系，“调查”和“自评”都是一种收集数据的方式，二者属于并列关系，前后逻辑关系一致，符合。因此，选择D 选项。拓展获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 14 - 招商，即招揽商户，它是指发包方将自己的服务、产品面向一定范围进行发布，以招募商户共同发展，主要包括政府招商、企业招商、园区招商、商业招商、连锁招商等。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-062","paperId":"gz2018b","num":62,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"人民币∶美元∶兑换","options":["现金∶支票∶货币","写作∶绘画∶文字","诗词∶音乐∶旋律","中文∶英文∶翻译"],"answer":"D","explanation":"正确答案：D，全站正确率：96%，易错项：A。解析第一步，确定题干逻辑关系。 “人民币”和“美元”都是货币，二者属于并列关系中的反对关系；“人民币”和“美元”之间可以相互“兑换”，二者均与“兑换”属于对应关系。第二步，辨析选项。 A 项：“现金”是“货币”的一种，二者属于包容关系中的种属关系，排除； B 项：“写作”和“绘画”都是艺术形式，二者属于并列关系中的反对关系，而“写作”和“绘画”无法相互转换，排除； C 项：“音乐”和“诗词”都是艺术形式，二者属于并列关系中的反对关系，“旋律”是“音乐”的组成部分，二者属于包容关系中的组成关系，排除； D 项：“中文”和“英文”都是语言，二者属于并列关系中的反对关系，“中文”和“英文”之间可以相互“翻译”，二者均与“翻译”属于对应关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-063","paperId":"gz2018b","num":63,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"医生∶检查∶诊断病情","options":["警察∶警局∶逮捕犯人","厨师∶烹饪∶品尝美食","演员∶表演∶吹拉弹唱","教师∶讲课∶传授知识"],"answer":"D","explanation":"正确答案：D，全站正确率：91%，易错项：B。解析第一步，确定题干逻辑关系。 “医生”通过“检查”的方式来“诊断病情”，“检查”是“医生”的手段，“诊断病情”是“医生”的目的，三者属于对应关系。第二步，辨析选项。 A 项：“警局”是“警察”工作的地点，二者属于地点对应关系，“警局”并非“警察”“逮捕犯人”的手段，排除； B 项：“烹饪”是“厨师”的手段，但“厨师”的目的是烹制美食，而非“品尝美食”，排除； C 项：“演员”可以通过“吹拉弹唱”的方式进行“表演”，所以“吹拉弹唱”是“演员”的手段，而非目的，排除； D 项：“教师”通过“讲课”的方式来“传授知识”，“讲课”是“教师”的手段，“传授知识”是“教师” 的目的，三者属于对应关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-064","paperId":"gz2018b","num":64,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"营业税∶增值税∶减免","options":["笔试∶面试∶选拔","燃油车∶电动车∶环保","土楼∶木屋∶搭建","平信∶快递∶降价"],"answer":"C","explanation":"正确答案：C，全站正确率：22%，易错项：B。解析第一步，确定题干逻辑关系。 “营业税”和“增值税”都是税收的一种，二者属于并列关系，“营业税”“增值税”均与“减免”属于动宾关系。第二步，辨析选项。 A 项：“笔试”和“面试”是“选拔”的两种方式，二者与“选拔”属于对应关系，排除； B 项：“燃油车”与“电动车”属于并列关系，但“环保”是“电动车”的属性，排除； C 项：“土楼”和“木屋”都是一种房屋，二者属于并列关系，“土楼”“木屋”均与“搭建”属于动宾关系，与题干逻辑关系一致，符合； D 项：“平信”是一种邮寄信件的方法，“快递”主要用来邮寄物品等，都属于邮寄的一种方式，二者属于并列关系，但均与“降价”无明显逻辑关系，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-065","paperId":"gz2018b","num":65,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"豆∶黄豆∶四季豆","options":["瓜∶西瓜∶佛手瓜","果∶糖果∶罗汉果","茶∶奶茶∶乌龙茶","油∶酱油∶绵羊油"],"answer":"A","explanation":"正确答案：A，全站正确率：69%，易错项：C。解析第一步，确定题干逻辑关系。 “黄豆”和“四季豆”都是“豆”，前两者属于并列关系，均与“豆”属于包容关系中的种属关系，且“黄豆” 和“四季豆”均为天然事物。第二步，辨析选项。 A 项：“西瓜”和“佛手瓜”都是“瓜”，前两者属于并列关系，均与“瓜”属于包容关系中的种属关系，与题干逻辑关系一致，符合； B 项：“糖果”是以糖类为主的一种小吃，是“糖果”糕点的一种，与“果”不属于包容关系中的种属关系，排除； C 项：“奶茶”和“乌龙茶”都是“茶”，前两者属于并列关系，但均为人造物，排除； D 项：“酱油”是一种调味品，与“油”不属于包容关系中的种属关系，排除。因此，选择A 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 15 -","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-066","paperId":"gz2018b","num":66,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某科研单位招聘研究人员，要求被录取人员必须具备生物学专业背景，并且得到两名同行专家的推荐。以下哪项为真，说明录取没有遵守招聘要求？（1）杜林被录取，但只有一名同行专家推荐；（2）李力被录取，但他所学专业为文学；（3）张娜生物学专业毕业，且由两名同行专家推荐，但没有被录取。","options":["（1）和（2）","（2）和（3）","（1）和（3）","以上都不是"],"answer":"A","explanation":"正确答案：A，全站正确率：79%，易错项：D。解析第一步，确定题型。根据题干中的关联词“必须”等，确定为翻译推理。第二步，翻译题干。被录取→生物专业且两名同行专家第三步，进行推理。（1）只有一名专家为否后，否后必否前，则不可能被录取，说明没有遵守招聘要求；（2）文学专业为否后，否后必否前，则不可能被录取，说明没有遵守招聘要求；（3）生物专业且两名专家为肯后，肯后得可能结论，说明可能遵守招聘要求。综上，只有（1）和（2）符合题干要求。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-067","paperId":"gz2018b","num":67,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"世界级钢琴演奏家每天练习弹钢琴不少于八个小时，除非是元旦、星期天或者当天有重大的演出项目。如果以上论述为真，以下哪个人不可能是世界级钢琴演奏家？","options":["某钢琴演奏家在某个星期的星期一、星期四、星期五和星期天都没有练习弹钢琴","某钢琴演奏家连续三个月没有练习弹钢琴","某钢琴演奏家几乎每天练习跑马拉松四个小时","某钢琴演奏家连续三天每天练习弹钢琴七个小时，并且没有演出项目"],"answer":"D","explanation":"正确答案：D，全站正确率：48%，易错项：B。解析第一步，确定题型。根据题干的逻辑关联词“除非”等，确定为翻译推理。第二步，翻译题干。 ①世界级演奏家→每天练习不少于8 小时 ②世界级演奏家→元旦、星期天或当天有演出的时候练习小于8 小时（题干逻辑可表述为：除非是元旦、星期天或者当天有重大的演出项目练习小于8 小时，否则不是世界级钢琴演奏家，根据逻辑关联词“除非…否则不…”的翻译规则，可得如②翻译。）第三步，进行推理。 A 项：星期天练习小于8 小时，属于“肯后”，肯后可能得到肯前，但是星期一、星期四、星期五无法确定是否有重大演出，因此此项无法推出不可能的必然结论，排除； B 项：连续三个月没有练习钢琴无法确定是否每天都有重大演出，此项无法推出必然结论，排除； C 项：每天跑四小时马拉松，与题干推理无关，此项无法推出必然结论，排除； D 项：某钢琴家连续三天练习都小于八小时并且这三天没有重大演出，同时三天至少有一天既不是星期天又不是元旦，所以此项属于“否后”，否后必否前，该项可以推出不可能是世界级演奏家的结论。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-068","paperId":"gz2018b","num":68,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某厅决定在厅机关选派援疆干部，并成立了由党委办、人事处、就业处组成援疆干部推荐小组，还初定了赵某、李某、周某三个推荐人选。党委办、人事处、就业处三个部门分别提出了各自推荐意见：党委办：赵某、李某中只能去一个。人事处：如果不选派赵某，就不选派周某。就业处：只有不选派李某或赵某，才选派周某。以下方案能同时满足三个部门意见的是：","options":["选派周某，不选派赵某和李某","选派李某和赵某，不选派周某","选派赵某，不选派李某和周某","选派李某和周某，不选派赵某"],"answer":"C","explanation":"正确答案：C，全站正确率：65%，易错项：A。解析第一步，确定题型。根据题干的关联词“如果……那么……”等，确定为翻译推理。第二步，翻译题干。 ①党委办：¬赵或¬李 ②人事处：¬赵→¬周（利用鲁宾逊定律，等价于：赵或¬周） ③就业处：周→¬李或¬赵第三步，进行推理。本题问的是能够同时满足三个部门意见的是，考虑代入法。 A 项：该项选派人选为“周、¬赵、¬李”，其中“周、¬赵”无法满足翻译②人事处意见，排除； B 项：该项中的“选派李和赵”无法满足翻译①党委办意见，排除； C 项：该项选派人选为“¬周、赵、¬李”，可以同时满足三个部门意见； D 项：该项选派人选为“周、¬赵、李”，其中“周、¬赵”无法满足翻译②人事处意见，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-069","paperId":"gz2018b","num":69,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"所有优秀的物理学家都具有良好的数学运用能力，张杰没有良好的数学运用能力，所以张杰不是优秀的物理学家。下述推理中与上述推理在结构形式上最为相似的是：","options":["H 公司今年招聘的人才都具有良好的专业背景和综合素质，小刘具有良好的专业背景和综合素质，所有小刘是今年H 公司招聘的人才","所有年满七十周岁的人都可以领到老年人生活补贴，王老师今年七十五周岁，他可以领到老年人生活补贴","所有条件适宜的环境都能使企鹅孵化，但T 岛上企鹅蛋没有孵化，所以T 岛的环境不是适宜的","所有被顶尖高校录取的学生都是聪明的学生，李可没有被顶尖高校录取，所以李可不是聪明的学生获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 -"],"answer":"C","explanation":"正确答案：C，全站正确率：66%，易错项：D。解析第一步，确定题型。根据提问方式“在结构形式上最为相似”，确定为平行结构。第二步，分析题干结构。题干翻译形式为：优秀的物理学家→良好的数学运用能力；题干推理形式为：“张杰没有良好的数学运用能力”属于“否后”，“张杰不是优秀的物理学家”属于“否前”，即推理形式为“否后推否前”。第三步，辨析选项。 A 项：翻译形式为：招聘的人才→具有良好的专业背景和综合素质，“小刘具有良好的专业背景和综合素质” 属于“肯后”，排除； B 项：翻译形式为：年满七十周岁的人→领到老年人生活补贴，“王老师今年七十五周岁”属于“肯前”，排获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 16 - 除； C 项：翻译形式为：条件适宜的环境→企鹅蛋孵化，推理形式为：“企鹅蛋没有孵化”属于“否后”，“T 岛环境不适宜”属于“否前”，即推理形式为“否后推否前”，与题干逻辑关系一致。 D 项：翻译形式为：被顶尖高校录取的学生→聪明的学生，“没有被顶尖高校录取的学生”属于“否前”，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-070","paperId":"gz2018b","num":70,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"在全球经济背景下，跨国公司的利润转移问题越来越成为各国政府关注的焦点。如果这一问题得不到解决，将加剧大资本与劳动之间收入分配的不平等。除非各国能够制定统一的公司所得税率，或者形成跨国界税收治理新规则，否则，这将是难解之题。如果以上陈述为真，则以下哪项陈述必然为真？","options":["各国制定统一的公司所得税率，或者形成跨国界税收治理新规则，就可以解决跨国公司的利润转移问题","如果跨国公司的利润转移问题得到解决，就能消除大资本与劳动之间收入分配的不平等","如果各国不制定统一的公司所得税率，或者不形成跨国界税收新规则，大资本与劳动之间收入分配的不平等将会进一步加剧","如果各国不能制定统一的公司所得税率，那么形成跨国界税收治理新规则也无法解决跨国公司的利润转移问题"],"answer":"C","explanation":"正确答案：C，全站正确率：58%，易错项：A。解析第一步，确定题型。根据题干的关联词“如果”，确定为翻译推理。第二步，翻译题干。 ①利润转移问题得不到解决→收入分配的不平均 ②利润转移解决→制定统一的公司所得税率或者形成跨国界税收治理新规则将①逆否和②可以递推出：③收入分配平等→制定统一公司所得税率或跨国界税收治理新规则第三步，进行推理。 A 项：“制定统一的公司所得率，或者形成跨国界税收治理新规则”在②中属于“肯后”，无法推出必然结论，排除； B 项：“利润转移问题得到解决”在①中属于“否前”，无法推出必然结论，排除； C 项：“各国不制定统一的公司所得税率，或者不形成跨国界税收治理新规则”在②中不属于“否后”，无法进行推理，排除； D 项：该项可以翻译为：各国不制定统一的公司所得税率且形成跨国界税收治理新规则→形解决利润转移问题，箭头前的内容在②中不属于“否后”，无法进行推理，排除。故本题无正确选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-071","paperId":"gz2018b","num":71,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"只有具有良好的逻辑思维能力并且具有物理学专业背景的人，才能胜任这个岗位。如果上述判断为真，以下哪项不可能为真？","options":["物理学专业博士小赵胜任了这个岗位","从未学习过物理学知识的小李，胜任了这个岗位","小刘具有物理学专业背景，但他不能胜任这个岗位","小孙不能胜任这个岗位，但他的逻辑思维能力是大家公认的"],"answer":"B","explanation":"正确答案：B，全站正确率：91%，易错项：D。解析第一步，确定题型。根据题干的关联词“只有……才……”及提问方式，确定为翻译推理选非题。第二步，翻译推理。 ①胜任岗位→逻辑思维且物理学第三步，进行推理。 A 项：小赵是物理学博士，属于对①后件的部分肯定，“且关系”的特性是“全真才真”，所以无法确定是“肯后”还是“否后”，即推不出必然结论，但可推出可能性结论，故小赵胜任这个岗位可能为真，排除； B 项：小李从未学习过物理学知识，属于对①的“否后”，根据“否后必否前”，可知：小李一定不能胜任该岗位，而选项给出小李一定胜任该岗位，与推出结论不一致，不可能为真； C 项：小刘具有物理学专业背景，属于对①后件的部分肯定，“且关系”的特性是“全真才真”，所以无法确定是“肯后”还是“否后”，即推不出必然结论，但可推出可能性结论，所以小刘不胜任这个岗位可能为真，排除； D 项：小孙不能胜任该岗位，属于对①的“否前”，否前推不出必然结论，所以小孙具有逻辑思维能力可能为真，排除。因此，选择B 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-072","paperId":"gz2018b","num":72,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"一项研究发现，二氧化硅是一种植物容易吸收的硅元素形态，通过使用二氧化硅改善土壤，植物可沉淀出称为“植结石”的小颗粒。颗粒中含有的硅元素可减缓昆虫的发育，颗粒的石头质地还能磨损昆虫口器，从而降低植物的虫害程度。由此，有关研究人员建议，可以在那些农作物经常受昆虫侵害的地区土壤中加入这类硅元素。以下哪项如果为真，最能反驳上述建议？","options":["各地区昆虫的耐药性及药物作用的敏感性都相同","受昆虫侵害严重的地区，土壤中普遍缺乏硅元素","农作物中的硅元素会对食用者的身体发育产生影响","富含硅元素的农作物的口感比普通农作物更好"],"answer":"C","explanation":"正确答案：C，全站正确率：80%，易错项：A。解析第一步，确定题型。根据提问方式中的“反驳”，确定为削弱论证。第二步，找论点和论据。论点：可以在农作物经常受昆虫侵害的地区土壤中加入这类硅元素来降低植物的虫害程度。论据：通过使用二氧化硅改善土壤，植物可沉淀出称为“植结石”的小颗粒。颗粒中含有的硅元素可减缓昆虫的发育，颗粒的石头质地还能磨损昆虫的口器，从而降低植物的虫害程度。第三步，辨析选项。 A 项：无关选项。描述的是昆虫耐药性与药物敏感性的状态，论题不一致，排除。 B 项：增加论据。受灾严重地区，土壤中普遍缺乏硅元素，说明硅元素的多少与虫害有一定联系，有加强作用。 C 项：增加反向论据。研究人员建议加入硅元素，该选项表明加入硅元素会给人带来伤害，具有削弱作用。 D 项：无关选项。该项描述的是作物的口感情况，论题不一致，排除。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-073","paperId":"gz2018b","num":73,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"每周饮酒2-10 次是适量饮酒。有调查发现，每周饮酒2-10 次的男士，比每周饮酒少于2 次的男士患心脏病的概率要低。因此，适量饮酒可降低男士患心脏病的风险。以下哪项为真，最不能削弱该论证？","options":["适量饮酒的女士比每周饮酒少于2 次的女士患肝炎的概率更高","适量饮酒的男士更注意加强身体锻炼","适量饮酒的男士普遍比每周饮酒少于2 次的男士要年轻","男士们都认为，身体良好的情况下可以适当增加饮酒量"],"answer":"A","explanation":"正确答案：A，全站正确率：56%，易错项：C。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 17 - 第一步，确定题型。根据提问方式中的“不能削弱”，确定为削弱论证选非题。第二步，找论点和论据。论点：适量饮酒可降低男士患心脏病的风险。论据：每周饮酒2-10 次的男士，比每周饮酒少于2 次的男士患心脏病的概率要低。第三步，辨析选项。 A 项：无关选项。该选项描述的是女人饮酒的情况，论题不一致，不具有削弱作用。 B 项：增加反向论据。该选项描述适量饮酒的男士更注意加强身体锻炼，指出了锻炼与患心脏病风险的关系，并不完全是饮酒的作用，具有削弱作用。 C 项：增加反向论据。该项指出适量饮酒的男士更年轻，并不完全是饮酒的作用，具有削弱作用。 D 项：削弱论点。该选项描述身体好的男士才会适当增加饮酒量，属于因果倒置，具有削弱作用。因此，选择A 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-074","paperId":"gz2018b","num":74,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"有教育专家提出，如果采取按照年龄、学历水平和职称等级将教师平均分配到所有学校的办法来配置教育资源，实现教育公平，就能较好解决目前因上重点学校竞争激烈而引起的社会问题。以下哪项如果为真，将最能削弱该教育专家的观点？","options":["很多重点学校老师表示支持","绝大多数学生和家长表示反对","一些重点学校老师要求到物价低的郊区学校工作","普通学校的硬件设施建设比起重点学校存在明显差距"],"answer":"D","explanation":"正确答案：D，全站正确率：75%，易错项：B。解析第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：将教师平均分配就能解决目前因上重点学校竞争激烈而引起的社会问题。论据：无。第三步，辨析选项。 A 项：不明确项。很多老师支持并不能说明平均分配老师的措施是否有用，不具有削弱作用。 B 项：不明确项。绝大多数学生和家长反对不能说明平均分配老师的措施是否有用，不具有削弱作用。 C 项：无关选项。一些老师要求去郊区工作，和措施能否有效果无关，论题不一致，排除。 D 项：增加反向论据。该项说明重点学校竞争激烈除了教师还有硬件设施，那么仅通过将教师平均分配无法解决问题，具有削弱作用。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-075","paperId":"gz2018b","num":75,"year":2018,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某调查小组对Y 地区吸烟青少年群体调查发现，75%吸烟青少年来自二手烟家庭，父母至少有一人为吸烟者。因此，该地区二手烟家庭如果能大幅减少，新的吸烟青少年数量将显著减少。以下哪项如果为真，最能支持上述论证？","options":["成年人的戒烟方法和青少年的戒烟方法是不同的","吸烟青少年可以通过积极的干预而戒烟","成年人和青少年学会吸烟的方式是相同的","Y 地区成长于二手烟家庭的青少年吸烟的比例比其他家庭高"],"answer":"D","explanation":"正确答案：D，全站正确率：72%，易错项：C。解析第一步，确定题型。根据提问方式中的“支持”，确定为加强论证。第二步，找论点和论据。论点：二手烟家庭如果能大幅度减少，新的吸烟青少年数量将显著减少。论据：75%吸烟青少年来自二手烟家庭，父母至少有一人为吸烟者。第三步，辨析选项。 A 项：无关选项。成年人和青少年戒烟方法的不同，和二手烟家庭能否导致青少年吸烟，论题不一致，排除。 B 项：无关选项。通过干预而戒烟，和二手烟家庭能否导致青少年吸烟，论题不一致，排除。 C 项：无关选项。成年人和青少年的吸烟方式相同，和二手烟家庭能否导致青少年吸烟，论题不一致，排除。 D 项：增加论据。该项说明调查对象中，来自二手烟家庭的青少年吸烟的比例高于其他家庭，意味着二手烟家庭的孩子更容易吸烟，具有加强作用。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-083","paperId":"gz2018b","num":83,"year":2018,"region":"广州","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①③⑥，②④⑤","①③⑤，②④⑥","①②④，③⑤⑥","①②③，④⑤⑥"],"answer":"C","explanation":"正确答案：C，全站正确率：61%，易错项：B。解析第一步，观察特征。每幅图中都有小黑点，优先考虑功能元素。第二步，根据规律进行分组。每个图形都有黑点和黑色三角形，观察两者的相对位置关系，其中，①②④黑色三角形和黑点所在面为相离关系，③⑤⑥黑色三角形和黑点所在面为相邻关系，只有C 项符合。因此，选择C 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-084","paperId":"gz2018b","num":84,"year":2018,"region":"广州","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②③，④⑤⑥","①②⑤，③④⑥","①③⑤，②④⑥","①④⑥，②③⑤"],"answer":"D","explanation":"正确答案：D，全站正确率：59%，易错项：B。解析第一步，观察特征。组成元素不同，优先考虑数量类或属性类，题干②④图形对称特征明显，考虑属性类对称性。第二步，根据规律进行分组。图形①④⑥既是对称轴又是中心对称，图形②③⑤仅为轴对称图形，只有D 项符合。因此，选择D 选项。","material":"","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-086","paperId":"gz2018b","num":86,"year":2018,"region":"广州","module":"资料分析","sub":"综合资料","stem":"“服务态度”“办事效率”“政务公开”分数依次由高到低排序的街道办是：","options":["天坊","景秀","云仙","南田"],"answer":"C","explanation":"正确答案：C，全站正确率：76%，易错项：B。解析第一步，本题考查简单比较中读数比较问题。第二步，定位折线图“效能水平评价”。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 20 - 第三步，符合服务态度、办事效率、政务公开分数依次由高到低排序的街道办为云仙。因此，选择C 选项。","material":"(材料) 某行政区从“服务态度”“办事效率”“政务公开”三个方面评价下属的6 个街道办事处（简称为街道办）的综合服务效能水平，并调查了群众对各个街道办的满意度。这6 个街道办分别为天坊街道办、云仙街道办、和风街道办、景秀街道办、东河街道办、南田街道办。每个方面评价分数采用百分制。评价结果如下图：效能水平评价获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 -","source":"2018年广州市公务员考试《行测》真题（二）"},{"id":"gz2018b-087","paperId":"gz2018b","num":87,"year":2018,"region":"广州","module":"资料分析","sub":"综合资料","stem":"该行政区六个街道办的群众满意度平均分约为：","options":["89","83","75","
