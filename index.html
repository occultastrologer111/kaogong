活雷锋”","王兰花——点亮贫困山区女孩梦想的“校长妈妈”","孙景坤——公而忘私永葆革命本色的战斗功臣","李宏塔——为国守海寸步不让带领群众共同致富"],"answer":"C","explanation":"第一步，本题考查时政。第二步，孙景坤，男，汉族，1924 年10 月生，1949 年1 月入党，辽宁庄河人，辽宁省丹东市元宝区金山镇山城村原第一生产队队长。永葆革命本色的战斗功臣，在革命战争年代冲锋陷阵、不怕牺牲。在解放战争中，先后参加四平、辽沈、平津、解放长沙、解放海南岛、抗美援朝等战役战争，荣立一等功一次、二等功两次、三等功两次。作为英雄报告团成员，受到毛主席等党和国家领导人亲切接见。退役后毅然回乡带领群众改变家乡面貌，是共产党员吃苦在前、公而忘私崇高品质的典范。1953 年荣获“抗美援朝一级战士荣誉勋章”。2020 年10 月 14 日被授予“时代楷模”称号。2021 年6 月29 日，中共中央授予孙景坤“七一勋章”。C 项对应正确，符合题意。因此，选择C 选项。拓展 A 项：张桂梅，女，满族，1998 年4 月入党，辽宁岫岩人，云南省丽江华坪女子高级中学党支部书记、校长，华坪县儿童福利院（华坪儿童之家）院长，党的十七大代表。扎根贫困地区40 余年，创办全国第一所全免费女子高中，帮助1800 多名贫困山区女孩圆梦大学，是为教育事业奉献一切的“张妈妈”。探索形成“党建统领教学、革命传统立校、红色文化育人”特色教学模式，用红色基因树人铸魂。拖着病体忘我工作，持续12 年家访超过 1600 户，行程11 万余公里。荣获“全国脱贫攻坚楷模”荣誉称号和“全国优秀共产党员”“全国先进工作者” “感动中国2020 年度人物”等称号。2021 年6 月29 日，张桂梅被党中央授予“七一勋章”并在“七一勋章” 颁授仪式上发言。故对应事迹应为：点亮贫困山区女孩梦想的“校长妈妈”。A 项对应错误。 B 项：王兰花，女，回族，1995 年11 月入党，宁夏吴忠人，宁夏回族自治区吴忠市利通区金星镇王兰花热心小组党支部书记、王兰花热心小组慈善协会会长。群众心中的“活雷锋”，把解决社区居民的操心事烦心事揪心事作为毕生事业，十多年如一日坚持志愿服务。带领“王兰花热心小组”先后为居民解决各类困难7000 多件，调解各类民事纠纷600 多起，开展公益活动7000 多场次，推动利通区志愿者从最初7 人发展到6.5 万余人。荣获 “全国三八红旗手标兵”“全国民族团结进步模范个人”等称号。2021 年2 月26 日，全国妇联授予其2020 年度全国三八红旗手标兵称号。2021 年6 月29 日，中共中央授予王兰花“七一勋章”。2021 年11 月5 日，荣耀当选第八届全国道德模范。故对应事迹应为：坚持志愿服务十余载群众心中的“活雷锋”。B 项对应错误。 D 项：李宏塔，男，汉族，1978 年4 月入党，河北乐亭人，安徽省政协原党组成员、副主席，第十一、十二届全国政协委员。党员领导干部忠诚干净担当的典范。在民政系统工作18 年，视孤寡老人为父母、视孤残儿童为子女、视民政对象为亲人，每年至少一半时间在基层度过。共产党人革命传统、优良家风的传承人，始终艰苦朴素、清正廉洁、以严治家，秉持了“革命传统代代传，坚持宗旨为人民”的不变信念。2021 年6 月29 日，中共中央授予李宏塔“七一勋章”。故对应事迹应为：敢担当善作为是共产党人的写照。D 项对应错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-004","paperId":"gk2022-xz","num":4,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）关于中国共产党成立百年的宝贵经验，下列说法不准确的是：","options":["爱国统一战线是实现中华民族伟大复兴的战略支撑","勇于自我革命是中国共产党区别于其他政党的显著标志","马克思主义是我们立党立国的根本指导思想","中国特色社会主义是实现中华民族伟大复兴的正确道路"],"answer":"A","explanation":"第一步，本题考查中共党史并选错误项。第二步，建设一支听党指挥、能打胜仗、作风优良的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。爱国统一战线，建立和完善广泛的统一战线，是建立、巩固和发展人民民主专政制度的重要保障。爱国统一战线是中国共产党团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝。 A 项错误。因此，选择A 选项。拓展 B 项：习近平总书记在庆祝中国共产党成立100 周年大会上的重要讲话中指出：“勇于自我革命是中国共产党区别于其他政党的显著标志。”这深刻揭示勇于自我革命是中国共产党最鲜明的品格和最大的优势，是伟大建党精神的生动体现。B 项正确。 C 项：习近平总书记在庆祝中国共产党成立100 周年大会上的重要讲话中指出： “中国共产党为什么能，中国特色社会主义为什么好，归根到底是因为马克思主义行！”马克思主义是我们立党立国的根本指导思想，是我们党的灵魂和旗帜。C 项正确。 D 项：2021 年10 月9 日，习近平总书记在纪念辛亥革命110 周年大会上的讲话中指出，辛亥革命110 年来的历史启示我们，实现中华民族伟大复兴，道路是最根本的问题。中国特色社会主义是实现中华民族伟大复兴的唯一正确道路。这条道路符合中国实际、反映中国人民意愿、适应时代发展要求，不仅走得对、走得通，而且也一定能够走得稳、走得好。D 项正确。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-005","paperId":"gk2022-xz","num":5,"year":2022,"region":"国家","module":"常识判断","sub":"人文历史","stem":"（单选题）习近平总书记在全国脱贫攻坚总结表彰大会上的讲话指出∶“贫困是人类社会的顽疾。反贫困始终是古今中外治国安邦的一件大事。一部中国史，就是一部中华民族同贫困作斗争的历史。从 ① ‘长太息以掩涕兮，哀民生之多艰’的感慨，到杜甫‘ ② ’的憧憬，再到 ③ ‘家给人足，四海之内无一夫不获其所’的夙愿，都反映了中华民族对摆脱贫困，丰衣足食的深深渴望。” ①②③处应分别填入：","options":["司马迁；安得广厦千万间，大庇天下寒士俱欢颜；严复","屈原；安得广厦千万间，大庇天下寒士俱欢颜；孙中山","司马迁；岂辞云水三千里，犹济疮痍十万民；孙中山","屈原；岂辞云水三千里，犹济疮痍十万民；严复"],"answer":"B","explanation":"第一步，本题考查时政。第二步，2021 年2 月25 日上午，全国脱贫攻坚总结表彰大会在北京人民大会堂隆重举行，习近平指出：贫困是人类社会的顽疾。反贫困始终是古今中外治国安邦的一件大事。一部中国史，就是一部中华民族同贫困作斗争的历史。从屈原“长太息以掩涕兮，哀民生之多艰”的感慨，到杜甫“安得广厦千万间，大庇天下寒士俱欢颜”的憧憬，再到孙中山“家给人足，四海之内无一夫不获其所”的夙愿，都反映了中华民族对摆脱贫困、丰衣足食的深深渴望。与B 项表述一致。因此，选择B 选项。拓展 ①：“长太息以掩涕兮，哀民生之多艰”出自于屈原的《离骚》，意思是我掩面垂泪而声声长叹啊，可怜人民的生计（人生道路）是多么艰难啊，彰显出他心忧家国、情牵百姓的高尚品格。 ②：杜甫《茅屋为秋风所破歌》中“安得广厦千万间，大庇天下寒士俱欢颜”，意思是如何能得到千万间宽敞高大的房子，普遍地庇覆天下间贫寒的读书人，让他们开颜欢笑！体现了杜甫的忧国忧民和美好憧憬。 ③：“肇造社会的国家，俾家给人足，四海之内无一夫不获其所。”出自于孙中山《同盟会宣言》，为此，他提出了平均地权。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-006","paperId":"gk2022-xz","num":6,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）《中华人民共和国宪法》（1982 年）实施以来，先后五次以修正案的形式进了修改。下列宪法条款与宪法修正案对应正确的是：","options":["公民的合法的私有财产不受侵犯——1993 年宪法修正案","农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制——2004 年宪法修正案","国家尊重和保障人权——1999 年宪法修正案","中国共产党领导是中国特色社会主义最本质的特征——2018 年宪法修正案"],"answer":"D","explanation":"第一步，本题考查宪法。第二步，2018 年，十三届全国人大第一次会议表决通过了《中华人民共和国宪法修正案》，这是以习近平同志为核心的党中央从新时代坚持和发展中国特色社会主义全局和战略高度作出的重大决策，是推进全面依法治国,推进国家治理体系和治理能力现代化的重大举措。宪法修正案把\"中国共产党领导是中国特色社会主义最本质的特征\" 写入宪法总纲第1 条第2 款。与D 项表述一致。因此，选择D 选项。拓展 A 项：2004 年宪法修正案将宪法第13 条改为：公民的合法的私有财产不受侵犯。国家依照法律规定保护公民的私有财产权和继承权。选项A 表述为1993 年，A 项错误。 B 项：1999 年宪法修正案把“家庭联产承包责任制”的提法修改为“以家庭承包经营为基础，统分结合的双层经营体制。选项B 中表述为2004 年，B 项错误。 C 项：2004 年3 月14 日，第十届全国人大二次会议通过的宪法修正案，将国家尊重和保障人权写入宪法。选项 C 中表述为1999 年，C 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-007","paperId":"gk2022-xz","num":7,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）新修订的《中华人民共和国行政处罚法》自2021 年7 月15 日起施行。依据该法，下列说法正确的是∶","options":["行政机关拟作出降低资质等级的处罚之前，应当组织听证","对当事人依法给予一百元以上罚款的，执法人员不得当场收缴","法律、行政法规对违法行为未作出行政处罚规定的，地方性法规可补充设定","行政机关可以在其法定权限内书面委托其他组织或个人实施行政处罚"],"answer":"B","explanation":"第一步，本题考查行政处罚法。第二步，根据《行政处罚法》第68 条规定，当场作出行政处罚决定，有下列情形之一，执法人员可以当场收缴罚款：（一）依法给予一百元以下罚款的；（二）不当场收缴事后难以执行的。因此，对当事人依法给予一百元以上罚款的不满足当场收缴的情形，执法人员不得当场收缴。B 项正确。（备注：B 项有瑕疵，只有同时满足一百元以上且不当场收缴事后难以执行的才不得当场收缴。因本题为单选题，其他三个选项错得更明显，因此选B 项。）因此，选择B 选项。拓展 A 项：根据《行政处罚法》第63 条规定，行政机关拟作出下列行政处罚决定，应当告知当事人有要求听证的权利，当事人要求听证的，行政机关应当组织听证：……（三）降低资质等级、吊销许可证件……选项A 中缺少条件“当事人要求听证的”，说法不严谨。A 项错误。 C 项：根据《行政处罚法》第12 条规定，法律、行政法规对违法行为未作出行政处罚规定，地方性法规为实施法律、行政法规，可以补充设定行政处罚。选项C 中缺少条件“为实施法律、行政法规”，表述不严谨。C 项错误。 D 项：根据《行政处罚法》第20 条规定，行政机关不得委托其他组织或者个人实施行政处罚。选项D 中表述为 “可以在其法定权限内书面委托”，与“不得委托”不符。D 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-008","paperId":"gk2022-xz","num":8,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）新修正的《中华人民共和国安全生产法》自2021 年9 月1 日起施行。依据该法，下列说法正确的是：","options":["应急管理部门对安全生产进行监督管理，其他行业主管部门无监管职责","生产经营单位分管生产的负责人是本单位安全生产第一负责人","安全生产违法行为导致重大事故损害公益的，人民检察院及有关公益组织可提起公益诉讼","生产安全事故情节特别严重、影响特别恶劣的，罚款额最高可达一亿元"],"answer":"D","explanation":"第一步，本题考查法律。第二步，《中华人民共和国安全生产法》第114 条规定，发生生产安全事故，对负有责任的生产经营单位除要求其依法承担相应的赔偿等责任外，由应急管理部门依照下列规定处以罚款：……（四）发生特别重大事故的，处一千万元以上二千万元以下的罚款。发生生产安全事故，情节特别严重、影响特别恶劣的，应急管理部门可以按照第一款罚款数额的二倍以上五倍以下对负有责任的生产经营单位处以罚款。也就是说罚款最高可达1 亿元。D 项正确。因此，选择D 选项。拓展 A 项：根据《中华人民共和国安全生产法》第10 条第3 款规定，应急管理部门和对有关行业、领域的安全生产工作实施监督管理的部门，统称负有安全生产监督管理职责的部门。负有安全生产监督管理职责的部门应当相互配合、齐抓共管、信息共享，依法加强安全生产监督管理工作。“其他行业主管部门无监管职责”说法错误。A 项错误。 B 项：根据《中华人民共和国安全生产法》第5 条规定，生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。生产经营单位分管安全生产的负责人是本单位安全生产的直接责任人，对安全生产负直接领导责任。可见“生产经营单位分管生产的负责人是本单位安全生产第一负责人”是不对的。 B 项错误。 C 项：根据《中华人民共和国安全生产法》第74 条规定，任何单位或者个人对事故隐患或者安全生产违法行为，均有权向负有安全生产监督管理职责的部门报告或者举报。因安全生产违法行为造成重大事故隐患或者导致重大事故，致使国家利益或者社会公共利益受到侵害的，人民检察院可以根据民事诉讼法、行政诉讼法的相关规定提起公益诉讼。“有关公益组织”无权提出公益诉讼。C 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-009","paperId":"gk2022-xz","num":9,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）《中华人民共和国数据安全法》自2021 年9 月1 日起施行。依据该法，下列说法错误的是:","options":["省级以上人民政府应当将数字经济发展纳入本级国民经济和社会发展规划","国家工业和信息化主管部门负责国家数据安全工作的决策和议事协调","国家建立数据分类分级保护制度，对数据实行分类分级保护","从事数据交易中介服务的机构提供服务，应当要求数据提供方说明数据来源"],"answer":"B","explanation":"第一步，本题考查法律并选错误项。第二步，根据《中华人民共和国数据安全法》第5 条规定，中央国家安全领导机构负责国家数据安全工作的决策和议事协调，研究制定、指导实施国家数据安全战略和有关重大方针政策，统筹协调国家数据安全的重大事项和重要工作，建立国家数据安全工作协调机制。选项B 中表述为“国家工业和信息化主管部门”，与“中央国家安全领导机构”不符。B 项错误。因此，选择B 选项。拓展 A 项：根据《中华人民共和国数据安全法》第14 条规定，省级以上人民政府应当将数字经济发展纳入本级国民经济和社会发展规划，并根据需要制定数字经济发展规划。与A 项表述一致。 C 项：根据《中华人民共和国数据安全法》第21 条规定，国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。与C 项表述一致。 D 项：根据《中华人民共和国数据安全法》第33 条规定，从事数据交易中介服务的机构提供服务，应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。与D 项表述一致。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-010","paperId":"gk2022-xz","num":10,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）下列甲乙丙丁的行为构成利用影响力受贿罪的是：","options":["甲为某生态环境局副局长，某项目经理王某为减轻环境行政罚款向其行贿5 万元，后甲向下属监察大队负责人打招呼撤销罚款决定","乙为某市场监督管理局局长，某项目经理张某为减轻国土资源行政罚款向其行贿5 万元，后乙向自然资源局领导打招呼撤销罚款决定","丙为某税务局公务员，其夫为教育局局长，丙收受李某5 万元并通过其夫职权解决李某小孩跨区入学问题，其夫不知情","丁为某教育局局长，其妻为私企员工，私下收受刘某5 万元并通过其夫职权解决刘某小孩跨区入学问题，丁知情后未反对"],"answer":"C","explanation":"第一步，本题考查《刑法》。第二步，《刑法》第388 条之一【利用影响力受贿罪】国家工作人员的近亲属或者其他与该国家工作人员关系密切的人，通过该国家工作人员职务上的行为，或者利用该国家工作人员职权或者地位形成的便利条件，通过其他国家工作人员职务上的行为，为请托人谋取不正当利益，索取请托人财物或者收受请托人财物，数额较大或者有其他较重情节的。C 选项丙收受李某5 万元并利用其夫职权解决李某小孩跨区入学问题，其夫不知情，丙构成利用影响力受贿罪。因此，选择C 选项。拓展 A 项、B 项、D 项：《刑法》第385 条【受贿罪】国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的，是受贿罪。A 选项甲、B 选项乙和D 选项丁构成受贿罪，不符合题意。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-011","paperId":"gk2022-xz","num":11,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）甲乙丙丁4 人发起设立某商贸股份有限公司，并租赁了1 处办公场所。在公司设立过程中，甲由于疏忽忘关水龙头致办公场所被淹，给办公场所业主戊造成5 万元损失。公司设立后，业主戊向公司索赔。下列说法正确的是：","options":["因公司已设立，5 万元损失由公司承担即可","因系发起人责任，5 万元损失由发起人共同承担","因在公司设立过程中产生损失，5 万元由公司和发起人共同承担","公司可以先行向业主戊赔偿，再向甲追偿"],"answer":"D","explanation":"第一步，本题考查民法。第二步，《民法典》第75 条，设立人为设立法人从事的民事活动，其法律后果由法人承受。《中华人民共和国公司法》第94 条，股份有限公司的发起人应当承担下列责任：（一）公司不能成立时，对设立行为所产生的债务和费用负连带责任；（二）公司不能成立时，对认股人已缴纳的股款，负返还股款并加算银行同期存款利息的连带责任；（三）在公司设立过程中，由于发起人的过失致使公司利益受到损害的，应当对公司承担赔偿责任。因此，选择D 选项。拓展 A 项：5 万元损失先由公司承担，公司承担后可以向有重大责任的甲追偿。A 项错误。 B 项：公司已经设立责任应由公司承担，设立人甲有重大过失，公司可以向甲追偿，其他发起人不承担责任。B 项错误。 C 项：公司已经设立责任应由公司承担，设立人甲有重大过失，公司可以向甲追偿，公司和发起人不是共同承担责任的关系，且其他发起人无责任。C 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-012","paperId":"gk2022-xz","num":12,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）下列做法符合《中华人民共和国乡村振兴促进法》的是：","options":["某县政府为培育良种，划定一块永久基本农田作为重要农产品生产保护区","某省政府严控农用地转为建设用地，不限制耕地转为林地","某市政府为了方便规模经营，对农用地未分类而进行统一管理","某乡政府遵循法定程序撤并村庄，要求涉及的农民无条件配合"],"answer":"A","explanation":"第一步，本题考查《中华人民共和国乡村振兴促进法》。第二步，《中华人民共和国乡村振兴促进法》第14 条规定，国家实行永久基本农田保护制度，建设粮食生产功能区、重要农产品生产保护区，建设并保护高标准农田。与A 项表述一致。因此，选择A 选项。拓展 B 项：《中华人民共和国乡村振兴促进法》第14 条规定，国家建立农用地分类管理制度，严格保护耕地，严格控制农用地转为建设用地，严格控制耕地转为林地、园地等其他类型农用地。省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少、质量有提高。选项B 表述为不限制耕地转为林地，与法条内容不符。B 项错误。 C 项：《中华人民共和国乡村振兴促进法》第14 条规定，国家建立农用地分类管理制度。选项C 表述为对农用地未分类而进行统一管理，与法条内容不符。C 项错误。 D 项：《中华人民共和国乡村振兴促进法》第51 条规定，县级人民政府和乡镇人民政府应当优化本行政区域内乡村发展布局，按照尊重农民意愿、方便群众生产生活、保持乡村功能和特色的原则，因地制宜安排村庄布局，依法编制村庄规划，分类有序推进村庄建设，严格规范村庄撤并，严禁违背农民意愿、违反法定程序撤并村庄。选项D 中表述为要求涉及撤并村庄的农民无条件配合，与法条内容不符。D 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-013","paperId":"gk2022-xz","num":13,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）下列经济现象或做法符合经济学常理的是：","options":["中央银行增加外汇储备引起货币供应量减少","通货紧缩时期政府减少在社会福利方面的支出","政府通过降低税率，减少税收，抑制通货膨胀","流动性过剩时中央银行在金融市场上出售国债"],"answer":"D","explanation":"第一步，本题考查经济学常识。第二步，流动性过剩，即指有过多的货币投放量，这些多余的资金需要寻找投资出路，于是就有了投资/经济过热现象，以及通货膨胀危险。中央银行需要在金融市场上出售国债来减少市场上的货币投放量从而可以抑制流动性过剩。与D 项表述相符。因此，选择D 选项。拓展 A 项：外汇储备和货币供应量的关系是同比关系。中央银行增加外汇储备，货币供应量同时增加，即当央行买进外汇支付人民币时，央行外汇储备增加，基础货币投放增加，所以货币供应量会增加。A 项错误。 B 项：通货紧缩是市场上流通的货币量少于商品流通中所需要的货币量而引起的货币升值、物价普遍持续下跌的状况。政府需要增加社会福利开支，起到使个人收入增加，增加市场上流通的货币量从而可以治理通货紧缩。B 项错误。 C 项：通货膨胀，是指在货币流通条件下，因货币实际需求小于货币供给，也即现实购买力大于产出供给,导致货币贬值，而引起的一段时间内物价持续而普遍地上涨现象。其实质是社会总供给小于社会总需求。政府通过提高税率，增加税收来减少货币的供给从而可以抑制通货膨胀。C 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-014","paperId":"gk2022-xz","num":14,"year":2022,"region":"国家","module":"常识判断","sub":"人文历史","stem":"（单选题）下列毛泽东诗词与创作背景对应正确的是：","options":["三十八年过去，弹指一挥间。可上九天揽月，可下五洋捉鳖，谈笑凯歌还——1941 年延安整风运动","军叫工农革命，旗号镰刀斧头。匡庐一带不停留，要向潇湘直进——1948 年淮海战役","金沙水拍云崖暖，大渡桥横铁索寒——1930 年第一次反“围剿”","宜将剩勇追穷寇，不可沽名学霸王——1949 年解放南京"],"answer":"D","explanation":"第一步，本题考查中共党史。第二步， “宜将剩勇追穷寇，不可沽名学霸王” 出自于毛泽东所写的《七律·人民解放军占领南京》，是毛泽东写于1949 年创作的一首七律诗。全诗表现了中国人民解放军彻底打垮国民党反动派的信心和决心，表达了诗人解放全中国的必胜信念，格调雄伟，气势磅礴，雄壮有力。与D 项表述一致。因此，选择D 选项。拓展 A 项：“三十八年过去，弹指一挥间。可上九天揽月，可下五洋捉鳖，谈笑凯歌还” 出自于毛泽东所写的《水调歌头·重上井冈山》。是毛泽东写于1965 年的一首词，最早发表在《诗刊》1976 年1 月号。选项A 表述为1941 年延安整风运动，与《水调歌头·重上井冈山》背景不符。A 项错误。 B 项： “军叫工农革命，旗号镰刀斧头。匡庐一带不停留，要向潇湘直进” 出自于毛泽东所写的《西江月·秋收起义》。是毛泽东于1927 年9 月秋收起义后创作的一首词。选项B 表述为1948 年淮海战役，与《西江月·秋收起义》背景不符。B 项错误。 C 项：“金沙水拍云崖暖，大渡桥横铁索寒 ” 出自于毛泽东所写的《七律·长征》。这首诗写于1935 年10 月，当时毛泽东率领中央红军越过岷山，长征即将结束。选项C 表述为1930 年第一次反“围剿”，与《七律·长征》背景不符。C 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-015","paperId":"gk2022-xz","num":15,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）2020 年12 月8 日，国家主席习近平同尼泊尔总统班达里互致信函，共同宣布珠穆朗玛峰高程。关于此次珠峰高程测量，下列说法错误的是：","options":["水准测量从日喀则一等水准点起测","使用北斗卫星导航系统进行高精度定位","探测峰顶雪深的雪深雷达通过超声波探测","首次在珠峰北侧开展航空重力测量"],"answer":"C","explanation":"第一步，本题考查地理并选错误项。第二步，雪深雷达主要利用天线发射和接收高频电磁波来探测地面雪深，通过雪深雷达观测获得珠峰峰顶冰雪层厚度，并将其从珠峰峰顶雪面海拔高中扣除，即获得珠峰峰顶岩石面海拔高，也就是俗称的“珠峰高程”。雪深雷达通过电磁波探测而不是超声波探测。C 项错误。因此，选择C 选项。拓展 A 项：此次珠峰高程测量，是从日喀则一等水准点起测，将高程传递至珠峰脚下的6 个交会点，登顶测量队员完成测量觇标的架设后，6 个交会点的测量队员，同时开始三角高程测量和交会测量。A 项正确。 B 项：此次珠峰高程测量，是北斗系统在珠峰高程测量项目中首次应用。在峰顶，全球导航卫星系统（GNSS）接收机能通过卫星获取平面位置、峰顶雪面大地高等信息，而大地高与海拔之间有一定换算关系。登顶测量时，顶峰的GNSS 接收机能依托北斗系统和珠峰地区以及外围的GNSS 监测网联机同步观测，同时还可监测相关地区的地壳运动。B 项正确。 D 项：2020 年6 月2 日下午，“航空地质一号”飞机完成当天测量任务，平稳降落在拉萨贡嘎机场，标志着我国首次完成对珠峰及周边区域包括北侧的高精度航空重力测量。这是我国首次在珠峰及周边区域开展高精度航空重力和遥感综合测量，重力测量数据能够计算出更高精度的大地水准面（即海拔高程系统的起算面），航空遥感测量则能够获得大范围、精度可达分米级的珠峰及周边区域三维地形测量成果，将填补相应数据资料的空白。D 项正确。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-016","paperId":"gk2022-xz","num":16,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）关于我国航天事业，下列说法正确的是：","options":["所有发射任务都是长征系列火箭承担的","我国第一颗地球同步轨道卫星是在文昌发射的","航天员搭乘“神舟十二号”首次进入我国自己的空间站","“实践十三号”是用于监测国土资源的卫星"],"answer":"C","explanation":"第一步，本题考查航空航天知识。第二步，2021 年6 月17 日，神舟十二号载人飞船在酒泉卫星发射中心成功发射，与天和核心舱完成自主快速交会对接，聂海胜、刘伯明、汤洪波3 名航天员顺利“入住”天和核心舱。标志着中国人首次进入自己的空间站。与C 项表述相符。因此，选择C 选项。拓展 A 项：由中国航天科技集团自主研制的长征系列运载火箭，是中国航天的主力运载火箭，承担了我国90%以上的发射任务。选项A 表述为全部都是由长征系列发射，与之表述不符。A 项错误。 B 项：西昌卫星发射中心具有“天然发射场”的优越条件：一是纬度低，海拔高，发射倾角好，地空距离短，纬度越低，离赤道越近，这既可充分利用地球自转的离心力，又可缩短地面到卫星轨道的距离，从而增加火箭的有效负荷。二是气候。西昌素有小春城之称，属亚热带高原季风气候，是中国年气温变化最小的地区之一。雨旱两季分明，晴天多达320 天，几乎没有雾日，这如洗的碧空也大大地增加了卫星的年试验周期和允许发射的时间。 1984 年4 月8 日，西昌发射中心发射了中国第一颗地球同步轨道卫星。而非文昌。选项B 表述与之不符。B 项错误。 D 项：2021 年4 月12 日，中国西昌卫星发射中心成功发射实践十三号卫星。实践十三号卫星是中国首颗高通量通信卫星，这颗卫星首次在高轨道上应用激光通信和电推进等技术，通信总容量达20G 以上，超过我国此前所有通信卫星容量的总和。而非用于监测国土资源，选项D 表述与之不符。D 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-017","paperId":"gk2022-xz","num":17,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）我国一直致力于改善生态环境，在长期不懈的治理之下，陕西榆林以北的毛乌素沙漠正在消失。关于毛乌素沙漠，下列说法正确的是:","options":["毛乌素沙漠地区属于温带大陆性气候","治理之前毛乌素沙漠是我国最大的沙漠","治理毛乌素沙漠适合种植各种耐酸性植物","毛乌素沙漠在“三北”防护林体系范围之外"],"answer":"A","explanation":"第一步，本题考查地理国情。第二步，毛乌素沙漠位于陕西省榆林市长城一线以北，因此榆林市也被称为驼城，意为沙漠之城，毛乌素沙漠面积约4.22 万平方公里。沙区年均温6.0-8.5℃，1 月均温-9.5-12℃，7 月均温22-24℃，年降水量250-440 毫米，集中于7-9 月，占全年降水60-75%，尤以8 月为多。降水年际变率大，多雨年为少雨年2-4 倍，常发生旱灾和涝灾，且旱多于涝。属于温带大陆性气候。A 项正确，符合题意。因此，选择A 选项。拓展 B 项：中国最大的沙漠是塔克拉玛干沙漠。整个沙漠东西长约1000 公里，南北宽约400 公里，面积达33 万平方公里。分布在新疆四个地区界内：巴音郭楞、阿克苏、喀什、和田，是中国境内最大的沙漠，故被称为“塔克拉玛干大沙漠”，也是全世界第二大的流动沙漠仅次于阿拉伯半岛的鲁卜哈利沙漠（65 万平方千米），流沙面积世界第一。治理之前毛乌素沙漠并不是我国最大的沙漠，B 项错误。 C 项：毛乌素沙区处于几个自然地带的交接地段，植被和土壤反映出过渡性特点。除向西北过渡为棕钙土半荒漠地带外，向西南到盐池一带过渡为灰钙土半荒漠地带，向东南过渡为黄土高原暖温带灰褐土森林草原地带。沙漠植物治理应在沙漠地区播种沙生植物，以阻止沙漠扩张及改善沙漠土地。治理沙漠最适合种植耐旱、耐寒、耐盐碱的植物，一般是在沙丘迎风坡上种植低矮的灌木或草本植物，固住松散的沙粒，在背风坡的低洼地上种植高大的树木，阻止沙丘移动。或者在沙漠边缘地带造防风林，以削弱沙漠地区的风力，阻止沙漠扩张。防风林的效果与林带的高度有关，树木越高大防风效果越好。C 项中“耐酸性”的说法错误。 D 项：“三北”防护林工程是指在中国三北地区（西北、华北和东北）建设的大型人工林业生态工程。中国政府为改善生态环境，于1979 年决定把这项工程列为国家经济建设的重要项目。三期工程于1996 年启动，奋斗目标是在造林4 万平方公里，到20 世纪末，在东北西部到内蒙东部、京津与河北北部、黄土高原、新疆绿洲等地区建成了一批不同等级的区域性防护体系，使三北地区环境质量有很大改善。提出到2000 年，在东北西部和内蒙古东部、京津和河北北部、黄土高原、毛乌素沙地、新疆绿洲等地建成一批规模不等的区域性防护林体系。毛乌素沙漠在“三北”防护林体系范围之内，D 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-018","paperId":"gk2022-xz","num":18,"year":2022,"region":"国家","module":"常识判断","sub":"科技生活","stem":"（单选题）下列物理学家与名言对应错误的是：","options":["费曼——没有人真正了解量子力学","麦克斯韦——电和磁的实验中最明显的现象是，处于彼此距离相当远的物体之间的相互作用","牛顿——万有引力、电的相互作用和磁的相互作用，可以在很远的地方明显地表现出来，因此用肉眼就可以观察到","卢瑟福——固执于光的旧有理论的人们，最好是从它自身的原理出发，提出实验的说明"],"answer":"D","explanation":"第一步，本题考查物理知识并选错误项。第二步，欧内斯特·卢瑟福，英国著名物理学家，原子核物理学之父。学术界公认他为继迈克尔·法拉第之后最伟大的实验物理学家。而“固执于光的旧有理论的人们，最好是从它自身的原理出发，提出实验的说明。并且，如果他的这种努力失败的话，他应该承认这些事实。”是英国医生、物理学家，光的波动说的奠基人之一的托马斯·杨提出的。D 项对应错误，符合题意。因此，选择D 选项。拓展 A 项：理查德·菲利普斯·费曼，美籍犹太裔物理学家，加州理工学院物理学教授。提出了费曼图、费曼规则和重正化的计算方法，这是研究量子电动力学和粒子物理学不可缺少的工具。被认为是爱因斯坦之后最睿智的理论物理学家，也是第一位提出纳米概念的人。1964 年11 月，费曼在康奈尔大学开展的系列讲座“物理定律的本性”中讲出了下面这样一番话：我想我可以有把握地说，没有人真正理解量子力学。因而，不必太认真地对待我这一讲座，觉得你真的通过我所描述的某种模型弄懂了什么，你只要自由自在地欣赏它就好了。A 项对应正确，与题意不符。 B 项：詹姆斯·克拉克·麦克斯韦，英国物理学家、数学家。经典电动力学的创始人，统计物理学的奠基人之一。被普遍认为是对物理学最有影响力的物理学家之一。他提出，电和磁的实验中最明显的现象是，处于彼此距离相当远的物体之间的相互作用。因此，把这些现象化为科学的第一步就是，确定物体之间作用力的大小和方向。B 项对应正确，与题意不符。 C 项：艾萨克·牛顿，英国著名的物理学家、数学家，百科全书式的“全才”，著有《自然哲学的数学原理》《光学》。阐明了动量和角动量守恒的原理，提出牛顿运动定律。他提出，万有引力、电的相互作用和磁的相互作用，可以在很远的地方明显的表现出来，因此用肉眼就可以观察到；但也许存在另一些相互作用力，他们的距离如此之小，以至无法观察。C 项对应正确，与题意不符。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-019","paperId":"gk2022-xz","num":19,"year":2022,"region":"国家","module":"常识判断","sub":"人文历史","stem":"（单选题）下列哪一情形在历史上有可能发生？","options":["秦朝时郑某升任西域都护，友人为他摆酒饯行","西汉时张某担任市舶使，负责采购舶来船","唐朝富商李某在女儿出嫁时陪送白瓷数十套","明代官员王某请戏班演出京剧《白蛇传》"],"answer":"C","explanation":"第一步，本题考查中国史。第二步，中国白瓷又称“中国白”。邢窑是中国最早的白瓷窑址。邢窑创烧于北朝晚期，经过隋朝的飞速发展，到唐朝已达到鼎盛阶段，衰落于唐末五代时期，成为我国早期生产白瓷的中心。C 项可能发生。因此，选择C 选项。拓展 A 项：西域都护是汉代西域最高军政长官。汉代在秦朝之后。A 项不可能发生。 B 项：市舶使是官名，唐玄宗开元二年（714 年）设置。唐朝在西汉之后。B 项不可能发生。 D 项：《白蛇传》是中国四大民间爱情传说之一。而京剧，又称平剧、京戏等，是中国影响最大的戏曲剧种，分布地以北京为中心，遍及全国各地。清代乾隆五十五年（1790 年）起，原在南方演出的三庆、四喜、春台、和春四大徽班陆续进入北京，与来自湖北的汉调艺人合作，同时接受了昆曲、秦腔的部分剧目、曲调和表演方法，又吸收了一些地方民间曲调，通过不断的交流、融合，最终形成京剧。《白蛇传》的京剧不可能在明代演出。D 项不可能发生。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-020","paperId":"gk2022-xz","num":20,"year":2022,"region":"国家","module":"常识判断","sub":"法律","stem":"（单选题）下列与急救有关的说法正确的是:","options":["误服氨水者应该立即进行洗胃或催吐","误食强酸可以立即口服氢氧化铝凝胶","农药沾染皮肤中毒可以立即用热水擦洗","烧伤时应立即饮用大量凉水补充体液"],"answer":"B","explanation":"第一步，本题考查生活常识。第二步，误食强酸强碱均可以引起食道灼伤，导致食管粘膜损伤或者坏死、狭窄，甚至祸及生命。如果误食强酸，可以口服3%-4%的氢氧化铝凝胶或者是氢氧化钙，这样可以中和酸性。与B 项表述相符。因此，选择B 选项。拓展 A 项：氨水进入消化道，可出现严重消化道刺激症状，如口腔炎，食道灼痛、恶心、呕吐、出血性胃炎、吐出物带鲜血或呈棕色、腹痛、腹泻等。此时切不可催吐，也不能洗胃，以免发生食道和胃穿孔，可服生鸡蛋清50 毫升或牛奶200 毫升，植物油50-100 毫升等润滑缓和剂以减轻刺激，亦可内服稀释的食醋、稀柠檬水以中和氨水。选项A 中表述为立即进行催吐或洗胃，与之表述不符。A 项错误。 C 项：农药沾染皮肤的，应立即停止作业，脱去被农药污染的衣服，用清水及肥皂（不要用热水）充分洗涤被污染的部位。但对敌百虫药剂的污染不要用肥皂，以免敌百虫遇碱性的肥皂后转化为毒性更高的敌敌畏。敌百虫水溶性较大，只要用清水充分洗涤就行。洗涤后用洁净的干毛巾擦干皮肤，穿上干净衣服并保持温暖。不用热水的原因是热水会加速皮肤对农药的吸收，加重病情。选项C 中表述为可以用热水立即擦洗，与之表述不符。C 项错误。 D 项：烧伤后，如果无法立即通过输液补水，千万不要给伤员喝水，尤其是不能喝白开水。因为一般发生烫伤、烧伤后，身体第一反应是口渴，这种情况，千万不可喝水。因为伤势很重，喝水会导致水肿、胃肠道应激性反应，病情会加重，并且会对以后的治疗产生负面作用。选项D 中表述为应立即喝凉水补充体液，与之表述不符。D 项错误。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-021","paperId":"gk2022-xz","num":21,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）安装监控补光灯的目的在于更好地识别车辆信息，从而提高执法效率，存留违法车辆的有效证据。然而，交通执法的根本目的在于维护道路交通安全，如果执法手段本身对于交通安全构成了隐患甚至不幸导致事故，那么无疑是________。填入画横线部分最恰当的一项是：","options":["得不偿失","本末倒置","背道而驰","因小失大"],"answer":"B","explanation":"第一步，分析语境。通过“然而”可知，文段前后内容为对比关系。前面说的是安装监控补光灯的目的，即意义。通过转折词“然而”话锋一转，说到了其目的在于维护交通安全，但是如果结果导致对交通安全构成了隐患甚至不幸导致事故，这是和初衷不一致的。第二步，辨析选项。A 项“得不偿失”比喻得到的抵不过失掉的。“隐患”和“事故”中并没有得到东西，语义不符，排除A 项。B 项“本末倒置”形容把事物的主次、轻重颠倒了，符合语境。C 项“背道而驰”朝着相反的方向奔跑。比喻行动跟既定的方向完全相反。其一，题目中指结果，而不是行动。其二，题干并未体现“完全相反”，排除C 项。D 项“因小失大”指为了小利益，却损失了大利益。安装监控补光灯并不存在“利益”一说，语义不符，排除D 项。因此，选择B 选项。拓展文段出处：光明网《“亮瞎眼”监控补光灯问题，该及时解决了》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-022","paperId":"gk2022-xz","num":22,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）文创产品能否经受检验、笑到最后，关键在于是否蕴含了深厚的文化价值与审美价值。在专注其实用价值的同时，更要看到它们所承载的文化意涵、所具有的文化表达功能。如果对传统文化 ________，盲目引入商业化流程，反而会贬损传统文化的价值。填入画横线部分最恰当的一项是：","options":["敬而远之","不以为然","不求甚解","浅尝辄止"],"answer":"C","explanation":"第一步，分析语境。根据前文“更要看到他们所承载的……”可知，最后一句话表达 “应关注文创产品中的传统文化”之意，且根据后文“盲目引入”可知横线处应该表达出对传统文化不了解。第二步，对比选项。A 项“敬而远之”指尊敬却有所顾虑不愿接近；B 项“不以为然”指不认为是对的，表示不同意；D 项“浅尝辄止”指略微尝试一下就停下来，对知识、问题等不作深入研究。三者均不符合语境，排除。 C 项“不求甚解”指只求懂得个大概，不求深刻了解，符合语境。因此，选择C 选项。拓展文段出处：《从唐宫夜宴到清宫咖啡，让期待更多了》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-023","paperId":"gk2022-xz","num":23,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）思政课教师要有正确的党史观和过硬的党史知识，只有自己观点正确、史料丰富，才能准确无误地给学生指引方向、有力有理有据地反驳错误观点、________ 地选择恰当的教学方式，推动党史教育入脑入心、开花结果。填入画横线部分最恰当的一项是：","options":["信手拈来","轻而易举","游刃有余","随心所欲"],"answer":"C","explanation":"第一步，分析语境。该空照应前文“思政课教师要有正确的党史观……”，表达“能够熟练自如选择恰当的教学方式”之意，具有积极的感情倾向。第二步，对比选项。C 项“游刃有余”指技术熟练，经验丰富，解决问题丝毫不费力。置于该空，可以表达出 “思政课教师经验丰富，可以很灵活地选择恰当的教学方式”之意，色彩积极，符合语境。A 项“信手拈来”多指写文章时能自由纯熟地选用词语或应用典故，用不着怎么思考，搭配不当，排除；B 项“轻而易举”形容事情做成容易，毫不费力，色彩不如“游刃有余”更正面；D 项“随心所欲”指一切都由着自己的心意，想怎么做就怎么做，感情色彩不符，排除。因此，选择C 选项。拓展文段出处：《发挥好互联网在党史学习教育中的重要作用》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-024","paperId":"gk2022-xz","num":24,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）解剖是认识某种动物形态特征的重要方式，但对于罕见或稀有物种而言，解剖无疑会破坏珍贵的样本，其损失________。近年来，无损检测已开始应用于文物鉴定等多种领域，________相关技术的应用经验，研发出一套专门针对珍稀动物样本无损检测的方法，必将大有可为。依次填入画横线处恰当的一项是：","options":["难以估量拓展","触目惊心参考","毋庸置疑模仿","不言而喻借鉴"],"answer":"D","explanation":"第一步，分析第一空。根据“解剖无疑会破坏珍贵的样本”可知，损失是一定会产生的。A 项“难以估量”指很难估计，很难猜测，形容数目众多。B 项“触目惊心”形容事态严重，引起轰动。两者程度太重，排除A 项和B 项。C 项“毋庸置疑”指事实明显或理由充分，根本就没有怀疑的余地。D 项“不言而喻”指不必说就能明白。二者符合语境，和前文的“无疑”相对应，保留。第二步，分析第二空。第二空搭配“经验”，意为学习相关技术的应用经验。C 项“模仿”与“经验”搭配不当，排除C 项。D 项“借鉴”经验为常用搭配，符合语境。因此，选择D 选项。拓展文段出处：环球网《无创和微创技术结合首次鉴定出新物种》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-025","paperId":"gk2022-xz","num":25,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）如今，网络文艺评论受到大众欢迎，但在花样繁多的内容背后经常________着商业目的，无论是无端批评，还是一味吹捧，都会对观众造成误导，给影视创作带来伤害。互联网的普及让我们既为网络文艺评论生态的蓬勃生长感到惊喜，也为其________的状况感到忧虑。依次填入画横线部分最恰当的一项是：","options":["潜藏泥沙俱下","夹杂乌烟瘴气","渗透鱼龙混杂","裹挟杂乱无章"],"answer":"A","explanation":"第一步，分析第一空。根据“网络文艺评论兴起受到大众欢迎，但在花样繁多的内容背后经常________”可知，文中要表达的意思是花样繁多的内容背后隐藏着商业目的。A 项“潜藏”指隐藏，暗藏的意思，符合文意。B 项 “夹杂”指掺杂，混杂的意思，不符合文意，排除B 项。C 项“渗透”指液体缓慢地透到里面，不符合文意，排除C 项。D 项“裹挟”指风和流水等把别的东西卷入，使随着移动或是（形势、潮流等）把人卷进去，迫使其采取某种态度，不符合文意，排除D 项。第二步，验证第二空。“泥沙俱下”指比喻好坏不同的人或事物都混杂在一起，与“状况”搭配合适，且符合文中网络文艺评论生态里好坏都有的现象。因此，选择A 选项。拓展乌烟瘴气：形容环境嘈杂、秩序混乱或社会上歪风邪气盛行。鱼龙混杂：比喻成员复杂，好人坏人混在一起。杂乱无章：杂乱而没有条理。文章出处《文艺评论既要言之有物也要传之有道》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-026","paperId":"gk2022-xz","num":26,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）基层是国家治理体系的末梢，但这末梢并非________的边角毫末，而是治理现代化总体方略的关键词，也是人民群众日常生活获得感的中转站，基层治理要满足群众的殷切期望，因此，需要 ________重心下移的治理体系，增添治理资源、激发治理活力，如此基层才能“发声呐喊”。依次填入画横线部分最恰当的一项是：","options":["默默无闻打造","微乎其微补充","无足轻重构建","可有可无规范"],"answer":"C","explanation":"第一步，分析第一空。根据语境，第一空词语形容“边角毫末”，且根据后文的“而是……关键词”可知，第一空应体现“不重要”之意。A 项“默默无闻”形容没有名声，不为人们所知道。B 项“微乎其微”形容非常少或非常小。二者与语境不符，排除。C 项“无足轻重”是指无关紧要，符合语境。D 项“可有可无”是指可以有，也可以没有。形容无关紧要。符合语境。第二步，分析第二空。第二空要和“体系”相搭配。C 项“构建”和“体系”是常用搭配。从后面的“增添” “激发”词汇来看，“体系”应该是要新建立的，而不是对原有的进行“规范”，排除D 项。因此，选择C 选项。拓展文段出处：《让基层末梢成治理聚焦点》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-027","paperId":"gk2022-xz","num":27,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）在宇宙过去130 多亿年里，暗物质扮演了十分重要的角色。由于在物质的质量比例上占据 ________地位，暗物质决定了宇宙物质在大尺度上的分布——宇宙大尺度结构。现代超级计算机模拟更是向我们揭示，宇宙中暗物质的空间分布可以再现观测到的星系分布，暗示了星系和暗物质之间 ________的关系。依次填入横线部分最恰当的一组是：","options":["关键盘根错节","核心唇齿相依","主导千丝万缕","优势如影随形"],"answer":"C","explanation":"第一步，分析第一空。根据“暗物质扮演了十分重要的角色，且暗物质决定了……分布”可知，暗物质举足轻重， D 项“优势”意思是比对方有利的形势，文段并未把暗物质和其他进行比较，排除D 项。第二步，分析第二空。填入的词语要修饰星系和暗物质之间的关系。根据“暗物质的空间分布可以再现观测到的星系分布”，说明星系和暗物质之间有紧密关系。A 项“盘根错节”比喻事物的关系错综复杂，很难处理。文段并未强调复杂之意，排除A 项。B 项“唇齿相依”比喻双方关系密切，相互依存。文段语境未强调互相依存之意，排除。C 项“千丝万缕”现多形容相互之间种种密切而复杂的联系，符合语境信息。因此，选择C 选项。拓展文段出处：新浪科技《反常的星系：它们的暗物质去哪儿了？》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-028","paperId":"gk2022-xz","num":28,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）人体肠道内生物的多样性令人惊讶，除细菌外，还________着数十万种被称为噬菌体的病毒，这些噬菌体可以感染细菌。众所周知，肠道微生物组不平衡会引发各种疾病，如炎症性肠病、过敏和肥胖，但我们对肠道细菌及噬菌体在人类健康和疾病方面起何种作用________。依次填入画横线部分最恰当的一项是：","options":["潜伏知之甚少","分布浑然不觉","活跃束手无策","充斥一知半解"],"answer":"A","explanation":"第一步，突破口在第二空。根据空前的“但”可知，前后形成转折关系。转折前强调肠道微生物组不平衡会引发各种疾病，转折后说明我们对肠道细菌及噬菌体在人类健康和疾病方面起到的作用不太清楚。A 项“知之甚少” 指对某方面知道的太少，符合文意。B 项“浑然不觉”指毫无察觉的样子。文段强调我们对于这种作用不清楚、不了解，并不是没有察觉。排除B 项。C 项“束手无策”指像捆住手似的，一点办法也没有。形容遇到问题时毫无解决的办法。与文意不符，排除C 项。D 项“一知半解”形容知道得少，理解得也不深。符合文意。第二步，分析第一空。文段强调的是人体肠道内除了细菌之外，还存在着很多噬菌体。A 项“潜伏”指隐藏；埋伏，符合病毒隐而不发的特性，保留。D 项“充斥”指众多；充满（多含贬义），程度太深，文段只是说有噬菌体，但没有强调肠道被噬菌体充满，且文段并无消极的感情色彩，排除D 项。因此，选择A 选项。拓展分布：是散布（在一定的地区内）的意思。活跃：（气氛）活泼而热烈；（行动）活泼而积极；（使）活泼而积极地行动文段出处：科技日报《人肠道内竟有超14 万种病毒，其中一半以上从未见过》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-029","paperId":"gk2022-xz","num":29,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）近400 年来，人类在探索宇宙方面取得了长足的进步。我们知道了地球上再壮观的烟火表演与超新星爆发相比，都________；一颗方糖大小的中子星就有数亿吨重；宇宙中充满着________ 的物质，包括难以捉摸的黑洞、暗物质、引力波等。依次填入画横线部分最恰当的一项是：","options":["大相径庭千奇百怪","黯然失色不可思议","相形见绌林林总总","不值一提莫名其妙"],"answer":"B","explanation":"第一步，分析第一空。根据“再壮观的烟火表演与超新星爆发相比”可知第一空填入的词语应表示“远远不如、比不上”。A 项“大相径庭”比喻相差很远，大不相同。没有“比不上”的意思，排除A 项。B 项“黯然失色” 比喻相比之下有很大差距，远远不如，符合语境。C 项“相形见绌”指相比之下显得远远不如，符合语境。D 项 “不值一提”指不值得提起，侧重形容事情很轻微或者不重要，不符合语境，排除D 项。第二步，分析第二空。根据“包括难以捉摸的……”可知，要填入的词语形容物质，且具有“难以捉摸”的特点。 B 项“不可思议”现多指无法想象，难以理解，符合语境。C 项“林林总总”形容事务繁多，侧重数量多，没有难以捉摸之意，排除C 项。因此，选择B 选项。拓展千奇百怪：形容事物奇异而多样。林林总总：形容人或事物众多。莫名其妙：没有人能说明它的奥妙（道理），表示事情很奇怪，使人不明白。文段出处：科技日报《解开宇宙重要天体活动的秘密》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-030","paperId":"gk2022-xz","num":30,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）透光摄影、多光谱成像、三维病害模型……这些听起来更像是医疗或化工业的技术，如今在文物修复圈成为________ 的“神器”。正是这些现代科技手段对文物的“问诊”与“体检”，弥补了用肉眼无法看到、用手无法摸到“病情”的缺陷，从而使修复人员可以“________”。依次填入画横线部分最恰当的一项是：","options":["崭露头角药到病除","交口称赞妙手回春","举足轻重有的放矢","必不可少对症下药"],"answer":"D","explanation":"第一步，分析语境。此题的突破口在第二空，通过“问诊”“体检”“病情”可以知道，第二空是修复人员针对这些“病”进行对症治疗。第二步，辨析选项。A 项“药到病除”形容治病者医术高明，用药恰到好处，而文中强调的是现代技术手段使文物修复师修复文物时能够根据文物的“病情”进行治疗，不符合文意，排除A 项。B 项“妙手回春”比喻将濒于死亡的人救活，文中并没有强调这些文物严重受损，故不符合文意，排除B 项。C 项“有的放矢”比喻言论、行动目标明确，和文中“问诊”“体检”“病情”不匹配，不符合文意，排除C 项。D 项“对症下药”比喻针对具体情况，采取相应措施，文中就是通过“问诊”“体检”查出具体“病情”进行对症治疗，D 项与语境、文意一致，符合文意。再看D 项第一空“必不可少”指绝对需要，不达到某种目的就不能做成某件事，也符合文中强调的，如果没有现代技术手段的运用，即如果没有“问诊”“体检”来找到“病情”，那么也就无法实现通过具体病情来对症治疗，符合文意。因此，选择D 选项。拓展崭露头角：比喻突出的显示出才能和本领。交口称赞：众人同声赞美。举足轻重：形容有实力，所处的地位很重要，一举一动都对全局有重大影响。文段出处：光明网《科技“神器”摸清文物“病情”？故宫文物修复“对症下药”》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-031","paperId":"gk2022-xz","num":31,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）太阳能、风能是产生电力的主要可再生新能源，但都具有随机性、________ 、波动性等特点。太阳能光板在晴天、白天时能发电，阴天、夜晚时就“罢工”了，风能发电也跟风力和天气息息相关。因此，目前迫切需要大规模储能装置，将富余的电能储存起来，在发电不足的时间用，以保证电力的________供给。依次填入画横线部分最恰当的一项是:","options":["周期性高效","间歇性平稳","地域性持续","阶段性弹性"],"answer":"B","explanation":"第一步，分析第一空。第一空前后均为顿号，说明横线所填词语与前后词语“随机性”“波动性”构成并列结构，表达相似含义，同时联系上下文太阳能、风能跟天气等因素息息相关说明其要表达的是不稳定性。“周期性” “地域性”均不能表达，排除A 项和C 项。第二步，分析第二空。通过“在发电不足的时间用”可知，第二空横线词语应与第一句表达含义相反，来弥补不稳定性。“弹性”为不稳定的一种表述，排除D 项。因此，选择B 选项。拓展周期性：物体的周期运动、持续循环的性质。间歇性：动作、变化等隔一定时间就停息一会儿。地域性：是指依照一个国家法律获得的商标权，除签订有国际公约或双边条约外，只能在该国领域范围内有效，其他国家对这种权利没有保护的义务，也就是不发生域外效力。阶段性：是在发展的不同年龄阶段中身心发展的一般的典型特征。高效：指效能高的，效率高的。平稳：没有波动或危险。持续：延续不间断。弹性：物体因受外力暂时改变形状，外力一去即恢复原状的一种性质。引申为事物可大可小、可多可少的伸缩性。文段出处：光明网《钠离子电池或成我国能源超车新赛道》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-032","paperId":"gk2022-xz","num":32,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）实施传统胸外按压心肺复苏，常会发生肋骨或胸骨骨折，导致肺、胸膜及心脏损伤，影响心肺复苏的成功率。急救专家由此探索出“胸路不通走腹路”的新途径，腹部提压心肺复苏技术 ________ 。与传统心肺复苏技术相比，该技术________，利用腹部提压心肺复苏仪达到起腹心动、起腹呼吸的目的。依次填入画横线部分最恰当的一项是：","options":["异军突起推陈出新","横空出世一举两得","粉墨登场扬长避短","应运而生另辟蹊径"],"answer":"D","explanation":"第一步，分析第一空。根据上下文，前半句说影响心肺复苏的成功率，后半句提到新途径，说明后半句的感情色彩应为积极的。C 项“粉墨登场”比喻坏人经过一番打扮，登上政治舞台。感情色彩为消极的，语义不符，排除 C 项。第二步，分析第二空。根据“探索出‘胸路不通走腹路’的新途径”可知，这项技术为新途径，而非在以往基础上发展，且凸显“新”。A 项“推陈出新”指去掉旧事物的糟粕，吸取其精华，使它以新的面目出现，为在旧事物基础上发展，排除A 项。B 项“一举两得”指做一件事同时得到两方面的好处，语义不符，排除B 项。D 项 “另辟蹊径”另外开辟一条路。比喻另创一种风格或方法，符合文意。因此，选择D 选项。拓展扬长避短：意思是发挥、发扬优点或有利条件，克服、回避缺点或不利条件。异军突起：比喻另一支新的力量突然出现。横空出世：意思是形容人或物高大，横在空中，浮出人世，或比喻卓尔不群。应运而生：旧指应天命而产生。现指适应时机而产生。文段出处：《腹部提压心肺复苏技术》荣获2020“科创中国”先导技术","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-033","paperId":"gk2022-xz","num":33,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）商标是产品跨入市场的敲门砖，在行业竞争激烈的市场上，市场主体为了在竞争者中 ________，往往倾向于选择能够彰显个性、标新立异的标识作为商标。然而，如果一味追求个性、博公众眼球，效果可能________。一旦触碰公共秩序和良善风俗底线，就会遭遇商标注册申请被驳回的尴尬境遇。依次填入画横线部分最恰当的一项是：","options":["独树一帜适得其反","一鸣惊人事与愿违","拔得头筹过犹不及","一马当先大打折扣"],"answer":"A","explanation":"第一步，分析第一空。根据“往往倾向于选择能够彰显个性、标新立异的标志作为商标”可知，第一空成语应该体现和竞争者“不一样”，具有“独特性”的含义。A 项“独树一帜”比喻创造出独特的风格、主张，自成一家。能够体现独特性，保留。B 项“一鸣惊人”比喻平时不被人注意的人，突然做出惊人的成绩。C 项“拔得头筹”指取得了第一个出场比赛资格。D 项“一马当先”指作战时策马冲锋在前。比喻领先、带头。三者均不能体现“独特性”，语义不符，排除B 项、C 项和D 项。答案锁定A 项。第二步，验证第二空。“适得其反”指恰恰得到与愿望相反的结果。符合“一味追求个性、博公众眼球”带来的消极结果。因此，选择A 选项。拓展事与愿违：意思是事情的发展与愿望相反，指事情没能按照预想的方向发展。过犹不及：事情做得过了头，就跟做的不够是一样的，都不合适。大打折扣：与原来的价值远远不符。文段出处：斑马知识产权《什么是“不良影响”条款？怎么判断商标是具有“不良影响”?》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-034","paperId":"gk2022-xz","num":34,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）当前，我国发展面临着前所未有的风险挑战，既有国内的也有国际的，既有政治、经济、文化、社会等领域的也有来自自然界的，既有传统的也有非传统的，“黑天鹅”“灰犀牛”还会 ________。要更好应对前进道路上各种可以预见和难以预见的风险挑战，我们必须从历史中获得启迪，从历史经验中提炼出________的法宝。填入画横线部分最恰当的一项是：","options":["不期而至克敌致胜","有机可乘战无不克","纷至沓来所向披靡","不请自来攻坚克难"],"answer":"A","explanation":"第一步，分析第一空。文中要表达的是“黑天鹅”“灰犀牛”还会到来。A 项“不期而至”指事先没有约定而意外到来；D 项“不请自来”表示不用邀请自己前来，多指不速之客。二者均符合文意。B 项“有机可乘”意思是有机会可以利用，有空子可钻，文中没有体现“钻空子”，排除B 项。C 项“纷至沓来”形容接连不断de 到来，置于此处语义过重，排除C 项。第二步，分析第二空。文中要表达的是我们必须从历史中获得启迪，从历史经验中提炼出战胜这些风险的法宝。 A 项“克敌致胜”指打败敌人，取得胜利，可以将这些风险问题比作“敌人”，符合文意。D 项“攻坚克难”指攻占坚固的堡垒，克服层层的困难。原指军队作战攻克难关，夺取胜利，现在常常用来形容或鼓励人们克服各种艰难险阻，圆满的完成任务。其侧重于“克服难题”，不如A 项更符合语境。因此，选择A 选项。拓展战无不克：攻战没有不取胜的，形容强大无比，可以战胜一切。所向披靡：比喻力量（多指军事力量）所达到的地方，一切障碍全被扫除。文段出处：党建杂志社《习近平谈增强风险意识》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-035","paperId":"gk2022-xz","num":35,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）当下，传播媒介的________为文化传播创造新符号。其中，短视频平台跨越专业内容生产门槛，________海量用户，进行日常生活的自我呈现，体现了传播的视觉转向和影像化特点。而虚拟现实、增强现实、混合现实则在视觉、听觉、触觉等多模态符号中________人类感官，建构受众的认知和体验。依据填入画横线部分最恰当的一项是：","options":["创新吸引挑战","更迭聚集延伸","涌现引导丰富","升级融合重塑"],"answer":"B","explanation":"第一步，分析第一个空。根据后文“创造着新符号”可知，第一空应表达传播媒介的变化，C 项“涌现”比喻（人和事物）大量出现，与文意不符，排除C 项。第二步，分析第二个空，根据“海量用户”可知，D 项“融合”指几种不同的事物合成一体，与“海量用户”搭配不当，排除D 项。第三步，分析第三空，根据前文“视觉化转向和影像化”，表达受众认知方式变多了，A 项“挑战”指激怒对方出来应战；向别人提出竞赛，与文意不符，排除。B 项“延伸”指扩大宽度、大小、范围，可以体现人类感觉器官通过“虚拟现实”等得到了增强，且与“人类感官”搭配恰当。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-036","paperId":"gk2022-xz","num":36,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）早期的电影多是全景式的“纪录视角”，这是由于摄影机无法移动，只能________传统戏剧我演你看的观演关系。随着各种摄影新技术和剪辑新手法的出现，电影依靠独特的镜头语言，逐渐脱离戏剧的束缚________。完全依照戏剧思维，使用单一固定的场景所打造的电影虽有佳作，但 ________。依次填入画横线部分最恰当的一项是：","options":["照搬自立门户屈指可数","保持另起炉灶凤毛麟角","沿袭独当一面差强人意","复制革故鼎新寥寥无几"],"answer":"A","explanation":"第一步，分析语境。根据“摄影机无法移动”“只能”可以得知，第一空所在句子要表达的意思是，只能和传统戏剧我演你看的观演关系一样，所以A 项“照搬”和C 项“沿袭”符合文意。B 项“保持”意思是保全、保护使不受损害或保留或维持（原状），文中既没有电影受损的意思，也没有提及电影之前是什么样，而是电影从一开始就因为摄影机无法移动，只能和戏剧一样，排除B 项。D 项“复制”，强调一模一样，毕竟是电影，有摄影机，所以和戏剧不可能完全一样，不符合文意，排除D 项。另外，“只能”有一种无可奈何的感觉，感情色彩消极，所以，第一空填入感情色彩消极的词更合适。B 项、C 项和D 项感情色彩为中性，A 项“照搬”感情色彩消极，符合文意。第二步，分析第二空和第三空。第二空，“逐渐脱离戏剧的束缚”可知电影有了自己的思维，A 项“自立门户” 指单独成立家庭，也指学术上不依赖前人而另立一派，现也指离开某一集体，自己另搞一套，符合文意。B 项 “另起独灶”意思是另外重支炉灶。比喻放弃原来的，另外从头做起。或独立另作，另起炉灶。符合文意。C 项 “独当一面”指单独担当一个方面的任务，文中主体是“电影”，它和“戏剧”是不同的类型，不符合文意，排除C 项。第三空，“虽有佳作，但……”，这一转折关系，可以表达出，第三空是佳作很少的意思，A 项“屈指可数”指的就是形容数目很少，扳着手指头就能数过来，符合文意。B 项“凤毛麟角”比喻极其难得而宝贵的东西，语义过重，文中只是“佳作”，不符合文意。因此，选择A 选项。拓展差强人意：大体上使人满意。革故鼎新：旧指朝政变革或改朝换代。现泛指除去旧的，建立新的。寥寥无几：形容稀少，没有几个。文段出处：北京青年报《戏剧与电影“深情相拥”对大家都好？》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-037","paperId":"gk2022-xz","num":37,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）如果历史观错误，不仅达不到学习教育的目的，反倒会________、走入误区。现在一些错误倾向要引起警惕;有的________党史上的失误和曲折，肆意抹黑歪曲党的历史、攻击党的领导：有的将党史事件同现实问题刻意勾连、恶意炒作；有的不信正史信野史，将党史庸俗化、娱乐化，热衷传播八卦轶闻，对非法境外出版物________，等等。依次填入画横线部分最恰当的一项是:","options":["轻重倒置渲染青睐有加","南辕北辙夸大津津乐道","缘木求鱼聚焦趋之若鹜","断章取义曲解如数家珍"],"answer":"B","explanation":"第一步，分析第一空。根据“如果历史观错误，不仅达不到学习教育的目的，反倒会________、走入误区”可知，文中要表达的意思是没有达到学习的目的，结果事与愿违。B 项“南辕北辙”比喻行动和目的正好相反，符合文意。C 项“缘木求鱼”比喻行事的方向、方法不对，必将劳而无功，符合文意。A 项“轻重倒置”指把重要的和不重要的两者的地位摆颠倒了，不符合文意，排除A 项。D 项“断章取义”侧重孤立地取其中的一段或一句的意思，不符合文意，排除D 项。第二步，分析第二空。根据“有的________党史的失误和曲折，肆意抹黑歪曲党的历史、攻击党的领导”可知，第二空需填入能够表达与真实的党史不相符的语境。B 项“夸大”符合文意。C 项“聚焦”比喻视线、注意力等集中于一点，不符合文意，排除C 项。第三步，验证第三空。B 项“津津乐道”指有兴趣的谈论，代入文中“对非法境外出版物________”，符合文意。因此，选择B 选项。拓展青睐有加：形容对人的赏识或者喜爱。趋之若鹜：像鸭子一样成群地跑过去，比喻争着追逐不好的事物。如数家珍：比喻对所讲的事情非常熟悉。文段出处：《注意！习近平总书记对学习党史提出9 方面要求》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-038","paperId":"gk2022-xz","num":38,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）病毒变异每时每刻都在发生，随机性极大，突变率高、变异速度快，这意味着它们更有机会形成适应环境的________。然而，并非每种变异都能让病毒存活并发展下去。同一时期，病毒的变异株可能有很多种，但“________”，只有那些能更有效________免疫系统侦测且传播能力强的毒株才能最终成为优势株。依次填入画横线部分最恰当的一项是：","options":["特质优胜劣汰突破","性状适者生存躲避","机能胜者为王迷惑","表征此消彼长逃脱"],"answer":"B","explanation":"第一步，突破口在第二空。根据“病毒变异意味着有机会适应环境”可知，虽然病毒的变异株可能有很多种，但是适应环境的才会留存下来成为优势株。对比第二空的四个成语，A 项“优胜劣汰”指生物在生存竞争中适应力强的保存下来，适应力差的被淘汰。B 项“适者生存”指最能适应环境的个体得以保存和繁荣。二者均符合语境，保留。C 项“胜者为王”意思是胜利者权势在手，无人敢责难。指在争夺政权斗争中，胜利了的就是合法的，称帝称王。文段并不是病毒之间竞争，侧重的是谁能适应环境即可生存，C 项不符合语境信息，排除。D 项“此消彼长”是指这个下降，那个上升，意思不符合语境，排除。第二步，分析第三空。根据文段可知，病毒变异株只有避开免疫系统侦测才能留存下来，B 项的“躲避”更符合语境，A 项“突破”意思是指打开缺口、超过、打破等，常搭配困难、限制等，不符合语境，排除。答案锁定B 项。第三步，验证第一空。“性状”指可遗传的发育个体和全面发育个体所能观察到的特征，放在此处合适。因此，选择B 选项。拓展文段出处：新浪科技《新冠病毒为什么会变异》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-039","paperId":"gk2022-xz","num":39,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）对武器装备来说，没有永远的“明星”，只有彼此的“克星”。站在对手的角度，选准新装备的“克星”，才能让我们进一步________，抢在对手之前探寻更先进武器装备的制胜机理，打造出 ________未来战场的坚甲利器。从这个意义上说，一个强劲的对手，既是改进武器的“________”，也是研发武器的“催化剂”。依次填入画横线部分最恰当的一项是:","options":["攻其不备颠覆指向标","以逸待劳引领助推器","知己知彼适应磨刀石","战无不胜胜任源动力"],"answer":"C","explanation":"第一步，分析第一空。横线处所填成语想要表达站在对手的角度去进行装备研发，所能达到的效果。A 项“攻其不备”指趁对方没有防备时进攻，B 项“以逸待劳”指作战的时候采取守势，养精蓄锐，等来攻的敌人疲惫后再出击，原文没有体现对手“没有防备”或者“我们采取守势”的语境，故A 项和B 项排除。C 项“知己知彼”指对自己和对方都了解得很透彻，可以照应前文的“以对手为参照”，符合语境。D 项“战无不胜”形容军队每战必胜，战斗力极强，也比喻办任何事情都能成功。语义程度过重，且无法和“进一步”搭配，排除。答案锁定C 项。第二步，验证第二空和第三空。“适应”指符合客观条件或需要，与“战场”搭配得当。“磨刀石”即用来磨利刀子的石头。此处用比喻的手法形容对手对“改进武器”的作用，强大的对手可以促使我们改进武器，并且“磨刀石”与“改进武器”语义上照应。因此，选择C 选项。拓展指向标：地图上一种定向的工具，指向标尖的一头指向的地方一般是北方，比喻对事件的发展起指导作用的因素。助推器：一种动力装置，内含燃料，推动火箭、飞船升天，比喻对事件的发展有推动促进作用的因素。源动力：词典未收录。“望文生义”结合语境可将其理解为来自本源，或源源不断的动力文段出处：解放军报《没有永远的“明星”只有彼此的“克星”》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-040","paperId":"gk2022-xz","num":40,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）近年来出现的《我在故宫修文物》等以国宝为题材的纪录片,提供了认识历史的新 ________。这些纪录片以具体的文物为线索、又不________于文物，而是描绘物品所处时代的精神世界，以此引导当代观众与传统文化发生碰撞，引导情感参与，开拓历史视野。这些节目如同荧屏上的博物馆，让观众________。依次填入画横线部分最恰当的一项是:","options":["方向受制大开眼界","视角拘泥流连忘返","境界局限身临其境","途径止步叹为观止"],"answer":"B","explanation":"第一步，分析第一空。结合语境和选项可知，该空可以表达纪录片为认识历史提供了新角度、新方向。C 项“境界”指事物所达到的程度或表现的情况，不符合语境，排除C 项。第二步，分析第二空。根据语境可知，该空表达纪录片以具体的文物为线索，又不会被文物限制住。D 项“止步” 指止住步子，驻足不前，不符合语境，排除D 选项。第三步，分析第三空。该空照应“这些节目如同荧屏上的博物馆”，表达节目给大众带来非常好的感觉。B 项 “流连忘返”指玩乐时留恋不愿离开，留恋得忘记了回去，符合语境。A 项“大开眼界”指开阔视野，增长见识，不符合语境，排除。因此，选择B 选项。拓展身临其境：亲自到了那个环境。叹为观止：赞叹观赏的对象精妙之极、完美之至。拘泥：固执而不知变通。局限：限制在一定范围内。文段出处：《从“国宝”出发的视听呈现》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-041","paperId":"gk2022-xz","num":41,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）“________________。”要加快完善中国特色社会主义法律体系，使之更加科学完备、统一权威。党的十八大以来，全国人大及其常委会通过宪法修正案，制定法律48 件，修改法律203 件次，作出法律解释9 件，通过有关法律问题和重大问题的决定79 件次。截至目前，现行有效法律282 件、行政法规608 件，地方性法规12000 余件。民法典为其他领域立法法典化提供了很好的范例，要总结编纂民法典的经验，适时推动条件成熟的立法领域法典编纂工作。要研究丰富立法形式，可以搞一些“大块头”，也要搞一些“小快灵”，增强立法的针对性、适用性、可操作性。填入画横线部分最恰当的一项是：","options":["法者，天下之准绳也","国皆有法，而无使法必行之法","立善防恶谓之礼，禁非立是谓之法","治国无其法则乱，守法而不变则衰"],"answer":"D","explanation":"第一步，分析横线处的上下文语境。横线出现在文段开头，起到引出话题或总领全文的作用。横线后先提出“要加快完善中国特色社会主义法律体系，使之更加科学完备、统一权威”接着用一系列数据说明全国人大及其常委会通过宪法修正案所取得的一些进展。接着又列举了民法典的例子，指出要总结编纂民法典的经验，适时推动条件成熟的立法领域法典编纂工作、要研究丰富立法形式等。故整个文段都在围绕“加快完善中国特色社会主义法律体系”进行论述，指出不仅要推动条件成熟的立法领域法典编纂工作，还要丰富立法形式。第二步，对比选项。D 项“治国无其法则乱，守法而不变则衰”意思是治理国家若没有法度就会混乱，固守法度若不知变革就会衰落。既强调“法”对于治国的重要性，又强调要适时地进行变革，符合上述语境。A 项“法者，天下之准绳也”意思是法律是天下人做事应当遵循的原则、标准。强调法律是共同的准则，与文段意思不符，排除A 项。B 项“国皆有法，而无使法必行之法”意思是国家都是有法律的，但是没有能保证这些法律一定得到遵遁的法。强调要把规范深植于每个人的心中，成为自觉，就是需要培育法治精神。与文段意思不符，排除B 项。 C 项“立善防恶谓之礼，禁非立是谓之法”意思是确立善的防止恶的称之为礼仪，禁止错误的确立正确的称之为法律。指出什么是法律，不符合文意，排除C 项。因此，选择D 选项。拓展文段出处：中国青年报《坚定不移走中国特色社会主义法治道路为全面建设社会主义现代化国家提供有力法治保障》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-042","paperId":"gk2022-xz","num":42,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）依托数字文化资源进行新文旅业态和产品的开发，是文物古迹焕发新活力、增强吸引力的重要手段。但科技应用应有边界，即________________。一旦两者有冲突，理应遵循保护优先原则。打造沉浸式场景，要借助声电光影，在将静态的、单一的遗产地场景，转化为多维、立体、丰富的体验场景，其目的无可非议。但沉浸式场景的构建多会涉及器材、设施、设备的导入和搭建，即使只存在小概率风险，也须慎重。鉴于此，文化遗产地的沉浸式游览，可考虑在遗产地保护范围之外，打造不依托文物本体的沉浸式体验项目。填入画横线部分最恰当的一项是：","options":["不能对资源本身及其价值造成破坏或产生不良影响","需坚持适度开发和可持续性发展策略","要把握好真实性和娱乐性之间的尺度","不能过度强调沉浸式体验而忽略文化内涵"],"answer":"A","explanation":"第一步，分析横线上下语境。横线位于文段中间，说明需要起到承上启下的作用。横线前有个“即”字，说明横线处的内容也应体现“科技应用应有边界”，以及根据横线后面的“一旦两者有冲突，理应遵循保护优先原则”，进一步可推出横线所填内容应强调文物开发不能对文物本身或价值造成破坏。第二步，对比选项。只有A 选项符合要求。B 项“可持续性发展”、C 项“真实性和娱乐性之间的尺度”、D 项 “文化内涵”均为无中生有，排除。因此，选择A 选项。拓展文段出处：中国青年报《当文物古迹遇上沉浸式业态开发：边界何在，能否两全》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-043","paperId":"gk2022-xz","num":43,"year":2022,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"（单选题）________________，最能代表一个时代的风貌，最能引领一个时代的风气。“文变染乎世情，兴废系乎时序。”在欧洲文艺复兴运动中，但丁、彼特拉克、薄伽丘、达芬奇、拉斐尔、米开朗琪罗、蒙田、塞万提斯、莎士比亚等文艺巨人，发出了新时代的啼声，开启了人们的心灵。在谈到文艺复兴运动时，恩格斯说，这“是一个需要巨人而且产生了巨人——在思维能力、热情和性格方面，在多才多艺和学识渊博方面的巨人的时代”。在我国发展史上，包括文艺在内的文化发展同样与中华民族发展紧紧联系在一起。先秦时期，我国出现了百家争鸣的兴盛局面，开创了我国古代文化的一个鼎盛期。 20 世纪初，在五四新文化运动中，发端于文艺领域的创新风潮对社会变革产生了重大影响，成为全民族思想解放运动的重要引擎。填入横线部分最恰当的一项是：","options":["文艺是铸造灵魂的工程","文化是民族生存和发展的重要力量","文艺是时代前进的号角","文艺创新是与时代脉搏同频共振的"],"answer":"C","explanation":"第一步，分析横线处的下文语境。横线位于文段的开头，应该起到引起下文、统领全文的作用。后文分别列举了欧洲文艺复兴、我国百家争鸣以及近代五四运动三次文艺运动，都重点强调文艺对时代产生了重大影响。话题词为“文艺”和“时代”。第二步，对比选项。C 项是对上述语境内容的总结，强调了文艺对时代的引领作用。A 项未提到“时代”，排除。 B 项话题词不符，应是“文艺”而非“文化”。D 项为强干扰项，文段强调的是文艺的“引领”作用，而非“同步性”，另外文段的话题词为“文艺”而不是“文艺创新”，排除。因此，选择C 选项。拓展文段出处：光明日报《文变染乎世情，兴废系乎时序》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-044","paperId":"gk2022-xz","num":44,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）法律和道德都是具有一定约束性的社会规范，都能发挥规范人们行为的功能，但发挥作用的具体机制不同。法律更注重以国家的外在强制力保障规则实施，主要是一种他律。道德虽然也通过社会评价等方式产生外部约束作用，但更强调自律，通过人们内心的价值认同来感染人心、凝聚共识，实现个体对于道德规范的自愿遵从。现代法治强调良法善治，实现这一目标离不开道德作用的发挥。道德为法律创制提供伦理基础，为法律的正当性提供评判标准，也为法律实施提供道义支持，对于法治体系的建立和运行具有重要支撑作用。这段文字意在说明：","options":["良法善治的实现需要道德“保驾护航”","道德规范是现代法治精神的重要来源","法律和道德发挥作用的机制不同","法治和德治互为表里，不可偏废"],"answer":"A","explanation":"第一步，分析文段。文段开头先说明虽然法律和道德都是具有一定约束性的社会规范，都能发挥规范人们行为的功能，但二者所注重的点是不同的，前者注重他律，后者注重自律。紧接着引出重点句“现代法治强调良法善治，实现这一目标离不开道德作用的发挥”，即“良法善治的实现离不开道德作用的发挥”。后文具体分析道德对于法治的作用。故文段重点道德作用对于实现良法善治起到了不可替代的作用。第二步，对比选项。A 项为重点句的同义替换，符合文段意图。因此，选择A 选项。拓展 B 项：“重要来源”表述片面，非重点。C 项：属于文段前半部分内容，非重点。D 项：表述宽泛、无中生有。文段出处：人民网《以道德滋养法治精神（思想纵横）》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-045","paperId":"gk2022-xz","num":45,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）长期以来，人民调解员队伍以兼职为主。兼职人民调解员的优势是容易发挥基层社会各行各业的力量，国家投入人力成本和财政成本比较低。但同时，由于兼职调解员在时间精力、专业素质等方面受限，制约了调解工作的有效开展。一方面，矛盾纠纷主体更加多元、类型更加多样，调解难度不断加大；另一方面，人民群众的权利意识、法治意识不断增强，对矛盾纠纷化解质效提出了更高要求。这些都需要人民调解员投入更多的时间和精力，具备较高的政策水平、法律素养和专业知识。这段文字接下来最可能说的是：","options":["兼职人民调解员的局限性","人民调解制度的发展过程","建立人民调解员专职队伍的举措","人民调解员应当具备的专业素养"],"answer":"C","explanation":"第一步，分析文段，重点关注尾句。文段前两句介绍了人民调解员队伍的现状和兼职人民调解员的优势，接着通过转折词“但”引出了兼职人民调解员的不足之处，最后进行总结，即社会需要更专业的人民调解员。故文段接下来最可能还会沿着这个话题继续说下去。第二步，对比选项。C 项符合要求。A、D 项文段已提及，下面不会再重复赘述，排除。B 项与文段尾句话题不一致，排除。因此，选择C 选项。拓展文段出处：光明网《人民调解：用法理情守护千家万户的安宁祥和》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-046","paperId":"gk2022-xz","num":46,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）当技术的进步逐渐拨开传统“战争迷雾”之时,网络和电磁等虚拟空间因素也给侦察情报带来了相应的挑战。一方面,网络空间的开放互联,庞大的用户群体、被动的防御特性,未知的安全漏洞,使得网络攻击的隐蔽性不断增强、难以防范。同时,情报的处理,分发离不开安全稳定的网络支撑。另一方面,战场上的无人化侦察装备种类繁多,特别是重点区域和要害目标附近,用频装备数量庞大,导致局部电磁拥挤,容易出现频率自扰现象。而且交战双方极易互相实施电磁干扰和压制,使得无人化侦察装备的稳定运行遭受严峻考验。这段文字主要介绍了：","options":["虚拟空间因素对侦察情报工作的影响","新形势下驱散传统“战争迷雾”的关键","无人化侦察装备升级引发的连锁反应","侦察情报技术信息化进程中遭遇的困境"],"answer":"A","explanation":"第一步，分析文段。文段开头说网络和电磁等虚拟空间因素给侦察情报带来挑战。一方面，网络攻击的隐蔽性难以防范，存在安全隐患，不能给情报的处理提供安全网络的支撑。解释了网络虚拟空间对侦察情报的影响；另一方面，战场上的无人化侦察装备容易发生频率自扰现象，而且双方存在电磁干扰、压制等问题，使得无人化侦察受影响。解释了电磁虚拟空间对侦察情报的影响。因此文段是“总—分”的行文结构，开篇提出观点，为文段的主旨句，后面分别从网络对侦察情报的影响和电磁对侦察情报影响两个角度进行阐述。第二步，对比选项。A 项虚拟空间因素对侦察情报工作的影响，和主旨句“网络和电磁等虚拟空间因素对侦察情报的影响正急剧增大”意思一致。因此，选择A 选项。拓展 B 项：“战争迷雾”非文段重点。C 项：对应文段的一个分论点，片面。D 项：缺少重点话题“虚拟空间因素”，排除。文段出处：参考网《无人化装备给侦察情报带来的新变化》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-047","paperId":"gk2022-xz","num":47,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）都察院是明代设立的重要监察机构,为风宪耳目之官,总负正风肃纪之责。明代对其所属监察御史的选用要求,明显不同于一般的官吏。除了普遍性的清正廉洁这一操守要求外,还十分看重其“介直”“骨鲠”的个性。在任职资格上,明英宗正统年间,开始打破了新仕进士不得除授御史之职的规定。明中叶后,监察御史选用“多不得人”,管理御史的“宪规”“条约”成为空文,御史不断参与到朝廷的政争之中,使明代官僚体系的有效监督、净化能力不断削弱,这是明代政治日趋腐朽、不断走向衰败的重要原因。这是一篇论文的摘要,论文中最不可能论述哪项内容？","options":["监察御史选用资历的演化","监察成效对明代政治走向的影响","都察院的设置及监察御史品秩的演化","明代监察法规在后世的延续及价值分析"],"answer":"D","explanation":"第一步，本文为论文摘要，接下的论文应该围绕摘要内容讲述。分析摘要部分，文段先提到督察院是明代设立的重要监察机构以及督察院的职责，接下来提到监察御史的选用要求，最后提到明中叶后，御史不断参与到朝廷的政争之中，监察作用减弱，使明代走向衰落。第二步，辨析选项。A 项对应“在任职资格上，明英宗正统年间，开始打破了新仕进士不得除授御史之职的规定， ……成为空文”，在论文中可能被提及。B 项对应“御史不断参与到朝廷的政争之中，……这是明代日趋腐朽、不断走向衰败的重要原因”，在论文中可能被提及。C 项对应“督察院是明代设立的重要监察机构，……成为空文”，在论文中可能被提及。D 项“后世”这一话题，偏离了摘要主要围绕“明代”这一时期来讲，话题不符，不可能被提及。因此，选择D 选项。拓展文段出处：中国社会科学网《耳目之坏:从御史选用制度的演化看明代政治走向》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-048","paperId":"gk2022-xz","num":48,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）约25 亿年前的“大氧化事件”是指大气中的游离氧含量突然增加，这一事件的具体原因迄今尚不得而知，但有若干种假说能加以解释，其中主流说法认为，当时破坏氧气的甲烷细菌所依赖的镍元素急剧减少，而海藻类植物通过光合作用使得地球上的氧气迅速增加，大气中的含氧量不断提升，正是这一事件使地球上矿物的成分发生了变化，也使动物在地球上有了生存可能。而在“大氧化事件”之前，地球表面虽然已出现了海洋和陆地，但是空气中依旧氧气稀薄，因此当时的地球是光秃秃的，毫无绿意。关于“大氧化事件”，文中没有提及：","options":["对发生原因的主流解释","对地球生态系统的影响","事件发生前的地球面貌","能提供佐证的岩石样本"],"answer":"D","explanation":"第一步，阅读文段，将选项与原文一一对应。第二步，对比选项。A 项“对发生原因的主流解释”对应“其中主流说法认为……”，原文提及过。B 项“对地球生态系统的影响”对应“正是这一事件使地球上矿物……”，原文提及过。C 项“事件发生前的地球面貌”对应尾句，原文提及过。D 项“能提供佐证的岩石样本”属于无中生有，原文未提及。因此，选择D 选项。拓展文段出处：《十亿年后地球大气将重回低氧水平》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-049","paperId":"gk2022-xz","num":49,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）①强调严格执法，让违法者敬法畏法，但绝不是暴力执法、过激执法，要让执法既有力度又有温度 ②要推进严格规范公正文明执法，提高司法公信力 ③同时，一些地方运动式、“一刀切”执法问题仍时有发生，执法不作为问题突出 ④近年来，我们整治执法不规范、乱作为等问题，取得很大成放 ⑤要加强省市县乡四级全覆盖的行政执法协调监督工作体系建设，强化全方位、全流程监督，提高执法质量 ⑥行政执法工作面广量大，一头连着政府，一头连着群众，直接关系群众对党和政府的信任、对法治的信心将以上6 个句子重新排列，语序正确的一项是：","options":["①⑥③②④⑤","⑥②④③①⑤","④③②⑤⑥①","②③⑥⑤④①"],"answer":"B","explanation":"第一步，观察选项特征，确定首句。①②论述的都是“面对违规执法”的方法，不适合做首句。④⑥都为背景介绍，话题的引入，适合置于首句，排除A 项和D 项。第二步，对比B 项和C 项。④③都已捆绑，④交代背景引出话题，③提出执法不作为的问题。①⑤为解决③的对策。所以④③和①⑤衔接。排除C 项。因此，选择B 选项。拓展文段出处：《坚定不移走中国特色社会主义法治道路，为全面建设社会主义现代化国家提供有力法治保障》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-050","paperId":"gk2022-xz","num":50,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）①除萤科于白垩纪缅甸琥珀及一些新生代地层中有化石记录外，其他类群化石此前尚未被报道过 ②能够生物发光的叩甲总科物种大部分归属于萤类，包括萤科、光萤科、雌光萤科及华光叩甲科 ③日前，科研人员在缅甸琥珀中发现了叩甲总科的新科——白垩光萤科 ④在陆生动物中，能进行生物发光的物种大都属于鞘翅目昆虫，其中叩甲总科最多见 ⑤萤类分支中除华光叩甲科，其他物种身体均较为柔软，部分类群的雌性还具有幼态持续现象，也正因此其物种很难被保存为化石 ⑥这一新类群的发现，对于研究叩甲总科中生物发光的起源与演化具有重要意义将以上6 个句子重新排列，语序正确的一项是：","options":["④②⑤①③⑥","④⑤①②⑥③","③⑥④⑤②①","③⑤④①⑥②"],"answer":"A","explanation":"第一步，观察选项特征，确定首句。选项分别以③和④作为首句，③句有时间词“目前”，主要论述了科研人员在缅甸琥珀中发现了叩甲总科的新科——白垩光萤科。④句引出“叩甲总科”的话题，按照先后顺序，应当先引出“叩甲总科”的话题，再引出叩甲总科的新科——白垩光萤科。故④句更适合作首句。排除C 项和D 项。第二步，观察题干找关联。⑥句中出现了指代词“这”，强调这一新类群发现的重要意义，故该句指代对象应出现“新类群”，只有③符合，故③⑥捆绑，排除B 项。因此，选择A 选项。拓展文段出处：中国高科技《中科院等科学家合作研究发现一亿年前“萤火虫”》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-051","paperId":"gk2022-xz","num":51,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）①发展是硬道理，而水则是硬约束 ②自古以来，我国基本水情一直是夏汛冬枯、北缺南丰，水资源时空分布极不均衡 ③以黄河为例，黄河水资源总量不到长江的7%，黄河流域人均水资源占有量仅为全国平均水平的27% ④水资源格局，影响和决定着经济社会发展格局 ⑤党和国家实施南水北调工程建设，就是要对水资源进行科学调剂，促进南北方均衡发展、可持续发展 ⑥在京津所在的海河流域，由于经济社会快速发展和人口不断增加，华北地区地下水长期超采，形成世界上最大、最深的“漏斗区” 将以上6 个句子重新排列，语序正确的一项是：","options":["①⑤⑥③②④","②③④⑤⑥①","④②③⑥①⑤","⑤④①②③⑥"],"answer":"C","explanation":"第一步，对比选项，确定首句。从⑤论述的“南水北调工程建设就是要对水资源进行科学调剂”，可知此句前应有水资源调剂的原因或必要性，不适合做首句。排除D 项。第二步，对比剩余选项。③⑥两句话进行话题捆绑，论述“水资源不均衡”，排除B 项。对比④和⑤，④说的是 “水资源格局影响经济发展”，属于“水资源调剂”的原因，而⑤属于做法、对策。所以⑤更适合做尾句，排除 A 项。因此，选择C 选项。拓展文段出处：求是网《南水北调事关战略全局、长远发展、人民福祉》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-052","paperId":"gk2022-xz","num":52,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）改革开放以来，我国人才流动都是由中小城市向中心城市不断聚集，城市的“聚集效应” 大于“扩散效应”，包括人才在内的各种资源源源不断地向城市特别是大城市涌入，不过，如今人才向一线城市聚集的趋势正在悄然改变，人才逐渐“下沉”的迹象日益明显。如果说过去人才向一线城市聚集是为追求更高收入，更好发展前景，那么现在二三线城市在这些方面与一线城市的差距正在逐渐缩小，相应的人才流动多元化也开始出现。这段文字接下来最可能讲的是：","options":["城市“扩散效应”引发的连锁反应","一线城市避免人才流出的举措","人才“下沉”出现的具体原因","城市“聚集效应”出现的背景条件"],"answer":"C","explanation":"第一步，分析文段。文段介绍了改革开放以来的“聚集效应”到如今人才“下沉”的转变。紧接着通过段尾“那么”引出“二三线城市与一线城市差距缩小，人才流动多元化开始出现”。那么接下来要说的就是为什么会出现这种情况，即解释原因。第二步，对比选项。C 项为人才“下沉”出现的具体原因，符合题意。因此，选择C 选项。拓展 A 项：“连锁反应”应该在解释清楚为何出现“扩散效应”后的内容。B 项和D 项：论述的是模式转变前的“聚集效应”，非重点。文段出处：环球网《“人才下沉”开拓更大发展空间》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-053","paperId":"gk2022-xz","num":53,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）福厦高铁是我国第一条真正意义上的海洋环境下运行的高速铁路。湄洲湾跨海大桥是其中最长的海域施工区段，也是全线重点控制性工程，其主桥设计为预应力混凝土连续刚构矮塔斜拉桥。索鞍是斜拉桥施工中的关键环节，施工精度高，控制难度大。湄洲湾跨海大桥位于曲线段上，海域风大浪急，斜拉桥主塔索鞍定位困难。为达到主跨通航要求，主墩承台均需埋入河床面以下，这给围堰施工作业增加了难度。施工人员克服海上恶劣天气的影响，采取预埋劲性骨架、增加控制点位等手段实现了索鞍精确定位，有效地解决了索鞍定位控制难题。这段文字主要介绍了湄洲湾跨海大桥：","options":["对福厦高铁贯通的重要意义","围堰施工中面临的复杂环境","索鞍定位的难点及解决措施","使用矮塔斜拉索结构的原因"],"answer":"C","explanation":"第一步，分析文段。文段先介绍了福厦高铁的湄洲湾跨海大桥为全线重点工程，主桥设计为预应力混凝土连续刚构矮塔斜拉桥。紧接着介绍了索鞍是斜拉桥施工的关键环节，但是索鞍定位存在困难。最后提出了施工人员采取了何种措施来解决索鞍定位难的问题，即采取预埋劲性骨架、增加控制点位等手段实现了索鞍精确定位，有效地解决了索鞍定位控制难题。文段为“分—总”结构。第二步，对比选项。C 项为主旨的概括归纳项，符合文段主要内容。因此，选择C 选项。拓展 A 项：只是文段第一句的概括，非重点。B 项：为索鞍定位困难的问题，非重点。D 项：文段并没有在解释矮塔斜拉索结构的原因，且未提到“索鞍定位”的话题。文段出处：科技日报《这条跨海高铁创多项“中国造”之最》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-054","paperId":"gk2022-xz","num":54,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）回顾法律史，从法的完善来看“由习惯到习惯法再到成文法”是法演进的一般规律；从整个法体系看民商事立法最早进行了习惯考量。我国民事立法也有考量习惯的传统，《大清民律草案》等均开宗明义地阐明了习惯要素的地位；新中国成立后民事立法中的制度和政策要素不断增强，习惯要素逐渐式微；当下，伴随依法治国的深入推进，在《民法典》编纂过程中，直接源于生活并反映生活的社会习惯要素得以强调，如在规定处理民事纠纷的依据时，就直接说明“法律没有规定的，可以适用习惯”，并将习惯的内涵从《合同法》中的“交易习惯”拓展到“民事习惯”范畴。这段文字主要介绍：","options":["我国民事立法中对习惯要素的重视与考量","习惯要素在我国《民法典》中的具体体现","我国民事立法发展与演进的一般规律","习惯要素作为中西方立法来源的传统"],"answer":"A","explanation":"第一步，分析文段。开篇从法的完善和整个法系两个维度说明习惯和立法的关系。后面从我国民事立法考量习惯的传统维度进行证明。《大清民律草案》立法开篇阐明习惯要素的地位。新中国成立后，民事立法中习惯要素式微。当下《民法典》编纂过程中强调社会习惯。所以本题是总分结构，强调立法中习惯的作用。第二步，对比选项。A 项符合立法和习惯两者之间的关系。因此，选择A 选项。拓展 B 项：习惯要素和《民法典》之间的关系，是分论点中解释说明其中的一部分，所以排除。C 项：没有体现法律和习惯两者之间的关系，所以排除。D 项：西方立法在文段中没有体现，所以排除。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-055","paperId":"gk2022-xz","num":55,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）隔扇是我国古代的一种门，用于分隔室内外或室内空间。隔扇门既可联通内外，又能分隔空间，同时可以透光、通风等，因而具有门、窗、墙的功能。隔扇门在唐代已经出现，宋代以后大量采用，用于朝向内院的房屋立面墙，分隔房屋内部空间。如太和殿隔扇，主要由抹头（横向的木条）、上部的隔芯、下部的裙板组成。其中，隔芯在隔扇中占用的比例最大。隔芯部分的纹饰稀疏有致，为糊纸裱绢提供支点，同时起到通风、采光的作用。由于隔芯会采取不同形式的纹饰，因而这部分是最能体现隔扇艺术特色的部分，是装饰的重点所在。关于隔扇，这段文字未提及：","options":["制作流程","出现时间","基本功能","主要材质"],"answer":"A","explanation":"第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项原文未提及，原文中未说隔扇是如何制作的，制作流程包括哪些等。B 项对应“据记载, 隔扇门在唐代已经出现，宋代以后大量采用。”C 项对应“隔扇门既可联通内外,又能分隔空间，还可透光、通风，因而兼具门、窗、墙的功能。”D 项对应“隔扇主要由抹头（横向的木条）……隔芯部分的纹饰稀疏有致,为糊纸或裱绢提供支点”。可以知道隔扇使用材质包括木材、纸、绢等。因此，选择A 选项。拓展文段出处：中国科学技术馆《紫禁城古建筑门窗的运用智慧》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-056","paperId":"gk2022-xz","num":56,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）兵法中说“必胜之术，合变之形，妙在于乘”，强调作战中乘敌之隙的重要性。战场上激烈角逐中，战机从来不是无缘无故就有的，敌之隙不可能轻而易举地得到，它是双方指挥员进行谋略博弈的结果，离不开指挥员发挥主观能动性去创造，离不开指挥员运用各种手段去促成。信息化战争中，要充分运用谋略、善用战术技术手段，灵活运用隐真示假、声东击西等方法，诱惑敌人产生错觉，产生部署失误、行动失当等“隙”，使有准备之敌变成无准备之敌、使集中之敌成为分散之敌、使占地利之敌变成运动之敌、使士气旺盛之敌变成士气低落之敌、使难打之敌变成好打之敌，并伺机击敌，达成作战胜利。最适合做这段文字标题的是：","options":["科学预见，敢于乘敌之隙","沉着冷静，精于辨敌之隙","主动作为，工于造敌之隙","运用谋略，善于察敌之隙"],"answer":"C","explanation":"第一步，分析文段。文段通过引用古语指出乘敌之隙的重要性，紧接着指出“敌之隙”不是轻易得到的。进而给出要指战员主动创造、促成。最后结合当下信息化战争，说明具体如何主动创造、促成敌之隙。由此可见，文段核心意思就是如何创造、促成敌之隙。第二步，对比选项。C 项“主动作为，工于造敌之隙”，是对文段重点的同义替换，适合做文段标题。因此，选择C 选项。拓展 A 项：“预见”不是创造，并且文中也体现不出“敢于”的意思。B 项：“辨敌之隙”是已经存在“敌之隙”，和文中创造不相符合。D 项：“运用谋略”文中有提及，但是“察敌之隙”没有体现出创造、促成敌之隙的意思。文段出处：解放军报《妙在乘敌之隙》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-057","paperId":"gk2022-xz","num":57,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）客观而言，在脱贫攻坚战中，虽然一些地方探索出了农民入股合作社当股东分红的经营模式，但由于农民是个体分散入股，在合作社中也只是小股东，各类决策经营权都由合作社说了算，农民的主体地位和作用发挥不明显，积极性也不是很高。改变这种状况，需要集体经济组织出面，整合各类资源要素，比如各类“三农”资金、土地资源以及其他闲置资源等，以集体经济组织的名义加入到专业的合作社，从而增加农民的话语权和经营决策权，更有效地维护农民的利益。这段文字意在说明：","options":["农民在合作社中积极性不高的原因","当前巩固脱贫攻坚成果的主要途径","专业合作社在整合资源要素中的作用","在合作社中引入集体经济组织的意义"],"answer":"D","explanation":"第一步，分析文段。文段先提出在脱贫攻坚过程中农民入股合作社当股东存在的问题，接下来通过“改变这种状况，需要……”提出解决对策，即“集体经济组织出面整合资源要素的重要性”，又通过“比如”举例论证这一对策。第二步，对比选项。D 项为对策的概括归纳项，符合文段意图。因此，选择D 选项。拓展 A 项：是对问题的原因分析，非重点。B 项：“巩固脱贫攻坚”偏离文段话题，文段重点话题是“集体经济组织” 。C 项：“专业合作社”为例子之一，非重点。文段出处：中国甘肃网《乡村振兴要突出合作社这个支撑点》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-058","paperId":"gk2022-xz","num":58,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）对于生活在浅海的硬骨鱼类来说，鱼鳔非常重要，可以帮助其调整浮力，从而实现上浮或下潜。但是对于深海鱼来说，充满气的鱼鳔像是脆弱的气球，在外部巨大水压的挤压下，会炸成碎片。因此，很多深海鱼在进化过程中“舍弃”了鱼鳔这个“危险”的部件，转而依靠某些脂类提供浮力。相比于浅海中的鱼，深海鱼的骨骼和肌肉含量都比较少，脂质和胶质相对较多。此外，深海鱼骨骼中软骨的比例也远高于浅海鱼。对于深海鱼来说，这些都是为了适应深海生活所作出的必要的“妥协”。毕竟相比于骨骼和肌肉，脂质和胶质能更好地帮助鱼类对抗巨大的压力。最适合做这段文字标题的是：","options":["深海鱼竟是“软骨头”","精通以柔克刚的深海鱼","深海压力，无法承受之痛","抗压，从鱼鳔的“断舍离”开始"],"answer":"D","explanation":"第一步，分析文段。文段前三句在说明为什么很多深海鱼在进化的过程中“舍弃”了鱼鳔，第四句、第五句说明了深海鱼的骨骼、肌肉、软骨等为什么与浅海鱼不同。第六句进行总结，这些都是为了对抗深海巨压所作出的必要的“妥协”。文段重点在强调深海鱼为适应深海巨大的压力做出的一系列进化。第二步，对比选项。D 项最符合要求，“抗压”对应深海鱼进化的目的，“从鱼鳔的‘断舍离’开始”对应深海鱼做出的一系列进化。A 项“软骨头”片面，涵盖不了前面的“舍弃鱼鳔”排除。B 项“以柔克刚”文中无从体现，排除。C 项“无法承受”，与文段相悖，排除。因此，选择D 选项。拓展文段出处：《鱼类能顶住深海压力，可不是因为心态好》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-059","paperId":"gk2022-xz","num":59,"year":2022,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"（单选题）科学家发现，人类基因组里除了与编码蛋白质有关的特异性DNA 序列之外，还有相当一部分重复DNA 序列。基因测序结果表明，在同一人类个体的基因组中，这些序列有的重复几次，有的重复上万次；其中既有长达20 万个碱基对的片段重复，也包括短的简单序列；重复的基本单位有时只有一个碱基，有时包含几个碱基。它们加起来甚至超过了人类基因组的一半。在过去，研究者认为这些重复序列不过是DNA 复制过程中的副产物，然而随着认识的深入，他们开始意识到那些曾被认为是毫无用处的重复DNA 序列，对基因表达和决定生物性状至关重要。这段文字接下来最可能介绍：","options":["不同物种的重复DNA 序列有何差异","DNA 序列在重复的过程中遵循哪些规律","重复DNA 序列如何影响生物基因表达","特异性DNA 序列在基因表达中所占的比例"],"answer":"C","explanation":"第一步，快速浏览文段，判别文段话题落脚点。开篇说明人类基因组里除了特异性DNA 序列外，还有相当一部分重复DNA 序列。话题继续推进说明重复DNA 的形态和占比。最后强调重复DNA 对基因表达和决定生物性状至关重要。文段后半部分的话题是“强调重复DNA 序列对基因表达和决定生物性状至关重要”。第二步，对比选项。C 项强调重复DNA 对基因表达的具体影响，话题一致，可以衔接上文。因此，选择C 选项。拓展 A 项：“不同物种”在文段中没有体现，所以排除。B 项和D 项：话题词为“DNA 序列”“特异性DNA 序列” 和“重复DNA 序列”不一致，排除。文段出处：《重复的基因：你我都是复读机》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-060","paperId":"gk2022-xz","num":60,"year":2022,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"（单选题）研究发现，人体存在一种细胞清洁过程，被称为分子伴侣介导的自噬（CMA）。CMA 和阿尔兹海默症之间存在动态的相互作用。CMA 的效率会随着人类年龄的增长而下降，导致人体内有害蛋白质积累成不溶性团块，形成有毒蛋白质聚集体，从而损害细胞，导致阿尔兹海默症症状的出现。而早期的阿尔兹海默症也会损害CMA，使CMA 活性显著降低。为此，研究人员开发出了一种新药，该药物通过提高 CMA 关键成分的受体水平来重振CMA 效率，从而改善小鼠记忆力，显示出治疗阿尔兹海默症的潜力。根据这段文字，以下说法正确的是：","options":["新药物能够减缓阿尔兹海默症的发展","新药物的功效是通过提高CMA 效率来实现的","阿尔兹海默症抑制了CMA 的发生","抑制有害蛋白质积累能够提高记忆力"],"answer":"B","explanation":"第一步，分析文段，将选项与原文一一对应。第二步，辨析选项。A 项对应尾句“为此，研究人员开发出了一种新药，该药物通过提高CMA 关键成分的受体水平来重振CMA 效率，从而改善小鼠记忆力，显示出治疗阿尔兹海默症的潜力”，仅是“有治疗阿尔兹海默症的潜力”而非“能够减缓阿尔兹海默症的发展”，A 项曲解文意，说法错误，排除。B 项对应后半部分“而早期的阿尔兹海默症也会损害CMA，使CMA 活性显著降低。为此，研究人员开发出了一种新药，该药物通过提高 CMA 关键成分的受体水平来重振CMA 效率，从而改善小鼠记忆力，显示出治疗阿尔兹海默症的潜力”，说法正确。C 项对应“而早期的阿尔兹海默症也会损害CMA，使CMA 活性显著降低”，而非“阿尔兹海默症抑制了 CMA 的发生”，曲解文意，排除。D 项“抑制有害蛋白质积累能够提高记忆力”文中并无论及，无中生有，排除。因此，选择B 选项。拓展文段出处：网易《Cell：重磅！清除脑细胞中“垃圾”，逆转阿尔茨海默关键症状》","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-061","paperId":"gk2022-xz","num":61,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）某单位办事大厅有3 个相同的办事窗口，2 天最多可以办理600 笔业务，每个窗口办理单笔业务的用时均相同。现对该办事大厅进行流程优化，增设2 个与以前相同的办事窗口，且每个办事窗口办理每笔业务的用时缩短到以前的2/3。问优化后的办事大厅办理6000 笔业务最少需要多少天？","options":["8","10","12","15"],"answer":"A","explanation":"第一步，本题考查基础计算问题。第二步，3 个窗口，2 天可办理600 笔业务，每个窗口每天可办理600÷2÷3=100 笔业务。每个窗口时间缩短到以前的，每天可办理100÷ =150 笔业务，增设2 个窗口，共5 个窗口，每天可办理150×5=750 笔业务。优化后的办事大厅办理6000 笔业务最少需要6000÷750=8 天。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-062","paperId":"gk2022-xz","num":62,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）张和李2 名社区工作者上门统计某小区内住户的新冠疫苗接种情况，两人各负责1 栋住宅楼，每访问1 户居民均需要5 分钟。李因处理公文比张晚出发一段时间。已知14:00 时两人共访问63 户，15:00 时张访问的户数是李的2 倍。问李访问完50 户居民是在什么时候？","options":["16:30","16:45","17:00","17:15"],"answer":"B","explanation":"第一步，本题考查基础应用题，使用方程法求解。第二步，14:00—15:00 共1 个小时，张和李两人每访问1 户需要5 分钟，那么这1 个小时之内两人都访问了12 户。设14:00 时李访问了x 户，则张访问了（63-x）户，根据15:00 时张访问的户数是李的2 倍，有方程63- x+12=2（x+12），解得x=17 户，那么15:00 时李共访问了29 户，距离50 户还差21 户，需要再用时 5×21=105 分钟=1 小时45 分钟，到时时间为16:45。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-063","paperId":"gk2022-xz","num":63,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）李某骑车从甲地出发前往乙地，出发时的速度为15 千米/小时，此后均匀加速，骑行25%的路程后速度达到21 千米/小时。剩余路段保持此速度骑行，总路程前半段比后半段多用时3 分钟。问甲、乙两地之间的距离在以下哪个范围内？","options":["不到23 千米","在23—24 千米之间","在24—25 千米之间","超过25 千米"],"answer":"D","explanation":"第一步，本题考查行程问题。第二步，总路程前半段比后半段多用时3 分钟，根据后的路程为匀速运动，可知总路程的前，比最后多用时3 分钟。根据前路程为匀加速运动可知平均速度为 =18 千米/小时，设前路程用时为t 小时，则最后路程用时为t－小时，列方程18t=21（t－），解得t= ，则前路程为18× =6.3 千米，全程为6.3×4=25.2 千米。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-064","paperId":"gk2022-xz","num":64,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）某水果种植特色镇创办水果加工厂，从去年年初开始通过电商平台销售桃汁、橙汁两种产品。从去年2 月开始，每个月桃汁的销量都比上个月多5000 盒，橙汁的销量都比上个月多2000 盒。已知去年第一季度桃汁的总销量比橙汁少4.5 万盒，则去年桃汁的销量比橙汁：","options":["多不到5 万盒","少不到5 万盒","多5 万盒以上","少5 万盒以上"],"answer":"B","explanation":"第一步，本题考查数列问题。第二步，设去年第一个月的桃汁销量为x 万瓶，橙汁销量为y 万瓶。桃汁、橙汁的每月销量都成等差数列，则第一个季度桃汁的销量为（x+0.5）×3，橙汁的销量为（y+0.2）×3，由题意（y+0.2）×3－（x+0.5）×3=4.5，有y－x=1.8。根据等差数列求和公式，全年桃汁总销量为[x+（x+0.5×11）]×12÷2=6（2x+5.5）；橙汁总销量为[x+（x+0.2×11）]×12÷2=6（2y+2.2），两者之差为12（x－y）+33－13.2=－1.8（万盒）。桃汁比橙汁少不到5 万盒。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-066","paperId":"gk2022-xz","num":66,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）为降低碳排放，企业对生产设备进行改造，改造后日产量下降了10%，但每件产品的能耗成本下降了50%，其他成本和出厂价不变的情况下每天的利润提高10%。已知单件利润=出厂价-能耗成本 -其他成本，且改造前产品的出厂价是单件利润的3 倍，则改造前能耗成本为其他成本的：","options":["不到1/4","1/4~1/3 之间","1/3~1/2 之间","超过1/2"],"answer":"B","explanation":"第一步，本题考查经济利润问题。第二步，根据题干中的百分数进行赋值，赋值改造前的日产量、能耗成本分别为10 和2，则改造后的日产量和能耗成本则为9 和1。假设其他成本为x，单件利润为y，则出厂价为3y，改造前，y=3y-2-x，改造后利润提高了 10%，即9（3y-1-x）=1.1×10×y=1.1×10×（3y-2-x），解方程可得x=7，y=4.5。改造前能耗成本与其他成本的比值为2/7≈28.6%，在B 选项的范围内。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-067","paperId":"gk2022-xz","num":67,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）甲地在丙地正西17 千米，乙地在丙地正北8 千米。张从甲地、李从乙地同时出发，分别向正东和正南方向匀速行走。两人速度均为整数千米/小时，且1 小时后两人的直线距离为13 千米，又经过 3 小时后两人均经过了丙地且直线距离为5 千米。已知李的速度是张的60%，则张经过丙地的时间比李：","options":["早不到10 分钟","早10 分钟以上","晚不到10 分钟","晚10 分钟以上"],"answer":"D","explanation":"第一步，本题考查基本行程类。第二步，已知李的速度是张的60%，可设张的速度为5v 千米/小时，李的速度为3v 千米/小时，两人1 个小时的路程分别为5v 千米、3v 千米，进而可得A 点到丙地的距离为（8-3v）千米，B 点到丙地的距离为（17-5v）千米，又已知AB=13 千米，根据常用勾股数（5,12,13）不难判断8-3v=5，17-5v=12，可得v=1 千米/小时，那么张和李的速度分别为5 千米/小时和3 千米/小时，张从出发到丙地共用时17÷5=3.4 小时=3 小时24 分钟，李从出发到丙地共用时8÷3=160 分钟=2 小时40 分钟，张经过丙地的时间比李要晚44 分钟。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-069","paperId":"gk2022-xz","num":69,"year":2022,"region":"国家","module":"数量关系","sub":"数学运算","stem":"（单选题）某件商品的定价为成本的1.5 倍，如果在降价30 元/件的基础上再打八折，则销售5 件这件商品的利润比原价销售1 件时多130 元。问用以下哪种折扣销售时，1.5 万元能买到的件数正好比原价销售时多4 件？","options":["先降价50 元/件再打八折","先打九折再降价50 元/件","降价150 元/件","打八五折"],"answer":"B","explanation":"第一步，本题考查经济利润问题，属于基础公式类。第二步，设该商品成本为2x 元，定价为3x 元，降价30 元/件的基础上打八折的售价为（3x-30） ×0.8=2.4x－24，那么单利为0.4x－24。根据销售5 件的利润比1 件多130 元，有5（0.4x－24）－x=130，解得x=250。则该商品成本为500 元，定价为750 元，1.5 万元可以买15000÷750=20（件），多买4 件则售价实际为15000÷（20+4）=625（元）。四个选项的售价分别为560 元、625 元、600 元、637.5 元，仅有B 符合。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-071","paperId":"gk2022-xz","num":71,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"D","explanation":"第一步，观察特征。所有图形均为黑白块组成，且已知图形均整体对称。优先考虑对称性。第二步，一条式，从左到右找规律。所有图形均是轴对称图形，排除B、C 项。将图形的对称轴画出，对称轴方向分别为/、竖、\\、横、/、？如图所示：可见对称轴方向是每次逆时针旋转45°，那么问号处应该是对称轴方向为竖向的图形，排除A 项，只有D 项符合规律。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-072","paperId":"gk2022-xz","num":72,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"第一步，观察特征。所有图形均由若干个封闭区域组成，优先考虑数量类面的相关规律。第二步，一条式，从左到右找规律。已知图形的封闭区域个数为4、4、4、5、4，可见在面的个数上不存在规律。可进一步继续观察面的形状，发现已知图形中均存在最大面和最小面，且两者形状相似。A、B 项中存在的形状相似的面其大小是完全相同的，排除； D 项，不存在形状相似的面。符合规律的只有C 项。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-073","paperId":"gk2022-xz","num":73,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"D","explanation":"第一步，观察特征。所有图形均由若干个黑白元素组成，优先考虑数量类。第二步，两段式，第一段找规律，第二段应用规律。观察图形特征，第一段白色部分依次是3 部分、2 部分、1 部分。第二段应用规律，找白色部分是1 部分的图形，符合题意的只有D 项。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-074","paperId":"gk2022-xz","num":74,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"第一步，观察特征。图形元素组成相似，优先考虑样式规律。第二步，九宫格，优先横行找规律。第一行，图三是由图一和图二去异求同得到的；第二行，验证符合规律；第三行，应用规律，图一和图二去异求同得到C 项。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-075","paperId":"gk2022-xz","num":75,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）下列纸盒的外表面展开图中，哪项折叠成的纸盒和其他三个不一样？","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"第一步，明确设问内容。选择外表面展开图中和其他三个不一样的选项。第二步，分析选项。 A 项：在外表面画箭头如图所示：，3 号面在箭头左侧； B 项：在外表面画箭头如图所示：，3 号面在箭头左侧； C 项：在外表面画箭头如图所示：，3 号面在箭头右侧； D 项：在外表面画箭头如图所示：，3 号面在箭头左侧。综上，只有C 项的3 号面是在箭头右侧，其余各项的3 号面均在箭头左侧，符合和其他三个不一样。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-076","paperId":"gk2022-xz","num":76,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）左图是给定的立体图形，将其从任一面剖开，以下哪项可能是该立体图形的截面？","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"C","explanation":"第一步，明确设问内容。哪一个可能是其截面图。第二步，观察图形。 A 项：由于圆柱体是一半，不能截出同心圆，排除； B 项：圆柱体从顶面斜切，截出的是椭圆的一部分，不能是半圆，排除； C 项：经过圆柱体顶端，不挨着镂空部分，经过下面长方体，垂直底面截一刀，可以截出，正确； D 项：六面体无法截出直角三角形，排除。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-077","paperId":"gk2022-xz","num":77,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）左图给定的是由相同正方体堆叠而成的多面体，该多面体可以由①、②和③三个多面体组合而成，以下哪项能填入问号处？","options":["如上图所示","如上图所示","如上图所示","如上图所示"],"answer":"D","explanation":"第一步，明确设问内容。选择可以和①、②拼成题干多面体的选项。第二步，分析选项。多面体①、②和D 项的拼合过程如下图所示：因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-078","paperId":"gk2022-xz","num":78,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①⑤⑥，②③④","①②④，③⑤⑥","①②⑤，③④⑥","①③④，②⑤⑥"],"answer":"C","explanation":"第一步，观察特征。组成元素不同，优先考虑数量类或属性类。图形规整，优先考虑属性类中的对称性。第二步，根据规律进行分组。所有图形均是轴对称图形，将其对称轴画出，如图所示：观察发现，图①②⑤对称轴贯穿图形交点，图③④⑥对称轴贯穿图形两条平行线，据此分为两组。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-079","paperId":"gk2022-xz","num":79,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②⑤，③④⑥","①②③，④⑤⑥","①③⑥，②④⑤","①④⑤，②③⑥"],"answer":"D","explanation":"第一步，观察特征。组成元素不同，优先考虑数量类或属性类。题干图形出现“田”字变形图，考虑笔画数。第二步，根据规律进行分组。图①④⑤均为一笔画图形，图②③⑥均为两笔画图形，据此分为两组。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-080","paperId":"gk2022-xz","num":80,"year":2022,"region":"国家","module":"判断推理","sub":"图形推理","stem":"（单选题）把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①④⑤，②③⑥","①③⑤，②④⑥","①②⑥，③④⑤","①②④，③⑤⑥"],"answer":"A","explanation":"第一步，观察特征。组成元素不同，优先考虑数量类或属性类。第二步，根据规律进行分组。所有图形均存在圆形及若干直线，观察圆形和直线的位置关系发现，图①④⑤中圆和直线相切，两者形成一个切点，②③⑥中圆和直线相交，两者形成一个曲直交点，据此分为两组。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-081","paperId":"gk2022-xz","num":81,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）同种数罪是指行为人实施数个行为,符合数个性质相同的基本犯罪构成，触犯数个罪名相同的数罪。根据上述定义,下列情形属于同种数罪的是:","options":["甲为了自杀,在水中投入剧毒农药,其幼女误饮后身亡,甲见状也饮水身亡","乙为阻止警察抓捕其子,采用暴力手段妨害警察的执法行为,挥刀将警察砍成重伤","丙因缺钱,先是对某单位实施了盗窃,而后又使用暴力手段抢劫了素不相识的赵某","丁故意杀死了与其分手的女友张某,而后又杀死了在生意上与其竞争的李某"],"answer":"D","explanation":"第一步，看提问方式，本题属于选是题。第二步，找关键信息。行为人实施数个行为,符合数个性质相同的基本犯罪构成，触犯数个罪名相同的数罪。第三步，辨析选项。 A 项：只有“在水中投入剧毒农药”这一个行为，不符合定义； B 项：“采用暴力手段妨害警察的执法行为”与“挥刀将警察砍成重伤”，性质不相同，属于不同罪名，不符合定义; C 项：对某单位实施了盗窃与使用暴力手段抢劫了素不相识的赵某，性质不相同，属于不同罪名，不符合定义; D 项：“故意杀死了与其分手的女友张某”与“杀死了在生意上与其竞争的李某”都是故意杀人罪，符合数个性质相同的基本犯罪构成，触犯数个罪名相同的数罪，符合定义。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-082","paperId":"gk2022-xz","num":82,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）刑事科学技术是公安、司法机关依照刑事诉讼法的规定，应用现代科学技术的成果，收集、检验和鉴定与犯罪活动有关的物证，为侦查、起诉、审判工作提供线索和证据的专门技术。根据上述定义，下列没有体现刑事科学技术的是:","options":["通过核对公司台账、采购合同等文件资料，确定犯罪嫌疑人行贿的具体数额","交通肇事伤亡案件中，根据车辆损毁情况推断车辆的接触点、行驶方向及事故成因","应用声谱仪对手机录音与犯罪嫌疑人的语音进行声学特征分析，作出是否为同一人的判断","对警犬识别出来的可疑物进行成分鉴定，判断嫌疑人所携带的物品是否为违禁品"],"answer":"A","explanation":"第一步，根据提问方式，确定为选非题。第二步，找关键信息。 ①公安、司法机关依照刑事诉讼法的规定； ②应用现代科学技术的成果，收集、检验和鉴定与犯罪活动有关的物证；第三步，辨析选项。 A 项：核对公司台账、采购合同等文件资料不属于“应用现代科学技术的成果”，不符合定义，当选； B 项：根据车辆损毁情况推断交通肇事的经过和成因，属于“应用现代科学技术的成果，收集与犯罪活动有关的物证”，符合定义； C 项：利用声谱仪识别犯罪嫌疑人的语音，属于“应用现代科学技术鉴定与犯罪活动有关的物证”，符合定义； D 项：对可疑物进行成分鉴定，属于“应用现代科学技术鉴定与犯罪活动有关的物证”，符合定义。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-083","paperId":"gk2022-xz","num":83,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）在卫生经济学评价中，直接成本是指与疾病有关的预防、诊断、治疗和康复等所支出的费用，包括直接医疗成本和直接非医疗成本。直接医疗成本是指与医疗服务的提供直接相关的医疗成本，包括一切必要的医学检验和检查的成本，以及卫生服务管理成本和所有后续治疗成本;直接非医疗成本是指与医疗服务的提供直接相关的非医疗成本。根据上述定义，下列没有体现上述成本的是:","options":["患者李某前往医院看夜间急诊的出租车费","患者赵某因右臂受伤停工造成的工资损失","在口腔科拔取智齿前，患者于某支付的血常规化验费","在陪同女儿去外地做手术期间，何某住宾馆支付的住宿费"],"answer":"B","explanation":"第一步，看提问方式，本题属于选是题。第二步，找关键信息。多定义，其关键信息如下：直接成本：与疾病有关的预防、诊断、治疗和康复等所支出的费用。直接医疗成本：与医疗服务的提供直接相关的医疗成本，包括一切必要的医学检验和检查的成本，以及卫生服务管理成本和所有后续治疗成本。直接非医疗成本：与医疗服务的提供直接相关的非医疗成本。第三步，辨析选项。 A 项：患者李某的打车费用是李某为了获得诊断服务付出的成本，属于直接非医疗成本； B 项：患者赵某因伤停工的工资损失，不属于“与疾病有关的预防、诊断、治疗和康复等所支出的费用”，不符合定义； C 项：支付血常规化验费是付出的医学检查成本，属于直接医疗成本； D 项：何某支付宾馆住宿费是为了陪同女儿去外地做手术付出的成本，属于直接非医疗成本。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-084","paperId":"gk2022-xz","num":84,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）在生物学、医学及其子科学的研究中，对从通常的生物学环境中分离出的生物体组织成分进行体外研究的实验称为体外实验;在活体生物机体之中进行研究的实验称为体内实验。根据上述定义，下列属于体外实验的是:","options":["在光学显微镜下观察枯草杆菌是否具有鞭毛","研究不同比例氮肥对玉米植株生长的影响","在试管中观察药剂与某溶液的化学反应","在培养皿中对卵子授精后观察受精卵的发育情况"],"answer":"D","explanation":"第一步，看提问方式，本题属于选是题。第二步，找关键信息。多定义，考查“体外实验”，其关键信息如下： ①从通常的生物学环境中分离出的生物体组织成分进行体外研究。第三步，辨析选项。 A 项：观察枯草杆菌是否具有鞭毛是在活体生物机体之中进行研究，不满足关键词①，不符合定义； B 项：氮肥对玉米植株生长的影响，不是进行体外研究，不满足关键词①，不符合定义； C 项：观察药剂与某溶液的化学反应，不涉及生物体，不符合定义； D 项：受精卵是分离出的生物体组织，在培养皿中观察是在进行体外研究，符合定义。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-085","paperId":"gk2022-xz","num":85,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）回指是在语法描写中用来指一个语言单位（回指语）从先前某个已表达的单位或意义（先行语）得出自身释义的过程或结果。回指可分为直接回指和间接回指。直接回指是指回指语与先行语存在明显共指关系,回指语是对先行语的重复。间接回指是指回指语与先行语之间的关系不明显,必须通过特定语境进行判断才能确立。根据上述定义,下列加下划线部分所反映的先行语和回指语之间的关系属于直接回指的是:","options":["门口停着好些三轮车,许多车夫在那里闲站着","这房子相当讲究,门是楠木做的","要向前来参会的人表示感谢,人家来参会就是对我们的支持","他午饭前来到餐馆点了一杯咖啡,服务员是一位意大利人"],"answer":"C","explanation":"第一步，看提问方式，本题属于选是题。第二步，找关键信息。回指语与先行语存在明显共指关系,回指语是对先行语的重复。第三步，辨析选项。 A 项：“三轮车”与“车夫”没有体现共指关系，不符合定义； B 项：“房子”与“门”没有体现共指关系，不符合定义; C 项：“前来参会的人”与“人家”指同一批人，存在共指关系，符合定义； D 项：“餐馆”与“服务员”没有体现共指关系，不符合定义。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-087","paperId":"gk2022-xz","num":87,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）由于人类建设活动的破坏和干扰，生物群体原来连续成片的生活环境被割裂，形成分散的岛状甚至碎片状的生境。生境廊道是指连接破碎化生境并适宜生物生活、移动或扩散的通道，便于实现物种基因、能量、物质的流动。根据上述定义，下列不属于生境廊道的是：","options":["国家公园内，两棵参天古树跨过公路上方枝叶相连，金丝猴借助古树跨越公路，不同区域的金丝猴群可以保持接触","某地将过去严重污染的河道改造为河滨公园，架设了多座拱桥，美化了环境，方便了交通，还吸引了大量鸟类来此栖息","为了让野生象群在两个自然保护区之间迁移，管理者设计建成了迁移通道，避开村寨，并保证该区域范围内有丰富的水和食物资源","为避免青藏铁路隔断藏羚羊迁徙路线，动物学家设计了桥梁下方、隧道上方及路基缓坡3 种形式的野生动物通路"],"answer":"B","explanation":"第一步，根据提问方式，确定为选非题。第二步，找关键信息。 ①破碎化生境：由于人类建设活动的破坏和干扰，生物群体原来连续成片的生活环境被割裂，形成分散的岛状甚至碎片状的生境。 ②生境廊道：连接破碎化生境并适宜生物生活、移动或扩散的通道，便于实现物种基因、能量、物质的流动；第三步，辨析选项。 A 项：金丝猴借助古树跨越公路，体现了“连接破碎化生境并适宜生物生活、移动或扩散”，不同区域的金丝猴群可以保持接触体现了“物种基因、能量、物质的流动”，符合定义； B 项：将严重污染的河道改造为河滨公园并架设拱桥，目的是美化环境，方便交通，拱桥并没有起到“连接破碎化生境并适宜生物生活、移动或扩散的通道，便于实现物种基因、能量、物质的流动”的作用，不符合定义； C 项：管理者设计建成让野生象群在两个自然保护区之间迁移的通道，体现了“连接破碎化生境并适宜生物生活、移动或扩散”，保证该区域范围内有丰富的水和食物资源体现了“便于实现物种基因、能量、物质的流动”，符合定义； D 项：动物学家设计野生动物通路，避免青藏铁路隔断藏羚羊迁徙路线，体现了“连接破碎化生境并适宜生物生活、移动或扩散”，符合定义。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-088","paperId":"gk2022-xz","num":88,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）除草剂必须具有良好的选择性，即在一定的用量与使用期内，能够防除杂草而又不伤害作物。其中,形态选择性是利用作物与杂草的形态结构差异而获得的选择性。生化选择性是利用作物和杂草在代谢过程中活化机制和解毒反应差异而产生的选择性。根据上述定义，下列属于生化选择性的是:","options":["将玉米种子事先用吸附性强的活性炭处理，通过这种保护物质避免或降低除草剂对种子的伤害","除草剂草甘膦用于作物播种、移栽或插秧之前，杀死已萌发的杂草，而这种除草剂在土壤中会很快失活或钝化，因此使用过后可安全地播种作物","小麦叶片窄、直立，表面有较厚的蜡质层和角质层，可使药液不易沾着，而杂草则因叶片宽、平、角质层薄，易接触除草剂而被杀伤","除草剂敌稗可被水稻含有的酰胺水解酶分解，而杂草不具备足量的酰胺水解酶，无法分解敌稗，易被杀死"],"answer":"D","explanation":"第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“生化选择性”，其关键信息如下：利用作物和杂草在代谢过程中活化机制和解毒反应差异而产生的选择性。第三步，辨析选项。 A 项：用活性炭处理玉米种子，利用的是吸附性，不属于“利用作物和杂草在代谢过程中活化机制和解毒反应差异而产生的选择性”，不符合定义； B 项：草甘膦杀死杂草以后在土壤中失活或钝化以避免影响播种作物，是除草剂本身的性质变化，不属于“利用作物和杂草在代谢过程中活化机制和解毒反应差异而产生的选择性”，不符合定义； C 项：小麦叶片和杂草的形状不同从而使药液接触情况有差异，属于形态选择性，不符合定义； D 项：水稻可分解除草剂敌稗而杂草不能，体现了“作物和杂草在代谢过程中活化机制和解毒反应差异而产生的选择性”，符合定义。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-089","paperId":"gk2022-xz","num":89,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）归因不变性原则是指人们会寻找某一特定结果与特定原因之间的不变联系，如果某种特定原因在许多情境下总是与某种结果相伴。人们就会把特定结果归结于那一原因。归因折扣原则是指人们不完全相信某一现象的形成确是由于某种原因所导致，即某一特定原因在产生特定结果中的作用，如果存在其他似是而非的原因，应该“打折扣”。根据上述定义，两类归因原则均没有体现的是:","options":["电视广告中明星推销洗发水时，观众觉得她的一头秀发不完全是因为洗发水才有的","在代理了诸多离婚案件后，律师小林统计发现离婚诉讼中大多数争议与财产纠纷有关","创业失败总会使创业者背负债务，创业者小罗这几年债台高筑，朋友认为他一定是创业失败了","对一系列盗窃案的分析显示，现场都出现过同一个男人，人们容易假定该男人就是犯罪嫌疑人"],"answer":"B","explanation":"第一步，根据提问方式，确定为选非题。第二步，找关键信息。（1）归因不变性原则：人们会寻找某一特定结果与特定原因之间的不变联系，如果某种特定原因在许多情境下总是与某种结果相伴。人们就会把特定结果归结于那一原因。（2）归因折扣原则：人们不完全相信某一现象的形成确是由于某种原因所导致，即某一特定原因在产生特定结果中的作用，如果存在其他似是而非的原因，应该“打折扣”。第三步，辨析选项。 A 项：观众认为明星在广告中的一头秀发不完全是因为洗发水才有的，符合“人们不完全相信某一现象的形成确是由于某种原因所导致”，体现了归因折扣原则； B 项：小林在经过代理诸多离婚案件后，得出了离婚诉讼中“大多数争议”与“财产纠纷”有关的结论，描述的是离婚诉讼中的“争议”与“财产纠纷”的相关性，并没有描述离婚原因，没有体现归因，不符合定义； C 项：创业失败总会使创业者背负债务，而人们在对小罗债台高筑时将之归因为创业失败，体现了归因不变性原则； D 项：对一系列盗窃案的分析显示现场都出现过同一个男人，使人们容易假定该男人就是犯罪嫌疑人，符合“某种特定原因在许多情境下总是与某种结果相伴”，体现了归因不变性原则。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-090","paperId":"gk2022-xz","num":90,"year":2022,"region":"国家","module":"判断推理","sub":"定义判断","stem":"（单选题）老年系数是指65 岁及以上的人口数在总人口中所占的百分比；少年儿童系数是指14 岁及以下人口数在总人口中的百分比；抚养比是指人口中非劳动年龄人数与劳动年龄人数之比（百分比），一般以15～64 岁为劳动年龄，14 岁及以下和65 岁及以上称为非非劳动年龄或被抚养年龄；老少比是65 岁及以上的人口与14 岁及以下人口数量之比（百分比）。根据上述定义，下列说法正确的是：","options":["一般情况下，抚养比大于老年系数与少年儿童系数之和","当社会总人口不变，劳动年龄人数增加时，少年儿童系数就会减少","老年系数和少年儿童系数的乘积等于老少比","老少比通常表示的是每100 名老年人对应多少少年儿童"],"answer":"A","explanation":"第一步，根据提问方式，确定为选题。第二步，找关键信息。（1）老年系数：65 岁及以上的人口数在总人口中所占的百分比；（2）少年儿童系数：14 岁及以下人口数在总人口中的百分比；（3）抚养比：人口中非劳动年龄人数与劳动年龄人数之比（百分比），一般以15～64 岁为劳动年龄，14 岁及以下和65 岁及以上称为非劳动年龄或被抚养年龄；（4）老少比：65 岁及以上的人口与14 岁及以下人口数量之比（百分比）。第三步，辨析选项。 A 项：抚养比=非劳动年龄人数/劳动年龄人数（百分比），老年系数+少年儿童系数=非劳动年龄人数/总人口（百分比），二者分子均为非劳动年龄人数，分母中劳动年龄人数一定小于总人口，分母越小数值越大，因此抚养比大于老年系数与少年儿童系数之和，说法正确； B 项：当社会总人口不变，劳动年龄人数增加时，非劳动年龄人数就会减少，但少年儿童系数是否减少不确定，说法错误； C 项：根据关键信息，老年系数=65 岁及以上的人口数/总人口,少年儿童系数=14 岁及以下人口数/总人口，二者乘积不等于65 岁及以上的人口/14 岁及以下人口数量，说法错误； D 项：老少比=65 岁及以上的人口/14 岁及以下人口数量（百分比），表示的是每100 名少年儿童对应多少老年人，说法错误；因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-091","paperId":"gk2022-xz","num":91,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）贸易摩擦∶出口下滑","options":["商业垄断∶市场失灵","醉酒驾驶∶例行检查","行政处罚∶违规生产","职务犯罪∶谋取私利"],"answer":"A","explanation":"第一步，确定题干逻辑关系。 “贸易摩擦”会导致“出口下滑”，二者属于因果对应关系。第二步，辨析选项。 A 项：“商业垄断”会导致“市场失灵”，二者属于因果对应关系，与题干逻辑关系一致，符合； B 项：“例行检查”可能会发现“醉酒驾驶”情况，二者属于对应关系，但对应方式与题干不一致，排除； C 项：“违规生产”会遭到“行政处罚”，二者属于因果对应关系，但词语顺序与题干不一致，排除； D 项：“职务犯罪”的目的是“谋取私利”，二者属于目的对应关系，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-092","paperId":"gk2022-xz","num":92,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）载歌∶载舞","options":["人云∶亦云","且战∶且退","自作∶自受","全心∶全意"],"answer":"B","explanation":"第一步，确定逻辑关系。 “载歌”“载舞”意思是边唱歌，边跳舞，形容尽情地欢乐，“载”字的意思是一边一边的意思，二者属于并列关系，且两件事情同时进行。第二步，辨析选项。 A 项：“人云”“亦云”是指别人说什么，自己也跟着说什么，二者属于时间先后的对应关系，排除。 B 项：“且战”“且退”一种作战状态,意为一边作战，一边退却，二者属于并列关系，且两件事情同时进行，与题干逻辑关系一致，符合； C 项：“自作”“自受”指自己做下的坏事，自己承受恶果，二者属于因果的对应关系，排除； D 项：“全心”“全意”指投入全部心思和精力，毫无杂念，二者属于并列关系，但两件事不是同时进行的，排除；因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-093","paperId":"gk2022-xz","num":93,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）微型无人机∶旋翼无人机","options":["热带植物∶香料植物","集体决策∶个人决策","形象思维∶抽象思维","开环系统∶闭环系统"],"answer":"A","explanation":"第一步，确定题干逻辑关系。有的“微型无人机”是“旋翼无人机”，有的“旋翼无人机”是“微型无人机”，二者属于交叉关系。第二步，辨析选项。 A 项：有的“热带植物”是“香料植物”，有的“香料植物”是“热带植物”，二者属于交叉关系，与题干逻辑关系一致，符合； B 项：“集体决策”与“个人决策”属于并列关系，排除； C 项：“形象思维”与“抽象思维”属于并列关系，排除； D 项：“开环思维”与“闭环思维”属于并列关系，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-094","paperId":"gk2022-xz","num":94,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）呼吸系统∶生殖系统","options":["生产计划∶年度计划","观赏花卉∶药用花卉","水面舰艇∶巡洋舰艇","简牍公文∶纸质公文"],"answer":"D","explanation":"第一步，确定题干逻辑关系。 “呼吸系统”与“生殖系统”属于并列关系中的反对关系。第二步，辨析选项。 A 项：“生产计划”是企业对生产任务作出统筹安排，具体拟定生产产品的品种、数量、质量和进度的计划，有的“生产计划”是“年度计划”，有的“年度计划”是“生产计划”，二者属于交叉关系，排除； B 项：有的“观赏花卉”是“药用花卉”，有的“药用花卉”是“观赏花卉”，二者属于交叉关系，排除； C 项：“巡洋舰艇”是一种火力强、用途多，主要在远洋活动的大型“水面舰艇”，二者属于包容关系中的种属关系，排除； D 项：“简牍”是中国古代书写用的竹简和木片，“简牍公文”与“纸质公文”属于并列关系，与题干逻辑关系一致，符合。因此，选择D 选项。拓展呼吸系统：人体与外界空气进行气体交换的一系列器官的总称，包括鼻、咽、喉、气管、支气管及由大量的肺泡、血管、淋巴管、神经构成的肺，以及胸膜等组织。生殖系统：系繁殖后代，延续种族诸器官的总称。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-095","paperId":"gk2022-xz","num":95,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）青铜器物∶商朝礼器∶文化遗产","options":["科幻小说∶微型小说∶文学作品","中式建筑∶苏州园林∶特色建筑","仰韶文化∶半坡遗址∶华夏文明","进口食品∶速冻海鲜∶冷冻食品"],"answer":"A","explanation":"第一步，确定题干逻辑关系。有的“商朝礼器”是“青铜器物”，有的“青铜器物”是“商朝礼器”，二者属于交叉关系，“青铜器物”属于 “文化遗产”的一种，二者属于包容关系中的种属关系。第二步，辨析选项。 A 项：“科幻小说”与“微型小说”属于交叉关系，“科幻小说”是“文学作品”，二者属于包容关系中的种属关系，与题干逻辑关系一致，符合； B 项：“苏州园林”是一种“中式建筑”，二者属于包容关系中的种属关系，“中式建筑”与“特色建筑”属于交叉关系，排除； C 项：“半坡遗址”是“仰韶文化”遗址，二者属于对应关系，“仰韶文化”是“华夏文明”的根基，二者属于包容关系中的组成关系，排除； D 项：“速冻海鲜”与“进口食品”属于交叉关系，“进口食品”与“冷冻食品”属于交叉关系，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-096","paperId":"gk2022-xz","num":96,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）独幕剧∶歌剧∶话剧","options":["流行歌曲∶通俗歌曲∶现代歌曲","自由体操∶竞技体操∶艺术体操","远程面试∶单独面试∶小组面试","顺序作业∶流水作业∶平行作业"],"answer":"C","explanation":"第一步，确定题干逻辑关系。戏剧按照场次，可分为多幕剧和“独幕剧”；按表演形式，可分为“话剧”、“歌剧”、诗剧、舞剧、戏曲等， “歌剧”和“话剧”属于并列关系，二者与“独幕剧”均属于交叉关系。第二步，辨析选项。 A 项：“流行歌曲”与“现代歌曲”属于并列关系，“流行歌曲”与“通俗歌曲”属于交叉关系，排除； B 项：“竞技体操”包括“自由体操”和“艺术体操”，二者属于包容关系中的种属关系，“自由体操”与“艺术体操”属于并列关系，排除； C 项：“单独面试”与“小组面试”属于并列关系，二者分别与“远程面试”属于交叉关系，与题干逻辑关系一致，符合； D 项：“顺序作业”“流水作业”与“平行作业”属于并列关系，排除。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-097","paperId":"gk2022-xz","num":97,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）提起公诉∶宣告判决∶收押罪犯","options":["撰写教案∶课堂教学∶解答疑问","手机点餐∶外卖送餐∶五星好评","违章行驶∶交警处罚∶行人受伤","方案设计∶建筑施工∶竣工验收"],"answer":"D","explanation":"第一步，确定逻辑关系。先“提起公诉”再“宣告判决”最后“收押罪犯”三者属于时间顺承关系，且三者行为主体不一致。第二步，辨析选项。 A 项：先“撰写教案”再“课堂教学”最后“解答疑问”三者属于时间顺承关系，但三者行为主体为同一个人，排除。 B 项：先“手机点餐”再“外卖送餐”最后“五星好评”三者属于时间顺承关系，但“手机点餐”与“五星好评” 二者主体是同一个人，排除。 C 项：先“违章行驶”导致“行人受伤”最后“交警处罚”三者属于时间顺承关系，但词语顺序与题干不一致，排除。 D 项：先“方案设计”再“建筑施工”最后“竣工验收”三者属于时间顺承关系，且三者行为主体不为同一个人，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-098","paperId":"gk2022-xz","num":98,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）城市公园∶公共设施∶休闲娱乐","options":["国宾礼炮∶电子礼炮∶国事庆祝","升降舞台∶露天剧场∶演出空间","云服务器∶虚拟技术∶信息备份","医用口罩∶卫生用品∶过滤空气"],"answer":"D","explanation":"第一步，确定题干逻辑关系。 “城市公园”是“公共设施”，二者属于包容关系中的种属关系，“城市公园”具有“休闲娱乐”的功能，二者属于功能对应关系。第二步，辨析选项。 A 项：“国宾礼炮”与“电子礼炮”属于交叉关系，排除； B 项：“露天剧场”可以放置“升降舞台”，二者属于地点对应关系，排除； C 项：“云服务器”利用了“虚拟技术”，二者属于对应关系，“云服务器”具有“信息备份”的功能，排除； D 项：“医用口罩”是“卫生用品”，二者属于包容关系中的种属关系，“医用口罩”具有“过滤空气”的功能，二者属于功能对应关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-099","paperId":"gk2022-xz","num":99,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）自然声源对于（）相当于（）对于煤炭","options":["人工声源；植物遗骸","燕语莺声；矿石燃料","传播介质；社区供暖","物体振动；地质危害"],"answer":"B","explanation":"分别将选项代入题干，确定逻辑关系。 A 项：“自然声源”与“人工声源”属于并列关系，“煤炭”是古代“植物遗骸”经过生物化学和物理化学变化逐渐形成的固体可燃性矿物，二者属于原材料对应关系，前后逻辑关系不一致，排除。 B 项：“燕语莺声”意思是黄鹂歌唱，燕子呢喃，与“自然声源”属于包容关系中的种属关系，“煤炭”属于 “矿石燃料”，二者属于包容关系中的种属关系，前后逻辑关系一致，符合； C 项：“自然声源”的传播一定会使用到“传播介质”，二者属于媒介的对应关系，但“社区供暖”可能使用 “煤炭”供暖，前后对应方式不一致，排除； D 项：“物体震动”产生“自然声源”，二者属于对应关系，“煤炭”与“地质危害”无明显的逻辑关系，前后逻辑关系不一致，排除。因此，选择B 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-100","paperId":"gk2022-xz","num":100,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）纪录片对于（）相当于（）对于客观题","options":["电影；主观题","国产片；选择题","动画片；考试题","译制片；必答题"],"answer":"D","explanation":"分别将选项代入题干，确定逻辑关系。 A 项：有的“纪录片”是“电影”，有的“电影”是“纪录片”，二者属于交叉关系，“主观题”和“客观题” 属于并列关系，前后逻辑关系不一致，排除； B 项：有的“纪录片”是“国产片”，有的“国产片”是“纪录片”，二者属于交叉关系，“选择题”是“客观题”，二者属于包容关系中的种属关系，前后逻辑关系不一致，排除； C 项：“动画片”与“纪录片”属于并列关系，有的“考试题”是“客观题”，有的“客观题”是“考试题”，二者属于交叉关系，前后逻辑关系不一致，排除； D 项：有的“纪录片”是“译制片”，有的“译制片”是“纪录片”，二者属于交叉关系，有的“必答题”是 “客观题”，有的“客观题”是“必答题”，二者属于交叉关系，前后逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-101","paperId":"gk2022-xz","num":101,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）由于集合了榨汁机、豆浆机、料理机、研磨机等产品功能，破壁机近年来一直备受消费者青睐。某公司生产了R 型和W 型两款功能相同的破壁机，相比而言R 型清洗更方便，W 型噪音更小。上市三年后的数据显示，R 型销量更好，所以公司认为消费者更喜欢易于清洗的破壁机产品。以下哪项如果为真，最能削弱上述观点?","options":["相比W 型产品，R 型网上促销力度更大，价格更具优势","W 型产品的外观设计更美观，许多白领上班族都更倾向于买W 型","和其他生产破壁机产品的公司相比，该公司具有更高的市场占有率","R 型和W 型产品在全国的销售渠道一致，主要投放在超市、购物中心"],"answer":"A","explanation":"第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：消费者喜欢易于清洗的破壁机。论据：R 型清洗更方便，W 型噪音更小。上市三年后的数据显示，R 型销量更好第三步，辨析选项。 A 项：增加反向论据。该项指出R 型破壁机销量好，可能是因为其促销力度大和价格具有优势，说明消费者购买 R 型破壁机并不是因为喜欢易于清洗的破壁机产品，具有削弱作用。 B 项：无关选项。该项只是指出W 型产品的消费者群里包括白领上班族，并未涉及到R 型号破壁机销量更好的原因是什么，与论点无关，话题不一致，排除。 C 项：无关选项。该项讨论的是该公司具有更高的市场占有率，并未涉及到R 型号破壁机销量更好的原因是什么，与论点无关，话题不一致，排除。 D 项：增加论据。该项指出两种破壁机销售渠道一致，说明R 型销量高不是因为销售渠道的不同，从而可以说明可能是因为其易于清洗的优点，具有加强作用。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-102","paperId":"gk2022-xz","num":102,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）研究员让流行音乐爱好者听一组流行歌曲，同时用功能磁共振成像监测他们的大脑活动。在进行扫描前，研究员通过经颅磁刺激间接刺激或抑制大脑的奖赏回路。结果发现，在听音乐之前刺激奖赏回路会增加被试听音乐时的愉悦感，而抑制它则会降低愉悦感。因此，研究员认为，大脑的奖赏回路会影响人们对音乐的喜欢程度。以下哪项如果为真，最能支持上述结论?","options":["缺乏音乐快感的人听音乐时，其大脑奖赏回路的活动很微弱","人们在享受美食时，也会出现大脑奖赏回路活动性升高","不喜欢流行音乐的人在听流行歌曲时，也会出现大脑奖赏回路的活动","音乐家喜欢的音乐，对\"乐盲\"而言可能是噪音，因为两者的大脑活动机制不同"],"answer":"A","explanation":"第一步，确定题型。根据提问方式中的“支持”，确定为加强论证。第二步，找论点和论据。论点：大脑的奖赏回路会影响人们对音乐的喜欢程度。论据：在听音乐之前刺激奖赏回路会增加被试听音乐时的愉悦感，而抑制它则会降低愉悦感。第三步，辨析选项。 A 项：增加论据。该项指出大脑奖赏回路的活动微弱的时候，听音乐的人会缺乏音乐快感，说明大脑的奖赏回路会影响人们对音乐的喜欢程度，具有加强作用。 B 项：无关选项。人们在享受美食时大脑奖赏回路活动的情况，与欣赏音乐无关，论题不一致，排除。 C 项：不明确项。该项只是指出“不喜欢流行音乐的人”听歌曲时也会出现大脑奖赏回路的活动，但并未提及这些人是否有愉悦感的变化，不具有加强作用。 D 项：无关选项。音乐家喜欢的音乐，对\"乐盲\"而言可能是噪音，与大脑的奖赏回路是否影响人们对音乐的喜爱程度无关，论题不一致，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-103","paperId":"gk2022-xz","num":103,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）一家全国连锁珠宝店的H 分店，去年在当地投放大量电梯促销广告。广告投放后，客流量激增，净利润和前一年同期相比增长了30%。可见电梯促销广告对于提高企业利润十分有效。假设G、M、R、S 是与H 分店规模、位置等具有可比性的其他4 家分店，则下列最能削弱上述论证的是∶","options":["G 分店，去年没有投放电梯广告，利润比H 分店更高","M 分店，去年选择投放了报纸广告，销售额同比提升了30%","R 分店，去年投放大量电梯广告，销售额却比H 分店低","S 分店，去年投放大量电梯广告，利润同比下降了10%"],"answer":"D","explanation":"第一步，确定题型。根据提问方式中的“削弱”，确定为削弱论证。第二步，找论点和论据。论点：可见电梯促销广告对于提高企业利润十分有效。论据：一家全国连锁珠宝店的H 分店，去年在当地投放大量电梯促销广告。广告投放后，客流量激增，净利润和前一年同期相比增长了30%。第三步，辨析选项。 A 项：无关选项。该项比较的是G 分店和H 分店利润的高低，与论点电梯促销广告提高企业利润无关，论题不一致，排除。 B 项：无关选项。该项讨论的是投放报纸广告，与论点电梯促销广告提高企业利润无关，论题不一致，排除。 C 项：不明确项。该项讨论的是投放大量电梯广告后，销售额却比H 分店低，但没有说明利润是否提高，不具有削弱作用。 D 项：增加反向论据。该项指出去年投放大量电梯广告，利润同比下降了10%，说明电梯促销广告对提高利润无效，不具有削弱作用。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-104","paperId":"gk2022-xz","num":104,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）不同的读者在阅读时，会对文章进行不同的加工编码，一种是浏览，从文章中收集观点和信息，使知识作为独立的单元输入大脑，称为线性策略；一种是做笔记，在阅读时会构建一个层次清晰的架构，就像用信息积木搭建了一个“金字塔”，称为结构策略。做笔记能够对文章的主要内容进行标注，因此与单纯的浏览相比，做笔记能够取得更优的阅读效果。要使上述论证成立，还需基于以下哪一前提？","options":["阅读效果的好坏取决于能否在阅读时抓住要点","用浏览的方式进行阅读属于知识加工的线性策略","做笔记涉及到了更加复杂的认知加工过程","与线性策略相比，结构策略能够让学习提升速度"],"answer":"A","explanation":"第一步，确定题型。根据提问方式中的“前提”，确定为加强论证。第二步，找论点和论据。论点：与单纯的浏览相比，做笔记能够取得更优的阅读效果。论据：做笔记能够对文章的主要内容进行标注。第三步，辨析选项。 A 项：建立联系。论据提到做笔记可以对文章的主要内容进行标注，该项指出是否抓住要点是判断阅读效果好坏的标准，那么做笔记能取得更好的阅读效果，建立了论据和论点的联系，属于前提。 B 项：无关选项。该项只是指出浏览的方式属于线性策略，与阅读效果无关，论题不一致，排除。 C 项：无关选项。该项只是指出做笔记涉及更复杂的加工，与阅读效果无关，论题不一致，排除。 D 项：无关选项。该项讨论的是阅读速度，与阅读效果无关，论题不一致，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-105","paperId":"gk2022-xz","num":105,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）在我国北方的春天，树木花粉是一种主要的过敏源，它们通过空气传播、不可避免地被吸入体内，使过敏体质人群产生或轻或重的炎症反应。与此同时，作为树木种子的杨柳飞絮同样使过敏人群感到不适，有研究员认为，杨柳飞絮虽然会使呼吸道产生不适，但它不是过敏源，许多声称杨柳飞絮过敏的人实际上是花粉过敏。以下哪项如果为真，不能支持研究人员的论证?","options":["杨柳飞絮容易进入人的呼吸道，并粘附其上产生刺激作用，出现类似过敏的症状","杨柳飞絮漫天飞舞之时，正值很多种树开花之际，二者在时间上存在着重叠","杨柳飞絮含有油质和多糖类物质，作用在皮肤上可通过一系列反应变成一种过敏源","由于被杨柳飞絮包裹携带，风媒花粉更突易进入呼吸道引起过敏反应根据所给材料，回答106-110 题。某超市从前到后整齐排列着7 个货架，放置着文具、零食、调料、日用品、酒、粮油和饮料7 类商品，每类商品占据一排。已知：（1）酒类排在调料类之前；（2）文具类和调料类中间隔着3 排；（3）粮油类在零食类之后，中间隔着2 排；（4）日用品类紧挨着文具类前一排或者后一排。"],"answer":"C","explanation":"第一步，确定题型。根据提问方式中的“不能支持”，确定为加强论证选非题。第二步，找论点和论据。论点：杨柳飞繁虽然会使呼吸道产生不适，但它不是过敏源，许多声称杨柳飞絮过敏的人实际上是花粉过敏。论据：无。第三步，辨析选项。 A 项：增加论据。该项指出杨柳飞絮产生的是“类似”过敏的症状，说明不是真正的过敏，具有加强作用。 B 项：增加论据。该项指出由于杨柳飞絮和花粉在时间上存在着重叠，故容易让人产生混淆，说明许多声称杨柳飞絮过敏的人实际上是花粉过敏，具有加强作用。 C 项：增加反向论据。该项指出杨柳飞絮是可以变成一种过敏源，故论点中“杨柳飞繁虽然会使呼吸道产生不适，但它不是过敏源”的说法错误，具有削弱作用。 D 项：增加论据。该项指出真正引起过敏的还是花粉，说明论点成立，具有加强作用。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-106","paperId":"gk2022-xz","num":106,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）下列各项中，哪一类商品不可能排在第一排？","options":["文具类","酒类","粮油类","日用品类"],"answer":"C","explanation":"第一步，确定题型。题干具有匹配特征，确定为分析推理。第二步，分析条件，进行推理。根据条件“粮油类在零食类之后，中间隔着2 排”，可知，粮油类不可能排在第一排。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-107","paperId":"gk2022-xz","num":107,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）按照从前完后，下列哪项排列是可能的？","options":["文具类、零食类、日用品类、酒类、调料类、粮油类、饮料类","零食类、文具类、日用品类、粮油类、饮料类、调料类、酒类","日用品类、文具类、酒类、零食类、饮料类、调料类、粮油类","日用品类、文具类、零食类、酒类、粮油类、调料类、饮料类"],"answer":"C","explanation":"第一步，确定题型。题干具有匹配特征，确定为分析推理。第二步，分析条件，进行推理。根据条件（1）“酒类排在调料类之前”，排除B 项；根据条件（3）“粮油类在零食类之后，中间隔着2 排”，排除A 项、D 项。因此，选择C 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-108","paperId":"gk2022-xz","num":108,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）零食类和文具类中间最多可能隔几排？","options":["2 排","3 排","4 排","5 排"],"answer":"D","explanation":"第一步，确定题型。题干具有匹配特征，确定为分析推理。第二步，分析条件，进行推理。本题利用代入法验证，由于本题问“最多隔几排”，故优先代入D 项。代入D 项：即零食类和文具类中间隔5 排，那么二者在第一排、第七排。根据条件（3）“粮油类在零食类之后，中间隔着2 排”，所以零食不能在第7 排，只能在第1 排，如下图：再结合条件（2）“文具类和调料类中间隔着3 排”，故调料类在第3 排，如下图：在结合条件（1）“酒类排在调料类之前”，故酒类在第2 排，如下图：在结合条件（4）“日用品类紧挨着文具类前一排或者后一排”，可知日用品只能在第6 排，如下图：那么剩下的饮料类，在第5 排，如下图：经验证，代入D 项后，与各条件不冲突，本题问“最多隔几排”，其他选项无需代入。因此，选择D 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-109","paperId":"gk2022-xz","num":109,"year":2022,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"（单选题）如果零食类排在第1 排，那么下列哪项中的两类商品不可能是相邻的两排？","options":["日用品类和酒类","零食类和日用品类","文具类和粮油类","零食类和文具类"],"answer":"A","explanation":"第一步，确定题型。题干具有匹配特征，确定为分析推理。第二步，分析条件，进行推理。本题条件为“零食类排在第1 排”，根据条件（3）“粮油类在零食类之后，中间隔着2 排”，那么粮油类在第 4 排，如下图：利用代入法解题：代入A 项：日用品类和酒类相邻根据条件（4）“日用品类紧挨着文具类前一排或者后一排”，可知，“日用品类、酒类、文具类”紧挨在一起，那么只能占据5、6、7 排的位置，但是剩下的2、3 排是饮料或调料类，但是这与条件（1）“酒类排在调料类之前”冲突，故该项不成立，即日用品类和酒类不能相邻；代入B 项：零食类和日用品类相邻。结合条件，存在可能的排序“零食类+日用品类+文具类+粮油类+饮料类+酒类+调料类”，故该项可能，排除；代入C 项：文具类和粮油类相邻。结合条件，存在可能的排序“零食类+日用品类+文具类+粮油类+饮料类+酒类+调料类”，故该项可能，排除；代入D 项：零食类和文具类相邻。结合条件，存在可能的排序“零食类+文具类+日用品类+粮油类+酒类+调料类+饮料类”，故该项可能，排除。因此，选择A 选项。","material":"","source":"2022年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2022-xz-110","paperId":"gk2022-xz","num"
