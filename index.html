该做的事情。结合选项可知，只有A 项“灌注”常用来指把某一感情融入某物中，用在此处语义合适，当选。 B 项“灌溉”指用水浇地，C 项“灌输”指传播、输送思想、知识等，D 项“灌制”指录音制造，均与抽象名词 “同理心”搭配不当，且与文意不符。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-003","paperId":"gz2017","num":3,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"树立法律权威，就要使法治原则到国家与社会每一层次、每一角落，让全体公民信仰法治，对法律存有敬畏之心。填入下列横线处的词语，最恰当的一项是：","options":["深入","融入","渗透","扩大"],"answer":"C","explanation":"文段意指要让法治原则在国家与社会每一个层次、每一角落都能得到全面的体现，C 项“渗透”比喻一种思想或势力逐渐向多方面浸透，这一动作能够非常形象的体现出这一原则如同流水一般，慢慢遍及每一个层次和角落，用于此处最为恰当。 A 项“深入”、B 项“融入”均可搭配，但不及“渗透”能够体现“遍及”这种语义，对比之下均可以排除。D 项“扩大”侧重强调范围、领域的扩大，文段并未重点体现由小及大的关系，排除。故正确答案为C。【文段出处】《彰显法治的力量》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-004","paperId":"gz2017","num":4,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"文化自信不是天上掉下来的，也不是仅仅在嘴上说说的，更不是虚无缥缈的“ ”。文化自信来自对民族历史的深刻了解，对国家现实的全面把握，对发展战略的正确设计，对前途目标的精准判断。填入下列横线处的词语，最恰当的一项是：","options":["画饼充饥","纸上谈兵","空中楼阁","水中捞月"],"answer":"C","explanation":"根据前文“虚无缥缈”可知，横线处表达文化自信不是虚幻的，C 项“空中楼阁”比喻虚幻的事物或脱离实际的空想，符合文意。 A 项“画饼充饥”比喻用空想来安慰自己，B 项“纸上谈兵”比喻空谈理论，不能解决实际问题，D 项“水中捞月”比喻去做根本做不到的事情，只能白费力气。文段中重点强调文化自信不是虚幻的，而是源自“对民族历史的了解...”，有其真实的来源，并未提及“安慰自己”、“解决实际问题”、“白费力气”，故A、B、D 三项均与文意不符，均排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-005","paperId":"gz2017","num":5,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"中国是文明古国，礼仪教化之邦。如果有人在大庭广众之下喧哗不止，则不免让人。填入下列横线处的词语，最恰当的一项是：","options":["侧目而视","恨之入骨","置若罔闻","不以为然"],"answer":"A","explanation":"根据文段语境可知，人们对于大庭广众之下大声喧哗的行为是一种很厌恶的态度，对应选项，A 项“侧目而视”指斜着眼睛看人，形容鄙视或厌恶的态度，符合文段语境且表意十分形象，当选。 B 项“恨之入骨”形容痛恨到极点，程度过重，排除；C 项“置若罔闻”指不予理睬，无法体现人们对于大声喧哗行为的愤怒态度，排除；D 项“不以为然”指不认为是对的，无法形容人们的厌恶和愤怒，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-006","paperId":"gz2017","num":6,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"量子力学认为真空并非“ ”，而是充斥着大量“虚”的粒子和反粒子对。它们同时产生，刹那之间又相互。依次填入下列横线处的词语，最恰当的一组是：","options":["一无所有淹没","空谷幽兰迸发","熙熙攘攘吞噬","空无一物湮灭"],"answer":"D","explanation":"第一空，分析可知横线处为对“真空”的具体解释说明，且与后文“充斥着大量的粒子”形成反义并列关系。 A 项“一无所有”和D 项“空无一物”都可以与“真空”对应且与后文语义相反，符合语境。B 项“空谷幽兰” 比喻人品高雅，与文段语义无关，排除；C 项“熙熙攘攘”形容人来人往，非常热闹拥挤，无法与“真空”形成对应，排除。第二个空，形容粒子产生的刹那又消失，对比选项，D 项“湮灭”除了指埋没、磨灭、消失以外，还可指物理上一种基本粒子和它的反粒子相遇时，两个粒子一起‘消失’而转化为他种粒子的现象，符合文段语义，当选。A 项“淹没”指大水漫过，比如“洪水淹没了村庄”，无法形容文段中的物理现象，排除。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-007","paperId":"gz2017","num":7,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"互联网就是看待争议、弥合争议的窗口。观点、、，莫不投射其中，像极了一件布满裂纹却又浑然天成的钧瓷。依次填入下列横线处的词语，最恰当的一组是：","options":["交流，交锋，交融","交锋，交融，交流","交融，交流，交锋","交流，交融，交锋"],"answer":"A","explanation":"分析文段语境可知，横线处三个词语应呈现递进的语义，“交流”指信息交换的过程，“交锋”指相互争论的过程，“交融”指融合在一起的过程，而观点应先双方相互交换，然后争论磨合，最后达到统一，结合选项， A 项符合该递进关系。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-008","paperId":"gz2017","num":8,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"家庭文明建设以培养和践行社会主义价值观为根本，以文明家庭创建活动为载体，以注重、注重、注重为着力点，唤醒广大家庭崇德向善的道义自觉。依次填入下列横线处的词语，最恰当的一组是：","options":["家风，家教，家庭","家庭，家风，家教","家庭，家教，家风","家风，家庭，家教"],"answer":"C","explanation":"分析文段语境可知，横线处三个词语应有一定的逻辑顺序，“家庭”指亲属之间所构成的社会生活单位，“家教”指家长对于子女进行的关于道德、礼节的教育，“家风”指一个家庭或家族的传统风尚，这三者关系应为先有家庭，再有家长对于子女进行教育，最后才会形成一个家庭的传统风尚，故对应C 项，符合该逻辑关系。 A、B、D 三项均不能体现出这一递进关系，均排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-009","paperId":"gz2017","num":9,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"“一带一路” 是产品、企业、投资走出去，服务、标准应走出去，要 “走进去”——关键是产能、服务要走进去，走进“一带一路”沿线六十五个国家。依次填入下列横线处的词语，最恰当的一组是：","options":["既然，还，更加","不仅，也，而且","如果，但，并且","即使，都，甚至"],"answer":"B","explanation":"根据文意可知，第一空与第二空均在讲“走出去”，故填入虚词应表并列或递进。A 项“既然…”表示前提条件，排除；C 项“如果…但”表转折，排除；D 项“即使…都”搭配错误，排除。B 项“不仅…也”表递进，语意合适，锁定正确答案为B。验证第三空，“走进去”比“走出去”有更高的要求，故第三空应填入表递进的虚词，B 项“而且”符合语境，验证正确。故正确答案为B。【文段出处】《“一带一路”催生世界型国家》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-010","paperId":"gz2017","num":10,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"世界发展不应单峰耸立，不应有孤岛。经济全球化浪潮中，“每一朵浪花有它的精彩”，彼此声浪相助，形成滚滚发展的春潮。依次填入下列横线处的词语，最恰当的一组是：","options":["也，因为，所以","更，只有，才能","却，既然，那么","就，无论，并且"],"answer":"B","explanation":"第一空，“不应单峰耸立”和“不应有孤岛”语义方向一致，故横线处可填入表示并列或递进的关联词，排除C、D 两项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 - 第二空、第三空，根据文意可知，“彼此声浪相助”为对策，是“形成滚滚发展的春潮”的前提，故B 项“只有… 才能”语意正确。A 项“因为……所以”表示因果，排除。故正确答案为B。【文段出处】《为全球治理贡献中国智慧》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-011","paperId":"gz2017","num":11,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"新常态下，“共享经济”为经济结构调整和产业结构转型提供了新的思路。在信息化时代，物流行业具有覆盖范围广、涉及面多，且物流市场运营主体小而散、运营环节多而杂的特点，尤其需要企业、物流公司等多方共享信息和资源，变革物流运行模式和组织模式，全面推行信息化和智能化，通过简约、高效、完善的平台完成资源整合。这段文字主要说明了：","options":["“共享经济”模式应主要用于物流行业","“共享经济”模式对物流行业有着重要的意义","没有“共享经济”模式，物流行业的发展前景堪忧","物流行业和“共享经济”模式的紧密结合"],"answer":"B","explanation":"文段首先交代背景，说明“共享经济”为经济结构调整和产业结构转型提供了新思路，接着引出“物流行业” 这一概念，接下来在介绍了物流行业的现状后，通过“尤其需要”引出文段重点内容，说明企业、物流公司需要共享信息和资源，并表明这种共享经济模式带来的好处，对应选项为B 项。 A 项，“应主要用于”无中生有，文段仅表明物流行业需要共享经济，排除； C 项，“前景堪忧”无中生有，文段并未体现物流行业在发展上出现了问题，排除； D 项，文段意在表明物流行业需要共享经济，而非意在表明两者间“紧密结合”的现状，排除。故正确答案为B。【文段出处】《探寻物流业发展新模式》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-012","paperId":"gz2017","num":12,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"文化是一个国家、一个民族的灵魂。历史和现实都表明，一个抛弃了或者背叛了自己历史文化的民族，不仅不可能发展起来，而且很可能上演一幕幕历史悲剧。文化自信，是更基础、更广泛、更深厚的自信，是更基本、更深层、更持久的力量。坚定文化自信，是事关国运兴衰、事关文化安全、事关民族精神独立性的大问题。没有文化自信，不可能写出有骨气、有个性、有神采的作品。这段文字主要说明了：","options":["文化自信的内涵","文化自信的重要性","文化与国运兴衰的关系","优秀作品必须体现文化自信获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 -"],"answer":"B","explanation":"文段首先指出文化对于国家和民族来说很重要，接着通过递进关联词“更”强调文化自信是深厚的自信、是持久的力量，随后指出文化自信关乎国运兴衰等大问题，尾句通过反面论证再次强调文化自信很重要，故文段重在强调文化自信的重要性，对应B 项。 A 项“内涵”非重点，文段重在通过对于内涵的阐释强调文化自信的重要性，排除； C 项主题词错误，文段主题词为“文化自信”，并非“文化”，排除； D 项，文中并非强调“优秀作品必须体现文化自信”，而是“没有文化自信根本不会有好作品”，这二者的逻辑关系并不相同，且文段是重在通过这一反面论证强调文化自信的重要性，排除。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-013","paperId":"gz2017","num":13,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"当企业组织发展迟缓，内部产生不良问题，企业必须改变管理模式。当外部变化影响不大时，企业可以从日常管理细节小幅度调整，以适应变化；而当小幅度调整无法适应变化时，企业需要考虑管理变革。需要注意的是，适应性调整和管理变革未必百分百成功，但如果不做调整或变革，那么企业的经营必然走向失败。关于这段文字，以下理解准确的是：","options":["企业发展迟缓往往说明企业的管理出了问题","企业内部产生不良问题可以首先考虑做适应性调整","企业管理调整或变革不成功会导致企业经营的失败","外部变化的影响是企业改变管理模式的决定性因素"],"answer":"B","explanation":"文段首句提到“企业组织发展迟缓，内部产生不良问题时，企业需要改变管理模式”，即改变管理模式是应对企业内部问题的方式和手段，而并不能够说明是管理本身出了问题，排除A 项。由文段第二句可知，企业内部出现问题时先考虑适当性调整，适当性调整无法应对时再进行管理上的大变革，B 项正确。 C 项，文中提到“如果不做调整或变革，企业经营必然走向失败”，假设变现实，与文意不符，且表意过于绝对，错误。 D 项“外部影响……是决定性因素”表述错误，真正的决定性因素应该是企业内部的问题，排除。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-014","paperId":"gz2017","num":14,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"对历史文物本身的保护固然重要，但更不可或缺的是对先人曾经走过的那段历史心存敬畏。不关注历史文物背后的文化血脉，强拆和重建，其实都是展现当代人文化强权的一种方式。从技术上讲，只要留有图纸，也许什么样的建筑都可以复建，但它身上承载的历史和文化却难以重现。文化传承和历史积淀有它自己的足迹，不是一朝一夕形成的。倘若以为靠一笔巨资投入和一堆建筑材料，就能连通历史、追续文脉，文物恐怕将沦为现代人的玩物。这段文字主要说明了：","options":["保护文物需要敬畏和尊重背后的历史文化","所有的历史文物都不该拆掉或重建","历史文物是历史文化的承载体","对已经消失的历史文物可以通过重建来复原"],"answer":"A","explanation":"文段开头通过转折关系提出观点，对历史文物保护中心存敬畏十分重要。后文提出不关注历史文物的文化血脉的强拆是强权的方式、复建的建筑承载的历史和文化难以重现，都是在强调敬畏历史背后的文化的重要性；最后用“倘若”引出反面论证，只是靠投资和建筑材料，文物将沦为玩物，还是在强调观点，保护文物要敬畏历史文化，对应到A 项。 B 项“所有的”表述绝对，排除； C 项仅仅是现象的描述，并非文段重点，排除； D 项为解释说明部分的内容，且强调在技术层面上可以复建，文段更侧重其背后的文化血脉，并非文段重点，排除。故正确答案为A。【文段出处】《历史文物不能靠复制救回》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-015","paperId":"gz2017","num":15,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"“经济金融化”成为产生金融危机的直接原因。当货币拥有了在市场上购买一切的魔力，它就成为财富的象征，使那些重利轻义者陷入货币拜物教泥潭，无限追求货币财富自古以来都会给社会带来灾难。在经济全球化的今天，其危害更大，会迅速蔓延成为全球化危机。为此，必须重视对金融业的治理与监管。关于这段文字，以下理解准确的是：","options":["货币是财富的象征","货币使人陷入拜物教泥潭","经济全球化可能导致全球金融危机","追求货币财富可能会给社会带来灾难"],"answer":"D","explanation":"原文提到“当货币拥有了在市场上购买一切的魔力，它就成为财富的象征使那些重利轻义者陷入货币拜物教泥潭”可知，货币是财富象征、使人陷入拜物教泥潭的前提是“当货币有了购买一切的魔力时候”，A、B 两项表述不全面，排除。 C 项，经济全球化只是背景的描述，并非是导致金融危机的原因，排除。由“无限追求货币财富自古以来都会给社会带来灾难”可知，D 项中虽无“无限”，但使用了“可能”一词表达了无法把握追求货币财富的尺度时可能会发生的状况，表述温和，语义正确。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-016","paperId":"gz2017","num":16,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"读书的实用理念正在消解其间最为动人、有趣的部分。然而，在这些动人、有趣而又“无用”的知识和思想里，青年人能够发现心灵缺失的所在，精神便在悠远的光泽里得到沐浴。现在大学里开设古典文学、美学理论等课程，就有这方面的用意。当知识从教条理论中走出的时候，它便会成为有温度的存在。关于这段文字，以下理解错误的是：","options":["一味追求读书的实用理念会使读书变得沉闷、无趣","青年人应摒弃只追求知识实用性的理念","古典文学、美学理论等大学课程缺乏价值","过分追求知识的实用性，会使知识缺少温度"],"answer":"C","explanation":"由首句“读书的实用理念正在消解其间最动人、有趣的部分”可知，A 项与文意相符，排除。由“然而，在这些动人……得到沐浴”可知，非实用性知识有很大的积极意义，青年人应该摒弃实用性知识理念， B 项与文意相符，排除。联系前文可知，大学开设古典文学、美学理论等课程是让青年人得到心灵的熏陶，并非没有价值，C 项表述错误，当选。由最后一句可知，过分追求知识实用性会使得知识缺少温度，D 项与文意相符，排除。此题为选非题，故正确答案为C。【文段出处】《青年应多关注“没有用的知识”》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-017","paperId":"gz2017","num":17,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"巩固计算思维是每个教育阶段的重要目标。只有这样，学生的能力才能在前一个水平的基础上向上发展。计算思维有助于任何领域问题的解决。比如，把一个大问题分解为若干个小问题，通过推理设计小型实验的可行性路径，以及与他人共同设计问题的解决方案。在不同环境下采用这些策略，可以让学生明白计算思维远比计算机有用。关于这段文字，以下理解准确的是：","options":["培养计算思维是教育的重要内容","应当减少学生对计算机的依赖","任何领域问题的解决都有赖于计算思维","可以通过分阶段的方式培养计算思维"],"answer":"A","explanation":"根据文段首句“巩固计算机思维是每个教育阶段的重要目标”可知，对计算机思维的培养和巩固是教育的重要内容，A 项当选。 B 项“应当减少学生对计算机的依赖”，文段只是强调计算思维比计算机有用，未涉及减少计算机依赖的问题，无中生有，排除。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - C 项，根据文段“计算思维有助于任何领域问题的解决”可知C 项“任何领域都有赖于”表述过于绝对，排除。 D 项，文段中培养计算思维的方式有“由大化小”、“小型实验”、“共同设计”等，并无“分阶段方式”，无中生有，排除。故正确答案为A。【文段出处】《全民学编程，从娃娃抓起：美国已经开始这么做了》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-018","paperId":"gz2017","num":18,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"与发达国家新的城市发展理念不同的是，中国的很多城市仍然醉心于打造“花园城市”。如果将“花园城市” 理解为花团锦簇、绿树成荫，这本身并不错。问题在于，很多地方将“花园城市”理解成了低密度和宽马路，特别是在新城建设中盲目追求宽马路、大广场和大的绿化带，这就错了。以下说法最可能符合作者观点的是：","options":["“花园城市”已经是一个过时的城市发展理念","“花园城市”并不单单指花团锦簇和绿树成荫","“花园城市”建设不应一味追求低密度和宽马路","中国对于“花园城市”的理念存在误解"],"answer":"C","explanation":"根据文段“问题在于，很多地方将‘花园城市’理解成了低密度和宽马路......这就错了”可知，文段重点强调的是目前中国建设“花园城市”的问题，“‘花园城市’建设不应一味追求低密度和宽马路”，C 项当选。 A 项“过时的”，无中生有，排除； B 项强调“花园城市”的理念，文段更强调误解，偏离文段中心，排除； D 项，文段强调“很多地方”，只是我国的某些城市会有理解偏差，而并非整个中国，概念扩大，排除。故正确答案为C。【文段出处】《活在城市，还是生活在城市？》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-019","paperId":"gz2017","num":19,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"现在的世界，各个装置高度互联，安全和隐私被人们高度重视，而在大脑可以互联的未来，这两个问题只会变得更加关键。精神安全研究者需要开发出高度安全的通讯协议，把脑脑通讯的风险降到最低。政策制定者也需要通过相关的法律，最大限度减少技术的滥用。脑脑通讯带来的好处能否抵过它的风险？这种技术会如何改变人类进化的轨迹？社会会因为它变得更好吗？或许现在该讨论这些问题了。这段文字主要说明了：","options":["脑脑通讯技术可能带来的负面影响应当引起重视","安全和隐私是脑脑通讯技术中最值得关注的问题","社会未必会因为脑脑通讯技术的应用而变得更好","脑脑通讯技术是把双刃剑"],"answer":"A","explanation":"文段首句交代背景，指出“在大脑可以互联的未来，安全和隐私更加需要重视”。随后从“精神安全研究者” 和“政策制定者”两方面提出要求。文段最后通过一系列的反问句，重点强调“脑脑通讯”可能会带来很多的问题，我们需要进行讨论，需要引起重视，对应A 项。 B 项“最值得关注的问题”表述过于绝对，排除； C 项对应文段“社会会因为它变得更好吗？”，作者未明确给出观点，主观臆断，排除； D 项文段重点强调“脑脑通讯”带来的问题，“双刃剑”指有好有坏，文段并未重点突出其好处，范围扩大，排除。故正确答案为A。【文段出处】用脑电波直接交流，还要多久能实现？","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-020","paperId":"gz2017","num":20,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"我们每个人每天都会有意识地三思而后行。但易幻主义者认为，“思”的过程是由神经活动来完成，它可能对“行”没有任何作用，或者只是在“行”之后编造理由使自己和其他人能够理解。然而，这种机制在进化上几乎没有任何合理性。要知道，仅占体重2%的大脑消耗了体内20%的能量，巨大的进化压力绝不容许错综复杂的有意识思维占用神经系统的进程，却做着与行为无关的运算。作者对易幻主义者的态度最可能是：","options":["批判易幻主义者的观点缺乏科学依据","认为易幻主义者没有关注生物进化的事实","批评易幻主义者割裂了“思”与“行”的联系","认为易幻主义者忽略了“思”在进化中的作用"],"answer":"B","explanation":"文段首句提出“思”和“行”的先后关系，随后介绍了易幻主义者的观点，认为“思对行没有任何作用”，否认了二者的关系。接着通过转折关联词“然而”引出文段重点，“这种机制在进化上几乎没有任何合理性”，随后进行具体的解释说明，所以文段的重点是易幻主义者的理论在进化上没有合理性，即不符合进化规律，对应 B 项“没有关注生物进化的事实”。 A 项“缺乏科学依据”表述过于笼统，不够明确具体，排除； C 项“割裂联系”为“然而”之前的易幻主义者的观点表述，并非直击作者在进化层面对这一观点的否定，排除； D 项“忽略思的作用”属于解释说明的内容，非重点，重点是没有考虑进化，排除。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-021","paperId":"gz2017","num":21,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①每一次重要变革，都会给人类生产生活带来深刻影响。 ②在这一轮新的变革大潮中，我们必须积极推进互联网治理体系变革，使之更好地造福国家和人民。 ③同时创造着人类生活新空间，拓展着国家治理新领域。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - ④当前，以互联网为代表的信息技术日新月异，引领着社会生产力新变革。 ⑤纵观世界文明发展史，人类先后经历了农业革命、工业革命、信息革命。","options":["⑤①④③②","④③⑤②①","④③⑤①②","⑤④③①②"],"answer":"A","explanation":"根据选项判断首句，④论述当前信息技术引领新变革的情况，⑤是介绍人类经历的三次革命，对比④⑤，④ 是对⑤“信息革命”的具体介绍，所以应该先⑤后④，排除B、C 两项。对比A、D 两项，判断①的位置即可，⑤ 提到了三次革命，而①“每一次重要变革”将其进行概括，且指出了革命的作用，根据指代词可将⑤①捆绑，排除D 项。验证A 项，逻辑顺序合理。故正确答案为A。【文段出处】《推进互联网治理体系变革（思想纵横）》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-022","paperId":"gz2017","num":22,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①“稳”才能继续进，更好地进。 ②稳中求进不是无所作为、不敢作为，而是奋发有为、以稳促进。 ③辩证地理解和把握“稳”和“进”、“稳”和“好”之间的关系，是充分发挥“稳中求进”这一经济工作方法论的关键。 ④在稳的前提下要在关键领域有所进取，在把握好度的前提下行稳致远。 ⑤“稳中求进”，“稳”不是目的，“稳”是条件、是手段，“进”与“好”才是目的、是方向。","options":["③②①④⑤","②①③④⑤","③⑤④②①","②④⑤③①"],"answer":"C","explanation":"根据选项判断文段首句，②介绍稳中求进是以稳促进，③论述“稳中求进”的关键是把握三者关系，不好判断首句。观察选项，⑤是对“稳”、“进”、“好”三者关系的具体解释说明，正好承接③的话题，③⑤捆绑，且先后顺序应该是先③后⑤，锁定正确答案C 项。验证C 项，逻辑顺序合理。故正确答案为C。粉笔小提示：③句这种“**是**的关键”的句式，在排序题中常作为首句或尾句，此题选项中没有以③句做尾句的选项，因此可基本认定③句为首句。【文段出处】《稳中求进以进促稳》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-023","paperId":"gz2017","num":23,"year":2017,"region":"广州","module":"言语理解与表达","sub":"片段阅读","stem":"将下列句子组成一段逻辑连贯、语言流畅的文字，排列顺序最合理的是： ①不敢、不愿批评的人，千般托辞，归结一点：为私心所忧、为关系所累、为利益所惑。 ②利益关联错综，人际关系复杂，圆润一点，中庸一些，和和气气，皆大欢喜。 ③有人说，人是社会关系的总和，谁都不是生活在真空里。 ④正如习近平总书记不断强调的，“开展批评和自我批评需要勇气和党性”。 ⑤殊不知，脓包不挑破，就会养痈遗患；讳疾而忌医，难免病入膏肓。","options":["④①⑤③②","③②④⑤①","④③⑤①②","③②⑤①④"],"answer":"D","explanation":"首先根据选项对比首句④和③，③“有人说……”为引用观点，④“正如”表示举例说明，按照逻辑，应先提出观点，再进行举例说明，故③更适合做首句，排除A、C 项。接着对比B、D 项，判断②句与④、⑤句的衔接， ②句论述“在人际关系中要圆滑、中庸、和和气气”，⑤“殊不知”进行转折，提出“脓包不挑破……”的不良后果，即圆滑、中庸的不利之处，与②含义相反，构成转折关系，故进行②⑤捆绑。故正确答案为D。【文段出处】《不愿批评的人是为私心所扰、为关系所累》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-024","paperId":"gz2017","num":24,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"公安执法权是典型的公权力。公权力旨在规范或恢复社会秩序，其遵循的基本原则是，。当公权力需要介入私权利或者说私权利需要救济的时候，要么是基于当事人的申请，要么是基于公共利益的考量。公权力机关必须是为了维护社会秩序和公共利益，才可对私权利进行一定范围和程度的干预。否则，极易构成对私权利的侵害。填入画横线部分最恰当的一句是：","options":["执法必严，违法必究","有权必有责","禁止干预私权利","法无授权不可为"],"answer":"D","explanation":"横线在文段中间，需结合上下文进行判断，可知横线处所填句子用以表达公权力的基本原则，根据后文“当公权力需要介入私权利……要么……要么……”的内容可知，公权力不得随意介入，而必须得到允许，即公权力需要在法律规定的范围内介入私权利，即D 项中的“授权”，当选。 C 项“禁止”表述绝对化，排除。A 项“违法必究”指任何公民只要是违反了法律，必须受到追究，侧重强调法律面前人人平等、B 项“有权必有责”指行使权力要对所引起的法律后果负责，均与文段重点内容无关。故正确答案为D。【文段出处】《警察执法权无边界，极易构成对私权利的侵害》获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-025","paperId":"gz2017","num":25,"year":2017,"region":"广州","module":"言语理解与表达","sub":"逻辑填空","stem":"“夫礼，天之经也，地之义也，民之行也。”从宏观上说，礼是用来济世安民的，“经国家，定社稷，序人民”。从微观上说，礼是用于典礼仪式的。中国古代作为仪式的礼非常多，有吉礼、凶礼、宾礼、军礼、嘉礼这五礼之分，。所以古人有言，经礼三百，曲礼三千，可以一言蔽之曰：毋不敬。可见，礼是通过一定的形式表达恭敬、尊敬之意。填入画横线部分最恰当的一句是：","options":["被古人看作是天经地义、人道所依的最高原则","但本质上都是通过祭祀神灵以求取幸福的宗教活动","从形式到内容都反映着一定的社会规范和道德规范","但所有的形式都要反映同一个理念，即恭敬"],"answer":"D","explanation":"文段开篇分别介绍“宏观上”、“微观上”礼的作用，后文通过“可见”进行总结，提出“礼是通过一定的形式表达恭敬、尊敬之意”，故横线处强调“敬”，对应D 项“理念、恭敬”。A 项“最高原则”文段未提及，表述绝对，排除；B 项“通过祭祀神灵……”文段未提及，无中生有，排除；C 项与D 项比较，文段是“理念、恭敬”而非“社会规范和道德规范”，D 项更契合文段。故正确答案为D。【文段出处】《知礼方能立》","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-027","paperId":"gz2017","num":27,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"6，7，12，18，29，（）","options":["52","50","48","46"],"answer":"D","explanation":"数列无明显特征，考虑做差。将原数列两两做差后得到新数列：1、5、6、11，递推可得：，，即新数列前两项的和等于第三项，则新数列下一项为：，故所求项为：。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-028","paperId":"gz2017","num":28,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"0，-1，1，4，9，（）","options":["9","16","25","32"],"answer":"C","explanation":"数列无明显特征，考虑做差。将原数列两两做差后得到新数列-1、2、3、5，本身无规律。对这个新数列取平方得到1、4、9、25，正好与原数列的后三项1、4、9 吻合，故所求项为：。具体变化规律： , , , 。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-029","paperId":"gz2017","num":29,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"30，16，22，18，19，（）","options":["16","16.5","17","17.5"],"answer":"D","explanation":"数列无明显特征，做差之后无明显规律，考虑递推。，故规律为：。所求项为：，解得所求项为17.5。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-030","paperId":"gz2017","num":30,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"观察表中数字的变化规律，依次填入空格、中的数字是：","options":["5，81","5，121","7，81","7，121"],"answer":"D","explanation":"通过观察，第一列，第三列，第四列。故，故所求：。观察第四行依次为:36、49、225 恰好是6、7、15 的平方，即。故所求：。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-031","paperId":"gz2017","num":31,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"30 个小朋友围成一圈玩传球游戏，每次球传给下一个小朋友需要1 秒。当老师喊“转向”时，要改变传球方向。如果从小华开始传球，老师在游戏开始后的第16、31、49 秒喊“转向”，那么在第多少秒时，球会重新回到小华手上？获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -","options":["68","69","70","71"],"answer":"A","explanation":"设顺时针方向为正方向，小华的位置为0 号位置，顺时针依次为0 号、1 号、2 号……29 号，且开始时为正方向传球。根据题意有，在游戏开始后的第16 秒，球传到16 号位置，传球方向从正方向改为负方向。在第31 秒，球传到号位置，传球方向从负方向转为正方向。在第49 秒，球传到号位置，传球方向从正方向转为负方向。若要球重新回到小华手上（0 号位置），则还需要19 秒，故总时间为秒。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-032","paperId":"gz2017","num":32,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某班共有46 人参加了一次数学测验，其中35 人做对了第一题，28 人做对了第二题，有3 人都做错了这两道题，那么该班有（）人只做对了第二题。","options":["8","11","15","18"],"answer":"A","explanation":"根据两集合容斥原理公式：，则有，，所以。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-033","paperId":"gz2017","num":33,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某车间安排了若干工人加工甲、乙两种零件，每个工人每天可加工甲零件15 个，或者加工乙零件10 个。某种仪器每套需配有甲零件2 个和乙零件3 个。已知只安排8 个工人加工甲零件。要使每天加工的零件恰好配套，该车间安排了（）个工人加工甲、乙两种零件。","options":["18","21","23","26"],"answer":"D","explanation":"已知只安排8 个工人加工甲零件，则每天一共可生产个甲零件。由条件可知，仪器配套需要甲零件2 个和乙零件3 个，则120 个甲零件配套的乙零件应有个，则需要安排个工人加工乙零件。因此该车间共安排了个工人加工甲、乙两种零件。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-034","paperId":"gz2017","num":34,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"几个朋友相约游泳，男士统一戴白色泳帽，女士统一戴红色泳帽。每位男士看到的白色泳帽数量与红色泳帽数量一样多，每位女士看到的白色泳帽数量都是红色泳帽数量的倍数。女士最少有（）人。","options":["1","2","3","4"],"answer":"B","explanation":"设男士有x 人，女士有y 人，倍数为N。由条件“每位男士看到的白色泳帽数量与红色泳帽数量一样多”，且每位男士看到的白色泳帽数比男士人数少1，则有x=y+1；由条件“每位女士看到的白色泳帽数量都是红色泳帽数量的倍数”，且每位女士看到的红色泳帽都比女士人数少1，则有x=N（y-1）。题目问最少，从最小的开始代入，当y=1 时，x=0，排除A 项；当y=2 时，x=3，N=3，满足题意。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-035","paperId":"gz2017","num":35,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"钟老师与四名老师一起参加学校举办的教师技能大赛。这四名老师的成绩分别是78 分、81 分、82 分、79 分，而钟老师的成绩比五人的平均成绩多6 分。那么，在五人中，第二名成绩比第四名多（）分。","options":["2","3","4","5"],"answer":"B","explanation":"由条件“钟老师的成绩比五人的平均成绩多6 分”可得，五个人最低分为78 分，则平均分大于78，因此，钟老师的成绩大于分，排名第一。故82 分为第二名，79 分为第四名，分差为：分。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-036","paperId":"gz2017","num":36,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某工业园拟为园内一个长100 米、宽8 米的花坛设置若干定点智能洒水装置，洒水范围是半径为5 米的圆形。要保证花坛各个区域都可被灌溉，最少需要（）个洒水装置。","options":["17","18","19","20"],"answer":"A","explanation":"获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 如上图所示，第一个洒水装置安放在O 点，其洒水范围正好覆盖长方形花坛顶点A，依据题意可得：，，，，，则一个洒水装置能够完全覆盖一个长为6m 的长方形，花坛总长100m，，至少需要17 个洒水装置。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-037","paperId":"gz2017","num":37,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"小陶要用小推车运送120 本书到图书馆。已知大箱、中箱、小箱一次分别能装10、8、6 本书，大箱、中箱、小箱各有3、4、13 个。小推车一次能运送的箱数如下表。如果箱子不重复利用，小陶最少要运（）次，才能把所有书运送到图书馆。","options":["6","7","8","9"],"answer":"C","explanation":"由表中条件可得每次小推车分别运送的书本量为：10 本、本、本、本，如下表所示：优先选择“序号4”运送方式，小箱共有13 个，可用小推车运送，即4 次，共运送书本本；再用“序号2”运送方式，中箱共有4 个，可用小推车运送次，共运书本本；剩余本，再用“序号1”运送2 次即可。则至少运了次。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-038","paperId":"gz2017","num":38,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某批发市场有大、小两种规格的盒装鸡蛋，每个大盒里装有23 个鸡蛋，每个小盒里装有16 个鸡蛋。餐厅采购员小王去该市场买了500 个鸡蛋，则大盒装一共比小盒装（）。","options":["多2 盒","少1 盒","少46 个鸡蛋","多52 个鸡蛋"],"answer":"D","explanation":"假设大盒装、小盒装分别有、个，根据题意可得：，已知16 、500 均为4 的整数倍，则能被4 整除。若，为非整数，排除；若，为非整数，排除；若，，，满足，且大盒装比小盒装多个鸡蛋。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-039","paperId":"gz2017","num":39,"year":2017,"region":"广州","module":"数量关系","sub":"数学运算","stem":"某班级共有学生52 人，从小琳、小宇、小菲、小筠、小铭五人中选出班长，全班每人限投票一张，不能弃权。结果是：小琳得票最多；小宇得票第二，比小琳少3 票；小菲和小筠得票相同且并列第三；小铭只有5 票，得票最少。那么，小琳当选班长的票数可能是（）票。","options":["12","13","14","15"],"answer":"D","explanation":"假设小琳得票数为，小菲得票数为，则5 人得票从高到低为：、、、、，则，即。因，则，，D 项满足。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-041","paperId":"gz2017","num":41,"year":2017,"region":"广州","module":"常识判断","sub":"政治","stem":"中央政治局于2016 年12 月26 日至27 日召开民主生活会，习近平总书记主持会议并发表重要讲话。以下不符合这次会议精神的是：","options":["中央政治局的同志必须自觉在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致","要以加强和规范党内政治生活、加强党内监督为抓手，推动全面从严治党不断深化","对党忠诚、永不叛党，是党章对党员的最高要求","党要赢得民心，党中央要有权威，必须廉洁"],"answer":"C","explanation":"本题考查了时政的知识点。 A 项正确，会议认为，党的十八届六中全会正式明确习近平总书记的核心地位，体现了党和人民的根本利益，对保证党和国家兴旺发达、长治久安，具有十分重大而深远的意义。中央政治局的同志必须自觉在思想上、政治上、行动上同以习近平同志为核心的党中央保持高度一致。故选项表述正确。 B 项正确，会议强调，全面从严治党永远在路上。我们不能满足于已经取得的成绩，不能有松松劲、歇歇脚的心态，要以加强和规范党内政治生活、加强党内监督为抓手，推动全面从严治党不断深化，实现党内政治生态根本好转。故选项表述正确。 C 项错误，习近平在会上指出，对党忠诚、永不叛党，是党章对党员的基本要求，而非最高要求。故选项表述错误。 D 项正确，习近平在会上指出，党要赢得民心，党中央要有权威，必须廉洁。故选项表述正确。本题为选非题，故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-042","paperId":"gz2017","num":42,"year":2017,"region":"广州","module":"常识判断","sub":"政治","stem":"根据教育部要求，我国教材全面落实了“十四年抗战”的概念。“十四年抗战”是指从“九一八事变”爆发获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 后开始的抗战，包含局部抗战和全面抗战两个阶段。“九一八事变”发生于（）年。","options":["1928","1931","1935","1937"],"answer":"B","explanation":"本题考查了中国历史的知识点。九一八事变是日本在中国东北蓄意制造并发动的一场侵华战争，是日本帝国主义侵华、中国人民十四年抗战的开端，时间为1931 年9 月18 日。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-043","paperId":"gz2017","num":43,"year":2017,"region":"广州","module":"常识判断","sub":"人文历史","stem":"清人黄生说：“读唐诗，一读了然，再过亦无异解。惟读杜诗，屡进屡得。”从读诗的角度说明了杜诗的博大精深。以下诗句，能反映杜诗仁爱精神的是：","options":["致君尧舜上，再使风俗淳","日暮苍山远，天寒白屋贫","感时花溅泪，恨别鸟惊心","海上生明月，天涯共此时"],"answer":"C","explanation":"本题考查了文学常识。杜诗，清代文学家、批评家金圣叹所说的“六才子书”之一，即杜甫诗作的总称。 A 项错误，“致君尧舜上，再使风俗淳”出自杜甫的《奉赠韦左丞丈二十二韵》。其大意为辅佐君王成为尧舜那样的人，再使百姓的风气好转到原始状态，这里有道家的返本归真的气象与意境。没有反映出杜诗的仁爱精神。 B 项错误，“日暮苍山远，天寒白屋贫”出自唐代诗人刘长卿的《逢雪宿芙蓉山主人》。不属于“杜诗”的范畴。故选项表述错误。 C 项正确，“感时花溅泪，恨别鸟惊心”出自杜甫的诗作《春望》。其大意为：忧心伤感见花开却流泪，别离家人鸟鸣令我心悸。这句诗表达了杜甫痛感国破家亡的苦恨，越是美好的景象，越会增添内心的伤痛，也体现了杜甫时时刻刻把天下的安危和人民的忧乐视为己任的深沉广博的仁爱精神。故选项表述正确。 D 项错误，“海上生明月，天涯共此时”出自唐代诗人张九龄的《望月怀古》。不属于杜诗的范畴。故选项表述错误。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-044","paperId":"gz2017","num":44,"year":2017,"region":"广州","module":"常识判断","sub":"人文历史","stem":"古人常以梅花入诗，以此营造清高、孤傲、坚忍等意境。以下诗句描写梅花的是：","options":["冲天香阵透长安，满城尽带黄金甲","疏影横斜水清浅，暗香浮动月黄昏","忽如一夜春风来，千树万树梨花开","乱花渐欲迷人眼，浅草才能没马蹄"],"answer":"B","explanation":"本题主要考查文学常识。需结合具体选项予以分析。 A 项错误，该诗句出自唐代黄巢《不第后赋菊》，意思是“盛开的菊花璀璨夺目，阵阵香气弥漫长安，满城均沐浴在芳香的菊意中，遍地都是金黄如铠甲般的菊花”，故该诗句描写的是菊花，而不是梅花。 B 项正确，该诗句出自北宋林逋《山园小梅》。“众芳摇落独暄妍，占尽风情向小园。疏影横斜水清浅，暗香浮动月黄昏”。意思是“百花凋零，独有梅花迎着寒风昂然盛开，那明媚艳丽的景色把小园的风光占尽。稀疏的影儿，横斜在清浅的水中，清幽的芬芳浮动在黄昏的月光之下”，故该诗句描写的是梅花。 C 项错误，该诗句出自唐代岑参《白雪歌送武判官归京》。此诗是一首咏雪送人之作。诗句中的“梨花”是胡地八月的雪花。故选项表述错误。 D 项错误，该诗句出自唐代白居易《钱塘湖春行》，意思是“鲜花缤纷，几乎迷人眼神；野草青青，刚好遮没马蹄。”故该诗句描写的是指纷繁开放的春花，而不描写梅花。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-045","paperId":"gz2017","num":45,"year":2017,"region":"广州","module":"常识判断","sub":"法律","stem":"以下典故按照发生的时间先后顺序排列正确的是： ①指鹿为马 ②请君入瓮 ③约法三章 ④卧薪尝胆","options":["④①②③","①④③②","④①③②","①④②③"],"answer":"C","explanation":"本题主要考查文学常识。 ①指鹿为马：出自秦朝末年司马迁《史记•秦始皇本纪》》：“（秦朝丞相）赵高欲为乱，恐群臣不听，乃先设验，持鹿献于二世（秦二世），曰：‘马也。’二世笑曰：‘丞相误邪？谓鹿为马。’问左右，左右或默，或言马以阿顺赵高。”意思是指着鹿，说是马。比喻故意颠倒黑白，混淆是非。该成语典故发生在秦朝末年。 ②请君入瓮：出自宋朝司马光《资治通鉴》，比喻用某人整治别人的办法来整治他自己。该成语讲的是唐朝女皇武则天的故事。 ③约法三章：出自汉朝司马迁《史记•高祖本纪》：“与父老约法三章耳：杀人者死；伤人及盗抵罪。”原指订立法律与人民相约遵守。后泛指订立简单的条款。该成语典故讲的秦朝灭亡时（公元前206 年）刘邦攻打秦国都城咸阳，秦王投降，与百姓约法三章：杀人者要处死，伤人者要抵罪，盗窃者也要判罪！”父老、豪杰们都表示拥护约法三章。 ④卧薪尝胆：出自《史记•越王勾践世家》，意思是睡觉睡在柴草上，吃饭睡觉都尝一尝苦胆。形容人刻苦自励，发奋图强。公元前496 年，越国国王勾践即位，吴王趁越国刚刚遭到丧事，就发兵打越国，勾践大败，后来越王勾践卧薪尝胆，大败吴国的故事。该成语典故发生在春秋时期。因此，四个成语的正确排序为④①③②。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-046","paperId":"gz2017","num":46,"year":2017,"region":"广州","module":"常识判断","sub":"人文历史","stem":"吴稚晖在评论历史人物时说，有人“全靠一部《史记》”，而有人“全不在乎什么《通鉴》不《通鉴》”；又有人“有诗文集大见轻重”，而有人“有同样的诗文集丝毫不在其人是非不加轻重”。可以推知，吴稚晖所说的“全不在乎什么《通鉴》不《通鉴》”和“有同样的诗文集丝毫不在其人是非不加轻重”分别是指：","options":["司马迁，王阳明","司马迁，王安石","司马光，王阳明","司马光，王安石"],"answer":"D","explanation":"本题主要考查文学常识。吴稚晖曾论历史人物说，“如以司马迁、司马光为譬，一是全靠一部《史记》，一是全不在乎什么《通鉴》不《通鉴》。又以苏轼、王安石为譬，一则有诗文集大见轻重，一则有同样的诗文集，丝毫在其人是非不加轻重”。简言之，司马迁和苏轼，更多是人以文重；而司马光和王安石，则其事功足以传世，其立言方面的卓绝，便不起决定作用。因此，吴稚晖所说的“全不在乎什么《通鉴》不《通鉴》”是指司马光； “有同样的诗文集，丝毫在其人是非不加轻重”是指王安石。因此，ABC 项：错误；D 项：正确。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-047","paperId":"gz2017","num":47,"year":2017,"region":"广州","module":"常识判断","sub":"法律","stem":"以下说法正确的是：","options":["15 世纪末，哥伦布发现了新大陆——印度，并称当地的土著居民为印第安人","瓦特对蒸汽机的改良，标志着工业革命开始","16 世纪中期，西班牙战胜了拥有号称“无敌舰队”的英国，确定了海上霸主的地位","英国颁布的《权利法案》，标志着君主立宪制的资产阶级统治正式确立"],"answer":"D","explanation":"本题主要考查历史常识。需结合具体选项予以分析。 A 项错误，15 世纪末，哥伦布发现了新大陆为美洲，而不是印度。 B 项错误，第一次工业革命开始于18 世纪珍妮纺织机的出现；而瓦特改良蒸汽机只是标志着进入蒸汽时代，不是工业革命开始的标志。 C 项错误，“无敌舰队”是西班牙16 世纪后期著名的海上舰队。1588 年，西班牙在同英国争夺海洋霸权的斗争中，无敌舰队几乎全军覆没。从此，西班牙海上霸主地位被英国取代。故选项表述错误。 D 项正确，1689 年，英国颁布《权利法案》确立了议会拥有权力高于王权的原则，标志着君主立宪制开始在英国建立，为英国资产阶级发展扫清了道路。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-048","paperId":"gz2017","num":48,"year":2017,"region":"广州","module":"常识判断","sub":"政治","stem":"植物纹样作为以表现植物为主的装饰手段，是与老百姓生活息息相关的艺术形式，是伦理、吉祥等思想道德和情感意念的载体和传播情感的媒介。以下可以表达人们向往爱情美满幸福的植物纹样是：","options":["梅花瑞鸟纹","宝相牡丹纹","荷花蝴蝶纹","团花菊花纹"],"answer":"C","explanation":"本题主要考查文化常识。中国传统的植物纹样比较常见的有：牡丹，寓意着儒雅等意；菊花，寓意着延年益寿，举家欢乐等意；兰花，寓意人的性格或者品格高尚；竹子，象征着美好的祝愿等。中国传统的植物纹样的运获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 - 用有一个很大的特点，即喜欢运用谐音字，如菊对“举”，竹对“祝”，藕对“偶”，寓意夫妻幸福。 A 项错误，梅花纹的含义：梅瓣为五，民间又藉其表示五福：福、禄、寿、喜、财。梅是花中寿星，梅能于老干发新枝，又能御寒开花，故古人用以象征不老不衰。梅花纹还有吉祥的寓意。 B 项错误，宝相花纹多用做辅纹来衬托主纹，从而使装饰效果更加富丽堂皇；牡丹自唐代以来被视为繁荣昌盛、美好幸福的象征。因此，宝相牡丹纹，主要寓意是繁荣昌盛、美好幸福。 C 项正确，自古对荷花的评价就很高，“出淤泥而不染”说的就是荷花的纯洁和个性，蝴蝶寓意着成双成对，美满爱情。因此荷花蝴蝶纹，表达了人们爱情美满幸福的植物纹。 D 项错误，团花纹，寓意“吉祥”之意；菊花，予以着延年益寿，举家欢乐等意。因此，团花菊花纹，寓意延年益寿，举家欢乐、吉祥之意。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-049","paperId":"gz2017","num":49,"year":2017,"region":"广州","module":"常识判断","sub":"法律","stem":"“开车不喝酒，喝酒不开车”是现在道路交通常用的标语。为保障交通安全，我国《刑法》对“酒后驾车” 的相关情形也做了规定。在不考虑驾驶人年龄、行为能力等前提下，下列情形与刑法罪名对应关系正确的是：","options":["在道路上，酒后驾驶机动车辆——危险驾驶罪","在道路上，醉酒驾驶机动车辆——危险驾驶罪","在道路上，酒后驾驶机动车辆——交通肇事罪","在道路上，醉酒驾驶机动车辆——交通肇事罪"],"answer":"B","explanation":"本题主要考查法律常识——危险驾驶罪。根据《刑法》第133 条之一第1 款规定，在道路上驾驶机动车，有下列情形之一的，处拘役，并处罚金：(一)追逐竞驶，情节恶劣的；(二)醉酒驾驶机动车的；(三)从事校车业务或者旅客运输，严重超过额定乘员载客，或者严重超过规定时速行驶的；(四)违反危险化学品安全管理规定运输危险化学品，危及公共安全的。 A 项错误，“酒后”错误，应当是“醉酒”。 B 项正确，符合危险驾驶罪的构成要件。 C 项错误，交通肇事罪，是指违反道路交通管理法规，发生重大交通事故，致人重伤、死亡或者使公私财产遭受重大损失，依法被追究刑事责任的犯罪行为。酒后驾驶机动车，不一定就构成交通肇事罪。 D 项错误，醉酒驾驶机动车，不一定就构成交通肇事罪。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-050","paperId":"gz2017","num":50,"year":2017,"region":"广州","module":"常识判断","sub":"经济","stem":"“洛阳纸贵”体现的经济学常识是：","options":["商品价值决定商品价格","供求关系影响商品价格","通货膨胀影响市场价格","宏观调控调节市场价格"],"answer":"B","explanation":"本题考查经济常识。主要涉及商品与货币的相关内容。 B 项正确：洛阳纸贵，中国古代成语，原指西晋都城洛阳之纸，因大家争相传抄左思的作品《三都赋》，以至一时供不应求，货缺而贵。由故事内容可知是由于供求关系影响到了商品价格，与通货膨胀和宏观调控无关，故B 选项符合题意。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-051","paperId":"gz2017","num":51,"year":2017,"region":"广州","module":"常识判断","sub":"法律","stem":"下列处理保险合同纠纷案件的说法，符合我国相关法律法规的是：","options":["陈女士购买了一份意外伤害保险，她收到的投保单与保险单不一致，应以保险单为准","王先生所在的单位为他购买了一份车辆盗损险，他的保险凭证记载的时间不同，以形成时间在前的为准","张先生购买了一份财产损失保险，该保险单的非格式条款和格式条款不一致，以格式条款为准","李女士购买了一份重大疾病保险，保险单存有手写和打印两种方式，以双方签字、盖章的手写部分的内容为准"],"answer":"D","explanation":"本题考查法律常识。主要涉及保险法的相关内容。最高人民法院关于适用《中华人民共和国保险法》若干问题的解释（二）中第十四条规定：保险合同中记载的内容不一致的，按照下列规则认定：（一）投保单与保险单或者其他保险凭证不一致的，以投保单为准。但不一致的情形系经保险人说明并经投保人同意的，以投保人签收的保险单或者其他保险凭证载明的内容为准；（二）非格式条款与格式条款不一致的，以非格式条款为准；（三）保险凭证记载的时间不同的，以形成时间在后的为准；（四）保险凭证存在手写和打印两种方式的，以双方签字、盖章的手写部分的内容为准。 A 项错误，应以投保单为准。 B 项错误，应以以形成时间在后的为准。 C 项错误，应以非格式条款为准。 D 项正确，符合第四种情形。若保险凭证存在手写和打印两种方式的话，应以双方签字、盖章的手写部分的内容为准。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-052","paperId":"gz2017","num":52,"year":2017,"region":"广州","module":"常识判断","sub":"政治","stem":"不要靠近高圧帯电体是安全用电常识。但是我们经常可以看到，站在高压线上的小鸟并不会发生触电事故。这是因为：","options":["电线上有绝缘层","小鸟爪上的角质层不导电","小鸟能承受高压电","小鸟两爪间的电压很低"],"answer":"D","explanation":"本题考查物理常识。主要涉及高压触电的相关内容。 D 项正确：高压触电的两种方式：高压电弧触电和跨步电压触电。而对于跨步电压触电的本质原因是（以人为例）：人的两只脚离高压电源的距离不同（除非只用一条腿跳），这就造成两条腿形成了较大的电压差，导致电流从一条腿流进去，从另一条腿流出来，就触电了。但是小鸟呢？它的两条腿之间的距离很小，导致两条腿之间的电压很小很低，此时电流就不会从鸟的一条腿流进去，从另一条腿流出来，电流只会通过电线流过去（这可以看成是短路），所以鸟就安然无恙了。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-053","paperId":"gz2017","num":53,"year":2017,"region":"广州","module":"常识判断","sub":"经济","stem":"茶马古道是位于我国西南地区的贸易通道。它从云南和四川茶叶产地出发，穿过横断山脉、跨越几大河流向西延伸，覆盖云贵高原和青藏高原，通往喜马拉雅山脉南部南亚次大陆。以下河流不流经茶马古道的是：","options":["左江","金沙江","怒江","雅砻江"],"answer":"A","explanation":"A 项符合题意：左江是西江水系上游支流郁江的最大支流，发源于越南与广西交界的枯隆山。上游在越南境内称奇穷河（又叫黎溪），于凭祥市边境平而关进入中国境内后称平而河。左江既不流经云贵高原，也不流经青藏高原，故不可能流经茶马古道。 B 项不符合题意：金沙江的发源地为青海省唐古拉山主峰各拉丹冬雪山，位于青藏高原，故流经茶马古道。 C 项不符合题意：怒江是中国西南地区的大河流之一，发源于青藏高原的唐古拉山南麓的吉热拍格，流经茶马古道。 D 项不符合题意：雅砻江是金沙江的最大支流，是中国水能资源最富集的河流之一，发源于巴颜喀拉山（位于青藏高原）南麓，流经茶马古道。本题为选非题，故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-054","paperId":"gz2017","num":54,"year":2017,"region":"广州","module":"常识判断","sub":"法律","stem":"关于物理学原理在实际生活中的运用，以下说法错误的是：","options":["气压越高，沸点越低——高压锅能更快地煮好食物","冰刀作用于冰面的压力促使冰面融化——溜冰运动员能快速在冰面移动","凸面镜的视野比平面镜广阔——汽车前方两侧的后视镜是凸面镜","冷空气下沉——空调安装在房间上方"],"answer":"A","explanation":"A 项错误：沸腾就是液体分子离开液体变成气体分子的剧烈过程，液体表面的气压越高，液体分子离开液面变成气体更加困难，离开液面必须获得更高的能量，所以需要更高的温度，即沸点会有所升高。高压锅正是运用气压越高，沸点越高这一原理使得食物在高温条件下更容易煮熟。 B、C、D 三项均正确。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 - 本题为选非题，故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-055","paperId":"gz2017","num":55,"year":2017,"region":"广州","module":"常识判断","sub":"政治","stem":"近期，中科院的一个研究课题组发现：用高能电子束辐射医疗废弃物，可以直接将其中抗生素残留降解为无机或有机小分子。其应用的主要原理是：电子束辐射在水体中产生的活性自由基具有某种作用能够降解抗生素。活性自由基与抗生素发生了：","options":["基因突变","链式反应","聚合反应","氧化还原反应"],"answer":"D","explanation":"D 项正确：高能电子束辐照可以直接将医疗废弃物中抗生素残留降解为无机或有机小分子，其主要机理为电子束辐照在水体中产生的活性自由基与抗生素发生了氧化还原反应。 A 项错误：基因突变是基因组DNA 分子发生的突然的、可遗传的变异现象。题干课题不涉及DNA，故不可能是基因突变。 B 项错误：链式反应指核物理中，核反应产物之一又引起同类核反应继续发生、并逐代延续进行下去的过程。题干课题不涉及核反应，故不可能是链式反应。 C 项错误：聚合反应是由单体合成聚合物的反应过程。题干课题涉及的是将抗生素残留降解为小分子，不可能是聚合反应。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-056","paperId":"gz2017","num":56,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"土地：地租与（）在内在逻辑关系上最为相似。","options":["工资：劳动","厂房：工人","资本：利润","学历：知识"],"answer":"C","explanation":"第一步：分析题干词语间逻辑关系。通过土地可以获得地租，二者为对应关系。第二步：判断选项词语间逻辑关系。 A 项：通过劳动可以获得工资，但是顺序和题干相反，不符合题干的逻辑关系，排除； B 项：通过厂房不能获得工人，厂房是工人劳动的场所，不符合题干的逻辑关系，排除； C 项：通过资本可以获得利润，符合题干的逻辑关系，当选； D 项：通过学历不能获得知识，一般是通过教育可以获得知识，不符合题干的逻辑关系，排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-057","paperId":"gz2017","num":57,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"飞机：汽油与（）在内在逻辑关系上最为相似。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 -","options":["手串：珠子","蔬菜：种子","手电筒：电池","葡萄：健康"],"answer":"C","explanation":"第一步：分析题干词语间逻辑关系。汽油为飞机提供能源动力，二者为对应关系。第二步：判断选项词语间逻辑关系。 A 项：珠子是手串的原材料，不符合题干的逻辑关系，排除； B 项：种子是种子植物的繁殖体系，对延续物种起着重要作用，种子可以用来生产蔬菜，并不是为蔬菜提供能源，不符合题干的逻辑关系，排除； C 项：电池为手电提供能源动力，符合题干的逻辑关系，当选； D 项：葡萄和健康没有必然逻辑关系，不符合题干的逻辑关系，排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-058","paperId":"gz2017","num":58,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"蜡烛：电灯与（）在内在逻辑关系上最为相似。","options":["算盘：计算机","信鸽：电报机","鞭炮：火枪","电视：电影"],"answer":"A","explanation":"第一步：分析题干词语间逻辑关系。蜡烛和电灯的功能相同，都可以用来照明，且二者都是人造物。第二步：判断选项词语间逻辑关系。 A 项：算盘和计算机功能相同，都可以用来计算，且二者都是人造物，符合题干的逻辑关系，当选； B 项：信鸽和电报机都可以用来传递信息，但是信鸽是动物，不是人造物，不符合题干的逻辑关系，排除； C 项：鞭炮和火枪的功能不同，不符合题干的逻辑关系，排除； D 项：电视可以播放电影，二者的功能不同，不符合题干的逻辑关系，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-059","paperId":"gz2017","num":59,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"弓弩：射箭与（）在内在逻辑关系上最为相似。","options":["杠铃：举重","步枪：击剑","跨栏：跳远","泳池：跳水"],"answer":"A","explanation":"第一步：分析题干词语间逻辑关系。弓弩是射箭所需要的工具，二者为工具的对应。第二步：判断选项词语间逻辑关系。 A 项：杠铃是举重所需要的工具，二者为工具的对应，符合题干的逻辑关系，当选； B 项：击剑不需要步枪，不符合题干的逻辑关系，排除； C 项：跨栏和跳远都为运动项目，二者为并列关系，不符合题干的逻辑关系，排除； D 项：泳池是跳水的场所不是跳水的工具，不符合题干的逻辑关系，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-060","paperId":"gz2017","num":60,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"公司：经理与（）在内在逻辑关系上最为相似。","options":["邮局：邮差","餐厅：厨师","火车：司机","大学：校长"],"answer":"D","explanation":"第一步：分析题干词语间逻辑关系。经理在公司工作，且经理是有一定级别，是整个公司的管理者。第二步：判断选项词语间逻辑关系。 A 项：邮差在邮局工作，但不是邮局的管理者，不符合题干的逻辑关系，排除； B 项：厨师在餐厅工作，但不是餐厅的管理者，不符合题干的逻辑关系，排除； C 项：司机在火车上工作，但司机不是火车的管理者，不符合题干的逻辑关系，排除； D 项：校长在大学工作，且校长有一定级别，是整个学校的管理者，符合题干的逻辑关系，当选。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-061","paperId":"gz2017","num":61,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"太阳：（）与（）：相机在内在逻辑关系上最为相似。","options":["手表，倒影","能源，科技","烛光，胶卷","向日葵，望远镜"],"answer":"A","explanation":"将选项逐一代入，判断各选项前后部分的逻辑关系。 A 项：太阳和手表都有周期性的特征，即太阳东升西落，手表一天走2 圈；倒影和相机都遵循成像原理，倒影是光照射在平静的水面上所成的等大虚像，照相机简称相机，是一种利用光学成像原理形成影像并使用底片记录影像的设备，前后逻辑关系相似，暂且保留； B 项：太阳可以产生太阳能，太阳能是能源，但后者相机是科学技术下的一种产品，能源不是太阳的产品，前后逻辑关系不一致，排除；获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - C 项：太阳和烛光都有照明的功能，但胶卷和相机是配套使用关系，前后逻辑关系不一致，排除； D 项：向日葵又名朝阳花，因其花常朝着太阳而得名，且向日葵的生长离不开太阳；数码相机可以连接望远镜使用，但数码相机可以离开望远镜单独使用，前后逻辑关系不一致，排除。因为BCD 都明显不对，尽管A 项前后的逻辑关系并不是太严谨，但根据对比择优的思维，我们倾向于把这道题答案选给A。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-062","paperId":"gz2017","num":62,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"水：冻：冰与（）在内在逻辑关系上最为相似。","options":["牛：耕：田","纸张：书写：书籍","单身：结婚：已婚","衣服：缝制：布"],"answer":"C","explanation":"第一步，判断题干词语间的逻辑关系。可以造句子，水冻住就变为冰。第二步，判断选项词语间的逻辑关系。 A 项：牛耕田，而不是牛耕地就变为田，与题干逻辑关系不一致，排除； B 项：纸张经过书写、装订等一系列过程变为书，而非书写了就变成书籍，与题干逻辑关系不一致，排除； C 项：单身结婚了就变为已婚，与题干逻辑关系一致，当选； D 项：布经过缝制变为衣服，但顺序反了，与题干逻辑关系不一致，排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-063","paperId":"gz2017","num":63,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"荔枝：短裤：蒲扇与（）在内在逻辑关系上最为相似。","options":["腊梅：棉靴：火盆","菊花：雾霾：梯田","春分：小暑：大寒","茶叶：桃花：石榴"],"answer":"A","explanation":"第一步，判断题干词语间的逻辑关系。荔枝的果期通常在夏季；短裤是夏季要穿的服饰；蒲扇是夏季要用的纳凉工具。即题干三词均与“夏季”有关。第二步，判断选项词语间的逻辑关系。 A 项：腊梅是冬季观赏主要花木；棉靴是冬季要穿的服饰；火盆是冬季要用的取暖工具。三词均与“冬季”有关，与题干逻辑关系一致，当选； B 项：菊花大多在秋季开放；雾霾高发期主要是秋冬季节,冬季最为严重；中国梯田主要分布在江南山岭地区，是以地区划分，而非季节，与题干逻辑关系不一致，排除； C 项：春分、小暑和大寒均属于二十四节气，春分是春季的第五个节气，小暑是夏季的第五个节气，大寒是冬季的最后一个节气，与题干逻辑关系不一致，排除； D 项：中国绝大部分产茶地区，茶树生长和茶叶采制是有季节性的，通常按采制时间，划分为春、夏、秋三季茶；桃花一般在春季开放；石榴果期9—10 月。与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-064","paperId":"gz2017","num":64,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"火柴：打火机：取火与（）在内在逻辑关系上最为相似。","options":["煤炉：燃气灶：煮饭","锄头：马车：耕地","镜子：梳子：梳妆","皂角：浣纱：洗衣"],"answer":"A","explanation":"第一步，判断题干词语间的逻辑关系。火柴和打火机的功能是取火，为功能的对应关系。第二步，判断选项词语间的逻辑关系。 A 项：煤炉和燃气灶的功能是煮饭，为功能的对应关系，与题干逻辑关系一致，当选； B 项：锄头的功能是耕地，但马车的功能是载人或运货，而非耕地，与题干逻辑关系不一致，排除； C 项：梳子的功能是梳妆，但镜子的功能是被人们用来整理仪容，而非梳妆，与题干逻辑关系不一致，排除； D 项：皂角的皮是天然的工业洗涤产品，可以用来洗衣服，但浣纱就是指洗衣服，不是功能的对应关系，与题干逻辑关系不一致，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-065","paperId":"gz2017","num":65,"year":2017,"region":"广州","module":"判断推理","sub":"类比推理","stem":"大同小异：大相径庭：差异与（）在内在逻辑关系上最为相似。","options":["举世无双：比比皆是：人才","背信弃义：恪守不渝：信任","东施效颦：邯郸学步：模仿","高瞻远瞩：鼠目寸光：视野"],"answer":"D","explanation":"第一步，判断题干词语间的逻辑关系。大同小异是指大体相同，略有差异，即差异小；大相径庭比喻相差很远，大不相同，即差异大。两者互为反义词。第二步，判断选项词语间的逻辑关系。 A 项：举世无双形容极其罕见稀有，指世界上再没有第二个这样的人或物，和人才没有必然联系；比比皆是表示到处都是，形容极其常见，和人才没有必然联系。与题干逻辑关系不一致，排除； B 项：背信弃义是指违背诺言，不讲道义，多指朋友间出卖友谊，和信任没有必然联系；恪守不渝是指严格遵守，决不改变，和信任也没有必然联系。与题干逻辑关系不一致，排除； C 项：东施效颦比喻模仿别人，不但模仿不好，反而出丑；邯郸学步比喻一味地模仿别人，不仅学不到本事，反而把原来的本事也丢了。两者为近义词，与题干逻辑关系不一致，排除； D 项：高瞻远瞩是指站得高，看得远，比喻眼光远大，即视野开阔。鼠目寸光形容目光短浅，没有远见，即视野狭窄。两者互为反义词，与题干逻辑关系一致，当选。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-066","paperId":"gz2017","num":66,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"当人们感知房价还会上涨时，会更愿意购买商品房；但当人们感知房价还会下跌时，会更不愿意购买商品房。因此，政府的鼓励性购房政策刚出台时，并不会刺激人们的购房意愿。以下哪项最可能是上述论证所假设的？（）","options":["政府的鼓励性购房政策往往比较滞后，不能及时反映当下的商品房价格","大多数人购房主要是受房价变动的影响，而不是受政府购房政策的影响","政府的鼓励性购房政策刚出台时，大多数人感知房价还会下跌","大多数人在政府限制性购房政策刚出台时，都会有很强的购房意愿"],"answer":"C","explanation":"第一步：找到论点论据。论点：政府的鼓励性购房政策刚出台时，并不会刺激人们的购房意愿。论据：人们感知房价还会上涨时，更愿意买房，人们感知房价还会下跌时，更不愿意买房。第二步：逐一分析选项。 A 项：是在说政府的鼓励性购房政策比较滞后不能反映当下的房价，并不明确是否会对人们购房意愿造成影响，属于无关选项，排除； B 项：是在说大多数人们购房主要是受房价变动的影响，和题干论据的意思一致，加强论据，保留； C 项：是在说政府鼓励性购房政策刚出台时，人们感知房价还会下跌，也就会更不愿意买房。这句话等于是在政策与买房之间搭桥，加强论证，保留； D 项：是在说鼓励性政策刚出台时人们的购房意愿很强，而题目论述的是鼓励性政策会不会刺激购房意愿的问题，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 - 与这种购房意愿一开始强不强无关，属于无关选项，排除。比较B、C 两项,加强论证力度大于加强论据。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-067","paperId":"gz2017","num":67,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某饭店对配菜有如下要求：（1）只要配豆腐，就要配肉饼；（2）只有配鱿鱼，才要配黄瓜；（3）红烧肉和红烧鱼不能同时都配；（4）如果不配豆腐也不配黄瓜，那么一定要配红烧肉。如果某次配菜里有红烧鱼，那么关于该次配菜的断定一定为真的是（）。 Ⅰ.配有豆腐或者肉饼 Ⅱ.配有肉饼或者鱿鱼 Ⅲ.配有鱿鱼或者黄瓜 Ⅳ.配有豆腐或者黄瓜","options":["Ⅰ和Ⅲ","Ⅱ和Ⅳ","Ⅰ、Ⅱ和Ⅲ","只有Ⅳ"],"answer":"B","explanation":"第一步：翻译题干。 ①：豆腐→肉饼； ②：黄瓜→鱿鱼； ③：－（红烧肉且红烧鱼），即－红烧肉或－红烧鱼； ④：－豆腐且－黄瓜→红烧肉。题目条件：有红烧鱼第二步：分析选项。根据③，有红烧鱼→－红烧肉；根据④－红烧肉→－（－豆腐且－黄瓜），即－红烧肉→豆腐或黄瓜，到这一步并不能确定是否必须配黄瓜或者豆腐，因此根据“或”命题的推理规则，需要假设：当不配豆腐则必配有黄瓜，根据②黄瓜→鱿鱼；当不配黄瓜则必配有豆腐，根据①豆腐→肉饼。由以上假设即得出⑤：鱿鱼或肉饼。因此，由⑤可知，鱿鱼或肉饼从题干可以推出，Ⅱ正确；由④可知，不配红烧肉可以推出配豆腐或黄瓜，Ⅳ正确； Ⅰ和Ⅲ的或关系从题干无法得出。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-068","paperId":"gz2017","num":68,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"只要企业信用风险上升和有效信贷需求不足，银行就会陷入“资产荒”。如果上述断定为真，银行没有陷入“资产荒”，那么以下哪项也一定为真？（）","options":["企业信用风险没有上升或者有效信贷需求没有出现不足","企业信用风险没有上升并且有效信贷需求没有出现不足","企业信用风险没有上升但有效信贷需求出现不足，或者企业信用风险上升但有效信贷需求没有出现不足","至少企业信用风险没有上升"],"answer":"A","explanation":"第一步：翻译题干。 ①企业信用风险上升且有效信贷需求不足→银行陷入“资产荒”。题目条件：②－银行陷入“资产荒”→－（企业信用风险上升且有效信贷需求不足）→－企业信用风险上升或－有效信贷需求不足。第二步：逐一分析选项。 A 项：翻译为，－企业信用风险上升或－有效信贷需求不足，与②推出的结果一致，当选； B 项：翻译为，－企业信用风险上升且－有效信贷需求不足，与②推出的结果不一致，排除； C 项：这句话可以翻译为：（－企业信用风险上升且有效信贷需求不足）或（企业信用风险上升且－有效信贷需求不足），而②的推理结果为－企业信用风险上升或－有效信贷需求不足，或关系包含了三种情况，根据②的推理结果，还有一种可能是“—企业信用风险上升且—有效信贷需求不足”，而C 只说明另外两种可以推出情况，因此C 不是一定能推出的，排除； D 项：翻译为，－企业信用风险上升，而②推出的结果为企业信用风险可能上升，也有可能不上升，并不能得出肯定结论，与②推出的结果不一致，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-069","paperId":"gz2017","num":69,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"在全球范围内，所有的大城市的生活成本都比较高，上海是一座大城市，因此上海的生活成本比较高。以下哪一项与上述论证方式不一样？（）","options":["要进入法院工作必须通过国家司法考试，小王在法院工作，因此小王已经通过了国家司法考试。","某高校的硕士研究生只要通过毕业论文答辩就能获得硕士学位，小张今年获得了硕士学位，因此他已通过了毕业论文答辩。","纵观世界历史，每一位杰出的国家领导人无不有着坚强的意志，华盛顿是一位杰出的国家领导人，因此他拥有着坚强的意志。","城镇职工养老保险只要按规定缴费满15 年就能在退休后按月领取养老金，李先生已按规定缴满20 年的养老保险，因此他在退休后能按月领取养老金。"],"answer":"B","explanation":"第一步：翻译题干。大城市→生活成本都比较高，上海是一座大城市→上海市的生活成本比较高，肯前推出肯后。第二步：逐一分析选项。 A 项：进入法院工作→通过国际司法考试，小王在法院工作→小王通过了国家司法考试，肯前推出肯后，与题干论证方式一致，选非题，排除； B 项：通过毕业论文答辩→获得硕士学位，小张获得硕士学位→小张通过了毕业答辩，肯后推出肯前，与题干论证方式不一致，当选； C 项：杰出的国家领导人→有坚强的意志，华盛顿是一位杰出的国家领导人→华盛顿拥有坚强的意志，肯前推出肯后，与题干论证方式一致，排除； D 项：按规定缴费满15 年的养老保险→退休后按月领取养老保险金，按规定缴费满20 年的养老保险→退休后按月领取养老保险金，肯前推出肯后，与题干论证方式一致，排除。本题为选非题，故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-070","paperId":"gz2017","num":70,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"根据天气预报，这周只有三种天气，分别是晴天、雨天和多云天。现在已知：（1）今天是周四，晴天；（2）周一没有下雨；（3）明天是多云天；（4）明天以后要么是雨天，要么是多云天；（5）这周有三天是晴天。那么，以下推断错误的是（）。","options":["为了避免被雨淋湿，这周最多只有三天需要带雨伞出门","如果周六和周日天气不相同，这周最多有三天是多云天获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 -","周二和周三天气不可能相同","如果周二是多云天，则周一是晴天"],"answer":"C","explanation":"由条件（1）（3）（4）可知：周四晴天，周五多云天，周六、周日非晴天。由条件（1）（5）可知：周一非雨天，周一至周三有两天是晴天。根据题干列表： A 项：根据周四晴天，周五多云天，周一至周三有两天是晴天，推出有四天一定不会下雨，所以最多三天需要带伞出门，A 选项可以推出； B 项：周六和周日天气不同，所以周六周日有一天是多云天。周一至周三有两天是晴天，所以另外一天可能是多获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 云天。周五是多云天，所以这周最多有三天是多云天，B 选项可以推出； C 项：根据周一非雨天，周一至周三有两天是晴天，可知存在周一是多云天，周二和周三都是晴天这种可能，C 项错误； D 项：根据周一非雨天，周一至周三有两天是晴天，如果周二是多云天，那么周一、周三一定是晴天，D 选项可以推出。本题为选非题，故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-071","paperId":"gz2017","num":71,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某大湖是重要的候鸟越冬场所。近年来，该湖出现枯水期提前、枯水期持续时间延长等问题，枯水期水位过低，鱼类减少，影响了越冬的鸟类进食。有专家建议，应该在湖的入江水道处修建水闸，通过控制枯水期水位，增加湖区鱼类的生活空间，保护越冬的候鸟。以下哪项如果为真，将最有力削弱专家的建议？（）","options":["水闸影响了湖泊自然吞吐江河的能力，鱼类资源得不到江河的适时补充，自然繁殖会受到严重影响","研究指出，无论丰水期还是枯水期，高水位都会导致候鸟取食困难，有可能使候鸟数量减少","枯水期水位下降会给受珍禽价格飙升诱惑的盗猎者打开方便之门","水闸阻断了江豚在该湖和江河段的洄游路线，即使在水闸上留出过闸口，由于水流速度快，江豚也很难顺利钻过去"],"answer":"A","explanation":"第一步：找出论点和论据。论点：应该在湖的入江水道处修建水闸，通过控制枯水期水位，增加湖区鱼类的生活空间，保护越冬的候鸟。论据：该湖出现枯水期提前，枯水期持续时间延长等问题，枯水期水位过低，鱼类减少，影响了越冬的鸟类进食。第二步：逐一分析选项。 A 项：修建水闸会导致鱼类自然繁殖受到严重影响，使枯水期鱼类减少的情况越来越严重，不能保护越冬的候鸟，削弱论点，当选； B 项：高水位会导致候鸟取食困难，而论点中通过修建水闸来控制枯水期水位，不一定就要控制到高水位，不明确项，排除； C 项：枯水期水位下降，盗猎者增多，鱼类减少，加强论据，排除； D 项：江豚无法钻过闸口，与保护越冬的候鸟无关，无关选项，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-072","paperId":"gz2017","num":72,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"为解决城市交通拥堵问题，某地政府不断拓宽和新建公路，但是这些新拓建的路面很快就被车流淹没，交通拥堵状况不但没有缓解，反而越来越严重。以下哪项如果为真，则最无助于解释这一现象？（）","options":["新拓建公路的最低限速比其他公路要高一些","新拓建公路会诱使人们更多地购买和使用汽车","新拓建公路会导致沿线居民区和商业区增加","人们偏向于在新拓建的公路上行驶"],"answer":"A","explanation":"第一步：分析题干此题属于现象解释类题目，需要解释的矛盾现象为某地政府为解决城市交通问题不断拓宽和新建公路，但是交通拥堵状况不但没有缓解，反而越来越严重。即拓宽和新建公路为什么不能缓解交通问题。第二步：逐一分析选项 A 项：新拓建公路的最低限速比其他公路要高一些，指明速度的问题，到底最低限速是多少也不明确，最低限速和交通拥堵之间的关系也不明确，不能解释题干矛盾现象，为正确答案，当选； B 项：新拓建公路会诱使人们更多地购买和使用汽车，说明路增加了汽车也增加了，可能会导致交通拥堵，能解释题干矛盾现象，排除； C 项：指出新建公路使得沿线居民区和商业区增加，住的人多，人流量大，可能导致交通拥堵，能解释题干矛盾现象，排除； D 项：人们偏向于在新拓建的公路上行驶，说明新拓建公路上的车流量大，可能会导致交通拥堵，能解释题干矛盾现象，排除。故正确答案为A。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-073","paperId":"gz2017","num":73,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某人因为心理疾病尝试了几种不同的心理疗法：精神分析疗法、认知行为疗法以及沙盘游戏疗法。他说：“心理治疗过程让我非常不快乐，因此，这些疗法是无效的。” 以下哪项如果为真，将最有力质疑上述的结论？","options":["几种不同心理疗法所针对的心理疾病是不同的","尝试多种心理疗法的人要比只尝试一种疗法的人快乐","同时尝试不同心理疗法能够更容易找到可以起作用的方法","治疗效果好的人在治疗过程中往往感觉不快乐"],"answer":"D","explanation":"第一步：找到论点论据论点：这些治疗是无效的。论据：某人因为心理疾病尝试了几种不同的心理疗法，他说“心理治疗过程让我非常不快乐”。第二步：逐一分析选项 A 项：几种不同心理疗法所针对的心理疾病是不同的，和治疗法到底有没有效果无关，排除； B 项：尝试多种心理疗法的人要比只尝试一种疗法的人快乐，对比多种和一种疗法所给人的感觉，和治疗法到底有没有效果无关，排除； C 项：同时尝试不同心理疗法能够更容易找到起作用的方法，到底心理疗法有没有起作用，从选项无从得知，无关选项，排除； D 项：治疗效果好的人在治疗过程中往往感觉不快乐，直接拆开题干治疗不快乐与治疗无效之间的联系，说明治疗不快乐往往是有效，为正确答案，当选。故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-074","paperId":"gz2017","num":74,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"烟雾中毒是室内火灾最常见的致命因素。某推销员声称，他所在公司生产的新型火灾报警器内置声音感应器，房屋建筑材料暴露于高温时会发出的独特声音，报警器能够精确探测这些声音，并在建筑材料实际着火前便发出警报，使住户能在被烟雾困住之前逃离，因此可以很好地取代传统烟雾报警器。以下哪项如果为真，最能削弱该推销员的论述？","options":["许多房屋建筑材料实际着火时发出的声音在几百米之外也可以听得见","许多室内火灾开始于床垫和沙发，产生大量烟雾却不发出声音","有数据表明，烟雾报警器的使用拯救了许多生命","内置声音感应器的报警系统比传统烟雾报警系统的安装费用高得多"],"answer":"B","explanation":"第一步：找到论点论据论点：新型火灾报警器能够很好地取代传统烟雾报警器。论据：新型火灾报警器内置声音感应器，房屋建筑材料暴露于高温时会发出的独特声音，报警器能够精确探测这些声音，并在建筑材料实际着火前便发出警报，使住户能在被烟雾困住之前逃离。第二步：逐一分析选项 A 项：许多房屋建筑材料实际着火时发出的声音在几百米之外也可以听得见，说明燃烧声音大，火灾报警器可以感应到声音，对题干进行了加强，排除； B 项：许多室内火灾开始于床垫和沙发，产生大量烟雾却不发出声音，说明许多火灾刚开始新型火灾报警器是无法探测到的，自然也就不能帮助住户脱困，对论据进行削弱，当选； C 项：有数据表明，烟雾报警器的使用拯救了许多生命，与题干提出的新型火灾报警器能够很好地取代传统烟雾报警器观点无关，排除； D 项：内置声音感应器的报警系统比传统烟雾报警系统的安装费用高得多，费用高不高与题干观点新型火灾报警器能够很好地取代传统烟雾报警器无关，排除。故正确答案为B。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-075","paperId":"gz2017","num":75,"year":2017,"region":"广州","module":"判断推理","sub":"逻辑判断","stem":"某汽车厂商宣称，其新推出的汽车已经通过了各种撞击测试，当车祸发生时，乘车人的安全可以得到充分保障。但是也有人质疑，仅通过撞击测试不足以证明汽车是安全的。以下哪项如果为真，则不能支持这种质疑？（）","options":["测试不能模拟驾驶员在车祸发生瞬间的应急反应","测试所使用的车辆未必与销售的车辆完全一致","测试通常是在实验室而非车祸多发路段进行","测试用的人偶的尺寸和质量等参数无法完全模拟真实人体"],"answer":"C","explanation":"第一步：找到论点论据。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 - 论点：仅通过撞击测试不足以证明汽车是安全的。论据：无明显论据。第二步：逐一分析选项。 A 项：测试不能模拟驾驶员在车祸发生瞬间的应急反应，说明模拟测试不具备真实性，那么测试出来的结果也是不真实的，能够支持质疑者的意见，排除； B 项：测试所使用的车辆未必与销售的车辆完全一致，说明车的数据不一样，模拟测试不具备真实性，那么测试出来的结果也是不真实的，能够支持质疑者的意见，排除； C 项：测试通常是在实验室而非车祸多发路段进行，不管是在实验室还是在车祸多发路段都是围绕撞击来产生研究，只要保证情景一致就可以，C 不能对测试的结果进行质疑，也不能支持质疑者的意见，为正确答案，当选； D 项：测试用的人偶的尺寸和质量等参数无法完全模拟真实人体，说明人的参数不一样，那么撞击对真实的人产生的影响是无法得知的，能够支持质疑者的意见，排除。故正确答案为C。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-082","paperId":"gz2017","num":82,"year":2017,"region":"广州","module":"判断推理","sub":"图形推理","stem":"左侧图形是由右侧图形中的（）项组成。","options":["①②③","①②④","①③④","②③④"],"answer":"D","explanation":"本题考查平面拼合。原图可以由②③④构成，如图所示：故正确答案为D。","material":"","source":"2017年广州市公务员考试《行测》真题"},{"id":"gz2017-083","paperId":"g
