刃的山岭， “下火海”则是穿越由熊熊火焰构成的海洋，“上刀山、下火海”比喻为了完成一种使命不畏艰险，克服种种困难。选项中消防员对应的是“下火海”，该项在运用“上刀山下火海”时，只截取了“下火海”的含义，舍弃了“上刀山”的含义，满足关键词“引用词语时，只截取其中部分字眼的意义，而置其余于不顾”，符合定义，排除；D 项“开药方”的本意是找医生开具治疗疾病的方子，该项中找老师开药方比喻找老师寻求解决问题的建议或办法，使用的是“开药方”的比喻义，没有只截取其中部分字眼的意义，不满足关键词“引用词语时，只截取其中部分字眼的意义，而置其余于不顾”，不符合定义，当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-093","paperId":"gk2025-xz","num":93,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"细胞化学是研究细胞的化学成分及其在细胞活动中的变化和定位的学科。具体来说，细胞化学是在不破坏细胞形态结构的状况下，用生化的和物理的技术对细胞的各种组分做定量分析，研究其动态变化，了解细胞代谢过程中各种细胞组分的作用。根据上述定义，下列属于细胞化学研究范围的是：","options":["观察玉米根系细胞从周围环境中摄取营养的能力以及受环境影响产生的活动","根据哺乳动物细胞内核酸、蛋白质吸收不同紫外光的特点，分析其含量","抽取患者骨髓液，根据显微镜下骨髓细胞的不同形态，判断患者的疾病种类","研究小鼠免疫细胞受病原体侵入后，病原体释放毒素杀死免疫细胞的动态过程"],"answer":"B","explanation":"定义判断-单定义。题干中的关键词：①研究细胞的化学成分及其在细胞活动中的变化和定位；②在不破坏细胞形态结构的状况下，用生化的和物理的技术对细胞的各种组分做定量分析，研究其动态变化，了解细胞代谢过程中各种细胞组分的作用。结合选项：A 项说明玉米根系细胞从周围环境中摄取营养的能力以及受环境影响产生的活动，不涉及细胞中的化学成分，不符合关键词“研究细胞的化学成分及其在细胞活动中的变化和定位”不符合定义，排除；B 项细胞内核酸、蛋白质，满足“细胞的化学成分”。根据吸收不同紫外光的特点分析其含量，满足“用生化的和物理的技术对细胞的各种组分做定量分析”，符合定义，当选；C 项抽取骨髓液，观察细胞的不同形态从而判断疾病种类，不涉及研究细胞的化学成分，不符合关键词“研究细胞的化学成分及其在细胞活动中的变化和定位”不符合定义，排除；D 项研究病原体释放毒素杀死免疫细胞的动态过程，但不是研究细胞的化学成分，也不涉及研究细胞各种组分，不符合定义，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-094","paperId":"gk2025-xz","num":94,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"同一认定是指侦查中具有专门知识的人或了解客体特征的人，通过比较先后出现的客体的特征而对客体是否同一做出的判断。这里所说的客体是指与案件有关联的人或物。根据上述定义，下列属于同一认定的是：","options":["通过对手机中所存储的信息进行检查，确定其是否为报案人所丢失的手机","通过对犯罪现场提取的DNA信息与DNA信息库进行比对，查找犯罪嫌疑人","通过对走私案中所缴获的走私物品进行多次鉴定，认定其是否为国外某厂家所生产","通过对犯罪嫌疑人车上所收缴的各类物品进行检验，判断其是否属于违禁物品"],"answer":"B","explanation":"定义判断-单定义。题干中的关键词：①具有专门知识的人或了解客体特征的人； ②通过比较先后出现的客体的特征；③对客体是否同一做出的判断。结合选项：A 项对手机中所存储的信息进行检查，只是对一个客体进行检查，不满足关键词“通过比较先后出现的客体的特征”，不符合定义，排除；B 项说明将犯罪现场提取的DNA 信息与DNA 信息库进行比对，现场提取的DNA 属于后出现的客体，DNA 信息库属于之前存在的客体，满足关键词“比较先后出现的客体的特征”，从而来判断是否为同一嫌疑人，符合定义，当选；C 项将走私物品进行多次鉴定来确定是不是国外某厂家生产的物品，是对同时出现的一批物品进行检查，不满足关键词“比较先后出现的客体的特征”。此外，通过检查是为了认定其是否为国外某厂家所生产，不满足关键词“对客体是否同一做出的判断”，不符合定义，排除；D 项将收缴的各类物品进行检验，是对同时出现的一批物品进行检验，不满足关键词“比较先后出现的客体的特征”。此外，检验的目的是判断其是否属于违禁物品，不满足关键词“对客体是否同一做出的判断”。不符合定义，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-095","paperId":"gk2025-xz","num":95,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"土地监测是利用遥感、遥测技术，对一个国家或地区土地利用状况的动态变化进行定期或不定期的监视和测定，目的在于为国家和地区有关部门提供准确的土地利用变化情况，及时进行土地利用数据更新与对比分析，以便编制土地利用变化图解等。根据上述定义，下列属于土地监测的是:","options":["通过量化多时相遥感图像空间域、时间域、光谱域的耦合特征，获得土地变化的类型、位置和数量","利用定期现场踏勘的方式标绘各土地使用单位及各类型土地的界线，对变化的地物界线作出修正","通过某地区土地权属变更资料的分析，梳理该地区土地所有权、使用权的变化，以及土地纠纷调解情况","利用植被具有红光强吸收特点，通过遥感设备监测植被的生长状态，并绘制植被的生长周期图"],"answer":"A","explanation":"定义判断-单定义。题干中的关键词：①利用遥感、遥测技术，对一个国家或地区土地利用状况的动态变化进行定期或不定期的监视和测定；②为国家和地区有关部门提供准确的土地利用变化情况，及时进行土地利用数据更新与对比分析，以便编制土地利用变化图解等。结合选项：A 项通过量化多时相遥感获得土地变化的类型等，属于“利用遥感、遥测技术，对一个国家或地区土地利用状况的动态变化进行定期或不定期的监视和测定”，符合定义，当选；B 项利用定期现场勘测的方式，没有涉及运用遥感、遥测等技术，不符合定义，排除；C 项通过某地区土地权属变更资料的分析，没有涉及遥感、遥测技术。此外，梳理该地区土地所有权、使用权的变化，以及土地纠纷调解情况，不属于“对土地利用状况的动态变化进行定期或不定期的监视和测定”，不符合定义，排除；D 项监测植被的生长情况等，不涉及对土地利用情况的监测，不符合定义，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-096","paperId":"gk2025-xz","num":96,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"嘤其鸣矣：求其友声","options":["遏其生气：以求重价","求之其本：经旬必得","道不拾遗：夜不闭户","避其锐气：击其惰归"],"answer":"A","explanation":"类比推理-逻辑关系-方式目的。嘤其鸣矣，求其友声是指从深谷中出来的鸟，飞到高树上，那嘤嘤的叫声，是想寻求伙伴的。通过鸣叫来达到结交好友的目的，二者构成方式目的对应。结合选项：A 项遏其生气，以求重价是指阻抑它的生机，拿这样的病梅来谋求高价。通过抑制生机从而达到谋求高价的目的，二者构成方式目的对应，与题干中的逻辑关系一致，当选；B 项求之其本，经旬必得是指做事情如果从根本做起，经过一段时间必定能够收效，二者构成条件关系，与题干中的逻辑关系不一致，排除；C 项道不拾遗，夜不闭户是指东西丢在路上没有人拾走，夜里睡觉都不需要关门防盗，二者构成并列关系，与题干中的逻辑关系不一致，排除；D 项避其锐气，击其惰归指善于用兵之人，总是避开敌人初来时的气势，等敌人疲惫时再狠狠打击。先避其锐气，然后击其惰归，二者构成时间顺序关系，与题干中的逻辑关系不一致，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-097","paperId":"gk2025-xz","num":97,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"殚精竭虑：费尽心机","options":["狐假虎威：虚张声势","舍生忘死：死里逃生","侃侃而谈：喋喋不休","光怪陆离：五光十色"],"answer":"C","explanation":"类比推理-词义关系-混合考点。殚精竭虑是指用尽精力，费尽心机是指挖空心思，想尽办法。二者构成近义关系。且殚精竭虑为褒义词，费尽心机为贬义词。结合选项：A 项狐假虎威是指仰仗或倚仗别人的权势来欺压、恐吓人，虚张声势是指大造声势，借以吓人。二者均含有通过虚假手段营造威慑力的含义，构成近义关系。但狐假虎威、虚张声势均为贬义词，与题干不一致，排除；B 项舍生忘死是指不把个人的生死放在心上，死里逃生是指从极危险的境地中逃脱，幸免于死。二者无明显逻辑关系，与题干中的逻辑关系不一致，排除； C 项侃侃而谈是指理直气壮、从容不迫地说话，古时候用来形容人善于交谈。喋喋不休是指说话唠唠叨叨，没完没了。二者构成近义关系，且侃侃而谈为褒义词，费尽心机为贬义词，与题干中的逻辑关系一致，当选；D 项光怪陆离是指奇形怪状，五颜六色，五光十色是指色彩鲜艳，花样繁多，二者构成近义关系，但光怪陆离为中性词，五光十色为褒义词，与题干中的逻辑关系不一致，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-098","paperId":"gk2025-xz","num":98,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"群众来访：窗口接访：调查督办","options":["地面试验：点火飞行：燃料加注","支付本币：兑换外币：确认汇率","建造堤坝：潮汐发电：送电入户","重启谈判：临时休战：边境冲突"],"answer":"C","explanation":"类比推理-逻辑关系-对应关系。先群众来访，再窗口接访，最后调查督办，三者构成时间顺序对应。结合选项：A 项先地面试验，再燃料加注，最后点火飞行，三者构成时间顺序对应关系，但词语顺序与题干不一致，排除；B 项兑换外币时，先确认汇率，知晓兑换比例，再进行支付本币，最后兑换外币。与题干顺序不同，排除；C 项先建造堤坝，再潮汐发电，最后送电入户，三者构成时间顺序对应关系，与题干的逻辑关系一致，当选；D 项在发生边境冲突后，先临时休战，再重启谈判，与题干顺序不同，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-099","paperId":"gk2025-xz","num":99,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"收集罪证：提取指纹：透明胶","options":["温度不当：叶子发黄：营养液","逃生自救：敲碎车窗：安全锤","道路施工：设置防护：混凝土","冷风侵入：肩周疼痛：艾草贴"],"answer":"B","explanation":"类比推理-逻辑关系-混合考点。提取指纹是收集罪证的一种方式，二者构成方式目的对应关系，透明胶是提取指纹的工具，二者构成工具对应关系。结合选项：A 项温度不当可能会导致叶子发黄，二者为因果关系，与题干中的逻辑关系不一致，排除；B 项敲碎车窗是逃生自救的一种方式，二者构成方式目的对应关系，安全锤是敲碎车窗的工具，二者构成工具对应关系，与题干中的逻辑关系一致，当选；C 项设置防护是为了道路施工，二者构成方式目的对应，混凝土是道路施工时所需要的材料，二者构成原材料对应关系，与题干中的逻辑关系不一致，排除；D 项冷风侵入会导致肩周疼痛，二者为因果关系。与题干中的逻辑关系不一致，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-100","paperId":"gk2025-xz","num":100,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"行政文书对于（）相当于（）对于汇编语言","options":["行政机关；编程人员","行政管理；传送指令","商务文书；符号语言","监管函；计算机语言"],"answer":"D","explanation":"类比推理-逻辑关系-包容关系。将选项依次代入到题干中：A 项行政文书是行政机关在行政管理过程中形成和使用的各类文书，行政机关撰写行政文书，二者构成主宾关系。编程人员使用汇编语言进行编程，二者构成主宾关系，但词语前后顺序不一致，排除；B 项行政文书可以起到行政管理的作用，二者构成功能对应关系。汇编语言可以起到传送指令的作用，二者构成功能对应关系。但词语前后顺序反了，排除；C 项行政文书和商务文书是不同类型的文书，二者构成并列关系。汇编语言也称为符号语言，二者构成同一关系。前后逻辑关系不一致，排除；D 项监管函是行政文书的一种，二者构成种属关系。汇编语言是计算机语言的一种，二者构成种属关系。前后逻辑关系一致，当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-101","paperId":"gk2025-xz","num":101,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"研究者设计了一个“拔河比赛”的实验，要求被试分别在单独和群体的情境下拔河，同时用仪器来测量他们的拉力。结果发现随着被试人数的增加，平均每个被试使出的力减少了。据此研究者认为，提高团队业绩的最佳途径就是减少团队人数。下列选项如果为真，除哪项外均能质疑上述研究者的观点：","options":["团队合作中各取所长很重要，人数过少效率也会随之下降","团队一起工作时，个人的贡献不被凸显，很容易失去积极性","团队的合作与管理方式要比拔河复杂得多，不能一概而论","增强个体对团队的归属感、责任感，能够更好地提高团队业绩"],"answer":"B","explanation":"逻辑判断-论证-不能削弱。论点：提高团队业绩的最佳途径就是减少团队人数。论据：研究者设计了一个“拔河比赛”的实验，要求被试分别在单独和群体的情境下拔河，同时用仪器来测量他们的拉力。结果发现随着被试人数的增加，平均每个被试使出的力减少了。结合选项：A 项说明人数少效率会降低，说明减少团队人数并不是提高团队业绩的最佳途径，属于反向增加论据的削弱项，排除；B 项团队工作时，个人贡献不被凸显从而失去积极性，解释了随着被试人数的增加，平均每个被试使出的力减少了这一现象，属于增加论据的加强项，无法削弱，当选；C 项团队的合作与管理方式要比拔河复杂得多，不能一概而论，说明不能通过论据中的“拔河比赛”实验结果推导出论点中的团队合作与管理的情况，属于拆桥式的削弱项，排除；D 项增强个体对团队的归属感、责任感，能够更好地提高团队业绩，说明提高团队业绩的最佳途径并不是减少团队人数，属于反向增加论据的削弱项，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-102","paperId":"gk2025-xz","num":102,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"随着通货膨胀的蔓延，H国电子企业主要产品的原材料价格大幅上涨。该国最大的电子企业公报显示，今年该企业智能手机应用处理器价格较上年上涨30%，用于智能手机的相机模块价格上涨11%，用于电视和显示器的面板价格上涨9%。 H国经济界认为，电子企业原材料价格居高不下，将严重削弱该国电子企业在国际市场上的竞争力。以下哪项如果为真，最能支持上述结论：","options":["近年来，无论是国际还是国内，硅化合物价格始终呈上涨趋势，这是导致H国电子企业主要产品原材料价格大幅上涨的原因","在H国电子企业主要产品的原材料价格大幅上涨的同时，由于购买力下降等原因，电子产品的全球消费需求在缩减","其他国家电子企业都在通过科技创新降低产品原材料价格上涨的影响，以求通过低价在竞争激烈的国际电子产品市场中脱颖而出","一直以来，H国电子企业生产的产品以其卓越的技术和质量优势在国际市场上极具竞争力，近年来这种竞争优势在逐渐减弱"],"answer":"C","explanation":"逻辑判断-论证-加强论证-增加论据。论点：电子企业原材料价格居高不下，将严重削弱该国电子企业在国际市场上的竞争力。论据：今年该企业智能手机应用处理器价格较上年上涨30%，用于智能手机的相机模块价格上涨11%，用于电视和显示器的面板价格上涨 9%。结合选项：A 项说明硅化合物价格上涨导致H 国电子企业的原材料价格上涨，但论点讨论的是原材料价格与国际竞争力的关系，属于无关项，不能加强，排除；B 项讨论的是购买力下降导致电子产品需求缩减，而题干讨论的是电子企业原材料价格居高不下对企业国际市场竞争力的影响，论题不一致，属于无关项，排除；C 项其他国家通过科技创新来降低原材料上涨对他们的影响，说明H 国可能因为原材料的价格而导致它在国际竞争中处于劣势，属于增加论据的加强项，当选；D 项近年来H 国的优势正在逐渐减弱，但不清楚优势变弱是否是因为原材料导致的，属于不明确项，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-103","paperId":"gk2025-xz","num":103,"year":2025,"region":"国家","module":"判断推理","sub":"定义判断","stem":"考古人员发现了近300枚16亿年前的丝状体生物化石，这些丝状体均由巨型细胞组成，直径20~ 194微米不等。化石中，有些丝状体直径保持不变，细胞呈短柱状至长柱状；有些丝状体整体向一端均匀收缩，细胞呈柱状、桶状或杯状；而有的丝状体仅一端变细，形态呈现了一定的复杂性。考古人员据此认为，这些丝状体很可能属于真核生物。以下各项如果为真，除哪项外均能支持上述观点：","options":["这些化石中被发现有类似于现生繁殖细胞——孢子一样的圆形结构，这一结构只出现在真核生物中","原核生物细胞的直径一般小于2微米，而真核生物细胞的直径一般在10~ 100微米之间","在目前已知的原核生物中，大多数的丝状体形态都比较简单，只有个别呈现出过渡期形态","经比对，该化石中丝状体与一些现生绿藻（一种真核生物）的藻丝体形态、细胞大小分布和繁殖方式等最为接近"],"answer":"C","explanation":"逻辑判断-论证-不能加强。论点：这些丝状体很可能属于真核生物。论据：这些丝状体均由巨型细胞组成，直径20～194 微米不等。化石中，有些丝状体直径保持不变，细胞呈短柱状至长柱状；有些丝状体整体向一端均匀收缩，细胞呈柱状、桶状或杯状；而有的丝状体仅一端变细，形态呈现了一定的复杂性。结合选项：A 项说明化石中也存在类似孢子一样的圆形结构，而这一结构只出现在真核生物中，为论点增加论据，属于加强项，排除；B 项真核生物的直径在10～100 微米之间，而题干中发现的丝状体直径为20～194 微米，二者的直径范围有相似之处，建立了真核生物和丝状体之间的联系，属于搭桥的加强项，排除； C 项讨论的是原核生物中丝状体的形态特点，和论点讨论的是否属于真核生物无关，属于无关项，当选；D 项该化石中丝状体和一些现生绿藻的藻丝体相似，而现生绿藻属于一种真核生物，说明这些丝状体确实很可能属于真核生物，增加论据进行加强，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-104","paperId":"gk2025-xz","num":104,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"某项研究显示，与未接触空气污染的人相比，暴露于空气污染中的人死于乳腺癌的风险增加了80%，死于其他各类癌症的风险增加了22%。该研究团队由此认为，这可能与空气污染物中的PM2.5有关，因为PM2.5会导致脏器的炎症和氧化应激反应。以下哪项如果为真，最可能是上述专家预设的前提：","options":["脏器的炎症和氧化应激反应是明确的致癌危险因素","PM2.5在大气成分中含量较少，但对空气质量有重要影响","吸食香烟和电子烟等都可以将PM2.5直接输送到肺部","女性更易接触烹饪油烟，其中含有大量的PM2.5"],"answer":"A","explanation":"逻辑判断-论证-前提假设类论证。论点：死于癌症的风险可能与空气污染物中的 PM2.5 有关。论据：PM2.5 会导致脏器的炎症和氧化应激反应。结合选项：A 项脏器的炎症和氧化是明确的致癌危险因素，将“脏器的炎症和氧化应激反应”与“癌症”之间建立了联系，属于搭桥的加强项，当选；B 项说明PM2.5 对空气质量的影响，没有提及PM2.5 与癌症之间的关系，与论点讨论的论题不一致，属于无关项，排除；C 项吸食香烟和电子烟可以将 PM2.5 直接输送到肺部，但并未说明死于癌症的风险增加是否和空间中的PM2.5 有关，属于无关项，排除；D 项说明女性更适合烹饪，其中含有PM2.5，没有提及PM2.5 与癌症之间的关系，与论点讨论的论题不一致，属于无关项，排除。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-105","paperId":"gk2025-xz","num":105,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"某桃园5月份对其种植的蟠桃进行套袋。6月份，桃果出现异常，50克左右的大果很少；10余克的小果特别多，约占75%，正常情况下，此时果实应重50克左右。有人推测，今年出现小果占比过大是由于套袋较早造成的，因为过早套袋会使果实失去营养竞争力，在营养供应不足的情况下，果实竞争不过新梢。以下哪项如果为真，最能削弱上述推测：","options":["今年套果袋时果实大小基本一致，并且期间无病虫危害","纸袋的遮光作用影响果实光合能力，进而影响甜度","今年在没有分出大小果实就完成了疏除冗余幼果的操作，留下的不一定是优质大果","今年桃树长得太快，加之萌芽肥、花后肥都没有追施，导致后期果实营养供应不足根据所给材料，回答下面的问题：某科研机构今年拟举办甲、乙、丙、丁、戊、己、庚、辛8次学术会议，每个季度最多举办3次，且各次会议举办时间不重叠。具体安排要求如下：（ 1）丁、辛安排在第二季度；（ 2）甲、戊安排在同一个季度；（ 3）丁在乙之后丙之前举办；（ 4）丙在甲之前己之后举办。"],"answer":"D","explanation":"逻辑判断-论证-削弱论证-反向增加论据。论点：今年出现小果占比过大是由于套袋较早造成的。论据：过早套袋会使果实失去营养竞争力，在营养供应不足的情况下，果实竞争不过新梢。结合选项：A 项套果袋前果实大小基本一致，并且期间无病虫危害，排除了其他原因对果实大小的影响，属于排除他因的加强项，排除；B 项纸袋会影响甜度，论点讨论的是果实的大小，属于论题不一致的无关项，排除；C 项说明小果占比过大可能是因为没有分出大小果就完成了疏除冗余幼果的操作，而不是因为套袋过早导致的，属于反向增加论据的削弱项，保留；D 项今年桃树长得太快，加之萌芽肥、花后肥都没有追施从而导致后期果实营养供应不足，最终小果占比过大的现象，属于反向增加论据的削弱项，保留。对比C、 D 项，C 项说得是不一定，属于可能性的削弱，削弱力度没有D 项强，因此D 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-106","paperId":"gk2025-xz","num":106,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果第二季度只安排2次会议，那么以下哪次会议一定安排在第一季度：","options":["甲","乙","庚","丙"],"answer":"B","explanation":"逻辑判断-综合推理-套材料。根据条件（1）可知丁、辛在第二季度，而题干说明第二季度只安排2 次会议，因此第二季度只有丁和辛。根据条件（3）可知，乙在丁之前，因此乙在第一季度举办，B 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-107","paperId":"gk2025-xz","num":107,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"下列哪2次会议可以安排在第一季度：","options":["甲和戊","丙和丁","丁和己","己和庚"],"answer":"D","explanation":"逻辑判断-综合推理-套材料。根据条件（1）可知丁、辛在第二季度，因此排除B 项、C 项。再根据条件（3）（4）可知，甲前面有乙、丁、己、丙，而题干要求每个季度最多举办三次，因此甲不会在第一季度，排除A 项。因此D 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-108","paperId":"gk2025-xz","num":108,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果每个季度至少安排1次会议，并且最后一个季度仅安排1次会议，下列哪2次会议一定安排在第三季度：","options":["甲和戊","乙和丙","丙和己","己和庚"],"answer":"A","explanation":"逻辑判断-综合推理-套材料。根据条件（2）以及最后一个季度仅安排1 次会议可知，甲、戊不在第四季度。根据条件（3）、（4）可知，甲前面有乙、丁、己、丙。丁和辛在第二季度，每个季度最多举办3 次，且甲和戊必须在同一个季度，因此甲和戊在丁的后面，且不能在第二季度，只能在第三季度。因此A 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-109","paperId":"gk2025-xz","num":109,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果丙、戊安排在第四季度，下列哪2次会议可以安排在第三季度：","options":["甲和庚","乙和丁","乙和己","己和庚"],"answer":"D","explanation":"逻辑判断-综合推理-套材料。根据题干和条件（2）可知，丙、戊、甲都在第四季度，排除A 项。根据条件（2）、（3）可知，乙只能在第一季度或第二季度，不可能在第三季度，排除B 和C 项。因此D 项当选。","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-110","paperId":"gk2025-xz","num":110,"year":2025,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果甲安排在第三季度，第四季度不安排会议，庚不可能和哪次会议安排在同一个季度：","options":["乙","丙","己","辛"],"answer":"B","explanation":"逻辑判断-综合推理-套材料。根据题干和条件（1）、（2）以及甲安排在第三季度可知，丁和辛在第二季度，甲、戊在第三季度。此外，根据题干条件可知丙的顺序是在丁之后，甲之前，因此丙要么在第二季度，要么在第三季度，不管它在二、三季度中的哪一个，该季度将会有3 次会议。又因为每个季度最多举办3 次，因此丙所在的季度不可能有庚，庚不可能和丙在同一个季度。正确答案为B 项。资料分析","material":"","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-111","paperId":"gk2025-xz","num":111,"year":2025,"region":"国家","module":"资料分析","sub":"综合资料","stem":"截至2014年末，我国集成电路布图设计登记累计申请量在以下哪个范围内：","options":["0.8万-1.5万件之间","不到0.8万件","1.5万-2.2万件之间","超过2.2万件"],"answer":"C","explanation":"简单计算。数据定位文字材料和图形材料，可得：2014 年末累计申请量＝2023 年末累计申请量－2015 至2023 年申请量之和＝93147－（2058＋2360＋3228＋4431＋8319＋ 14375＋20353＋14403＋12503）＝11117 件≈1.1 万件。注：可以考虑截位估算（截到百位），所求约为931－（21＋24＋32＋44＋83＋144＋204 ＋144＋125）＝110，即约为1.1 万件。","material":"根据所给材料，回答下面的问题：截至2023年末，我国集成电路布图设计登记累计申请93147件，发证72378件，2024年1-4月，我国集成电路布图设计登记申请3503件，发证4189件。","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-112","paperId":"gk2025-xz","num":112,"year":2025,"region":"国家","module":"资料分析","sub":"综合资料","stem":"如2024年5-12月，我国集成电路布图设计登记月均发证量与1-4月水平相同，则2024年全年，我国集成电路布图设计登记发证量将比上年：","options":["下降不到20%","下降20%以上","上升不到20%","上升20%以上"],"answer":"B","explanation":"增长率-增长率的比较。数据定位图形材料可得：2018-2021 年申请量分别为4431 件、8319 件、14375 件、20353 件。根据公式：，则2019-2021 年同比增速分别约为（截位估算）：2019 年，；2020 年，；2021 年，。因此，2019-2021 年，申请量同比增速逐年下降。","material":"根据所给材料，回答下面的问题：截至2023年末，我国集成电路布图设计登记累计申请93147件，发证72378件，2024年1-4月，我国集成电路布图设计登记申请3503件，发证4189件。","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2025-xz-113","paperId":"gk2025-xz","num":113,"year":2025,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2019-2021年，我
