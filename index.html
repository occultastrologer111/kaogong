6000 元以上的受访者占，其比重比去年增加了4.2 个百分点。从婚姻状况来看，的受访者已婚，的受访者未婚，离婚和丧偶的受访者分别占和。","source":"2017年广州市公务员考试《行测》真题"},{"id":"gk2022-sl-01","paperId":"gk2022-sl","num":1,"year":2022,"region":"国家","module":"申论","sub":"归纳概括","kind":"essay","stem":"“给定资料1”反映了N市积极落实惠企政策的有关情况，请简述其主要做法及成效。(15分)\n要求：全面、准确、有条理。不超过250字。","options":[],"answer":"积极落实各项惠企政策，优化了营商环境，推动了区域经济高质量发展：1、专门开设绿色通道落实中央“两直”政策，为企业纾困解难。2、推出“免申即享”服务，增强企业获得感。3、主动“家访式”上门服务，现场解答政策红利，让企业清楚了解惠企政策。4、成立“帮办代办服务中心”，让企业少跑腿、好办事、不添堵。5、搭建“亲清家园”智慧服务平台，让惠企政策直达“准、快、实”。6、纪检监察机关跟进监督、精准监督、全程监督，让惠企政策落实更加公正、透明、高效。7、推出涉税业务全国通办，让异地办税“异地易办”。（245字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料一】\n新型冠状病毒肺炎疫情发生后，党中央、国务院出台了一系列支持企业发展的惠企政策。N市积极落实各项惠企政策，不断优化营商环境，推动区域经济高质量跨越式发展。 “当时举步维艰，那笔钱可真是雪中送炭啊。”宏远环保科技公司石经理现在回想起来，仍然有些感慨。疫情影响下，这家公司资金严重短缺，已经上马的技改项目濒临停滞。2020年7月，该公司通过N市“政策直给直兑”绿色通道申请了两项技改专项补贴和一项专利奖励。“星期一下午申报，星期三钱款就到账了。”高效的办事机制让石经理由衷地为政府点赞。为了积极落实中央的“两直”政策（即资金直达市县基层、直接惠企利民），市政府专门开设绿色通道，提前做好项目储备、底数核查等工作，确保了资金的及时、高效、精准分配，切实为企业纾困解难。腾飞电缆股份有限公司姚经理也对N市惠企政策的“秒兑”大加赞赏。2021年4月，这家公司意外地收到了一笔12万元的财政专项补贴款。“我们并没有提出申请，会不会是财政误拨？”姚经理专程到市财政局查询，工作人员告诉他，这是市政府新推出的“免申即享”服务，即通过各部门联动、资源整合和信息共享等方式，对符合条件的企业免于申报直接发放奖补资金，享受优惠政策，做到应享尽享、应兑尽兑，切实增强企业的获得感。“他们直接将企业经营数据和奖励政策相匹配，通过后台的数据分析和精准核查发现我们能够享受这个奖励政策，就直接把资金拨过来，真是太振奋人心了！”姚经理说。在一家大型数据集团，N市惠企政策兑现上门服务座谈会正在进行。市政府有关职能部门的工作人员通过“家访式”上门服务，现场解答这家民营高科技企业在人才引进、商标注册和专利申报等方面所能享受到的10多项政策红利。集团企宣孟总监深受触动：“有些方面的政策我们确实不是很清楚，他们主动告诉我们有哪些惠企政策，我们符合哪些方面的条件，还提醒我们抓紧时间申报，如果说以前是‘人找政策’那么现在就是‘政策找人’。”为切实做好惠企利企工作，N市还成立了“帮办代办服务中心”，由行政审批局组建了一支专业的惠企政策兑现帮办代办工作队伍，让企业少跑腿、好办事、不添堵。不久前，彗光科技有限公司狄总经理将写着“政企一家亲”的锦旗赠予“亲清家园”。N市依托5G互联网和大数据等新一代信息技术，搭建了“亲清家园”智慧服务平台，推行惠企政策“掌上提、在线批、直达付、全程督”服务模式，让惠企政策直达“准、快、实”。目前，已有经信局、人社局、生态环境局等14个涉企部门入驻“亲清家园”并提交了相关服务清单，开展互动联建活动。一旦发现企业有困难，平台就会根据目录分析所涉及的职能部门，迅速联系相关部门协调解决。 “乌家堡乡动物防检组杨某某等人在服务市场主体时接受宴请、收受礼品……”近日，市纪检监察机关连续通报损害营商环境案例多起，剑指以落实优惠政策之名损害企业利益、敲诈勒索、吃拿卡要等现象，对涉及的党员干部和单位集中曝光。市纪检监察机关以跟进监督、精准监督、全程监督等方式推动惠企政策真正落实，让企业真正定下心、稳住神。“通过‘亲清家园’平台中植入的‘智慧监督’功能，我们督促各部门梳理所有惠企政策，全部上线公开，实现全程无纸化在线申报、审批，对在规定时间内仍未外理的审批人员及时在线上提醒。”市纪检监察机关有关负责人介绍，这种“监督于问题未发之时”的方式，使惠企政策落实更加公正、透明、高效。他还说：“构建亲清政商关系，要求我们的干部既要当好‘店小二’，做到‘亲企’，又要筑牢‘防火墙’，做到‘清己’，有为且有畏。” 老陈是外省一家大型园林工程公司的财务负责人。去年，他们公司在N市承建了小区园林绿化工程。“跨省通办，还能一网通办，在家里点点鼠标就可以完成申报，真是省时省力，这在以前是不敢想象的！”刚办完业务的老陈感慨地说。以往，老陈要带上合同和企业证照到N市有关部门报验登记，再预缴申报增值税和附加税（费），按照18个月的工程周期算，要来回跑10多次。自从N市推出涉税业务全国通办以来，只需登录本地电子税务系统，几分钟即可完成跨省涉税业务办理。目前，N市已经实现了包括发票代开在内的108项政务服务跨省通办，“异地易办”正成为越来越多纳税人、缴费人的共同感受。","source":"2022年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2022-sl-02","paperId":"gk2022-sl","num":2,"year":2022,"region":"国家","module":"申论","sub":"综合分析","kind":"essay","stem":"根据给定材料2，谈谈“现在撤掉的是‘眼中的柜台’，但我们更要在撤掉‘心中的柜台’上下功夫”这句话的理解。（15分）\n要求：分析全面，条理清晰，不超过300字。","options":[],"answer":"撤掉“眼中的柜台”指服务形式的变化，撤销办事服务柜台，帮办员和群众并排坐在电脑前办理业务，这拉近了工作人员和群众的物理距离，沟通便利，办事轻松高效。撤掉“心中的柜台”指服务心理的变化，消除了工作人员和群众的心理距离，体现出了政府服务理念的转变。撤掉“眼中的柜台”是第一步，转变政府服务理念则是打造“无柜台，肩并肩”服务新模式的关键。要撤掉“心中的柜台”，一是工作人员要转变工作观念，快速适应平等沟通；二是重点培训，提升工作人员业务能力；三是行政管理体制改革同步推进，改善职能分工，促进沟通协调；四是采用信息技术手段，让办事更加便捷智能。（268字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料二】\n没有嘈杂的说话声，没有成群结队等候办事的群众，也没有柜台和窗口，取而代之的是一个咨询导办台和多张电脑桌，帮办员和群众两个一组，并排坐在电脑前办理业务。这是记者在Z县便民中心看到的场景。市民王女士带着材料前来办理一个餐饮公司的注册登记和食品经营许可证。看到王女士走下电梯，在咨询导办台前值守的导办员小葛马上迎去，问明来意后，小葛将王女士引导至受理服务区的一台电脑前就坐。紧接着帮办员小盛来到王女士旁边与她并排坐下。小盛一边查看材料，一边就有关问题进行交流，登录行政审批系统，录入信息，拍照上传......所有业务在愉快交谈中快速完成。王女士把小盛的一举一动全都看在眼里。“过去我们来办事，都是工作人员在柜台里面，我们在外面，总觉得里面的人高高在上。现在没有了柜台，与工作人员肩并肩坐着，看着整个办事过程，距离拉近了，相互沟通也更方便了。”王女士连连称赞。小丁是一家企业的员工，受公司负责人委托，来办理营业执照变更。他认为，以前隔着柜台和工作人员沟通，难免交流不畅，现在，“无柜台”的办理模式让办事群众可以在一旁观看每一步操作过程，同时，“无障碍”交流也让一件事情办下来更加轻松和高效。从“面对面”窗口受理到“肩并肩”帮办服务，看似是为民服务中心前台设置形式的一个小变化，背后却蕴含着政府服务理念的转变。“对于新的工作模式，刚开始时大家确实不是很适应，许多人有一定的心理落差，甚至有人抱怨。”为民服务中心的工作人员老冯说。习惯了前来办事人员的笑脸，要真正转变工作观念，确实不是一蹴而就的。目前Z县便民服务中心在综合受理区设立了25个工位，主要涉及不动产登记、税务、公积金等无差别全科受理事项。这样的变化对于工作人员的业务能力有了更高的要求。以往工作中，工作人员习惯了“铁路警察，各管一段”。改革初始，面对群众的多样化需求，不少受理人员茫然失措，疲于应付，不适应办理无差别全科受理事项。服务中心温主任说，他们第一时间加强了业务培训，特别是对高频事项的答疑、材料审核、系统录入等流程进行重点培训，做到群众“进一门、取一号、找一人、办成事”，但许多事项涉及到不同主管部门的职能分工，沟通协调起来确实不容易，要想真正做到位，必须和行政管理体制改革同步推进。 “我们都知道，去许多地方办事，都要首先取号。那如何能更便捷智能？我们通过对接政务服务2.0取叫号系统，完成取叫号信息，事项目录配置。办事群众可通过‘这里办’APP取号，通过大厅综合屏实时查看取号信息，也可通过手机出示‘云证通’中的二维码，窗口即可扫码，‘无感智办’，实现‘码上办事’。”温主任介绍道。服务柜台的撤销，消除了办事群众与审批受理人员之间的距离，提升了群众的获得感和满意感。温主任说：“通过打造‘无柜台，肩并肩’的服务新模式，我们希望更多的群众切实享受到改革带来的红利。现在撤掉的是‘眼中的柜台’，但我们更要在撤掉‘心中的柜台’上下功夫。”","source":"2022年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2022-sl-03","paperId":"gk2022-sl","num":3,"year":2022,"region":"国家","module":"申论","sub":"提出对策","kind":"essay","stem":"J市税务局积极优化税收服务，为群众办实事，采取了多项举措，效果良好，请根据材料3，就J市税务局如何进一步强化举措，巩固成果，形成长效机制，写一份工作建议。（20分）\n要求：（1）紧扣资料，内容全面；（2）建议具有针对性，可行性；（3）准确简明，条理清晰；（4）不超过500字。","options":[],"answer":"强化服务举措，巩固服务成果工作建议�� J市税务局积极采取多项举措优化税收服务效果良好。下一步要结合反馈，弥补不足，强化服务，建立长效机制，把为群众办实事做深做优。一、优化服务再升级。一是扩大“以数治税”的范围，探索实施所有全部业务线上办理，让数据跑路全面代替群众跑路。二是提升网上办事体验。调研群众需求与习惯，优化设计，简化操作流程。二、专项活动长效化。总结“服务怎样我体验，发现问题我整改”专项活动，针对群众好评做法，如“线上+线下”陪办服务，制定制度，设置专岗，形成服务模式长期开展。三、为偏远地区投入更多关怀。一是依托“互联网+政务服务”资源，开发更多应用场景，为山区群众提供更多便利。二是加强实地巡回指导，帮助乡村老人办理业务。四、政策辅导常态化。一是形成工作制度，让“春雨润苗”党员服务队定时定期进园区政策辅导。二是常态化设立便民办税服务热线，专人专岗接听答复，确保咨询服务畅通。五、办税服务更贴心。一是不断完善“办税指南针”，提供更有针对性服务。二是探索引入第三方服务，为小规模纳税人提供一对一辅导。（455字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料三】\n没想到现在只要网上提交资料就可以现场领票。近日市民小祝顺利拿到了购房发票，这是J市房屋不动产交易登记集成办理平台，开出的首张购房发票。自开展党史学习教育以来，J市税务局将党史学习教育与税收工作相结合，优化服务办实事，将与群众接触频次高、办理复杂的业务列为办实事的重点项目，打通多部门之间业务壁垒，实行多部门联办，不断推进“以数治税”，构建集成服务应用平台，数据跑路代替了群众跑路，办税缴费服务向智能化、数字化、场景化转变。身在外地的小李最近就感受到了这一转变。今年年初，小李在家乡购买了一套房产，但一直没空回乡办理不动产权证。小李与税务局的“税管家”对接后，经“云税驿站”一站式办理了不动产登记，很快就通过邮政专递拿到了不动产权证，“虽然在网上操作麻烦点，但与专程返回老家相比，还是省事多了。”小李说。 “明天就是征期了，网上申报一直不成功，这可怎么办呢？”税务局工作人员小赵接到一个求助电话，新气象包装有限公司法人巩先生在网上报税时遇到了难题，了解到巩先生在外地且对网上操作不太熟悉后，小赵通过屏幕共享功能，“手把手”协助他在云端办税。“税务人员可以直接看到我的操作界面，这样的辅导方式比自己看操作图解和视频要高效得多。”在小赵的同步指导下，巩先生顺利完成了申报。今年，J市税务局结合“服务怎样我体验，发现问题我整改”专项活动，推出“线上+线下”陪办服务新模式。线上，“云税官”通过云端实时辅导纳税人网上办税；线下，根据纳税人需求和实际状况，对“特殊业务、特殊人群、特殊事件”帮助协调各类涉税事项，让纳税人享受便利。“会不会专项活动结束后就没有这种帮助了？”巩先生有点担心，他希望这一服务模式可以长期延续下去。 J市西部是典型的山区。以往，当地群众在服务延伸点自助办税遇到困难，往往需要电话连线或者到办税服务厅处理，但是存在处理效率低，路途耗时长等问题。对此，当地税务部门依托“互联网+政务服务”资源，为办理基础涉税业务的纳税人提供了具有清晰指引功能的二维码。简单扫一扫，跳出的页面就能将办税所需的关键信息一次性告知纳税人，让纳税人办税时间变得更短、办税渠道变得更宽。对于有些群众，尤其是老年人不会扫码、误操作甚至担心上当受骗等问题，税务部门负责人表示，他们会考虑派人实地巡回指导，进乡入村帮助办理业务。前不久，J市税务局“春雨润苗”党员服务队走进该市特色小微企业示范园工业区，为园区内新入驻的42家小微企业开展政策辅导。华荣再生资源利用有限公司办税人员小夏开心地说：“国家政策给力，纳税服务到位。有清单、有详情，还有解释，税惠政策在税务干部的梳理和讲解下，让人一目了然！这样的活动如果能定时定期地开展就更好了。”此外，J市税务局还设立了“春雨润苗”便民办税服务热线，抽调党员业务骨干专门负责接听答复，确保纳税人、缴费人涉税电话咨询“打得通”“答得清”“办得好”。 “简明易懂的‘办税指南针’特别实用，只需要按照上面的步骤来操作，很快就能办理完成。”小锦鲤海鲜烧烤大排档的蔡老板分享了他近日的办税体验，“税务部门服务越来越贴心了。很多像我们店一样的个体工商户，规模小，没有条件聘请专业的财务人员。随着办税‘指南针’等有针对性服务举措的推出，我们这些非专业人员办起来也比较高效。不过我听别人说，有些地方的税务局在大厅中引入了第三方服务，可以专门为小规模纳税人提供‘一对一’辅导，我觉得本地税务局也可以借鉴。”","source":"2022年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2022-sl-04","paperId":"gk2022-sl","num":4,"year":2022,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"有关部门拟召开一场以“严执法，优服务，促发展”为主题的经验交流会。请根据“给定资料4”，撰写一份关于L海关的工作经验交流材料提纲。(20分)\n要求：（1）紧扣资料，内容全面；（2）准确简明，条理清晰；（3）不超过500字。","options":[],"answer":"严格执法，主动服务，为发展保驾护航 S省河西地区是全国最大的蔬菜、花卉外繁制种基地。L市海关，强化种子出入境检疫监管，强化企业进出口政策辅导，服务特色支柱产业发展，有效带动了群众增收致富。一、监管体系科学完备。不断总结监管经验，形成科学完备的检疫监管体系，为外繁制种产业健康发展保驾护航。二、应对新规主动帮扶。针对进出口政策变化，反应迅速，主动组织有关专家为企业详细解读新规，并“一对一”指导，帮助企业积极应对国外技术性贸易措施变化，避免了重大损失。三、技术支撑强而有力。建设全国唯一的外繁种子检疫国家重点实验室，用先进技术护航产业发展。四、特事专办助企解困。针对国外原种“进口难”，特事专办，全面分析了问题，指导企业多样化选择原种进口方式，帮助企业解决“引种难”问题。五、数字赋能不断创新。探索检疫监管模式，全面推广上线“预约通关网上办理平台”，解决非正常办公时间办理通关手续问难题，持续提升通关效率。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料四】\nS省河西地区是全国最大的蔬菜、花卉外繁制种基地。该地每年大量进口国外原种，繁育成熟后再次出口，是当地农业特色支柱产业。种子进出境检验检疫是当地L海关的重点业务工作之一。在一片南瓜田里，L海关工作人员小潘和同事手中拿着放大镜，仔细观察一株秧苗。“苗期病虫害监测至关重要，是外来有害生物早发现、早防治的关键环节。这株秧苗叶子打卷、边缘焦黄，受虫害影响严重，需要取样送实验室检测。”两人一边说着，一边迅速取样、封样、登记，整套程序行云流水，专业而娴熟。进境种子可能携带外来有害生物，外来有害生物一旦传入，将对当地农林业生产和生态安全造成不可估量的损失。多年来，L海关不断总结监管经验，形成了科学完备的检疫监管体系，切实为外繁制种产业健康发展保驾护航。“海关人员专业负责，在加强进境原种抽样检测的同时，每年在种子育苗期、生长期分3次开展田间病虫害监测，把病虫害扼杀在初始阶段，这有效避免了病虫害的蔓延。以前就曾出现过在种子出口检疫中发现病虫害而造成重大损失的情况。”东方种子有限公司负责人说。 2021年初，欧洲某国发布了种子进口新规定，对进口种子取样、检测和植物检疫证书提出新要求。“我们公司的种子主要出口该国。新规发布后，公司上下都很紧张。”当地知名企业正红种子有限公司负责人说。L海关反应迅速，主动组织有关专家为企业详细解读新规具体内容，通过深入浅出的讲解和“一对一”指导，帮助企业积极应对，避免了重大损失。“下一步，我们将对国外技术性贸易措施进行跟踪研究和评估，及时提出针对性应对措施和建议，让企业能够有效应对国外技术性贸易措施变化。”海关有关负责人说。 L海关拥有全国唯一的外繁种子检疫国家重点实验室。经过多年的投入、完善和优化，实验室在外繁种子主要病虫害检测技术、除害处理技术和品质检验能力等方面都提供了强有力的技术支撑。L海关技术中心相关负责人表示：“科技在产业发展中的引领作用会更加突出。不久前，中国检验检疫科学研究院与我们海关合作建立了‘种子健康研究中心’。我们将继续加强实验室建设，探索建立外繁制种监管信息化平台，通过大数据比对，提高检测的针对性和检出率，用先进技术护航产业发展。” 去年以来，受多种因素影响，国际航空口岸进境航班大幅减少，造成国外原种“进口难”，严重影响外繁制种企业育种。L海关急企业所急，特事专办，全面分析了进口原种遇到的问题，指导企业多样化选择原种进口方式，针对性地帮助企业解决“引种难”问题。对于暂停航线国家和地区的原种，建议通过相邻国家转关进口，或办理检疫审批手线后，通过国际快递的形式进口原种。同时，积极对接相关部门，为进境种子优先配舱、强化全国“一体化”通关。L海关着力落实种子查验送检“预提离”制度，对于系统布控需进行实验室检测的种子，经收发货人或其代理人提交承诺书，可先行提离，优先保障育种工作顺利开展。今年春季，L海关共计检疫监管进境种子113票，取样送检66票，企业“预提离”65票，有效解决了企业难题。 “以前，我们企业遇到海关非正常办公时间需要办理通关手续的情况，可以向海关申请预约通关，但需要派人到海关现场递交纸本申请材料。自从海关全面推广上线‘预约通关网上办理平台’后，我们足不出户就能提交申请、办结通关手续，这在以前是难以做到的。我们知道，这一切的背后是海关工作人员的辛苦和付出，他们真正做到了‘7×24’预约通关和查验服务。”L海关不断创新检疫监管模式，持续提升通关效率，支持全省外繁种子扩大出口。今年上半年，S省出口种子货值超1.6亿元，有效带动了当地群众增收致富。","source":"2022年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2022-sl-05","paperId":"gk2022-sl","num":5,"year":2022,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"《反食品浪费法》实施后，G市市场监管局出具的首张《责令改正通知书》引发了社会热议。请根据材料5，以G市市场监管局的名义写一封公开信，回应社会关切，正确引领舆论，营造良好的执法环境。（30分）\n要求：（1）观点鲜明，内容全面；（2）逻辑清晰，用语恰当；（3）字数800-1000字。","options":[],"answer":"致广大市民和网友的公开信各位市民、各位网友： 5月11日，我局执法人员在执法过程中发现某中学食堂存在蔬菜过度挑选问题，根据《反食品浪费法》等相关法律规定，经核认事实和履行法定程序后，向该中学食堂发出了《责令改正通知书》并对当事人进行了约谈。此事引发广泛热议，为回应社会关切，现做如下说明：一、食品浪费既是失德，更是违法。谁知盘中餐，粒粒皆辛苦。当下，我国每年浪费的食物数量十分惊人，不但造成了巨大的经济浪费，而且处理食品垃圾所也严重破坏了自然环境。如今，违反食品浪费有法可依，我们应该“零容忍”，通过法的威慑力扼制食品浪费的歪风，让勤俭节约之风成为全社会的共同遵从。二、针对浪费食物现象严格执法，是市场监管部门的职责所在。做为市场监管部门，严格执行法律要求，通过严格执法遏止食品浪费行为，提高全社会节约意识和水平，责无旁贷。我们对该中学蔬菜过度挑选问题约谈整改，主要目的就在于督促纠正违法行为，防止食品浪费。三、《反食品浪费法》刚刚开始施行，相关配套文件、细则尚未完善，此首次执法尚有不足。一是评判食品浪费的标准不够精确，“蔬菜叶有虫眼或稍微泛黄”是否影响食品安全需进一步确认。二是整改建议考虑欠缺，“不太好看但还能吃”的食材如何处理还需结合实际考量。四、万事开头难，但改进工作永无止境。执法环节做得好是法律能够落地的关键。此次“争议执法”反映出我们执法能力还需进一步提高。接下来，一是进一步对《反食品浪费法》开展专项学习和研究，更加充分细致领悟其中的精神，让法律更好落地落实、见行见效。二是进一步调研论证，细化G市反食品浪费执法的具体办法。我局将结合G市实际情况和需求，充分吸取广大人民群众、市场主体、专家学者等多方面的意见和建议，加强与上级和其他部门协作，让执法判定标准更具科学性和可操作性。五、鼓励社会参与，强化社会宣传，共同探索建立反食品浪费配套措施。下一步将积极倡导超市、餐饮、学校等社会组织，协调和民政、教育等部门，研究探索搭建规范、可行的食品捐赠平台和规范，让安全健康的剩余食材或食品得以有效利用，避免浪费。最后，感谢社会各界对我们工作的严格监督和意见建议！节约粮食，人人有责！让我们携起手来，为营造反对食品浪费的良好执法环境，营造全社会勤俭节约之风而努力！ G市市场监督管理局 2021年X月X日","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料五】\n21年4月29日《中华人民共和国反食品浪费法》（以下简称反食品浪费法）经第十三届全国人民代表大会常务委员会第二十八次会议通过并颁布实施。5月11日，G市市场监管局向当地一所中学发出《责令改正通知书》，并对当事人进行了约谈，其原因是执法人员发现该中学食堂存在蔬菜过度挑选问题——“蔬菜叶有虫眼或稍微泛黄，能吃却全被当垃圾扔掉”。此外执法人员还给出建议：不太好看但还能吃的食材，可以员工内部消化，或定向捐给一些社会组织，尽量做到物尽其用，不浪费。这被认为是自《反食品浪费法》实施之后，G市市场监管局开出的首张罚单，由此引发了社会热议。学生家长黎女士：菜叶出现泛黄等情形，实际上不单只是一个品相上“不太好看”的问题，而是食品质量已出现质变的征兆。食堂工作人员扔掉这些蔬菜，是希望学生能吃上更新鲜的蔬菜。孩子在这样的食堂吃才能保证食品安全，我们家长才能放心。这样的良心食堂应该表扬，怎么能罚？该中学后勤中心主任：对于什么情况下食材可以食用，什么情况下必须丢弃，这个尺度不太好掌握。有虫眼或泛黄菜叶给孩子吃吧，传出去就是“烂菜叶”；不给孩子吃吧，扔了又是“浪费食物”，真是太难了！这是一场食品安全和食品浪费的打架！有时候看着食堂没有卖掉的饭菜被倒掉，确实也觉得可惜，可是什么能捐？捐到哪里？怎么捐？没有规范的捐赠平台和制度，我们也无从下手。某律师：要科学准确、令人信服地判断扔掉某种食品食材的行为是否属于浪费，相关执法判断标准不宜仅简单凭借执法人员从感官上笼统地判断为“还能吃”，应当进一步拿出更确凿的、具有说服力且更具可操作性的配套执行操作标准。法学研究会某理事：反食品浪费是全社会的责任，简单来说，做饭者、卖饭者和吃饭者，各方都有责任，也都有义务，其责任主体超过了其他法律，这是《反食品浪费法》的一大特点。当前，由于我国各地的经济发展水平不同，饮食结构、饮食习惯等存在差异，法律不能一刀切地制定一个统一的标准，只能作原则性规定。这就要求地方根据具体情况和实际需要，制定本地反食品浪费的具体办法，要保证立法质量，每一条规定、罚则都要有科学依据，应充分动员社会各方面发表意见，充分吸纳群众的建议。某大学法学教授：“争议性”执法并不可怕，可怕的是执法者在实际执法过程中，未能真正吃透法律精神，直接“照搬”条文或者其他情况下的执法经验。有的甚至拿法律当标枪，作为政绩宣传冲业绩的工具。这不仅远离了法律制度设置的初衷，更是远离了民意。不希望条分缕析的法律，被当作工具用来上纲上线，而应文以致用，读懂生活，读懂民心。同时，针对复杂多样的社会实际，只有深入具体的生活案例中，法律才有生命。网民甲：我国每年浪费的食物数量十分惊人。有一项调查表明，某大学食堂倒掉的饭菜占学生购买饭菜总量的28.3%。成由勤俭败由奢，浪费食物不但造成了巨大的经济浪费，而且处理食品垃圾所释放出的气体会产生温室效应，也严重破坏了自然环境。现在，反食品浪费既然有法可依，就应该“零容忍”，这样才能在全社会有效扼杀食品浪费的歪风邪气，形成厉行节俭之风。网民乙：执法部门的人员给出的建议逻辑有问题。难道内部员工、其他社会组织的人员食品安全标准就可以降格？合理的建议推动执法精确化，不恰当的提议会影响执法的公信力。网民丙：《反食品浪费法》的出台，是基于我国粮食的供求矛盾，意在解决生活中粮食浪费现象严重的问题。另外，食品生产不能只算经济账，还要算上违法的代价。而且学校本来就是教育人的地方，更应该率先垂范，厉行节约，杜绝浪费，食堂这种行为不利于勤俭节约校风的形成。","source":"2022年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2023-sl-01","paperId":"gk2023-sl","num":1,"year":2023,"region":"国家","module":"申论","sub":"归纳概括","kind":"essay","stem":"GEP反映了生态系统产生的直接、间接或潜在的经济效益。请你根据“给定资料1”，谈谈A市是如何利用GEP核算实现生态产品价值的。（10分）\n要求：全面、准确、有条理。不超过200字。","options":[],"answer":"一是打好基础：制定核算方法对生态产品价值进行评估、核算。二是发挥GEP报告作用：认识生态资源价值，加速转化；针对性强优势补短板，把生态优势转化为产业优势。三是创造条件：组建生态强村公司，形成市场交易主体；金融支持，推出“GEP贷”。四是探索实现模式：与企业合作开发生态资源，直接创造价值；吸引环境敏感型企业落户，生态产品价值参与合作企业利润分配；应用在碳汇市场，激励企业推行低碳生产，获益资金又反哺生态建设。（200字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料一】\n翻开A市地图，仿佛能看到林海苍翠、流水潺潺，一幅美丽的画卷徐徐展开，跃然眼前。今天，当清新的空气、清澈的溪流也能“卖”上大价钱时，GEP正成为A市缩小与省内其他地区发展差距的一个突破口。 2018年，习近平总书记在深入推动长江经济带发展座谈会上强调，要选择具备条件的地区开展生态产品价值实现机制试点。而A市，正是生态产品价值实现机制试点城市之一。 “所谓GEP，是指生态产品价值的总和，它反映了森林、湿地和农田等生态系统产生的直接、间接或潜在的经济效益。”A市生态环境局赵局长介绍，“我们制定了一套GEP核算方法，对生态产品价值进行评估、核算，并积极探索核算结果落地应用，助力我市加快推进生态产品价值实现。” 碧澜乡是A市一个山区乡镇。对这里的村民来说，以前开农家乐是可以想象得到的致富来源，但GEP核算告诉他们，还有另外的致富之路。碧澜乡的溪流不但拥有矿泉水般的水质，而且水流形态丰富，急流种类多样，是天然的水域救援训练场地。乡里利用这一优势，开发了水域救援培训项目。碧澜乡党委王书记说：“从原生态的水到致富的水，GEP核算起到了加速转化的作用。GEP核算报告让我们知道生态资源究竟好在哪儿，进而合理有序地转化为经济效益。” 不仅碧澜乡，对A市其他乡镇来说，这种发展思路都具有实际指导意义。云瀑乡党委李书记说，如果不是看到GEP核算报告，他实在不敢想，云瀑乡的峡谷、瀑布、云海，放在整个A市都颇有竞争力。云瀑乡已经和一家公司进行合作，在当地开发探险类项目和梯田观光项目。相应的，该公司向云瀑乡生态强村公司支付300万元，购买项目所在区域的生态产品，形成良性循环。截至2021年底，A市所有乡镇均组建了生态强村公司，主攻生态产品价值转化，负责自然资源管理与开发、生态环境保护与修复等，成为公共生态产品的供给主体和市场化交易主体。金融市场也闻风而动，“GEP贷”等金融产品应运而生。在蕊溪岸边，芳草镇党委马书记介绍，镇里新开发了“溪游记”旅游项目，将蕊溪流域丰富的生态资源串点成线，建成后有望成为拉动全镇经济的重要引擎。芳草镇虽然成立了生态强村公司，公司却没有实体抵押物，想要贷款融资并不容易。2022年3月，以芳草镇调节服务类和文化服务类两类生态产品的使用经营权作为质押担保，他们拿到了500万元的“GEP贷”。这不仅解决了旅游项目建设的资金需求，也激活了生态产品的金融属性。常年奔波在A市的乡村，某大学经济学院黄教授深谙GEP核算的魅力。他表示，GEP核算报告就像人的体检报告，各地可以根据报告来强优势、补短板，推动生态优势转化为产业优势。这样的探索在A市已经展开。比如，一批电子仪器企业、医药公司等环境敏感型企业纷纷选择在A市落户，某医药公司董事长说：“生产高品质的医药容器对环境有着严格的要求，A市具有无可比拟的一流生态环境，这是我们选择这里的根本原因。” 位于A市景叶县的“天工之城”——未来科技岛，也正在尝试。山水之间，一批高新技术企业已逐绿而来。景叶县两山转化发展中心工作人员方女士介绍：“我们把生态产品价值作为生产要素参与合作企业的利润分配，实现经济创收。我们正在做的一件事，就是把‘生态绿谷’转化为‘数字绿谷’。” 日前，A市“两山银行”与明渚乡签下首笔湿地碳汇收储合约，以每吨58.83元的价格购入明渚乡湿地一万吨碳汇量。同时，“两山银行”又向该市农商银行等9家单位分别出售碳汇量，这也是A市将GEP核算应用到碳汇市场的首次尝试。 “党的二十大报告提出积极稳妥推进碳达峰碳中和，湿地碳汇交易就是利用湿地植物光合作用吸收二氧化碳释放氧气的过程，实现碳减排；再将所减排的碳量用于市场交易，实现碳中和。”赵局长表示，“这既可鼓励企业参与生态保护，也能激励企业推行低碳生产。碳汇交易的获益资金还可用于湿地绿化扩面、修复等工作，反哺湿地生态建设，进一步提升生态系统碳汇能力，可谓一举多得。”","source":"2023年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2023-sl-02","paperId":"gk2023-sl","num":2,"year":2023,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"H市计划召开关于促进本市“无人经济”新业态健康发展的座谈会，假如你是市场监管部门的参会代表，将在座谈会上发言，请根据“给定资料2”，写一份发言提纲。（20分）\n要求：（1）紧扣资料，内容具体；（2）层次分明，有逻辑性；（3）不超过450字。","options":[],"answer":"无人经济”要“有人”监管 “无人经济”迅猛发展，满足人们新需求。无人配送、无人书店、无人宾馆、无人停车场等新业态，满足了消费者对安全、便利和多元生活的需求，发展空间和潜力巨大。发展背后亦有安全隐忧和监管不足。一是无人设备有故障风险，威胁用户安全。一是缺乏政策指引和法律规范。三是产品品质良莠不齐，投诉难。四是经营范围不清，相关许可证发放依据不清。五是有监管盲区，引发问题影响无人经济声誉且有安全隐患。加强监管，势在必行。一是坚守底线思维，科学监管，防止野蛮生长。二是加强立法和政策制定，使无人经济发展有规范、指引有政策。三是要明确监管主体和监管责任。抓住新业态本质，如无人宾馆按照酒店业相关制度进行管理，由对应部门履行监管职责。四是督促企业对无人设备定期维护，消除安全隐患。五是加强监督，针对群众监督和投诉整改问题企业，督促企业完善售后服务保障消费者权益。六是注重监管创新，结合无人经济业态的特殊性，召集专家联合审议，提供科学的审批标准和依据。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料二】\n“您的配送订单已送达。”H市金禾区的陆先生日前网购水果，打来电话的是一位特殊的“配送员”——无人配送车“小暖”。“受疫情影响出门少了，加上年纪大了，行动不方便，这无人配送车真是太贴心了！”陆先生说。某快递公司负责人介绍：“这几年，越来越多的客户倾向选择无接触配送服务，我们的无人配送车可完成10公里范围内的配送任务，可以解决末端配送问题，同时减少人际接触带来的潜在感染风险。目前公司的无人配送项目已落地省内多个城市，未来规模会继续扩大。” 住在H市启阳区的林女士已经习惯小区旁边的无人便利店。“我去便利店有时就是随意逛逛，以前的商店进去后经常有售货员跟着，还时不时推荐产品，现在有了无人便利店，自在多了。”对此也有小区居民表达了担心：“虽然选完东西手机扫码付完款，店门就开了，方便又合理，但得确保机器不会出现故障。万一打不开店门被关在里面，而解决问题的人又不在现场，就麻烦了。” 在全国其他地方，还有众多无人书店、无人宾馆、无人停车场等，这些丰富的“无人经济”新业态，满足了消费者对安全、便利和多元生活的需求，拥有很大的发展空间和潜力。不过，整体来看，我国“无人经济”仍处于起步阶段，缺乏相关政策的指引和法律条文的规范。位于H市胜利路的一家面馆——“阿强热汤鲜面”生意火爆，这家小面馆，没有厨师和服务员，更没有收银员，是货真价实的无人餐厅。前来就餐的顾客，可以全程自助完成点餐、取餐和收餐，从手机扫码下单到出餐不超过3分钟。自从今年4月开张以来，每天都有几百名顾客来到这家店里尝鲜。附近上班的甄女士表示，自己经常来这里吃碗汤面再去上班。“店里出餐快，结账方便，节约了很多时间。但也有让我觉得不好的时候，比如有两次汤面里的肉片没煮透，向商家投诉索赔，回应也比较慢。”甄女士说。类似的无人面馆在H市有不少家，但品质良莠不齐。H市有关监管部门曾收到举报，某无人面馆食品经营项目中没有冷食类食品制售，但店里有凉菜销售。“这的确是一个全新的业态，我们持开放和欢迎的态度，但前提是它不能违法违规，且食品安全风险充分可控。”H市有关监管部门负责人表示。某无人咖啡屋的现制现售食品机里包含咖啡豆、茶叶、各种粉料、液态奶品……此前，H市从未有过包含如此多品种的现制现售食品机，几乎没有现成的经营许可审批标准可以遵循。相关部门召集食品安全机构、微生物研究机构、农业部门、疾控中心等各方专家，采用“客观报告+专家评审”的方式联合审议，面对新问题，有的专家会凭以往经验直言“这样不行”，但难以提供权威依据。有关负责人坦言，在现有的食品经营许可审批体系里，这些新兴业态主体一直存在经营范围不明，相关许可证发放依据不清等问题。 “无人经济”的出现，是酒店业发展突破成本困境的一个机遇。H市有多家无人宾馆，可自助入住，机器人辅助管理，操作便捷且私密性好，提升了消费者的入住体验，但也带来了一些问题。比如无人宾馆容易成为一些不法分子实施违法犯罪行为的场所；未取得卫生许可证和特种行业许可证、未经消防安全检查、未安装住宿登记上传系统也成为无人宾馆的常见现象，很容易引发经营操作不规范、更换用品不及时、消毒不彻底等问题。这些不仅影响无人宾馆的声誉，也给社会带来了安全隐患。 “现在的无人宾馆基本处于监管盲区，关于如何科学监管，有关部门应持审慎的态度，坚守底线思维，加强监管，防止野蛮生长。解决这个问题首先要明确监管主体和监管职责。”某大学法学教授表示，“无人宾馆虽为新业态，但本质上还是酒店、旅馆，应依照治安管理处罚法、旅馆业治安管理办法、公共场所卫生管理条例等进行管理，并由多个职能部门履行相关监管职责。”","source":"2023年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2023-sl-03","paperId":"gk2023-sl","num":3,"year":2023,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"D市语言文字规范化联合整治工作组拟向上级汇报实施整治工作的思路。请你根据“给定资料3”，草拟一份汇报提纲。（20分）\n要求：（1）内容全面，重点突出；（2）层次分明，条理清晰；（3）不超过450字。","options":[],"answer":"多措并举，扎实推进语言文字规范化整治工作语言文字事业意义重大，在党和国家工作大局中具有重要地位和作用。为大力推进语言文字规范化标准化建设，整治工作组按市政府相关要求，将实施为期两月的整治工作。一、协调配合，提升联合治理效能。市政府牵头组织，市场监管局、城管执法队、文化出版局等多部门参与，加强统筹协调，提高治理效能。二、与时俱进，明确不规范文字的内涵，对不符合语言文字本身演变规律的坚决杜绝。三、压实责任，重点领域治理同步推进。一是城管执法队加强户外标牌不规范文字的纠错整改力度。二是网信部门协调网络平台，倡议用户规范表达，明确平台规则提升审核水平。三是文化出版部门，加强媒体节目、出版物的规范用字自查整改。四、重视宣传引导。一是加强向商家宣传国家通用语言文字法相关规定，提高规范用字意识。二是加强学校教育，向学生宣传不规范网络语言的负面影响，提高对汉字敬畏之心。五、强化行业自律。指导相关行业协会规范用字倡议，引导出版、影视、媒体领域提升规范用字的自觉意识。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料三】\n“你们这个‘樂’是繁体字。根据国家通用语言文字法，招牌、广告用字应该使用规范汉字，这种简体字和繁体字混用是不规范的。”今年2月份，D市城管执法队联合市语言文字工作委员会、市场监管局等部门，对部分不规范的招牌、广告用字进行纠错，并劝导商家进行整改。执法人员看到，招牌和广告中用字不规范、不正确的现象比比皆是。有的把“啤酒”写成“啤九”，有的把“是的”写成“是滴”，还有的把“鸡蛋”写成“鸡旦”，对此，商家负责人表示，店里招牌是广告公司做的，他们也没注意到这个问题，接下来会尽快纠正。执法人员了解到，很多商家并不清楚国家通用语言文字法相关规定，招牌设计主要考虑的是引人注目，对于如何规范用字并不清楚。“这说明宣传力度还不够，接下来，我们会建议有关部门加强宣传，提高商家规范用字的意识。”执法队邓队长说。“应当强化户外设施语言文字规范化使用的整治力度，坚持规范使用汉字，这才是文明城市该有的样子！”一位市民建议。你听说过“栓Q”吗？你知道“蚌埠住了”是什么意思吗？不知从何时起，我们的生活正在被一些奇奇怪怪的互联网“黑话”所包围，大家跟风使用，张口就来。甚至有些网络平台为博取眼球故意制造错别字，还认为这是语言的个性化表达。对于这些现象，某出版社王社长表示：“我们正在跨入信息时代，人人都有可能参与语言文字的创新，惊人的网络传播速度又使个性化的语言迅速流行。为此，语言文字的规范化内涵必须与时俱进，不断变化，才能跟上时代的步伐。对于一些新兴事物，不妨可以试试让它们在发展中规范，在规范中发展。但是，语言文字规范化内涵的变化必须符合语言文字本身演变的规律。对于一些极其不规范，甚至是错误的网络语言，应该坚决杜绝，它们不但污染了我们的交流环境，也造成了语言文字使用的混乱。” D市某高校丁教授说：“汉字是中华民族的伟大发明和智慧结晶，作为中华文化最主要的载体，承载着中华民族最深沉的精神诉求，是维系国家统一和民族团结最强大又无可替代的纽带。因此，我们对汉字要有敬畏之心，如果缺乏这种敬畏之心，就容易造成文字错乱、语言不规范等一系列问题。这些错误的语言文字对我们的下一代影响最大，不规范的网络语言长期、频繁地使用，必定会对青少年语文素养的培养造成消极影响。” 近来，多家知名网络平台接连发布声明称，将规范汉字使用，维护清朗的网络空间。某平台解释称，此前之所以存在少数用户使用一些不规范表达的现象，是由于平台规则介绍不够清晰，网友对平台规则缺乏了解，误以为一些正常的词语是所谓的“敏感词”。为了明确平台规则、避免不必要的误解，该平台发布《关于创作规范表达的说明》，归纳并公布了包括“多少钱”“福利”“直播间”等日常高频使用的词语，倡议用户使用规范表达。例如，正常情况下，用户在平台使用词语“多少钱”时，不需使用“多少米”来代替，“福利”不必用“浮力”来表达。该平台表示，将持续总结不规范使用汉字现象并定期公布，推进平台规则的透明化，不断提升审核水平。汉字书写领域也出现了一些故意将汉字笔画和结构进行粗俗、夸张变形的“丑书”“怪书”现象。例如，除古今知名书法家的书迹外，一些明星、网红等人员的手写体也进入字库，出现笔画多余、部件错误、偏旁混淆、繁简混杂等问题。这些拙劣的字体产品被部分出版物、电视和网络视听节目等大众传媒使用，给汉字规范化使用带来了新的冲击。 “汉字是记录中华文化的符号系统，几千年来，更是发展出了书法这一独特的艺术形式，体现了中国人的审美情趣和精神追求。如果任由所谓的‘江湖字体’泛滥，会让人对中华文化产生严重的误解。”D市书法家协会于会长对拙劣字体深感痛心，“各出版单位应加强自查，不合格就不能出版。政府也要指导相关行业协会联合发出规范用字倡议，遴选推荐优秀字体，引导出版、影视、媒体领域提升规范用字的自觉意识。” 2021年年末，全面加强新时代语言文字工作的意见向社会公布，指出语言文字事业是国家综合实力的重要支撑，在党和国家工作大局中具有重要地位和作用。为进一步贯彻落实国家要求，大力推进语言文字规范化标准化建设，2022年10月，D市政府组织各相关部门召开语言文字规范化工作会议，会议提出由市政府牵头组织成立语言文字规范化联合整治工作组，于2022年12月起对全市范围内广告载体、标志牌、出版物、电视和网络视听节目等所有面向公众的示意性语言文字的使用情况，实施为期两个月的整治工作。","source":"2023年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2023-sl-04","paperId":"gk2023-sl","num":4,"year":2023,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"有关部门正在征集知识产权服务优秀案例，计划编印《知识产权服务案例汇编》。假如L市知识产权信息服务中心的相关实践入选为优秀案例，请你根据“给定资料4”，撰写一篇案例摘要。（15分）\n要求：（1）紧扣资料，内容全面，突出做法和意义；（2）表述准确，条理清晰；（3）不超过300字。","options":[],"answer":"L市知识产权信息服务中心成立于2017年10月，其立足主要职能，大力推动市场主体对知识产权制度的有效运用，探索出了新时代知识产权事业发展的新方向。2018年派专项组进驻各乡镇，指导“川兴米粉”成为国家地理标志产品，通过统一标准走上高质量发展“快车道”。协助企业分析研判发展“痛点”，为“丰禾庄园”草莓注入科技基因，引进高垄种植技术，助力赢得市场。为“伊山山珍”品牌商标注册量身定制工作方案助力品牌建设，培训商标持有人提升知识产权保护意识，指导制定商标使用办法，联合多个部门合力推动“企业+地理标志商标+标准化+农户”模式，重点推广当地主导产业，提升信任，带动销量，最终形成了受顾客青睐市场欢迎的多种拳头产品。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料四】\n“随着我国创新型国家建设和知识产权战略实施的不断推进，政府知识产权工作的着力点，已从知识产权制度的构建转变成为推动市场主体对知识产权制度的有效运用。”知识产权领域一位资深专家表示，“在我国知识产权制度从建立到不断完善的过程中，这将是我国知识产权事业发展的新方向。” “在市知识产权信息服务中心的助力下，‘川兴米粉’获得地理标志保护，带动了整个企业品牌乃至行业的发展。我们通过不断完善特色加工工艺、加强历史文化传承等，持续推动‘川兴米粉’高质量发展。”L市镇办企业川兴米粉有限公司冯经理说。 L市知识产权信息服务中心成立于2017年10月，主要职能是面向社会开展知识产权法律法规宣传、专利技术展示宣传和推介转化，提供专利情报与商标信息、专利信息传播与利用、知识产权司法鉴定与知识产权培训等一系列服务工作。2018年，L市知识产权信息服务中心派专项组进驻各乡镇。在中心指导下，“川兴米粉”正式成为国家地理标志产品。2022年，在L市知识产权信息服务中心的引导下，“川兴米粉”联盟标准及地方标准先后出台。统一的标准是提升产品质量的保证，一路走来，“川兴米粉”在标准化和规范化道路上渐行渐稳，走上了高质量发展的“快车道”。三月江南，草莓上市。在L市各大中高端超市的水果货架上，随处可见“丰禾庄园”的精品草莓。“丰禾庄园”是一家集草莓育种、种植与销售于一体的创新型企业。该企业吴经理介绍，企业赢得市场青睐的秘诀之一在于，L市知识产权信息服务中心协助企业分析研判发展“痛点”，精准对接高端科研团队，为产品的提档升级注入了科技基因。通过知识产权信息服务中心的对接，L市农业学院方教授团队与“丰禾庄园”就草莓生产等方面展开合作。2021年底，三方围绕草莓育苗基质配制、有机肥研发利用、知识产权信息服务等需求，共同签署了“丰禾庄园与L市农业学院合作框架协议”。很快，方教授带领团队帮助企业解决了草莓生产中的一个个关键问题。传统的地栽草莓垄高一般在20~30厘米，工人必须弯下腰来采摘，费时费力。为了改变这一现状，在L市知识产权信息服务中心的协调下，企业尝试引进高垄种植技术，不仅让草莓采收轻松省力，而且还利用其采光好、透气性强的优点，有效促进了草莓增产。香田蓝莓花开、浮山春茶开采……好的生态环境，孕育出千姿百态的“伊山山珍”。以前，这些产品虽好，但其经营户处于小、散、弱的状态，销售渠道也不通畅。乡村振兴，产业兴旺是基础。为此，L市知识产权信息服务中心为“伊山山珍”品牌商标注册量身定制工作方案，确定注册商标样式，进行品牌知识产权保护布局、品牌图文版权登记等。针对山珍品种繁多问题，知识产权信息服务中心安排信息员就相关产品类别在国家知识产权局商标数据库对48个类别进行近200次检索，整理出商品商标申请清单和服务商标申请清单，指导相关企业将60余种产品分期分批开展商标注册申请。 “没有自己的品牌，好山珍卖不出好价钱。今年我们取得了‘伊山山珍’的商标使用权，对于销售信心倍增。”伊山村一位种植大户说。 “多年来，村里人专注于山珍的培育，却忽略了知识产权的保护。时有冒牌货流入市场，损害了本地山珍的信誉。”伊山农村联合社郑社长感慨，“知识产权信息服务中心给我们做了商标法宣讲，对商标持有人进行培训，并指导我们制定了《“伊山山珍”商标标识使用管理办法》。现在我们得到商标的授权，消费者对我们的信任度高了，销量自然上去了。” L市知识产权信息服务中心还联合多个部门合力推动“企业+地理标志商标+标准化+农户”模式，重点推广当地主导产业，成功打造了以蓝莓、竹荪、两茶一药等为重点的“伊山山珍”拳头产品，许多产品备受顾客青睐和巿场欢迎。","source":"2023年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2023-sl-05","paperId":"gk2023-sl","num":5,"year":2023,"region":"国家","module":"申论","sub":"申发论述","kind":"essay","stem":"请你深入思考“给定资料5”中这位学者文章的有关内容，参考给定资料，联系实际，自选角度，自拟题目，写一篇文章。（35分）\n要求：（1）观点明确，见解深刻；（2）参考给定资料，但不拘泥于给定资料；（3）思路清晰，语言流畅；（4）字数1000-1200字。","options":[],"answer":"心怀理想信念，追寻长期价值当今世界正经历百年未有之大变局，这样的大变局不是一时一事、一域一国之变，是世界之变、时代之变、历史之变。能否应对好这一大变局，赢得不确定的未来，关键要看我们能否保持战略定力来抵御短期诱惑，心怀信念坚持把时间和精力投入到能够产生长期价值的事上。关注长期价值，是习近平治国理政思想中的一大治慧。总书记一再指出，要强化战略思维，保持战略定力，把谋事和谋势、谋当下和谋未来统一起来。在粮食安全问题上，他说，“不能把粮食当成一般商品,光算经济账、不算政治账,光算眼前账、不算长远账。”在实施人才强国战略上，总书记特别强调“要坚持长远眼光，有意识地发现和培养更多具有战略科学家潜质的高层次复合型人才，形成战略科学家成长梯队。”可以说，在新发展阶段，贯彻新发展理念，构建新发展格局中，各项政府决策都力求立足未来，着眼长期利益，致力于国家和人民的长远发展。关注长期价值，亦是在变革时代推动企业基业长青的法宝。当前，数字技术引发的产业变革正在深入发展，给传统企业不断带来冲击。华为不惧挑战，不断攀登向上，成长为中国高科技企业的一个标杆。华为孟晚舟说，华为真正的价值在于长期在研发上的投资所沉淀的能力。所以，对于企业经营者来说，短期利润高低或许很重要，但只有持以不懈的长期坚持高强度研发投入，才能拥有未来为客户提供价值的保障和基石，才能争取到赢得未来的足够筹码。关注长期价值，更是指引着我们人生的选择。时代飞速发展的背后，繁杂的噪音和诱惑也随之而来。选择热门行业还是冷门岗位，去往城市拼搏还是乡村锤炼，是个人志向优先，还是与时代同频共振？这些都考验着我们的理性思考。国产航母福建舰的总建造师王硕威是一位80后。他在高考时没有选择计算机、电子类热门专业，心怀强国梦的他选择了船舶工程这样的国家急需但又冷门的专业。毕业时同学都热衷去沿海城市去外企赚钱发展，他则坚守“科研报国”的理想，留在了中部城市研究所，和同事们一起开拓中国航母的研制之路，让青春之光在祖国需要的地方闪耀。不畏浮云遮望眼，风物长宜放眼量。未来，我们可能会面临更加复杂的变化和更多的不确定性。一只只“黑天鹅”的危机事件一再证明，不惧短期挫折长远谋划，不断增强适应持续变化的环境的能力，增加应对不确定性的韧性，才能掌握应变未来的主动权。于整个社会而言，只要我们每个人都心怀民族复兴的远大梦想，抱着愚公移山的志气、滴水穿石的毅力，心往一处想、劲往一处使，让无数力量汇聚到支撑长期发展的领域，形成一个个生生不息、持续发展的正向循环，积跬步以至千里，我们就一定能够把宏伟目标变为美好现实！（站长）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料五】\n某学者近期发表了一篇题为《追寻长期价值》的文章。文章指出，这几年，全球经济社会发展面临着更加复杂的变化和更多的不确定性。面对一只只“黑天鹅”，很多人可能会从应对危机中总结出一个道理：面对“未知的未知”，我们必须增加应对不确定性的韧性，增强适应持续变化的环境的能力。这就要求我们不惧短期挫折，抵御短期诱惑，心怀信念，坚持把时间和精力投入到能够产生长期价值的事上。学者认为，于个人而言，这是一种清醒，要求人们建立理性的认知框架，不受繁杂噪声的影响。于企业而言，这是一种格局，要求企业不断进化、不断创造价值。于政府而言，这是一种担当，必须立足长期利益，致力长远发展。于社会而言，这是一种热忱，无数力量汇聚到支撑人类长期发展的领域，形成一个个生生不息、持续发展的正向循环。","source":"2023年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2024-sl-01","paperId":"gk2024-sl","num":1,"year":2024,"region":"国家","module":"申论","sub":"归纳概括","kind":"essay","stem":"“给定资料1”中提到：“乡村需要的不仅仅是艺术家，更是对乡村有感情并能挖掘本土文化特色的运营官。”请根据“给定资料1”谈谈冯教授团队是怎样当好这个“运营官”的。（10分）\n要求：全面、准确、有条理。不超过250字。","options":[],"answer":"冯教授团队总结出“清池范式”，当好了本土文化运营官：1、带动群众参与，走进群众、启发群众。建有艺术美感的椅子为群众带来生活的改善，开“家庭美术馆”提升群众审美情趣。2、尊重乡村主体和地方文化特色，不带着“治理”和“教导”的心态做事。3、用艺术介入乡建，引导村民回归家园、共建家园。开展“烧奔塔”活动让人们重新认识传统文化和乡村社会道德秩序的独特魅力；策划融入非遗元素的时装秀，引导村民发现美、创造美。4、把乡村文明的显性价值和隐性价值结合起来，整体、系统推进乡村建设。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料一】\n进入桃李镇清池村，通往村头停车场的路是一条环形路。据了解，这是为了绕开村头的两棵百年老树，不打破原有的自然风貌。在冯教授团队看来，树是主，人是客，人要心存敬畏，尊重自然。 2020年6月，G市工业大学组建城乡艺术建设研究所，冯教授任所长。2021年1月，在有关方面的牵线搭桥下，冯教授带着他的4名研究生来到清池村，试图用艺术助力乡村建设。他们原本想用授课的形式，但发现几乎没有村民愿意听，即便来了，也只是走过场。这时，冯教授才意识到，村民的知识多数是从生活里学的，和村民一起动手而不是去授课，可能是一种接近村民、启发村民的好方法。冯教授还发现，村里有一个最热闹的“CBD”，平时村民都喜欢从家里搬来一把小凳子聚在这里聊天。了解到这个情况后，冯教授和团队商量，决定他们的工作就从在这里建一把“大椅子”开始。建椅子用的材料在村里随处可见——毛竹和石头，唯一花钱的是水泥。椅子建好后，能躺能坐，也有艺术美感，村里几个阿婆都说坐着舒服、看着好看。村民们逐渐对冯教授有了新的看法。慢慢地，许多村民都愿意打开自家的院子，邀请冯教授的团队来家里，看看在自己家能做出什么新花样。冯教授发现，村民老金家里有很多老物件，只要合理摆放，稍作打扫，就可以改造成美术馆。2021年春天，老金家院墙外的毛竹筒花坛上淡红色的小野花开了，“家庭美术馆”也正式开业了。“不赚钱，但也没啥成本。陆陆续续有人来参观，看到他们眼里露出的好奇和欣赏，有种说不出的自豪和满足。”老金说。和村民在一起时间久了，冯教授感悟到：“我们必须要探索一种‘超越艺术’的路径介入乡村，应该本着一种对乡村秩序、传统习俗和文脉传承‘膜拜’的心态，而非‘治理’和‘教导’的心态来做事。” 与各路艺术家将乡村或作为自己的画布肆意涂抹、或作为试验场完成自己的艺术实践等做法不同，冯教授团队的艺术乡建之路更像是在完成一种使命。他们的乡建“配方”回到了最为本质的“根”的问题，让人们能够在乡村寻回质朴的精神家园。现如今，清池村仍然保留着原始的“清池八景”，古建筑的外观也已修旧如旧，现代文明的气息似乎并没有“侵蚀”这个乡村。走进村里别有洞天，“面子”古色古香，“里子”内涵丰富。 “乡村文明有两个价值判断：显性价值是大家可以看得见的，如牌坊祠堂、山水风光和民居街道等；隐性价值则是深层次的，涵盖道德、伦理和信仰等方面。二者结合才是完整的价值体系，也是乡村文明的价值所在。”冯教授说。冯教授从清池的宗族信仰、传统礼俗等历史遗存中找到了振兴乡村文明的“清池范式”——在尊重乡村主体和地方文化特色的基础上，通过艺术介入乡建，逐渐影响村民对于乡村价值的判断，引导村民回归家园、共建家园。在冯教授看来，这是一个循环的系统：不是一个局部，而是整体；不是碎片化的切割，而是完整的系统工程。农历八月十五的“烧奔塔”，是清池保留的一项珍贵传统习俗，寓意着村中代代繁衍不息，风调雨顺。每逢中秋佳节，清池各家各户都会将收集的枯枝、竹壳等燃料，放到奔塔内燃烧。此外，还有“成人礼”仪式——青年人潜入河塘挖淤泥堆奔塔，进行庄严宣誓，表达不负人生、成家立业的担当和信心。在冯教授团队的策划下，清池重新挖掘出“烧奔塔”活动的文化内涵，重现“成人礼”仪式，让人们重新认识传统文化和乡村社会道德秩序的独特魅力。2021年，在政府支持下，“烧奔塔”被列入区级非物质文化遗产代表性项目名录。 2022年11月，一场别开生面的时装秀在清池举行。村里的主干道变为“T型台”，在专业模特的带领下，村民走起了“猫步”，神采奕奕。模特和村民的服饰中融合了当地的非遗元素，田间劳作的生产工具和家里的旧物件也作为道具一同出现。这样以自然为舞台、以生活为剧本的“走秀”结合了时尚风格与乡村特色，别开生面。 “村民的表现超出了我的期待。清池范式的最大亮点在于让村民在自己最熟悉的乡间自信地告诉每一个人，这就是我们生活的家园，也是我们的剧场!”冯教授说，“人人都可以展现自己的艺术才能。无论是缝纫、泥瓦活，还是竹编，都是艺术。”艺术家来到村庄，如果能和村民一起发现美、创造美，那便是共创价值。在艺术乡建助推乡村振兴座谈会上，冯教授提到，乡村需要的不仅仅是艺术家，更是对乡村有感情并能挖掘本土文化特色的运营官。如果艺术乡建止步于艺术家与乡村的邂逅，却没能为当地民众带来现实生活的改善和审美情趣的提升，这样的乡建，往往会随着艺术家的离去戛然而止。","source":"2024年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2024-sl-02","paperId":"gk2024-sl","num":2,"year":2024,"region":"国家","module":"申论","sub":"综合分析","kind":"essay","stem":"“给定资料2”中，隆金公司虽然做的是配件，但也成为了市场中的主角。请你谈谈隆金公司为什么能成为“市场中的主角”。（15分）\n要求：（1）紧扣资料，归纳准确；（2）内容全面，条理清晰；（3）不超过300字。","options":[],"answer":"配件可成主角，原因有：一、产品工艺技术含量高且关乎整车质量和生命安全，能通过高市场占有率成为市场主角。二、隆金公司质量攻关和研发创新。1、经营管理科学。生产经营程序严格；与整车厂结合实现精益化管理；挖掘细分市场，深度拓展市场。2、重质量。坚持质量攻关，多措施确保产品质量；获“市长质量奖”，提升经营和质量管理。3、保持专注，定位能力专长，主导制定总成标准，成长为“单项冠军”。4、建设全自动数字化车间，提升生产效率。5、研发创新，依托Z省研发平台，布局海外研发中心，吸引创新人才，加强产学研合作。6、面向未来谋篇布局，不断推进产品智能化。三、地方政府推动企业发展壮大。建立企业培育库，出台政策扶持。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料二】\n在四条自动化装配流水线上，几十只机械臂快速而精准地组装产品。组装好的产品装箱后被一台约两米高的机械臂运送到指定货柜上，在流水线的末端，两名工人正检视产品……这是Z省N市隆金公司数字化生产车间的日常。隆金公司早在1986年就开始为国产汽车生产门把手，30多年来，它将这类看起来极其简单、极其普通的小物件做到了行业顶尖，成为汽车功能配件领域的领航者。 “一个小小的门把手做起来并不简单，要保证门把手开启和关闭的次数和流畅度……这些工艺技术含量都很高。”隆金公司汪董事长说。隆金公司生产的汽车门把手由多个部件组成，要经过市场定位、设计研发、试生产、质量审核等一整套严格程序。“我们将自身的自动化设备、数字化车间等硬实力与各大整车厂商的管理体系、汽车行业质量管理等软实力有机结合，同步实现开发、供应和产能的精益化管理；同时基于主业挖掘细分市场，向高端、新能源、国际汽车市场深度拓展。”汪董事长介绍。这些看似不起眼的汽车功能配件，却关系着每辆汽车的质量、每位消费者的生命安全。比如内门、外门扣手一旦出现产品瑕疵，就会出现车门关闭不严或打不开等问题，给驾乘人员的生命财产带来极大安全风险。 “多年来，公司坚持在汽车配件产品上进行质量攻关，组建质量改进团队、收集各种质量问题信息、实施质量改进措施，都是要确保产品质量。”汪董事长说，“虽然我们做的是配件，但是做配件同样能成为市场中的主角。通过研发创新与技术迭代，公司的汽车配套小物件覆盖了汽车内外饰配件总成的十大系列产品，其中多项产品的市场占有率连续多年位居全国前三。” 2011年，隆金公司积极申报并成功获得N市“市长质量奖”。这一过程中，全体员工不断深化对这一奖项意义的认识，公司的经营和质量管理也得到大幅提升，公司年产值从2亿元迅速达到8亿元。2017年，隆金公司生产的机动车门手柄总成被认定为Z省名牌产品；2018年，隆金公司主导制定了一项乘用车车门内开拉手总成标准：2021年，隆金公司机动车门手柄总成产品成为了国家制造业“单项冠军”产品。“单项冠军”代表着全球细分行业最高的发展水平、最强的市场实力，堪称金字塔的塔尖。“公司发展过程中，我们始终保持专注，定位于‘能做得更好’的事情。”汪董事长说。目前，隆金公司已成为国际国内知名汽车制造商的核心供应商和战略合作伙伴。统计数据显示，现在全国每3辆乘用车中就有一辆车装配有隆金公司的优秀产品。 “眼下，公司正在建设智能工厂。”隆金公司技术创新中心负责人赵工程师说。从2012年起，公司每年投入数千万元资金，引进国内外先进设备，建设国内领先的全自动数字化车间，使企业生产效率提高了28%，运营成本降低了12%。同时，依托Z省的企业研究院、博士后工作站、工业设计中心、高新技术企业研发中心等各类研发平台，公司布局建立海外研发中心，吸引了200多名创新人才。公司还加强与知名高校的产学研和就业合作，选拔并培养了一批优秀技术能手和行业专家。近三年，隆金公司各研发中心完成产品研发项目超300项，形成各类专利295项，突破了大量国外技术壁垒，95%的产品实现国产化替代。 “接下来，我们将针对新能源汽车推出一款具备触摸感应模块的隐藏式外门把手，不仅能够借助通信协议与汽车主机进行对话，还具备自主学习功能。”赵工程师说。面对新能源汽车赛道，隆金公司正积极谋篇布局。改革开放以来，N市形成了门类齐全的制造业体系，尤其是形成了以石油化工、汽车及零部件、电工电器、纺织服装等为支柱的产业集群。为了推动企业发展壮大，N市建立了企业培育库，出台了《关于加快推进制造业高质量发展的若干意见》、《制造业卓越企业培育工程行动计划》等文件。目前，像隆金公司这样的一些中小企业已经成为行业翘楚，迈入“单项冠军”方阵。","source":"2024年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2024-sl-03","paperId":"gk2024-sl","num":3,"year":2024,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"如果你是“给定资料3”中有关部门的工作人员，请根据座谈会参会人员的发言内容，围绕非遗法实施的成效、不足和改进建议，写一份情况报告。（20分）\n要求：（1）紧扣资料，内容全面；（2）要点突出，条理清晰，语言准确；（3）不超过300字。","options":[],"answer":"有法可依推动非遗保护传承进入新时代非遗法实施成效显著。各级政府更加关心支持非遗工作，非遗文化价值不断得到社会认可；坚定了非遗产业发展信心，指明了相关企业发展方向。成绩背后亦有不足。存在法律落实不到位、不履行保护传承义务；混淆非遗概念、错误改编、过度开发；非遗知识产权认定不清晰；保护人才专业化不足等问题。要充分落实非遗法，建议：1、创新传播手段。鼓励与高校联合成立研究中心，开展非遗走进中小学、社区开展传播活动。推广非遗传承平台，促进非遗跨界合作。2、注重人才培养。严格考核传承人，带徒授艺规范有序；加强非遗保护人才培养，提升专业化、信息化水平。3、加强研究，科学利用和活化。要理解非遗的完整性，对非遗整体性保护，以活的形式传承，礼敬传统，确保非遗的原真性。4、加大支持力度，不断提供资金、场地保障。5、修订完善法律，明确界定知识产权，保护再创作者权益。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料三】\n《中华人民共和国非物质文化遗产法》（以下简称“非遗法”）已颁布12年。为进一步了解非遗法的实施情况，近期有关部门召开了一次座谈会，参会人员发言的主要内容如下：某扎染集团总经理：非遗法的实施给集团的发展注入了新动力，坚定了非遗产业发展的战略信心。我们汲取中国传统染、织、绣等纺织类非遗精华，将产品视觉差别化创意、面料艺术再造与时尚跨界创新成果充分应用，形成了非遗创新与基础研发、时尚设计、数码技术等融合发展的非遗传承与市场运作体系。近年来，我们和多家高校联合成立非遗研究中心，组织院校教师到企业举办“纺织非遗传承与服饰艺术设计”培训班，接待高校师生参观扎染过程、体验扎染技艺，走进中小学、社区，开展非遗体验和讲座等活动。某市文化部门负责人：非遗法明确，非物质文化遗产是指各族人民世代相传并视为其文化遗产组成部分的各种传统文化表现形式，以及与传统文化表现形式相关的实物和场所。非物质文化遗产有着自身的完整性，如一套祭祀礼仪、一种特定药材炮制技艺等，文化与技艺本身就有自己的完整结构与秩序，不可随意更改与删减。同时，还需要重视非遗生存环境的整体性保护。比如庙会，除了寺庙空间外，还要维护那些分散在民间的组织，它们是庙会活动的主体，庙会管理者与各庙会组织者之间的常态互动构成了庙会的整体性。非遗不是文化遗留物，而是流动的文化，如果脱离了日常生活，非遗就会成为“静态文物”。事实上，经过十余年的非遗保护实践，我国创新了许多办法，也取得了显著的效果，例如创设了具有中国特色的四级名录制度体系，制定了一系列意见和办法，设立了一批非遗保护的基地和传习所，开展了一系列提升非遗保护、传承能力的活动等。某文化传媒有限公司CEO：我们公司以提供非遗领域的文化服务为核心业务，与各地文旅系统、企业、非遗传承人合作，在非遗展览展示、产品开发、品牌打造等方面取得了较好的成绩。非遗法为我们这些从事非遗保护、传承和传播的企业指明了方向。近期，公司组织成立“非遗传二代”平台。助力新时代下的非遗传承和创新。依托该平台，我们促进了非遗技艺与国外优秀设计师的跨界合作，为非遗技艺的传承、传播找到更多载体和路径，助力中华优秀传统文化走出去。某国家级非遗项目代表性传承人：非遗法实施后，我在开展非遗保护传承工作时得到了各级政府的关心和支持。开展工作所用的工作室由市文旅集团下属单位提供，并连续获得国家级非遗扶持资金、市政府扶持资金资助。非遗保护、传承工作复杂而又庞大，需要社会各界给予更多关注，在资金、场地上进一步提供保障，同时也要对传承人进行严格的考核，保证其带徒授艺规范有序。某市非遗保护协会负责人：非遗法要求传承人积极开展传承活动。培养后继人才。作为非遗传承人，他们的任务其实很明确：将先人的知识与技艺原汁原味地继承下来、传承下去因此，要严把传承人“入口关”去伪存真，宁缺毋滥。此外，随着非遗保护工作的持续深入，专业化、信息化要求越来越高，现有从事非遗保护的人才队伍还不适应。某艺术研究院研究员：随着非遗法的实施，人们逐步认识到一些民间文化的价值。譬如，关公庙会常常与弘扬诚信相联系，岳飞庙会则与爱国精神相联系。但在非遗法的实施过程中，有的地方混淆了非遗概念，误将刚创造出来的“现产”当成祖先留给我们的遗产，还有将被改编、改造过的，甚至是糟粕的东西当成遗产。活态传承是非遗的最大特点，但活态传承的本义并不是让非遗改变，而是让非遗通过一个个泥人的制作、一首首山歌的演唱以活态的形式传承下去。礼敬传统，而不是随意改造，才能确保非遗的原真性。某律师：从理论上讲，非遗是祖先留给我们的共同遗产，而不是留给某个人的私人遗产，这一点与文创产品不同。但从非遗法颁布后这些年的实践来看，关于非遗传承的知识产权认定仍然比较复杂，比如一些以家族为传承线的项目，其本身就有不外传的规定：经过再次创作的具体作品。因为作品中表现出了独特的个性，创作者应该拥有知识产权，如传承者翻唱的非遗民歌具有鲜明的、可辨识的个人声音。某大学教授：非遗是形成于历史、传承于当下的，我们不可固化它，不能以“原真性”去限制它的发展与变化。在利用与活化非遗的过程中，我们应当进行符合文化演化规律的延展，在对非遗本身进行细致深入了解之后，选择更有利的保护、传承和活化方式。同时，非遗保护理念虽然已成为全社会的共识，但因为各种原因或条件限制，一些地方对非遗法的落实并没有完全到位。有的不履行非遗保护、传承义务，有的以活化名义进行过度开发。因此，对于各地如何更好地贯彻落实非遗法，主管部门还需要进一步研究。","source":"2024年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2024-sl-04","paperId":"gk2024-sl","num":4,"year":2024,"region":"国家","module":"申论","sub":"提出对策","kind":"essay","stem":"请根据“给定资料4”，对退休人员再就业面临的问题进行梳理，并提出解决建议。（20分）\n要求：（1）问题梳理全面、准确；（2）所提建议具体明确、有针对性、切实可行；（3）不超过400字。","options":[],"answer":"问题有：1、社会舆论不友好,担心抢年轻人饭碗,不帮带娃”增加子女负担。2、找工作的渠道少、岗位少。3、缺乏专业技能。4、法律不完善,无法签订劳动合同。建议有：1、加大宣传力度，宣传再就业分担子女养老负担，发挥余热岗位与年轻人就业岗位不同，强调再就业对老年人社会价值认可的重要意义，营造出促进再就业的良好舆论氛围。2、畅通再就业渠道,依托社区、招聘企业等搭建退休老人再就业的专门信息平台。3、多渠道增加就业岗位，适当延长专业技术领域人才工作年限；开发公益岗位，促进灵活就业；对于吸纳老年就业的企业给予优惠政策。4、提升老年人再就业能力。把老年人再就业纳入公共服务体系，探索设立与老年人口再就业需求相对应的培训学习平台，开展多样化、个性化就业培训。5、为老年人再就业提供法律保障和制度安排，制定促进中老年人就业的相关法律，切实保障老年人再就业的合法权益，提高企业吸纳老年人再就业的便利度。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料四】\n“今年父母双双退休，父亲有高压电工证，母亲有执业药师证，退休后想找份相对轻松的工作。”几个月前，小丁开始在社交平台上给退休的父母找工作。信息发布后引起了反响，有不少网友表示支持，也有不少网友提出质疑。 33岁的小丁是一名律师，经常加班，她很羡慕退休后时间更加自由的父母，但父母却出现了不同程度的焦虑，还不约而同地提出想以临时工身份回原单位上班的想法。对此，小丁不能理解：“父母的退休金明明够用，为什么还总是想去上班？”被问起想继续工作的原因，小丁母亲说：“工作能让我感觉到被需要，这种感觉特别好，待在家里心情容易烦闷。” 在帮助父母找工作的过程中，小丁切实感受到了退休人员的“一职难求”。小丁通过某求职软件帮母亲找到了一份药师工作，但了解后发现这份工作每个月只能休息4天，有时候还需要上夜班。小丁担心母亲承受不了高强度的工作，于是替母亲选择了放弃。“给父母找工作的渠道还是太少了，岗位信息也相对单一。我就是想帮他们找个清闲的工作，工资多少不是考虑的重点，只要他们不再焦虑就行。”小丁说。小丁发布的求职信息后面有一位网友的跟帖：“颐养天年多好，为什么非要再就业？这不是和我们年轻人‘抢饭碗’吗？而且老人体力不如年轻人，再就业没什么必要。”小丁的父亲看了摇头道：“真不明白怎么会有人这么想，我们只是选择能发挥‘余热’的地方就业，不仅不会抢年轻人的饭碗，还可以分担子女的养老负担。” 还有一位网友的跟帖引起小丁和众多网友的关注：“我退休后因为心疼女儿工作忙帮她带了两年小孩，现在我想要过属于自己的生活，女儿却不愿意。我不想让带娃‘捆’住自己的晚年生活，也想找份工作，可自己又没啥本事，只能找到保洁、保姆的活儿，那还不如继续给女儿看孩子。”多数网友表示同情这位老人，认为带小孩本应该是儿女自己的责任，父母帮忙是出于亲情，但不是本分。也有网友表示，现在年轻人生活确实很辛苦很累，父母力所能及还是应该帮忙的。对这份跟帖，小丁的关注点却是老人对找工作的无奈和慨叹。小丁还发现，少数身体状况良好、专业技能水平较高的医生、教师等会被返聘，但多数老人只能从事低门槛行业，再加上针对老人就业技能的培训较少，无专业技能的老人想要再就业更会面临重重困难。小丁为父亲找到一份电力公司的工作，用人单位很满意小丁父亲熟练的专业技术和丰富的从业经验，但却无法和小丁父亲签订劳动合同。对此，作为专业人士的小丁倒是清楚内在的原因，从有关法律规定上看，小丁父亲因为已经领取了退休金，无法与用人单位确立劳动关系，自然也不能缴纳工伤保险，一旦在工作中出事，用人单位要承担赔偿责任。对于用人单位的顾虑，小丁也能理解。最后，她和用人单位协商，为父亲购买了雇主险和意外伤害险，总算为父亲找到了一份相对有保障的工作。","source":"2024年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2024-sl-05","paperId":"gk2024-sl","num":5,"year":2024,"region":"国家","module":"申论","sub":"申发论述","kind":"essay","stem":"请结合“给定资料5”，围绕行政执法工作中的“力”、“理”、“利”进行深入思考，联系实际，自拟题目，写一篇文章。（35分）\n要求：（1）观点明确，理解深刻；（2）参考给定资料，但不拘泥于给定资料；（3）思路清晰，语言流畅；（4）字数1000～1200字。","options":[],"answer":"念好行政执法“力”“理”“利”三字经 “天下之事，不难于立法，而难于法之必行”。行政执法作为法律实施的关键环节，近年来不断改革优化，执法水平显著提升。然而新时代，人民群众对社会公平正义的期待越来越高，面对执法主体多、范围领域广、行为数量大等现实难题，行政执法还需紧扣“力”“理”“利”三个关键字，持续提升质量和效能，不断增强人民群众法治获得感。执法要有“力”，以强有力的监督提升公信力。公信力的建立是一个长期而复杂的过程，但它的毁灭却可以在瞬间发生，一次不够规范的执法过程、一个有失偏颇的处罚决定，都可能损害执法公信力。执法实践中，不管是统一执法证件，做到执法形式规范；还是加强对重点领域监管不力、执法不到位等给予严肃问责；以及在推进执法行为全过程记录的同时提升公众参与度，这些以“老百姓看得见”的执法方式，让执法监督的力量强而有力，让执法公信力在阳光下不断提升。总之，要通过内外结合，强化监督，及时发现和纠正可能存在的不当执法行为，筑牢公信力基石，让“法治”二字在公众心中“力重千钧”。执法要有“理”，法理相融促进法治观念更深入人心。两千多前，孔子就提出“不教而诛谓之虐”。在执法过程中，讲清事理、法理、情理，执法对象才会真正认可执法行为，法律才能真正起到规范和约束的作用。正如某公司一开始对税务稽查人员提出的有多笔利息收入未按规定申报缴纳增值税并不理解接受，但在稽查人员耐心讲解、说明依据后，该公司不仅心甘情愿接受处理，对相关税法知识认识还更加深刻透彻。以法为据，以理服人，法理结合，方能有效增强群众法治意识，帮助群众自觉做到知法懂法尊法守法，提高法律遵从度。执法有“力”有“理”，最终都是为了捍卫人民利益。要让执法为了人民之“利”，护航美好生活。习近平总书记指出：“推进全面依法治国，根本目的是依法保障人民权益。”执法人员应始终牢记执法为民初衷，既要严格执法，坚守法律底线，又要注重人性化执法，维护好广大人民群众切身利益。譬如面对城市流动商贩，简单禁止驱赶的执法方式已经越来越少，许多地方通过划线经营、持证上岗，以疏代堵，即维护了城市秩序，又能便民利民，促进就业创业。未来，还需不断创新执法方式，让人民利益最大化。行政执法把“纸上的法治”变为“行动中的法治”，念好“力”“理”“利”三字经，必将书写出法治中国新篇章！（作者：站长）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料五】\n统一执法证件、统一执法标识、统一执法制式服装……这些统一近两年正陆续在各地的生态环境保护，交通运输、农业、文化市场、应急管理、市场监管等领域推开。 “执法证件赋予我们的不仅仅是权力和荣誉，更是光荣的使命和沉甸甸的责任。”第一时间拿到新式执法证件的N省市场监督管理局政策法规处的钟处长说。据了解，新式行政执法证件严格按照国家统一编码规范执法编号，增设电子二维码，增加辨识度，通过二维码识别即可核验执法人员身份和证件有效期，做到了一人一号，人号对应。这种看起来只是形式上的统一，却有着非常深刻的意义——有利于进一步加强执法人员规范管理，强化社会监督，有利于切实提高行政执法公信力，推进规范文明执法。钟处长说：“人情、关系等因素常常影响基层公共治理活动的公正性。以执法活动中运用最广的行政罚款为例，现有行政处罚法主要关注处罚的权限和程序，没有为罚款设定提实体性的裁量规则，加上一些基层人员执法不严、不依法履职等问题，容易造成部分执法活动中罚款科处的随意，并产生处罚畸轻畸重的乱象。譬如，据某媒体报道，S市对某化工厂排放废水pH值严重超标的行为处以几百元的超低罚款，L区则对某商店售卖一袋过期食品罚款上万元等。今年以来，我们加大基层执法的监督检查力度，坚决纠正以罚增收、以罚代管、逐利执法等问题，对监管不力、执法不到位等给予严肃问责。” 近日，M市福兴公司负责人郭先生接到市税务局稽查人员送达的《税务处理决定书》后，很是感慨，表示愿意接受税务机关的处理决定。原来，上个月稽查人员对福兴公司开展日常税收检查时，发现该公司有多笔利息收入未按规定申报缴纳增值税，应按规定补缴税款。财务人员认为公司属于集团公司，由总部统一向银行借款，然后分给所属关联公司，关联公司把贷款利息转过来存入银行，并没有产生收入，应适用“统借统还”业务处理，不应缴纳增值税。对此，稽查人员耐心向其说明该项处理的证据分析、认定理由、政策依据和法律责任，并出示了从市场监督管理部门核查到的该公司登记信息。根据相关文件，福兴公司不能适用“统借统还”相关规定，应全额缴纳增值税。郭先生对此深有感触：“税务稽查部门通过面对面座谈方式，对公司进行查前政策辅导，解读和剖析税收风险点，事实清楚、证据充分、程序合法、处理适当，现场答疑释惑又透彻，这样的执法使征纳关系很融洽，既有利于我们公司长远发展，也让我们感到非常温暖。” “行政执法的目的不是处罚，而是提高法律遵从度。”M市税务局游局长说，“行政执法要由以往‘一刀切’的粗放式执法，向‘认定讲证据、裁量讲道理、决定讲法律’的精确执法转变，将‘释法明理、法理相融’执法理念贯穿执法全过程、各环节。我们在执法过程中，要讲清事理、法理、情理，全面实现执法信息公开透明，实现执法过程全程可溯，这样才能够有效约束行政自由裁量权，以更好地维护人民群众的利益。” “执法者是法律的捍卫者和执行者，有权不能滥用。”M市市场监督管理局倪局长说，“前段时间发生的个别执法人员在执法过程中简单粗暴、以权压人的行为影响恶劣，不仅会破坏良好的营商环境，损害政府公信力，还严重违背法治精神。” 某大学法学教授马老师认为：“在法治政府建设的各个环节中，行政执法往往受到很高的关注。行政执法主体多、范围领域广、行为数量大，且与广大人民群众的切身利益关系密切，行政执法人员与人民群众打交道也较多。创新行政执法方式可能是破解执法难题的有效途径之一。在推进执法行为全过程记录的同时，还要提升公众参与度，接受社会监督，以‘老百姓看得见’的执法方式，促进全过程阳光执法，提高政府公信力。”","source":"2024年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2025-sl-01","paperId":"gk2025-sl","num":1,"year":2025,"region":"国家","module":"申论","sub":"归纳概括","kind":"essay","stem":"根据“给定材料1”，概括A市促进高科技企业和新兴产业发展的主要做法。（10分）\n要求：全面、准确、有条理，不超过250字。","options":[],"answer":"A 市把科技创新摆在全市发展的核心位置，打造创新优势：1.成立科技成果转化专班。专门开展有组织、体系化的科技成果转化工作。2.搭建工业互联网平台。形成成果转化项目定期推送、产业链供需互促对接机制。3.建设产业园区集群。促进企业间互动和协同提高竞争力创新力，共享园区基础设施和配套服务降成本。4.做好资金与金融支持。国有投资平台投资吸引优质项目；建立科技企业贷款服务体系；出台扶持政策扩大基金规模与数量。5.吸引与培养人才。打造引才品牌，如建设国际人才城等引进人才；成立科技商学院培养复合型科技产业组织人才。（247 字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料一】\n近年来，A市始终把科技创新摆在全市发展的核心位置，从首个国家实验室入轨运行、综合性国家科学中心获批，到深空探测实验室挂牌运行、量子信息未来产业科技园入列国家首批未来产业科技园建设试点、国际先进技术应用推进中心设立，A市的创新优势从无到有、从有到优。两年前，A 市物质科学研究院的方教授研究团队取得了一项能够很好地应用在新能源汽车锂电池回收自动化生产线的科研成果，相比于传统回收工艺，新技术既节能环保，又能提高回收效率、减少成本。如何将这项科研成果尽快推向市场呢？“A市科技成果转化专班的支持，帮助我们跨越了从技术到产品、从实验室到市场的鸿沟。”方教授说。为了让“硬核”科技加快转化为新质生产力，聚焦打通科技成果转化的“最初一公里”，A市成立了5个市级科技成果转化专班，专门开展有组织、体系化的科技成果转化工作，专班工作人员常态化“登门（校门）入室（实验室）”，深度对接市内外高校院所，全力做好科技成果发现、挖掘、策划、转化工作。远达信息技术有限公司向总经理表示，公司之所以选择落户A市，源于他们去年和A市龙腾工业互联网平台的一次合作对接。在龙腾平台的牵线搭桥下，他们被A市的创新优势和良好的产业政策深深打动，并在今年五月份正式入驻。像这样由龙腾工业互联网平台牵手推动优质项目落地、共促科技招商的双赢案例，并非个例。得益于平台的成果转化项目定期推送、产业链供需互促对接机制，A 市已累计通过龙腾工业互联网平台获取了 4000 多个项目源，并已筛选重点项目依次分批进行了对接治谈。 “产业园区集群是科技、产业和人才的交汇点，是最有希望催生新质生产力的地方。”A市高新区相关负责人表示。近年来，A市高新区锚定创新驱动发展战略，全力推进产业园区集群建设，目前已建成健康大数据产业园、生物医药园等园区项目10个，新型产业园区内聚集着同一行业或相关产业的企业，有助于企业之间的互动和协同，形成产业链，提高各自的竞争力和创新能力。同时，产业园区能够提供便利的生产、生活、经营环境，企业可以共享园区提供的基础设施和配套服务，大大降低了成本。 6月20日，总部位于A市的晶圆代工企业品和集成开启新股申购，将募集到百亿级资金。这笔资金，将用于公司先进工艺研发项目等。相较于传统的提供优质营商环境，以优惠落地政策招引企业的做法，A市政府围绕战略性新兴产业，通过国有投资平台的投资吸引优质项目落地生根。 “去年末，全市科技型企业贷款余额2592亿元，较去年初增长近500亿元。”A市地方金融监管局相关负责人透露。针对科技型企业贷款难题，A市构建了政府、银行、担保、征信等多方协调联动、精准高效的科技企业贷款服务体系。为打造优越的创新创业生态体系，高新区连续出台“创九条”、“金九条”等扶持政策，形成了繁荣茂盛的“基金丛林”。目前，园区基金总规模超2500亿元，基金超过200只。为了吸引更多人才汇聚，A 市建设了国际人才城，打造了“外国专家服务之家”，并开办了“企业家大学”，打造“中国声谷·量子中心”名校引才品牌，14 年来累计引进国内外高校毕业生 10 万余人。值得一提的是，去年 10 月，A 市大学科技商学院正式成立，旨在培养复合型科技产业组织人才。它的成立，能够为 A 市科技创新带来哪些新变化，令人遐想无限。","source":"2025年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2025-sl-02","paperId":"gk2025-sl","num":2,"year":2025,"region":"国家","module":"申论","sub":"综合分析","kind":"essay","stem":"“给定材料2”中提到“S 市总工会工作的优化，真正实现了以职工需求推动服务的新格局”，请说明S市总工会是如何实现这种新格局的。（15 分）\n要求：理解准确、内容全面、逻辑清晰，不超过250字。","options":[],"answer":"1.倾听职工心声。发起“职工心声大调查”活动，收集意见建议助推各单位针对问题改进，增强了与职工沟通互动。2.助力成长发展。依托互联网、大数据的线上培训模式，为职工搭建成长平台，创造更多发展机会。3.关爱心理健康。为职工提供线上心理咨询服务，帮助从容面对压力。4.维护职工权益。借助12351职工维权服务热线积极解决职工难题，成为工会和职工的“连心线”。5.创新工会工作。通过智慧工会平台，手机可领取福利券，提升职工福利体验。6.打造工会服务阵地。创建“星级”服务站点，扩大服务范围和覆盖面，筑起服务职工的温馨港湾。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料二】\n周一早晨，上班途中的小杨收到S市总工会的一条信息，邀请他参加“职工心声大调查”，并附上了“连心桥”小程序的二维码。小杨打开小程序，看到上面有多种调查问卷和互动功能。他随手点开了份关于工作环境的问卷，几分钟内就完成了填写。小程序还提供了一个“吐槽专区”，小杨在这个专区里分享了他对公司食堂伙食的看法。让他意想不到的是，没过几天，公司食堂居然改进许多，S市总工会发起的这次“职工心声大调查”活动，通过“连心桥”小程序收集到了大量意见和建议，有效助推各单位针对反馈的问题迅速展开行动，增强了与职工之间的沟通互动。作为单位的资深员工，老欧越来越感觉自己跟不上数字时代的步伐了。听说S市总工会组织了智慧培训活动，他赶紧在总工会公众号上注册并登录了线上培训平台，选择了课程模块中的办公软件应用课程，通过视频里的生动讲解和实例分析，他很快就掌握了新技能。老欧通过了平台的在线测试，这让他在工作中增加了自信。“这种依托互联网、大数据的线上培训模式打破了时空限制，为我们搭建成长平台，创造更多发展机会，展示了工会服务职工的新思路和新作为。”老欧在平台的意见反馈区留言。 “工会的工作真是用心了！”全程体验了市总工会线上心理咨询服务的小萨充满感激地说。前段时间，高强度的工作和家庭生活琐事让她感到身心疲惫，压力巨大。通过S市总工会官方网站的心理咨询服务专栏，小萨预约了一位心理咨询师，通过视频连线，在咨询师引导下，小萨进行了系统的情绪管理练习，情绪渐渐变得稳定，对工作和生活的态度也有了积极的变化。几周后，咨询师根据小萨的进展，提供了更有针对性的建议和方法，帮助她更加从容地面对压力。小萨在工作群里分享了自己的这段体验，鼓励有类似困扰的同事也尝试这种服务。 2024年10月的一天，被劳动合同纠纷困扰的小白拨打了12351热线。“之前在单位工会的宣传栏里看到过全国总工会全面建成并运行12351职工维权服务热线的信息，现在遇到事了，也只是抱着试试看的想法拨了这个电话。”小白回忆说，“热线接通后，客服人员耐心听取了我的问题，并迅速帮我联系了S市总工会的法律服务部门。第二天，S市总工会法律援助中心就给我打来了电话，帮我解决了合同纠纷问题。”如今，12351职工维权服务热线已经成了工会和职工的“连心线”，搭起让职工群众“时时、处处、事事”放心的沟通桥梁。 “工会工作的创新总能给人带来惊喜！以前，我们的清凉福利都是线下发放，还得提前去排队，很不方便。现在通过手机就能领取清凉券，不仅省时，还能在附近商店直接用。”环卫工人老辛的满意溢于言表。2024年夏季，S市总工会通过智慧工会平台，推出了“夏季清凉”活动，使环卫工人、快递员、外卖员等户外工作者在炎热天气中及时得到清凉福利，极大地提升了他们的福利体验。 2024年6月16日，S市总工会首批“五星”站点授牌仪式在解放路户外职工爱心接力站举行。祥林区户外劳动者暖心驿站、西庄街道工会职工学堂等通过“百站升级”现场评估，获“五星”站点称号。根据S市总工会的工作要求及区域和产业发展实际，各级工会组织科学布点，扩大服务范围和覆盖面，围绕区域内户外职工爱心接力站、职工法援点、职工学堂等七大类百余个服务站点，开展“星级”站点创建，在产业工人、户外职工集聚的地方打造工会服务阵地，筑起服务职工的温馨港湾。“首批挂牌的“五星”站点打造了诚意满满的专业化服务空间，通过“一站一品”式的特色化运营，精准回应劳动者特别是户外劳动者和新就业形态劳动者的工作和生活诉求。”S市总工会职工服务中心陆主任在授牌仪式上说，“S市总工会工作的优化，真正实现了以职工需求推动服务的新格局。”","source":"2025年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2025-sl-03","paperId":"gk2025-sl","num":3,"year":2025,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"为使夜市管理工作更加规范，B市大帆夜市综合服务办公室计划编写一份“平安夜市安全巡查工作指南”供工作人员使用。根据“给定材料3”，请你草拟该指南中的工作事项及相应的工作内容。（20分）\n要求：（1）紧扣资料，内容全面。（2）工作事项明确，工作内容具体。（3）层次分明，条目清晰，语言简练。（4）不超过500字。","options":[],"answer":"一.消防及用电安全检查：1.检查经营场地消防安全条件。是否配置消防设施器材，摊主是否会使用；疏散通道、安全出口、消防车通道是否畅通；是否设置防火标志。2.检查商铺用电安全。3.检查排烟管道是否有破损。二.食品安全检查：1.检查食品卫生许可证是否悬挂到位。2.实时监测摊点安全卫生，包括食品存放、加工过程和经手人员等。3.检查从业人员健康证是否合格。4.检查摊贩是否按要求生熟、干湿、鲜活食品分开储存。三.交通疏导与治安防控：1.遇到人流拥堵，及时现场疏导。2.利用利用大型显示屏、“云”广播、口哨等工具，实现群防群治。3.利用警用无人机高空监控，融合警务指挥体系，实时联动街边警力开展路面巡控。四.应急处理：1.及时化解矛盾。巡查小组遇到群众纠纷，及时现场调解，较大纠纷要将当事人带到调解室专门解决。2.发现走散儿童，及时联系家长并送到综合服务办公室。五.安全知识宣讲。依托“平安驿站”开展防酒驾、治安宣传、“反诈体检”等防电信诈骗宣传项目。六.工作要求：1.发现问题，注重现场拍照取证、现场教育和依法督促整改。2.完成巡查记录，做好工作交接。","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料三】\n夜市，管好了就是十里飘香的美食街区，稍有松懈，就可能变成一失万无的安全事故区。为打造“平安夜市”，B市公安局大帆分局联合相关部门成立了大帆夜市综合服务办公室，制定了严格的安全管理规定，组成了一支由公安、城管、市场监管和街道办事处工作人员构成的管理队伍，分组定时进行巡查。 19：00，平安夜市安全巡查第三小组在组长小葛带领下，一行四人从夜市街口开始，展开当天的安全巡查。 19：10，巡查小组发现夜市某摊位只有一瓶灭火器。“每个摊位最少配备两瓶灭火器，摊主必须会使用灭火器。”为了让烧烤摊的“烟火气”更安全，综合服务办公室要求夜市经营场地必须具备消防安全条件，配置消防设施、器材，保障疏散通道、安全出口、消防车通道畅通，设置防火标志。巡查小组对摊主进行了消防安全教育，并责令其限期改正。 19：40，巡查小组已经检查了 10 余户商铺的用电安全情况，并已逐一检查排烟管道是否有破损、食品卫生许可证是否悬挂到位......对存在问题的地方，小葛用手机拍照，上传到了市场管理平台。在市场入口处管理大屏上，各摊点实时安全卫生情况一览无遗。商户的库房装有摄像头，巡查小组可以随时查看库房的食品存放、加工过程和经手人员等情况。 19：50，巡查小组发现烧烤摊主王某存在从业人员健康证过期问题，做了记录登记，并对其批评教育，要求其尽快更换健康证。 20：00，巡查小组发现摊主翟某存在生熟、干湿、鲜活食品未分开储存等问题。为规范夜市食品摊贩经营行为，保障消费者“舌尖上的安全”，依据有关法律法规，此前夜市综合服务办公室已经专门发布了夜市食品安全告诫提示。根据相关规定，巡查小组中来自市场监管局的老张对翟某开具了限期整改通知书。 20：15，巡查小组接到综合服务中心信息平台通知，夜市中段有车辆违规停留，阻塞交通并造成了人流拥挤。巡查小组及时赶到现场进行交通疏导。针对夜市人流大、治安复杂的情况，夜市中心街道设立了大型显示屏，主干道上配备了 10 余个“云”广播，每个商铺配备口哨，可达到一呼百应、群防群治效果。在人流量大的街道口，发挥警用无人机高空视野广、监控范围大、视角灵活多变优势，深度融合警务指挥体系，实时联动街边警力，让路面巡控更高效。 20：30，夜市中有两名顾客因抢占座位问题而引发纠纷，并有大量群众围观。巡查小组及时赶到现场后，疏散了围观群众，对当事人进行现场问询，避免了矛盾遗一步激化。之后，将其带至夜市综合服务办公室调解室。“大家相互握个手，继续开心吃烧烤，这个事情就让它过去好了。”在调解室内、民警、调解员、律师一起，成功调解了这起纠纷。“警察同志，这里的秤不太准”、“这边的摊位应该是我的，他摆过界了”、“刚在这家店买的东西不太新鲜”......尽管类似的纠纷时有发生，但都能及时得到妥善处置。对于小的纠纷，巡查小组一般现场加以调解，及时化解矛盾；对于较大的纠纷，则将当事人带到调解室专门解决。 20：50，巡查小组发现一名和家长走散的儿童。在及时联系家长后，巡查小组中的社区民警老皮将孩子送到了夜市综合服务办公室。“我们巡查小组每天来回巡逻夜市，维持市场秩序，最多一天走了 4 万多步，要让夜市平安，可不容易嘞。”老皮感慨地说。 21：00，巡查小组在夜市“平安驿站”进行安全知识宣讲。“这几种常见的新型诈骗，注意防范”、“酒后千万不要开车”、“我们就在附近巡逻，有问题随时找我们”、“不要打架，打输住院，打赢坐牢”。“平安驿站”也是居民和游客经常光顾的地方。防范电信诈骗是“平安驿站”里的重头戏，巡查小组一改过去“单向灌输”的宣传模式，把理财投资习惯、金融知识测试、常用社交软件等都纳入“反诈体检”项目。作为对投资理财有“高期盼”的“金融小白”，俞女士被列入高风险易受损群体。“真没想到，逛夜市还能收获安全防范知识，你们的宣传太接地气了。”又惊又喜的俞女士说道。夏季，夜市一般到凌晨1点才会“降温”，周末和节假日则会更晚。夜市打烊了，巡查小组却不一定能“打烊”。每晚例行巡查结束后，他们还要完成当天的巡查记录，做好工作交接。小葛笑着说：“希望通过我们的绵薄之力，让前来消费的市民游客安心，也让这些商户放心做生意。”","source":"2025年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2025-sl-04","paperId":"gk2025-sl","num":4,"year":2025,"region":"国家","module":"申论","sub":"贯彻执行","kind":"essay","stem":"“给定资料4”中的指导组在完成现场指导后，拟向西瑞药业负责人当面谈话反馈。请你根据“给定材料4”，拟写一份谈话内容提纲。（20分）\n要求：（1）成效和问题梳理全面、准确；（2）所提改进建议具体明确，切实可行；（3）语言简洁，条理清晰；（4）不超过450字。","options":[],"answer":"西瑞药业的谈话提纲西瑞药业试点建设“无废工厂”成效显著。1.有效减少污染排放。通过改进生产工艺，生产用水大部分循环使用，废气降低，废活性炭减少。2.危险废物管理较为规范。设立了绿色生产管理部门专门负责；贮存仓库标志醒目；实施“双人双锁”管理制度；危险废物分类打包放置；建立了危险废物管理制度并定期组织员工应急演练和培训。3.工业固体废物处置委托专门单位，安全处理率达100%。目前存在一定问题不足。1.废物管理有细节疏漏。个别废物无贴标签，乱摆放;危险废物管理台账未按规定单独成册，且记录不全面，信息不同步。2.生活垃圾缺乏分类。3.“无废工厂”宣传形式单一，力度不够。改进建议。1.严格执行废物管理制度。针对废物标签、乱摆放、台账记录与电子版同步等细节疏漏问题，定期自查，并严格按照制度整改完善。2.转变观念。不仅要重视生产废物减排与处理，也要重视生活垃圾问题。开展光盘行动，落实生活垃圾分类。3.重视宣传。采用漫画、短视频等多形式宣传“无废工厂”理念，大力营造良好氛围。（425字）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料四】\n“无废城市”是以新发展理念为引领，通过推动形成绿色发展方式和生活方式，持续推进固体废物源头减量和资源化利用，最大限度减少填埋量，将固体废物环境影响降至最低的城市发展模式。建设“无废工厂”是打造“无废城市”的重要一环。为此，D市在全市选取了20家公司试点建设“无废工厂”，位于市工业园区的西瑞药业是其中之一。近日，D市生态环境局派出指导组对其进行指导。指导组一行来到西瑞药业生产车间，几乎听不到噪音，也看不到烟雾，更没有肉眼可见的垃圾。眼前的景象，与传统印象中的工厂颇有不同。 “我们的注射剂生产线原来用水量很大，几乎每天都超过800吨，光要处理的污水就有300多吨。”综合管理部王部长说，“如今，生产用水大部分能循环使用，每天用水量节约一半以上。下一步，我们还将加大工艺改造的力度，争取实现生产用水100%回收利用。” 生产注射剂的另一个重要环节是制瓶工序。车间里，注吹一体机在有条不紊地生产聚丙烯包装，“这个工序跟塑料生产有关，会产生废气。”王部长介绍，“一般来说，普通的制塑车间，要单独进行废气处理。我们现在对生产中的原材料熔化温度进行严格把控，并优化关键生产工艺，大大降低了废气产生量，如果能攻克关键生产工艺的稳定性难题，就能实现制瓶工序不产生废气。” 在集中配制中心，配制好的药液正通过精密管从其他车间流向这里。“药液配制过程中，我们改进了生产工艺，用其他滤料替代了活性炭，减少了废活性炭的产生。”王部长说，“我们还设立了绿色生产管理部门，专门负责危险废物污染防治，并设立以总经理为第一责任人的危险废物污染防治工作小组，确保各项工作有序开展。” 随后，指导组来到危险废物专用贮存仓库，各个仓库外都贴有危险废物黄色警示标志。指导组了解到该仓库实行“双人双锁”管理制度，钥匙由物流部库管员和公司环保专干分别保管。每个仓库门口都贴有国家主管部门监制的标识牌，上面标有企业名称和污染物种类。库房内设有围堰、收集沟，并采取了独立的防渗漏措施。物流部负责人说：“废活性炭、废药品和废包装物等不同的危险废物在各个仓库中会被分门别类打包，按种类贴标签，放置在不同围堰中。”在指导过程中，指导组发现某个围堰中有两袋危险废物没有贴标签，周围还零星散落了一些废包装物。“这些危险废物昨晚下班前才送到，就临时先放在这里，打算今天再处理。”库管人员解释道。 “我们都是按照公司的危险废物管理制度进行入库，仓储等操作，仓库内设有相应的应急及防护装备，也制定了危险废物管理计划及应急预案制度并备案。”库管人员向指导组介绍，“尽管业务繁忙，我们仍定期进行应急演练，组织员工开展环保相关知识培训，以提高全体员工的安全意识和环保意识。” 仓库门口，指导组看到一本危险废物管理台账，上面记录着危险废物基本信息和产生节点、危险废物流向及流向变更记录、利用处置方式等信息。指导人员发现，台账并未按危险废物种类单独成册，且有的危险废物流向和利用处置方式还没有填上。指导组还发现电子版没有同步更新，与纸质版台账信息也不完全相符。“因为危险废物送来一般比较零散，我们通常先登记纸质版台账，等收集到一定量后再统一录入电子版。”库管人员说。这时，回收车开始对仓库中的废料进行回收。“对于工业固体废物的处置，我们委托了专业的处置单位，并核实对方的资质，依法签订书面合同，约定污染防治要求。目前，工业固体废物安全处理率达100%。”王部长说。中午下班后，指导组来到了公司食堂，看到食堂菜品种类丰富，员工可以自由取餐，有些员工吃完后餐盘里还剩下不少饭菜，最后和牛奶盒，饮料瓶等食品包装一起扔进了垃圾桶。指导组还发现食堂门口设立了“无废工厂”宣传橱窗，走近一看，上面仅张贴了一份关于建设“无废工厂”的文件，没有其他宣传材料，也没有看到宣传橱窗前有人停留。橱窗上的玻璃蒙着灰尘，显然很久没有人打理了。","source":"2025年国家公务员考试《申论》真题（行政执法类）"},{"id":"gk2025-sl-05","paperId":"gk2025-sl","num":5,"year":2025,"region":"国家","module":"申论","sub":"申发论述","kind":"essay","stem":"请你对“给定资料5”中提到的“为群众办好事”、“让群众感到好办事”、“把群众的事办好”进行深入系统的思考，联系实际，自拟题目，写一篇文章。（35分）\n要求：（1）观点明确，见解深刻，内容充实；（2）参考给定资料，但不拘泥于给定资料；（3）思路清晰，语言流畅；（4）1000~1200字。","options":[],"answer":"把群众的事办到群众心坎上 “一枝一叶总关情。”从“全天候”办理窗口切实解决群众“上班没空办、下班没处办”的痛点，到设立“办不成事”窗口破解群众急难愁盼问题，还有只需拨打12351一个电话就有工会律师帮扶维权……一件件为群众办的民生事，让以人民为中心的发展思想有了具象化。习近平总书记反复要求党员干部，要始终把人民安居乐业、安危冷暖放在心上。如何把总书记的要求转化为实际行动，解决好群众急难愁盼问题？结合各地基层部门的成功实践，关键是要注重为群众“办好事”，让群众感到“好办事”，做到件件有着落，把“事办好”。为群众“办好事”是总出发点，感到“好办事”体现是服务精神，和创新思路，把“事办好”讲究的是务求实效。把握好这三者，才能真正把群众的事办到群众心坎上。为群众办好事，靠党性、靠作风。全心全意为人民服务是我们党的根本宗旨。人民对美好生活的向往，就是我们的奋斗目标。窗口单位党员干部，为满足群众“全天候”带头执行双休日办公，宁可自己多跑腿，也不能让群众多跑腿。他们全心全意、尽心尽力、毫无怨言，就是因为坚持人民至上，坚守为民初心。为群众办一件好事，就会温暖一片人心。我们需要凡事站在群众立场，不断锤炼深入群众的作风，切实解决群众最关心、最直接、最现实的利益问题，不断为群众谋福祉。让群众好办事，要创新思路、融合资源。群众办事难不难，是群众对政府服务的最直观感受。让群众好办事，不仅是服务理念上的用心、贴心，更要注重方式方法的改进。尤其是遇到群众办事繁，流程多、跑路多的问题，就需要我们创新工作方法思路，充分融合利用社会资源，提高群众的办事效率。某市与银行、社区、园区、商超等共建社会化税费服务网点，将便民办税服务一步到位延伸到群众身边，就是一种方法创新。未来，可以借鉴这种思路，把社保、养老、医疗等办事服务融合进来，让群众少跑路、不跑路。把群众事办好，要担当作为，攻坚克难。如何把群众的事情办好，习近平总书记曾告诉我们，要“切实把好事办好、实事办实、难事办妥。”倘若把把好事情办成“烂尾”事情、“半拉子”工程，会冷了群众的心，淡了群众的情。把群众的事情办好，一方面要讲实效，要让群众有获得感，不能搞花架子。如果好事办不实，既劳民伤财，群众又没有得到实惠，对政府有怨气。另一方面，做成事从来不易，经常是要协调的人员多，涉及利益多。这就需要党员干部拥有攻坚克难，钉钉子的精神，一件一件抓落实，一年接着一年干，努力让群众看到变化、得到实惠。 “民之所忧，我必念之；民之所盼，我必行之。”只要我们坚持为群众办好事、让群众好办事、把群众事办好，不断造福人民，就一定能与人民心心相印，团结一致，共同在实现中华民族伟大复兴的新征程上凯歌行进！（站长）","hasAnswer":true,"explanation":"本题为主观题，无唯一标准答案。以上为参考答案要点，请对照评分要求自行评估。","material":"【材料五】\nC市医疗保障局开设了“全天候”办理窗口。7月23日，星期日，位于C市政务服务中心的医疗保障局窗口前排满了办事的群众，“周末也能办业务，真方便！”一位前来帮朋友办理异地医疗保险业务的市民说。为进一步提升群众办事的便利度和获得感，切实解决群众“上班没空办、下班没处办”的痛点，难点问题，“全天候”办理窗口实行全局工作人员轮岗、党员干部带头执行“双休日办公”的做法，最大限度满足市民对医疗保障服务工作的需求。本着不让群众“多跑腿”的原则，双休日办公期间，对不能现场经办的业务，工作人员会先收取资料、留存办事人员的联系方式，在正常工作日通过电话沟通的方式为市民办理未办结的业务。“在双休日为大家办理业务，我们虽然辛苦，但为群众办好事，是我们应尽的责任。”窗口业务员小周说。 “我准备开一个奶茶店，本来以为流程很复杂，没想到税费服务驿站不仅开到了街道的便民服务中心，还推行‘一站式’办理流程，全程只需十几分钟。”刚刚办理好业务的C市某奶茶店店主胡女士说。在持续优化 15 分钟办税服务圈建设过程中，C市税务部门充分利用社会化资源深化政务融合，与银行、社区、园区、商超等共建社会化税费服务网点，将便民办税服务进一步延伸至偏远地区和服务需求集中区域。“这里集宣传，咨询辅导、自助办税等功能于一体，还设有‘远程虚拟窗口’，能运用远程身份核验、音视频交互、资料在线传送等技术，实现线上远程协同办税。下一步，我们将重点聚焦办税缴费中的高频事项和纳税人、缴费大反映的突出问题，以更大力度，更优举措让群众感到好办事，”C市税务局赵副局长说。 “每到晚上，这段路黑乎乎一片。驾车时不开远光灯根本看不见，但开远光灯又影响对向行驶的车辆。”家住逸云路的李先生线上向C市雨霞区“办不成事窗口”反映路灯照明问题。今年年初，雨霞区政务服务中心设立该窗口，聚焦群众急难愁盼问题，为群众排忧解难，这是窗口收到的第一件网络反映件，工作人员第一时间回访了解到，原来逸云路路灯一直未亮，系项目未移交至路灯管理部门，无法开展正常通电管养等原因所致。了解情况后，政务服务中心随即督促相关责任单位解决问题，晚上还派干部到现场督查。雨霞区住建环保局、雨霞城建集团等单位相关负责同志高度重视，即知即办，组织人员加班加点处理，三天后，逸云路32盏路灯全部亮了。“本来是抱着试一试的心态，没想到三天就解决问题了。”李先生赞叹。如今，雨霞区“办不成事窗口”正推动“无政策障碍”问题加快办理。群众在办理业务过程中，不光“有人管”、“能解决”、“不白跑”，还实现了事事有着落、件件有回音。“设立‘办不成事窗口’，既是要帮群众解决疑难问题，也是要倒逼干部担当作为、解决实际问题。”雨霞区政务服务中心王主任坦言，“设立‘办不成事窗口’只是一个抓手，根本目的是要把群众的事办好。”","source":"2025年国家公务员考试《申论》真题（行政执法类）"}]};

<script>

(function () {

const TAXONOMY = [
  { module:'常识判断', icon:'🌏', subs:['政治','法律','经济','人文历史','科技生活','地理国情'] },
  { module:'言语理解与表达', icon:'📖', subs:['逻辑填空','片段阅读','语句表达'] },
  { module:'数量关系', icon:'🔢', subs:['数学运算','数字推理'] },

  { module:'资料分析', icon:'📊', subs:['文字资料','表格资料','图形资料','综合资料'] },
  { module:'申论', icon:'✍️', subs:['归纳概括','综合分析','提出对策','贯彻执行','申发论述'] }
];

/* ---------- 国考行政执法类《行测》法定卷式：130题 / 120分钟 ---------- */
const STANDARD_PAPER = {
  name:'国考行政执法类《行测》标准卷',
  minutes:120,
  parts:[
    { module:'常识判断',         count:20 },
    { module:'言语理解与表达',   count:40 },
    { module:'数量关系',         count:10 },
    { module:'判断推理',         count:40 },
    { module:'资料分析',         count:20 }
  ]
};

/* ---------- 运行态 ---------- */
const S = {
  data:{ papers:[], questions:[] },
  byId:{},
  route:{ name:'home', params:{} },
  session:null,          // 当前答题会话
  store:{ wrong:{}, fav:{}, done:{} }
};
const LS_KEY = 'kaogong_v1';

/* ---------- 工具 ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const LET = ['A','B','C','D','E','F','G','H'];
function toast(msg, ms) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), ms || 1700);
}
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.store)); } catch(e){} }
function loadStore(){
  try { const r = localStorage.getItem(LS_KEY); if (r) S.store = Object.assign(S.store, JSON.parse(r)); } catch(e){}
}
function hms(sec){
  sec = Math.max(0, sec|0);
  const m = (sec/60)|0, s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function isEssay(q){ return q.kind === 'essay' || q.module === '申论'; }

/* ==========================================================================
   会话（Session）：一次答题的全部状态
   ========================================================================== */
function newSession(opts){
  const qs = opts.questions || [];
  return {
    id:'s' + Date.now(),
    title: opts.title || '答题',
    kind: opts.kind || 'paper',          // paper | drill | compose
    minutes: opts.minutes || 0,
    questions: qs,
    answers: {},        // qid -> 'A' | 'B' ... 或 {text:''}
    flags: {},          // qid -> true 标记
    idx: 0,
    submitted: false,
    startedAt: Date.now(),
    left: (opts.minutes || 0) * 60,
    timer: null,
    paperId: opts.paperId || null
  };
}
function scoreSession(s){
  let right = 0, wrong = 0, blank = 0, scored = 0;
  const stat = {};
  s.questions.forEach(q => {
    if (isEssay(q)) return;                 // 申论不计客观分
    scored++;
    const m = q.module || '其他';
    stat[m] = stat[m] || { total:0, right:0 };
    stat[m].total++;
    const a = s.answers[q.id];
    if (a == null || a === '') { blank++; return; }
    if (a === q.answer) { right++; stat[m].right++; } else { wrong++; }
  });
  return { right, wrong, blank, scored, total:s.questions.length, stat };
}

/* ==========================================================================
   启动
   ========================================================================== */
function boot(){
  loadStore();
  S.data = window.EXAM_DATA || { papers:[], questions:[] };
  S.data.questions.forEach(q => { S.byId[q.id] = q; });
  // 兜底：若某试卷未声明题目列表，则按 paperId 反查
  S.data.papers.forEach(p => {
    if (!p.questionIds || !p.questionIds.length) {
      p.questionIds = S.data.questions.filter(q => q.paperId === p.id).map(q => q.id);
    }
  });
  window.addEventListener('hashchange', onHash);
  onHash();

function onHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
  const i = h.indexOf('?');
  const name = i < 0 ? h : h.slice(0, i);
  const params = {};
  if (i >= 0) h.slice(i+1).split('&').forEach(kv => {
    const p = kv.split('='); if (p[0]) params[p[0]] = p[1] || '';
  });
  S.route = { name, params };
  render();
}
function go(hash){ location.hash = hash; }
function back(){
  if (S.route.name === 'quiz') { if (confirm('确定要退出本次答题吗？进度将不保存。')) go('home'); return; }
  if (history.length > 1) history.back(); else go('home');
}

/* ==========================================================================

let _lastRouteKey = '';
function render(){
  const r = S.route, app = $('#app');
  const views = {
    home: vHome, papers: vPapers, paper: vPaper,
    drill: vDrill, drillSub: vDrillSub,
    compose: vCompose, quiz: vQuiz, result: vResult, wrong: vWrong
  };
  const fn = views[r.name] || vHome;
  const key = r.name + '|' + JSON.stringify(r.params);
  const changed = key !== _lastRouteKey;
  _lastRouteKey = key;
  app.innerHTML = fn();
  bind();
  if (changed) window.scrollTo(0, 0);
  if (r.name === 'quiz') startTimer();
}

function vQuiz(){
  const s = S.session;
  if (!s || !s.questions.length) return nav('答题') + emptyBox('没有进行中的答题');
  const q = s.questions[s.idx];
  if (!q) return nav('答题') + emptyBox('题目不存在');
  const sub = s.submitted;
  const my = s.answers[q.id];
  const essay = isEssay(q);

  let html = nav(s.title, {
    backText:'‹ 退出',
    right:{ act:'sheet', text:'答题卡' }
  });

  html += '<div class="page" style="padding-bottom:110px">';

  // 进度条
  html += `<div class="card" style="margin-bottom:10px"><div class="card-bd" style="padding:10px 14px">
    <div class="row">
      <div class="grow muted">第 <b style="color:var(--brand)">${s.idx+1}</b> / ${s.questions.length} 题
        ${q.module?'<span class="tag" style="margin-left:6px">'+esc(q.module)+'</span>':''}
        ${q.sub?'<span class="tag g" style="margin-left:4px">'+esc(q.sub)+'</span>':''}</div>
      <div class="tiny" id="timer" style="font-variant-numeric:tabular-nums">${s.minutes?hms(s.left):'不计时'}</div>
    </div>
    <div style="height:4px;background:#eef1f5;border-radius:3px;margin-top:9px;overflow:hidden">
      <div style="height:100%;width:${((s.idx+1)/s.questions.length*100).toFixed(1)}%;background:var(--brand);border-radius:3px;transition:width .25s"></div>
    </div></div></div>`;

  html += '<div class="card"><div class="card-bd">';
  if (q.material) {
    const long = q.material.length > 320;
    html += '<div class="material' + (long ? ' collapsed' : '') + '" id="matBox">' + esc(q.material) + '</div>';
    if (long) html += '<div class="matToggle" data-act="toggleMat">展开全部给定资料 ▾</div>';
  }
  html += '<div class="qstem">' + renderStem(q.stem, s, q) + '</div>';

  if (essay) {
    const val = (my && my.text) ? my.text : '';
    html += `<div style="margin-top:14px"><div class="muted" style="margin-bottom:6px">作答区（申论主观题，请手写作答）</div>
      <textarea id="essayBox" placeholder="在此输入你的作答…" ${sub?'readonly':''}>${esc(val)}</textarea>
      <div class="tiny" style="margin-top:5px;text-align:right" id="wcount">${val.length} 字</div></div>`;
    if (sub) {
      html += `<div class="ansbox"><div class="ah ok">📘 参考答案（申论无绝对标准答案，以下为评分要点）</div>
        <div class="ab"><div class="lbl">参考答案要点</div>${esc(q.answer||'—')}
        ${q.explanation?'<div class="exp"><b>解析/评分说明：</b>\n'+esc(q.explanation)+'</div>':''}</div></div>`;
    }
  } else {
    html += '<div class="opts">';
    (q.options||[]).forEach((op, i) => {
      const K = LET[i];
      let cls = 'opt';
      if (sub) {
        if (K === q.answer) cls += ' right';
        else if (K === my) cls += ' wrong';
        else cls += ' dis';
      } else if (K === my) cls += ' sel';
      html += `<div class="${cls}" data-act="pick" data-k="${K}">
        <div class="k">${K}</div><div class="v">${esc(op)}</div></div>`;
    });
    html += '</div>';
    if (sub) {
      const ok = my === q.answer;
      html += `<div class="ansbox">
        <div class="ah ${ok?'ok':'bad'}">${ok?'✅ 回答正确':(my?'❌ 回答错误':'⚪ 未作答')}　正确答案：${esc(q.answer)}${my?'　你的答案：'+esc(my):''}</div>
        <div class="ab">${q.explanation?'<div class="lbl">解析</div>'+esc(q.explanation):'<span class="muted">暂无解析</span>'}
        ${q.source?'<div class="exp"><b>来源：</b>'+esc(q.source)+'</div>':''}</div></div>`;
    }
  }
  html += '</div></div></div>';

  // 底部操作
  html += `<div class="bottombar">
    <button class="btn gray" data-act="prev" ${s.idx===0?'disabled':''}>上一题</button>
    ${q.id ? '<button class="btn gray" style="flex:0 0 56px" data-act="flagQ" title="标记">' + (s.flags[q.id]?'★':'☆') + '</button>' : ''}
    ${s.idx < s.questions.length-1
      ? '<button class="btn" data-act="next">下一题</button>'
      : (sub ? '<button class="btn" data-act="finishBack">完成</button>' : '<button class="btn" data-act="submit">交卷</button>')}
  </div>`;
  return html;
}
function renderStem(stem, s, q){
  return esc(stem).replace(/\n/g, '<br>');
}

/* ---------- 答题卡 ---------- */
function showSheet(){
  const s = S.session; if (!s) return;
  let html = '<div class="sheet">';
  s.questions.forEach((q, i) => {
    let cls = 'n';
    const a = s.answers[q.id];
    if (s.submitted) {
      if (isEssay(q)) cls += a && a.text ? ' done' : '';
      else if (a === q.answer) cls += ' ok';
      else if (a) cls += ' no';
      else cls += '';
    } else if (a != null && a !== '') cls += ' done';
    if (i === s.idx) cls += ' cur';
    html += `<div class="${cls}" data-jump="${i}">${i+1}</div>`;
  });
  html += '</div>';
  const done = s.questions.filter(q => { const a = s.answers[q.id]; return a != null && a !== ''; }).length;
  openModal(`答题卡　已完成 ${done} / ${s.questions.length}`,
    html + (s.submitted ? '' : '<div class="btn-row"><button class="btn" data-act="submit" style="margin:0">交卷并查看答案</button></div>'));
}
function openModal(title, body){
  const old = $('#modal'); if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'modal';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center';
  d.innerHTML = `<div style="background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))">
    <div style="font-size:16px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <span>${esc(title)}</span><span data-close="1" style="color:var(--t3);font-size:22px;line-height:1;cursor:pointer">×</span></div>
    ${body}</div>`;
  d.addEventListener('click', e => {
    if (e.target === d || e.target.dataset.close) { d.remove(); return; }
    const j = e.target.dataset.jump;
    if (j != null) {
      if (S.session) S.session.idx = +j;
      d.remove(); render(); window.scrollTo(0, 0); return;
    }
    const t = e.target.closest('[data-go],[data-act]');
    if (!t) return;
    d.remove();
    if (t.dataset.go) { go(t.dataset.go); return; }
    handleAct(t.dataset.act, t);
  });
  document.body.appendChild(d);
}

/* ---------- 计时器 ---------- */
function startTimer(){
  const s = S.session; if (!s) return;
  clearInterval(s.timer);
  if (!s.minutes || s.submitted) return;
  s.timer = setInterval(() => {
    s.left--;
    const el = $('#timer'); if (el) el.textContent = hms(s.left);
    if (s.left <= 0) { clearInterval(s.timer); toast('时间到，自动交卷'); doSubmit(); }
  }, 1000);
}

/* ==========================================================================
   交卷 / 结果
   ========================================================================== */
function doSubmit(){
  const s = S.session; if (!s || s.submitted) return;
  const unanswered = s.questions.filter(q => { const a = s.answers[q.id]; return a == null || a === ''; }).length;
  if (unanswered > 0 && s.timeUp !== true) {
    if (!confirm('还有 ' + unanswered + ' 题未作答，确定交卷吗？')) return;
  }
  s.submitted = true;
  clearInterval(s.timer);
  const r = scoreSession(s);
  // 记录错题
  s.questions.forEach(q => {
    if (isEssay(q)) return;
    const a = s.answers[q.id];
    if (a && a !== q.answer) S.store.wrong[q.id] = (S.store.wrong[q.id]||0)+1;
  });
  saveStore();
  go('result');
}

function vResult(){
  const s = S.session; if (!s) return nav('成绩') + emptyBox('无成绩');
  const r = scoreSession(s);
  const rate = r.scored ? Math.round(r.right / r.scored * 100) : 0;
  const grade = rate>=85?['优秀','#1a9d5a']:rate>=70?['良好','#1a56c4']:rate>=60?['及格','#b26a00']:['需加强','#d93025'];
  let html = nav('本次成绩', { backText:'‹ 返回' });
  html += '<div class="page">';
  html += `<div class="card"><div class="score">
    <div class="big">${r.right}<small> / ${r.scored}</small></div>
    <div class="sub">正确率 <b style="color:${grade[1]}">${rate}%</b>　评级：<b style="color:${grade[1]}">${grade[0]}</b></div>
    <div class="sub muted">答错 ${r.wrong} 题 · 未答 ${r.blank} 题${r.total>r.scored?' · 主观题 '+ (r.total-r.scored) +' 道':''}</div>
    <div class="bars">`;
  Object.keys(r.stat).forEach(m => {
    const st = r.stat[m], p = st.total ? Math.round(st.right/st.total*100) : 0;
    html += `<div class="bar"><div class="bl"><span>${esc(m)}</span><span>${st.right}/${st.total}　${p}%</span></div>
      <div class="bt"><div class="bf" style="width:${p}%"></div></div></div>`;
  });
  html += '</div></div></div>';
  html += `<div class="btn-row" style="margin-top:0">
    <button class="btn" data-act="reviewAll">查看逐题解析</button>
    <button class="btn sec" data-act="retryWrong">重做错题</button></div>`;
  html += '</div>';
  return html;
}

/* ==========================================================================
   错题本
   ========================================================================== */
function vWrong(){
  const ids = Object.keys(S.store.wrong);
  let html = nav('我的错题本');
  if (!ids.length) return html + emptyBox('暂无错题', '做错的题目会自动收入这里');
  const qs = ids.map(id => S.byId[id]).filter(Boolean);
  html += '<div class="page">';
  html += '<div class="card"><div class="card-hd">共 ' + qs.length + ' 道错题</div><div class="card-bd">';
  html += '<button class="btn" data-act="startWrong">开始重做全部错题</button>';
  html += '<div class="btn-row"><button class="btn gray sm" data-act="clearWrong">清空错题本</button></div>';
  html += '</div></div>';
  const mods = {}; qs.forEach(q => mods[q.module||'其他'] = (mods[q.module||'其他']||0)+1);
  html += '<div class="card"><div class="card-hd">错题分布</div><div class="card-bd"><div class="row" style="flex-wrap:wrap;gap:7px">';
  Object.keys(mods).forEach(m => html += '<span class="tag">'+esc(m)+' '+mods[m]+'</span> ');
  html += '</div></div></div></div>';
  return html;
}

function emptyBox(t, d){
  return '<div class="empty"><div class="e">📭</div><div style="font-weight:600;color:var(--t2)">'+esc(t)+'</div>'+(d?'<div style="margin-top:6px;font-size:12.5px">'+esc(d)+'</div>':'')+'</div>';
}

/* ==========================================================================
   事件绑定
   ========================================================================== */
function bind(){
  const app = $('#app');
  app.onclick = function (e) {
    const t = e.target.closest('[data-go],[data-act],[data-step],[data-year],[data-region]');
    if (!t) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.step) { stepCount(t.dataset.m, +t.dataset.step); return; }
    if (t.dataset.year) { t.classList.toggle('on'); t.classList.toggle('g'); return; }
    if (t.dataset.region) { t.classList.toggle('on'); t.classList.toggle('g'); return; }
    handleAct(t.dataset.act, t);
  };
  // 主观题字数统计
  const box = $('#essayBox');
  if (box) box.addEventListener('input', () => {
    const s = S.session, q = s.questions[s.idx];
    s.answers[q.id] = { text: box.value };
    const w = $('#wcount'); if (w) w.textContent = box.value.length + ' 字';
  });
}
/* 统一的动作分发：页面与弹层共用，避免弹层内按钮点不动 */
function handleAct(act, el) {
  el = el || {};
  const d = el.dataset || {};
  switch (act) {
    case 'back': back(); break;
    case 'menu': openMenu(); break;
    case 'sheet': showSheet(); break;
    case 'pick': pick(d.k); break;
    case 'prev': nav_q(-1); break;
    case 'next': nav_q(1); break;
    case 'flagQ': toggleFlag(); break;
    case 'toggleMat': {
      const box = $('#matBox'), tg = el;
      if (box) {
        const on = box.classList.toggle('collapsed');
        if (tg) tg.textContent = on ? '展开全部给定资料 ▾' : '收起给定资料 ▴';
      }
      break;
    }
    case 'submit': doSubmit(); break;
    case 'finishBack': go('home'); break;
    case 'startPaper': startPaper(d.id, 'normal'); break;
    case 'startPaperRev': startPaper(d.id, 'rev'); break;
    case 'startPaperOrder': startPaper(d.id, 'order'); break;
    case 'startDrill': startDrill(d.m, d.s, +d.n); break;
    case 'doCompose': doCompose(); break;
    case 'reviewAll': if (S.session) S.session.idx = 0; go('quiz'); break;
    case 'retryWrong': retryWrong(); break;
    case 'startWrong': startWrong(); break;
    case 'clearWrong':
      if (confirm('确定清空错题本？')) { S.store.wrong = {}; saveStore(); render(); }
      break;
    case 'resetAll':
      if (confirm('清除全部做题记录、错题本？')) {
        S.store = { wrong: {}, fav: {}, done: {} }; saveStore();
        location.hash = 'home'; location.reload();
      }
      break;
  }
}
function syncTagStyle(){ /* 占位：样式由 class 控制 */ }
function openMenu(){
  openModal('更多', `<div class="item" data-go="wrong"><div class="grow"><div class="tt">📕 我的错题本</div></div><div class="cnt">›</div></div>
    <div class="item" data-go="compose"><div class="grow"><div class="tt">🎲 随机组卷</div></div><div class="cnt">›</div></div>
    <div class="item" data-go="drill"><div class="grow"><div class="tt">🎯 专项训练</div></div><div class="cnt">›</div></div>
    <div class="item" data-act="resetAll"><div class="grow"><div class="tt" style="color:var(--bad)">🗑 清除全部作答记录</div></div><div class="cnt">›</div></div>`);
}

/* ---------- 交互动作 ---------- */
function pick(k){
  const s = S.session, q = s.questions[s.idx];
  if (s.submitted) return;
  s.answers[q.id] = k;
  if (navigator.vibrate) navigator.vibrate(8);
  render();
}
function nav_q(d){
  const s = S.session;
  const n = s.idx + d;
  if (n < 0) return;
  if (n >= s.questions.length) return;
  s.idx = n; render();
  window.scrollTo(0, 0);
}
function toggleFlag(){
  const s = S.session, q = s.questions[s.idx];
  s.flags[q.id] = !s.flags[q.id]; render();
}
function stepCount(m, d){
  const el = $('#cnt-' + m); if (!el) return;
  const avail = S.data.questions.filter(q => q.module === m && q.module !== '申论').length;
  const cur = +el.textContent;
  const next = Math.max(0, Math.min(avail, cur + d));
  el.textContent = next;
}
function selectedYears(){
  const els = $$('#yearBox .ysel.on'); return els.map(e => +e.dataset.year);
}
function selectedRegions(){
  const els = $$('#regionBox .rsel.on'); return els.map(e => e.dataset.region);
}

/* ---------- 启动答题 ---------- */
function startSession(questions, opts){
  if (!questions.length) { toast('没有可用题目'); return; }
  S.session = newSession(Object.assign({ questions }, opts));
  go('quiz');
}
function startPaper(id, mode){
  const p = S.data.papers.find(x => x.id === id); if (!p) return;
  let qs = (p.questionIds||[]).map(i => S.byId[i]).filter(Boolean);
  if (mode === 'rev') qs = qs.slice().reverse();
  const timed = mode !== 'order';
  startSession(qs, { title:p.title, kind:'paper', minutes: timed ? (p.minutes||120) : 0, paperId:p.id });
}
function startDrill(m, sub, n){
  let qs = S.data.questions.filter(q => q.module === m && (!sub || q.sub === sub));
  if (!qs.length) { toast('暂无题目'); return; }
  qs = n ? shuffle(qs).slice(0, n) : shuffle(qs);
  startSession(qs, { title:(sub || m) + ' · 专项训练', kind:'drill', minutes:0 });
}
function startWrong(){
  const qs = Object.keys(S.store.wrong).map(i => S.byId[i]).filter(Boolean);
  if (!qs.length) { toast('错题本为空'); return; }
  startSession(shuffle(qs), { title:'错题重做', kind:'drill', minutes:0 });
}
function retryWrong(){
  const s = S.session; if (!s) return;
  const qs = s.questions.filter(q => { const a = s.answers[q.id]; return !isEssay(q) && a && a !== q.answer; });
  if (!qs.length) { toast('本次没有错题 🎉'); return; }
  startSession(shuffle(qs), { title:'错题重做', kind:'drill', minutes:0 });
}
function doCompose(){
  const years = selectedYears(), regions = selectedRegions();
  if (!years.length) { toast('请至少选择一个年份'); return; }
  if (!regions.length) { toast('请至少选择一个地区'); return; }
  const pool = S.data.questions.filter(q =>
    q.module !== '申论' && years.indexOf(q.year) >= 0 && regions.indexOf(q.region) >= 0);
  if (!pool.length) { toast('所选范围内没有题目'); return; }

  const picked = [];
  const shortage = [];
  STANDARD_PAPER.parts.forEach(p => {
    const el = $('#cnt-' + p.module);
    const want = el ? +el.textContent : 0;
    if (!want) return;
    let sub = pool.filter(q => q.module === p.module);
    sub = shuffle(sub);
    if (sub.length < want) shortage.push(p.module + '(需' + want + '实' + sub.length + ')');
    picked.push(...sub.slice(0, want));
  });
  if (!picked.length) { toast('请设置题量'); return; }
  if (shortage.length) toast('题库不足：' + shortage.join('，'), 2600);
  // 按模块顺序排列
  const order = STANDARD_PAPER.parts.map(p => p.module);
  picked.sort((a,b) => order.indexOf(a.module) - order.indexOf(b.module));
  const date = new Date();
  const title = '随机组卷 ' + (date.getMonth()+1) + '月' + date.getDate() + '日 · ' + picked.length + '题';
  startSession(picked, { title, kind:'compose', minutes:120 });
}

window.__KG = { S, go, boot };
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
})();

</script>
