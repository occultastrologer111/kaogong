业务金额同比增长量（70.27 万×8.70% ）＞城银清算支付清算系统处理业务金额同比增长量（9744.45×36.31%），正确； C 选项，数据定位第二段，根据公式：，可得所求为，错误； D 选项，数据第三段，根据公式：，可得所求为万笔＞40 万笔，正确。","material":"根据所给材料，回答下面的问题：截至2023年末，我国集成电路布图设计登记累计申请93147件，发证72378件，2024年1-4月，我国集成电路布图设计登记申请3503件，发证4189件。","source":"2025年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-006","paperId":"gk2024-xz","num":6,"year":2024,"region":"国家","module":"常识判断","sub":"政治","stem":"在2023 年7 月召开的全国生态环境保护大会上，习近平总书记全面总结我国生态文明建设取得的举世瞩目的巨大成就，精辟概括了“四个重大转变”，这四个重大转变是： ①实现由重点整治到系统治理的重大转变 ②实现由被动应对到主动作为的重大转变 ③实现由全球环境治理参与者到引领者的重大转变 ④实现由实践探索到科学理论指导的重大转变 ⑤实现由多重压力叠加到单一结构性压力的重大转变","options":["①②③④","①②③⑤","②③④⑤","①③④⑤"],"answer":"D","explanation":"2023 年7 月17 日至18 日，全国生态环境保护大会在北京召开。习近平总书记在讲话中强调，我们从解决突出生态环境问题入手，注重点面结合、标本兼治，实现由重点整治到系统治理的重大转变；坚持转变观念、压实责任，不断增强全党全国推进生态文明建设的自觉性主动性，实现由被动应对到主动作为的重大转变；紧跟时代、放眼世界，承担大国责任、展现大国担当，实现由全球环境治理参与者到引领者的重大转变；不断深化对生态文明建设规律的认识，形成新时代中国特色社会主义生态文明思想，实现由实践探索到科学理论指导的重大转变。不包括“实现由多重压力叠加到单一结构性压力的重大转变”。①②③④项说法正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-007","paperId":"gk2024-xz","num":7,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"党的二十大报告指出，依托我国超大规模市场优势，以国内大循环吸引全球资源要素，增强国内国际两个市场两种资源联动效应，提升贸易投资合作质量和水平。下列关于提升贸易投资合作质量和水平的措施，表述准确的是： ①推动货物贸易优化升级，创新服务贸易发展机制，发展数字贸易，加快建设贸易强国 ②扩大外资准入负面清单，营造市场化、法治化、国际化一流营商环境 ③优化区域开放布局，巩固中西部和东北地区开放先导地位，提高东部地区开放水平 ④实施自由贸易试验区提升战略，扩大面向全球的高标准自由贸易区网络","options":["①②","②③","①④","③④"],"answer":"B","explanation":"①：二十大报告指出，加快发展方式绿色转型。推动经济社会发展绿色化、低碳化是实现高质量发展的关键环节。①项正确。 ②：二十大报告指出，深入推进环境污染防治。坚持精准治污、科学治污、依法治污，持续深入打好蓝天、碧水、净土保卫战。②项正确。 ③：二十大报告指出，深入推进能源革命，加强煤炭清洁高效利用，加大油气资源勘探开发和增储上产力度，加快规划建设新型能源体系，统筹水电开发和生态保护，积极安全有序发展核电，加强能源产供储销体系建设，确保能源安全。应该是“加强煤炭清洁高效利用”，而不是“加强天然气清洁高效利用”。③项错误。 ④：二十大报告指出，推行草原森林河流湖泊湿地休养生息，实施好长江十年禁渔，健全耕地休耕轮作制度。应该是“十年”，而不是“二十年”。④项错误。 ⑤：二十大报告指出，完善碳排放统计核算制度，健全碳排放权市场交易制度。提升生态系统碳汇能力。⑤项正确。本题正确共计3 项。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-008","paperId":"gk2024-xz","num":8,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"为深入学习贯彻习近平新时代中国特色社会主义思想，全面贯彻落实党的二十大精神，党中央决定，在全党大兴调查研究，作为在全党开展的主题教育的重要内容。下列与调查研究有关的说法不准确的是：","options":["调查研究是中国共产党克敌制胜的“三大法宝”之一","“没有调查，没有发言权”是针对“左”倾主义提出的","1961 年是党史上有名的“调查研究年”、“实事求是年”","《寻乌调查》是毛泽东调查研究的经典之作"],"answer":"C","explanation":"1939 年10 月，毛泽东在《共产党人发刊词》中总结中国共产党18 年革命斗争的历史经验时指出：“统一战线、武装斗争、党的建设，是中国共产党在中国革命中战胜敌人的三大法宝”。调查研究不是中国共产党克敌制胜的“三大法宝”之一。C 项说法不正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-009","paperId":"gk2024-xz","num":9,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"2022 年11 月28 日，中共中央办公厅、国务院办公厅发布《乡村振兴责任制实施办法》。下列与乡村振兴责任制有关的说法不准确的是:","options":["坚持党对农村工作的全面领导，省市县乡村五级书记抓乡村振兴","中央和国家机关有关部门要以健全城乡融合发展体制为主线深化农村改革","地方政府乡村振兴要把确保粮食和重要农产品供给作为首要任务","县级党委和政府是乡村振兴“一线指挥部”"],"answer":"A","explanation":"2022 年版《乡村振兴责任制实施办法》第五条规定，中央和国家机关有关部门乡村振兴责任主要包括：……（六）以处理好农民和土地的关系为主线深化农村改革，巩固和完善农村基本经营制度，发展新型农村集体经济，发展新型农业经营主体和社会化服务，发展农业适度规模经营……A 项中“以健全城乡融合发展体制为主线”应改为“以处理好农民和土地的关系为主线”。A 项说法不正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-010","paperId":"gk2024-xz","num":10,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"习近平总书记强调，要把黑土地保护作为一件大事来抓，把黑土地用好养好。《中华人民共和国黑土地保护法》自2022 年8 月1 日起施行，下列表述不符合该法规定的是:","options":["黑土层深厚、土壤性状良好的黑土地划入永久基本农田，重点用于粮食生产","无法修复的黑土地不列入黑土地保护范围进行修复","县级以上人民政府应当将黑土地保护工作纳入国民经济和社会发展规划","除国防建设项目选址无法避开外，其他建设项目一律不得占用黑土地"],"answer":"B","explanation":"2022 年版《黑土地保护法》第二十一条第一款规定，建设项目不得占用黑土地；确需占用的，应当依法严格审批，并补充数量和质量相当的耕地。此法条并未明确说明国防建设项目选址，B 项意思表述与法条原文不符。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-011","paperId":"gk2024-xz","num":11,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"下列做法符合《中华人民共和国行政处罚法》规定的是:","options":["甲综合行政执法局责令孙某限期拆除其违法建筑","某变电站项目建成六年后，乙生态环境局发现其系“未批先建”，处以罚款","某公司因某次违规代开发票被丙税务部门罚款三次","丁市场监督管理局对王某作出行政拘留七日并罚款一千元的处罚"],"answer":"A","explanation":"A 选项：2021 年版《行政处罚法》第二十八条第一款规定，行政机关实施行政处罚时，应当责令当事人改正或者限期改正违法行为。故甲综合行政执法局责令孙某限期拆除其违法建筑符合法律规定。A 选项正确。 B 选项：“某变电站项目建成六年后，乙生态环境局发现其系‘未批先建’，处以罚款”。这里，我们要注意到时间因素。根据《行政处罚法》第三十六条：“违法行为在二年内未被发现的，不再给予行政处罚；涉及公民生命健康安全、金融安全且有危害后果的，上述期限延长至五年。法律另有规定的除外。”B 选项和上述发条不符合。 C 选项：“某公司因某次违规代开发票被丙税务部门罚款三次”。但根据《行政处罚法》第二十九条：“对当事人的同一个违法行为，不得给予两次以上罚款的行政处罚。同一个违法行为违反多个法律规范应当给予罚款处罚的，按照罚款数额高的规定处罚。”因此，丙税务部门对同一违法行为进行三次罚款是违法的。 D 选项：“丁市场监督管理局对王某作出行政拘留七日并罚款一千元的处罚”。行政拘留是指法定的行政机关（专指公安机关）依法对违反行政法律规范的人，在短期内限制人身自由的一种行政处罚。因此，丁市场监督管理局对王某作出行政拘留的处罚是违法的。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-012","paperId":"gk2024-xz","num":12,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"下列哪种情形，我国刑法不具有管辖权?","options":["甲国公民在我国国际机场里给乙国公民下毒，乙国公民出境后毒发身亡","在从我国出发已行驶至甲国的国际列车上，甲国公民对乙国公民实施抢劫","我国公民在我国境内，通过电话教唆在甲国的甲国公民故意杀人","我国公民在甲国境内，对甲国公民实施绑架行为"],"answer":"C","explanation":"2021 年版《刑法》第六条规定，凡在中华人民共和国领域内犯罪的，除法律有特别规定的以外，都适用本法。凡在中华人民共和国船舶或者航空器内犯罪的，也适用本法。这里并不包括国际列车，本题中，首先在国际列车上实施犯罪行为，不属于我国管辖领域，另外，甲国公民对乙国公民实施抢劫，甲乙都不属于我国国籍，我国刑法不具有管辖权。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-013","paperId":"gk2024-xz","num":13,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"诉讼时效是指民事权利受到侵害的权利人在法定的时效期间内不行使权利，当时效期间届满时，人民法院对权利人的权利不再进行保护的制度。下列情形不适用诉讼时效的是: ①甲要求邻居拆除妨碍通行的围墙 ②乙要求物业修复可能导致儿童坠落的下水道 ③丙要求长期占用其名下房屋的人搬离 ④丁要求某公司支付其专利使用费","options":["①③④","②③④","①②③","①②④"],"answer":"D","explanation":"2021 年版《民法典》第一百九十六条规定，下列请求权不适用诉讼时效的规定：（一）请求停止侵害、排除妨碍、消除危险；（二）不动产物权和登记的动产物权的权利人请求返还财产；（三）请求支付抚养费、赡养费或者扶养费；（四）依法不适用诉讼时效的其他请求权。 ①甲要求邻居拆除妨碍通行的围墙，属于情形（一）排除妨碍的情况； ②乙要求物业修复可能导致儿童坠落的下水道，属于情形（一）消除危险的情况； ③丙要求长期占用其名下房屋的人搬离，属于情形（二）。 ④应适用普通诉讼时效的规定，①②③均不适用诉讼时效。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-014","paperId":"gk2024-xz","num":14,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"老张常居国外，其儿子小张常住老张名下房子内。小张在外欠债较多，伪造手续后将老张名下房屋卖给了不知情的小王，小王支付对价并办理了产权变更手续。下列有关说法正确的是:","options":["因小张伪造手续，该买卖行为无效","小张与小王之间的买卖合同关系有效，但不发生物权变动效力","小张与小王之间的买卖合同及物权变动均有效","老张有权向小王请求损害赔偿"],"answer":"A","explanation":"老张儿子小张并非该房屋所有权人，无权处分该房屋，其处分行为属于无权处分。根据《民法典》第597 条规定：因出卖人未取得处分权致使标的物所有权不能转移的，买受人可以解除合同并请求出卖人承担违约责任。据此，说明无权处分的买卖合同有效。根据《民法典》第311 条规定：无处分权人将不动产或者动产转让给受让人的，所有权人有权追回；除法律另有规定外，符合下列情形的，受让人取得该不动产或者动产的所有权：（一）受让人受让该不动产或者动产时是善意；（二）以合理的价格转让；（三）转让的不动产或者动产依照法律规定应当登记的已经登记，不需要登记的已经交付给受让人。受让人依据前款规定取得不动产或者动产的所有权的，原所有权人有权向无处分权人请求损害赔偿。据此，本题中小王不知情，是善意的受让人，且支付对价并办理了产权变更手续，可以基于善意取得该房屋物权。因此物权变动也是有效的。A 项正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-015","paperId":"gk2024-xz","num":15,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"下列不能被授予专利权的是：","options":["一种医疗口腔内科专用的喷药器","一种治疗主动脉夹层的新型手术方法","一种计算机控制油墨颜色配制的装置","一种针对水稻辐射诱变育种的新技术"],"answer":"B","explanation":"《中华人民共和国专利法》第二十五条规定，对下列各项，不授予专利权：（一）科学发现；（二）智力活动的规则和方法；（三）疾病的诊断和治疗方法；（四）动物和植物品种；（五）原子核变换方法以及用原子核变换方法获得的物质；（六）对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计。 B 项属于（三）疾病的诊断和治疗方法，不能被授予专利权。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-016","paperId":"gk2024-xz","num":16,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"习近平总书记在给山东省地矿局第六地质大队全体地质工作者的回信中强调：“矿产资源是经济社会发展的重要物质基础，矿产资源勘查开发事关国计民生和国家安全。”下列与我国矿产资源有关的说法错误的是：","options":["锡矿是我国的优势矿产资源之一","我国已在南海实现天然气水合物试采","新疆罗布泊是我国钾盐的主要产地之一","我国目前最大的金矿在云南省内"],"answer":"D","explanation":"2023 年8 月10 日，山东黄金集团在济南召开西岭金矿勘探成果新闻发布会，其负责勘探的西岭金矿累计探获592.186 吨，刷新了国内最大单体金矿纪录。我国目前最大的金矿在山东，不在云南。D 项说法错误。其他选项说法均准确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-017","paperId":"gk2024-xz","num":17,"year":2024,"region":"国家","module":"常识判断","sub":"政治","stem":"某展览馆举办的“奋进新时代”主题成就展设置了一些地方展区。下列场景最可能出现的是：","options":["在天津展区，观众仔细阅读着展柜中黄文秀生前的日记，久久不愿离去","在江苏展区，杨柳青年画代表性传承人正忙着给观众们制作年画作品","在河北展区，观众在“地球卫士奖”奖杯前感叹荒原变林海的人间奇迹","在广西展区，观众在“今日开山岛”模型前聆听王继才、王仕花夫妇的守岛事迹"],"answer":"B","explanation":"地球卫士奖创立于2004 年，是联合国环境规划署每年颁发的一个国际奖项，表彰通过自身行动和影响力展现对环境领导力的承诺和愿景的个人，是联合国环保领域最高荣誉。2021 年8 月23 日，习近平总书记在河北省塞罕坝机械林场考察时强调：“塞罕坝林场建设史是一部可歌可泣的艰苦奋斗史。你们用实际行动铸就了牢记使命、艰苦创业、绿色发展的塞罕坝精神，这对全国生态文明建设具有重要示范意义。”百万亩林海铸就了一望无际的绿色屏障，诉说着几代塞罕坝人接续谱写“荒原变林海”的绿色奇迹。故在河北展区，感叹荒原变林海的人间奇迹最可能出现。B 项正确。D 选项中王继才、王仕花夫妇是江苏省灌云县开山岛民兵哨所所长和哨员，他们的守岛事迹与广西没有直接联系。C 选项中杨柳青年画是天津市杨柳青镇的传统民间木版年画，与江苏无关。A 选项中黄文秀（1989 年4 月-2019 年6 月），女，壮族，中共党员，广西田阳人，广西壮族自治区百色市委宣传部理论科原副科长、乐业县新化镇百坭村党支部原第一书记，与天津无关。因此，选择B 选项。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-018","paperId":"gk2024-xz","num":18,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与生活中的化学有关的说法错误的是：","options":["石油分馏利用了组分间的沸点差异，汽油比柴油沸点高","为增强铁质器具的抗腐蚀性，可以在其表面镀上一层锌","硫酸铜溶液可用于配制具有杀菌作用的波尔多液","洋葱独特的强烈刺激性气味来源于有机硫化合物"],"answer":"C","explanation":"A 项：硫酸铜溶液与氢氧化钙混合后，可以生成波尔多液。波尔多液是一种广泛使用的杀菌剂，主要用于防治果树、蔬菜和棉花的病害。因此，A 项正确。 B 项：锌是一种活泼的金属，容易与氧气反应生成致密的氧化锌膜，这层膜可以阻止内部的铁与氧气和水接触，从而防止铁生锈。因此，在铁质器具表面镀上一层锌可以增强其抗腐蚀性。B 项正确。 C 项：石油分馏是根据石油中各组分沸点的不同，通过加热使低沸点的烃先汽化，再冷凝而分离出来。汽油的沸点通常比柴油低，因此汽油会先被蒸馏出来。C 项描述“汽油比柴油沸点高”是错误的。 D 项：洋葱的强烈刺激性气味主要来源于其含有的有机硫化合物，如硫醇、硫醚等。这些化合物在洋葱被切割或咀嚼时会释放出来，产生强烈的刺激性气味。D 项正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-019","paperId":"gk2024-xz","num":19,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与家庭用电有关的说法错误的是：","options":["电能表应安装在家庭电路的干路上","空气开关需要搭配保险丝使用才能起到保护电路的作用","使用同一插线板供电的家用小电器之间是并联连接方式","白炽灯利用电流的热效应进行工作"],"answer":"D","explanation":"A 项：白炽灯的工作原理是电流通过灯丝（钨丝，熔点达3000 多摄氏度）时产生热量，螺旋状的灯丝不断将热量聚集，使得灯丝的温度达2000 摄氏度以上，灯丝在处于白炽状态时，就像烧红了的铁能发光一样而发出光来。因此，白炽灯是利用电流的热效应进行工作的，A 项正确。 B 项：电能表是用来测量电能的仪表，又称电度表、火表、千瓦小时表，指测量各种电学量的仪表。电能表通常安装在家庭电路的干路上，用于测量家庭电路的总耗电量，B 项正确。 C 项：在家庭电路中，各用电器之间互不影响，能够独立工作，因此它们是并联的。使用同一插线板供电的家用小电器之间也是并联连接方式，C 项正确。 D 项：空气开关是一种只要电路中电流超过额定电流就会自动断开的开关。空气开关是低压配电网络和电力拖动系统中非常重要的一种电器，它集控制和多种保护功能于一身。而保险丝的作用是当电路中有短路或严重过载时，由于电流的热效应，保险丝的温度会升高到熔点并熔断，从而切断电路，起到保护电路和用电设备的作用。但现代家庭电路中，由于空气开关已经具备了过载保护和短路保护的功能，因此不需要再额外搭配保险丝使用，D 项错误。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-020","paperId":"gk2024-xz","num":20,"year":2024,"region":"国家","module":"常识判断","sub":"法律","stem":"关于肥料，下列说法错误的是：","options":["化肥宜用金属器皿密封储藏，以防潮湿变质","秸秆、餐厨垃圾都是有机肥料的原料","细菌肥料一般应避光保存","水溶性肥料适合滴灌施肥"],"answer":"A","explanation":"A 项：化肥多有腐蚀性，应防止与皮肤、金属器具接触，化肥更适合用塑料等容器来储藏，而不是金属器皿。 B 项：水溶性肥料适合滴灌施肥。这是正确的。水溶性肥料可以完全溶解于水中，形成无色透明的营养液，非常适合滴灌、喷灌等现代农业生产方式。这种方式可以精确地控制施肥量，提高肥料的利用率。 C 项：秸秆和餐厨垃圾都是有机肥料的原料。这也是准确的。秸秆和餐厨垃圾都是有机物质，经过适当的处理和发酵，可以转化为有机肥料，为植物提供养分。 D 项：细菌肥料一般应避光保存。这也是正确的。细菌肥料中的微生物在光照条件下可能会受到抑制或死亡，从而影响其肥效。因此，细菌肥料通常需要在避光、阴凉、通风的地方保存。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-021","paperId":"gk2024-xz","num":21,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"推进公交专用车道的开放共享，不等于废除公交专用通道，更不等于在城市交通治理中不再坚持“公交先行”的理念。理想状况下的公交专用通道共享，应该是在不影响公交通行效率的前提下，方便社会车辆的通行，从而在整体上提升道路交通的通行效率，而并非。填入画横线部分最恰当的一项是：","options":["不分彼此","厚此薄彼","顾此失彼","此消彼长"],"answer":"C","explanation":"逻辑填空题。第一句话提到公交专用通道不能“废除”，即公交专用通道和社会车辆通道要兼顾，再根据横线前“是······而并非······”可知，横线处与前文语义相反，前文“在不影响公交通行效率的前提下，方便社会车辆的通行，从而在整体上提升道路交通的通行效率” 也是在强调要同时兼顾公交通行和社会车辆通行，所以横线处成语应表达不能兼顾双方的意思，C 项“顾此失彼”指顾了这个，顾不了那个，侧重强调不能兼顾，符合文意。A 项“不分彼此”意思是不分这个和那个，形容关系密切，交情深厚，不符合文意，排除；B 项“厚此薄彼” 意为重视或优待这一方，轻视或冷淡那一方，指对人、对事不同看待，形容对事物有偏见，不符合文意，且“厚此薄彼”侧重“厚薄”，“顾此失彼”侧重“有无”，根据题目的“废除”可知，强调“有无”，排除；D 项“此消彼长”指这个下降，那个上升，文段并非强调双方的上下动态变化过程，而是表达不能兼顾双方之意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-022","paperId":"gk2024-xz","num":22,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"所谓环境影响评价，是指对规划和建设项目实施后可能造成的环境影响进行分析、预测和评估，提出预防或减轻不良环境影响的对策和措施，进行跟踪监测的方法与制度。可以说，环境影响评价是控制环境风险的“ ”，也是在发展中守住绿水青山的第一道防线，对协同推进经济高质量发展和生态环境高水平保护发挥着重要作用。填入画横线部分最恰当的一项是：","options":["预警机","安全阀","试金石","缓冲器"],"answer":"B","explanation":"逻辑填空题。根据横线前“可以说”可知，横线处词语与前文构成因果关系，根据横线后“也是”可知，横线处词语与后文构成并列关系。前文提到“提出预防或减轻不良环境影响的对策和措施”，后文提到“也是在发展中守住绿水青山的第一道防线”，所以题目要体现“预防风险”“守住安全”的对策，B 项“安全阀”比喻保障安全的措施，符合文意。A 项“预警机”比喻能够提醒不好情况的事物，仅仅能起到“提醒”的作用，不能体现“预防”的对策，排除；C 项“试金石”比喻可靠的考验人或事物的方法，不符合文意，排除；D 项“缓冲器”比喻能够起到缓和冲突作用的事物，无法“防止”冲突，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-023","paperId":"gk2024-xz","num":23,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"世界航天大国都在积极开展空间碎片清除技术研究，提出了各自的清除方案。总的来看有两大类：一类是接触式，如机械臂抓捕、安装离轨装置等；第二类是非接触式，如用激光或离子束等进行推移。两类清除方式，都是要让碎片离开当前轨道，进入大气层烧毁。填入画横线部分最恰当的一项是：","options":["如出一辙","殊途同归","双管齐下","各有千秋"],"answer":"B","explanation":"逻辑填空题。横线前提出世界航天大国提出了各自的清除方案。接着介绍了两种不同的空间碎片清除方案，横线后提到两类清除方式的目的是一样的，都是让碎片离开当前轨道并进入大气层烧毁，横线处表达方式不同，但是目标相同。B 项“殊途同归”比喻采取不同的方法而得到相同的结果，符合文意。A 项“如出一辙”只能形容两种事物非常相似，但是两种清除方式并不“相似”，不符合文意，排除；C 项“双管齐下”比喻从两方面同时进行，强调用两种方法解决一个问题，但是第一句就提到不同的国家只使用了其中一个方法，排除； D 项“各有千秋”指各有所长，各有优点，各有特色，无法体现文段中得到了相同目的，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-024","paperId":"gk2024-xz","num":24,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"全面从严治党和鼓励担当作为是内在统一的，不是彼此对立的。严并不是要把大家管死，使人瞻前顾后、畏首畏尾，搞成暮气沉沉、的一潭死水，而是要通过明方向、、正风气、强免疫，形成风清气正的党内政治生态，营造有利于干事创业的良好环境，进一步调动全党的积极性、主动性、创造性。依次填入画横线部分最恰当的一项是：","options":["浑浑噩噩讲原则","唯唯诺诺严法纪","无所事事守底线","无所作为立规矩"],"answer":"D","explanation":"逻辑填空题。根据第一句可知，此文段的话题为“从严治党”和“担当作为”，因此第一空强调不要因为“从严治党”让一些人害怕被问责而变成“不敢作为”的一潭死水，所以横线处应体现“不作为”之意，C 项“无所事事”指闲着什么事都不干，D 项“无所作为”指工作中安于现状，缺乏创造性，符合文意。A 项“浑浑噩噩”形容糊里糊涂，愚昧无知，B 项“唯唯诺诺” 形容自己没有主意，一味附和，恭顺听从的样子，均与“不作为”无关，不符合文意，排除。第二空根据横线前后可知，横线处与“明方向、正风气、强免疫”形成并列，这三个动作的主体都是“党”，党来指明方向，整顿风气，加强免疫，D 项“立规矩”意为确立规矩，也是“党” 做出的行为，符合文意；C 项“守底线”意为守住底线，发出动作的主体是“党员”，不及D 项准确，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-025","paperId":"gk2024-xz","num":25,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"公正司法是维护社会公平正义的最后一道防线。在社会关系调节和纠纷解决中，司法具有作用。党的十八大以来，我们着力深化司法体制改革，加快建设公正高效权威的社会主义司法制度。让人民群众与司法“零距离”，使公平正义更加可见、可感、可。依次填入画横线部分最恰当的一项是：","options":["强制性信任","预防性贴近","指导性实现","终局性触及"],"answer":"D","explanation":"逻辑填空题。第一空根据“公正司法是维护社会公平正义的最后一道防线”可知，横线处需体现司法可以作为调节社会关系、解决纠纷的终极举措。D 项“终局性”指案件或纠纷一旦进入司法程序，由司法机关依法作出生效的判决、裁定或决定，便应得到最终解决或平息，符合文意。A 项“强制性”指必须依照法律适用，不能以个人意志予以变更，B 项“预防性”指预先做好事物发展过程中可能出现偏离主观预期轨道或客观普遍规律的应对措施，C 项“指导性”强调指示教导，均无法体现“最后一道防线”之意，排除。第二空，代入验证，D 项“触及”指接触到、触动，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-026","paperId":"gk2024-xz","num":26,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"北极地区常年漂浮着体积巨大、厚薄不一的海冰。面对这些海冰，绝大部分战舰只能，唯有破冰船和冰面下的潜艇敢于一试身手。当前，世界上力量最强的破冰船，排水量可达3.3 万吨，能够地破开近3 米厚的坚冰，堪称北极航线上的开路先锋。依次填入画横线部分最恰当的一项是：","options":["望而却步轻而易举","束手无策易如反掌","退避三舍游刃有余","裹足不前长驱直入"],"answer":"A","explanation":"逻辑填空题。第一空根据“绝大部分······唯有······”可知，绝大部分战舰都“不敢于一试身手”，A 项“望而却步”指看到了危险或力不能及的事而往后退缩，侧重想做却因为一些条件不敢做，符合文意。B 项“束手无策”形容遇到问题毫无解决的办法，侧重解决不了问题，体现不出“想却不敢”的意思，不符合文意，排除；C 项“退避三舍”比喻退让和回避，避免冲突，题目没有提到两者冲突，排除。D 项“裹足不前”比喻有所顾忌，不愿去做，体现不出“想却不敢”的意思，不符合文意，排除；第二空代入验证，根据“世界上力量最强”“堪称北极航线上的开路先锋”可知，该破冰船能够很容易地破除坚冰，A 项“轻而易举”形容事情容易做，不费力，省事，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-027","paperId":"gk2024-xz","num":27,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"从长远看，保护个人信息，并不是把信息数据与互联网经济开来，而是应当探讨如何在必要、合理、合规的基础上，实现信息保护与利用的共赢。在大数据、信息化时代，如何在海量个人信息中敏感信息、利用好其他可用信息，对发展信息产业、平衡数据应用与用户权益之间的关系，都具有重要意义。依次填入画横线部分最恰当的一项是：","options":["独立屏蔽","分离甄别","区别剔除","隔绝剥离"],"answer":"D","explanation":"逻辑填空题。第一空“不是······而是”表示反义并列关系，再根据“应当探讨如何在必要、合理、合规的基础上，实现信息保护与利用的共赢”可知，第一空表示让信息数据与互联网经济分开不共赢，B 项“分离”指分开、别离，D 项“隔绝”指阻隔，分隔断绝，这两项均符合文意。A 项“独立”指单独地站立或脱离原来所属单位，成为另一单位，可以表述为“信息数据从互联网经济中独立出来”，而不能表述为“信息数据与互联网经济独立开来”，用法错误，排除；C 项“区别”强调比较事物之间的不同，只是认识上的不同，题目强调的是行为上的分隔开，不符合文意，排除。第二空根据“敏感信息”及“可用信息”可知，第二空表示不利用敏感信息，D 项“剥离”指脱落，分开，符合文意。B 项“甄别”指考核鉴别、审查区分，仅强调区分，不能体现“不利用”的含义，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-028","paperId":"gk2024-xz","num":28,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“木刻分水”是哈尼族在长期梯田农耕活动中形成的分配水源的制度，具体做法是：根据沟渠所能灌溉的梯田面积，经过集体协商，确定每份梯田应得水量，刻在横木上，作为分配水源的尺子。哈尼人用其量水、分水，取之有度，用之有节，既体现出对大自然的崇敬，也实现了对水资源的。依次填入画横线部分最恰当的一项是：","options":["公平精打细算","便捷物尽其用","科学量入为出","精确开源节流"],"answer":"A","explanation":"逻辑填空题。第一空根据“具体做法是：根据沟渠所能灌溉的梯田面积，经过集体协商，确定每份梯田应得水量，刻在横木上，作为分配水源的尺子”可知，横线处应体现这种分配水源的制度是集体讨论一致通过的，是公平合理的。A 项“公平”指处理事情合情合理，不偏袒哪一方面，C 项“科学”指合乎科学的，合理的，这两项均符合文意。B 项“便捷”指快而方便，也指行动轻快敏捷，根据题目先测算面积。再协商，再刻水量，可知流程还是比较繁琐的，并不“便捷”，排除；D 项“精确”指精密而准确，但是“协商”出的结果并不是“精准” 的，排除。第二空根据“哈尼人用其量水、分水，取之有度，用之有节”可知，横线处应体现哈尼人对水资源合理、有效、有节制地利用，A 项“精打细算”指在使用人力物力上精心细致地计算安排，符合文意。C 项“量入为出”指根据收入的多少来决定开支的限度与要求，文中的“水资源”没有涉及“收入”，只涉及如何“支出”，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-029","paperId":"gk2024-xz","num":29,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“潜”是“显”的基础，“显”是“潜”的结果。对于事关长远、事关基础的任务，“一口吃不成个胖子”，就要扎扎实实、稳步有序推进。这些工作并不，政绩也并非，但有助于各项事业全面发展、长足进步，是真正对党、对人民、对历史负责的体现。依次填入画横线部分最恰当的一项是：","options":["声势浩大家喻户晓","惊天动地有目共睹","显山露水一目了然","轰轰烈烈引人注目"],"answer":"C","explanation":"逻辑填空题。第一空根据“‘潜’是‘显’的基础”“对于事关长远、事关基础的任务”和，横线前出现否定词“不”可知，“这些工作”指代前文具有“潜”性质的基础工作，故横线处与“潜” 语意相反，体现“显”的意思，C 项“显山露水”比喻显露才能，表现自己，符合文意。A 项“声势浩大”指声威和气势非常壮大，B 项“惊天动地”形容声势浩大或事业伟大，D 项“轰轰烈烈” 形容气魄雄伟，声势浩大，均强调“大”，相反面为“小”，不符合文意，排除。第二空代入验证，根据“扎扎实实、稳步有序推进”可知，横线处应体现政绩并不是一下子就能看出来，C 项“一目了然”指一眼就看得很清楚，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-030","paperId":"gk2024-xz","num":30,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"史书是古人写就的，有些内容可能会因有人随意取舍、记忆有误或者心存故意而历史真实。运用基因等高科技手段的考古研究是科学，它以客观而非主观的科学事实和科学数据得出结论。科学可以检验，可以用重复操作检验此前的研究成果是否准确、正确，从而了人为造假的可能。依次填入画横线部分最恰当的一项是：","options":["违背化解","掩盖规避","虚构杜绝","偏离降低"],"answer":"D","explanation":"逻辑填空题。第一空根据横线前“可能会因有人随意取舍、记忆有误或者心存故意” 可知，横线处应体现出史书内容可能会因人的有意或无意造成与真实的历史不一样，A 项“违背”意为违反，不遵守，B 项“掩盖”意为遮盖、隐藏、隐瞒，D 项“偏离”意为因出现偏差而离开原定的轨道、方向等，均符合文意。C 项“虚构”意为凭空捏造，不能搭配“真实”，排除。第二空强调科学检验可以使人为造假的情况减少，D 项“降低”表示下降、使下降，符合文意。 A 项“化解”意为消除、解除，B 项“规避”意为设法躲避，人为造假的可能无法完全消除或避开，均程度过重，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-031","paperId":"gk2024-xz","num":31,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"推进乡村振兴必须规避两种倾向：一是“只见树木、不见森林”，打造“样板村”，并将资源或政策向其倾斜；二是“ 、平均用力”，即将单一发展方式套用到所有农村，或将资源进行简单分解。只有尊重农村发展实际和市场规律，实施振兴政策，才能使广大农民得到实惠。依次填入画横线部分最恰当的一项是：","options":["一视同仁脚踏实地","等量齐观因地制宜","面面俱到坚定不移","不偏不倚步步为营"],"answer":"B","explanation":"逻辑填空题。从第二空入手，根据“单一发展方式套用到所有农村”、“只有尊重农村发展实际和市场规律”可知，强调要体现要根据农村的实际情况实施政策。B 项“因地制宜” 意为根据不同地区的具体情况规定适宜的办法，符合文意。A 项“脚踏实地”形容做事踏实认真，C 项“坚定不移”意为（立场、主张、意志等）稳定坚强，不动摇，D 项“步步为营”形容行动谨慎，防备严密，三者都不能体现根据农村的实际情况实施政策，排除。第一空代入验证，B 项“等量齐观”意为不管事物间的差异，同等看待，与“平均用力”意思相近，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-032","paperId":"gk2024-xz","num":32,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"马克思主义理论必须随着实践发展而发展，必须中国化才能、本土化才能深入人心。马克思主义中国化的进程是中国共产党人解放思想、统一思想的过程。解放思想不是脱离国情的，也不是闭门造车的主观想象，而是要求我们一切从实际出发。依次填入画横线部分最恰当的一项是：","options":["薪火相传高谈阔论","枝繁叶茂空穴来风","落地生根异想天开","生生不息海市蜃楼"],"answer":"C","explanation":"逻辑填空题。第一空，根据“中国化才能________、本土化才能深入人心” “中国化” 与“本土化”对应，横线处应该与“深入人心”语义相近，指理论、学说、政策等为人们深切了解和信服，C 项“落地生根”比喻长期安家落户或切切实实、一心一意地做好所从事的工作，可体现出马克思主义理论深度融入中国，符合文意。A 项“薪火相传”比喻学问和技艺一代代地继承下去，也比喻种族、文化等代代相传，侧重传承，B 项“枝繁叶茂”指树木的枝叶繁密茂盛，侧重发展好，D 项“生生不息”指不断地生长、繁殖，侧重强调生命力旺盛，均体现不出“深入人心”的意思，排除。第二空代入验证，C 项“异想天开”比喻想法离奇而完全不切实际，可以呼应“脱离国情”的意思。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-033","paperId":"gk2024-xz","num":33,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"区块链技术使得消费者可以放心“买全球”。当货物从海外运往中国时，物流数据已经开始在区块链上运行。每个进口商品都获得的“身份证”，手机扫一扫，就能看到生产、物流全环节，所有信息不可，海淘又多了一分保障。依次填入画横线部分最恰当的一项是：","options":["简明扼要变更","独一无二篡改","一成不变复制","与众不同撤销"],"answer":"B","explanation":"逻辑填空题。第一空根据“放心‘买全球’”“海淘又多了一分保障”、“身份证”，可知形容进口商品的身份信息不同于他者，可避免以假乱真，B 项“独一无二”指没有相同的，没有可以相比的，D 项“与众不同”指跟大家不一样，均符合文意。A 项“简明扼要”指说话、写文章简单明了，能抓住要点，不符合文意，排除；C 项“一成不变”指一经形成，永不改变，文段强调独特而非不变，不符合文意，排除。第二空根据“海淘又多了一分保障”，表示每个进口商品的身份信息都将被锁定而不能随意更改，B 项“篡改”指用作伪的手段改动或曲解（经典、理论、政策等），符合文意。D 项“撤销”指取消，通常搭配“资质”“资格”等，而商品上的信息一旦生成只能被修改，不能被取消，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-034","paperId":"gk2024-xz","num":34,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"许多老大难问题之所以长期无解，重要原因是调查研究流于形式，导致情况吃得不透、病根找得不准。有的是“盲人摸象”式调研，眼中只有一个个孤立的“盆景”，得出的结论往往是；有的是“刻舟求剑”式调研，对新情况多凭主观判断下结论，导致出台的政策不强。依次填入画横线部分最恰当的一项是：","options":["以偏概全针对性","老生常谈科学性","一孔之见时效性","闭门造车可行性"],"answer":"A","explanation":"逻辑填空题。第一空，根据“有的是‘盲人摸象’式调研，眼中只有一个个孤立的‘盆景’”可知，横线处应体现“盲人摸象”式调研得出的结论，“盲人摸象”比喻对事物了解不全面，以偏概全，乱加揣测。A 项“以偏概全”指片面地根据局部现象来推论整体，得出错误的结论， C 项“一孔之见”比喻狭隘片面的见解，均符合文意。B 项“老生常谈”指人们听惯了的没有新意的话，D 项“闭门造车”比喻只凭主观办事，不顾客观实际，都体现不了“孤立片面”的意思，均不符合文意，排除。第二空根据横线前“导致”可知，横线处应体现“刻舟求剑”“主观判断” 式调研所带来的结果，即死守教条，非常主观。A 项“针对性”指对确定的对象采取具体措施，置于此处可体现出台的政策没有从客观实际出发，精准性不强之意，且能呼应开头的“导致情况吃得不透、病根找得不准”，符合文意。C 项“时效性”指同一件事物在不同的时间具有很大的性质上的差异，侧重强调时间的重要性，文段并未体现出台的政策过时，也有可能是创新的政策，但是无法解决实际问题，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-035","paperId":"gk2024-xz","num":35,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"守正是创新的前提，创新是守正的路径。守正不是、循规蹈矩，而是守住本和源、根和魂；创新也不是凭空幻想、，而是在把握事物发展规律的基础上充分发挥主观能动性。只有守正，才能恪守正道、；只有创新，才能与时俱进、推陈出新。依次填入画横线部分最恰当的一项是：","options":["陈陈相因纸上谈兵正本清源","抱残守缺天马行空返璞归真","食古不化向壁虚造拨乱反正","墨守成规恣意妄为固本强基"],"answer":"D","explanation":"逻辑填空题。第一空根据“、”“循规蹈矩”可知，横线处与“循规蹈矩”意思相近，A 项“陈陈相因”表示沿袭老一套，不思革新；B 项“抱残守缺”形容思想守旧，不肯接受新生事物，C 项“食古不化”形容一味学习古人，拘泥陈法，D 项“墨守成规”形容守着陈旧的规矩，不思改变。均符合文意。第二空和“凭空幻想”构成并列，语义相近，表示凭想象做事、脱离客观实际的意思。B 项“天马行空”形容才华横溢，气势豪放，不受约束，也形容言论空泛，不着边际，C 项“向壁虚造”比喻无事实根据，凭空捏造。D 项“恣意妄为”意思是随心所欲，胡作非为，这三项均符合文意。A 项“纸上谈兵”比喻空谈理论，不能解决实际问题，文段并无空谈理论、不实干之意，不符合文意，排除；第三空根据“、”可知，横线处与“恪守正道” 意思相近，形容“守正”的意义，根据前文“守住本和源、根和魂”可知，“守正”就是能够坚守本源与基础。D 项“固本强基”指加固本体、强化基础，符合文意，B 项“返璞归真”指除去外饰，恢复原来的质朴状态，形容恢复淳朴的本性，不符合文意，排除。C 项“拨乱反正”表示消除混乱的局面，恢复正常的秩序，题目没有提到“局面混乱”，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-036","paperId":"gk2024-xz","num":36,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"读书学习的过程，实际上是一个不断思考认知的过程。思考是阅读的，是认知的必然，是把书读活的关键。如果只是机械地阅读、被动地接受、地浏览，没有思考，，再好的知识也难以吸收和消化。依次填入画横线部分最恰当的一项是：","options":["延伸浮泛敷衍了事","升华肤浅走马观花","深化简单人云亦云","转化消极挂一漏万"],"answer":"C","explanation":"逻辑填空题。第一空根据“不断思考认知的过程”可知，思考是阅读更进一步，更高一步的动作，为积极倾向，所以BC 项符合文意，A 项“延伸”只强调范围的扩大，不代表质的飞跃，排除，D 项“转化”为中性词语，既可以转化后结果好，也可以转化后结果不好，不符合文意，排除；第二空辨析度不高，第三空根据“如果只是机械地阅读、被动地接受、 ________地浏览，没有思考，________，再好的知识也难以吸收和消化。”可知“机械地阅读、被动地接受、________地浏览”为三个并列动作，最后的结论是“没有思考”和空格上的词语，即空格上的词语要对前面三个并列动作做总结，C 项“人云亦云”指没有主见，只会随声附和，能够体现出没有独立思考的意思，也能概括前三个动作，符合文意。A 项“敷衍了事”指办事马马虎虎，只求应付过去就算完事，强调态度不端正，与“思考”无关，排除；B 项“走马观花”意思是骑在奔跑的马上看花，原形容事情如意，心境愉快，后多指大略地观察一下，只能对应前文中的“浏览”这一个动作，但是无法与“机械地阅读、被动地接受”对应，排除；D 项“挂一漏万”形容列举不周，选了一个，但遗漏很多，一般用来自谦，不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-037","paperId":"gk2024-xz","num":37,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"量子理论描述了微观粒子的诸多反直觉行为，广义相对论描述了引力的本质，并做出许多的预言，比如黑洞、引力波、引力透镜等。这两种理论在各自领域都运作得非常好，却无法以一种的方式结合起来。因此，寻找能将这两种理论统一起来的量子引力理论，是物理学家最大的之一。依次填入画横线部分最恰当的一项是：","options":["奇特完美目标","著名直观难题","大胆简便挑战","神秘合理困惑"],"answer":"A","explanation":"逻辑填空题。第一空根据“诸多反直觉行为”强调这个预言是反常理的，能体现“反常理”的意思，AC 项符合文意；第二空根据“却”可知这两种理论在各自领域都运作得非常好，但是结合却不好，空格上要强调这两种理论还无法很好的统一，A 项“完美”指完备美好，没有缺陷，符合文意，C 项“简便”对应的应该“繁复”，文段并不是强调两种理论结合的方法不够直观与简单，而是根本无法结合，排除。第三空，“寻找能将这两种理论统一起来的量子引力理论”，是物理学家努力的方向和目标，A 项“目标”符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-038","paperId":"gk2024-xz","num":38,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"未成年人网络游戏防沉迷机制是否有效，不只取决于平台管控是否严格，也取决于是否存在其他。对此，为绕开防沉迷机制而设计出来的种种方法，都应予以清理和整治。对于落实未成年人保护责任，运营商唯有诚心正意而非，才能真正完善未成年人网络游戏防沉迷机制。依次填入画横线部分最恰当的一项是：","options":["干扰全面口是心非","短板严厉漫不经心","盲区彻底虚张声势","漏洞系统虚与委蛇"],"answer":"D","explanation":"逻辑填空题。第一空辨析度不高，第二空根据“为绕开防沉迷机制而设计出来的种种方法”可知，为了绕开防沉迷机制方法有很多，所以平台管控要全方位管理好，所以第二空要体现全方位清理整治的意思，B 项“严厉”多形容人的态度，排除；第三空与“诚心正意” 意思相反，体现运营商不真诚、虚假之意，D 项“虚与委蛇”指对人虚情假意，敷衍应酬，符合文意。A 项“口是心非”指嘴里说的是一套，心里想的又是一套，侧重心口不一，而题目并没有特指运营商说话，排除；B 项“漫不经心”指随随便便，不放在心上，C 项“虚张声势”指假装出强大的气势，均不符合文意，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-039","paperId":"gk2024-xz","num":39,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"创造和享受艺术是区别人类与其他生物的重要标志之一。基于当下的限定条件，通过算法进行模仿是 AI 绘画的。这些完成品的构图、配色和细节可能极其，在审美上与人类的经验高度一致。但从整个创作过程来看，并不能体现人类在艺术创作里的情感追求，与传统艺术创作理念也。依次填入画横线部分最恰当的一项是：","options":["本质妥帖相去甚远","核心精致大相径庭","前提丰富背道而驰","基础高妙水火不容"],"answer":"B","explanation":"逻辑填空题。第一空辨析度不高，第二空搭配完成品的“构图”“配色”“细节”，且根据“在审美上与人类的经验高度一致”可知，强调AI 绘画的完成品符合人类审美，表示“美” 的意思，B 项“精致”指精巧细致，D 项“高妙”形容事物佳美绝妙，置于此处均与“构图”“配色”“细节”搭配恰当，符合文意。A 项“妥帖”指恰当，十分合适，多形容“做事妥帖”，而空格的主语是“完成品”，搭配不当，排除；C 项“丰富”指种类多，数量大，虽与“构图”“配色”“细节”搭配得当，但单纯表达这些完成品的构图、配色以及细节数量或种类多之意，无法体现符合人类审美的意思，排除。第三空根据转折词“但”可知，横线处与“高度一致”语义相反，表示差别较大，B 项“大相径庭”比喻相差很远、大不相同，符合文意。D 项“水火不容”比喻二者对立，绝不相容，程度过重，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-040","paperId":"gk2024-xz","num":40,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"基层工作，调研起来难免千头万绪。调查研究要从“小切口”入题，从民生实事选题定向。同时，调研要坚持“一根竿子插到底”，直面“真问题”，克服认知盲区和思维局限，秉持更加开阔的视野，方能基层“最后一公里”的症结。依次填入画横线部分最恰当的一项是：","options":["盘根错节高屋建瓴治理","错综复杂追根溯源洞见","包罗万象抽丝剥茧破解","任重道远实事求是缓解"],"answer":"C","explanation":"逻辑填空题。第一空根据“调研起来难免千头万绪”可知，体现基层工作头绪繁多， A 项“盘根错节”比喻事物的关系错综复杂，很难处理，B 项“错综复杂”形容头绪繁多，情况复杂，C 项“包罗万象”形容内容丰富，应有尽有，三项均符合文意。D 项“任重道远”比喻肩负的责任重大，并需要长期的艰苦努力，不符合文意，排除。第二空根据“同时”可知和前面的“小切口”，“一根竿子插到底”有关，都强调从小问题和最基层的问题入手，B 项“追根溯源” 意思是追溯事物发生的根源，C 项“抽丝剥茧”形容分析事物极为细致，有层次，这两项均能体现从“小”或从“基层”的问题入手，符合文意。A 项“高屋建瓴”比喻居高临下，不可阻挡的形势，不符合文意，排除。第三空根据“方能________基层‘最后一公里’的症结”可知，这句为条件关系，空格上要能总结前面的内容，即横线处应体现①调研要坚持“一根竿子插到底”，②________直面“真问题”，③克服认知盲区和思维局限，④秉持更加开阔的视野四种方法得到的结果，即“症结”得到解决，C 项“破解”意为解开，解决，符合文意。B 项“洞见” 指清楚地看到，只能体现前面的④“秉持更加开阔的视野”，不能总结前面四个对策，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-041","paperId":"gk2024-xz","num":41,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"良法是善治的前提。“法非从天下，非从地出，发于人间，合乎人心而已。” ，发挥好人大及其常委会在立法工作中的主导作用，坚持尊重和体现客观规律，坚持为了人民、依靠人民，坚持严格依照法定权限和法定程序，深入推进科学立法、民主立法、依法立法。填入画横线部分最恰当的一项是：","options":["要抓住提高立法质量这个关键","人大要统筹运用法定监督方式","法律体系须与时俱进加以完善","治国理政要保障人民当家作主"],"answer":"A","explanation":"语句衔接题。横线居中，瞻前顾后。横线前强调了良法的重要性，横线后指出在立法工作中要发挥立法机关的主导作用，并通过“坚持……坚持……坚持……”提出具体的立法方向，所以横线处所填句子应围绕“立法”这一话题展开论述。A 项“要抓住提高立法质量这个关键”既能呼应上文“良法”，又能引出下文立法机关如何提高立法质量的内容，与前后文连接紧密，符合文意。B 项，“法定监督方式”文段未体现，排除；C 项，“与时俱进”文段并未提及，排除；D 项强调“治国理政”，而文段的话题是“法律”，话题不一致。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-042","paperId":"gk2024-xz","num":42,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"，让绿水青山充分发挥经济社会效益，关键是要树立正确的发展思路，因地制宜选择好发展产业。在内蒙古大兴安岭的北岸林场，林业工人在护林的同时，围绕“林”字做活“绿文章”，发展森林旅游，实现了“不砍树照样能致富”；在陕西延安，依托自然生态优势，“小苹果”形成大产业，助村民挑起“金扁担”······思路一变天地宽。生态保护和经济发展不是矛盾对立关系，积极探索绿水青山转化为金山银山的新路径，利用自然优势发展特色产业，因地制宜壮大“美丽经济”，就能创造更多“点绿成金”的新奇迹。填入画横线部分最恰当的一项是：","options":["党旗红，引领生态绿","思路决定出路","农业发展要因地制宜","美丽经济是发展新出路"],"answer":"B","explanation":"语句衔接句。整个文段为总分总分结构，第一个总分为第一句和第二句。第一句指出正确的发展思路是让绿水青山发挥效益的关键，第二句列举内蒙古的例子，第二个总分为第三句和第四句，第三句提出观点，思路一变天地宽，第四句继续阐述找到绿水青山转化的正确思路就能创造奇迹，所以空格处的第二个总观点应该和开头的总观点一致，强调思路的重要性。B 项符合文意，此处“思路”对应“绿水青山”，“出路”对应“充分发挥经济社会效益”。 A 项，“党旗红”文段未提及，无中生有，排除；C 项强调话题为“农业发展”，题目强调的是“绿色生态”，排除；D 项，“美丽经济”对应尾句阐释的内容，片面，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-043","paperId":"gk2024-xz","num":43,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"非洲企鹅成年后身高只有60 至70 厘米，不过嗓门可不小，时常发出浑厚而响亮的叫声，被戏称为 “公驴企鹅”。非洲企鹅主要栖息于南非好望角附近的西蒙镇，这里属于地中海气候，全年温和舒适，同时本格拉寒流带来了南极的冰冷海水，上升补偿流还将海底营养物质带至海面，让这里形成了有利于渔业的自然环境，沙丁鱼、凤尾鱼等浅水鱼类为非洲企鹅提供了充足的营养。另外，非洲企鹅好像涂了粉红色的“眼影”，那是用来调节体温的腺体。当体温上升时，有更多血液流经眼睛上方的腺体，利用空气流动帮助身体降温，“眼影”的颜色也会更加鲜艳。根据这段文字可知，非洲企鹅：","options":["以深水鱼类等为食物来源","眼部颜色浅说明其体温较低","用“驴叫声”来警示敌人","适宜在地中海地区生存繁衍"],"answer":"B","explanation":"细节理解题。 A 项根据“沙丁鱼、凤尾鱼等浅水鱼类为非洲企鹅提供了充足的营养”可知，应该是“浅水鱼”，而不是“深水鱼类”，不符合原文，排除； B 项根据“当体温上升时，有更多血液流经眼睛上方的腺体，利用空气流动帮助身体降温。‘眼影’的颜色也会更加鲜艳”可知，符合原文； C 项根据“时常发出浑厚而响亮的叫声，被戏称为‘公驴企鹅’”可知，并未提及非洲企鹅“驴叫声”是用来警示敌人的，不符合原文，排除； D 项根据“非洲企鹅主要栖息于南非好望角附近的西蒙镇，这里属于地中海气候”可知，应该是“地中海气候”，而不是“地中海地区”，不符合原文，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-044","paperId":"gk2024-xz","num":44,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"我国经济已由高速增长阶段转向高质量发展阶段，这是一个重要转变。一个时期以来，传统投资驱动的经济增长模式已经难以为继，同时经济全球化遭遇逆流，大进大出的环境条件已经变化，不可能单纯依靠出口实现经济发展质的提升。因此，必须根据我国经济发展实际情况，建立起扩大内需的有效制度，特别是要更好更充分释放消费潜力。消费作用的不断强化，能有效降低我们对出口和投资的依赖，有利于经济长远发展，促进经济内外平衡发展，实现提质增效。这段文字意在说明：","options":["高质量的经济发展需重点平衡好质与量的关系","单纯依靠出口实现经济发展的模式亟待改变","释放消费潜力有利于推动经济高质量发展","优化扩大内需制度是经济长远发展的关键"],"answer":"C","explanation":"意图判断题。文段第一句指出我国经济已转向高质量发展阶段，第二句提出问题，目前已不可能单纯依靠出口提升经济发展，第三句通过“因此”总结前文，并通过“必须”提出重点对策，且由递进词“特别是”可知，强调更好更充分释放消费潜力对促进经济发展的作用。第四句详细解释消费作用带来的好处，故文段为分总分结构，强调“消费”的重要性，C 项符合文意。AB 两项，均未提及主体“消费”，排除；D 项，“扩大内需制度”为递进前的内容，非重点，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-045","paperId":"gk2024-xz","num":45,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"最高人民法院对近年来生效裁判进行系统化、常态化梳理，深入总结提炼在审理过程中形成的价值理念、司法经验和裁判规则，推动形成体系完备、门类齐全、科学权威、便捷适用的裁判要旨提炼编撰体系。最高人民法院还出台了法律适用分歧解决机制的实施办法和统一法律适用工作实施办法，有效解决生效裁判之间存在的法律适用分歧问题，创新“点对点”法律适用分歧解决机制，推动法律适用分歧解决机制运行更加精准有效、灵活快捷，切实防止司法正义因地域、城乡、行业差异而打折扣。最适合做这段文字标题的是：","options":["统一裁判尺度，维护社会公平","以法律适用统一提升执法水平","用良法善治夯实法治之基","消除“同案不同判”迫在眉睫"],"answer":"A","explanation":"标题填入题。文段第一句介绍最高人民法院对近年来生效裁判进行了梳理、总结和提炼，推动形成具有较高参考价值的裁判要旨提炼编撰体系。第二句提出最高人民法院还出台了分歧解决机制的实施办法和统一法律适用工作实施办法，来解决生效裁判之间存在的法律适用分歧问题，之后阐述其重要意义，即可以防止司法正义因地域、城乡、行业差异而打折扣。故文段为分分结构，指出最高人民法院针对裁判分歧作出的两个措施，即裁判要旨提炼编撰体系和实施办法和统一法律适用工作实施办法，这两个办法都是统一裁判尺度的具体做法，目的都是为了维护社会公平，A 项符合文意。B 项没有提到“裁判”和“公平正义”，且“提升执法水平”无中生有，排除；C 项，“良法善治”概念扩大，没有提到“公平”，排除；D 项，“消除‘同案不同判’”只能呼应最后一句，即第二个分，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-046","paperId":"gk2024-xz","num":46,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"公共法律服务是全面依法治国的基础性、服务性和保障性工作，承担着为全民提供法律知识普及以及教育和法治文化活动等职能。随着经济社会发展，人们法律意识增强，服务需求增长，但公共法律服务体系建设中发展不平衡、设施不完善的短板日益凸显，一些地区尚存在法律服务资源紧张、人才经费保障不足、公众知晓率低等问题。因此，建设法治社会，亟待加快建设覆盖城乡、便捷高效、均等普惠的现代公共法律服务体系，提升法律服务的社会公信力，让人民群众共享公共法律服务成果。这段文字意在强调：","options":["全面依法治国，离不开现代公共法律服务体系建设","健全的公共法律服务体系有利于法律意识的增强","公共法律服务体系建设，要注重弥合地区发展鸿沟","应以人民群众需求为导向，建设公共法律服务体系"],"answer":"A","explanation":"意图判断题。文段第一句表示公共法律服务的特点及所承担的职能，总体来说就是实现全面依法治国，第二句通过转折词“但”指出公共法律服务体系建设中面临着发展不平衡、设施不完善等问题，尾句通过“因此”提出重点对策，强调建设现代公共法律服务体系的重要性，所以文段为总分总结构，开头结尾都在强调“现代公共法律服务体系”的重要性，目的是实现全面依法治国，A 项符合文意。B 项“法律意识的增强”对应转折之前的内容，非重点，排除；C 项“弥合地区发展鸿沟”仅能对应“覆盖城乡”，表述片面，排除；D 项“以人民群众需求为导向”只能对应人们服务需求增长，不如“全面依法治国”表述全面，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-047","paperId":"gk2024-xz","num":47,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"过去“时事新闻”不受著作权法的保护，何谓“时事新闻”一直界定困难且存在争议。2020 年《关于修改 <中华人民共和国著作权法>的决定》将不受法律保护的时事新闻压缩为“单纯事实消息”，这意味着除此以外的绝大多数新闻作品都有可能成为著作权法意义上的“作品”，此举不但厘清了新闻报道保护与不保护的界限，还遏制了洗稿、随意转载等侵权现象，加大了对新闻作品的保护力度。不过在全媒体时代新闻作品版权保护仍面临着诸多障碍，只有在有效版权保护的前提下做好内容传播，才能推动新闻出版更高质量发展。这段文字接下来最可能讲的是：","options":["明确时事新闻范围对版权保护的意义","全媒体时代新闻作品版权保护的思路","当前新闻作品版权保护面临的诸多困境","我国新闻出版社更高质量发展的前提条件"],"answer":"B","explanation":"文段推断题。下文推断类。尾句通过“只有”强调了重点，强调要在有效版权保护的前提下做好内容传播，故后文应围绕“版权保护”这一对策展开具体论述，所以文段接下来应该具体描述“版权保护”的对策，B 项符合文意。A 项，“明确时事新闻范围”为前文论述的话题，排除；C 项，“诸多困境”为问题的表述，文段尾句已经给出对策，所以接下来应围绕对策展开具体论述，排除；D 项，没有提到“版权保护”，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-048","paperId":"gk2024-xz","num":48,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"穿山甲的外壳由被称作角蛋白的有机骨骼组成，能为躯体提供强有力的保护作用，却不会妨碍行动或损伤自身。穿山甲能把角质鳞片组成重叠结构，灵活无碍地移动。受其启发，工程师设计出一个拥有重叠鳞片设计的微型机器人，用于在人体内进行安全和微创的医学治疗。它通过变形，可以到达人体内难以触及的胃或小肠等区域。在概念验证实验中，微型机器人能够加热到，对人体组织进行医疗处理，包括在难以触及区域进行癌症热疗或止血。此外，机器人能够将负载物释放到组织，未来可用于递送药物。关于微型机器人，下列说法与这段文字不相符的是：","options":["鳞片结构与穿山甲类似","具有灵活机动的移动能力","治疗能力已在临床中得到验证","可用在微创手术中进行止血"],"answer":"C","explanation":"细节理解题。 A 项根据“穿山甲能把角质鳞片组成重叠结构，灵活无碍地移动。受其启发，工程师设计出一个拥有重叠鳞片设计的微型机器人”可知，符合文意； B 项根据“穿山甲能把角质鳞片组成重叠结构，灵活无碍地移动。受其启发，工程师设计出一个拥有重叠鳞片设计的微型机器人，用于在人体内进行安全和微创的医学医疗。它通过变形，可以到达人体内难以触及的胃或小肠等区域”可知，符合文意； C 项根据“在概念验证实验中，微型机器人能够加热到70℃，对人体组织进行医疗处理，包括在难以触及区域进行癌症热疗或止血。此外，机器人能够将负载物释放到组织，未来可用于递送药物。”可知，微型机器人只是在概念验证实验中的治疗能力，而在临床中是否得到验证还未知，不符合文意； D 项根据“微型机器人能够加热到70℃，对人体组织进行医疗处理，包括在难以触及区域进行癌症热疗或止血”可知，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-049","paperId":"gk2024-xz","num":49,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"胜诉权益不能及时有效兑现，是影响人民群众感受司法公正的最后一道藩篱。自动履行率越高，意味着越多的案件无需进行执行程序就可兑现裁判，既减少了衍生案件，也能防止社会关系进一步撕裂。这要求通过建立自动履行正向激励机制，把司法信用融入企业生产、群众生活，推动形成守法践诺的良好风尚；建立“谁办理、谁负责”的案件履行督促机制，让承办法官引导和督促当事人自动履行裁判义务。加强反向惩戒、强化执行刚性，对有能力而拒不执行判决裁定的人，用足用好失信惩戒机制，使其主动履行裁判义务，提升执行到位率。这段文字主要介绍：","options":["着力强化案件裁判兑现的重要价值","有效兑现胜诉权益对司法公正的意义","失信惩戒对提升执行到位率的作用","提升自动履行率保障胜诉权益的途径"],"answer":"D","explanation":"主旨概括题。文段第一句指出胜诉权益能不能及时有效兑现，影响人民群众对司法公正的感受，第二句继续解释，自动履行率越高，就有越多案件无需进行执行程序就可兑现裁判，既减少衍生案件的产生，也能缓和社会关系。第三句通过代词和条件词“这要求” 给出并列的对策，一方面建立自动履行正向激励机制，建立自动履行激励机制；另一方面加强反向惩戒，建立案件履行督促机制。所以文段的重点在对策，主要介绍了提升自动履行率保障胜诉权益的方法，D 项符合文意。A 项“重要价值”和B 项“对司法公正的意义”都是文段第一二句背景的内容，非重点，排除；C 项虽为对策，但是“失信惩戒”仅为第二个对策，表述片面，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-050","paperId":"gk2024-xz","num":50,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①当前，我国荒漠化、沙化土地治理呈现出“整体好转、改善加速”的良好态势，但沙化土地面积大、分布广、程度重、治理难的基本面尚未根本改变 ②现实表明，我国荒漠化防治和防沙治沙工作形势依然严峻 ③我国是世界上荒漠化最严重的国家之一，荒漠化土地主要分布在三北地区，而且荒漠化地区与经济欠发达区、少数民族聚居区等高度耦合 ④荒漠化、风沙危害和水土流失导致的生态灾害，制约着三北地区经济社会发展，对中华民族的生存、发展构成挑战 ⑤我们要充分认识防沙治沙工作的长期性、艰巨性、反复性和不确定性，进一步提高站位，增强使命感和紧迫感 ⑥这两年，受气候变化异常影响，我国北方沙尘天气次数有所增加将以上6 个句子重新排列，语序正确的一项是：","options":["①③⑥⑤②④","②⑤⑥①④③","④①③②⑥⑤","③④①⑥②⑤"],"answer":"D","explanation":"语句排序题。观察首句，①句根据“治理”和②句根据“荒漠化防治和防沙治沙可知，国家已经注意到这个问题并开始着手解决了。而③句和④句都在介绍我国荒漠化严重的问题。按照逻辑，应该先提出问题，再解决问题，排除①②句做首句，排除AB 项，C 项④句描述小概念“三北”地区，D 项③句描述大概念“我国”，按照逻辑，大概念应该在小概念前，③更适合做首句，考虑D 项，进行验证，③句引出“我国是荒漠化最严重的国家之一”，接着④句通过“我国”引出“三北地区”介绍荒漠化影响着生态及经济等的发展，①句介绍荒漠化经过治理虽有好转，但根本问题依然存在，⑥句通过近两年我国北方沙尘天气次数增加对前文进行论证，接着通过②句再次指出我国的荒漠化及沙化防治形势严峻，最后⑤句给出对策，我们要认识到防沙治沙工作的特性，提高站位，增强使命感和紧迫感，验证后，语言连贯，逻辑通顺。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-051","paperId":"gk2024-xz","num":51,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①然而，人体是运动变化的系统，单一的、静止的监测数据不能完整地反映人体的健康状况 ②无论是膳食配方、运动药方还是睡眠与心理处方，都是主动健康实践的重要组成部分 ③当前，随着技术的进步，智能可穿戴设备能在生活和工作场景下，对人体的生物信号进行长时程的实时无创监测 ④在这些实践中少不了技术的身影，智能手环、睡眠监测仪等智能产品，为实现主动健康提供了技术保障 ⑤过去，健康监测仪器往往应用在医院场景中，通常要求人体处于稳定状态时才能进行测量 ⑥可穿戴智能生物传感技术具有自适应、自诊断等功能，通过监测人的心率、血糖等多种指标，实现疾病预警目的将以上6 个句子重新排列，语序正确的一项是：","options":["③②④⑤①⑥","⑤①⑥③②④","②④⑤①③⑥","⑥③②⑤①④"],"answer":"C","explanation":"语句排序题。观察首句。A 项③句提到“当前”，B 项⑤句提到“过去”，根据时间逻辑，③在⑤后，③不能做首句，排除A 项，D 项⑥句提到“可穿戴智能生物传感技术” 为现代最新的技术，逻辑也在⑤“过去”后，不能做首句，排除D 项，比较BC 项，验证后B 项⑥③逻辑错误，③“当前，随着技术的进步，智能可穿戴设备……”可知是在交代“智能可穿戴设备”的发生背景，⑥句“可穿戴智能生物传感技术具有……目的”可知是在描述“智能可穿戴设备”的功能作用，逻辑上应该③在⑥前，排除B 项，验证C 项，②句引出“主动健康实践”的话题，④句用代词衔接“这些实践”中有技术的身影，⑤①句论述过去健康监测仪器的应用存在局限，③句介绍当前智能可穿戴设备的背景，⑥句介绍可穿戴智能生物传感技术的功能。验证后，语言连贯，逻辑通顺。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-052","paperId":"gk2024-xz","num":52,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"①据有关机构估算，每年损失浪费的食物超过22.7%，约9200 亿斤，若能挽回一半的损失，就够 1.9 亿人吃一年 ②食物节约减损既可有效减轻供给压力，也可减少资源使用，善莫大焉 ③我国居民食用油和“红肉”人均消费量，分别超过膳食指南推荐标准约1 倍和2 倍 ④当前，食物采收、储运、加工、销售、消费每个环节都有“跑冒滴漏”，情况还相当严重 ⑤要树立节约减损就是增产的理念，推进全链条节约减损，健全常态化、长效化工作机制，每个环节都要有具体抓手，越是损失浪费严重的环节越要抓得实 ⑥消费环节大有文章可做，不仅要制止“舌尖上的浪费”，深入开展“光盘行动”，还要提倡健康饮食将以上6 个句子重新排列，语序正确的一项是：","options":["①⑥③②④⑤","①③④⑤②⑥","④①⑥③②⑤","④②⑤③①⑥"],"answer":"C","explanation":"语句排序题。观察首句。①句通过数据论证分析了我国每年损失浪费食物的现象十分严重，④句指出食物的每个环节都有“跑冒滴漏”的现象存在，即食物存在损失浪费，根据逻辑，应先引出食物损失浪费的话题再进行数据论证，④句更适合作首句，排除AB 项。观察CD 两项，即④句之后接①句还是②句，①句具体分析了我国每年损失浪费食物的现象十分严重，与④句话题一致，衔接恰当，②句提出“食物节约减损”即针对食物损失浪费的问题提出对策，根据逻辑顺序，应先指出问题再提出对策，所以④句应该先接①句，排除D 项，C 项验证后，语言连贯，逻辑通顺。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-053","paperId":"gk2024-xz","num":53,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"“ 。”人民代表大会制度之所以具有强大生命力和显著优越性，关键在于深深植根于人民之中。一切国家机关和国家工作人员必须牢固树立人民公仆意识，把人民放在心中最高位置，保持同人民的密切联系，倾听人民意见和建议，接受人民监督，努力为人民服务。要丰富人大代表联系人民群众的内容和形式，拓宽联系渠道，积极回应社会关切，更好接地气、察民情、聚民智、惠民生。各级人大常委会要加强代表工作能力建设，支持和保障代表更好依法履职，使发挥各级人大代表作用成为人民当家作主的重要体现。填入画横线部分最恰当的一项是：","options":["人视水见形，视民知治不","为政之要，以顺民心为本","善为政者，弊则补之，决则塞之","苟利于民，不必法古；苟周于事，不必循俗"],"answer":"B","explanation":"语句衔接题。横线居首，且横线后为句号，需要全文总结。后文第一句通过“关键在于”强调人民对于人民代表大会制度的重要性，第二句通过“必须”强调国家机关和国家工作人员应该把人民放在首位，第三句通过“要”强调丰富内容和形式，听取人民意见，服务好人民，让人民当家作主。所以后文全部在强调人民代表大会制度就是要以人民为中心。B 项 “为政之要，以顺民心为本”指为政者要以顺应民心为根本，体现出顺应民心，把人民放在首位的意思，符合文意。 A 项，“人视水见形，视民知治不”意为人从水中可以看到自己的形象，在民众中可以看出国家治理的状况。侧重表达人民是评判执政水平的依据，文段没有提到人民评判我们执政水平高低，排除； C 项，“善为政者，弊则补之，决则塞之”意为善于治理国家的人会在发现问题的时候及时补救、及时解决，绝不会听之任之，任由它酿成大祸，与“以人民为中心”无关，排除； D 项，“苟利于民，不必法古；苟周于事，不必循俗”意为只要对人民有好处，就不必一定要效法古人的制度；只要有助于事情的成功，就不必沿袭旧有的规矩。侧重强调改革创新，与文意无关，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-054","paperId":"gk2024-xz","num":54,"year":2024,"region":"国家","module":"言语理解与表达","sub":"逻辑填空","stem":"。我们党当初为什么要创办中央党校？就是为人民解放事业培养骨干力量。90 年来，各级党校特别是中央党校与党的事业同频共振、按需施训，教育培训了一批又一批领导干部，肩负起为党育才的神圣职责，推动党的事业从胜利走向新的胜利。例如，党校创办初期，马克思共产主义学校一年多时间里共培训了1000 多名干部；延安时期，中央党校常规班次培养各类骨干上万人，其中约65%的七大代表有中央党校的学习工作经历。党的十八大以来，中央党校举办的主体班次共培训轮训干部8.8 万人，其中省部级干部1.3 万余人。填入画横线部分最恰当的一项是：","options":["党校是领导干部锤炼党性的“大熔炉”","党校是干部教育培训的主阵地","党校是传承党的精神血脉的殿堂","党校是党的意识形态工作的重要前沿阵地"],"answer":"B","explanation":"语句衔接题。横线居首，且横线后为句号，需要全文总结。横线后第一句话通过设问提出“我们党当初为什么要创办中央党校”的问题，重点在设问的回答，即“培养骨干力量”，第二句描述“90 年来，中央党校通过教育培训领导干部推动党的事业从胜利走向新的胜利”，第三句通过“例如”进行举例论证，阐述在不同时期中央党校具体培训的干部数据。故后文主要强调在中央党校进行了大量干部教育培训，所以后文的重点即，创办中央党校就是为了培训党的骨干力量，B 项符合文意。A 项，“党性”指党的本质属性，是通过政党的纲领、章程、思想基础、奋斗目标、根本制度等表现出来，文段没有提到关于“锤炼党性”的培训内容，与文意不符，排除；C 项“传承党的精神血脉”、D 项“党的意识形态工作”文段均未提及，无中生有，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-055","paperId":"gk2024-xz","num":55,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"从行政管理链条看，制度建设处于前端，行政复议处于末端。行政复议案件的产生，必然经过一般性行政管理规定、行政机关具体实施、产生具体行政行为、不服行政行为申请行政复议等环节。每个复议案件或多或少反映了行政管理中存在的问题。行政机关，特别是作为行政复议被申请人的行政机关，要善于“抓末端、治已病”。如果是个案具体实施问题，可以个案纠正；如果是制度性、普遍性问题，则要对制度进行查漏补缺；如果是制定制度时不曾预见的新问题，更要予以关注，适时进行规范，避免小问题变成大问题。作者通过这段文字想说的是：","options":["善用行政复议可以提升行政管理水平","对行政复议案件要具体问题具体分析","行政管理链条是环环相扣的有机整体","行政复议案件是行政管理问题的外化"],"answer":"A","explanation":"意图判断题。文段第一句提到，行政管理是一个链条，制度在前端，行政复议在末端，第二句介绍末端的行政复议案件产生会经过很多环节，类似下图：第三句提到如果末端出现行政复议案件，就说明整个行政管理链条某些环节都可能存在问题。第四句通过对策词“要”提出重点对策，即行政机关要善于“抓末端、治已病”，“末端”即行政复议，“已病”就是整个行政管理链条某些环节中存在的问题。最后通过分号进行了分述，如“个案”、“制度”、“制定制度”都是行政管理链条上的某些环节，即对如何“治已病”进行具体的解释说明，故文段重点对策为：“抓末端、治已病”，即要善于利用末端的行政复议提升整个行政管理链条的水平，A 项符合文意。B 项，“对行政复议案件要具体问题具体分析”仅强调要针对每个行政复议案件给出特殊的分析和解决，但并未体现出“治已病”即解决行政管理过程中其他环节的种种问题，片面，排除；C 项虽然提到“行政管理链条”，但没有提到“行政复议”，排除；D 项“行政管理问题的外化”属于问题表述，文段的重点为对策，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-056","paperId":"gk2024-xz","num":56,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"司法公正不仅体现在基于案件审理结果的实体性公正，更要求严格审理程序的程序性公正，后者是前者的必要前提和有力保证。对于老年人来说，生理机能衰退和理解表达能力下降，导致他们在出席庭审、举证表达等程序环节存在障碍，审判人员难以准确理解其诉讼请求，影响案件判决的公正性。建立适老型诉讼服务机制将有助于提升老年人诉讼参与质量，改善庭审沟通效率，还能引导老年人对审判权的运行形成正确认识，促进对审判执行流程的公开与监督，最终提升体现公平正义的审判质效。这段文字接下来最可能说的是：","options":["适老型诉讼服务机制的法治意义","建立适老型诉讼服务机制的路径","当前老年人诉讼参与问题及困境","对适老型普法宣传教育的新探索"],"answer":"B","explanation":"文段推断题。下文推断类。重点看尾句，尾句提到出对策，“建立适老型诉讼服务机制将有助于……，还能……”，都在描述“建立适老型诉讼服务机制”这个对策的好处和意义，所以接下来最可能论述的是如何建立适老型诉讼服务机制，B 项符合文意。A 项“法治意义”、 C 项“老年人诉讼参与问题及困境”均属于文段已经论述过的内容，后文不会再论述，排除； D 项“适老型普法宣传教育”与文段结尾部分的核心话题“适老型诉讼服务机制”不一致，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-057","paperId":"gk2024-xz","num":57,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"核桃油富含不饱和脂肪酸，但易氧化、存储时间短，限制了其应用。最近，研究团队以食用纳米纤维素作为唯一凝胶因子，以核桃油为载体，通过乳液模板法，成功构造出性能良好的核桃油凝胶，使核桃油变身“植物黄油”。在乳液阶段，食用纳米纤维素吸附并紧密包裹在核桃油油滴表面，形成不均匀的致密网格结构，降低液滴的聚集；冷冻干燥后，其结构产生形变，获得油脂结合能力强的核桃油凝胶。由于纳米纤维素可定向“裁剪”，因此可构造不同性质的多不饱和油凝胶，这为核桃油的多元化应用提供了新路径。下列说法与这段文字相符的是：","options":["食用纳米纤维素具有不易吸附的特点","添加食用纳米纤维素会稀释核桃油浓度","纳米纤维素会使不饱和脂肪酸发生形变","纳米纤维素拓宽了核桃油的应用范围"],"answer":"D","explanation":"细节理解题。 A 项根据“在乳液阶段，食用纳米纤维素吸附并紧密包裹在核桃油油滴表面”可知，“不易吸附”不符合文意； B 项“稀释核桃油浓度”文段未提及，不符合文意； C 项根据“在乳液阶段，食用纳米纤维素吸附并紧密包裹在核桃油油滴表面，形成不均匀的致密网格结构，降低液滴的聚集；冷冻干燥后，其结构产生形变，获得油脂结合能力强的核桃油凝胶。”可知，食用纳米纤维素只会使核桃油的结构产生形变，而不能使“不饱和脂肪酸” 发生形变，不符合文意； D 项，根据“由于纳米纤维素可定向‘裁剪’，因此可构造不同性质的多不饱和油凝胶，这为核桃油的多元化应用提供了新路径”可知，符合文意。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-058","paperId":"gk2024-xz","num":58,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"在数字经济时代，因为用工关系的多样化、灵活化、去组织体化、去劳动关系化等特征，市场配置劳动力资源的一面更加凸显，就更需要回到市场经济的一般法律体系，从数字经济协同治理的角度考虑新就业形态劳动者权益保护的问题。劳动法的制度和思路处于兜底保障的位置，是一种末端解决问题的思路；其他市场经济的法律处于优化产业和市场秩序的位置，是一种前端解决问题的思路。源头治理与兜底保障相结合，才能更好实现产业有序发展与新就业形态劳动者权益维护的平衡。这段文字意在说明：","options":["劳动法与市场经济的其他法律是相辅相成的","新就业形态下劳动者权益维护思路亟待更新","数字经济时代劳动保障需加强法律体系协同","维护劳动者权益才能更好促进数字经济发展"],"answer":"C","explanation":"意图判断题。文段第一句通过“需要”给出对策，强调需要一般法律体系从协同治理的角度，考虑新就业形态劳动者权益保护的问题。第二句通过分号进行分述，一方面，劳动法的制度和思路是一种末端解决问题的思路；其他市场经济的法律是一种前端解决问题的思路。第三句通过“只有……才”给出对策，即前端和后端结合，也就是源头治理与兜底保障相结合才能实现产业与劳动者权益维护的平衡，所以文段为总分总结构，开头结尾的对策都提到了“协同”“结合”治理的作用，C 项符合文意。A 项“相辅相成”强调相互依赖，相互成就，可是题目中只强调结合，并不强调依赖和无法分离的关系，且缺少文段目的“产业与劳动者权益维护的平衡”，排除；BD 项未提到主体“协同”，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-059","paperId":"gk2024-xz","num":59,"year":2024,"region":"国家","module":"言语理解与表达","sub":"片段阅读","stem":"个人信息保护案件往往涉及非法收集、获取、提供、出售、购买、使用个人信息等多个环节，责任主体除了已被追究刑事责任的犯罪者外，还可能包括下游的违法处理信息者。在民事公益诉讼案件办理中，是否可以连带追究下游违法者的赔偿责任，司法实践中存在争议。根据民法典，认定连带责任必须遵循法定或约定原则，在此原则指导下，个人信息保护法规定了共同处理者的连带责任。因此，当不同侵权主体主观具有共同过错，客观上实施了共同侵害个人信息权益的行为时，可以依法追究各侵权人的连带责任。关于个人信息保护案件，作者认为：","options":["应该强化对犯罪者民事责任的追究","应当依法追究下游违法者的赔偿责任","认定连带责任须在法定原则指导下进行","法律应明确案件中各侵权人的相关责任"],"answer":"B","explanation":"态度理解题。文段第一句通过递进关系，提到个人信息保护案件涉及的环节以及责任主体有犯罪者，还有下游的违法处理信息者，第二句提到，是否可以连带追究下游违法者的赔偿责任，司法实践中存在争议。根据“是否”可知作者讨论的核心话题即“是否可以连带追究下游违法者的赔偿责任”；第三句介绍了民法典的相关规定，认定是可以连带追究下游违法者的赔偿责任的，最后通过“因此”得出作者观点，当不同侵权主体主观具有共同过错，客观上实施了共同侵害个人信息权益的行为时，可依法追究各侵权人的连带责任。所以无论是民法典，还是作者的观点，都认为应当依法追究下游违法者的赔偿责任，B 项符合文意。 A 项，“犯罪者”主体错误，文段重点讨论主体是“下游违法者”，排除；C 项，“是否需要在法定原则指导下进行”并非文段重点，文段重点讨论是否追究“下游违法者”的连带赔偿责任，讨论话题偏移，排除；D 项，“各侵权人”主体错误，文段重点讨论主体是“下游违法者”的连带赔偿责任，排除；","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-060","paperId":"gk2024-xz","num":60,"year":2024,"region":"国家","module":"言语理解与表达","sub":"语句表达","stem":"现实生活中的案件事实总是相当复杂，很多时候国家机关一时难以查明案件真相。即使案件事实清楚，如果其性质处于一般违法行为与犯罪行为的临界线上，在法律适用层面仍是刑法理论与司法实践的难点。行政执法人员与刑事追诉人员对相关法律的理解可能也会存在一定差异。在这些因素的影响下， “行刑衔接”不再是单纯的由行政执法到刑事司法的衔接，也可能是由行到刑再到行、由刑到行再到刑的衔接。正因为如此，有的法律明文规定了多环节的移送。这段文字意在：","options":["解释“行刑衔接”中出现多环节衔接的原因","剖析目前“行刑衔接”导致的多重复杂状况","强调区分一般违法行为与犯罪行为的必要性","探讨实践中影响行政执法与刑事司法的因素"],"answer":"A","explanation":"意图判断题。文段第一句提到现实生活中的案件事实复杂，第二句提到即使案件事实清楚，有的在法律适用层面仍然存在难点，第三句提到不同环节的工作人员对法律的理解可能存在差异。所以前三句都在描述现实生活中的案件事实复杂，存在各种各样的难点，第四句通过代词“在这些因素的影响下”总结前文，“行刑衔接”可能出现“由行到刑再到行、由刑到行再到刑”的衔接。文段尾句通过“正因为如此”引导结论，法律明文规定了“多环节的移送”。文段为因果关系，重在分析“行刑衔接”中出现“多环节的移送”的原因，A 项符合文意。 B 项，“多重复杂状况”为原因的内容，非重点，排除；CD 项缺少主体“行刑衔接”，非重点，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-061","paperId":"gk2024-xz","num":61,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某地为工业企业提供相当于营业额2%的税收优惠，当地的A 工厂原本预计当年会产生相当于营业额 0.8%的亏损，在享受优惠政策后预计可以盈利300 万元。问A 工厂当年的预计营业额为多少亿元？","options":["4","3.6","3","2.5"],"answer":"A","explanation":"经济问题-基础经济。设A 工厂当年的预计营业额为x 亿元，则A 工厂原本预计会产生0.8%x 亿元的亏损。根据题意可列方程：2%x－0.8%x＝300 万元＝0.03 亿元，解得x＝ 2.5 亿元。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-062","paperId":"gk2024-xz","num":62,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙三人的年龄之比为3：4：5。8 年之后，甲、乙的年龄之和是丙的1.5 倍，且这一年甲、乙、丙、丁四人的平均年龄为43 岁。问再过15 年，甲、乙、丙、丁中有几人将超过60 岁?","options":["4","3","2","1"],"answer":"C","explanation":"其他问题。根据题意可得下表：因此，笔试时甲、乙、丙高校人数之比为50%：25%：25%=2：1：1。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-063","paperId":"gk2024-xz","num":63,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某企业招聘笔试参考人员均来自甲、乙、丙三所高校。笔试结束后，在进入面试的100 人中，来自甲高校人员占比从笔试时的50%下降至当前的40%，乙高校人员占比下降了15 个百分点，丙高校的有50 人。问笔试时来自甲、乙、丙三所高校的人员比例是多少？","options":["2：1：1","2：3：2","3：1：2","3：2：1"],"answer":"B","explanation":"时间问题-年龄问题。根据题意可列方程：（3x＋8）＋（4x＋8）＝（5x＋8）×1.5，解得x＝8。那么8 年后丁的年龄为43×4－（32+40+48）＝52 岁。再过15 年，四人的年龄为47、55、63、67 岁，超过 60 岁的有2 人。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-065","paperId":"gk2024-xz","num":65,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙、丙三个研发团队共有研发人员300 多人，其中甲的人数比乙多26%。现丙调3 人去乙后，两个团队人数相同。问此时甲至少调多少人去丙后，才能保证丙的人数是甲的2 倍以上？","options":["49","35","50","40"],"answer":"A","explanation":"几何问题-平面几何。如下图所示：设甲联络站在A 点，乙联络站在B 点，那么线段AB 的长度为10 千米，做A 点关于道路L 的对称点A’，连接A’B 交道路L 于点C，那么AC＝A’C，则CA＋CB＝CA’＋CB＝A’B。在直角 △A’AB 中，A’A=24，AB=10，根据勾股定理可得。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-066","paperId":"gk2024-xz","num":66,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"甲、乙两个联络站相距10 千米。一条道路与甲、乙联络站连线相平行，且与两联络站连线的垂直距离为12 千米。现需紧邻该道路建一个工作站，问工作站距离甲、乙联络站距离之和最小为多少千米？","options":["20","22","24","26"],"answer":"B","explanation":"数字特性思想。根据“甲的人数比乙多26%”，可知，设甲团队人数为63n，乙团队人数为50n；则丙团队人数为50n＋6 人。即总人数为63n＋50n＋50n＋6＝ 163n＋6。由于总研发人员300 多人，则n 只能取2。故此时甲团队人数126 人，乙和丙团队人数均为103 人。设甲调x 人去丙，根据题意可列方程：103＋x＝2×（126－x），解得 x= ，若要保证2 倍以上，则x 取50。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-067","paperId":"gk2024-xz","num":67,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某高校外国语学院中，会俄语的学生都会英语，其中一半还会法语；会英语的学生中有一半会法语；这三种语言都会的学生有50 人，只会其中两种语言的有100 人，只会其中一种语言的有150 人。问会法语的学生有多少人？","options":["100","200","50","150"],"answer":"D","explanation":"容斥原理-三集合。根据题意可得下图：根据“只会其中两种的有100 人”，可知a＝100－50＝50 人；再根据“会英语的学生中有一半会法语”，可知c＋50＝50＋a；解得c＝50 人。又根据“只会其中一种语言的有150 人”，可得b＝150－c＝100。所以会法语的有50＋50＋100＝200 人。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-068","paperId":"gk2024-xz","num":68,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"小张每周二、周五和周日固定参加骑行社团活动。某年9 月和10 月，小张分别参加了13 次和14 次活动。问当年他最后一次参加活动是在哪一天？","options":["12 月31 日","12 月30 日","12 月29 日","12 月28 日"],"answer":"B","explanation":"几何问题-平面几何。过D 作DH 垂直于AB，过C 作CF 垂直于DH，过B 作BG 垂直于CF。如下图所示：根据∠B=135°，可得三角形BCG、CDF 均为等腰直角三角形。因为CD＝50 米，则DF＝ CF=50÷ ＝，CG＝BG＝HF＝AE－DF＝60－，BC＝CG× ＝（60－）× ＝，HB＝FG＝CF－CG＝－（60－）＝，DE＝AH＝AB－HB ＝40－（）＝。即道路的总长度AB＋BC＋CD＋DE＋AE＝40＋（）＋50＋（）＋60＝200＋ ≈214，在210~220 米之间。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-069","paperId":"gk2024-xz","num":69,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某小区内部的道路如下图所示，道路转弯处的、、均为直角，。已知AB、 CD、EA 的长度分别为40 米、50 米、60 米，问整圈道路的总长度在以下哪个范围内？","options":["在200~210 米之间","在210~220 米之间","不到200 米","超过220 米"],"answer":"D","explanation":"时间问题-星期日期问题。9 月共30 天，参加13 次活动，说明9 月除了4 整周外，多出的2 天中有一天是周二、周五、周日中的一天；10 月共31 天，参加14 次活动，说明 10 月除了4 整周外，多出的3 天是周二、周五、周日中的两天。第1 种可能：10 月多出的三天是周五、周六、周日，那么9 月多出的两天是周三、周四，不满足题意；第2 种可能：10 月多出的三天是周日、周一、周二，那么9 月多出两天的是周五、周六，满足题意。即10 月29、30、31 日为周日、周一、周二，相对于10 月31 日而言，12 月31 日为30＋31＝61 天后，61÷7＝8……5，即周二往后推5 天为周日，是社团活动日，满足题意，故当年最后一次参加是12 月31 日。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-070","paperId":"gk2024-xz","num":70,"year":2024,"region":"国家","module":"数量关系","sub":"数学运算","stem":"某单位组织干部职工分5 批进行业务培训，培训地点有甲、乙、丙三个地方，每个地方至少安排一批。受接待能力影响，第一、二批不去甲地，问有多少种安排方式？","options":["52","62","72","82"],"answer":"C","explanation":"排列组合问题-基础排列组合。5 批去三个地方，每个地方至少一批，可分为两种情况：3、1、1 或1、2、2。第一种情况（3、1、1）：去甲3 批：种；去乙3 批：种；去丙3 批：种。合计2＋12＋12＝26 种。第二种情况（1、2、2）：去甲1 批：种；去乙1 批：种；去丙1 批：种。合计18＋9＋9＝36 种。总合计26＋36＝62 种。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-071","paperId":"gk2024-xz","num":71,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一项填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"C","explanation":"图形推理-位置类-动态位置-平移。二十五宫格的外圈区域，黑球每次往顺时针方向平移1 格；二十五宫格的内圈区域，黑球每次往顺时针移动4 格（看成内圈图案整体左右翻转也可）、最中间的黑球不变。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-072","paperId":"gk2024-xz","num":72,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一项填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"D","explanation":"图形推理-数量类-面。黑块面积依次占整体图形面积的六分之一、五分之一、四分之一、三分之一、二分之一、百分之百。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-073","paperId":"gk2024-xz","num":73,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一项填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"A","explanation":"图形推理-数量类-线。题干黑色多边形的外框线条数为5、3、4、5、6；白色多边形的外框线条数4、4、3、6、5；将黑色外框线条数减去白色外框线条数，差值的规律如下：","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-074","paperId":"gk2024-xz","num":74,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"从所给的四个选项中，选择最合适的一项填入问号处，使之呈现一定的规律性：","options":["A","B","C","D"],"answer":"B","explanation":"图形推理-样式类-样式运算-黑白叠加。横看，黑+白=白，白+白=黑，白+黑=白，黑+黑=空。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-075","paperId":"gk2024-xz","num":75,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"左图为15 个白色正方体和3 个灰色正方体组合而成的多面体，其可以由①、②和③三个多面体组合而成，问哪项能填入问号处？","options":["A","B","C","D"],"answer":"A","explanation":"图形推理-立体组合。将①和②经过一定方向的转动，可和A 项拼成题干完整的立体图形。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-076","paperId":"gk2024-xz","num":76,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"左图为8 个白色正方体和4 个黑色正方体粘接而成的长方体，问以下哪一个不可能是其外表面展开图？","options":["A","B","C","D"],"answer":"D","explanation":"图形推理-立体重构-六面体。将长方体的外表面依次标上序号和颜色，如下图所示： A 项各个面与题干一致，标记如下： B 项各个面与题干一致，标记如下： C 项各个面与题干一致，标记如下： D 项展开图中左下角的面和右侧的面为无中生有的面，与题干不一致，当选。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-077","paperId":"gk2024-xz","num":77,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"上图为13 个白色正方体和5 个灰色正方体组合而成的多面体，现用经A、B、C 三个顶点的平面对该多面体进行切割，正确的截面是：","options":["A","B","C","D"],"answer":"B","explanation":"图形推理-立体截面。经过ABC 三个点的平面用蓝色进行标记，该蓝色平面只经过最左边、最前面、正中间3 个灰块（可以分别从右侧蓝色箭头、左侧黄色箭头，辅助观察）。从右侧蓝色箭头观察右视图的切割痕迹如下：从左侧黄色箭头观察左视图的切割痕迹如下：因为蓝色平面只经过最左边、最前面、正中间3 个灰块，故截面中只会出现3 个阴影，排除 AC 项；并且截面外框应该只有一个缺口，排除D 项的两个缺口。按照蓝色平面切割后，从下往上看切面，即可得到B 项截图。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-078","paperId":"gk2024-xz","num":78,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①④⑤，②③⑥","①③④，②⑤⑥","①⑤⑥，②③④","①②⑥，③④⑤"],"answer":"C","explanation":"图形推理-数量类-线。图①⑤⑥是两笔画图，②③④是一笔画图。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-079","paperId":"gk2024-xz","num":79,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①④⑥，②③⑤","①⑤⑥，②③④","①②⑥，③④⑤","①③⑥，②④⑤"],"answer":"A","explanation":"图形推理-数量类-素。白色球将黑色球分割成两个部分。其中图①④⑥每个黑色球部分的黑球个数分别为2 个、4 个。其中图②③⑤每个黑球部分的黑球个数分别为1 个、 5 个。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-080","paperId":"gk2024-xz","num":80,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②⑥，③④⑤","①④⑥，②③⑤","①③⑤，②④⑥","①②③，④⑤⑥"],"answer":"D","explanation":"图形推理-数量类-面。图①②③中黑色阴影与4 个白色面相连。图④⑤⑥中黑色阴影与3 个白色面相连。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-081","paperId":"gk2024-xz","num":81,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"伪装型反侦查行为是指犯罪行为人通过采取相应措施来隐蔽自身、迷惑侦查机关侦查活动的行为，其主要表现为三类：①栽赃嫁祸，通过将赃物、违禁品暗置别人处等方式来误导侦查方向；②主动报案，通过实施“贼喊捉贼”式的行为来蒙蔽侦查机关；③制造伪证，通过假人证、不知情的人或一些特定物品，制造出虚假的不在场证明或者自己与案件无关的假象，以达到混淆视听、误导侦查视线的目的。根据上述定义，下列没有体现上述几类伪装型反侦查行为的是：","options":["甲将乙杀害后，故意在网络上散布丙与乙不和的谣言，转移警方注意力","甲在作案后，拿走可以证明受害人乙身份的物品，隐藏其身份","甲酒后与乙争吵并痛下杀手，事后甲主动报警，声称自己是目击证人","甲作案后接受警方讯问时，拿出案发当日的火车票谎称自己当时正在火车上"],"answer":"B","explanation":"定义判断-多定义。定义的关键词为：①犯罪行为人；②采取相应措施来隐蔽自身、迷惑侦查机关侦查活动的行为；③栽赃嫁祸，通过将赃物、违禁品暗置别人处等方式来误导侦查方向；④主动报案，通过实施“贼喊捉贼”式的行为来蒙蔽侦查机关；⑤制造伪证，通过假人证、不知情的人或一些特定物品，制造出虚假的不在场证明或者自己与案件无关的假象，以达到混淆视听、误导侦查视线的目的。结合选项：A 项甲将乙杀害，甲属于犯罪行为人。故意在网络上散布丙与乙不和的谣言，转移警方注意力，属于制造出虚假的不在场证明或者自己与案件无关的假象，以达到混淆视听、误导侦查视线的目的。符合定义，排除；B 项甲在作案后，拿走可以证明受害人乙身份的物品，隐藏其身份，隐蔽的是受害人的身份，而不是隐蔽犯罪行为人自身的行为，不符合定义，当选；C 项甲酒后与乙争吵并痛下杀手，甲属于犯罪行为人。事后甲主动报警，声称自己是目击证人，属于主动报案，通过实施“贼喊捉贼”式的行为来蒙蔽侦查机关。符合定义，排除；D 项甲作案后接受警方讯问时，拿出案发当日的火车票谎称自己当时正在火车上，属于制造出虚假的不在场证明或者自己与案件无关的假象，以达到混淆视听、误导侦查视线的目的。符合定义，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-082","paperId":"gk2024-xz","num":82,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"动物的战斗行为在进化中演变出一种既能决定胜负又能减少伤亡的相对固定的方式，这种方式被称为仪式化战斗。根据上述定义，下列不属于仪式化战斗的是：","options":["偶蹄动物通常用角互相推顶以比试力量，但并不攻击对方的要害部位","蟾蜍被其他动物捕食时，其体表会分泌毒液使捕食者产生不适，从而将其吐出","蜜蚁发生争斗时，会鼓起并翘起腹部，使自己看起来更大一些，直至对方投降","响尾蛇争斗时，采用颈部侧贴并互相压制的方式，并不使用毒牙和毒液"],"answer":"B","explanation":"定义判断-单定义。定义的关键词为：①动物的战斗行为；②在进化中演变出一种既能决定胜负又能减少伤亡的相对固定的方式。结合选项：A 项偶蹄动物通常用角互相推顶以比试力量，属于动物的战斗行为。但并不攻击对方的要害部位，属于既能决定胜负又能减少伤亡的方式。符合定义，排除；B 项蟾蜍被其他动物捕食时，其体表会分泌毒液使捕食者产生不适，从而将其吐出，其行为是为了对其他动物造成伤害，帮助自己避免被捕食，不属于既能决定胜负又能减少伤亡的方式。不符合定义，当选；C 项蜜蚁发生争斗时，属于动物的战斗行为。鼓起并翘起腹部，使自己看起来更大一些，直至对方投降，属于既能决定胜负又能减少伤亡的方式。符合定义，排除；D 项响尾蛇争斗时，属于动物的战斗行为。采用颈部侧贴并互相压制的方式，并不使用毒牙和毒液，属于既能决定胜负又能减少伤亡的方式。符合定义，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-083","paperId":"gk2024-xz","num":83,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"品牌延伸是将著名或成名品牌使用到与原产品不同类型的产品上，是企业在推出新产品过程中经常采用的策略。如果品牌延伸到一个与原产品相对立或易引起消费者反感的产品上，就会对消费者造成心理冲突。消费者只会购买其一，或两者都不买，从而损害原有品牌的形象。根据上述定义，下列情形属于品牌延伸导致消费者心理冲突的是：","options":["某著名雪糕品牌“白雪”跟著名白酒品牌“九里香”合作推出一款雪糕新产品“雪里香”，很多家长以为这款雪糕含酒精，不敢买给孩子吃","某奢侈品手提包品牌突然走平民路线，推出百元手提包，还印上了该品牌商标，不少消费者放弃了该品牌","某世界知名服装品牌为打开甲国市场，特地将甲国标志性的动物印在新款服饰上，但被指伤害了该国民众的民族感情，遭到了严重抵制","某知名厨卫清洁品牌深受消费者喜爱，后该品牌又进军食品行业，推出功能饮料产品，消费者一时难以接受"],"answer":"D","explanation":"定义判断-单定义。定义的关键词为：①将著名或成名品牌使用到与原产品不同类型的产品上；②品牌延伸到一个与原产品相对立或易引起消费者反感的产品上；③对消费者造成心理冲突。消费者只会购买其一，或两者都不买，从而损害原有品牌的形象。结合选项：A 项雪糕品牌与白酒品牌不属于品牌延伸到一个与原产品相对立或易引起消费者反感的产品上，不符合定义，排除；B 项奢侈品手提包与百元手提包都是手提包，二者属于相同类型的产品，不属于将著名或成名品牌使用到与原产品不同类型的产品上，不符合定义，排除； C 项某世界知名服装品牌为打开甲国市场，特地将甲国标志性的动物印在新款服饰上，只是在原来的产品上新增了动物图案，没有将著名或成名品牌使用到与原产品不同类型的产品上，不符合定义，排除；D 项某知名厨卫清洁品牌进军食品行业，推出功能饮料产品，属于品牌延伸到一个与原产品相对立或易引起消费者反感的产品上。消费者一时难以接受，属于对消费者造成心理冲突。符合定义，当选。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-085","paperId":"gk2024-xz","num":85,"year":2024,"region":"国家","module":"判断推理","sub":"图形推理","stem":"人际关系图，是用一套特定的符号来表示团体内成员之间各种关系的图形。依据前期的调查，将团体成员的关系分为“吸引”“排斥”“无关”三类。图中圆圈内的字母是团体内每一成员的代号。实线与虚线表示相互关系，其中实线表示吸引关系，虚线表示排斥关系，箭头表示方向（例如：表示A 受B 吸引，表示A 排斥B），其中被实线箭头指向最多的人，就是处于团体中心位置的人。根据上述定义，对下图的判断正确的是：","options":["该团体中没有相互排斥的人","C 是处于团体中心位置的人","F 是该团体中受排斥最多的人","H 和B 是相互吸引的人"],"answer":"A","explanation":"定义判断-多定义。定义的关键词为：① 表示A 受B 吸引； ② 表示A 排斥B；③被实线箭头指向最多的人，就是处于团体中心位置的人。结合选项：A 项虚线表示排斥关系，但是图中没有双向虚线箭头，因此该团队中没有相互排斥的人，该项判断正确，当选；B 项该团队中被实线箭头指向最多的人是B，因此 B 是处于团体中心位置的人，该项判断错误，排除；C 项虚线表示排斥关系，虚线箭头所指的代表被排斥的人，F 没有被虚线箭头指向，因此F 没有受到排斥，该项判断错误，排除； D 项实线箭头表述吸引关系，H 和B 之间没有直接的双向实线箭头，因此H 和B 不是相互吸引的人，该项判断错误，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-086","paperId":"gk2024-xz","num":86,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"慢病也称为慢性非传染性疾病，是指长期的、不能自愈的、也几乎不能被治愈的疾病。慢病自我管理是指慢病患者主动监测自己的病情，以积极态度及行动，改善健康和情绪，通过对疾病的认识，学习与疾病长期共存。根据上述定义，下列属于慢病自我管理的是：","options":["老张在患了流感后多方查阅相关信息，每天监测血氧、心率、血压等指标，不做剧烈运动，避免着凉","老王因慢性肾功能衰竭需定期在医院进行透析治疗，医院为其建立了慢病管理档案，追踪监测肾功能等各项指标","老赵的父母都因胃癌去世，老赵深知该疾病的严重后果，每年全面体检一次，定期进行胃肠镜检查，不熬夜不喝酒，规律作息","患II 型糖尿病的老李，平日生活格外谨慎，含糖量高的食物一概不碰，每天按时服药，定期监测血糖水平"],"answer":"D","explanation":"定义判断-多定义。慢病的关键词为：①慢性非传染性疾病；②长期的、不能自愈的、也几乎不能被治愈的疾病。慢病自我管理的关键词为：慢病患者主动监测自己的病情。结合选项：A 项中的流感是传染病，且不是长期的、不能自愈的、也几乎不能被治愈的疾病，不符合定义，排除；B 项是医院为其建立了慢病管理档案，不属于慢病患者主动监测自己的病情，不符合定义，排除；C 项老赵没有患病，不是慢病患者，不符合定义，排除；D 项II 型糖尿病属于慢性非传染性疾病。患者老李含糖量高的食物一概不碰，每天按时服药，定期监测血糖水平，属于慢病患者主动监测自己的病情。符合定义，当选。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-087","paperId":"gk2024-xz","num":87,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"民俗是指一个民族或一个社会群体在长期的生产实践和社会生活中逐渐形成并世代相传、较为稳定的文化事项，可以简单概括为民间流行的风尚、习俗，具有传承性、广泛性、稳定性。根据上述定义，下列活动属于民俗的是：","options":["清明节当天，黄帝陵举行隆重的公祭活动，按照既定祀典礼仪，缅怀始祖精神，传承中华文明","王老伯家有一个传承三代的习惯，每到重大节日，全家都要聚在一起，交流感情，品尝美食，共享天伦","农历九月九日为重阳节，自古以来，河洛地区的人们每逢这天都会结伴登高山、逛庙会、赏菊花","近年来，一些大都市的公园每周都会举办“相亲角”活动，中老年父母聚在一起替儿女相亲"],"answer":"C","explanation":"定义判断-单定义。定义的关键词为：①一个民族或一个社会群体；②在长期的生产实践和社会生活中逐渐形成并世代相传、较为稳定的文化事项；③民间流行的风尚、习俗，具有传承性、广泛性、稳定性。结合选项：A 项黄帝陵举行隆重的公祭活动往往是由官方组织的，不是民间流行的风尚、习俗，不符合定义，排除；B 项王老伯家的习惯是他们一家人的行为，不是一个民族或一个社会群体的行为，不符合定义，排除；C 项河洛地区的人们，属于一个民族或一个社会群体。每逢重阳节都会结伴登高山、逛庙会、赏菊花，属于在长期的生产实践和社会生活中逐渐形成并世代相传、较为稳定的文化事项。符合定义，当选；D 项“相亲角”活动，不属于在长期的生产实践和社会生活中逐渐形成并世代相传、较为稳定的文化事项，不符合定义，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-088","paperId":"gk2024-xz","num":88,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"电力系统的电力设备根据其在运行中所起的作用，分为电力一次设备和电力二次设备。电力一次设备指的是直接参与生产、变换、传输、分配和消耗电能的设备；电力二次设备指的是为了保护并保证电力一次设备的正常运行，对其运行状态进行测量、监视、控制和调节等的设备。根据上述定义，下列说法正确的是：","options":["电路中用于升降交流电压的变压器，属于电力二次设备","将回路中高电压降低的电压互感器，属于电力一次设备","由柴油驱动的发电机，属于电力二次设备","记录零序电流值并用于查找故障点的故障录波装置，属于电力一次设备"],"answer":"B","explanation":"定义判断-多定义。电力一次设备的关键词为：直接参与生产、变换、传输、分配和消耗电能的设备。电力二次设备的关键词为：为了保护并保证电力一次设备的正常运行，对其运行状态进行测量、监视、控制和调节等的设备。结合选项：A 项升降交流电压，属于直接参与生产、变换、传输、分配和消耗电能，符合电力一次设备，该项说法错误，排除； B 项将回路中高电压降低，属于直接参与生产、变换、传输、分配和消耗电能，符合电力一次设备，该项说法正确，当选；C 项由柴油驱动的发电机，属于直接参与生产电能的设备，符合电力一次设备，该项说法错误，排除；D 项记录零序电流值并用于查找故障点的故障录波装置，属于为了保护并保证电力一次设备的正常运行，对其运行状态进行测量、监视、控制和调节等的设备，符合电力二次设备，该项说法错误，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-089","paperId":"gk2024-xz","num":89,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"甲类对象如果全部属于乙类对象，就把表达甲类对象的概念称为种概念，表达乙类对象的概念称为属概念。属种定义是一种明确概念的定义方法，其定义方法是首先找出与被定义概念相邻近的上位属概念，然后找出被定义概念与该邻近属概念下其他种概念之间的差别，以此来定义该概念。根据上述定义，下列属于属种定义的是：","options":["葛布是用葛的纤维织成的布","吃香即受欢迎","摩天大厦指的是诸如上海金茂大厦、迪拜哈利法塔那样的高楼大厦","竹林七贤指的是魏晋时期的阮籍、嵇康、山涛、刘伶、阮咸、向秀和王戎等七位名士"],"answer":"A","explanation":"定义判断-多定义。定义的关键词为：①首先找出与被定义概念相邻近的上位属概念；②然后找出被定义概念与该邻近属概念下其他种概念之间的差别。结合选项：A 项葛布是被定义项，布是其相邻近的上位属概念，用葛的纤维织成的属于被定义概念与该邻近属概念下其他种概念之间的差别，符合定义，当选；B 项吃香为被定义项，但是受欢迎和吃香是相同的意思，不属于相邻近的上位属概念，不符合定义，排除；C 项摩天大厦是被定义项，高楼大厦是其相邻近的上位属概念，但是诸如上海金茂大厦、迪拜哈利法塔那样的，是对摩天大厦的一些案例，不属于被定义概念与该邻近属概念下其他种概念之间的差别，不符合定义，排除；D 项竹林七贤是被定义项，名士是其相邻近的上位属概念，但阮籍、嵇康、山涛、刘伶、阮咸、向秀和王戎是竹林七贤的具体对象，不属于被定义概念与该邻近属概念下其他种概念之间的差别，不符合定义，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-090","paperId":"gk2024-xz","num":90,"year":2024,"region":"国家","module":"判断推理","sub":"定义判断","stem":"中医七方指的是大方、小方、缓方、急方、奇方、偶方、复方七种方剂的总称。其中缓方是指药性缓和，治疗病势缓慢需长期服用的方剂；急方是指药性峻猛，治疗病势急重急于取效的方剂；奇方是指单数药物组成的方剂；偶方是指双数药物组成的方剂。根据上述定义，下列既属于缓方又属于偶方的是：","options":["参附汤：人参15 克、附子30 克，有回阳、益气、固脱之功，常用于元气大亏、阳气暴脱之症","甘草汤：甘草6 克，主治少阴咽痛，兼治舌肿，有清热解毒之功效","四君子汤：人参、甘草、茯苓、白术各等分，主治脾胃气虚证，症见面色萎黄、语声低微、气短乏力等","生脉散：人参9 克、麦门冬9 克、五味子6 克，为补益剂，具有益气生津、敛阴止汗之功效"],"answer":"C","explanation":"定义判断-多定义。缓方的关键词为：药性缓和，治疗病势缓慢需长期服用的方剂。偶方的关键词为：双数药物组成的方剂。结合选项：A 项常用于元气大亏、阳气暴脱之症，不属于治疗病势缓慢需长期服用的方剂，不符合定义，排除；B 项只有一种药物甘草，不属于双数药物组成的方剂，不符合定义，排除；C 项人参、甘草、茯苓、白术各等分，属于双数药物组成的方剂。主治脾胃气虚证，症见面色萎黄、语声低微、气短乏力等，属于治疗病势缓慢需长期服用的方剂。符合定义，当选；D 项人参9 克、麦门冬9 克、五味子6 克，不属于双数药物组成的方剂，不符合定义，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-091","paperId":"gk2024-xz","num":91,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"质证：法庭","options":["缴费：窗口","监狱：拘役","监考：考场","采访：现场"],"answer":"C","explanation":"类比推理-逻辑关系-对应关系。“质证”指在法庭的主持下，当事人、诉讼代理人及第三人对提出的证据进行说明和质辩的活动或过程。在“法庭”上“质证”，二者为地点和动作的对应关系，而且“质证”一定发生在“法庭”上。结合选项：A 项在“窗口”前“缴费”，二者为地点和动作的对应关系，但“缴费”不一定在窗口，有可能是线上，排除；B 项在“监狱”中“拘役”，二者为地点和动作的对应关系，但是对应的位置错误，排除；C 项在“考场”上“监考”，二者为地点和动作的对应关系，“监考”一定在“考场”发生，与题干逻辑关系一致，正确；D 项在“现场”中“采访”，二者为地点和动作的对应关系，但是“采访”可能是通过电话发生，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-092","paperId":"gk2024-xz","num":92,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"花生壳：核桃仁","options":["刺梨汁：桃花扇","丝瓜络：石榴籽","杏仁露：葡萄皮","葛根茶：芡实粉"],"answer":"B","explanation":"类比推理-逻辑关系-包容关系。“花生壳”是花生的组成部分；“核桃仁”是核桃的组成部分，都是组成各自植物的一部分。结合选项：A 项“刺梨汁”是刺梨为原材料制成的果汁， “桃花扇”是指扇面上画有桃花的扇子，排除；B 项“丝瓜络”丝瓜的组成部分，“石榴籽”是石榴的组成部分，与题干逻辑关系一致，正确；C 项“杏仁露”以杏仁为原材料制成，“葡萄皮” 是葡萄的组成部分，排除；D 项“葛根茶”以葛根为原材料制成；“芡实粉”以芡实为原材料磨成，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-093","paperId":"gk2024-xz","num":93,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"诛禁不当：反受其央","options":["为者常成：行者常至","君子检身：常若有过","其身不正：虽令不从","麻雀虽小：五脏俱全"],"answer":"C","explanation":"类比推理-逻辑关系-因果关系。诛禁不当，反受其央，意思是惩罚得不恰当，反而受其祸害，因果关系，意为因为诛禁不当，所以反受其央。结合选项：A 项为者常成，行者常至，意思是努力去做的人常常可以成功，不倦前行的人常常可以达到目的，并列关系，排除；B 项君子检身，常若有过，意思是君子要时时反省检查自己，就像自己经常会有缺点过失那样，排除；C 项其身不正，虽令不从，意思是在上位的管理者本身言行不正，因果关系，意思是因为其身不正，所以虽令不从，正确；D 项麻雀虽小，五脏俱全，比喻事物的体积或规模虽小，具备的内容却很齐全，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-094","paperId":"gk2024-xz","num":94,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"花香四溢：分子运动","options":["波光粼粼：光的反射","聚沙成塔：质量互变","水落石出：水的浮力","炉火纯青：金属炼制"],"answer":"A","explanation":"类比推理-逻辑关系-对应关系。花香四溢是花的香味在空气中向四处飘洒，形容花香浓郁。花香四溢的原理是分子运动，对应关系。结合选项：A 项波光粼粼形容波光明净。波光粼粼的原理是光的反射，对应关系，与题干逻辑关系一致，正确；B 项聚沙成塔意思是把沙子堆成宝塔，比喻积少成多。与质量互变无关，排除；C 项水落石出“水落石出”原指水落下去，水底的石头就露出来，比喻事情的真相完全显露出来，体现了自然界中动态与静态的辩证关系。因为水落，所以石出。排除；D 项炉火纯青相传道家炼丹，到炉子里的火发出纯青色的火焰的时候，就算成功了。比喻学问、技术或办事达到了纯熟完美的地步。炉火纯青的原理不是金属炼制，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-095","paperId":"gk2024-xz","num":95,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"发酵：灌装：生产红酒","options":["摇晃：搅拌：冲泡奶粉","下载：打印：检索资料","养殖：运输：销售对虾","折叠：粘合：制作信封"],"answer":"D","explanation":"类比推理-逻辑关系-对应关系。生产红酒的过程包括发酵和灌装，组成关系；先发酵再灌装，时间顺序。结合选项：A 项冲泡奶粉的过程需要摇晃和搅拌，摇晃和搅拌没有先后顺序，排除；B 项检索资料与下载和打印没有包含关系，排除；C 项销售对虾的过程包括运输，不包括养殖，排除；D 项制作信封的过程包括折叠和粘合，组成关系，先折叠再粘合，与题干逻辑关系一致，正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-096","paperId":"gk2024-xz","num":96,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"蚜虫：七星瓢虫：小麦","options":["蛇：鸟：谷子","稗草：螳螂：水稻","蚊子：青蛙：高粱","老鼠：黄鼬：玉米"],"answer":"D","explanation":"类比推理-语法关系-主宾关系。蚜虫会吸食小麦的汁液，主宾关系；七星瓢虫会捕食蚜虫，主宾关系。结合选项：A 项有的蛇会吃鸟，有的鸟会吃蛇，排除；B 项稗草是一种常见的田间杂草，会和水稻竞争稻田里的资源，竞争关系，排除；C 项只有雄性蚊子会吸食植物的汁液，而题干是所有蚜虫都会吸食小麦的汁液，与题干逻辑关系不一致，排除；D 项老鼠吃玉米，主宾关系，黄鼬会捕食老鼠，主宾关系，与题干逻辑关系一致，正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-097","paperId":"gk2024-xz","num":97,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"感想：主观性：体会","options":["典范：示范性：表率","发明：创造性：方法","泥土：可塑性：材料","规律：普适性：定理"],"answer":"A","explanation":"类比推理-逻辑关系-混合考点。感想指由接触外界事物引起的思想活动，体会是指体验领会，近义关系；感想和体会均具有主观性，必然属性。结合选项：A 项典范可以作为榜样而起示范作用的人或事物，表率是好榜样，二者为近义关系；典范和表率均具有示范性，必然属性，与题干逻辑关系一致，正确；B 项发明需要方法，排除；C 项泥土是一种材料，种属关系；材料可能具有可塑性，或然属性，排除；D 项规律自然界和社会诸现象之间必然、本质、稳定和反复出现的关系，定理是经过受逻辑限制的证明为真的陈述。定理是规律的一种，种属关系，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-098","paperId":"gk2024-xz","num":98,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"放养过密：饲喂不当：鱼病发生","options":["任务繁重：临时加班：积劳成疾","材料审核：实地考核：评估通过","地基下沉：结构老化：房屋倾斜","市场饱和：利润下降：分红减少"],"answer":"C","explanation":"类比推理-逻辑关系-混合考点。“放养过密”和“饲喂不当”是不科学的饲养方式，反对关系，都是导致“鱼病发生”的原因，因果关系。结合选项：A 项因为“任务繁重”，所以“临时加班”，因果关系，“任务繁重”导致“积劳成疾”，因果关系，排除；B 项“材料审核”和“实地考核”都是审核的一种，并列关系，但“材料审核”和“实地考核”都是“评估通过”的条件，条件对应关系，排除；C 项“地基下沉”和“结构老化”都是建筑的问题，反对关系，都是导致“房屋倾斜”的原因，因果关系，与题干逻辑关系一致，正确；D 项“市场饱和”导致“利润下降”，因果关系，“利润下降”导致“分红减少”，因果关系，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-099","paperId":"gk2024-xz","num":99,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"嬗变对于（）相当于（）对于生肖","options":["改变；中国","演变；属相","剧变；动物","巨变；传统"],"answer":"B","explanation":"类比推理-词义关系-近义关系。结合选项：A 项嬗变指蜕变、演变，与改变是近义关系；生肖指十二生肖，又叫属相，与中国是对应关系，排除；B 项嬗变指蜕变、演变，与演变是近义关系；生肖与属相也是近义关系，前后逻辑关系一致，正确；C 项剧变指急剧的变化，与嬗变均有改变的意思，近义关系；生肖与动物是对应关系，排除；D 项巨变指巨大或剧烈的变化，与嬗变均有改变的意思，近义关系；生肖是中国传统文化的重要组成部分，与传统是包容关系，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-100","paperId":"gk2024-xz","num":100,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"重型战机对于（）相当于（）对于分辨率","options":["隐形战机清晰度","战斗机性能指标","轻型战机订单量","载弹量显示器"],"answer":"D","explanation":"类比推理-逻辑关系-对应关系。A 项重型战机是指战斗机中体型相对较大，航程相对较远，载弹量相对较大的战斗机，具有纵深打击能力；隐形战机是通过在机身涂上一层高效吸收电波的物质，造成雷达无法追踪的效果。重型战机和隐形战机交叉关系；分辨率是表征清晰度的一个因素，对应关系，排除；B 项重型战机是指战斗机中体型相对较大，航程相对较远，载弹量相对较大的战斗机，具有纵深打击能力，种属关系；分辨率是一种性能指标，种属关系，顺序错误，排除；C 项重型战机与轻型战机是并列关系；分辨率可能会影响订单量，对应关系，排除；D 项载弹量是重型战机的一个性能指标，对应关系；分辨率是显示器的一个性能指标，对应关系，前后逻辑关系一致，正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-101","paperId":"gk2024-xz","num":101,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"对体外环境的感知是人类生存、交流和进化的基本能力。人体的味觉系统是信息感知的重要组成部分。有学者认为，苦味的感知是人类长期进化的一种防御机制，这意味其担负着保护人体免于摄入有毒物质的预警任务。以下哪项最可能是上述学者论述的前提？","options":["苦味受体能监测味觉分子并将信号传递至大脑","已发现人体的25 种苦味受体分布于舌头的不同部位","苦味分子与苦味受体结合，激活大脑味觉皮层，产生味觉感知","已有研究表明，自然界的大部分有毒物质是苦的"],"answer":"D","explanation":"逻辑判断-论证-前提假设类论证。论点：苦味的感知担负着保护人体免于摄入有毒物质的预警任务。论据：苦味的感知是人类长期进化的一种防御机制。结合选项：A 项讨论的是苦味受体如何将信号传递到大脑，而论点表述为苦味是否是预警标志，论题不一致，排除；B 项苦味受体分布在舌头不同部位，而论点表述为苦味是否是预警标志，论题不一致，排除；C 项苦味分子与苦味受体如何激活大脑皮层，产生味觉感知，而论点表述为苦味是否是预警标志，论题不一致，排除；D 项指出自然界的大部分有毒物质是苦的，说明苦确实是有毒物质的预警，是论点成立的必要条件，可以加强，正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-102","paperId":"gk2024-xz","num":102,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"在过去，药物的研发主要来自于陆地生物，这与陆地生物更被熟知且容易获得有关。近几十年来，越来越多的药物开始从海洋生物中产生，海洋生态环境极具复杂性，因而海洋生物相比于陆地生物有着更为广泛的多样性。有人据此认为，海洋生物产业潜力巨大，海洋生物更有可能是未来新型抗生素、抗癌药物的来源。以下除哪项外，均能支持上述观点？","options":["目前抗生素都来源于陆地微生物，病菌耐药性不断上升，而海洋微生物药物已经对一些感染性疾病提供了替代性疗法","借助计算机工具，人们已经将庞大的生物基因组库和具有生物活性的化合物库进行关联，用以探索新药物","一些海洋生物如鲸、鲨等终身不得癌症，有近300 种海洋生物含有抗肿瘤物质，它们是研究抗癌药物的重要资源","当前已经发现的3.5 万个海洋天然产物中有一半以上都具有生物活性，还有更多数以万计的未知海洋天然产物亟待开发"],"answer":"B","explanation":"逻辑判断-论证-不能支持。论点：海洋生物产业潜力巨大，海洋生物更有可能是未来新型抗生素，抗癌药物的来源。论据：近几十年来，越来越多的药物开始从海洋生物中产生，海洋生态环境极具复杂性，因而海洋生物相比于陆地生物有着更为广泛的多样性。结合选项：A 项指出陆地微生物生产抗生素的不足，而海洋微生物提供了替代性疗法，举例说明海洋生物产业潜力巨大，补充论据，可以加强，排除；B 项说明人们将庞大的“生物基因组库”和“具有生物活性的化合物库”进行关联，并未提及海洋生物的功能，论题不一致，无法加强，正确；C 项一些海洋生物如鲸、鲨等终身不得癌症，有近300 种海洋生物含有抗肿瘤物质，举例说明海洋生物产业潜力巨大，补充论据，可以加强，排除；D 项说明大量海洋天然产物具有生物活性，还有很多海洋天然产物亟待开发，举例说明海洋生物产业潜力巨大，补充论据，可以加强，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-103","paperId":"gk2024-xz","num":103,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"W 国对咖啡领域的调查显示，过去W 国咖啡领域的融资金额高达5 亿元，该国许多知名企业跨界进入咖啡领域，本土咖啡品牌在快速崛起。然而经过去年一年的销售发现，W 国线下咖啡门店的总数量虽然有所增加，但咖啡销量与往年相比并未明显增加，因此有人认为：咖啡在W 国居民中不是很受欢迎。以下哪项如果为真，最能削弱上述观点？","options":["W 国个别线下门店提供的速溶咖啡添加了植脂末、白砂糖等成分，摄入过多不利于身体健康","与一些咖啡销量高的国家相比，W 国咖啡的单价过高，在一定程度上阻碍了消费欲望","W 国的一些企业开始倾向咖啡液、速溶咖啡、袋泡咖啡等全品类进军","当前，W 国的咖啡文化并不成熟，作为消费主体的年轻人喝咖啡也大多是赶潮流"],"answer":"C","explanation":"逻辑判断-论证-削弱论证-拆桥。论点：咖啡在W 国居民中不是很受欢迎。论据：经过去年一年的销售发现，W 国线下咖啡门店的总数量虽然有所增加，但咖啡销量与往年相比并未明显增加。结合选项：A 项指出W 国“个别门店”的速溶咖啡添加的某些成分摄入过多对身体健康不利，但是没有说是否是论点中的不是很受欢迎，论题不一致，排除；B 项指出W 国线下咖啡门店增加但销量并未增加是因为咖啡单价过高，更多解释的是论据为什么线下咖啡门店虽然增加但是销量并未增加，所以是解释论据，（此题有些人选择B，是因为弄反了论据与论点的关系，认为是论点的不受欢迎导致了论据的销量并未增加，所以认为 B 项另有他因的削弱。但是本题的论据和论点的关系应该为，销量并未增加得到不受欢迎，所以B 项是对论据的解释，与论点没有关系。同时不受欢迎和阻碍消费欲望是两个独立的概念，不能混为一谈，有些物品可以受欢迎但是因为太贵阻碍消费欲望）；C 项指出W 国的一些企业“开始倾向”咖啡液等全品类咖啡产品，正好解释在论据到论点关系中论据表述不全，只是从线下销量得到不受欢迎，拆桥削弱（本题C 项也存在一定瑕疵，论据中的销量其实没有明确说明是线下销量，但是从题干的“但”字的转折可以发现是针对前半句的转折，所以表明的应该是线下的销量）；D 项指出W 国的咖啡文化不成熟，消费主体喝咖啡大多是赶潮流，赶潮流和不受欢迎是两个独立的概念，论题不一致，排除。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-104","paperId":"gk2024-xz","num":104,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"软件通常存在漏洞，攻击者为接近并操控目标主机，往往会主动寻找漏洞，攻击者会花费大量时间区分软件中“真正危险的漏洞”和“良性漏洞”，并在找到前者后实施攻击。因此有观点认为：如果添加大量良性漏洞欺骗攻击者，使其耗尽资源去寻找和测试那些毫无攻击用途的漏洞，将会减少对软件“真正危险的漏洞”的攻击，从而保证软件不被攻击者恶意控制。以下哪项如果为真，最能削弱上述观点？","options":["与软件中“真正危险的漏洞”相比，良性漏洞被攻击后只会导致程序崩溃","添加漏洞意味着要更改代码，有时候代码运行不良可能会影响软件的功能","许多军用飞机、舰艇都配有假目标系统，与此类似，良性漏洞也将起到干扰作用","大量添加良性漏洞会让其呈现很多人为特征，攻击者可利用其识别并忽略良性漏洞"],"answer":"D","explanation":"逻辑判断-论证-削弱论证-反向增加论据。论点：如果添加大量良性漏洞欺骗攻击者，使其耗尽资源去寻找和测试那些毫无攻击用途的漏洞，将会减少对软件“真正危险的漏洞”的攻击，从而保证软件不被攻击者恶意控制。论据：攻击者会花费大量时间区分软件中“真正危险的漏洞”和“良性漏洞”，并在找到前者后实施攻击。结合选项：A 项说的是良性漏洞遭到攻击后对程序的影响，但是论点讨论的是通过添加大量良性漏洞保证软件不被攻击者恶意控制，论题不一致，排除；B 项添加漏洞可能会影响软件功能，但是论点讨论的是通过添加大量良性漏洞保证软件不被攻击者恶意控制，论题不一致，排除；C 项与军用飞机等的假目标系统类似，良性漏洞将起到干扰作用，类比加强，排除；D 项说的是攻击者可以利用大量添加的良性漏洞的特征来忽略它们，说明通过大量添加良性漏洞的方法无法保证软件不被攻击者恶意控制，反向增加论据的削弱，正确。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-105","paperId":"gk2024-xz","num":105,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"研究发现，一种被称为EPAS1 的特殊基因能调节机体生理状态，使人类适应缺氧环境。考古研究表明这种特殊基因最早可追溯至16 万年前已居住于青藏高原的古人类。由于16 万年前全国同时生活着尼安德特人、丹尼索瓦人及古老的直立人，其中只有丹尼索瓦人拥有这一基因，考古学家推测丹尼索瓦人很有可能在16 万年前居住于青藏高原。以下除哪项外，均能支持考古学家的推测？","options":["通过对牙齿形态的扫描，发现青藏高原古人类的牙齿齿列和丹尼索瓦人最为相似","分析青藏高原人骨化石中的蛋白质序列，发现这些人类与丹尼索瓦人同属一类","考古人员在青藏高原东北部的白石崖溶洞遗址提取到丹尼索瓦人的线粒体DNA","丹尼索瓦人曾在亚洲广泛分布，他们曾在西伯利亚生活过，可耐受高寒环境（一）有甲、乙、丙、丁、戊、己6 个城市，其中的两个城市在2021 年结成一对友好城市，其余4 个城市中的2 个在2022 年结成一对友好城市，剩余的2 个城市在2023 年也结成一对友好城市，已知：（1）乙的结对城市不是丁（2）甲的结对城市不是乙就是丙（3）甲和乙均不是在2021 年结对的（4）丁和戊均不是在2023 年结对的"],"answer":"D","explanation":"逻辑判断-论证-不能加强。论点：丹尼索瓦人很有可能在16 万年前居住于青藏高原。论据：研究发现，一种被称为EPASI 的特殊基因能调节机体生理状态，使人类适应缺氧环境。考古研究表明这种特殊基因最早可追溯至16 万年前已居于青藏高原的古人类。由于 16 万年前全国同时生活着尼安德特人、丹尼索瓦人及古老的直立人，其中只有丹尼索瓦人拥有这一基因。结合选项：A 项青藏高原古人类的牙齿齿列和丹尼索瓦人最为相似，丹尼索瓦人很有可能曾居住于青藏高原，补充论据，可能性加强，排除；B 项青藏高原人骨化石中的蛋白质序列与丹尼索瓦人同属一类，增加论据支持，排除；C 项指出在青藏高原的白石崖溶洞遗址提取到丹尼索瓦人的线粒体DNA，说明丹尼索瓦人曾在青藏高原出现过，增加论据支持，排除；D 项丹尼索瓦人曾在亚洲广泛分布，曾在西伯利亚生活过，可耐受高寒环境，没有明确说明是否居住于青藏高原，论据表意不明，当选。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-106","paperId":"gk2024-xz","num":106,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"下列哪项是可能的先后依次结对的城市名单？","options":["甲和丙，丁和戊，乙和己","丙和丁，甲和乙，戊和己","丁和己，丙和戊，甲和乙","丙和戊，甲和丁，乙和己"],"answer":"C","explanation":"逻辑判断-综合推理-套材料。根据条件（2））甲的结对城市不是乙就是丙，排除 D 项。根据条件（3）甲和乙均不是在2021 年结对的，排除A 项。（4）丁和戊均不是在2023 年结对的，排除B 项。因此，正确答案为C 项。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-107","paperId":"gk2024-xz","num":107,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果己是2023 年结对的，那么戊一定是和哪个城市结对的？","options":["甲","乙","丙","丁"],"answer":"D","explanation":"逻辑判断-综合推理-套材料。根据条件（2）可知，甲的结对城市不是己，又因为己是2023 年结对，因此甲不是在2023 年结对的。又因为甲不是在2021 年结对的，故甲是在2022 年结对的。而甲要么和乙结对，要么和丙结对，每一年两个城市结成一对友好城市，因此2022 年剩下的一个城市要么是乙，要么是丙，不可能是丁和戊，所以丁和戊不可能在 2022 年结对。结合条件（4）可知，丁和戊均不是在2023 年结对的，所以丁和戊只能在2021 年结对。因此戊是和丁结对的。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-108","paperId":"gk2024-xz","num":108,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果丁是2022 年结对的，那么下列各项中，哪两个城市可能结对？","options":["丙和戊","乙和己","甲和戊","乙和戊"],"answer":"A","explanation":"逻辑判断-综合推理-套材料。根据丁是2022 年结对以及条件（1）（2），可知甲、乙不与丁结对，所以甲、乙不是在2022 年结对的。结合条件（3）可知，甲和乙均不是在 2021 年结对的，因此甲、乙都是在2023 年结对的。B、C、D 项均不可能结对，排除。故正确答案为A 项。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-109","paperId":"gk2024-xz","num":109,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"如果甲和丙结对，下列哪一项一定为真？","options":["丙是2023 年结对的","己是2023 年结对的","丁是2021 年结对的","戊是2021 年结对的"],"answer":"C","explanation":"逻辑判断-综合推理-套材料。如果甲和丙结对，根据条件（3）甲不在2021 年结对可知，甲和丙结对的时间要么是2022 年，要么是2023 年。又因为乙也不是在2021 年结对，故乙结对的时间要么是2022 年，要么是2023 年。此时2022 年和2023 年4 个结对名额只剩下1 个，该城市为乙的结对城市，且乙的结对城市不是丁，故丁不可能在2022 年或2023 年结对，只能在2021 年。因此，C 项一定为真。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-110","paperId":"gk2024-xz","num":110,"year":2024,"region":"国家","module":"判断推理","sub":"逻辑判断","stem":"有几个城市可能是在2022 年与其他城市结对的？","options":["6 个","5 个","4 个","3 个"],"answer":"A","explanation":"逻辑判断-综合推理-套材料。满足题干条件的可以有以下几种情况：情况一：情况二：情况三：因此，有6 个城市可能是在2022 年与其他城市结对的。","material":"","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-111","paperId":"gk2024-xz","num":111,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"将S 省各级12315 工作机构接收的投诉、举报和咨询三类诉求量按2022 年同比增速从高到低排序，以下正确的是：","options":["投诉量、举报量、咨询量","咨询量、投诉量、举报量","举报量、咨询量、投诉量","举报量、投诉量、咨询量"],"answer":"D","explanation":"增长率-增长率的比较。定位文字材料第一段可知，2022 年投诉55.6 万件，举报 26.3 万件，咨询138.5 万件，比上一年分别增加14.0 万件，8.9 万件，16.0 万件。投诉量的增长率为；举报量的增长率为；咨询量的增长率为，故同比增速从高到低排序为举报量、投诉量、咨询量。备注：也可以考虑越低，则增长率越高。由于，故增长率从高到低依次是举报量、投诉量、咨询量。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-112","paperId":"gk2024-xz","num":112,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2022 年，S 省各级12315 工作机构热线电话投诉接收件数占投诉总件数的比重比热线电话举报接收件数占举报总件数的比重：","options":["高20 个百分点以上","低20 个百分点以上","高不到20 个百分点","低不到20 个百分点"],"answer":"B","explanation":"现期比值-现期比重。定位表格可知：2022 年S 省各级12315 工作机构热线电话投诉接受量为304498 件，投诉总接受量为556063 件；热线电话举报接受量为61021 件，举报总接受量为263129 件。热线电话投诉接受量的占比约为；热线电话举报接受量的占比约为，所以前者比后者高了55%－23%＝32%，即高20 个百分点以上。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-113","paperId":"gk2024-xz","num":113,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2022 年，S 省各级12315 工作机构接收诉求量最少的季度是：","options":["第一季度","第二季度","第三季度","第四季度"],"answer":"A","explanation":"简单计算-简单加减。定位柱状图，各截前两位进行估算可得：第一季度 ≈15+13+20=48；第二季度≈17+19+21=57；第三季度≈22+20+20=62；第四季度≈18+18+17=53。因此，接受诉求量最少的季度为第一季度。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-114","paperId":"gk2024-xz","num":114,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"以下折线图反映了2022 年哪一时间段内S 省各级12315 工作机构的接收诉求量环比增量的变化趋势？","options":["2~5 月","3~6 月","5~8 月","8~11 月"],"answer":"B","explanation":"增长量-增长量的计算。定位柱状图。代入A 项：2 月数据相对于1 月降低，增长量为负，但3 月相对于2 月增长，增长量为正，因此3 月增长量大于2 月，排除A 项；代入B 项：根据柱状图高度差可知全年中只有3 月增长量最大，4 月增长量为负，5 月增长量＝18.5－16.6＝1.9 万件，6 月增长量＝21.2－18.5＝2.7 万件，因此，3~6 月增长量数据符合折线图的变化趋势。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-x aterial":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-127","paperId":"gk2024-xz","num":127,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2023 年一季度，我国机器人设备进出口贸易逆差比上年同期：","options":["下降了不到30%","下降了30%以上","上升了不到30%","上升了30%以上"],"answer":"A","explanation":"增长率-整体增长率。定位文字材料第二段，进口＝逆差＋出口。根据整体增长率的口诀，可得下图：因此，r＞55.1－7%＝48.1%。即上升了30%以上。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-128","paperId":"gk2024-xz","num":128,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"2022 年12 月，全国规模以上工业企业的①工业机器人完成产量和②服务机器人完成产量：","options":["均高于1~11 月的月均水平","均低于1~11 月的月均水平","仅①高于1~11 月的月均水平","仅②高于1~11 月的月均水平"],"answer":"B","explanation":"现期比值-现期平均数。定位文字材料第三段，12 月高于1~11 月的月均水平，可以转化为12×12 月＞1~12 月。①工业机器人完成产量：4×12＞44.3，即12 月高于1~11 月的月均水平；②服务机器人完成产量：49.1×12＜645.8，即12 月低于1~11 月的月均水平。因此，仅①高于1～11 月的月均水平。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-129","paperId":"gk2024-xz","num":129,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"已知2022 年1~11 月我国高新技术产品进出口总额约为14544 亿美元，则同期我国工业机器人设备累计进出口总额约占高新技术产品累计进出口总额的：","options":["0.2%","0.5%","1.0%","1.6%"],"answer":"D","explanation":"现期比值-现期比重。定位文字材料最后一段，2022 年1～11 月我国工业机器人设备累计进出口总额为（6.1＋20）－（0.5＋1.8）＝23.8 亿美元，则所求比重应为。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2024-xz-130","paperId":"gk2024-xz","num":130,"year":2024,"region":"国家","module":"资料分析","sub":"综合资料","stem":"能够从上述资料中推出的是：","options":["2022 年3 月，我国机器人设备出口金额不到3000 万美元","2023 年3 月，我国机器人设备进口金额同比增速快于1~2 月同比增速","2023 年一季度，全国规模以上工业企业的服务机器人完成产量高于上年各季度均值","2022 年1~11 月，全国规模以上工业企业的工业和服务机器人完成产量之和超过650 万套 ※※※全部测验到此结束！※※※ 扫码获取真题解析关注尚邦公考公众号获取更多公考备考资讯"],"answer":"C","explanation":"综合文字题。 A 选项，基期量的计算，定位文字材料第二段，根据，代入数据得亿美元=3300 万美元，超过3000 万美元，错误； B 选项，简单计算，定位文字材料第三段，2022 年1~12 月全国规模以上企业的工业和服务机器人累计完成产量之和为44.3＋645.8＝690.1 万套，2022 年12 月产量和为4＋49.1＝53.1 万套，则2022 年1~11 月产量和为690.1－53.1＝637 万套，不到650 万套，错误； C 选项，增长率的计算，定位文字材料第二段，1~3 月进口金额＝3 月进口金额＋1~2 月进口金额，整体增长率的口诀，可得下图：即3 月的同比增速＞1~2 月的同比增速，正确； D 选项，平均数的比较，定位文字材料第一段和第三段，2022 年全国规模以上工业企业的服务机器人完成产量各季度均值为万套＞145 万套，错误。","material":"问题要你回答。你应根据资料提供的信息进行分析、比较、计算和判断处理。（二） 2022 年，S 省各级12315 工作机构共接收诉求220.4 万件，同比增长21.41%。其中，投诉 55.6 万件、举报26.3 万件、咨询138.5 万件，比上一年分别增加14.0 万件、8.9 万件、16.0 万件。","source":"2024年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-001","paperId":"gk2023-xz","num":1,"year":2023,"region":"国家","module":"常识判断","sub":"人文历史","stem":"党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。下列对中国式现代化的理解，正确的有几项： ①坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点 ②共同富裕是社会主义的本质要求，是中国式现代化的重要特征 ③在物质文明方面超越西方发达国家，是中国式现代化的主要目标 ④遵循世界各国现代化的共同模式，是中国式现代化道路的基本经验 ⑤中国式现代化新道路，创造了人类文明新形态","options":["2项","3项","4项","5项"],"answer":"B","explanation":"【格木解析】①二十报告原文：“我们坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点”。②二十报告原文：“中国式现代化是全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程”。③二十大报告指出：“中国式现代化是物质文明和精神文明相协调的现代化”，因此，不能单纯的追求在物质文明方面超越西方发达国家。此项错误。④二十报告指出：中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色，并非遵循共同模式。⑤二十报告指出：“中国式现代化的本质要求是：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”因此，本题①②⑤三项是正确的。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-002","paperId":"gk2023-xz","num":2,"year":2023,"region":"国家","module":"常识判断","sub":"政治","stem":"党的二十大报告指出，要发展全过程人民民主，保障人民当家作主。关于人民民主，下列表述正确的是： ①人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义 ②全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主 ③协商民主是实践全过程人民民主的重要形式 ④党内民主是全过程人民民主的重要体现","options":["①②④","①②③","②③④","①③④"],"answer":"B","explanation":"【格木解析】①②正确：二十大报告原文：“……人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。” ③正确：二十大报告指出“协商民主是实践全过程人民民主的重要形式。完善协商民主体系，统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商，健全各种制度化协商平台，推进协商民主广泛多层制度化发展。” ④错误，基层民主是全过程人民民主的重要体现。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-003","paperId":"gk2023-xz","num":3,"year":2023,"region":"国家","module":"常识判断","sub":"政治","stem":"党的二十大报告指出，要增进民生福祉，提高人民生活品质。下列有关表述正确的是：","options":["人民健康是最基本的民生","就业是人民生活的安全网和社会运行的稳定器","分配制度是促进共同富裕的基础性制度","健全的社会保障体系是民族昌盛和国家强盛的重要标志"],"answer":"C","explanation":"【格木解析】A 选项错误：就业是最基本的民生。B 选项错误：社会保障是人民生活的安全网和社会运行的稳定器。D 选项错误：人民健康是民族昌盛和国家强盛的重要标志","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-004","paperId":"gk2023-xz","num":4,"year":2023,"region":"国家","module":"常识判断","sub":"人文历史","stem":"党的二十大报告指出，新时代十年来“党和国家事业取得历史性成就、发生历史性变革”。关于新时代十年来取得的历史性成就，下列表述错误的是：","options":["全社会研发经费支出跃居世界第一","谷物总产量稳居世界首位","制造业规模、外汇储备稳居世界第一","建成世界最大的高速铁路网"],"answer":"A","explanation":"【格木解析】A 选项错误：全社会研发经费支出跃居世界第二。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-005","paperId":"gk2023-xz","num":5,"year":2023,"region":"国家","module":"常识判断","sub":"人文历史","stem":"中共中央、国务院印发了《黄河流域生态保护和高质量发展规划纲要》。根据该纲要，下列表述错误的是：","options":["到2035年黄河流域生态保护和高质量发展取得重大战略成果","河湟—藏羌文化区是农耕文化与游牧文化交汇相融的过渡地带","支持青海、甘肃等风能、太阳能丰富地区构建风光水多能互补系统","水土保持区以内蒙古高原南缘、宁夏中部等为主"],"answer":"D","explanation":"【格木解析】根据《黄河流域生态保护和高质量发展规划纲要》，构建黄河流域生态保护“一带五区多点” 空间布局。“一带”，是指以黄河干流和主要河湖为骨架，连通青藏高原、黄土高原、北方防沙带和黄河口海岸带的沿黄河生态带。“五区”，是指以三江源、秦岭、祁连山、六盘山、若尔盖等重点生态功能区为主的水源涵养区，以内蒙古高原南缘、宁夏中部等为主的荒漠化防治区，以青海东部、陇中陇东、陕北、晋西北、宁夏南部黄土高原为主的水土保持区，以渭河、汾河、涑水河、乌梁素海为主的重点河湖水污染防治区，以黄河三角洲湿地为主的河口生态保护区。“多点”，是指藏羚羊、雪豹、野牦牛、土著鱼类、鸟类等重要野生动物栖息地和珍稀植物分布区。根据该报告，水土保持区为青海东部、陇中陇东、陕北、晋西北、宁夏南部黄土高原为主，因此D 选项错误。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-006","paperId":"gk2023-xz","num":6,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"下列与金融活动相关的说法错误的是：","options":["开展储蓄业务有助于实现货币购买力和商品供应量的平衡","分红型商业保险的收益与保险公司的经营状况有关","办理国家助学贷款的学生不需要办理贷款担保或抵押","有价证券的债务人可以请求债权人支付相应对价"],"answer":"D","explanation":"【格木解析】 A 选项正确：国家通过开展储蓄业务，可以把市场上多余的一部分纸币采用信用回笼的方式吸收过来，可以有效地减少需求压力，使货币购买力和商品供应量平衡保持物价稳定。B 选项正确：分红型商业保险是一种基于保险合同的投资方式，保险公司会将保费分为两部分，一部分用于保障客户的风险保障，另一部分则用于投资运营。保险公司在投资运营时，若获得了收益，则会将其按照一定比例分配给购买该保险的客户，即为“分红”。分红型商业保险的特点是可以提供风险保障的同时，也能够享受长期的投资回报。因此，分红型商业保险收益与经营状况有关。C 选项正确：国家助学贷款是信用贷款，学生不需要办理贷款担保或抵押，但需要承诺按期还款，并承担相关法律责任。D 选项错误：有价证券是指可以在证券市场上买卖的证券，其价值可以随着市场供求变化而变化。有价证券包括股票、债券、国债、期货、期权等。基本上来说，有价证券的债务人是不可以向债权人请求支付相应对价的。因为有价证券的本质是一种交易合约，当债券发行人按合同约定向债券持有人支付本息收益后，债券持有人已经得到了相应的对价。如果债券发行人想要向债券持有人请求支付相应对价，相当于改变了原先的合约协议。除非在债券合约中明确规定了相应对价的情况下，债券发行人才有权请求支付相应对价。但这种情况非常罕见。","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-007","paperId":"gk2023-xz","num":7,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国乡村振兴促进法》，下列说法正确的是：","options":["全面实施乡村振兴战略，应当坚持乡村城镇融合、城镇优先发展带动乡村原则","国家构建以高质量绿色发展为导向的新型农业补贴政策体系","省、自治区、直辖市人民政府应当采取措施确保耕地总量稳步增加","乡镇人民政府应设立法律顾问和公职律师，根据需要在村民委员会建立公共法律服务工作室"],"answer":"B","explanation":"【格木解析】A 选项错误：全面实施乡村振兴战略，应当坚持农业农村优先发展，而不是城镇优先发展带动乡村发展。C 选项错误：省、自治区、直辖市人民政府应当采取措施确保耕地总量不减少、质量有提高，而非确保耕地总量稳步增加。D 选项错误：鼓励乡镇人民政府根据需要设立法律顾问和公职律师，鼓励有条件的地方在村民委员会建立公共法律服务工作室。乡镇政府设立法律顾问和公职律师非强制性要求。B 选项正确：根据《中华人民共和国乡村振兴促进法》第六十条规定：“国家按照增加总量、优化存量、提高效能的原则，构建以高质量绿色发展为导向的新型农业补贴政策体系。”","material":"","source":"2023年国家公务员考试《行测》真题（行政执法类）"},{"id":"gk2023-xz-008","paperId":"gk2023-xz","num":8,"year":2023,"region":"国家","module":"常识判断","sub":"法律","stem":"根据《中华人民共和国退役军人保障法》，下列说法正确的是：","options":["退役的军士和义务兵可以逐月领取退役金","已被大学录取的现役军人可以在退伍后四年内入学","退役军人创办企业可以享受免税、贷款免息等优惠政策","参战退役军人的随迁子女入学可以得到优先保障"],"answer":"D","explanation":"【格木解析】A 选项错误：根据《中华人民共和国退役军人保障法》第二十一条第一款规定：“对退役的军官，国家采取退休、转业、逐月领取退役金、复员等方式妥善安置。”第二十二条第一款规定：“对退役的军士，国家采取逐月领取退役金、自主就业、安排工作、退休、供养等方式妥善安置。”第二十三条第一款规定：“对退役的义务兵，国家采取自主就业、安排工作、供养等方式妥善安置。”因此，退役的军官与军士可适用逐月领取退役金的安置方式，对于退役的义务兵并未规定可适用逐月领取退役金的安置方式。 B 选项错误：根据《中华人民共和国退役军人保障法》第三十五条规定：“现役军人入伍前已被普通高等学校录取或者是正在普通高等学校就学的学生，服现役期间保留入学资格或者学籍，退役后两年内允许入学或者复学，可以
