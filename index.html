动集合各高校、科研机构和企业优势研究力量的“类脑计算”研究项目，与论点讨论的“大脑奥秘和发明类脑计算机之间的关系”无关，论题不一致，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-085","paperId":"jx2020","num":85,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"心理学家考察了450 位中年男性和女性，他们中有白领阶层，也有蓝领阶层；有技能判断型人群，也有决策制定型人群。结果发现，那些身居重要职位的高管人士普遍比一般员工更胖。研究者认为，做出许多决定所承受的压力通过饮食方式得到排解，这最终在一定程度上改变了高管人士之前的饮食习惯，如果你的职位幸运地得到晋升，你将发现不仅是薪水变多，自己的腰围也在变粗，伴随着体重上升。以下哪项如果为真，最能质疑上述结论？","options":["比较而言，技能判断型人群腰围较小，决策制定型人群腰围较大","比较而言，身居要职的高管人士更难抽出时间投入锻炼以缩小腰围","每晋升一个工作等级，技能判断型人群的腰围平均会减少0.5 厘米","每晋升一个工作等级，决策制定型人群的腰围平均会增大0.28 厘米"],"answer":"B","explanation":"正确答案：B，全站正确率：42%，易错项：C。解析第一步，确定题型。根据提问方式中的“质疑”，确定为削弱论证。第二步，找论点和论据。论点：那些身居重要职位的高管人士普遍比一般员工更胖。论据：作出许多决定所承受的压力通过饮食方式得到排解，这最终在一定程度上改变了高管人士之前的饮食习惯。第三步，辨析选项。 A 项：无关选项。该项比较的是“技能判断型人群”和“决策制定型人群”腰围的大小，而论点讨论的是“身居重要职位的高管人士”和“一般员工”腰围的大小，论题不一致，排除。 B 项：否定论据。该项指出身居重要职位的高管人士之所以更胖，是因为更难抽出时间锻炼，而不是因为饮食习惯的改变，具有削弱作用。 C 项：增加论据。该项以“技能判断型人群”为例，说明晋升一个工作等级，腰围会变小，但是“技能判断型人群”并不是需要做出“决策”的人群，经过和“决策制定型人群”比较，说明做出决定会让人有压力，具有加强作用。 D 项：增加论据。该项以“决策制定型人群”为例，说明晋升一个工作等级，腰围会变大，具有加强作用。因此，选择B 选项。拓展参考原文《科学家终于揭开：为什么当官后腰围变大！》","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-086","paperId":"jx2020","num":86,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"地球表面的大部分都被海洋覆盖，生命也诞生于海洋之中。然而，据估计，地球有80%的物种生活在陆地上，而海洋中仅为15%, 剩下的5%生活在淡水中。研究者认为，陆地栖息地的物理布局相对海洋可能更加支离破碎，是导致陆地物种更加多样化的主要原因之一。以下哪项如果为真，最能加强上述研究者的观点？","options":["地球表面可分成热带、南温带、北温带、南寒带、北寒带五个温度带，各温度带物种差异性大，种类丰富","深海相对于有阳光照射的浅海岸地区而言，基本上像个冰箱，而且门已经关上很久，物种远不如浅海丰富","根据某群岛记录显示，随着时间推移，自然选择甚至可以把两个岛屿上相同物种的不同族群变成截然不同的物种","森林覆盖许多陆地，而树叶和枝干形成新的生态环境，海洋中的珊瑚也起同样作用，但覆盖海底的面积没那么大"],"answer":"C","explanation":"正确答案：C，全站正确率：37%，易错项：A。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 26 - 第一步，确定题型。根据提问方式中的“加强”，确定为加强论证。第二步，找论点和论据。论点：陆地栖息地的物理布局相对海洋可能更加支离破碎，是导致陆地生物更加多样化的主要原因之一。论据：据估计，地球有80%的物种生活在陆地上，而海洋中仅为15%。第三步，辨析选项。 A 项：不明确项。地球表面有不同的温度带，各温度带均有海洋环境和陆地环境，故该项讨论的“物种差异大” 并非专指陆地，不具有加强作用。 B 项：无关选项。深海与浅海岸地区的差异是光照照射程度不一致，光照程度不一致使得物种多样，但不涉及陆地与海洋物理布局比较，论题不一致，排除。 C 项：增加论据。该项通过举例的方式指出“自然选择”使得群岛上物种更丰富，说明陆地上生物更丰富，具有加强作用。 D 项：无关选项。该项只是比较陆地森林覆盖的面积比珊瑚覆盖海底的面积大，并未提及生物多样性，论题不一致，排除。因此，选择C 选项。拓展参考原文《海洋更大为何造出的生物不如陆地上更多更精彩？》关于“为何陆地更精彩”，最终作者的观点如下：说明理由是不确定的，作者在文章中给出了多个理由，其中一个理由就是题干中的论点：由原文的行文脉络可以看出，C 项就是对论点的举例论证；而D 选项，在文章中，更多是解释之前提到的“海洋没有温度极限”，而不是在解释题干中的论点，故排除。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-087","paperId":"jx2020","num":87,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"一项最新研究发现，世界上的绿海龟越来越“雌性化”。专家估计，到2100 年，约有93%的新生绿海龟为磁性。研究表明，决定绿海龟性别的主要因素是海龟孵化时周围沙子的温度。如果沙子的温度在28 到30 度之间，孵化出来的绿海龟雌雄比例差不多；如果温度高出这个范围，那孵化出来的绿海龟大多数是雌性，相反，则大多数为雄性。以下哪项如果为真，最能支持上述论断？","options":["绿海龟终将无法正常繁殖最后在地球上灭绝","绿海龟是一种由孵化时温度决定性别的动物","温室效应将导致全球气候变暖问题日趋严重","温度的持续升高使绿海龟孵化的死亡率增加"],"answer":"B","explanation":"正确答案：B，全站正确率：76%，易错项：C。解析第一步，确定题型。根据提问方式中的“支持”，确定为加强论证。第二步，找论点和论据。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 27 - 论点：一项最新研究发现，世界上的绿海龟越来越“雌性化”。专家估计，到2100 年，约有93%的新生绿海龟为雌性。论据：研究表明，决定绿海龟性别的主要因素是海龟孵化时周围沙子的温度。如果沙子的温度在28 到30 度之间，孵化出来的绿海龟雌雄比例差不多；如果温度高出这个范围，那孵化出来的绿海龟大多数是雌性，相反，则大多数为雄性。第三步，辨析选项。 A 项：无关选项。该项讨论的是绿海龟是否会灭绝的问题，与论点是否越来越雌性化无关，论题不一致，排除。 B 项：建立联系。该项指出性别是由孵化时温度决定的，建立了论据和论点之间的关联，具有加强作用。 C 项：不明确项。温室效应会导致全球气候变暖问题日趋严重，但是否会严重到高出30 度并不确定，不具有加强作用。 D 项：无关选项。该项讨论的是温度和死亡率的关系，与绿海龟是否越来越雌性化无关，论题不一致，排除。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-088","paperId":"jx2020","num":88,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"学界一直认为第一个到达澳大利亚的是欧洲人。但有研究指出，来自今天的坦桑尼亚的东非人率先到达了澳大利亚。考古学家在澳大利亚的埃尔科岛上发现了一枚来自非洲中部的贸易城市基卢瓦（今属坦桑尼亚）的硬币。因此，有人提出，东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年。以下各项如果为真，最能支持上述观点的是：","options":["该硬币的重量尺寸与常见的基卢瓦硬币存在差异","基卢瓦岛从13 世纪开始与印度一直存在贸易联系","东非与大洋洲在11 世纪到16 世纪间商贸往来十分频繁","葡萄牙人于1505 年先后袭击了基卢瓦和埃尔科岛并留下这枚硬币"],"answer":"C","explanation":"正确答案：C，全站正确率：69%，易错项：B。解析第一步，确定题型。根据提问方式中的“支持”，确定为加强论证。第二步，找论点和论据。论点：东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年。论据：来自今天的坦桑尼亚的东非人率先到达了澳大利亚。考古学家在澳大利亚的埃尔科岛上发现了一枚来自非洲中部的贸易城市基卢卡（今属坦桑尼亚）的硬币。第三步，辨析选项。 A 项：不明确项。该项讨论的是“该硬币的重量尺寸与常见的基瓦卡硬币存在差异”，与论点讨论的”东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年”无关，论题不一致，排除。 B 项：无关选项。该项讨论的是“基卢瓦岛从13 世纪开始与印度一直存在贸易联系”，与论点讨论的”东非人到达澳大利亚的时间可能要比第一批欧洲探险者早数百年”无关，论题不一致，排除。 C 项：加强论据。该项讨论的是“东非与大洋洲在11 世纪到16 世纪间商贸往来十分频繁”，澳大利亚属于大洋洲，也就说明因为两地来往频繁，那么在澳大利亚的埃尔科岛发现了一枚非洲中部的贸易城市基卢卡（今属坦桑尼亚）的硬币能够说明东非人率先到达了澳大利亚，具有加强作用。 D 项：增加反向论据。该项讨论的是这枚硬币是由葡萄牙人留下的这枚硬币，不是东非人留下的，也就无法说明东非人到达澳大利亚的时间可能比第一批欧洲探险者早，具有削弱作用。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-089","paperId":"jx2020","num":89,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"一项心理学研究认为，出身经济层次最低家庭的人中年后出现代谢综合征的比例最高，无论他们获得多大成就都是如此。该研究同时发现代谢综合征虽与童年生活状况有关，但该群体中那些拥有慈母的人不容易出现该综合征。究其原因，慈母具有同情心，会告诉孩子如何应对压力并鼓励他们健康饮食，保持良好生活方式。因此，我们在现实中可以设计一套方案，指导母亲教育孩子如何应对压力、健康生活和掌控命运。由此可以推出：","options":["设计针对母亲的指导方案，有助于降低特定群体出现代谢综合征的比例","因为缺少母爱，出身经济层次最低家庭的人出现代谢综合征的比例最高","因为父亲不教导孩子保持良好生活方式，所以父亲对孩子的健康没影响 - 13 -","出身经济层次最低家庭的人，童年如受到慈母呵护，中年后身体很健康"],"answer":"A","explanation":"正确答案：A，全站正确率：71%，易错项：B。解析第一步，确定题型。依据题干特征和提问方式，确定为归纳推理。第二步，辨析选项。 A 项：根据题干可知拥有慈母的人不容易出现该综合征，慈母可以教育孩子如何应对压力、健康生活和掌控命运，故设计针对母亲的指导方案，有助于降低得该综合症的比例，可以推出； B 项：题干不涉及患该综合症的原因分析，虽然可以从题干中知拥有慈母的人不容易出现该综合征，但是反过来患该综合征是否是因为缺乏母爱，无法推出，排除； C 项：题干不涉及父亲对孩子的生活影响的论述，所以父亲是否指导孩子保持良好的生活方式推不出，且该项中说父亲对孩子的健康无影响，太过绝对，无法推出，排除； D 项：据题干可知出身经济层次最低家庭的人，如果拥有慈母不容易出现该综合症，但这一群人中年后身体是否健康，与题干话题不一致，无法推出，排除。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-090","paperId":"jx2020","num":90,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"肌萎缩侧索硬化症（ALS），俗称“渐冻症”。某科研团队研究发现，ALS 的疾病发展与肠道微生物AM 菌的数量密切相关。研究人员观察和比较了37 名ALS 患者及29 名健康亲属的肠道菌群和血液、脑脊液样本。他们发现肠道细菌菌株有差异，其中有一种菌株与烟酰胺的产生有关。此外，在这些ALS 患者的血液和脑脊液中，烟酰胺水平有所下降。若要上述研究发现成立，需要补充的前提是：","options":["人类肠道中的微生物非常复杂","烟酰胺是肠道微生物AM 菌的代谢物","小鼠补充烟酸胺后，ALS 症状得到了减轻","人体肠道细菌的变化与ALS 的疾病发展速度有关"],"answer":"B","explanation":"正确答案：B，全站正确率：74%，易错项：C。解析第一步，确定题型。根据提问方式中的“前提”，确定为加强论证。第二步，找论点和论据。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 28 - 论点：ALS 的疾病发展与肠道微生物AM 菌的数量密切相关。论据：ALS 患者的血液和脑脊髓液中，烟酰胺水平有所下降。第三步，辨析选项。 A 项：不明确项。肠道中的微生物复杂，并未直接说明与ALS 疾病或烟酰胺水平的关系，不属于前提。 B 项：补充前提。若补充烟酰胺是肠道微生物AM 菌的代谢物，加之论据提及患者烟酰胺水平下降，则可以得出 ALS 疾病发展与AM 菌密切相关，该项为论证成立的必要条件，属于前提。 C 项：增加论据。通过举例说明小鼠补充烟酰胺后，ALS 症状减轻，表明二者之间确实存在关联，具有加强作用。 D 项：无关选项。该题论题为ALS 疾病发展与谁有关，而非肠道细菌的变化与谁有关，论题不一致，排除。第四步，强弱比较。 C 项是通过举例的方式加强论点，但并不是论证成立的必要条件，而B 属于前提。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-091","paperId":"jx2020","num":91,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"鲜花∶塑料花","options":["纸质书∶电子书","相片∶画像","原本∶复印本","钤章∶印泥"],"answer":"C","explanation":"正确答案：C，全站正确率：26%，易错项：A。解析第一步，确定题干逻辑关系。 “鲜花”和“塑料花”属于并列关系，“塑料花”是根据“鲜花”制作的。第二步，辨析选项。 A 项：“纸质书”与“电子书”是不同的书籍形式，二者属于并列关系，前者是传统的书籍形式，后者是现代的书籍形式，排除； B 项：“相片”和“画像”属于并列关系，“相片“是摄影得出来的图像，“画像”是画成的肖像，排除； C 项：“原本”和“复印本”属于并列关系，且“复印本”是根据“原本”复制的，与题干逻辑关系一致，符合； D 项：“钤章”和“印泥”属于配套使用的对应关系，排除。因此，选择C 选项。拓展钤章旧时机关团体使用的图章，多为长形，不及印或关防郑重。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-092","paperId":"jx2020","num":92,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"鸳∶鸯","options":["蚱蜢∶蝗虫","白猫∶黑猫","雄鸡∶雌鸡","红男∶绿女"],"answer":"C","explanation":"正确答案：C，全站正确率：85%，易错项：D。解析第一步，确定题干逻辑关系。 “鸳”和“鸯”都是动物，二者属于并列关系中的矛盾关系，“鸳”指雄鸟，“鸯”指雌鸟，体现了一雄一雌。第二步，辨析选项。 A 项：“蚱蜢”和“蝗虫”都是昆虫，二者属于并列关系中的反对关系，且没有体现一雄一雌，排除； B 项：“白猫”和“黑猫”属于并列关系中的反对关系，且没有体现一雄一雌，排除； C 项：“雄鸡”和“雌鸡”都是动物，二者属于并列关系中的矛盾关系，且体现一雄一雌，与题干逻辑关系一致，符合； D 项：“红男绿女”指穿着各种漂亮服装的青年男女，“红男”和“绿女”属于并列关系中的反对改关系，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-093","paperId":"jx2020","num":93,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"售后∶品控","options":["数据∶科学","融资∶风投","龙骨∶地板","听证∶监管"],"answer":"D","explanation":"正确答案：D，全站正确率：54%，易错项：B。解析第一步，确定题干逻辑关系。 “品控”指的是一个从原料把控、生产加工、产品制成、成品检测到成品入库、以及“售后”质量的跟踪解决等全过程，“售后”是整个“品控”中的一个环节，二者属于包容关系中的组成关系。第二步，辨析选项。 A 项：“科学”是认识世界的方式，它是对大众可理解的“数据”等的一种总结、归纳和认证，二者属于对应关系，排除； B 项：“风投”是指向初创企业提供资金支持并取得该公司股份的一种“融资”方式，二者属于对应关系，排除； C 项：铺装实木“地板”，需要安装“龙骨”使其不易变形，二者属于对应关系，排除； D 项：“听证”是听取利害关系人意见的重要法律程序，是“监管”中的一个环节，二者属于包容关系中的组成关系，与题干逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-094","paperId":"jx2020","num":94,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"牵牛花∶喇叭花","options":["乞巧节∶七夕节","七巧板∶橡皮泥","人行道∶车行道","防腐剂∶添加剂"],"answer":"A","explanation":"正确答案：A，全站正确率：81%，易错项：C。解析获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 29 - 第一步，确定题干逻辑关系。 “牵牛花”和“喇叭花”属于全同关系。第二步，辨析选项。 A 项：“乞巧节”与“七夕节”属于全同关系，与题干逻辑关系一致，符合； B 项：“七巧板”与“橡皮泥”无明显逻辑关系，排除； C 项：“人行道”与“车行道”属于并列关系，排除； D 项：“防腐剂”是能抑制微生物活动，防止食品腐败变质的一类食品“添加剂”，二者属于包含关系中的种属关系，排除。因此，选择A 选项。拓展牵牛花属旋花科牵牛属，一年生缠绕草本，这一种植物的花酷似喇叭状，因此有些地方叫它做喇叭花。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-095","paperId":"jx2020","num":95,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"牡丹∶洛阳∶郑州","options":["荷花∶青岛∶济南","木芙蓉∶成都∶成都","菊花∶太原∶石家庄","凤凰花∶厦门∶福州"],"answer":"C","explanation":"正确答案：C，全站正确率：15%，易错项：D。解析第一步，确定题干逻辑关系。 “牡丹花”是“洛阳”市的市花，二者属于对应关系，“洛阳”与“郑州”属于并列关系。第二步，辨析选项。 A 项：“荷花”不是“青岛”的市花，排除； B 项：“木芙蓉”是“成都”的市花，二者属于对应关系，但“成都”与“成都”属于全同关系，排除； C 项：“菊花”是“太原”的市花，二者属于对应关系，“太原”与“石家庄”属于并列关系，与题干逻辑关系一致，符合； D 项：“凤凰花”不是“厦门”的市花，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-096","paperId":"jx2020","num":96,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"羊∶羊奶∶腥膻","options":["蚕∶蚕丝∶雪白","蜘蛛∶蛛丝∶粘缚","蜂∶蜂蜜∶甘甜","雨燕∶燕窝∶营养"],"answer":"C","explanation":"正确答案：C，全站正确率：83%，易错项：A。解析第一步，确定题干逻辑关系。 “羊”产出“羊奶”，二者属于对应关系，“羊奶”作为食物具有“腥膻”的味道，二者属于属性关系。第二步，辨析选项。 A 项：“蚕”产出“蚕丝”，二者属于对应关系，“蚕丝”具有“雪白”的特点，二者属于属性关系，但“雪白” 不是味道，排除； B 项：“蜘蛛”制造“蛛丝”，二者属于对应关系，“蜘蛛”通过“粘缚”捕捉猎物，二者属于对应关系，排除； C 项：“蜂”产出“蜂蜜”，二者属于对应关系，“蜂蜜”作为食物具有“甘甜”的味道，二者属于属性关系，与题干逻辑关系一致，符合； D 项：“雨燕”产出“燕窝”，二者属于对应关系，“燕窝”具有“营养”价值，二者属于对应关系，排除。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-097","paperId":"jx2020","num":97,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"十年寒窗∶悬梁刺股∶囊萤映雪","options":["七月流火∶以荻画地∶临池学书","三月肉味∶蓝田种玉∶程门立雪","一寸光阴∶凿壁偷光∶闻鸡起舞","一日三秋∶卧薪尝胆∶铁杆磨针"],"answer":"C","explanation":"正确答案：C，全站正确率：68%，易错项：D。解析第一步，确定题干逻辑关系。 “十年寒窗”“悬梁刺股”与“囊萤映雪”均形容刻苦读书，三者属于近义关系。第二步，辨析选项。 A 项：“七月流火”指夏去秋来，天气转凉，现也用来形容天气炎热；“以荻画地”指用芦苇秆在沙地上写画； “临池学书”指刻苦练习书法，三者无明显语义关系，排除。 B 项：“三月肉味”出自《论语》，原句“三月不知肉味”，指三个月之内吃肉不觉得有味道，比喻集中注意力于某一事物而忘记了其它事情；“蓝田种玉”旧时比喻缔结姻缘；“程门立雪”形容尊师重道，恭敬受教，三者无明显语义关系，排除。 C 项：“一寸光阴”出自俗语“一寸光阴一寸金”，比喻时间十分宝贵；“凿壁偷光”形容家贫而读书刻苦学习； “闻鸡起舞”原意为听到鸡啼就起来舞剑，后来比喻有志报国的人即时奋起，三者都形容珍惜时光刻苦奋进，属于近义关系，与题干逻辑关系一致，符合。 D 项：“一日三秋”比喻分别时间虽短，却觉得很长，形容思念殷切；“卧薪尝胆”形容一个人忍辱负重，发愤图强；“铁杵磨针”比喻只要有决心，肯下工夫，多难的事情也能做成功，三者之间无明显语义关系，排除。因此，选择C 选项。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 30 -","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-098","paperId":"jx2020","num":98,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"花∶牡丹∶玫瑰","options":["茶∶红茶∶绿茶","草∶艾草∶蓼草","球∶足球∶绒球","车∶轿车∶客车"],"answer":"B","explanation":"正确答案：B，全站正确率：37%，易错项：A。解析第一步，确定题干逻辑关系。 “牡丹”和“玫瑰”都是“花”，前二者属于并列关系，与“花”属于包容关系中的种属关系，且“牡丹”和“玫瑰”是两种具体的“花”。第二步，辨析选项。 A 项：“红茶”和“绿茶”都是“茶”，前二者属于并列关系，与“茶”属于包容关系中的种属关系，但“红茶” 与“绿茶”分别是茶叶的品类，而不是具体的一种“茶”，排除； B 项：“艾草”和“蓼草”都是“草”，前二者属于并列关系，与“花”属于包容关系中的种属关系，且“艾草” 和“蓼草”是两种具体的“草”，与题干逻辑关系一致，符合； C 项：“足球”是一种运动器械，“绒球”一指用彩色毛线或绒线扎成的球，二指是小脑外侧的球状结构，都与 “足球”不属于并列关系，排除； D 项：“轿车”和“客车”都属于汽“车”，前二者属于并列关系，与“车”属于包容关系中的种属关系，但“轿车”和“客车”是两类“车”，排除。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-099","paperId":"jx2020","num":99,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"了如指掌对于（）相当于（）对于坚固","options":["知道；铁板一块","明白；坚不可摧","理解；铜墙铁壁","了解；固若金汤"],"answer":"D","explanation":"正确答案：D，全站正确率：78%，易错项：B。解析分别将选项代入题干，确定逻辑关系。 A 项：“了如指掌”形容对情况非常清楚，像指着自己的手掌给别人看，与“知道”无明显逻辑关系，“铁板一块”比喻结合紧密，不可分割，与“坚固”无明显逻辑关系，排除； B 项：“了如指掌”与“明白”无明显逻辑关系，“坚不可摧”形容非常“坚固”，二者属于近义关系，前后逻辑关系不一致，排除； C 项：“了如指掌”与“理解”无明显逻辑关系，“铜墙铁壁”比喻防御十分“坚固”，不可摧毁，二者属于近义关系，前后逻辑关系不一致，排除； D 项：“了如指掌”与“了解”属于近义关系，“固若金汤”形容城池和阵地非常“坚固”，二者属于近义关系，前后逻辑关系一致，符合。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-100","paperId":"jx2020","num":100,"year":2020,"region":"江西","module":"判断推理","sub":"逻辑判断","stem":"（）对于世味年来薄似纱相当于达观对于（）","options":["忧郁；前度刘郎今又来","感伤；莫道谗言如浪深","讽刺；道是无晴却有晴","斥责；金陵王气黯然收"],"answer":"B","explanation":"正确答案：B，全站正确率：42%，易错项：C。解析分别将选项代入题干，确定逻辑关系。 A 项：“世味年来薄似纱”，作者用此句感叹世态人情薄得就像半透明的纱，与“忧郁”无明显逻辑关系；“前度刘郎今又来”，作者借此句向打击他的权贵挑战，表示决不因为屡遭报复就屈服妥协，与“达观”无明显逻辑关系，排除。 B 项：“世味年来薄似纱”表达了“感伤”之情，二者属于对应关系；“莫道谗言如浪深”意思是不要说流言蜚语如同凶恶的浪涛，表现了作者“达观”的心理，二者属于对应关系，前后逻辑关系一致，符合。 C 项：“世味年来薄似纱”与“讽刺”无明显逻辑关系；“道是无晴却有晴”描述青年男女的感情，暗指对对方感情不确定的感觉，与“达观”无明显逻辑关系，排除。 D 项：“世味年来薄似纱”与“斥责”无明显逻辑关系；“金陵王气黯然收”意思是显赫无比的金陵王气黯然失色，与“达观”无明显逻辑关系，排除。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-101","paperId":"jx2020","num":101,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"疼痛共情的偏好性，是指个体对他人疼痛的感知、判断和情绪反应，总是由于个体与他人之间的亲疏远近关系或情感认同程度不同而不同。根据上述定义，下列没有体观疼痛共情的偏好性的是：","options":["小明看到《西游记》里的白骨精被孙悟空打死，高兴得跳了起来","小张看到外来游客不幸溺水而死，从此再也不敢去那条河里游泳","小李在看歌剧《白毛女》时跳上戏台拉住喜儿，不让黄世仁抢走","小红听奶奶回忆自己在旧社会的苦日子时，禁不住潸然泪下"],"answer":"B","explanation":"正确答案：B，全站正确率：65%，易错项：A。解析第一步，根据提问方式，确定为选非题。第二步，找关键信息。 ①个体对他人疼痛的感知、判断和情绪反应； ②由于个体与他人之间的亲疏远近关系或情感认同程度不同。第三步，辨析选项。 A 项：小明看到白骨精被打死而感到高兴，是因为他不喜欢书中白骨精这一角色，体现了对白骨精“情感认同程度”较低，符合“个体对他人疼痛的情绪反应”，符合定义； B 项：小张看到有人溺水而死，之后不敢再去这条河，没有涉及对溺水游客的“疼痛的感知、判断和情绪反应”，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 31 - 不符合定义； C 项：小李上台拉住雪儿，是因为对雪儿的遭遇感同身受，体现了对雪儿“情感认同程度”较高，符合“个体对他人疼痛的情绪反应”，符合定义； D 项：小红听了奶奶的回忆后潸然泪下，是因为对奶奶的遭遇感同身受，体现了对奶奶“情感认同程度”较高，符合“个体对他人疼痛的情绪反应”，符合定义。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-102","paperId":"jx2020","num":102,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"印象管理是指人试图控制他人对自己形成的印象的过程。一个人留给他人的印象表明了他人对其的知觉、评价，甚至会使他人形成对其的特定应对方式。因而，为了给他人留下好的印象，得到他人好的评价与对待，人会用一种给他人造成特定印象的方式来自我表现。印象管理的运用，尤其要避免某些表演崩溃，包括无意动作、不合时宜的闯入、闹剧等。根据上述定义，下列选项体现印象管理运用的是：","options":["沙子龙在夜静人稀时，关好门，舞出一套断魂枪，微微一笑说：“不传不传”","许衡看到人们摘食路边的梨解渴，不为所动，说：“梨虽无主，而吾心有主”","一向沉静温柔的小美在毕业之际，承受不住与同学离别的感伤，突然嚎啕大哭 - 14 -","岳飞的母亲为了激励岳飞奋勇抗金，用针在其背上刺了四个字：“精忠报国”"],"answer":"B","explanation":"正确答案：B，全站正确率：69%，易错项：C。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。 ①人试图控制他人对自己形成的印象的过程； ②为了给他人留下好的印象，得到他人好的评价与对待。第三步，辨析选项。 A 项：沙子龙在夜静人稀时，关好门舞枪，周围没有人只有他自己，不涉及“给别人留下好的印象”，不符合定义； B 项：其他人都在随意地摘梨，许衡不为所动并说“梨子虽然没有主人，但我的心却是有主的”，折射出了他慎微慎独、己心不欺的可贵品质，给别人留下了能够恪守自己原则、坚守本心的“好印象”，符合定义； C 项：小美之前的形象是沉静温柔，毕业之际嚎啕大哭是因为不舍，不是“为了给他人留下好的印象”，相反打破了原来沉静温柔的形象，不符合定义； D 项：岳母刺字是为了激励岳飞奋勇抗金，不是“为了给他人留下好的印象”，不符合定义。因此，选择B 选项。拓展夜静人稀，沙子龙关好了小门，一气把六十四枪刺下来；而后，拄着枪，望着天上的群星，想起当年在野店荒林的威风。叹一口气，用手指慢慢摸着凉滑的枪身，又微微一笑，“不传!不传!”（老舍《断魂枪》）","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-103","paperId":"jx2020","num":103,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"热传导是介质内无宏观运动时的传热现象，其在固体、液体和气体中均可发生，但严格而言，只有在固体中才是纯粹的热传导，在流体（泛指液体和气体）中又是另外一种情况，流体即使处于静止状态，也会由于温度梯度所造成的密度差而产生自然对流，因此在流体中热对流与热传导可能会同时发生。根据上述定义，下列选项不存在热传导现象的是：","options":["海洋上层高温水体和下层低温水体因温度差而交换","铁棒的一端放入热水中，另一端温度升高","太阳照射，导致地球表面温度升高","在热水中加入冷水，热水变成温水"],"answer":"C","explanation":"正确答案：C，全站正确率：46%，易错项：A。解析第一步，根据提问方式，确定为选非题。第二步，找关键信息。 ①介质内无宏观运动时的传热现象，可发生在固体、液体和气体中； ②在固体中是纯粹的热传导； ③在流体中热对流与热传导可能同时发生。第三步，辨析选项。 A 项：海洋上层水体温度高，下层水体温度低，由于温度梯度可使流体的粒子从温度较高的地方移至温度较低的地方，发生热对流的同时发生热传导，符合定义； B 项：铁棒是固体，将其一端放入热水中，可使热从铁棒高温的一端传递到低温的一端，发生热传导，符合定义； C 项：太阳能通过辐射转移到地球，属于热辐射，没有涉及热传导，不符合定义； D 项：热水与冷水混合，由于温度高低的差异，可使流体的粒子从高温移到低温，发生热传导，符合定义。因此，选择C 选项。拓展热传递是物理学上的一个物理现象，是指由于温度差引起的热能传递现象。主要存在三种基本形式：热传导，热辐射，热对流。只要在物体内部存在或者物体间有温度差存在，热能就必然以上述三种方式中的一种或多种从高温到低温传递。热传导是固体传热的主要方式。在气体或液体等流体中，热的传导过程往往和对流同时发生。热传导是热能从高温向低温部分转移的过程。热对流又称对流传热，指流体中质点发生相对位移而引起的热量传递过程。是热量通过流体介质传递的过程。热辐射是一种不需要介质的传热方式。物体由于具有温度而辐射电磁波的现象，是在真空中唯一的传热方式。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-104","paperId":"jx2020","num":104,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"亲环境行为是指个体通过减少或消除自身活动对环境的负面影响以达到改善生态系统结构的行为。它的本质是通过有效减轻环境问题实现环境改善，核心任务是构造环境稳态友好型的社会。根据上述定义，下列选项属于亲环境行为的是：","options":["植树造林","低碳出行","细水长流","围海造田"],"answer":"B","explanation":"正确答案：B，全站正确率：94%，易错项：A。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 32 - ①减少或消除自身活动对环境的负面影响； ②改善生态系统结构的行为。第三步，辨析选项。 A 项：植树造林指新造或更新森林的生产活动，不符合“减少或消除自身活动对环境的负面影响”，不符合定义； B 项：低碳出行是采用减少二氧化碳排放量的交通方式，符合“减少或消除自身活动对环境的负面影响”，符合定义； C 项：细水长流比喻节约使用财物，使经常不缺用，也比喻一点一滴不间断地做某件事，精细安排，长远打算，也多指爱情或友情长长久久，不是一种具体的行为，不涉及“改善生态系统结构的行为”，不符合定义； D 项：围海造田是人类对海洋空间的利用，有可能侵占湿地甚至改变生态环境，不符合“减少或消除自身活动对环境的负面影响”，不符合定义。因此，选择B 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-105","paperId":"jx2020","num":105,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"算法歧视是以算法为手段实施的歧视，主要指在大数据背景下、依靠机器计算的自动决策系统在对数据主体做出决策分析时，由于数据和算法本身不具有中立性或者隐含错误、被人为操控等原因，对数据主体进行差别对待，造成歧视性后果。根据上述定义，下列属于算法歧视的是：","options":["某新生班主任根据学生的入学成绩高低来安排他们的学号","某水果商家总是对长期参与团购的客户给予更低价格折扣","某信用评估平台通过用户的网络使用行为来判定其信用值","某招聘网站给男性推送高薪职位的广告次数是女性的6 倍"],"answer":"D","explanation":"正确答案：D，全站正确率：65%，易错项：C。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。 ①在大数据背景下、依靠机器计算的自动决策系统； ②对数据主体进行差别对待，造成歧视性后果。第三步，辨析选项。 A 项：学生的入学成绩，未体现“在大数据背景下、依靠机器计算的自动决策系统”，不符合定义； B 项：长期参与团购，未体现“在大数据背景下、依靠机器计算的自动决策系统”，不符合定义； C 项：判定信用值，未体现“对数据主体进行差别对待，造成歧视性后果”，不符合定义； D 项：网站符合“在大数据背景下、依靠机器计算的自动决策系统”，给男性推送高薪职位的广告是女性的6 倍，体现“对数据主体进行差别对待，造成歧视性后果”，符合定义。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-106","paperId":"jx2020","num":106,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"积极强化是指用某种有吸引力的结果对某一行为进行奖励和肯定，以期在类似条件下重复这一行为。消极强化是指在行为出现时把不愉快的刺激撤销或减少，这样也可以增加行为频率。根据上述定义，下列选项属于积极强化的是：","options":["君子一日三省其身","杀鸡骇猴以儆效尤","重赏之下必有勇夫","从轻发落戴罪立功"],"answer":"C","explanation":"正确答案：C，全站正确率：89%，易错项：D。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“积极强化”，其关键信息为： ①对某一行为进行奖励和肯定； ②以期在类似条件下重复这一行为。第三步，辨析选项。 A 项：君子一日三省其身，意在强调反省，不符合“对某一行为进行奖励和肯定”，不符合定义； B 项：杀鸡骇猴以儆效尤，指用惩罚的办法来警告别的人，不符合“对某一行为进行奖励和肯定”，不符合定义； C 项：重赏之下，符合“对某一行为进行奖励和肯定”，必有勇夫，符合“以期在类似条件下重复这一行为”，符合定义； D 项：从轻发落戴罪立功，不符合“对某一行为进行奖励和肯定”，不符合定义。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-107","paperId":"jx2020","num":107,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"社会计算的内涵包括两个层面：一是社会的计算化，二是计算的社会化。社会的计算化是指通过人们在互联网上留下的海量而且相互关联的数据足迹，对人们的社会活动进行追踪、检索、汇编、计量和运算。计算的社会化则是指互联网创造了一种环境、一个平台，使人们能够广泛地参与计算过程，从而在数据的挖掘、分析和应用等方面获得更高效率。根据上述定义，下列现象符合计算的杜会化的是：","options":["某购物平台根据用户购物经历，定期向用户推荐商品","某手机导航软件能为用户自动生成一个月来的行踪图","全班同学在暑假田野调查结束后合作制成精美的相册","小陈在众筹平台匿名捐款后，受助者上门送来感谢信"],"answer":"D","explanation":"正确答案：D，全站正确率：24%，易错项：A。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“计算的社会化”，其关键信息为：（1）社会的计算化：①人们在互联网上留下的海量而且相互关联的数据足迹；②对人们的社会活动进行追踪、检索、汇编、计量和运算；（2）计算的社会化：①互联网创造了一种环境、一个平台；②人们能够广泛地参与计算过程；③在数据的发掘、分析和应用等方面获得更高效率。第三步，辨析选项。 A 项：用户在网购平台购物，符合“人们在互联网上留下的海量而且相互关联的数据足迹”，平台定期向用户推送产品，符合“互联网对人们的社会活动进行计算”，属于“社会的计算化”，但不涉及“人们能够广泛地参与获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 33 - 计算过程”，不符合“计算的社会化”定义； B 项：用户在导航软件的行程，符合“人们在互联网上留下的海量而且相互关联的数据足迹”，导航软件自动生成行踪图，符合“互联网对人们的社会活动进行计算”，属于“社会的计算化”，但不涉及“人们能够广泛地参与计算过程”，不符合“计算的社会化”定义； C 项：全班同学合作制成精美的相册并没有说明是否运用互联网，有可能制作的是实体相册，不符合“互联网创造了一种环境、一个平台”，不符合“计算的社会化”定义； D 项：众筹平台符合“互联网创造了一种环境、一个平台”，小陈在众筹平台匿名捐款后，受助者上门送来感谢信，说明受助者在互联网上主动参与了计算以及数据的发掘分析，找到了小陈的信息，符合“人们能够广泛地参与计算过程”，并且“在数据的发掘、分析和应用等方面获得更高效率”，符合“计算的社会化”定义。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-108","paperId":"jx2020","num":108,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"外部性是指经济当事人的生产和消费行为对其它经济当事人的生产和消费行为施加的有益或者有害影响的效应。正外部性是指某个经济行为个体的活动使他人或社会受益，而受益者无需花费代价。负外部性是指某个经济行为个体的活动使他人或社会受损，而造成负外部性的人却没有为此承担成本。根据上述定义，下列选项属于正外部性的是：","options":["经过农田的蒸汽机车，喷出火花飞到农民种植的麦穗上","飞速行驶的火车尖锐的汽笛声吓跑在农田吃稻谷的小鸟","某工厂在村庄建起了扶贫车间，为村民就近就业提供便利","某工厂排出了大量废水和有害气体，给周围居民带来健康危害"],"answer":"C","explanation":"正确答案：C，全站正确率：69%，易错项：B。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“正外部性”，其关键信息为： ①某个经济行为个体的活动使他人或社会受益； ②受益者无需花费代价。第三步，辨析选项。 A 项：蒸汽机车喷出火花飞到农民种植的麦穗上，会使农民受损失，不符合“某个经济行为个体的活动使他人或社会受益”，不符合定义； B 项：飞速行驶的火车尖锐的汽笛声，不属于“某个经济行为个体”，不符合定义； C 项：某工厂，符合“某个经济行为个体”，在村庄建起了扶贫车间，为村民就近就业提供方便，体现了“使他人或社会受益，而受益者无需花费代价”，符合定义； D 项：给周围居民带来健康危害，不符合“某个经济行为个体的活动使他人或社会受益”，不符合定义。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-109","paperId":"jx2020","num":109,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"错觉是完全不符合刺激本身特征的失真的或扭曲事实的知觉经验，生活中，凭知觉经验所作的解释显然是失真的，甚至是错误的。幻觉是在没有相应的外界客观事物直接作用下发生的不真实感知。幻觉具有与真实知觉类似的特点，但它是虚幻的。正常人在某些特殊的状态下，如强烈的情绪体验并伴有生动的想象、回忆，或期待的心情、紧张的情绪，或处于催眠状态，都可能会出现幻觉。在入眠或醒觉状态的过程中，也会发生幻觉。根据上述定义，下列属于幻觉的是： - 15 -","options":["杯弓有蛇影，草木疑皆兵","相看两不厌，唯有敬亭山","寝兴目存形，遗音犹在耳","蝉噪林逾静，鸟鸣山更幽"],"answer":"C","explanation":"正确答案：C，全站正确率：57%，易错项：A。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“幻觉”，其关键信息为： ①没有相应的外界客观事物直接作用下发生的不真实感知； ②虚幻的； ③正常人在某些特殊的状态下，如强烈的情绪体验并伴有生动的想象、回忆，或期待的心情、紧张的情绪，或处于催眠状态，都可能会出现幻觉。第三步，辨析选项。 A 项：意思是：将映在酒杯里的弓影误认为蛇，周边的草木也认为是敌方的兵，极度恐慌疑神疑鬼。弓、草木是外界客观事物，不符合“没有相应的外界客观事物直接作用”，不符合定义。 B 项：意思是：诗人与敬亭山相看而不厌，视敬亭山为人生知己，达到物我和谐、物我相忘的境界。敬亭山是外界客观事物，不符合“没有相应的外界客观事物直接作用”，不符合定义。 C 项：意思是：在这种悲伤的追怀和祭奠中，亡妻那端庄的身影仿佛又浮现在诗人眼前，那温柔的嗓音又回荡在耳边。是诗人“没有相应的外界客观事物直接作用下发生的不真实感知”，因极度难过想念而产生的幻觉，符合定义。 D 项：意思是：蝉声高唱，树林却显得格外宁静；鸟鸣声声，深山里倒比往常更清幽。蝉、树林、鸟是外界客观事物，不符合“没有外界客观事物”，不符合定义。因此，选择C 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-110","paperId":"jx2020","num":110,"year":2020,"region":"江西","module":"判断推理","sub":"定义判断","stem":"社会收缩是指人类聚落中人口持续流失，由此引发相应地区经济社会环境和文化在空间上的衰退这一过程。根据收缩行为是否是聚落行为主体主动采取的规划策略或管理措施，可以分为主动社会收缩和被动社会收缩。根据上述定义，下列选项属于主动社会收缩的是：","options":["某市因疏解核心区功能导致城区人口下降","2019 年我国春运人口迁移规模近30 亿人次","某产煤大县因资源枯竭导致就业吸纳能力下降","某制造业基地因产业升级导致房屋空置率居高不下"],"answer":"A","explanation":"正确答案：A，全站正确率：61%，易错项：B。解析第一步，根据提问方式，确定为选是题。第二步，找关键信息。多定义，考查“主动社会收缩”，其关键信息为：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 34 - （1）社会收缩：人类聚落中人口持续流失，引发相应地区经济社会环境和文化在空间上的衰退；（2）主动社会收缩：行为主体主动采取的规划策略或管理措施。第三步，辨析选项。 A 项：疏解核心区功能符合“行为主体主动采取的规划策略或管理措施”，城区人口下降符合“人口持续流失”，符合定义； B 项：春运人口迁移不符合“人口持续流失”，不符合定义； C 项：资源枯竭不符合“主动采取的规划策略或管理措施”，不符合定义； D 项：房屋空置率居高不下是因为产业升级，不符合“引发相应地区经济社会环境和文化在空间上的衰退”，不符合定义。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-111","paperId":"jx2020","num":111,"year":2020,"region":"江西","module":"判断推理","sub":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①②④，③⑤⑥","①③④，②⑤⑥","①③⑥，②④⑤","①④⑤，②③⑥"],"answer":"D","explanation":"正确答案：D，全站正确率：28%，易错项：B。解析第一步，观察特征。题干中镂空的六面体中均出现三角形，考虑三角形的特性。第二步，根据规律进行分组。图形①④⑤中的三角形为等腰三角形，图形②③⑥中的三角形为非等腰三角形，分为两组。因此，选择D 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-112","paperId":"jx2020","num":112,"year":2020,"region":"江西","module":"判断推理","sub":"图形推理","stem":"把下面六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①⑤⑥，②③④","①②⑤，③④⑥","①②④，③⑤⑥","①③⑤，②④⑥"],"answer":"A","explanation":"正确答案：A，全站正确率：82%，易错项：C。解析第一步，观察特征。组成元素不同，考虑数量类或属性类，观察发现图形有的有封闭区间，有的完全开放，考虑封闭性。第二步，根据规律进行分组。图形①⑤⑥均为封闭图形，图形②③④均为开放图形，分为两组。因此，选择A 选项。","material":"","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-116","paperId":"jx2020","num":116,"year":2020,"region":"江西","module":"资料分析","sub":"综合资料","stem":"2019 年6 月，全国发行的地方政府债券比2018 年6 月多约：","options":["6151 亿元","5953 亿元","3653 亿元","3043 亿元"],"answer":"C","explanation":"正确答案：C，全站正确率：68%，易错项：B。解析第一步，本题考查增长量计算中的已知现期量与增长率。第二步，定位第一段文字材料，“2019 年6 月，全国发行地方政府债券8996 亿元，同比增长68.37%”。第三步，68.37%≈66.7%≈ ，根据增长量计算n+1 原则，2019 年6 月，全国发行的地方政府债券比2018 年6 月多约，直除首两位商35，与C 选项最接近。因此，选择C 选项。","material":"2019 年6 月，全国发行地方政府债券8996 亿元，同比增长68.37%，环比增长195.63%。其中，发行一般债券3178 亿元，同比减少28.33%，环比增长117.08%，发行专项债券5818 亿元，同比增长540.04%，环比增长 268.46%；按用途划分，发行新增债券7170 亿元，同比增长127.11%，环比增长332.71%，发行置换债券和再融资债券1826 亿元，同比减少16.47%，环比增长31.75%。 2019 年6 月，地方政府债券平均发行期限11.1 年，其中新增债券10.4 年，置换债券和再融资债券13.4 年；地方政府债券平均发行利率3.55%，其中新增债券3.52%，置换债券和再融资债券3.65%。 2019 年1 至6 月，全国发行地方政府债券28372 亿元，同比增长101.09%。其中，发行一般债券12858 亿元，同比增长23.21%，发行专项债券15514 亿元，同比增长322.38%；按用途划分，发行新增债券21765 亿元，同比增长553.80%，发行置换债券和再融资债券6607 亿元，同比减少38.71%。 2019 年1 至6 月，地方政府债券平均发行期限9.3 年，其中一般债券11.2 年，专项债券7.8 年；地方政府债券平均发行利率3.47%，其中一般债券3.53%，专项债券3.43%。 2019 年全国地方政府债务限额为240774.3 亿元。其中，一般债务限额133089.22 亿元，专项债务限额 107685.08 亿元。截至2019 年6 月末，全国地方政府债务余额205477 亿元，其中，一般债务118397 亿元，专项债务87080 亿元。","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2020-117","paperId":"jx2020","num":117,"year":2020,"region":"江西","module":"资料分析","sub":"综合资料","stem":"2018 年1 至5 月，全国发行地方政府债券约：","options":["23029 亿元","19376 亿元","14109 亿元","8766 亿元"],"answer":"D","explanation":"正确答案：D，全站正确率：58%，易错项：C。解析第一步，本题考查基期量和差计算。第二步，定位第一段和第三段文字材料，“2019 年6 月，全国发行地方政府债券8996 亿元，同比增长68.37%” “2019 年1 至6 月，全国发行地方政府债券28372 亿元，同比增长101.09%”。第三步，根据基期量=现期量/（1+增长率），选项出现首位相同第二位不同，分母从左向右截取前三位，可得 ≈14115－5355=8760（亿元），与D 选项最接近。因此，选择D 选项。","material":"2019 年6 月，全国发行地方政府债券8996 亿元，同比增长68.37%，环比增长195.63%。其中，发行一般债券3178 亿元，同比减少28.33%，环比增长117.08%，发行专项债券5 ear":2020,"region":"江西","module":"资料分析","sub":"综合资料","stem":"能够从上述资料推出的是：","options":["2018 年5 月，平台受理价格举报数量多于价格投诉数量","2019 年5 月，平台受理价格咨询数量环比下降幅度最大","2019 年5 月，平台受理教育行业数量不超过旅游行业的2 倍","2019 年5 月，平台受理量排名前三的省份占总数的比重低于35%"],"answer":"D","explanation":"正确答案：D，全站正确率：39%，易错项：C。解析第一步，本题考查综合分析问题，且需选出能推出的一项。第二步，A 选项，基期量比较，定位文字材料，材料给出了2019 年5 月平台受理价格举报数量与价格投诉数量，但未给出“同比增长率”，无法求出2018 年5 月价格举报数量和价格投资数量，错误。 B 选项，直接读数，定位文字材料，“2019 年5 月，平台受理价格举报环比下降19.06%；价格投诉环比下降15.92%；价格咨询环比下降7.34%”，下降幅度，指减少率，比较时看绝对值。直接读数可知，2019 年5 月，平台受理价格咨询数量环比下降幅度（7.34%）＜平台受理价格举报环比下降幅度（19.06%），错误。 C 选项，现期倍数计算，定位表格材料，“2019 年5 月，平台受理教育行业数量为927 件，旅游行业数量为459 件”，927＞2×459，前者超过后者的2 倍，错误。 D 选项，现期比重计算，定位文字材料，“2019 年5 月，全国平台受理共计37576 件……北京（5786 件）、江苏（3528 件）、上海（2499 件）”，根据比重=部分量/整体量，可得所求比重 = ≈31%＜35%，正确。因此，选择D 选项。拓展 A 超过B 的n 倍，即A>n×B","material":"2019 年6 月，全国发行地方政府债券8996 亿元，同比增长68.37%，环比增长195.63%。其中，发行一般债券3178 亿元，同比减少28.33%，环比增长117.08%，发行专项债券5818 亿元，同比增长540.04%，环比增长 268.46%；按用途划分，发行新增债券7170 亿元，同比增长127.11%，环比增长332.71%，发行置换债券和再融资债券1826 亿元，同比减少16.47%，环比增长31.75%。 2019 年6 月，地方政府债券平均发行期限11.1 年，其中新增债券10.4 年，置换债券和再融资债券13.4 年；地方政府债券平均发行利率3.55%，其中新增债券3.52%，置换债券和再融资债券3.65%。 2019 年1 至6 月，全国发行地方政府债券28372 亿元，同比增长101.09%。其中，发行一般债券12858 亿元，同比增长23.21%，发行专项债券15514 亿元，同比增长322.38%；按用途划分，发行新增债券21765 亿元，同比增长553.80%，发行置换债券和再融资债券6607 亿元，同比减少38.71%。 2019 年1 至6 月，地方政府债券平均发行期限9.3 年，其中一般债券11.2 年，专项债券7.8 年；地方政府债券平均发行利率3.47%，其中一般债券3.53%，专项债券3.43%。 2019 年全国地方政府债务限额为240774.3 亿元。其中，一般债务限额133089.22 亿元，专项债务限额 107685.08 亿元。截至2019 年6 月末，全国地方政府债务余额205477 亿元，其中，一般债务118397 亿元，专项债务87080 亿元。","source":"2020年江西省公务员考试《行测》真题（省级）"},{"id":"jx2019-001","paperId":"jx2019","num":1,"year":2019,"region":"江西","module":"常识判断","sub":"经济","stem":"习近平总书记在中央政治局第十三次集体学习时强调，要精准有效处置重点领域风险，深化金融改革开放，增强金融服务能力，坚决打好防范化解包括金融风险在内的重大风险攻坚战，推动我国金融业健康发展。","options":["实体经济","私营经济","中小企业","国有企业"],"answer":"A","explanation":"本题考查政治常识。 2019 年2 月22 日，中共中央政治局就完善金融服务、防范金融风险举行第十三次集体学习。习近平总书记在主持学习时强调：“要深化对国际国内金融形势的认识，正确把握金融本质，深化金融供给侧结构性改革，平衡好稳增长和防风险的关系，精准有效处置重点领域风险，深化金融改革开放，增强金融服务实体经济能力，坚决打好防范化解包括金融风险在内的重大风险攻坚战，推动我国金融业健康发展。” 故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-002","paperId":"jx2019","num":2,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列哪一选项所描写的城市不是当前的省会城市？","options":["豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越","东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家","因念都城放夜。望千门如昼，嬉笑游冶。钿车罗帕。相逢处，自有暗尘随马","自古帝王州，郁郁葱葱佳气浮。四百年来成一梦，堪愁，晋代衣冠成古丘"],"answer":"C","explanation":"本题考查人文常识。 A 项正确，“豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。”出自唐代王勃的《滕王阁序》。滕王阁位于江西省南昌市赣江滨。南昌市是江西省的省会城市。 B 项正确，“东南形胜，三吴都会，钱塘自古繁华，烟柳画桥，风帘翠幕，参差十万人家。”出自北宋柳永的《望海潮·东南形胜》，作品主要描写杭州的富庶与美丽。杭州市是浙江省的省会城市。 C 项错误，“因念都城放夜。望千门如昼，嬉笑游冶。钿车罗帕。相逢处，自有暗尘随马。”出自北宋周邦彦的《解语花·上元》。词中“都城”是指汴京，今河南开封市。现在，河南省的省会城市是郑州市。 D 项正确，“自古帝王州，郁郁葱葱佳气浮。四百年来成一梦，堪愁。晋代衣冠成古丘。”出自北宋王安石的《南乡子·自古帝王州》，词中的“帝王州”是指金陵，今江苏省南京市。南京市是江苏省的省会。本题为选非题，故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-003","paperId":"jx2019","num":3,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"关于生态文明建设，下列说法正确的是:","options":["蓝天保卫战是全面建成小康社会的三大攻坚战之一","加快构建生态文明体系是解决污染问题的根本之策","生态环境安全是经济社会持续健康发展的重要保障","地方政府主要领导是本行政区域生态环境保护第一责任人"],"answer":"C","explanation":"本题考查政治常识。 A 项错误，2017 年10 月18 日，习近平总书记在十九大报告中指出：“要坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战，使全面建成小康社会得到人民认可、经得起历史检验。”蓝天保卫战并不是三大攻坚战之一。 B 项错误，2018 年5 月18 日至19 日，习近平总书记在全国生态环境保护大会上强调：“要全面推动绿色发展。绿色发展是构建高质量现代化经济体系的必然要求，是解决污染问题的根本之策。” C 项正确，2018 年5 月18 日至19 日，习近平总书记在全国生态环境保护大会上强调：“要有效防范生态环境风险。生态环境安全是国家安全的重要组成部分，是经济社会持续健康发展的重要保障。” D 项错误，2018 年5 月18 日至19 日，习近平总书记在全国生态环境保护大会上强调：“各地区各部门要增强“四个意识”，坚决维护党中央权威和集中统一领导，坚决担负起生态文明建设的政治责任。地方各级党委和政府主要领导是本行政区域生态环境保护第一责任人，各相关部门要履行好生态环境保护职责，使各部门守土有责、守土尽责，分工协作、共同发力。” 故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-004","paperId":"jx2019","num":4,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于粉尘爆炸的说法错误的是：","options":["颗粒越小越易燃烧，爆炸也越剧烈","越易氧化的物质，其粉尘越易爆炸","越易带电的物质，其粉尘越易爆炸","含卤素和钾、钠的粉尘，爆炸趋势增强"],"answer":"D","explanation":"本题考查科技常识。呈细粉状的固体物质被称为粉尘，能燃烧和爆炸的粉尘叫做可燃粉尘。工厂内一些金属粉尘，如镁粉、铝粉，生活中常见的淀粉、木粉等都是可燃粉尘。粉尘在爆炸极限范围内，遇到热源(明火或高温)，火焰瞬间传播于整个混合粉尘空间，化学反应速度极快，同时释放大量的热，形成高温高压。由于这一过程中不断有升高的压力会产生冲击波，因此，爆炸会造成很大的破坏力。 A 项正确，粉尘的表面能够吸附空气中的氧，颗粒越细小，粉尘总的表面积就越大，从而表面吸附的氧就越多，越容易发生爆炸。 B、C 项正确，粉尘爆炸的难易程度与粉尘的物理化学性质和环境条件等有关。一般认为氧化速度快的物质容易爆炸，如镁粉、铝粉等。容易带电的粉尘也很容易引起爆炸，如合成树脂粉末、纤维类粉尘等。 D 项错误，根据实践分析，一般含有卤素和钾、钠的粉尘，爆炸趋势减弱。本题为选非题，故正确答案选择D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-005","paperId":"jx2019","num":5,"year":2019,"region":"江西","module":"常识判断","sub":"科技生活","stem":"2018 年我国科技界取得了一系列重大成果，这些成果中不包括：","options":["第二艘航母出海试航","嫦娥四号探测器发射成功","造岛神器“天鲲号”下水","国产大型水陆两栖飞机水上首飞"],"answer":"C","explanation":"本题考查政治常识。 A 项正确，2018 年5 月13 日，我国第二艘航母从大连造船厂码头启航，赴相关海域执行海上试验任务，主要检测验证动力系统等设备的可靠性和稳定性。 B 项正确，2018 年8 日2 时23 分，我国在西昌卫星发射中心用长征三号乙运载火箭成功发射嫦娥四号探测器，开启了月球探测的新旅程。嫦娥四号探测器后续将经历地月转移、近月制动、环月飞行，最终实现人类首次月球背面软着陆，开展月球背面就位探测及巡视探测，并通过已在使命轨道运行的“鹊桥”中继星，实现月球背面与地球之间的中继通信。 C 项错误，2017 年11 月3 日，由我国自主设计研发的新一代国之重器——“天鲲号”自航绞吸挖泥船成功下水。从被称为“造岛神器”的“天鲸号”，到目前亚洲最大最先进的“天鲲号”，中国自航绞吸挖泥船的自主研制实力再一次让世人惊叹。 D 项正确，2018 年10 月20 日，中国自主研制的大型水陆两栖飞机——“鲲龙”AG600 在湖北荆门漳河机场成功实现水上首飞。至此，中国大飞机终于迈出“上天入海”完整步伐，建设航空强国轮廓愈发明晰。本题为选非题，故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-006","paperId":"jx2019","num":6,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"关于全面依法治国，下列说法不准确的是：","options":["到本世纪中叶，基本建成法治国家、法治政府、法治社会","全面依法治国在“四个全面”中具有基础性、保障性作用","党的领导是社会主义法治最根本的保证","中国特色社会主义法治体系是中国特色社会义制度的法律表现形式"],"answer":"A","explanation":"本题考查法律常识。 A 项错误，党的十九大报告指出：“综合分析国际国内形势和我国发展条件，从2020 年到本世纪中叶可以分两获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 - 个阶段来安排。第一个阶段，从2020 年到2035 年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化。到那时，我国经济实力、科技实力将大幅跃升，跻身创新型国家前列；人民平等参与、平等发展权利得到充分保障，法治国家、法治政府、法治社会基本建成，各方面制度更加完善，国家治理体系和治理能力现代化基本实现······”因此，到2035 年，基本建成法治国家、法治政府、法治社会。 B 项正确，2018 年8 月24 日中央全面依法治国委员会第一次会议顺利召开，习近平总书记作出重要讲话。他强调：“全面依法治国具有基础性、保障性作用，在统筹推进伟大斗争、伟大工程、伟大事业、伟大梦想，全面建设社会主义现代化国家的新征程上，要加强党对全面依法治国的集中统一领导，坚持以全面依法治国新理念新思想新战略为指导，坚定不移走中国特色社会主义法治道路，更好发挥法治固根本、稳预期、利长远的保障作用。” C 项正确，党的十八届四中全会通过的《中共中央关于全面推进依法治国若干重大问题的决定》指出：“党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。” D 项正确，党的十八届四中全会通过的《中共中央关于全面推进依法治国若干重大问题的决定》指出：“全面推进依法治国，总目标是建设中国特色社会主义法治体系，建设社会主义法治国家。这就是，在中国共产党领导下，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论，形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形成完善的党内法规体系，坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设，实现科学立法、严格执法、公正司法、全民守法，促进国家治理体系和治理能力现代化。”因此，中国特色社会主义法律体系是中国特色社会主义制度的法律表现形式。本题为选非题，故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-007","paperId":"jx2019","num":7,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列法律法规中，哪一项不是从2019 年1 月1 日起施行？","options":["《中华人民共和国电子商务法》","《中华人民共和国土壤污染防治法》","新修订的《中华人民共和国公务员法》","新修订的《中华人民共和国个人所得税法实施条例》"],"answer":"C","explanation":"本题考查法律。 A 项正确，《中华人民共和国电子商务法》是2018 年8 月31 日第十三届全国人民代表大会常务委员会第五次会议通过，本法第八十九条规定：“本法自2019 年1 月1 日起施行。” B 项正确，《土壤污染防治法》是2018 年8 月31 日十三届全国人大常委会第五次会议全票通过，本法第九十九条规定：“本法自2019 年1 月1 日起施行。” C 项错误，《中华人民共和国公务员法》已由中华人民共和国第十三届全国人民代表大会常务委员会第七次会议于2018 年12 月29 日修订通过，自2019 年6 月1 日起施行。 D 项正确，《中华人民共和国个人所得税法实施条例》是国务院发布的法规，2018 年12 月18 日中华人民共和国国务院令第707 号第四次修订通过，第三十六条规定：“本条例自2019 年1 月1 日起施行。” 本题为选非题，故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-008","paperId":"jx2019","num":8,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"荷花虽生长于池塘的污泥中，但荷叶却出污泥而不染，其主要原因是：","options":["荷叶含有大量的叶绿素，能与太阳光发生光合作用，产生自清洁","荷叶表面光滑，具有非常强的光洁度，污泥很难在它的表面吸附","荷叶含有疏水的纳米级蜡质，雨露落在上面会形成水珠清洁叶面","荷花枝干细长，水珠落在荷叶上，容易造成荷叶晃动，甩出污泥"],"answer":"C","explanation":"本题考查科技常识。荷叶之所以能出污泥而不染是由荷叶叶面上存在着复杂的多重纳米和微米级的超微结构决定的：在超高分辨率显微镜下可以清晰看到，荷叶表面上有许多微小的乳突，它上面长满绒毛，在紧贴叶面处形成一层极薄的只有纳米量级厚的空气层。这使得在尺寸上远大于这种结构的灰尘、雨水等降落在叶面上后，隔着一层极薄的空气，从而雨水会自动聚集成水珠，而水珠的滚动会把落在叶面上的尘土污泥吸附掉滚出叶面，使叶面始终保持干净，这就是著名的“荷叶自洁效应”。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-009","paperId":"jx2019","num":9,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"首次把《大学》《中庸》《论语》和《孟子》编在一起的学者是：","options":["朱熹","程颐、程颢","董仲舒","颜之推"],"answer":"A","explanation":"本题考查人文常识。 A 项正确，南宋理学家朱熹首次将《大学》、《中庸》、《论语》、《孟子》汇集在一起，并为其作章句集注，成《四书章句集注》一书，对后世产生了深远的影响。 B 项错误，程颢、程颐兄弟，河南洛阳人，北宋著名理学家、教育家，“洛学”代表人物，世称“二程”，其理学思想对后世影响深远，南宋理学“集大成者”朱熹正是继承和发展了他们的学说。“二程”的理学思想主要见于《遗书》《文集》和《经说》等，现均收入《二程集》。 C 项错误，董仲舒，汉代思想家、哲学家、政治家、教育家。他在著名的《举贤良对策》中系统地提出了“天人感应”、“大一统”学说和“罢黜百家，表彰六经”的主张。董仲舒的儒家思想大大维护了汉武帝的集权统治，为当时社会政治和经济的稳定做出了贡献。 D 项错误，颜之推，字介，汉族，琅邪临沂（今山东临沂）人。中国古代文学家，教育家，生活年代在南北朝至隋朝期间。颜之推著有《颜氏家训》，在家庭教育发展史上有重要的影响。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-010","paperId":"jx2019","num":10,"year":2019,"region":"江西","module":"常识判断","sub":"科技生活","stem":"下列哪一种现象的物理原理不同于其他三项：","options":["水中的手指变粗","池水看起来比实际的浅","只有瞄准鱼的下方才能叉到鱼","小明在宁静的湖边看见“云在水中飘”"],"answer":"D","explanation":"本题考查科技常识。光从一种透明介质斜射入另一种透明介质时，传播方向一般会发生变化，这种现象叫光的折射。 A 项正确，盛水的水杯中间厚、边缘薄，就如同一个凸透镜（放大镜），对手指有放大作用，使得水中部分手指看上去变粗了。凸透镜利用的是光的折射原理。 B、C 项正确，从池底或鱼身上（S 点）反射的光线由水中进入空气时，在水面上发生了折射，由于水的折射率大于空气，使得折射角大于入射角，折射光线进入人眼，人眼会逆着折射光线的方向看去，就会觉得池底或鱼的位置偏高（如图S’点），看上去池子变浅了，叉鱼时也须瞄准鱼的下方才能叉到鱼。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - D 项错误，宁静的湖水有平面镜的效果，能将天空中云朵反射进小明的眼中，体现的是光的反射原理。本题为选非题，故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-011","paperId":"jx2019","num":11,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于全国经济普查的说法错误的是：","options":["根据《全国经济普查条例》的规定，经济普查每5 年进行一次","目的是全面调查我国第一、第二、第三产业的发展规模、布局和效益","普查取得的单位和个人资料，不作为对普查对象实施处罚的依据","2019 年1 月1 日，第四次全国经济普查现场登记工作正式启动"],"answer":"B","explanation":"本题考查法律常识。 A 项正确，《全国经济普查条例》第七条规定：“经济普查每5 年进行一次，标准时点为普查年份的12 月31 日。” B 项错误，《全国经济普查条例》第二条规定：“经济普查的目的，是为了全面掌握我国第二产业、第三产业的发展规模、结构和效益等情况，建立健全基本单位名录库及其数据库系统，为研究制定国民经济和社会发展规划，提高决策和管理水平奠定基础。” C 项正确，《全国经济普查条例》第三十三条规定：“经济普查取得的单位和个人资料，严格限定用于经济普查的目的，不作为任何单位对经济普查对象实施处罚的依据。” D 项正确，2019 年1 月1 日零时，第四次全国经济普查现场登记工作正式启动。按照部署，第四次全国经济普查标准时点为2018 年12 月31 日，普查时期资料为2018 年年度资料。本题为选非题，故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-012","paperId":"jx2019","num":12,"year":2019,"region":"江西","module":"常识判断","sub":"科技生活","stem":"下列关于仿生生物学的应用对应关系不正确的是：","options":["发光纤维——萤火虫","子弹头列车——翠鸟","维克罗尼龙搭扣——苍耳","全天然空调系统建筑——非洲白蚁巢穴"],"answer":"A","explanation":"本题考查生物常识。 A 项错误，发光纤维是指受到光和放射线的照射时，能发出比照射光波长长的可见光的纤维。常见的发光纤维如：以发光玻璃作芯材的纤维、以发光塑料作芯材的纤维。而萤火虫有专门的发光细胞，在发光细胞中有两类化学物质，一类被称作荧光素，另一类被称为荧光素酶。荧光素能在荧光素酶的催化下消耗ATP （腺嘌呤核苷三磷酸又称腺苷三磷酸），并与氧气发生反应，反应中产生激发态的氧化荧光素，当氧化荧光素从激发态回到基态时释放出光子。反应中释放的能量几乎全部以光的形式释放，只有极少部分以热的形式释放，萤火虫是通过这样的作用来发光的。由此可见，发光纤维并不是在仿生萤火虫。 B 项正确，翠鸟拥有长而平的喙，使其可以从空气迅速潜入水中，同时并不会产生过多的扰动。日本工程师中津英治仿照翠鸟喙设计出了新干线子弹头列车的车头，使其更长更平，这种新设计成功将空气阻力降低了，降低了火车的噪音。 C 项正确，苍耳是一种植物，它的总苞具有钩状的硬刺，可以贴附于动物的身体上。尼龙搭扣的设计正是从苍耳获得的灵感，尼龙搭扣的两边都是尼龙做的，一边是一排排的小勾，另一边是密密麻麻的小线圈，两边贴在一起的时候，小勾就勾住小线圈，使其能贴在一起。 D 项正确，非洲白蚁会建造巨大的巢穴系统，他们经常开启和关闭自己塔楼巢穴中的气口，使得巢穴内外的空气得以对流——冷空气从底部的气口流入塔楼，与此同时热空气从顶部的烟囱流出。从而使得巢穴中始终维持一个恒定的温度。在设计津巴布韦首都哈拉雷的约堡东门购物中心和办公大楼时，建筑大师麦克·皮尔斯研究了非洲白蚁巢穴的结构，设计出了全天然空调系统，使得购物中心常年维持适宜的温度。本题为选非题，故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-013","paperId":"jx2019","num":13,"year":2019,"region":"江西","module":"常识判断","sub":"人文历史","stem":"下列历史事件与人物搭配正确的是：","options":["锦帆未落干戈起——隋炀帝","烽火四起戏诸侯——周宣王","一骑红尘妃子笑——唐睿宗","车同轨，书同文——周武王"],"answer":"A","explanation":"本题考查人文常识。 A 项正确，“锦帆未落干戈起”出自唐代胡曾的《咏史诗·汴水》，这首诗反映了：隋炀帝开凿京杭大运河，耗费了大量人力物力财力，惹得民不聊生，起义军掀起推翻隋朝统治的浪潮。 B 项错误，“烽火四起戏诸侯”，指西周时周幽王，为褒姒一笑，点燃了烽火台，戏弄了诸侯。褒姒看了果然哈哈大笑。幽王很高兴，因而又多次点燃烽火。后来诸侯们都不相信了，也就渐渐不来了。对应的人物为周幽王，而非周宣王。 C 项错误，“一骑红尘妃子笑”出自唐代杜牧的《过华清宫绝句三首》，讲的是杨贵妃喜欢荔枝，皇帝唐玄宗找人快马相运，意思是速度很快，只能看到滚滚烟尘却没有看到烈马掠过。对应的人物为唐玄宗和杨贵妃，而非唐睿宗。 D 项错误，车同轨，书同文是一个汉语成语，是谓车轨相同，文字相同。形容天下统一。《史记·秦始皇本纪》： “一法度衡石丈尺。车同轨。书同文字。”对应的是秦始皇，而非周武王。故正确答案为A。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 -","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-014","paperId":"jx2019","num":14,"year":2019,"region":"江西","module":"常识判断","sub":"经济","stem":"下列属于改革开放40 年来我国经济建设所取得伟大成就的是: ①建立了最完整的现代工业体系 ②成为了世界商品消费第一大国 ③主要农产品的产量跃居世界前列 ④外汇储备连续多年位居世界第一获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 2 -","options":["①②④","①③④","②③④","①②③④"],"answer":"B","explanation":"本题考查政治常识。 2018 年12 月18 日，习近平总书记在庆祝改革开放40 周年大会上的讲话中指出：“我国主要农产品产量跃居世界前列，建立了全世界最完整的现代工业体系，科技创新和重大工程捷报频传。我国基础设施建设成就显著，信息畅通，公路成网，铁路密布，高坝矗立，西气东输，南水北调，高铁飞驰，巨轮远航，飞机翱翔，天堑变通途。现在，我国是世界第二大经济体、制造业第一大国、货物贸易第一大国、商品消费第二大国、外资流入第二大国，我国外汇储备连续多年位居世界第一，中国人民在富起来、强起来的征程上迈出了决定性的步伐！”所以，①③ ④表述正确，②错误。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-015","paperId":"jx2019","num":15,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列气体既会造成酸雨，又可用作防腐剂的是：","options":["二氧化碳","二氧化氮","二氧化硫","氮气"],"answer":"C","explanation":"本题考查科技常识。酸雨通常指pH 值小于5.6 的酸性降水。酸雨中含有多种无机酸和有机酸，绝大部分是硫酸和硝酸，由人为排放的大气污染物二氧化硫和氮氧化物转化而成。 A 项错误，二氧化碳溶于水后虽然会使雨水呈弱酸性，但不会导致酸雨。 B 项错误，二氧化氮会与大气中水反应生成硝酸，形成硝酸型酸雨；二氧化氮有剧毒，不可以作防腐剂。 C 项正确，二氧化硫与大气中的水反应生成亚硫酸，亚硫酸又与大气中的氧气反应，生成硫酸，形成硫酸型酸雨；二氧化硫有还原性，易被氧化，因此常用作葡萄酒的防腐剂。 D 项错误，氮气化学性质不活泼，常温下很难跟其他物质发生反应,所以常被用作薯片等食品的防腐剂；氮气难溶于水，不会造成酸雨。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-016","paperId":"jx2019","num":16,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列说法错误的是：","options":["雷雨可使土壤的氮肥增加","18K 黄金制品的含金量为70","聚四氟乙烯可用于制作不粘锅的涂层","在金属表面喷漆可以防止金属被氧化腐蚀"],"answer":"B","explanation":"本题考查科技常识。 A 项正确，含氮元素的化合物能提供作物生长所需的氮元素,而被称为氮肥。雷雨时雷电作用下，氮气与氢气化合成氨气，氨气、二氧化碳与雨水相互作用可形成碳铵随雨水落入土壤，碳铵能提供作物生成所需要的氮元素，属于氮肥。 B 项错误，K 金是指黄金和其它金属混合在一起的合金。根据在首饰中的黄金含量可分为不同的K 金，其中24K 是指纯金，18K 黄金制品的含黄金量就是18/24=75 ，因此选项中的70 表述错误。 C 项正确，聚四氟乙烯俗称“塑料王”，是由四氟乙烯经聚合而成的高分子化合物，具有优良的化学稳定性、耐腐蚀性、密封性、高润滑不粘性，可用于制作不粘锅的涂层。 D 项正确，金属被氧化腐蚀是指各类材料在环境作用下发生损坏、性能下降或状态的劣化。良好的喷漆涂装保护层能够成为抑制腐蚀介质侵入的屏障，使得金属保持连续完整，因此在金属表面喷漆是一种很重要的金属防腐蚀手段。本题为选非题，故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-017","paperId":"jx2019","num":17,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列表述正确的是：","options":["鄱阳湖栖息着世界上最大的白鹤群","我国最早出现的种植业位于松花江流域","被誉为“天上云霞,地下鲜花”的是四川蜀绣","东北平原是中国第二大平原，也是中国重要的粮棉生产基地"],"answer":"A","explanation":"本题考查地理国情。 A 项正确，鄱阳湖是全世界最大的白鹤集中越冬地，白鹤的数量占全世界总数的以上，堪称鹤之天堂。1983 年世界鹤类会议上估计全世界自鹤数量为320 只，这年冬季鄱阳湖所见则为409 只。从此，逐年增多。1986 年1 月为1609 只，目前多达数千只。1983 年已在江西省永修县吴城镇建立了鄱阳湖候鸟保护区。 B 项错误，我国最早出现的种植业应位于黄河、长江流域。黄河、长江是中国的母亲河，这两条河流的冲积平原地区是中华文明的发祥地且两个平原处在温带湿润、半湿润地区，气候温暖湿润，比较适宜人类居住，所以种植业发展最早。 C 项错误，被誉为“天上云霞，地下鲜花”的是杭州的锦绣。 D 项错误，东北平原是中国最大的平原，是中国四大平原之一。位于中国东北部，南北长约1000 千米，东西宽约400 千米，面积达35 万平方千米。同时东北平原土地肥沃，是全球仅有的三大黑土区域之一，是中国重要的粮食、大豆、畜牧业生产基地，也是中国重要的钢铁、机械、能源、化工基地。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-018","paperId":"jx2019","num":18,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列我国古代国家行政机构不具有行政监察职能的是：","options":["御史台","太常寺","六科给事中","都察院"],"answer":"B","explanation":"本题考查人文常识。 A 项正确，御史台，古代官署名。御史台的职责是纠察弹劾百官过失，是封建国家专司弹劾的监察机关。 B 项错误，太常寺，封建社会中掌管礼乐的最高行政机关，秦时称奉常。汉景帝六年改称太常。汉以后改称太常寺、太常礼乐官等。 C 项正确，明代地方分区监察和中央按系统监察相结合，专设六科给事中，稽察六部百司之事，旨在加强皇帝对六部的控制。 D 项正确，都察院，官署名。明清全国最高监察机构。掌纠劾百司，辩明冤枉，提督各道，为天子耳目风纪之司。本题为选非题，故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-019","paperId":"jx2019","num":19,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"唐太宗李世民曾言:为官择人，唯才是与；苟或不才，虽亲不用。下列哪一人才选拔制度与其所言体现的用人理念最契合：","options":["科举制","察举制","世卿世禄制","九品中正制"],"answer":"A","explanation":"本题考查人文常识。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 - 唐太宗李世民曾言：为官择人，唯才是与；苟或不才，虽亲不用。是指用人的原则是看才能，而不管亲疏。 A 项正确，科举是通过考试选拔官吏。由于采用分科取士的办法，所以叫做科举。具有分科考试，取士权归于中央所有，允许自由报考和主要以成绩定取舍三个显著的特点。从隋朝大业元年（605 年）开始实行，到清朝光绪三十一年（1905 年）举行最后一科进士考试为止，经历了1300 年。 B 项错误，察举制是中国古代选拔官吏的一种制度，它的确立时间是汉武帝元光元年(公元前134 年)。它的主要特征是由地方长官在辖区内随时考察、选取人才并推荐给上级或中央，经过试用考核再任命官职。 C 项错误，世卿世禄制是古代高级官吏的称呼。世卿就是天子或诸侯国君之下的贵族，世世代代、父死子继，连任卿这样的高官。禄是官吏所得的享受财物。世禄就是官吏们世世代代、父死子继，享有所封的土地及其赋税收入。 D 项错误，九品中正制，又称九品官人法，是魏晋南北朝时期重要的选官制度，从曹魏始至隋唐科举的确立，这期间约存在了四百年之久。九品中正制大体是指由各州郡分别推选大中正一人，所推举大中正必为在中央任职官员且德名俱高者。大中正再产生小中正。中正就是品评人才的官职名称。大、小中正产生后，由中央分发一种人才调查表，在该表中将人才分为九等，上上、上中、上下、中上、中中、中下、下上、下中、下下。此项制度使得当时的官吏选拔有了一客观标准，此标准其实依然是采取地方群众舆论和公共意见，保留了汉代乡举里选的遗意。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-020","paperId":"jx2019","num":20,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"管理大师杰克·韦尔奇有句名言：管得少，就是管得好。他主要强调管理应该注重：","options":["沟通","分权","组织","控制"],"answer":"B","explanation":"本题考查管理学常识。 “管得少，就是管得好”强调的就是管理应该注重分权。管理的最终目标在于提高经营绩效，分权是管理学学者在近一百多年的企业管理研究与实践中，为提高效率而归纳出的一大规律性，管理学家认为企业在追求绩效时必须善于分权，担任一定管理职务的领导者在实际工作中为充分利用专门人才的知识和技能，应将部分解决问题和处理新增业务的权利委任给下属。据此可知，B 项正确，ACD 三项与题干无关。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-021","paperId":"jx2019","num":21,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列气体是人体能够产生的，能发挥抗炎、神经功能调节和血管松弛等作用，但若吸入过量会与血红素结合导致中毒的是：","options":["一氧化氮","一氧化碳","硫化氢","氨气"],"answer":"A","explanation":"A 项正确，一氧化氮是一种人体可以自然产生的物质，其具有三大功能：①内皮舒张因子。作为内皮舒张因子，一氧化氮主要产生于内皮细胞，对预防和控制心脑血管疾病有着显著的效果。具体而言，一氧化氮是一种脂溶性气体，可以快速渗透出细胞膜向下扩散，进入并作用于血管周围平滑肌细胞，随着平滑肌的舒张，血管得以扩张（使血管松弛），最终导致血压的下降；②神经传导因子。作为神经传导因子，一氧化氮产生于外周神经和大脑中，作为肾上腺素和胆碱以外的神经递质，在血管、海绵体、胃肠道、泌尿道、气管肌、肛尾肌等外周输出神经抑制反应中起到非常重要的作用；③免疫调节因子。作为免疫调节因子，一氧化氮产生于免疫系统中，合成产生的一氧化氮，通过多条途径调节炎症，在调控免疫反应中起到重要作用。具体而言，一氧化氮可辅助白细胞杀死细菌、真菌、寄生虫、肿瘤细胞等。综上可知，一氧化氮在人体内发挥血管松弛、神经功能调节、抗菌消炎的作用。同时，一氧化氮与血红蛋白有很高的亲和力，如果吸入过量，一氧化氮会夺取氧气与血红蛋白结合的位置，造成人体因缺氧而中毒。 B 项错误，身体组织受毒素、紫外线辐射、激素和药物等侵害时，体内会自然地产生少量一氧化碳。一氧化碳与血红蛋白具有很高的亲和力，吸入过量会造成人体因缺氧而中毒，但一氧化碳在体内不具有血管松弛、神经功能调节、抗菌消炎的作用。 C 项、D 项错误，具有刺激性气味的硫化氢和氨气是人体代谢产生的废气，二者均不与血红蛋白结合，且不具有血管松弛、神经功能调节、抗菌消炎的作用。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-022","paperId":"jx2019","num":22,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列成语均与佛教有关的是：","options":["天花乱坠心心相印","黄粱一梦味同嚼蜡","一针见血一丝不挂","乐极生悲大彻大悟"],"answer":"A","explanation":"本题考查人文常识。 A 项正确，天花乱坠出自《心地观经·序品》，形容人说话巧妙动听，但虚妄、空洞、不着边际。典故：传说梁武帝时云光法师讲佛经，感动了上天，天上的花纷纷降落下来。现在用来比喻说话有声有色，非常动听（多指夸大的或不切实际的），与佛教有关。心心相印是禅宗用语，心指佛心，印者印可，禅宗不依语言，以心印心，契合无间，故曰“心印”。《六祖大师法宝坛经》：“吾传佛心印，安敢违于佛经。” B 项错误，黄粱一梦，比喻虚幻不能实现的梦想，出自《枕中记》，该成语与道教有关，与佛教无关。味同嚼蜡，是指味道如同嚼蜡一般，形容没有味道，多指说话或文章枯燥无味，出自《楞严经》卷八：“我无欲心，应汝行事，于横陈时，味同嚼蜡。” C 项错误，一针见血出自南朝时期范晔的《后汉书·郭玉传》，本义是一针刺下去就见到血，形容医生医术十分高明，现在多比喻说话直截了当，切中要害，与佛教无关。一丝不挂是佛教禅宗名词，用来比喻人内心没有一点烦恼，没有一点挂碍，超凡脱俗。 D 项错误，乐极生悲是指高兴到极点时，发生使人悲伤的事，出自《淮南子·道应训》，该成语与佛教无关。大彻大悟形容彻底醒悟，出处元代的郑德辉《立成汤伊尹耕萃》，该成语与佛教无关。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-023","paperId":"jx2019","num":23,"year":2019,"region":"江西","module":"常识判断","sub":"法律","stem":"下列关于血糖的说法错误的是：","options":["正常人进食后血糖浓度会升高","正常人空腹超过12 小时会引起低血糖","南瓜能抑制葡萄糖吸收，具有降血糖作用","胰岛素是人体产生的唯一能够降低血糖的激素"],"answer":"B","explanation":"本题考查科技常识。 A 项正确，食物中存在大量的淀粉等糖类。人在进食后，糖类被人体消化吸收，因此会使血糖含量升高。 B 项错误，空腹（禁食）数小时不吃饭会导致血糖浓度降低，此时会刺激胰高血糖素分泌增加，促进肝糖原和非糖物质转化为葡萄糖，以维持正常的血糖浓度，因此不会出现题目中表述的低血糖。 C 项错误，人们普遍认为，南瓜含糖量均较低，其中的南瓜多糖能有效地控制糖尿病症状，可刺激胰岛素的分泌，获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 从而抑制葡萄糖吸收，产生降糖功能。但新华网等则认为南瓜不降血糖。 D 项正确，胰岛素是体内唯一能够降低血糖浓度的激素，它不仅能够促使葡萄糖分解，还能抑制非糖物质转化为葡萄糖。本题为选非题，正确答案为BC，从命题角度考虑，粉笔题库倾向性答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-024","paperId":"jx2019","num":24,"year":2019,"region":"江西","module":"常识判断","sub":"政治","stem":"下列选项对“夏满芒夏暑相连”中节气的表述错误的是：","options":["“小满”表明了降水的时间和强度","“芒种”反映了自然物候现象或农事活动","“立夏”“夏至”体现了寒来暑往的季节变化","“小暑”“大暑”标明了一年之中最热的时段"],"answer":"A","explanation":"本题考查人文常识。 A 项错误，从小满开始，大麦、冬小麦等夏收作物，已经结果、籽粒饱满，但尚未成熟，所以叫小满。小满反映作物的成熟、收成情况。表明降水的时间和强度现象的是雨水。 B 项正确，“芒”指有芒作物如小麦、大麦等，“种”指种子。芒种即表明小麦等有芒作物成熟。反映作物的成熟、收成情况，即农事活动。 C 项正确，立夏是夏季的开始，从此进入夏天，万物生长旺盛。夏至是北半球白昼最长、黑夜最短的一天，从这一天起，进入炎热季节，天地万物在此时生长最旺盛。“立夏”“夏至”体现了寒来暑往的季节变化。 D 项正确，小暑是天气已经很热了，但还不到最热的时候。大暑是一年中最热的节气。本题为选非题，故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-026","paperId":"jx2019","num":26,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"习近平主席在上海合作组织成员国元首理事会第十八次会议上的重要讲话，深刻分析了我们今天所共同面对的风险挑战：当今世界霸权主义和强权政治存在；各种传统和非传统安全威胁不断；单边主义、贸易保护主义、逆全球化思潮不断有新的表现；文明冲突、文明优越等论调不时。依次填入划横线部分最恰当的一项是：","options":["依旧显现拨云见日","仍然出现激浊扬清","依然涌现沉渣泛起","仍旧浮现振臂高呼"],"answer":"C","explanation":"本题可从第三空入手，根据前文“深刻分析了我们今天所共同面对的风险挑战”可知，后文主要是针对“风险挑战”的论述。根据“文明冲突、文明优越等论调”可知，横线处表达不好的论调出现，需体现消极的语义。 C 项“沉渣泛起”比喻已经绝迹了的腐朽、陈旧事物又重新出现，符合文意，当选；A 项“拨云见日”比喻冲破黑暗见到光明，也比喻疑团消除，心里顿时明白，与“论调”搭配不当，排除；B 项“激浊扬清”比喻清除坏的，发扬好的；D 项“振臂高呼”指举起手欢呼，形容非常高兴。B、D 两项均体现积极的感情色彩，与文意不符，排除。第一空，代入验证，横线处表达世界霸权主义和强权政治存在的情况持续不变，C 项“依然”指照往常、依旧，符合文意。第二空，代入验证，横线处体现传统和非传统安全威胁不断出现之意，C 项“涌现”指在同一时期大量、突然地出现，符合文意。故正确答案为C。【文段出处】《为携手建设人类命运共同体作出更大贡献》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-027","paperId":"jx2019","num":27,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"某航天科工集团研制出的民航风切变预警系统，克服了预警难度大、精度低等现实问题，可以为飞机的起飞降落提供风切变预警信息，还能够提供机场未来48 小时的天气预报。填入划横线部分最恰当的一项是：","options":["及时","实时","适时","即时"],"answer":"B","explanation":"根据“可以为飞机的起飞降落······，还能够提供机场未来48 小时的天气预报”可知，横线处表达可以为飞机的起飞降落这一时间段内一直监测风向，提供预警信息。B 项“实时”意为在某事发生、发展的过程中的同一时间，符合语境，当选。 A 项“及时”意为立刻、马上、不拖延，无法与后文“未来48 小时的天气预报”形成对应，排除；C 项“适时” 意为适合时宜，文段不是强调在适当的时间做出预警信息，排除；D 项“即时”意为当下、立刻，文段强调的是在起飞降落过程中实时监测风向，提供预警信息，而非立刻提供信息，排除。故正确答案为B。【文段出处】《航天技术来到你身边》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-028","paperId":"jx2019","num":28,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"说起乡愁，那是一种的情怀，住在心中的故乡常常鲜活在那里。故乡是安放你的灵魂、温暖你的寂冷的地方，是接纳你的疲惫、抚慰你的忧伤的地方。翻开一页页被繁忙弄乱的过往，记忆中的余香总于儿时的故乡。依次填入划横线部分最恰当的一项是：","options":["与生俱来氤氲","难以割舍回荡","刻骨铭心徘徊","永生难忘徜徉"],"answer":"A","explanation":"第一空，搭配“情怀”，D 项“永生难忘”指一辈子也难以忘记，一般搭配“经历”、“事情”，与“情怀” 搭配不当，排除。A 项“与生俱来”指不依靠后天培养和教育，从一出生就拥有的特性或行为，B 项“难以割舍” 形容人对事或人的感情深，难以放弃或分开，C 项“刻骨铭心”形容记忆深刻，均与“情怀”搭配恰当，保留。第二空，搭配“余香”，A 项“氤氲”形容烟或云气浓郁，与“余香”搭配恰当，当选。B 项“回荡”指回响在耳边，发出回声，多指声音，与“余香”搭配不当，排除；C 项“徘徊”指在一个地方来回地走，比喻犹疑不决，与“余香”搭配不当，排除。故正确答案为A。【文段出处】《乡愁文丛》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-029","paperId":"jx2019","num":29,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"说梵高是一个“圣徒式的画家”并不为过，他通过绘画仰望、接近上帝。，即便是这样一个具有宗教情怀、追求超越性的梵高，也从未试图远离人群、拥抱绝对的孤独。，他总在渴望人与人之间的温暖与爱，而始终未能得到。他的绘画也好，文字也好，除去遗传的因素，很大程度上就是表达此种“寻求”与“寻求不得”之间的落差及随之而来的痛苦。依次填入划横线部分最恰当的一项是：","options":["然而因为","首先其次","因为于是","但是相反"],"answer":"D","explanation":"第一空，由前文“他通过绘画仰望、接近上帝”以及后文“也从未试图远离人群、拥抱绝对的孤独”可知，横线前后语义相反，表达梵高接近上帝但也没有远离人群，故横线处应填入转折关系的引导词，A 项“然而”、 D 项“但是”均可表示转折关系，保留；B 项“首先”表示逻辑顺序，C 项“因为”表示因果关系，均不符合文意，排除。第二空，由前文“远离人群、拥抱绝对的孤独”以及后文“他总在渴望人与人之间的温暖与爱”可知，横线前后语义相反，表达梵高没有试图远离人群，相反他总是渴望人与人之间的温暖与爱，横线处要填入表达相反语义的词语，对应D 项“相反”。A 项“因为”表示因果关系，与文意不符，排除。故正确答案为D。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 - 【文段出处】《<梵高传>：艺术是“是其所信”》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-030","paperId":"jx2019","num":30,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"纪录片《苏东坡》以苏东坡贬谪黄州四年的生活为横切面，其一生的心路历程，从文学、艺术、美食、情感等维度进行透视，多角度地其生命感悟、精神嬗变和艺术升华的过程，以及对中国传统文化产生的深远影响。同时，辅之以当今最新的研究成果，再现了一个最丰富、最接近本真的苏东坡形象。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 3 - 依次填入划横线部分最恰当的一项是：","options":["关照阐释","记载解说","记录阐述","观照解读"],"answer":"D","explanation":"第一空，横线处所填词语用以修饰“纪录片”，强调其展现了苏东坡的心路历程，C 项“记录”指把所见所闻通过一定的手段保留下来，D 项“观照”指观察审视，均符合文意，保留；A 项“关照”指关心照顾，与“纪录片”搭配不当，排除；B 项“记载”多指用文字叙述，纪录片是影像、声音、文字的集合体，不是简单的文字描绘，排除。第二空，由前文可知，强调纪录片从多个维度透视，对苏东坡的生命感悟进行多角度的分析，使我们更加深入地了解苏东坡，D 项“解读”指分析研究，可以体现出纪录片的作用，符合文意，当选；C 项“阐述”指述说、论述，通过前文可知，纪录片并非简单地述说苏东坡的生命感悟，而是对其进行多角度的分析，故不符合文意，排除。故正确答案为D。【文段出处】纪录片《苏东坡》简介","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-031","paperId":"jx2019","num":31,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"形成有文化特色、有地域特色、可识别的小城镇发展模式，是一个长期的渐进过程。我们应尊重当地实际，、远近结合、量力而行，不能盲目。在模式选择上，可以借鉴国内外小城镇建设的经验，但更重要的是结合自身实际、体现自身特色。依次填入划横线部分最恰当的一项是：","options":["循规蹈矩分庭抗礼","按部就班投闲置散","循序渐进贪大求快","按图索骥急于求成"],"answer":"C","explanation":"第一空，根据文段首句完整语句“是一个长期的渐进过程”的提示，可知接下来整个文段也应围绕“长期”、 “渐进”展开。B 项“按部就班”指按照一定的顺序、步骤进行，C 项“循序渐进”即按照一定顺序逐渐深入或提高，置于此处均符合文意，保留；A 项“循规蹈矩”比喻按规矩行事，或拘泥保守，不敢变通，侧重遵守规矩不逾越，D 项“按图索骥”比喻按照线索去寻找事物，侧重于拘泥成法办事，均无法与“长期”、“渐进”对应，与文意不符，排除。第二空，根据“不能盲目”可知，横线处要体现“短期”、“快速”之意，C 项“贪大求快”对应恰当，当选； B 项“投闲置散”指担当不重要的工作或不担任工作，不予重用，与“短期”、“快速”无关，排除。故正确答案为C。【文段出处】人民网《小城镇建设须注重文化要素》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-032","paperId":"jx2019","num":32,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"古人根据经验编制了许多脍炙人口的农谚，比如“清明前后，种瓜点豆”。不仅是农谚，与二十四节气相关的诗词歌赋也是，比如“蒹葭苍苍，白露为霜”，再比如“清明时节雨纷纷，路上行人欲断魂”。这些诗词歌赋，将二十四节气与天气现象巧妙地结合在一起，具有很好的传播性。依次填入划横线部分最恰当的一项是：","options":["俯拾皆是沉思翰藻","不胜枚举形神兼备","不计其数文采斐然","举不胜举缀玉联珠"],"answer":"B","explanation":"第一空，横线前“也”表示“诗词歌赋”与前面“农谚”并列，前面通过“比如”说明农谚的例子非常多，结合后文“比如······，再比如······”可知，横线处也要体现出诗词歌赋的例子非常多，B 项“不胜枚举”、D 项“举不胜举”都是强调可以举的例子数量特别多，符合文意，保留；A 项“俯拾皆是”形容多而易得、C 项“不计其数”形容极多，与“例子”的对应不如BD 两项更准确，排除。第二空，横线前出现指代词“这些”，此空要体现出诗词歌赋的特性，通过“清明”、“白露”、“路上行人欲断魂”可知，这些诗词不仅体现了节气，还传达了节气中蕴含的内涵， B 项“形神兼备”强调外在物象与内在神韵都具备，符合文意，当选。D 项“缀玉联珠”形容诗文十分优美，没有B 项对应准确，排除。故正确答案为B。【文段出处】《气象科普（176）：时间里的中国智慧—二十四节气》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-033","paperId":"jx2019","num":33,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"城市的文化形象是人们对一个城市的文化的整体认知与印象，主要来源于城市的发展哲学、城市精神等构成的理念识别系统，城市各主体的行为方式所构成的行为识别系统以及公共文化空间、文化景观等构成的视觉识别系统。在新一轮的城市竞争中，城市的文化形象对城市的经济社会发展将起到的作用。依次填入划横线部分最恰当的一项是：","options":["观感撼天震地","气质举足轻重","禀赋振聋发聩","特征醍醐灌顶"],"answer":"B","explanation":"本题可从第二空入手，横线处要体现出的是城市的文化形象对城市经济社会发展的作用很重要，B 项“举足轻重”比喻所处地位重要，一举一动都关系着全局，符合语境，保留；A 项“撼天震地”意为连天地都摇动了，形容力量强，声势大，C 项“振聋发聩”比喻用语言文字唤醒糊涂麻木的人，使他们清醒过来，D 项“醍醐灌顶” 比喻给人灌输智慧，使人得到启发或感悟，均无“作用重要”之意，不符合语境，排除。验证第一空，B 项“气质”用于此处，运用拟人化手法与“城市的文化”搭配得当，意指城市的文化内涵精神等，当选。故正确答案为B。【文段出处】长江日报《以城市文化形象助力城市发展》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-034","paperId":"jx2019","num":34,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"儒学对生活的，体现在每一个细微的环节上，每个观念或者行为都可能有一些潜移默化的印记，有时候可能是比较清晰的一种灌输，有时候则是一种生活态度和行为细节上的顺应。依次填入划横线部分最恰当的一项是：","options":["滋养不自觉","影响不期然","浸润不经意","渗透不留神"],"answer":"C","explanation":"第一空，根据后文“有一些潜移默化的印记”可知，横线处所填词语体现的是儒家思想对生活的感染和影响， B 项“影响”指以间接或无形的方式来作用或改变，C 项“浸润”指逐渐发生作用，置于此处均符合文意，保留； A 项“滋养”指养育、培养，D 项“渗透”比喻某种事物或势力逐渐进入其他方面，这两项用于此处体现不出儒学对生活的感染，排除。第二空，根据文段“有时候可能是······，有时候则是······”可知，横线处所填词语应与“清晰” 相反，C 项“不经意”形容在没意识到、没察觉到的情况下所发生的事情，也就是比较模糊的事情，符合文意，当选；B 项“不期然”常用于“非常不希望这样，但是竟然这样”的语境中，文中并无此意，排除。故正确答案为C。【文段出处】《儒学转型与民间社会的新维度》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-035","paperId":"jx2019","num":35,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"一个艺术家真正的贡献是艺术语言的创新，如果说审美理想的构建是绘画法度和秩序建立的基石，那么绘画秩序的建立则是绘画风格成熟的。风格的形成在于画面所搭建的整体构成必须有的秩序和法则。依次填入划横线部分最恰当的一项是：","options":["途径和谐","标志内在","方向全新","目标稳定"],"answer":"B","explanation":"根据“如果说审美理想的构建是绘画秩序建立的基石”，说明审美理想对绘画法度和秩序的建立很重要，则根据“那么绘画秩序的建立则是绘画风格成熟的”，即绘画秩序的建立则是绘画风格成熟的重要体现，表现，故横线处要表达重要体现之意，B 项“标志”，符合题意，保留。 A 项，“途径”，我们通常说做一件事情的具体解决办法，填入文段应表达为“建立绘画秩序则是绘画风格成熟的途径”，故用法不对，排除。 C、D 两项，文段强调“绘画风格成熟”是目标是追求的方向，而非“绘画秩序的建立”是目标是追求的方向，所以“方向”和“目标”填入文段则与文段意思相悖，排除C、D 两项。代入验证第二空，B 项，“必须有内在的秩序和法则”，搭配恰当，且“内在的秩序和法则”与前文“画面所搭建的整体构成”可以构成对应，当选。故正确答案为B。【文段出处】《寻求工笔新语境》获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 -","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-036","paperId":"jx2019","num":36,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"极光多姿多彩，变化万千，任何彩笔都很难绘出那在严寒的两极空气中嬉戏无常、变幻莫测的炫目之光。在自然界中还没有哪种现象能与之。极光有时出现时间极短，犹如节日的焰火，在空中闪现一下就消失得无影无踪；有时却可以在苍穹之中几个小时；有时像一条彩带，有时像一团火焰，有时像一张五光十色的巨大银幕，仿佛上映一场球幕电影，给人视觉上极美的享受。依次填入划横线部分最恰当的一项是：","options":["匹敌延宕","相较迤逦","媲美辉映","抗衡映照"],"answer":"C","explanation":"第一空，表达没有哪种现象能比得上极光，A 项“匹敌”，指双方地位平等、力量相当，B 项“相较”指相比较，C 项“媲美”美好的程度可以相比，类似比美之意，A、B、C 三项均符合语境，保留；D 项“抗衡”指彼此对抗，对立，与文意不符，排除。第二空，文段搭配极光，C 项“辉映”光辉映照、照耀，搭配恰当，当选；A 项“延宕”指拖延，偏消极，与文段的感情色彩不符，排除；B 项“迤逦”指曲折连绵，通常搭配为“山水迤逦”、“风景迤逦”，与“极光”搭配不当，排除。故正确答案为C。【文段出处】新华网《极光：最奇妙的天象之谜》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-037","paperId":"jx2019","num":37,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"美好的事物人人向往，若是缺少发现的眼睛，它也容易被。某次儿童画展，一位小朋友的作品上有一个洞，评委们好奇地问，这是不是一幅破损的作品。小朋友说，这是进入世外桃源的入口。孩子的答案，耐人寻味。如何发现美的眼睛，是一个需要全社会去回答的课题。依次填入划横线部分最恰当的一项是：","options":["蒙蔽擦拭","遮蔽擦亮","掩饰拂拭","遮掩烛照"],"answer":"B","explanation":"第一空，根据“缺少发现的眼睛”可知，所填词语应体现出美好事物就难以被发现之意。B 项“遮蔽”指遮挡，挡住使看不到，D 项“遮掩”亦有遮挡之意，均可以体现出难以发现之意，保留；A 项“蒙蔽”指隐瞒真相，使人上当，通常与人搭配使用，与“美好事物”搭配不当，排除；C 项“掩饰”设法遮盖、掩盖(真实情况)，不想让他人发现，文段没有设法掩盖之意，与文段语境不符，排除。第二空，搭配“眼睛”，B 项“擦亮”与“眼睛”为固定搭配，当选；D 项“烛照”指照耀，照亮，与“眼睛” 搭配不当，排除。故正确答案为B。【文段出处】《美是有力量的美育是一种刚需》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-038","paperId":"jx2019","num":38,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"打开书本，一股久违了的墨香扑面而来；摩挲纸张，淡淡的凹凸感非常舒服。味觉、视觉、触觉顿时都活泛起来，连脑细胞也显得格外活跃。读累了，就闭眼歇一歇，顺便回味刚读过的情节，思考作者的；看到精彩的描写和精辟的议论，就反复重读、吟咏再三，读到妙处更是。依次填入划横线部分最恰当的一项是：","options":["春秋笔法弹冠相庆","言外之意低头折节","弦外之音额手称庆","微言大义击节赞叹"],"answer":"D","explanation":"本题可从第二空入手，横线处搭配“妙处”且横线前“更”表示递进，程度前轻后重，横线处要体现出读到精妙的地方，不仅要反复去读，还可能由衷赞叹。D 项“击节赞叹”，形容对别人的诗文或艺术等的赞赏，符合文意，保留。 A 项“弹冠相庆”，指官场中一人当了官或升了官，同伙就互相庆贺将有官可做，含贬义，与文段感情色彩不符，排除； B 项“低头折节”，指丧失气节，屈服于他人，与文意不符，排除； C 项“额手称庆”，指庆幸，形容令人称快的事情，文段并无“庆幸”之意，排除。第一空，代入验证，“思考作者的微言大义”，指思考作者在文字中所体现出来的深刻道理，符合文意，当选。故正确答案为D。【文段出处】《我们需要更纯粹的阅读》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-039","paperId":"jx2019","num":39,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"除了口误，笔误同样泄露了潜意识的秘密。短信聊天说到我爸身体不舒服却不去医院检查这一事实时，我想说“我爸就是太固执了”，但我键入的文字竟是“我爸就是太过分了”。那一刻，我突然呆住了。一词之别，却暴露出我内心深处的真实情绪。“固执”只是一种较为客观的，而“过分”却是饱含着情绪的。","options":["判断认识","体现流露","显示暗示","描述表达"],"answer":"D","explanation":"本题可从第二空入手，根据文段信息“笔误同样泄露了潜意识的秘密”、“暴露出我内心深处的真实情绪” 可知，“过分”应是内心深处对于父亲的一种情绪表达，B、D 两项保留。A 项“认识”指人的头脑对客观世界的反映，文段“过分”不是一种认识，而是情绪的表达，与文意不符，排除； C 项“暗示”指用含蓄的言语或示意的举动使人领会，文段没有含蓄示意的意思，排除。第一空，根据“我想说‘我爸就是太固执了’”可知，横线前的“固执”是作者对自己父亲的一种评价，D 项“描述”指描写叙述，符合文意，当选。B 项“体现”指某一事物具体地表现出的某种现象、性质或精神，是一种客观事实的表现，而文段是作者对父亲的评价，非事实的表现，排除。故正确答案为D。【文段出处】《潜意识如何泄露我们的秘密？》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-040","paperId":"jx2019","num":40,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"圈椅是明代家具中最为经典的制作。明代圈椅，造型古朴典雅，线条简洁流畅，制作技艺达到了____的境地。 “天圆地方”是中国人文化中____的宇宙观，不但建筑受其影响，也____到了家具的设计之中。依次填入划横线部分最恰当的一项是：","options":["别有匠心普遍融合","巧夺天工特殊融会","炉火纯青典型融入","入室升堂独特融化"],"answer":"C","explanation":"第一空，根据空前的“最为经典”“古朴典雅”“简洁流畅”，可知此空用来形容制作技艺的水平很高，A 项“别有匠心”，意为具有与众不同的巧妙的构思，侧重的是不同，排除；B 项“巧夺天工”形容技巧的高超， C 项“炉火纯青”比喻学问、技术或办事达到了纯熟完美的地步，D 项“入室升堂”比喻人的学识技艺等方面有高深的造诣，B、C、D 三项均能体现水平之高，保留。第二空，B 项“特殊”，C 项“典型”，D 项“独特”搭配“宇宙观”均可，保留。第三空，横线前后分别对应“宇宙观”、“到了···之中”，意味着这种宇宙观进入到家具设计理念里面，B 项“融会”，融会贯通，侧重点是领会、理解，体现不出宇宙观进入到设计理念之中的意思，排除；D 项“融化”，通常指冰或者是雪由于温度或者是太阳光的照射使它化成水，不符合文段意思，且搭配、对应均不恰当，排除；而C 项“融入”，融合、混入，可以体现出宇宙观进入到设计理念之中的意思，当选。故正确答案为C。【文段出处】《圈椅是明代家具中最为经典的制作》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-041","paperId":"jx2019","num":41,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"关于科学革命的讨论于十七世纪。不过，其时革命尚在地展开，相关讨论的焦点集中在科学的本性，而未有所谓“科学革命史”的理解。到十九世纪，现代科学的基本模式逐渐定型，一些学者便回到现代科学的源头做起了编史和整理工作。依次填入划横线部分最恰当的一项是：","options":["滥觞如火如荼","溯源轰轰烈烈","起源风起云涌","发端方兴未艾"],"answer":"A","explanation":"第一空，A 项“滥觞”、C 项“起源”、D 项“发端”均有表达事物起源和开端的含义，均符合文意，保留； B 项“溯源”后一般不加宾语，常表述为“对······进行溯源”，排除。第二空，搭配“革命”，表达革命如何展开，A 项“如火如荼”形容旺盛、热烈或激烈，可以体现革命开展很热烈，符合文意，当选；C 项“风起云涌”比喻许多事物相继兴起，声势浩大，横线前搭配“革命”一个事物，没有体现许多事物，排除；D 项“方兴未艾”指的是事物正在发展，尚未达到止境或还没有停止，用法错误，可表述为“科学革命方兴未艾”，排除。故正确答案为A。【文段出处】《科学史绝非科学的注脚：科学革命的人文理解》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-042","paperId":"jx2019","num":42,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"蚕蛾往往能巧妙避开捕食者，它们利用旋转的后翅来蝙蝠的声纳系统，从而捕食者对捕食目标的定位。但人们对蚕蛾的进化史以及它们后翅多样性形成的原因科学家对数百个基因组数据库的后翅形状进化过程进行了研究，发现了不同翅型的进化特征。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 4 - 依次填入划横线部分最恰当的一项是：","options":["躲避引导一知半解","折射诱导茫然不解","规避引诱不求甚解","反射误导知之甚少"],"answer":"D","explanation":"本题从第二空入手，根据“蚕蛾······避开捕食者”可知，横线处表达它们能够不被捕食者抓住，D 项“误导”符合文意，保留；A 项“引导”、B 项“诱导”、C 项“引诱”填入文段都是指让捕食者抓住，与文意相悖，排除。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 9 - 第一空代入验证，蚕蛾利用后翅“反射”声纳系统，搭配恰当，符合文意。第三空代入验证，“知之甚少”指对某方面知道得很少，与后文“科学家对数百个基因数据库”对应恰当，当选。故正确答案为D。【文段出处】《后翅形状成蚕蛾巧避捕食者“武器”》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-043","paperId":"jx2019","num":43,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"关于卫生健康创新发展的高峰论坛围绕“创新驱动，健康中国”主题，____国际和国内远程医学、 “ ”等新技术和新产业，探讨“ ”服务新模式、____发展新业态，____人工智能、大数据等在医疗健康领域的创新之路，为努力提升我国整体医疗水平作出贡献。依次填入划横线部分最恰当的一项是：","options":["着笔培养探究","针对养育探查","对标营造探险","着眼培育探寻"],"answer":"D","explanation":"本题可从第三空入手，第三空搭配“创新之路”，A 项“探究”表示深入探索并研究，通常搭配问题，奥秘等，C 项“探险”指去没有人去过或环境恶劣的地方去考察，均不能搭配“创新之路”，排除A、C 两项；B 项“探查”指试图发现某种隐蔽的食物或情况，D 项“探寻”指找寻追求，均可搭配“创新之路”，保留。再看第二空，第二空搭配“新业态”，B 项“养育”，通常搭配养育子女，不可与“新业态”搭配，排除；D 项 “培育”搭配合理，保留。第一空代入验证，搭配合理，当选。故正确答案为D。【文段出处】人民网《远程医疗健康服务大会举行》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-044","paperId":"jx2019","num":44,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"随着装备信息化程度的提升，有别于当初的盲目技术堆砌，目前为航母加装相控阵雷达似乎已成为一种必要的“复古之风”。但与英俄将相控阵雷达部署在舰桥之上不同，无论是美国最初的“企业”号还是最新的“福特” 级航母。他们都将相控阵雷达布置在了舰桥之下，从而保证了舰桥具有足够高度。尽管美国航母舰桥的这种布局会限制相控阵雷达的探测范围，但作为世界航母首强的美国很清楚，相控阵雷达与舰桥哪个更重要。根据这段文字，下列说法不正确的是：","options":["在舰桥高度上，英俄美三国之间有一定差距","英俄美三国都重视在航母上部署相控阵雷达","美国海军对航母的实际作战效能不是很重视","相控阵雷达部署在舰桥下面比在上面更合理"],"answer":"C","explanation":"C 项，“美国海军对航母实际作战效能不是很重视”文段并未提及，无中生有，当选； A 项，根据“与英俄将相控雷阵雷达部署在舰桥之上不同，无论是美国······，从而保证了舰桥具有足够高度。”可知，表述与文意相符，排除； B 项，根据“目前为航母加装相控阵雷达······，与英俄······不同······”可知，表述与文意相符，排除； D 项，根据“他们都将相空阵雷达布置在舰桥之下”、“作为世界航母首强的美国很清楚，相控阵雷达与舰桥哪个更重要”可知，表述与文意相符，排除。本题为选非题，故正确答案为C。【文段出处】《001A 甲板仅差滑跃，舰岛舰桥关乎战力高下》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-045","paperId":"jx2019","num":45,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"一部人类史，就是人与自然、科学与社会的互动史。在漫长的文明进程中，科学曾仅仅是“闲人”的志趣，科学普及无从谈起，人们在“非科学”的禁锢中艰难摸索。随着近现代科学兴起，人类对自然认识不断加深，科学与社会联系日趋紧密，科学普及在人与自然、科学与社会的结合点上顽强生长，科学在人类现代化道路上散发出璀璨的光芒。上述文字主要阐述了：","options":["人与自然、科学与社会的互动极大促进了科学普及","在人类文明进程中，科学普及前进的道路异常艰辛","科学普及应紧密联系社会并且找准结合点和切入点","随着近现代科学兴起，科学普及前景更加灿烂辉煌"],"answer":"A","explanation":"文段首句通过下定义引出“人与自然、科学与社会的互动”的话题，接下来阐述过去“科学普及”所面临的问题，即很少有人谈论。尾句指出在近代科学兴起的背景下，人与自然、科学与社会的联系更紧密，互动更强，根据“科学普及在人与自然、科学与社会的结合点上顽强生长”“散发出璀璨的光芒”可知，文段旨在强调“人与自然、科学与社会的互动”推动了“科学普及”的发展，对应A 项。 B 项，“道路艰辛”对应文段前文“科学普及无从谈起”，是在介绍以前的情况，非重点，排除； C 项，“切入点”无中生有，文段未提及，排除； D 项，“随着近代科学兴起”为背景的内容，非重点，排除。故正确答案为A。【文段出处】科技日报《让科普这只“翅膀”硬起来》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-046","paperId":"jx2019","num":46,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"大数据是科学决策的重要工具，是高精度对未来进行预测的手段。数据是记录人类行为的工具。靠大数据技术对未来做一个预测和参考是人类发展的成果。但是，人际的沟通和交流不该因为大数据技术而遭弃，而过于依赖大数据的预测和推理，放弃人际沟通过程，必然产生人际沟通的弱化，进而影响到人的自由意志。这段文字旨在强调：","options":["大数据是科学决策的重要工具","大数据将发挥越来越重要作用","大数据不应弱化人际沟通","大数据影响人的自由意志"],"answer":"C","explanation":"文段开篇先引出了大数据的概念，并指出大数据带来了好处，后文通过转折关联词“但是”重点强调“人际的沟通和交流不该因为大数据技术而遭弃”，并通过“产生人际沟通的弱化”，“影响到人的自由意志”论证大数据弱化人际沟通后带来的危害，故文段主旨是在强调大数据不应该弱化人际沟通，对应C 项。 A 项，“大数据是科学决策的重要工具”为转折之前的内容，非重点，排除； B 项，“发挥越来越重要作用”无中生有且文段转折后强调的是大数据的危害，感情色彩相悖，排除； D 项，“大数据影响人的自由意志”对应文段解释说明部分，非重点，排除。故正确答案为C。【文段出处】《大数据带来的是天堂还是地狱》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-047","paperId":"jx2019","num":47,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"从人口的空间布局看，城镇化是农村人口向城镇转移，是农民向市民的转变。农民向市民的转变过程，是人的素质的现代化过程。而人的素质的现代化离不开接受现代化的教育。人的教育的现代化是城镇化的基础和支撑。城镇化还意味着人们的就业和生产从农业领域向工业和服务业的转移。人的生产方式的现代化，是城镇化的本质特征，更是人的现代化的本质体现。而支撑人的生产方式现代化的基础则是现代职业教育的普及。这段文字意在强调：","options":["城镇化是人的生产方式的现代化","城镇化是人的素质教育的现代化","城镇化时代的农民需要职业教育","城镇化是进城农民身份的市民化"],"answer":"B","explanation":"文段开篇从人口空间布局的角度解释了城镇化，即农民向市民的转变，接着指出这一转变是人的素质的现代化过程，而素质现代化离不开接受现代化的教育，故文段前半部分强调人的教育的现代化对城镇化很重要。后文指出城镇化还意味着生产方式的现代化，生产方式现代化的基础是现代职业教育的普及，故文段后半部分依然在强调现代教育对于城镇化很重要。故文段重在强调现代化的教育对于城镇化很重要，对应B 项。 A 项“生产方式”，D 项“进城农民身份的市民化”偏离文段核心话题，文段重在强调“现代教育”，排除A、D 两项；C 项“农民”概念缩小，文段强调“人”，且“职业教育”并非文段重点，文段强调“现代教育”，排除。故正确答案为B。【文段出处】《光明日报：建立城镇义务教育资源配置长效机制》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-048","paperId":"jx2019","num":48,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"20 世纪以来，人类对弦的认识，发生了质的变革。弦就是振动，振动就会产生波，说明波构成了丰富多彩的大千世界，这为重新认识“美”提供了思想基础和技术方法。研究表明，自然美与物质的波长（或者频率）存在着深刻的内在联系，物体具有的固有频率与人自身的频率存在耦合关系，“美”是由不同类型波谱的频率与人的相互作用而产生的。根据这段文字，下列说法不正确的是：","options":["对同一个人的美丑认识不同，因审美主体的频率不同所致","阳光、鲜花一定时间内大致不变，因为振动频率没有变化","距离产生美，是因为审美主客体在一定频率范围内共振","见义勇为行为得到社会认可，因为审美主体振动频率一致"],"answer":"D","explanation":"文段开篇介绍了认识美的思想和方法，即通过物体的振动波，接着论述了审美中，物质自身的震动和人自身的频率之间存在相互作用的关系，即当审美客体与审美主体之间耦合的频率相同时，就会产生共振，进而使人觉得“美”。 A 项，根据“‘美’是由不同类型波谱的频率与人的相互作用而产生的”可知，对同样一个审美客体，每个审美主体的美感不同，有的说漂亮，有的说丑，这是由于审美主体的频率不同所致，该项表述正确，排除； B 项，根据“弦就是振动，振动就会产生波，说明波构成了丰富多彩的大千世界”可知，大千世界是由波构成的，即波构成了万物，万物的变化也就意味着波的变化，波的变化也就意味着振动频率的变化，故万物一定时间内不变就是因为其振动频率没有变化，该项表述正确，排除； C 项，根据“物体固有的频率与人自身的频率存在耦合关系”可知，物体在一定的频率范围内，能够和人自身的频率产生共振，产生美感，“距离产生美”就是这个道理。该项表述正确，排除； D 项，文段论述的是审美与主客体之间的震动频率有关，即审美主体与审美客体耦合频率一致，该项中，“见义获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 10 - 勇为”得到社会认可，是由于审美主体（不同的人们）的震动频率一致，且审美主体（不同的人们）与审美客体（见义勇为的行为）频率一致，而D 项仅仅论述了原因中的主体间震动频率一致，故表述错误，当选。本题为选非题，故正确答案为D。【文段出处】《自然美的波谱学原理》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-049","paperId":"jx2019","num":49,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"在智能化无人超市，客人从进门到出门，一举一动都会被数字化，并且被捕捉记录。这些信息回流到云端后，通过算法模型，可以得到许多非常有价值的信息：比如男性顾客和女性顾客各自进店最集中的时间段是什么，哪些商品被拿起又放回去的频次最高等。甚至还能做出预测，比如，传感器感应到进店的女客人很多是穿高跟鞋的，敏锐的老板便会在女鞋区多放些半跟鞋垫和脚踝磨损修复霜。可见，数字化最终目的是实现商品供应链的优化以及店内货架与商品摆放的人性化。这段文字主要介绍：","options":["智能无人零售让超市变得更加聪明、更加善解人意","智能无人零售给线下实体商店的发展前景增添亮色","智能无人零售能够对用户购买行为进行记录与描画","智能无人零售给消费者所带来的更良好的购物体验"],"answer":"A","explanation":"文段开篇引出“智能化无人超市”这一话题，指出其作用即可以得到有价值的信息，并通过“比如”进行具体的解释。文段尾句通过“可见”针对前文内容进行总结，论述智能化无人超市的数字化实现超市商品供应链优化以及超市货架、商品摆放人性化。故文段旨在强调智能化无人超市数字化让超市变得更好，对应A 项。 B 项，“线下实体商店”，无中生有，排除； C 项，“对用户购买行为进行记录”对应文段开篇引入话题部分，结论之前，非重点，排除； D 项，“消费者”非重点，文段尾句重点强调对超市的影响，排除。故正确答案为A。【文段出处】《无人超市是什么？无人超市有什么功能》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-050","paperId":"jx2019","num":50,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"在原始社会，人们唱歌、跳舞，但是不写诗，因为那时候没有文字。同理，史前时代的人也演剧，而且有文字之后多数中国戏剧演员并不识字，戏剧演出主要是以口传心授的方式传承与传播的。然而长时间以来，人们陷入了文字与文献崇拜的陷阱不能自拔，乃至文献考据一直成为文学史、戏剧史研究中最受推崇、最有效接近历史真实的研究方法。如果戏剧史研究领域有“新材料”的话，那一定不仅仅是文献。这段文字主要强调了：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 5 -","options":["戏剧史研究要更新理念并创新研究方法","戏剧史研究要对接传统研究并突破局限","戏剧史研究既要重文献又要重考证考据","戏剧史研究应扩大研究领域和研究方法"],"answer":"A","explanation":"文段开篇先介绍了在原始社会是没有文字的，戏曲传播方式主要是口传心授。接着通过转折词“然而”指出现在对于戏剧史的研究过于局限于文献考据这样的研究方法，文段最后进行补充说明，“如果戏剧史研究领域有 ‘新材料’的话，那一定不仅仅是文献”，加强论述转折之后的观点，即仅局限于文献考据的研究方法是不正确的，故文段重点是围绕“戏剧史研究”和“研究方法”展开论述，旨在强调目前对于戏剧史研究的研究方法太过单一，我们应该更新现在的研究方法，对应A 项。 B 项，“对接传统研究”表述错误，文段明确指出“传统研究方法”是不正确的，排除； C 项，“重考证考据”无中生有，文段没有提及，排除； D 项，“扩大研究领域”表述错误，文段重点强调的是应该扩大研究的方法，排除。故正确答案为A。【文段出处】《百年中国戏剧史》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-051","paperId":"jx2019","num":51,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"通过对海豚间通信联系的深入研究，科学家发现，齐普夫定律和信息论中的熵值概念可以很好地为分析外星信号服务。在接收到地外任何可疑信号后，应该首先用齐普夫定律分析是否存在一定斜率直线特征，如果有某种特征，则证明其并非毫无意义的噪声。然后进行熵值分析，这样可以不必破译信号便知晓其通信的复杂程度。假设截获到的某一可疑信号，不仅在齐普夫坐标系中具有斜率为的直线特征，而且拥有高阶熵值，那么这个信号极有可能就是我们寻找多时的地外文明。对这段文字概括最恰当的一项是：","options":["研究发现海豚间通信联系与外星信号极为相似","如何运用齐普夫定律和熵值概念分析外星信号","如何判断可疑地外信号是否来自于外星文明","如何通过地外信号判断外星文明的智慧程度"],"answer":"B","explanation":"文段开篇引出科学家的研究发现，即齐普夫定律和熵值概念可以分析外星信号服务。后文论述的“接收到可疑信号后，首先用齐普夫定律分析······然后进行熵值分析······”，进行具体详细分析，即齐普夫定律和熵值概念是如何进行分析的。因此文段为总分结构，对应B 项正确。 A 项，“极为相似”无中生有，文段未提及，排除； C 项，“如何判断”表述不明确，文段明确说是用齐普夫定律和熵值概念，且“是否来自外星文明”只是具体分析中的内容，非重点，排除； D 项，“智慧程度”无中生有，文段未提及，排除。故正确答案为B。【文段出处】《天文学家发现11 光年外“奇特信号”：会是外星人吗》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-052","paperId":"jx2019","num":52,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"科学家在100 亿光年外的星系里发现一颗超亮超新星，其爆发于宇宙大爆炸后约35 亿年，正值天文学家所称的“宇宙正午”时期。普通超新星是大质量恒星死亡时发生剧烈爆炸产生的。超亮超新星的亮度比普通超新星高10 到100 倍，目前还不太清楚其形成机制。以往发现的超亮超新星所在星系质量都较小，使科学家认为小星系缺乏重元素的环境有利于产生超亮超新星。此次发现的超亮超新星所在星系是普通的大质量星系，使人重新思考超亮超新星的形成问题。这意味着银河系也可能曾拥有产生超亮超新星的条件。下列说法与原文相符的是：","options":["超亮超新星产生于恒星形成最剧烈的“宇宙正午”时期","小星系缺乏重元素的环境事实上不利于产生超亮超新星","普通的大质量星系可能曾经拥有产生超亮超新星的条件","大质量恒星死亡时发生剧烈爆炸并不能产生超亮超新星"],"answer":"C","explanation":"C 项，根据“此次发现的超亮超新星所在星系是普通的大质量星系，使人重新思考超亮超新星的形成问题” 可知，普通大质量星系可能可以产生超亮超新星，符合文意，当选。 A 项，“恒星形成最剧烈”文段没有提及，且文段只是说一颗超亮超新星爆发于“宇宙正午时期”，选项表述无中生有，排除； B 项，根据“小星系缺乏重元素的环境有利于产生超亮超新星”，选项说“不利于”，与文意相悖，排除； D 项，根据“普通超新星是大质量恒星死亡时发生剧烈爆炸产生的”可知文段没有说过“大质量恒星死亡发生剧烈爆炸”和“超亮超新星”的关系，无中生有，排除。故正确答案为C。【文段出处】《科学家解析“宇宙正午”的超亮超新星》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-053","paperId":"jx2019","num":53,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"互联网深切地变革了媒体的内容生产方式，媒体环境呈现“移动化、社交化、视觉化”三大趋势，在这些趋势影响下所诞生的网络媒体是粉丝经济的基础。传播媒介更为迅速便捷，与粉丝的心理距离更为接近，粉丝的组织化程度大幅提高，这些都使得粉丝能更为顺利地介入偶像生活，甚至可以改变偶像的生活状态和演艺生涯。在电视剧等文化行业中，粉丝流量经济已是行业主推力：大剧单集售价从240-500 万涨至400-1000 万，增长的部分由粉丝来买单，艺人片酬和著作版权费从而暴涨。这段文字意在说明：","options":["粉丝经济基于网络媒体而诞生","传播媒介便捷促进粉丝组织化","偶像的演艺生涯深受粉丝影响","粉丝经济推动文化产业的发展"],"answer":"A","explanation":"文段开篇强调互联网变革了媒体的内容生产方式及其三大趋势，通过指代词“这些趋势”做出总结，强调诞生的网络媒体是粉丝经济的基础。后文通过说明“传播媒介的优势使得粉丝能够介入偶像生活等”，加强论述前文的观点。尾句以“电视剧等文化行业”为例子论述，且列举数据对前文观点进行解释说明。因此文段为总分结构，重点强调网络媒体是粉丝经济的基础，对应A 项。 B 项，“传播媒介、粉丝组织化”属于解释说明的内容，非重点，且“促进”无中生有，文段“传播媒介便捷” 和“粉丝组织化”为并列关系，并非前者促进后者，表述错误，排除； C 项，“偶像的演艺生涯”属于解释说明的内容，非重点，排除； D 项，“文化产业”属于尾句举例的内容，非重点，且缺少主题词“网络媒体”，排除。故正确答案为A。【文段出处】《价值观与亚文化：当我们讨论青年时我们在讨论什么？》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-054","paperId":"jx2019","num":54,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"《白鹿原》以白、鹿两个家族三代人的人生历程为线，从时代变迁的角度呈现了乡土社会生活形态的历史发展轨迹，反映了中国传统宗法文化的坚守与变迁、撕裂与挣扎，也抒写出了诸多个体生命在特定时空和社会关系中的挣扎和痛苦，进而礼赞了我们民族文化传统和道德伦理中永远不灭的善良和温情。而且，作品对此深刻主题的呈现，是艺术的、饱满的、可感的。它以不愠不火、不疾不徐的生活流，融入时代、地域、风情、民俗等多种元素，丰富立体地展现了白鹿原上的本色生活，升腾起人世间的烟火气。根据上述文字，下列说法正确的是：","options":["《白鹿原》演绎出了乡土生活的真实与厚重","《白鹿原》演绎出了个体生命的挣扎和痛苦","《白鹿原》演绎出了传统文化的斑驳与永恒","《白鹿原》演绎出了时代历史的躁动和变迁"],"answer":"A","explanation":"文段向我们介绍了《白鹿原》这部作品呈现了乡土生活形态的发展轨迹，反映了一部分中国传统文化，同时抒写出了个体生命的状态，又礼赞了传统文化，丰富立体地展现了白鹿原的本色生活，故文段围绕《白鹿原》这部作品强调它既包含了很多内容，具有丰富内涵，又还原本色，立体真实。对比择优，优选概括文段主旨的选项，对应A 项。 B 项，“个体生命的挣扎和痛苦”对应文段“也抒写出了诸多个体生命在特定时空和社会关系中的挣扎和痛苦”，是针对文段细节的描述，与A 项相比较A 项概括更加全面，对比择优，故B 项表述片面，排除； C 项，根据“反映了中国传统宗教文化的坚守与变迁、撕裂与挣扎”可知“传统文化”概念范围扩大，且“永恒” 获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 11 - 为永远存在，文段并未提及，故表述无中生有，排除； D 项，“躁动和变迁”，“躁动”即急躁不安，根据“从时代变迁的角度呈现了乡土社会生活形态的历史发展轨迹”可知，“躁动”表述无中生有，排除。故正确答案为A。【文段出处】《<白鹿原>演出时代和人物的质感》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-055","paperId":"jx2019","num":55,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"完美主义者习惯于把各项标准都定得过高而不切实际，受到挫折打击后，变得逃避、拖延、自责而失去行动力。完美主义不仅拖后腿，还可能带来许多心理疾病。由于缺乏一种深刻且始终如一的自尊来源，接受失败的打击对于完美主义者来说尤其困难，而且可能导致一部分人长期抑郁和退缩。完美主义也与社交焦虑和社交恐怖显著相关，因为他们很担心自己是否能给别人留下好印象，容易出现羞怯、自卑、回避行为。完美主义也容易导致强迫症，因为完美主义者对每件事都要求完美无瑕。减少“全或无”的心理倾向，内心会更自在、从容，也更利于进步。这段文字意在说明：","options":["标准过高而且不切实际会损害自尊","羞怯自卑容易使人长期抑郁和退缩","社交焦虑和社交恐怖会导致强迫症","为了心理健康应避免完美主义倾向"],"answer":"D","explanation":"文段首先指出完美主义者在受到挫折打击后，变得逃避、拖延、自责而失去行动力，接着指出完美主义者不仅会拖后腿，还会带来很多心理疾病，后文通过“抑郁”、“社交焦虑”、“社交恐怖”、“强迫症”进行举例说明，尾句给出对策，即减少“全或无”这种完美主义的心理倾向会使人的内心更健康，故文段重在强调应避免完美主义倾向，对应D 项。 A 项“会损害自尊”，B 项“使人长期抑郁和退缩”，C 项“会导致强迫症”均为问题的表述，而文段重在强调解决问题的对策，故排除A、B、C 三项。故正确答案为D。【文段出处】《生命时报》：完美主义是怎样毁掉你的成功的？","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-056","paperId":"jx2019","num":56,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"工匠精神，匠心为本。有没有工匠精神，关键是看有没有一颗安于默默无闻、执着于追求卓越的匠心。树匠心，就要坚守初心、执着专注，秉持赤子之心，摒弃浮躁喧嚣，在本职岗位上坐得住、做得好。怎样才能坐得住、做得好?关键是要做到专心专注、追求至精至善，将产品的每个细节都尽可能做到极致。这段文字意在强调：","options":["育匠人是传承工匠精神的基础","树匠心是弘扬工匠精神的根本","树匠心要坚守初心、执着专注","树匠心需要良好的社会文化环境"],"answer":"C","explanation":"文段首先引入“匠心”这一话题，并指出“匠心”对工匠精神来说是十分重要的。接着给出“树匠心”的对策，即“要坚守初心、执着专注······在本职岗位上坐得住、做得好”。文段尾句对“怎样才能坐得住、做得好”进行补充说明，依然强调“专心专注、追求至精至善”。故文段重点在于“树匠心”的对策，强调“树匠心”要坚守初心、专心专注，对应C 项。A 项“育匠人”在文段中并未提及，无中生有，排除；B 项对应首句，仅是引出话题部分，非重点，排除；D 项“良好的社会文化环境”，无中生有，文段并未提及，排除。故正确答案为C。【文段出处】《人民日报新知新觉：大力弘扬工匠精神》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-057","paperId":"jx2019","num":57,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"敦煌研究院将与外部机构进一步合作，开展敦煌壁画的保护和修复，为这个文化宝藏的永续保存探讨更多可能性。保护和修复也为了更好地传播，依托数字化，“数字敦煌”资源库在2016 年上线。资源库第一期的30 个经典石窟，跨越北魏、西魏、北周、隋、唐等多个时期，其中绝大多数石窟都是未对游客开放的，全球网友只需轻点鼠标，就可以免费360 度漫游洞窟，足不出户便能近距离感受千年的文化。千年敦煌石窟，正借助科技的手段，，焕发出新的生命与活力。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 6 - 填入划横线部分最恰当的一项是：","options":["力求重建用户沉浸式体验","以虚拟世界代替现实场景","突破时间、空间上的限制","促进与传统文化深度融合"],"answer":"C","explanation":"横线在文段末尾，起总结概括的作用。横线所在句子意在表明敦煌石窟正在借助科技的手段解决了某些问题，使石窟重新焕发活力。文段开篇介绍敦煌研究院与外部机构合作探讨敦煌文化可永续保存，接着介绍依托数字化，全球网友只需轻点鼠标便可以漫游石窟文化，无需远行便可感受千年前的文化。由此可知，科技手段解决的是时间和空间上的限制，对应C 项。 A 项“重建用户沉浸式体验”、B 项“虚拟世界代替现实场景”、D 项“与传统文化深度融合”均无中生有，排除。故正确答案为C。【文段出处】光明网《不再高冷：科技让博物馆有张现代的脸》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-058","paperId":"jx2019","num":58,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"在今天的社会文化实践中，我们更要关注当下的传统文化热是否真正触及了传统文化的人文精神实质，是否真正提升了人们的精神境界。一般而言，文化的形式要自觉为文化的内容服务，如果忽略了文化的内容，尤其是忽略了对贯穿其中的人文精神的追求，就必然会走入歧途，背离我们弘扬传统文化的初衷。文化是活的，不能做简单的固化处理，更不能只注重形式而忽略对其内涵的传承。鉴于此，我们必须。填入划横线部分最恰当的一项是：","options":["改变过于强调传统文化的符号性的做法","注意纠正传统文化弘扬中的形式化倾向","以实用心态凸显传统文化的工具性价值","借助现代电子技术手段来弘扬传统文化"],"answer":"B","explanation":"横线出现在文段结尾，又根据“鉴于此，我们必须······”说明横线处需要根据上文给对策。分析上文，文段开头通过“在今天的社会文化实践中······”引出背景内容，后文指出“如果忽略了文化的内容，就会误入歧途，背离初衷”说明不能只重视形式一定要重视文化的内容，结尾又通过“文化是活的，更不能只注重形式而忽略对其内涵的传承”再次强调传统文化不能只注重形式而忽略内容。所以，基于上文的对策应该是传统文化弘扬不能只重视形式而忽略内容，对应选项B。 A 项，“符号性”文段没有提到，无中生有，排除； C 项，文段没有提到“实用心态”，也没有提到“传统文化工具性”，无中生有，排除； D 项，文段中没有提到“电子技术手段”，属于无中生有，排除。故正确答案为B。【文段出处】《弘扬传统文化应注重人文精神的承传》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-059","paperId":"jx2019","num":59,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"将不能量化的诗歌（以及纯文学）评价标准和人工智能的算法标准拼接在一起，本来就是一件不伦不类的事。人工智能在科学研究、生产劳动等方面的贡献，足以证明其本领之强，。人类也完全没必要拿自己的优势去跟人工智能的缺点比较，即使科技再发达，想必在未来很长的一段时间内，诗歌与文学的世界依然是人类情感和灵魂最佳的栖息地，守卫好我们的心灵家园，依然要靠人类自身的智慧与创造力。填入划横线部分最恰当的一项是：","options":["却不能弥补人类智慧在诗歌创作上的缺陷","完全可以取代人类智慧自主开展诗歌创作","没必要和人类智慧在诗歌创作上一决高下","毫无疑问将能够实现诗歌评价标准的量化"],"answer":"C","explanation":"本题为语句填空题，横线在中间，联系前后文把握话题的一致性。横线前阐述将诗歌评价标准与人工智能算法标准拼接，人工智能在科学方面存在的优势，结合横线后，介绍人类也没必要拿自己的优势去跟人工智能的缺点去相比，后文详细解释诗歌与文学同人类的关系，指明人类的智慧与创造力的优势，依据横线后句子出现“也”，横线处应该与后文形成并列关系，即人工智能没必要和人类的优势去比较，对应C 项。 A 项，“人类智慧在诗歌创作上的缺陷”属于无中生有，排除； B 项，根据后文，人类在诗歌创作领域是有优势的，因此人工智能不能取代，表述错误，排除； D 项，根据前文可知，诗歌评价标准是不能量化的，与文意相悖，排除。故正确答案为C。【文段出处】《光明网：人工智能写诗与纯文学无关》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-060","paperId":"jx2019","num":60,"year":2019,"region":"江西","module":"言语理解与表达","sub":"逻辑填空","stem":"手机可能使一个孩子深陷其中不能自拔。近日，看到一个“标题党”：，表达了人们的深深忧虑。因此，中小学都将大力治理学生手机问题纳入重难点，很多学校校规中明确规定禁止学生带手机进校园上课堂，违者将受重罚。即便如此，学生携带手机的现象还是依然呈现蔓延之势，拥有手机的学生越来越低龄化。填入划横线部分最恰当的一项是：","options":["未来让手机给毁了","别让手机危害孩子","恐怖的手机危害","手机，身边的炸弹"],"answer":"A","explanation":"横线出现在文段中间，需要结合前后文，且横线处前提到“标题党”，说明所填内容符合“标题党”特征，有夸大的成分且能够吸引大家眼球，以及通过连接的句子能够表达“人们的深深忧虑”。文段开篇的论述强调手机对孩子有危害，后文通过“因此”做总结，指出学校治理学生携带手机进入学校，但是仍然不能杜绝此类现象，且趋势还在继续蔓延。概括前后文语义即“手机有危害、携带手机仍是趋势”对应A 项，且A 项表述属于“标题党”的特征。 B 项，仅提到手机会危害孩子，文段总结中强调“携带手机呈现蔓延之势”，选项未体现，表述片面，排除； C 项，仅提到手机有危害，未提到未来的趋势，表述片面，排除； D 项，“身边的炸弹”强调手机具有的危害，未提到未来的趋势，表述片面，排除。故正确答案为A 项。【文段出处】《孩子上网尤其需要家庭启蒙教育》获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 12 -","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-061","paperId":"jx2019","num":61,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"为了帮助贫困地区脱贫，长期以来，社会各界以多种形式开展帮扶，扶贫思路更加清晰，扶贫手段更加多样，文化扶贫、旅游扶贫、电商扶贫等新方式效果显著，脱贫攻坚实现换挡提速。但一些尚未脱贫的地区，因为自然条件恶劣，发展脱贫产业难度较大。要啃下扶贫的“硬骨头”，还需打好科技牌。最适合做这段文字标题的是：","options":["打好脱贫攻坚科技牌","啃下扶贫的“硬骨头”","选好脱贫攻坚新方式","脱贫攻坚实现换挡提速"],"answer":"A","explanation":"文段开篇指出“社会各界以多种形式开展帮扶，脱贫效果显著，脱贫攻坚实现换挡提速”，即脱贫攻坚取得成效，然后文段通过转折词“但”强调在一些尚未脱贫的地区，难度较大，即存在问题，随后出现了对策标志词 “要”，引出对策。故整个文段重点是对策，强调扶贫要通过科技牌，对应A 项。 B 项，没有提及文段重点强调的“科技”这样一种扶贫的对策，偏离文段重点，排除； C 项，“新方式”表述不明确，排除； D 项，“脱贫攻坚实现换挡提速”是转折之前的内容，转折之前内容非重点，排除。故正确答案为A。【文段出处】《人民日报纵横：打好脱贫攻坚科技牌》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-062","paperId":"jx2019","num":62,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"传统家训家规是我国古代以家庭为范围的道德教育形式，也是中华道德文化传承的一种方式。我国历史上流传下来的家训家规，始作者多是文化名人或著名官宦，社会影响较为广泛。这些家训家规的功能远远超出对本家族的教育作用，而成为社会教育的一种独特形式，为社会提供了家庭教育范本和楷模。尤其是这些家训家规对其家族的繁衍发展起到了重要保障作用，容易引起后世更多人的关注和效法，从而使得这些家族内的训规成为道德教育的普遍教材。这段文字意在说明：","options":["传统家训家规的社会功能","传统家训家规的历史渊源","传统家训家规的历史影响","传统家训家规的教育作用"],"answer":"A","explanation":"文段首先提出传统家训家规这一话题，接着指出家训家规社会影响广泛，后文进一步解释说明了传统家训家规对于社会的功能，故文段为总分结构，重点强调传统家训家规对整个社会的意义和作用，对应A 项。 B 项“历史渊源”指与历史的联系，C 项“历史影响”指过去产生的影响，非文段重点，文段重在强调传统家训家规对社会的作用，排除B、C 两项；D 项“教育作用”，并未指出是对社会的作用，故偏离文段中心，排除。故正确答案为A。【文段出处】《人民日报人民要论：从传统家训家规中汲取优良家风滋养》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-063","paperId":"jx2019","num":63,"year":2019,"region":"江西","module":"言语理解与表达","sub":"片段阅读","stem":"当前，我国科技事业实现了历史性、整体性、格局性重大变化，重大创新成果竞相涌现，一些前沿方向开始进入并行、领跑阶段。但也应看到，我国科技领域仍然存在一些亟待解决的问题，关键核心技术受制于人的局面没有得到根本性改变。现在，我们迎来了世界新一轮科技革命和产业变革同我国转变发展方式的历史性交汇期，科技创新角逐空前激烈，只有努力实现关键核心技术自主可控，才能抓住千载难逢的历史机遇，有力支撑世界科技强国建设，真正发挥创新引领发展的第一动力作用。最适合做这段文字标题的是：","options":["努力拼搏，获取关键核心技术","把关键核心技术掌握在自己手中","重视激励原始创新和核心技术研发","发挥创新引领作用，掌握关键核心技术"],"answer":"B","explanation":"文段首句为背景引入，介绍了我国科技事业的发展状况。接下来通过转折词“但”引出了科技领域存在的问题。尾句通过必要条件“只有······才”给出对策，意在强调“努力实现关键核心技术自主可控”的重要性。本题为对策类文段，故解决问题的对策是重点，对应B 项。 A 项，“获取”，表述不明确，文段强调的不仅是“取得”，更重要的是要做到“自主可控”，排除； C 项，“激励原始创新”无中生有，排除； D 项，文段只强调需要“实现关键技术自主可控”，“创新引领作用”属于对策带来的作用或有利影响，而非对策本身，非重点，排除。故正确答案为B。【文段出处】《把关键核心技术掌握在自己手中》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-064","paperId":"jx2019","num":64,"year":2019,"region":"江西","module":"言语理解与表达","sub":"语句表达","stem":"①透过中华文化发展史，不难发现，中华文化在几千年的演进过程中，虽历经劫难，但每次都能发扬光大、传承至今 ②根据英国著名学者汤因比的著述，人类文明史上曾经存在26 个文明形态 ③可见，中华民族传统文化历久弥新的关键就在于其中蕴含着能够保持旺盛生命力的最根本的精神基因 ④这种稳定与新生的辩证统一，是中华优秀传统文化的生命力所在 ⑤中华民族最根本的精神基因深藏于中华民族文化的深层结构之中，具有相对恒久的稳定性，并且能够在新的时代条件下发出新的光彩 ⑥其他古老文明或中断或湮灭，唯有中华文化体系没有中断而延续至今将以上6 个句子重新排列，语序正确的是：","options":["③①②⑥⑤④","①②⑤④⑥③","⑤④①②⑥③","②⑥①③⑤④"],"answer":"C","explanation":"首先，对比首句，①句、②句、⑤句均可作为话题引入句，而③句中出现总结词“可见”，不适合做首句，排除A 项；观察③句可知，③句在论述“中华民族传统文化历久弥新的关键”，即结论，故③句在形式上和内容上均适合做尾句，排除D 项；对比B、C 两项，区别在于⑤④与①②的顺序，⑤句和④句提出中华民族的精神是 “稳定与新生的辩证统一”，是“有生命力”的，①句、②句、⑥句是列举“中华文化史”、“英国著名学者汤因比的著述”、“其他古老文明”的例子论述中华文化如何避开劫难持续具有生命力的，故①②⑥属于解释说明应捆绑并在⑤④后。故正确答案为C。【文段出处】《中华民族最根本的精神基因》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-065","paperId":"jx2019","num":65,"year":2019,"region":"江西","module":"言语理解与表达","sub":"语句表达","stem":"①但实际调查的匮乏，并不足以令那此笃定“甜食可以治愈”的人们完全信服 ②“吃甜食会让人心情变好”似乎是人们口耳相传的一条“真理” ③但迄今还没有任何证据支持容易受抑郁症影响的人倾向于增加糖分摄入量的假设 ④即高糖分的饮食全部或部分源于人们原本就糟糕的心理状态获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 7 - ⑤而换个角度说，心理疾病是否也可能导致人们摄人更多的糖分 ⑥然而已经有多项研究表明，糖分摄入水平越高，抑郁症患病可能性越大将以上6 个句子重新排列，语序正确的是：","options":["③④⑥⑤①②","③⑥④⑤①②","②⑥①③④⑤","②⑥①⑤④③"],"answer":"D","explanation":"对比选项，判断首句，②指出人们相信“吃甜食会让人心情变好”，③出现转折词“但”不适合做首句，排除A、B 两项。对比C、D 两项，继续观察文段，寻找线索。③中出现“但”转折关联词，根据关联词捆绑，对比③前接①还是 ④，③“没有任何证据支持······”即没有证据说明抑郁症和糖分之间的关系，①“不足以······令人信服”是不认同甜食与抑郁症的关系，故①③观点一致，构不成转折关系，排除C 项，验证D 项，④“高糖分饮食源于糟糕的心理状态”认同抑郁症和糖分之间的关系，④③构成转折关系，故对应D 项。故正确答案为D。【文段出处】《爱吃糖的人更易抑郁，吃糖好多心理暗示》","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-066","paperId":"jx2019","num":66,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"小张、小李和小王三人以擂台形式打乒乓球，每局2 人对打，输的人下一局轮空。半天下来，小张共打了6 局，小王共打了9 局，而小李轮空了4 局。那么，小李一共打了多少局？","options":["5 局","7 局","9 局","11 局"],"answer":"B","explanation":"小李轮空4 局，说明小王和小张打了4 局。小王共打9 局，则小王和小李打了9-4=5 局。小张共打6 局，则小张和小李打了6-4=2 局，所以小李共打5+2=7 局。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-067","paperId":"jx2019","num":67,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"太阳高度角是太阳光的入射方向和地平面之间的夹角。在正午时，太阳高度角为，为纬度，为太阳赤纬。已知小陈的身高为180 厘米，他所在地的纬度为，当日太阳赤纬为。那么，在正午时他的影子长度约为：","options":["60 厘米","90 厘米","104 厘米","208 厘米"],"answer":"C","explanation":"根据题干，正午时太阳高度角为。如下图所示，在中，AC 代表小陈的身高，故为180 厘米。AB 代表太阳光，由于正午太阳高度角为，故为。为，BC 即为影子的长度。根据直角三角形三边关系可知，，因此，则。故正确答案为C。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 13 -","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-068","paperId":"jx2019","num":68,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某楼盘的地下停车位，第一次开盘时平均价格为15 万元/个；第二次开盘时，车位的销售量增加了一倍、销售额增加了。那么，第二次开盘的车位平均价格为：","options":["10 万元/个","11 万元/个","12 万元/个","13 万元/个"],"answer":"C","explanation":"赋值第一次车位销售量为1，则。根据题意，第二次开盘时，销售量增加了一倍、销售额增加了，可得第二次销售量为，销售额为，则第二次平均价格为。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-069","paperId":"jx2019","num":69,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"林先生要将从故乡带回的一包泥土分成小包装送给占其朋友总数的老年朋友。在分包过程中发现，如果每包200 克，则少500 克；如果每包150 克，则多250 克。那么，林先生的朋友共有多少人?","options":["15","30","50","100"],"answer":"C","explanation":"设林先生的老年朋友为人，根据分包过程可得：，解得人。因老年朋友占朋友总数的，则林先生的朋友总共有：人。故正确答案为C。注：本题并未说明每人分1 包，不够严谨；但是不按每人1 包则有无数种可能，无法求解。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-070","paperId":"jx2019","num":70,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"甲、乙两个工程队共同参与一项建设工程。原计划由甲队单独施工30 天完成该项工程三分之一后，乙队加入，两队同时再施工15 天完成该项工程。由于甲队临时有别的业务，其参加施工的时间不能超过36 天，那么为全部完成该项工程，乙队至少要施工多少天？","options":["18","20","24","30"],"answer":"A","explanation":"根据题意可得，甲队单独完成这项工程需要天，则，得，则甲、乙效率之比为，赋值甲的效率为1，乙的效率为3，工程总量为。根据问题，乙队施工天数尽可能少，则甲队施工天数应尽可能多，其最多可为36 天，则乙队施工天数至少天。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-071","paperId":"jx2019","num":71,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"汽车的经济时速是指汽车最省油的行驶速度。据某汽车公司测算，该公司一款新型汽车以每小时公里的速度行驶时，其每公里耗油量公式为（为汽车速度，为耗油量）。那么该款汽车在公里/小时速度区间的经济时速为：","options":["80 公里/小时","90 公里/小时","100 公里/小时","105 公里/小时"],"answer":"D","explanation":"根据每公里耗油公式：，当越大时，越小，即速度越大，耗油越小。则在速度区间公里/小时中经济时速应取最大值，则选择选项中最大值105 公里/小时。故正确答案为D。备注1：在公里/小时速度区间中，根据每公里耗油公式，速度越大，耗油越少，则经济时速应取最大值 110 公里/小时，但结合选项只能选择最大值105 公里/小时。备注2：本题所给条件为“每公里耗油量公式”，则经济速度应为——当每公里耗油量最少时，汽车行驶的速度；有同学设行驶速度为，则单位时间行驶路程，则单位时间耗油，当且仅当时等号成立，解得。但是此解为“使单位时间耗油最少的速度”与题干所给条件“每公里耗油”以及所求“每公里耗油最少”不符。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-072","paperId":"jx2019","num":72,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"因装修需要，拟在边长为2m 的正方形浴室正中央处安装圆形淋浴喷头，喷头直径为10cm，出水喷射角度与垂直方向的最大夹角为。假设不考虑重力影响，要使喷头喷射到的面积能完全覆盖浴室，而且考虑施工实际，只有下列四个选项可选，则在满足设计要求的情况下，喷头底面距离地面可供选择的最低高度是多少？（）","options":["185cm","190cm","195cm","200cm"],"answer":"B","explanation":"根据题干要求“要使喷头喷射到的面积能完全覆盖浴室”，即。设喷头底面距离地面高度为h cm，由“出水喷射角度与垂直方向的最大夹角为 ”，可知喷头外延能够喷射的最远距离l 为 cm。已知“喷头直径为10cm”可知喷头半径r 为5cm，喷头喷射的总半径。则喷头喷射的面积= ，正方形浴室的面积= 。由，解得。结合题干要求“考虑施工实际，只有下列四个选项可选”，则要选择略大于187 的选项，B 项符合。获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 14 - 故正确答案为B。备注：这道题目本质上是一道错题，命题人在命题过程中只考虑了面积大小关系，但从实际情况来看，圆形喷头喷射的距离会打在墙壁上，但房间的四角喷射不到。而此题如果以喷射半径覆盖房间，，进行计算，，没有答案。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-073","paperId":"jx2019","num":73,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某河道由于淤泥堆积影响到船只航行安全，现由工程队使用挖沙机进行清淤工作，清淤时上游河水又会带来新的泥沙。若使用1 台挖沙机300 天可完成清淤工作，使用2 台挖沙机100 天可完成清淤工作。为了尽快让河道恢复使用，上级部门要求工程队25 天内完成河道的全部清淤工作，那么工程队至少要有多少台挖沙机同时工作？","options":["4","5","6","7"],"answer":"D","explanation":"假定每天每台挖沙机效率为1，每天新增泥沙的量为，原有泥沙量为。由于1 台挖沙机300 天可完成清淤工作，可得：；由于2 台挖沙机100 天可完成清淤工作，可得：。两式联立，解得，。若要求工程队25 天内完成河道的全部清淤工作，此时，设所需的挖沙机台数为，则有，解得，至少需要7 台挖沙机同时工作。故正确答案为D。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-074","paperId":"jx2019","num":74,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"甲、乙两部参加军事演习。甲部从大本营以60 千米/小时的速度往西行进，乙部晚半小时由大本营往东行进，速度比甲部慢。两部同时接到军令紧急集合，集合地位于大本营正北某处。此时两部所在位置与集合地恰好构成有一角为30 度的直角三角形。若两部同时调整方向往集合地行军，且保持速度不变，则可同时到达集合地。问集合地与大本营的距离约为多少千米？","options":["38","41","44","48"],"answer":"B","explanation":"根据题意可得右图，因甲部速度大于乙部且早出发半小时，故，则，。两部同时调整方向可同时到达集合地C，则甲部、乙部速度之比为，则乙部速度为千米/小时。设乙部从B 点到C 点行驶时间为，则，，在直角三角形OCB 中，，则，同理可得。因甲部比乙部早出发半小时即0.5 小时，则，解得小时。，即约为41 千米。故正确答案为B。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-076","paperId":"jx2019","num":76,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"小王在商店消费了90 元，口袋里只有1 张50 元、4 张20 元、8 张10 元的钞票，他共有几种付款方式，可以使店家不用找零钱?","options":["5","6","7","8"],"answer":"C","explanation":"根据题干条件分析，付款方式可包含使用50 元与不使用50 元两种情况。对情况进行枚举可得：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 15 - 可得共有7 种付款方式，可以使店家不用找零钱。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-078","paperId":"jx2019","num":78,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"一位学生在距离热气球100 米处观看它起飞。在热气球起飞后，学生注意到热气球顶部从他的仰角上升到，再从上升到的位置分别用了11 秒和17 秒。则前后两段时间热气球平均上升速度的比值约为：获取试卷更新，请关注公众号：gwyeasy（公务员考试挺简单）,一个上岸考生分享经验和答疑的平台。 - 8 -","options":["0.89","0.91","1.12","1.10"],"answer":"A","explanation":"如图所示：当仰角为时，在中，米；当仰角为时，在中，米；当仰角为时，在中，米。两段时间上升的距离分别为米，米，则两段时间平均上升速度比为。故正确答案为A。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-080","paperId":"jx2019","num":80,"year":2019,"region":"江西","module":"数量关系","sub":"数学运算","stem":"某次田径运动会中，选手参加各单项比赛计入所在团体总分的规则为：一等奖得9 分，二等奖得5 分，三等奖得2 分。甲队共有10 位选手参赛，均获奖。现知甲队最后总分为61 分，问该队最多有几位选手获得一等奖？","options":["3","4","5","6"],"answer":"C","explanation":"设获得一等奖、二等奖、三等奖的人数分别为、、，根据题意得：，，整理两式，消去得：。问获得一等奖人数最多，考虑从大到小代入：代入D 项，若，代入，为负且不是整数，排除；代入C 项，若，代入，解得，符合题意。故正确答案为C。","material":"","source":"2019年江西省公务员考试《行测》真题（县级以上）"},{"id":"jx2019-081","paperId":"jx2019","num":81,"year":2019,"region":"江西","module":"判断推理","sub":"图形推理","stem":"把下面的图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：","options":["①③⑥，②④⑤","①③⑤，②④⑥","①④⑥，②③⑤","①②④，③⑤⑥"],"answer":"C","explanation":"元素组成不同，优先考虑属性规律。对称、曲直均
